// ─── Auto-score helpers ────────────────────────────────────────────────────
function kpiLocalDateStr(ts) {
  // Returns YYYY-MM-DD in local timezone from a timestamp or ISO string
  const d = new Date(ts);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
// Returns { score, overflow } where score is punctuality KPI clamped to [0,110],
// and overflow is any excess deduction that couldn't be absorbed (spills into total KPI).
// Logic: start at 100, each shift adds/deducts based on arrival time.
//   early ≥30 min: +10 | early 15–30 min: +5 | on time (≤10 min): 0 | late 11–120 min: −20 | late >120 min: −50 | no stamp: −100 | substitute cover: +50
function kpiPunctualityScore(userId, cutoff) {
  const bot      = state.branch_opening_times || {};
  const today    = new Date();
  const todayStr = localISODate(today);

  const stampMap = {};
  (state.signin_stamps||[]).filter(s => s.by === userId).forEach(s => {
    const key = localISODate(new Date(s.at)) + "|" + (s.branch||"maadi").toLowerCase();
    if (!stampMap[key]) stampMap[key] = s;
  });

  let delta    = 0;
  let shiftsFound = 0;
  const cutoffDate = new Date(cutoff);

  for (let d = new Date(cutoffDate); ; d.setDate(d.getDate() + 1)) {
    const dateStr = localISODate(d);
    if (dateStr >= todayStr) break;
    const dayIndex = (d.getDay() + 6) % 7;
    const dayKey   = ROSTER_DAYS[dayIndex];
    const weekOf   = mondayOf(dateStr);
    const entries  = (state.rosters||[]).filter(r =>
      r.week_of === weekOf && r.day === dayKey &&
      r.shift === "morning" && r.user_id === userId
    );
    for (const entry of entries) {
      shiftsFound++;
      const branch  = (entry.branch||"maadi").toLowerCase();
      const openStr = ((bot[branch]||{})["morning"]) || (branch === "maadi" ? "10:00" : "12:00");
      const openMs  = new Date(dateStr + "T" + openStr + ":00").getTime();
      const st      = stampMap[dateStr + "|" + branch];
      if (!st) {
        delta -= 100;
      } else {
        const diff = Math.round((new Date(st.at).getTime() - openMs) / 60000);
        if      (diff <= -30) delta += 10;
        else if (diff <= -15) delta +=  5;
        else if (diff <=  10) delta +=  0;  // grace: ≤10 min late = no KPI hit
        else if (diff <= 120) delta -= 20;
        else                  delta -= 50;
      }
    }
  }

  // Substitute cover bonus: +50 per shift covered for someone else
  const subCovers = (state.signin_stamps||[]).filter(s =>
    s.by === userId && s.substitute_cover && new Date(s.at).getTime() >= cutoff
  );
  delta += subCovers.length * 50;

  // Fallback when no roster data: score only from submitted stamps, no missing-stamp penalty
  if (shiftsFound === 0) {
    const stamps = (state.signin_stamps||[]).filter(s => s.by === userId && new Date(s.at).getTime() >= cutoff);
    if (!stamps.length) return null;
    stamps.forEach(s => {
      try {
        const submitTime  = new Date(s.at);
        const branch      = (s.branch||"maadi").toLowerCase();
        const openStr     = ((bot[branch]||{})["morning"]) || (branch === "maadi" ? "10:00" : "12:00");
        const scheduledMs = new Date(localISODate(submitTime) + "T" + openStr + ":00").getTime();
        const diff        = Math.round((submitTime.getTime() - scheduledMs) / 60000);
        if      (diff <= -30) delta += 10;
        else if (diff <= -15) delta +=  5;
        else if (diff <=  10) delta +=  0;
        else if (diff <= 120) delta -= 20;
        else                  delta -= 50;
      } catch(e) {}
    });
  }

  const raw      = 100 + delta;
  const score    = Math.min(110, Math.max(0, raw));
  const overflow = Math.max(0, -raw); // excess deduction beyond 0 → spills into total KPI
  return { score, overflow };
}
// Applies 3-day deductions for morning-shift baristas who submitted no stamp on a given date.
// Returns the number of new penalties created.
function applyMissingStampPenalties(dateStr, appliedBy) {
  const dayIndex = (new Date(dateStr + "T12:00:00").getDay() + 6) % 7;
  const dayKey   = ROSTER_DAYS[dayIndex];
  const weekOf   = mondayOf(dateStr);
  const morning  = (state.rosters||[]).filter(r =>
    r.week_of === weekOf && r.day === dayKey && r.shift === "morning"
  );
  if (!morning.length) return 0;
  state.penalties = state.penalties || [];
  state.salary_config = state.salary_config || {};
  let created = 0;
  for (const entry of morning) {
    const uid    = entry.user_id;
    const branch = (entry.branch||"").toLowerCase();
    const user   = (state.users||[]).find(u => u.id === uid);
    if (!user) continue;
    // Check for existing stamp that day+branch
    const hasStamp = (state.signin_stamps||[]).some(s =>
      s.by === uid && localISODate(new Date(s.at)) === dateStr &&
      (s.branch||"").toLowerCase() === branch
    );
    if (hasStamp) continue;
    // Check no duplicate auto_no_stamp penalty for same user+date
    const already = state.penalties.find(p =>
      p.auto_no_stamp && p.user_id === uid && p.date === dateStr
    );
    if (already) continue;
    const salary = getSalaryForMonth(uid, dateStr.slice(0, 7));
    const amount = penaltyAmount("three_days", salary);
    state.penalties.push({
      id: uuid(), at: now(), by: appliedBy.by, by_name: appliedBy.by_name,
      user_id: uid, barista: user.name,
      kind: "three_days", reason: "no_show",
      date: dateStr, month: dateStr.slice(0, 7), branch,
      amount,
      note: `Auto: no sign-in stamp — 3 days deducted`,
      auto_no_stamp: true,
    });
    notifyLeadershipRole("weekly_schedule",
      `Missing stamp — ${user.name}`,
      `No sign-in recorded for ${dateStr} at ${branch}. 3-day deduction applied.`
    );
    created++;
  }
  if (created) saveState();
  return created;
}

function kpiWasteScore(userId, cutoff) {
  const entries = (state.waste||[]).filter(w => w.by === userId && new Date(w.at).getTime() >= cutoff);
  // Group submitted entries by calendar day
  const byDay = {};
  entries.forEach(w => {
    const d = kpiLocalDateStr(new Date(w.at));
    if (!byDay[d]) byDay[d] = [];
    byDay[d].push(w);
  });

  // Find all morning shift days for this user in the cutoff window
  const today = localISODate(new Date());
  const bot   = state.branch_opening_times || {};
  const morningShiftDays = new Set();
  for (let d = new Date(cutoff); ; d.setDate(d.getDate() + 1)) {
    const dateStr = localISODate(d);
    if (dateStr >= today) break;
    const dayIndex = (d.getDay() + 6) % 7;
    const dayKey   = ROSTER_DAYS[dayIndex];
    const weekOf   = mondayOf(dateStr);
    const onMorning = (state.rosters||[]).some(r =>
      r.week_of === weekOf && r.day === dayKey && r.shift === "morning" && r.user_id === userId
    );
    if (onMorning) morningShiftDays.add(dateStr);
  }

  // If no shift days and no entries, no score yet
  if (!morningShiftDays.size && !Object.keys(byDay).length) return null;

  const dayScores = [];

  // Score days with entries
  Object.entries(byDay).forEach(([dateStr, items]) => {
    if (items.every(i => i.item_name === "— No waste —")) {
      dayScores.push({ date: dateStr, score: 100 });
      return;
    }
    let score = 100;
    items.filter(w => w.item_name !== "— No waste —").forEach(w => {
      const name = (w.item_name||"").toLowerCase();
      const qty  = w.qty_canonical || 0;
      const reason = (w.reason||"").toLowerCase();
      const isCal = reason.includes("training") || reason.includes("calibr");
      if (name.includes("espresso")||name.includes("shot")||name.includes("coffee")||name.includes("bean")) {
        score -= isCal ? qty*2 : qty*6;
      } else if (name.includes("milk")||name.includes("oat")||name.includes("almond")||name.includes("soy")||name.includes("cream")) {
        const isExpiry = reason.includes("منتهي") || reason.includes("expir");
        if (!isExpiry) {
          const ml = (w.unit==="L"||(w.unit||"").toLowerCase()==="litre") ? qty*1000 : qty;
          score -= isCal ? Math.floor(ml/200)*3 : Math.floor(ml/100)*5;
        }
      } else {
        score -= isCal ? qty*1 : qty*3;
      }
    });
    dayScores.push({ date: dateStr, score: Math.max(Math.round(score), 10) });
  });

  // Penalise morning shift days with no waste entry at all (−10 per missed day)
  morningShiftDays.forEach(dateStr => {
    if (!byDay[dateStr]) dayScores.push({ date: dateStr, score: 90 });
  });

  if (!dayScores.length) return null;
  return Math.round(dayScores.reduce((a,b) => a + b.score, 0) / dayScores.length);
}
function kpiCleanlinessScore(userId, cutoff) {
  const logs = (state.cleaning_logs||[]).filter(l => l.by === userId && new Date(l.at).getTime() >= cutoff);
  if (!logs.length) return null;
  const scores = logs.map(l => l.checklist_score != null ? l.checklist_score : 65); // legacy logs without checklist get 65
  return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
}
// Auto-calculates Coffee Craft score from customer reviews where the customer
// selected "coffee" as the standout. Uses star rating × 20 to produce 0–100.
// Falls back to manual entry if no matching reviews exist.
function kpiCraftScore(userId, cutoff) {
  const user     = (state.users||[]).find(u => u.id === userId);
  const userName = (user?.name || "").toLowerCase().trim();
  const feedbacks = (state.customer_feedback||[]).filter(f => {
    const byId   = f.user_id === userId || f.barista_id === userId;
    const bName  = (f.barista_name || "").toLowerCase().trim();
    const byName = userName && bName && (bName === userName || bName.startsWith(userName) || userName.startsWith(bName));
    const inWindow = (f.at ? new Date(f.at).getTime() : 0) >= cutoff;
    const standout = (f.standout || "").toLowerCase();
    const coffeeStandout = standout.includes("coffee") || standout.includes("craft") || standout.includes("espresso") || standout.includes("latte") || standout.includes("barista skill");
    return (byId || byName) && inWindow && coffeeStandout;
  });
  if (!feedbacks.length) return null;
  const avg = feedbacks.reduce((s,f) => s + (f.rating||0), 0) / feedbacks.length;
  return Math.round(avg * 20);
}
function kpiCustomerScore(userId) {
  const user     = (state.users||[]).find(u => u.id === userId);
  const userName = (user?.name || "").toLowerCase().trim();
  const cutoff   = Date.now() - 30*24*60*60*1000; // rolling 30 days, same as other KPI categories

  const feedbacks = (state.customer_feedback||[]).filter(f => {
    // Match by user_id / barista_id (internal) OR by barista_name string (from coffeebeats.art)
    const byId   = f.user_id === userId || f.barista_id === userId;
    const bName  = (f.barista_name || "").toLowerCase().trim();
    const byName = userName && bName && (bName === userName || bName.startsWith(userName) || userName.startsWith(bName));
    const inWindow = (f.at ? new Date(f.at).getTime() : 0) >= cutoff;
    return (byId || byName) && inWindow;
  });

  if (!feedbacks.length) return null;
  const avg = feedbacks.reduce((s,f) => s + (f.rating||0), 0) / feedbacks.length;
  return Math.round(avg * 20); // convert 0–5 stars to 0–100
}


// Auto-calculates teamwork score based on reorder action compliance in last 30 days.
// Penalty per alert where the on-shift barista is userId:
//   - Action within 24h of alert:          0 pts penalty
//   - Action within 3 days:               -10 pts
//   - Action after first follow-up (3d):  -20 pts
//   - Action after second follow-up (5d): -30 pts
//   - No action logged at all (>6d):      -50 pts
// Returns null if no relevant alerts found (score not counted).
function kpiTeamworkScore(userId, cutoff) {
  const alerts = (state.alert_log || []).filter(a => {
    const alertTime = new Date(a.date + "T00:00:00").getTime();
    return alertTime >= cutoff;
  });
  if (!alerts.length) return null;

  // Find alerts where this barista was on shift at the time of the alert
  const myAlerts = alerts.filter(a => {
    return (state.rosters || []).some(r =>
      r.user_id === userId &&
      r.branch  === a.branch &&
      r.week_of <= a.date && a.date <= r.week_of // same week — refine below
    ) || (state.reorder_actions || []).some(r => r.alert_key === a.key && r.by === userId);
  });

  // Fallback: include alerts the barista personally actioned regardless of roster match
  const alertsToScore = myAlerts.length > 0 ? myAlerts : [];
  if (!alertsToScore.length) return null;

  let penalty = 0;
  const now = Date.now();

  for (const a of alertsToScore) {
    const alertMs = new Date(a.date + "T00:00:00").getTime();
    const action = (state.reorder_actions || [])
      .filter(r => r.alert_key === a.key && r.by === userId)
      .sort((x, y) => x.at.localeCompare(y.at))[0];

    const followUps = Array.isArray(a.follow_ups) ? a.follow_ups.length : 0;
    const daysSince = Math.floor((now - alertMs) / 86400000);

    if (!action) {
      // No action at all
      if (daysSince > 6) penalty += 50;
      else if (followUps >= 2) penalty += 30;
      else if (followUps >= 1) penalty += 20;
      // else still within first 3 days — no penalty yet
    } else {
      const actionMs = new Date(action.at).getTime();
      const hoursToAction = (actionMs - alertMs) / 3600000;
      if (hoursToAction <= 24) penalty += 0;
      else if (hoursToAction <= 72) penalty += 10;
      else if (followUps >= 1 && hoursToAction <= 120) penalty += 20;
      else penalty += 30;
    }
  }

  return Math.max(0, 100 - penalty);
}

// ─── Leadership helpers ───────────────────────────────────────────────────────

function getLeadershipAssignment(month) {
  // Head barista is auto-assigned to all leadership roles — no manual entry needed.
  const headBarista = (state.users || []).find(u => u.role === "head_barista" && u.active !== false);
  if (headBarista) {
    return { month, weekly_schedule: headBarista.id, budget_inventory: headBarista.id, _auto: true };
  }
  // No head barista — use manual assignment for regular barista substitutes.
  const assignments = state.leadership_assignments || [];
  const exact = assignments.find(a => a.month === month);
  if (exact) return exact;
  const sorted = assignments.filter(a => a.month < month).sort((a,b) => b.month.localeCompare(a.month));
  if (sorted.length) return { ...sorted[0], month, _carried_forward: true };
  return null;
}

function notifyLeadershipRole(roleKey, title, body) {
  notifyHaidi(title, body);
  const month = new Date().toISOString().slice(0,7);
  const assignment = getLeadershipAssignment(month);
  const roleUserId = assignment ? (assignment[roleKey] || null) : null;
  const cu = typeof currentUser === "function" ? currentUser() : null;
  if (roleUserId && cu && cu.id === roleUserId) {
    toast(`${title} — ${body}`, "warn");
  }
  state.leadership_notifications = state.leadership_notifications || [];
  state.leadership_notifications.push({
    id: uuid(), at: new Date().toISOString(),
    role_key: roleKey, role_user_id: roleUserId,
    title, body,
  });
  saveState();
}

function kpiLeadershipScore(userId, month) {
  const assignment = getLeadershipAssignment(month);
  const ROLES = ["weekly_schedule","budget_inventory","inventory_management","cash_status"];
  const myRole = assignment ? (ROLES.find(r => assignment[r] === userId) || null) : null;
  if (!myRole) return null;
  // Regular baristas assigned a leadership role earn a 10% salary bonus instead of KPI points.
  const user = (state.users || []).find(u => u.id === userId);
  if (user && user.role === "barista") return null;

  if (myRole === "weekly_schedule") {
    const [yr, mo] = month.split("-").map(Number);
    const monthStart = new Date(yr, mo - 1, 1);
    const monthEnd   = new Date(yr, mo, 0);
    const today      = new Date();
    const effectiveEnd = today < monthEnd ? today : monthEnd;
    const bot = state.branch_opening_times || {};
    let deductions = 0;
    for (let d = new Date(monthStart); d <= effectiveEnd; d.setDate(d.getDate() + 1)) {
      const dateStr  = localISODate(d);
      const dayIndex = (d.getDay() + 6) % 7;
      const dayKey   = ROSTER_DAYS[dayIndex];
      const weekOf   = mondayOf(dateStr);
      const morningEntries = (state.rosters || []).filter(r =>
        r.week_of === weekOf && r.day === dayKey && r.shift === "morning"
      );
      for (const entry of morningEntries) {
        const branch  = (entry.branch || "maadi").toLowerCase();
        const openStr = ((bot[branch] || {})["morning"]) || (branch === "maadi" ? "10:00" : "12:00");
        const openMs  = new Date(dateStr + "T" + openStr + ":00").getTime();
        const stamp = (state.signin_stamps || []).find(s =>
          s.by === entry.user_id &&
          localISODate(new Date(s.at)) === dateStr &&
          (s.branch || "").toLowerCase() === branch
        );
        if (!stamp) {
          const hasNoStampPenalty = (state.penalties || []).some(p =>
            p.auto_no_stamp && p.user_id === entry.user_id && p.date === dateStr
          );
          if (hasNoStampPenalty) deductions += 15;
        } else {
          const minsLate = Math.round((new Date(stamp.at).getTime() - openMs) / 60000);
          if (minsLate > 15) deductions += 10;
        }
      }
    }
    return Math.max(0, 100 - deductions);
  }

  if (myRole === "budget_inventory" || myRole === "inventory_management" || myRole === "cash_status") {
    const [yr, mo] = month.split("-").map(Number);
    const monthStart = new Date(yr, mo - 1, 1);
    const monthEnd   = new Date(yr, mo, 0);
    const lastDay    = localISODate(monthEnd);
    const today      = new Date();
    const todayStr   = localISODate(today);

    // Inventory sub-score
    let invScore;
    if (todayStr < lastDay) {
      const hasAny = (state.snapshots || []).some(s => (s.as_of || "").startsWith(month));
      invScore = hasAny ? 80 : 0;
    } else {
      const hasEOD = (state.snapshots || []).some(s => s.as_of === lastDay);
      invScore = hasEOD ? 100 : 0;
    }

    // Cash sub-score (only for budget_inventory and legacy cash_status)
    if (myRole === "inventory_management") return invScore;

    const effectiveEnd = today < monthEnd ? today : monthEnd;
    const weeksInMonth = new Set();
    for (let d = new Date(monthStart); d <= effectiveEnd; d.setDate(d.getDate() + 1)) {
      weeksInMonth.add(mondayOf(localISODate(d)));
    }
    const totalWeeks = weeksInMonth.size;
    if (totalWeeks === 0) return null;
    const weeksWithDeposit = [...weeksInMonth].filter(weekOf =>
      (state.maadi_deposits || []).some(dep => dep.week_of === weekOf)
    ).length;
    const cashScore = Math.round((weeksWithDeposit / totalWeeks) * 100);

    if (myRole === "cash_status") return cashScore;

    // budget_inventory: average of both sub-scores
    return Math.round((invScore + cashScore) / 2);
  }

  return null;
}

function runEndOfMonthLeadershipCheck(month, cu) {
  const assignment = getLeadershipAssignment(month);
  if (!assignment) { toast("No leadership assignment for " + month, "error"); return; }
  const [yr, mo] = month.split("-").map(Number);
  const lastDay   = localISODate(new Date(yr, mo, 0));
  // Head barista is accountable first; fall back to inventory manager if no head barista assigned
  const headBaristaId = assignment.head_barista;
  const invMgrId  = headBaristaId || assignment.budget_inventory || assignment.inventory_management;
  if (!invMgrId) { toast("No Head Barista or Inventory Manager assigned for " + month, "warn"); return; }
  const hasSnapshot = (state.snapshots || []).some(s => s.as_of === lastDay);
  if (hasSnapshot) { toast("✅ Inventory snapshot found for " + lastDay + " — no penalty.", "ok"); return; }
  const already = (state.penalties || []).some(p =>
    p.auto_leadership && p.user_id === invMgrId && p.month === month
  );
  if (already) { toast("Penalty already applied for inventory failure in " + month, "warn"); return; }
  const invMgr = (state.users || []).find(u => u.id === invMgrId);
  const salary  = Number(((state.salary_config || {})[invMgrId] || {}).monthly_salary || 0);
  const amount  = penaltyAmount("half_day", salary);
  state.penalties = state.penalties || [];
  state.penalties.push({
    id: uuid(), at: new Date().toISOString(),
    by: cu.id, by_name: cu.name,
    user_id: invMgrId, barista: invMgr ? invMgr.name : invMgrId,
    kind: "half_day", kind_label: "Half day",
    reason: "leadership_fail", reason_code: "leadership_fail",
    date: lastDay, month,
    amount,
    note: "Auto: Inventory not updated for end of month " + month,
    auto_leadership: true,
    salary_at_time: salary,
  });
  saveState();
  toast(`⚠ Half-day penalty applied to ${invMgr ? invMgr.name : invMgrId} — no inventory snapshot for ${month}`, "warn");
  notifyHaidi(`Leadership penalty — ${invMgr ? invMgr.name : invMgrId}`, `No inventory snapshot for ${lastDay}. Half-day deducted.`);

  // Apply 10% salary bonus for any regular baristas assigned a leadership role this month.
  _applyLeadershipBonusForBaristas(month, cu);
}

function _applyLeadershipBonusForBaristas(month, cu) {
  const assignment = getLeadershipAssignment(month);
  if (!assignment) return;
  const [yr, mo] = month.split("-").map(Number);
  const monthStart = new Date(yr, mo - 1, 1);
  const monthEnd   = new Date(yr, mo, 0);

  // Collect all unique weeks in the month
  const allWeeks = new Set();
  for (let d = new Date(monthStart); d <= monthEnd; d.setDate(d.getDate() + 1)) {
    allWeeks.add(mondayOf(localISODate(d)));
  }
  const totalWeeks = allWeeks.size;
  if (totalWeeks === 0) return;

  const ROLES = ["weekly_schedule", "budget_inventory"];
  const processed = new Set();

  for (const roleKey of ROLES) {
    const uid = assignment[roleKey];
    if (!uid || processed.has(uid)) continue;
    processed.add(uid);

    const user = (state.users || []).find(u => u.id === uid);
    if (!user || user.role !== "barista") continue;

    // Count weeks where this barista had at least one rostered shift
    const weeksWithShift = [...allWeeks].filter(weekOf =>
      (state.rosters || []).some(r => r.week_of === weekOf && r.user_id === uid)
    ).length;
    if (weeksWithShift === 0) continue;

    const alreadyLogged = (state.overtime_logs || []).some(l =>
      l.kind === "leadership_bonus" && l.user_id === uid && l.month === month
    );
    if (alreadyLogged) continue;

    const salary = Number(((state.salary_config || {})[uid] || {}).monthly_salary || 0);
    if (salary <= 0) continue;

    const bonusAmount = Math.round(salary * 0.10 * (weeksWithShift / totalWeeks));
    state.overtime_logs = state.overtime_logs || [];
    state.overtime_logs.push({
      id: uuid(), at: new Date().toISOString(),
      by: cu.id, by_name: cu.name,
      user_id: uid, barista: user.name,
      kind: "leadership_bonus",
      hours: 0,
      amount: bonusAmount,
      month,
      date: localISODate(monthEnd),
      note: `Leadership role bonus (${roleKey.replace("_"," ")}) — ${weeksWithShift}/${totalWeeks} weeks on shift`,
      approved: true,
      approved_by: cu.id,
    });
    toast(`✅ Leadership bonus +${money(bonusAmount)} added for ${user.name} (${weeksWithShift}/${totalWeeks} weeks)`, "ok");
    notifyHaidi(`Leadership bonus — ${user.name}`, `+${money(bonusAmount)} for ${weeksWithShift}/${totalWeeks} weeks as leadership substitute in ${month}.`);
  }
  saveState();
}

function kpiHygieneScore(userId, month) {
  const pens = (state.penalties||[]).filter(p =>
    p.user_id === userId &&
    (p.month || (p.date||"").slice(0,7)) === month &&
    (p.reason_code === "no_uniform" || p.reason_code === "hygiene")
  );
  return Math.max(0, 100 - pens.length * 25);
}

// Ticket size formula:
//   Ticket Size = number of product line items (modifiers excluded) per order_reference
//   Avg Ticket Size per barista = total items across barista's orders / count of barista's orders
//   Upselling Score = max(0, min(100, (avg - 1.0) / 2.0 * 100))
//   → 1.0 items/order = 0 pts · 2.0 items/order = 50 pts · 3.0+ items/order = 100 pts
function calcTicketSizeByBarista(branch, isoMonth) {
  const orders = (state.orders || []).filter(o => o.branch === branch && o.month === isoMonth);
  const items  = (state.order_items || []).filter(i => i.branch === branch && i.month === isoMonth);
  // Build map order_ref → total qty (items in that order)
  const orderQty = new Map();
  for (const i of items) orderQty.set(i.order_ref, (orderQty.get(i.order_ref) || 0) + (Number(i.qty) || 1));
  // Accumulate per barista
  const byBarista = new Map(); // barista_name → { orders, totalItems }
  for (const o of orders) {
    const qty = orderQty.get(o.order_ref) || 1;
    const cur = byBarista.get(o.barista_name) || { orders: 0, totalItems: 0 };
    cur.orders++;
    cur.totalItems += qty;
    byBarista.set(o.barista_name, cur);
  }
  const result = new Map();
  for (const [name, d] of byBarista) {
    const avg = d.orders > 0 ? d.totalItems / d.orders : 1;
    result.set(name, { orders: d.orders, totalItems: d.totalItems, avg: +avg.toFixed(2) });
  }
  return result;
}

function kpiUpsellScore(userId, month) {
  const user = (state.users || []).find(u => u.id === userId);
  if (!user) return null;
  const branches = user.branches || ["maadi", "zawya"];
  let totalOrders = 0, totalItems = 0;
  for (const branch of branches) {
    const map = calcTicketSizeByBarista(branch, month);
    // Match by name (barista_name in File 3 vs user.name)
    for (const [name, d] of map) {
      if (name.toLowerCase().trim() === (user.name || "").toLowerCase().trim()) {
        totalOrders += d.orders;
        totalItems  += d.totalItems;
      }
    }
  }
  if (totalOrders === 0) return null;
  const avg = totalItems / totalOrders;
  return Math.round(Math.max(0, Math.min(100, (avg - 1.0) / 2.0 * 100)));
}

// Training score: barista's latest completed quiz score for the current month (0–100), or null if not taken.
function kpiTrainingScore(userId) {
  const month = new Date().toISOString().slice(0, 7);
  const quiz  = (state.training_quizzes || [])
    .find(q => q.staff_id === userId && q.month === month && q.status === "completed");
  return quiz != null ? Math.round(quiz.score) : null;
}

function kpiGetUserScores(userId) {
  const cutoff = Date.now() - 30*24*60*60*1000;
  const month  = new Date().toISOString().slice(0,7);

  // ── AUTO from source tiles ──────────────────────────────────────────────
  const _punctResult = kpiPunctualityScore(userId, cutoff);
  const punctuality  = _punctResult != null ? _punctResult.score : null;
  const _lateOverflow = _punctResult != null ? _punctResult.overflow : 0;
  const waste        = kpiWasteScore(userId, cutoff);           // ← waste_new entries
  const cleanliness  = kpiCleanlinessScore(userId, cutoff);    // ← cleaning_log entries
  const customer     = kpiCustomerScore(userId);
  const craftAuto    = kpiCraftScore(userId, cutoff);           // ← customer reviews where standout = coffee
  const teamworkAuto = kpiTeamworkScore(userId, cutoff);

  // ── MANUAL: entered monthly by owner / head barista in scorecard ─────────
  const manual = ((state.kpi_manual||[]).find(m => m.user_id===userId && m.month===month)) || {};

  const agg = {
    punctuality,
    waste,
    cleanliness,
    craft:     craftAuto ?? (manual.craft ?? null),  // auto first, manual fallback
    upselling: kpiUpsellScore(userId, month) ?? (manual.upselling ?? null),
    customer:  customer ?? (manual.customer ?? null),
    // Teamwork: auto-calculated from reorder compliance; manual override by owner only
    teamwork:   teamworkAuto ?? (manual.teamwork ?? null),
    leadership:    kpiLeadershipScore(userId, month) ?? null,
    hygiene:       kpiHygieneScore(userId, month),
    training:      kpiTrainingScore(userId),
    _lateOverflow: _lateOverflow,
  };

  const cats = Object.keys(KPI_W());
  if (!cats.some(k=>agg[k]!=null)) return null;
  return agg;
}

function kpiGetAllScores() {
  const result = {};
  for (const u of state.users) {
    if (!["barista","head_barista"].includes(u.role)) continue;
    const s = kpiGetUserScores(u.id);
    result[u.id] = s || { punctuality:null,waste:null,cleanliness:null,craft:null,upselling:null,customer:null,teamwork:null,leadership:null,hygiene:null,training:null };
  }
  return result;
}

routes.scorecard = function(u) {

      : "😊 No customer reviews yet — they'll appear here automatically once customers submit on coffeebeats.art"
  ));

  const cats = Object.keys(KPI_W());

  // Their historical data is preserved and will reappear if they are reactivated.

  });

    const empty = el("div",{class:"card",style:{textAlign:"center",padding:"32px"}});
    empty.appendChild(el("div",{style:{fontSize:"36px",marginBottom:"8px"}},"📊"));

    empty.appendChild(el("div",{class:"muted",style:{marginTop:"8px"}},
      "Baristas need to submit daily logs (\"سجّل شيفتي\") before scores appear here. Each submission auto-updates their rolling 30-day average."));

    wrap.appendChild(btnBack());
    return wrap;

  // ── Leaderboard card ──
  const lbCard = el("div",{class:"card",style:{marginBottom:"12px"}});
  lbCard.appendChild(el("div",{style:{fontWeight:"700",fontSize:"14px",marginBottom:"10px"}},"🏆 Achievers Board"));
  const sorted = activeU.map(x=>{
    const s = allScores[x.id];
    const total = s && cats.some(k=>s[k]!=null) ? kpiCalcTotal(s) : null;

  }).filter(x=>x.total!=null).sort((a,b)=>b.total-a.total);
  const medals = ["🥇","🥈","🥉"];

    row.appendChild(el("div",{style:{width:"32px",height:"32px",borderRadius:"50%",background:"var(--accent-2)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"700",fontSize:"12px"}},
      (m.name||"?").split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2)));
    const info = el("div",{style:{flex:"1"}});
    info.appendChild(el("div",{style:{fontWeight:"600",fontSize:"13px"}},m.name));
    info.appendChild(el("div",{class:"muted small"},m.role==="head_barista"?"⭐ Head Barista":"Barista"));
    row.appendChild(info);
    const bar = el("div",{style:{flex:"2"}});
    const barInner = el("div",{style:{height:"6px",background:"var(--surface-2)",borderRadius:"4px",overflow:"hidden"}});
    barInner.appendChild(el("div",{style:{width:m.total+"%",height:"100%",background:kpiScoreColor(m.total),borderRadius:"4px"}}));
    bar.appendChild(barInner);
    row.appendChild(bar);
    row.appendChild(el("div",{style:{fontWeight:"800",fontSize:"15px",color:kpiScoreColor(m.total),minWidth:"36px",textAlign:"right"}},m.total.toFixed(0)));
    lbCard.appendChild(row);
  });
  wrap.appendChild(lbCard);

  // ── Heatmap table ──
  const hm = el("div",{class:"card",style:{overflowX:"auto",marginBottom:"12px"}});
  hm.appendChild(el("div",{style:{fontWeight:"700",fontSize:"14px",marginBottom:"10px"}},"📊 Category Heatmap — All Baristas"));
  const tbl = el("table",{});
  const thead = el("thead",{});
  const hrow = el("tr",{});
  hrow.appendChild(el("th",{},"Barista"));
  cats.forEach(k=>hrow.appendChild(el("th",{style:{textAlign:"center"}},KPI_ICONS[k]+" "+KPI_LABELS_EN[k])));
  hrow.appendChild(el("th",{style:{textAlign:"center"}},"Total"));
  thead.appendChild(hrow);
  tbl.appendChild(thead);
  const tbody = el("tbody",{});
  activeU.forEach(x=>{
    const s = allScores[x.id];
    const total = s && cats.some(k=>s[k]!=null) ? kpiCalcTotal(s) : null;
    const row = el("tr",{});
    const nameCell = el("td",{});
    nameCell.appendChild(el("div",{style:{fontWeight:"600",fontSize:"13px"}},x.name));
    if (x.role==="head_barista") nameCell.appendChild(el("div",{class:"small muted"},"⭐ Head"));
    row.appendChild(nameCell);
    cats.forEach(k=>{
      const v = s&&s[k]!=null ? s[k] : null;
      const td = el("td",{class:"num"});
      if (v!=null) {
        const pill = el("span",{style:{display:"inline-block",background:v>=85?"rgba(47,138,85,.15)":v>=65?"rgba(183,121,31,.15)":"rgba(194,59,59,.15)",color:kpiScoreColor(v),borderRadius:"6px",padding:"2px 7px",fontWeight:"700",fontSize:"12px"}},String(v));
        td.appendChild(pill);
      } else {
        td.appendChild(el("span",{class:"muted small"},"—"));
      }
      row.appendChild(td);
    });
    const totCell = el("td",{class:"num"});
    if (total!=null) totCell.appendChild(el("b",{style:{color:kpiScoreColor(total)}},total.toFixed(0)));
    else totCell.appendChild(el("span",{class:"muted small"},"—"));
    row.appendChild(totCell);
    tbody.appendChild(row);
  });
  tbl.appendChild(tbody);
  hm.appendChild(tbl);
  wrap.appendChild(hm);

  // ── Individual deep-dive ──
  const diveCard = el("div",{class:"card"});
  diveCard.appendChild(el("div",{style:{fontWeight:"700",fontSize:"14px",marginBottom:"10px"}},"🔍 Individual Deep-Dive"));
  const sel = el("select",{style:{marginBottom:"12px"}});
  sel.appendChild(el("option",{value:""},"— Select a barista —"));
  activeU.forEach(x=>sel.appendChild(el("option",{value:x.id},x.name+(x.role==="head_barista"?" ⭐":""))));
  diveCard.appendChild(sel);
  const diveBody = el("div",{});
  diveCard.appendChild(diveBody);
  sel.addEventListener("change",()=>{
    diveBody.innerHTML="";
    const uid = sel.value;
    if (!uid) return;
    const person = allU.find(x=>x.id===uid);
    const s = allScores[uid];
    if (!s||!cats.some(k=>s[k]!=null)) {
      diveBody.appendChild(el("div",{class:"muted small"},"No logs submitted yet for this barista."));
      return;
    }
    const total = kpiCalcTotal(s);
    const isHead = person.role==="head_barista";
    const tgt = isHead?85:75;
    const summRow = el("div",{style:{display:"flex",alignItems:"center",gap:"14px",marginBottom:"14px",flexWrap:"wrap"}});
    summRow.appendChild(el("div",{style:{fontWeight:"800",fontSize:"2rem",color:kpiScoreColor(total)}},total.toFixed(0)));
    const summInfo = el("div",{});
    summInfo.appendChild(el("div",{style:{fontWeight:"700"}},person.name+(person.active===false?" (archived)":"")));
    summInfo.appendChild(el("div",{class:"muted small"},kpiGradeEn(total)+" · Target: "+tgt+"+"));
    summRow.appendChild(summInfo);
    diveBody.appendChild(summRow);
    cats.forEach(k=>{
      const v = s[k];
      if (v==null) return;
      const rowDiv = el("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"7px"}});
      rowDiv.appendChild(el("div",{style:{width:"140px",fontSize:"12px",fontWeight:"600"}},KPI_ICONS[k]+" "+KPI_LABELS_EN[k]));
      const barWrap = el("div",{style:{flex:"1",height:"7px",background:"var(--surface-2)",borderRadius:"4px",overflow:"hidden"}});
      barWrap.appendChild(el("div",{style:{width:v+"%",height:"100%",background:kpiScoreColor(v),borderRadius:"4px"}}));
      rowDiv.appendChild(barWrap);
      rowDiv.appendChild(el("div",{style:{fontWeight:"700",fontSize:"13px",color:kpiScoreColor(v),minWidth:"28px",textAlign:"right"}},String(v)));
      rowDiv.appendChild(el("div",{class:"pill",style:{fontSize:"10px"}},KPI_W()[k]+"%"));
      diveBody.appendChild(rowDiv);
    });
    // Recent logs for this person
    const recent = (state.kpi_logs||[]).filter(l=>l.user_id===uid).sort((a,b)=>b.at-a.at).slice(0,5);
    if (recent.length) {
      diveBody.appendChild(el("div",{style:{fontWeight:"600",fontSize:"12px",color:"var(--ink-dim)",marginTop:"12px",marginBottom:"6px",textTransform:"uppercase",letterSpacing:".5px"}},"Recent Logs"));
      const lt = el("table",{});
      lt.appendChild(el("thead",{},[el("tr",{},[el("th",{},"Date"),el("th",{},"Shift"),el("th",{style:{textAlign:"right"}},"Punctuality"),el("th",{style:{textAlign:"right"}},"Waste"),el("th",{style:{textAlign:"right"}},"Cleanliness")])]));
      const ltb = el("tbody",{});
      recent.forEach(l=>{
        ltb.appendChild(el("tr",{},[
          el("td",{},fmtDay(l.at)),
          el("td",{class:"muted"},l.shift||"—"),
          el("td",{class:"num",style:{color:kpiScoreColor(l.punctuality||0)}},l.punctuality!=null?String(l.punctuality):"—"),
          el("td",{class:"num",style:{color:kpiScoreColor(l.waste||0)}},l.waste!=null?String(l.waste):"—"),
          el("td",{class:"num",style:{color:kpiScoreColor(l.cleanliness||0)}},l.cleanliness!=null?String(l.cleanliness):"—"),
        ]));
      });
      lt.appendChild(ltb);
      diveBody.appendChild(lt);
    }
  });
  wrap.appendChild(diveCard);

  // ── Manual monthly score entry ──────────────────────────────────────────────
  if (u.role === "owner" || u.role === "head_barista") {
    const manCard = el("div",{class:"card",style:{marginTop:"12px"}});
    manCard.appendChild(el("div",{style:{fontWeight:"700",fontSize:"14px",marginBottom:"4px"}},"✏️ Enter Monthly Manual Scores"));
    manCard.appendChild(el("div",{class:"muted small",style:{marginBottom:"10px"}},
      "Craft, Upselling, Customer (if not from coffeebeats.art), Teamwork & Training — set once per month per barista."));
    const manSelWrap = el("div",{style:{marginBottom:"10px"}});
    manSelWrap.appendChild(el("label",{},"Barista"));
    const manSel = el("select",{});
    manSel.appendChild(el("option",{value:""},"— Select barista —"));
    activeU.forEach(x=>manSel.appendChild(el("option",{value:x.id},x.name+(x.role==="head_barista"?" ⭐":""))));
    manSelWrap.appendChild(manSel);
    manCard.appendChild(manSelWrap);
    const manFields = el("div",{id:"man-fields-wrap",style:{display:"none"}});
    manCard.appendChild(manFields);
    const MAN_CATS = [
      {k:"craft",     label:"☕ Coffee Craft",  hint:"Customer reviews mentioning coffee/drink quality from coffeebeats.art (0-100)"},
      {k:"upselling", label:"📈 Upselling",      hint:"Auto-calculated from File 3 (orders) + File 2 (order items). Score = avg items/order mapped 1→0 to 3+→100. Manual override below if Files not yet uploaded."},
      {k:"customer",  label:"😊 Customer Score", hint:"Feedback from coffeebeats.art — positive, neutral, negative tags aggregated (0-100)"},
      {k:"teamwork",  label:"👥 Teamwork",        hint:"Reorder compliance, covering shifts, contributing to shared tasks (0-100)"},
    ];
    manSel.addEventListener("change",()=>{
      manFields.innerHTML="";
      const uid = manSel.value;
      if (!uid) { manFields.style.display="none"; return; }
      manFields.style.display="block";
      const month = new Date().toISOString().slice(0,7);
      const existing = (state.kpi_manual||[]).find(m=>m.user_id===uid&&m.month===month)||{};
      MAN_CATS.forEach(({k,label,hint})=>{
        manFields.appendChild(el("label",{style:{marginTop:"10px"}},label));
        manFields.appendChild(el("div",{class:"muted small",style:{marginBottom:"4px"}},hint));
        const inp = el("input",{type:"range",min:"0",max:"100",value:existing[k]||50,id:"man_"+k});
        const val = el("span",{style:{fontWeight:"700",color:"var(--accent)",marginLeft:"8px"}},String(inp.value));
        inp.addEventListener("input",()=>{ val.textContent=inp.value; });
        const row = el("div",{style:{display:"flex",alignItems:"center",gap:"6px"}});
        row.appendChild(inp); row.appendChild(val);
        manFields.appendChild(row);
      });
      const saveBtn = el("button",{class:"btn",style:{marginTop:"14px"},onClick:()=>{
        const month2 = new Date().toISOString().slice(0,7);
        const entry = { user_id:uid, month:month2 };
        MAN_CATS.forEach(({k})=>{ entry[k]=parseInt(document.getElementById("man_"+k)?.value||50); });
        if (!state.kpi_manual) state.kpi_manual=[];
        const idx = state.kpi_manual.findIndex(m=>m.user_id===uid&&m.month===month2);
        if (idx>=0) state.kpi_manual[idx]=entry; else state.kpi_manual.push(entry);
        save();
        toast("✅ Manual scores saved for "+allU.find(x=>x.id===uid)?.name);
      }},"Save Manual Scores");
      manFields.appendChild(saveBtn);
    });
    wrap.appendChild(manCard);

    // ── Customer feedback entry ────────────────────────────────────────────
    const cfCard = el("div",{class:"card",style:{marginTop:"12px"}});
    cfCard.appendChild(el("div",{style:{fontWeight:"700",fontSize:"14px",marginBottom:"4px"}},"😊 Customer Feedback Log"));
    cfCard.appendChild(el("div",{class:"muted small",style:{marginBottom:"10px"}},
      "Customer Score auto-feeds from coffeebeats.art reviews — ratings from the public form flow straight into each barista's KPI in real-time. Override manually below if needed."));
    const cfSelWrap = el("div",{style:{marginBottom:"10px"}});
    cfSelWrap.appendChild(el("label",{},"Barista"));
    const cfSel = el("select",{});
    cfSel.appendChild(el("option",{value:""},"— Select barista —"));
    activeU.forEach(x=>cfSel.appendChild(el("option",{value:x.id},x.name)));
    cfSelWrap.appendChild(cfSel);
    cfCard.appendChild(cfSelWrap);
    cfCard.appendChild(el("label",{},"Star Rating (1–5)"));
    const cfRating = el("input",{type:"number",min:"1",max:"5",step:"0.1",placeholder:"e.g. 4.7"});
    cfCard.appendChild(cfRating);
    cfCard.appendChild(el("label",{},"Source"));
    const cfSrc = el("select",{},[
      el("option",{value:"coffeebeats.art"},"coffeebeats.art review"),
      el("option",{value:"google"},"Google Review"),
      el("option",{value:"manual"},"Manual entry"),
      el("option",{value:"in-store"},"In-store feedback card"),
    ]);
    cfCard.appendChild(cfSrc);
    cfCard.appendChild(el("label",{},"Note (optional)"));
    const cfNote = el("input",{type:"text",placeholder:"e.g. Mentioned barista by name, perfect latte art"});
    cfCard.appendChild(cfNote);
    cfCard.appendChild(el("button",{class:"btn",style:{marginTop:"12px"},onClick:()=>{
      const uid = cfSel.value;
      const rat = parseFloat(cfRating.value);
      if (!uid||isNaN(rat)||rat<1||rat>5) { toast("Select barista and enter 1–5 rating","error"); return; }
      if (!state.customer_feedback) state.customer_feedback=[];
      state.customer_feedback.push({
        id:uuid(), at:now(), by:u.id, by_name:u.name,
        user_id:uid, barista_id:uid,
        rating:rat, source:cfSrc.value, note:cfNote.value.trim(),
        month:new Date().toISOString().slice(0,7),
      });
      save(); cfRating.value=""; cfNote.value="";
      toast("✅ Customer feedback logged — Customer Score updated");
    }},"Log Feedback"));
    // Recent feedback table
    const recentCF = (state.customer_feedback||[]).sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,8);
    if (recentCF.length) {
      const cft = el("table",{style:{marginTop:"10px"}});
      cft.appendChild(el("thead",{},[el("tr",{},[el("th",{},"Barista"),el("th",{},"Rating"),el("th",{},"Source"),el("th",{},"Date"),el("th",{},"")])]));
      const cftb=el("tbody",{});
      recentCF.forEach(f=>{
        const bName=(activeU.find(x=>x.id===f.user_id)||allU.find(x=>x.id===f.user_id)||{}).name||f.barista_name||f.user_id||"—";
        const delBtn = el("button",{class:"btn ghost",style:{padding:"2px 8px",fontSize:"11px",color:"var(--bad)"}}, "✕");
        delBtn.addEventListener("click",()=>{
          if (!confirm("Delete this feedback entry? This cannot be undone.")) return;
          if (f.by === "website" && f.id) {
            state.blocked_feedback_ids = state.blocked_feedback_ids || [];
            if (!state.blocked_feedback_ids.includes(f.id)) state.blocked_feedback_ids.push(f.id);
          }
          state.customer_feedback = (state.customer_feedback||[]).filter(x=>x.id!==f.id);
          save(); render();
        });
        cftb.appendChild(el("tr",{},[
          el("td",{},bName),
          el("td",{class:"num",style:{color:kpiScoreColor(f.rating*20)}},"★"+f.rating.toFixed(1)),
          el("td",{class:"muted"},f.source||""),
          el("td",{class:"muted"},fmtDay(f.at||0)),
          el("td",{},delBtn),
        ]));
      });
      cft.appendChild(cftb);
      cfCard.appendChild(cft);
    }
    wrap.appendChild(cfCard);
  }

  // ── KPI Reset (owner only) ─────────────────────────────────────────────────
  if (u.role === "owner") {
    const rstCard = el("div", { class: "card", style: { marginTop: "12px", borderTop: "2px solid var(--bad)" } });
    rstCard.appendChild(el("div", { style: { fontWeight: "700", fontSize: "14px", marginBottom: "4px", color: "var(--bad)" } }, "🔄 Reset KPI Score"));
    rstCard.appendChild(el("div", { class: "muted small", style: { marginBottom: "10px" } },
      "Select a barista and month, then choose what to reset."));

    const rstRow = el("div", { style: { display: "flex", gap: "8px", flexWrap: "wrap", marginBottom: "12px" } });

    const rstSel = el("select", { style: { flex: "1", minWidth: "140px" } });
    rstSel.appendChild(el("option", { value: "" }, "— Select barista —"));
    activeU.forEach(x => rstSel.appendChild(el("option", { value: x.id }, x.name + (x.role === "head_barista" ? " ⭐" : ""))));
    rstRow.appendChild(rstSel);

    const rstMonth = el("input", { type: "month", value: new Date().toISOString().slice(0, 7), style: { flex: "1", minWidth: "130px", fontSize: "14px", padding: "6px 8px", borderRadius: "8px", border: "1px solid var(--border)" } });
    rstRow.appendChild(rstMonth);
    rstCard.appendChild(rstRow);

    function getResetTarget() {
      const uid = rstSel.value;
      const mon = rstMonth.value;
      if (!uid || !mon) { toast("Select a barista and month first", "error"); return null; }
      return { uid, mon, person: activeU.find(x => x.id === uid) };
    }

    // ── Button A: manual scores only ──────────────────────────────────────────
    const rstBtnManual = el("button", { class: "btn ghost", style: { marginBottom: "8px", display: "block", width: "100%" }, onClick: () => {
      const t = getResetTarget(); if (!t) return;
      if (!confirm("Reset manually entered KPI scores for " + (t.person?.name || t.uid) + " (" + t.mon + ")?\n\nClears: craft, upselling, customer, teamwork overrides.\nAuto-calculated scores remain.")) return;
      state.kpi_manual = (state.kpi_manual || []).filter(m => !(m.user_id === t.uid && m.month === t.mon));
      save();
      toast("✅ Manual KPI scores cleared for " + (t.person?.name || t.uid) + " — " + t.mon);
    } }, "Reset Manual Scores Only");
    rstCard.appendChild(rstBtnManual);

    // ── Button B: full reset ──────────────────────────────────────────────────
    const rstBtnAll = el("button", { class: "btn", style: { background: "var(--bad)", color: "#fff", display: "block", width: "100%" }, onClick: () => {
      const t = getResetTarget(); if (!t) return;
      if (!confirm(
        "Reset ALL KPI data for " + (t.person?.name || t.uid) + " (" + t.mon + ")?\n\n" +
        "This will permanently delete:\n" +
        "• Manual KPI entries (craft, upselling, customer, teamwork)\n" +
        "• Waste log entries\n" +
        "• Cleaning log entries\n" +
        "• Customer feedback entries\n" +
        "• Hygiene & uniform penalties\n\n" +
        "Sign-in stamps, financial penalties, payroll, and training scores are NOT deleted."
      )) return;
      const { uid, mon } = t;
      const inMonth = x => (x.month || (x.date || "").slice(0, 7)) === mon;
      state.kpi_manual        = (state.kpi_manual        || []).filter(m => !(m.user_id === uid && m.month === mon));
      state.waste_new         = (state.waste_new         || []).filter(x => !(x.user_id === uid && inMonth(x)));
      state.cleaning_log      = (state.cleaning_log      || []).filter(x => !(x.user_id === uid && inMonth(x)));
      const fbToRemove = (state.customer_feedback || []).filter(x => x.user_id === uid && inMonth(x));
      fbToRemove.forEach(x => { if (x.by === "website" && x.id) { state.blocked_feedback_ids = state.blocked_feedback_ids || []; if (!state.blocked_feedback_ids.includes(x.id)) state.blocked_feedback_ids.push(x.id); } });
      state.customer_feedback = (state.customer_feedback || []).filter(x => !(x.user_id === uid && inMonth(x)));
      state.penalties         = (state.penalties         || []).filter(x => !(
        x.user_id === uid && inMonth(x) &&
        (x.reason_code === "no_uniform" || x.reason_code === "hygiene")
      ));
      save();
      toast("✅ All KPI data reset for " + (t.person?.name || uid) + " — " + mon);
    } }, "Reset All KPI Scores");
    rstCard.appendChild(rstBtnAll);

    rstCard.appendChild(el("div", { class: "muted small", style: { marginTop: "8px" } },
      "\"All\" clears waste logs, cleaning logs, customer feedback, and hygiene penalties for the selected month. Sign-in stamps and financial penalties are never touched."));
    wrap.appendChild(rstCard);
  }

  wrap.appendChild(btnBack());
  return wrap;
};

// ─── BARISTA/HEAD: Upload government ID ───────────────────────────────────────
routes.my_scorecard = function(u) {
  const isAR = u.role==="barista"||u.role==="head_barista";
  const dir  = isAR?"rtl":"ltr";
  const wrap = el("div",{style:{direction:dir}});
  const scores = kpiGetUserScores(u.id);
  const cats = Object.keys(KPI_W());
  const isHead = u.role==="head_barista";
  const tgt = isHead?85:75;

  // Header
  const hdr = el("div",{class:"card",style:{textAlign:"center",marginBottom:"12px",background:"var(--ink)",color:"var(--accent-2)"}});
  hdr.appendChild(el("div",{style:{fontSize:"12px",letterSpacing:"2px",opacity:".7",textTransform:"uppercase",marginBottom:"4px"}},"Coffee Beats · بطاقة الأداء"));
  hdr.appendChild(el("div",{style:{fontSize:"20px",fontWeight:"800"}},u.name));
  hdr.appendChild(el("div",{style:{fontSize:"13px",opacity:".8",marginTop:"4px"}},isHead?"⭐ رئيس بريستا":"بريستا"));
  wrap.appendChild(hdr);

  if (!scores||!cats.some(k=>scores[k]!=null)) {
    const empty = el("div",{class:"card",style:{textAlign:"center",padding:"28px 16px"}});
    empty.appendChild(el("div",{style:{fontSize:"34px",marginBottom:"8px"}},"📋"));
    empty.appendChild(el("div",{style:{fontWeight:"700",fontSize:"15px"}},isAR?"لا توجد بيانات بعد":"No data yet"));
    empty.appendChild(el("div",{class:"muted",style:{marginTop:"8px",fontSize:"13px"}},
      isAR?"اضغط على 'سجّل شيفتي' لتبدأ بإدخال بياناتك اليومية. ستظهر نقاطك هنا تلقائياً.":"Submit daily logs to see your scores."));
    wrap.appendChild(empty);
    const emptyBtns = el("div",{class:"btn-row",style:{marginTop:"12px"}});
    emptyBtns.appendChild(el("button",{class:"btn",onClick:()=>go("signin_stamp_new")},isAR?"🕐 سجّل حضورك":"🕐 Sign-In Stamp"));
    emptyBtns.appendChild(el("button",{class:"btn secondary",onClick:()=>go("cleaning_log_new")},isAR?"🧹 سجل النظافة":"🧹 Cleaning Log"));
    wrap.appendChild(emptyBtns);
    wrap.appendChild(btnBack());
    return wrap;
  }

  const total = kpiCalcTotal(scores);
  // Score ring (CSS only)
  const scoreCard = el("div",{class:"card",style:{marginBottom:"12px"}});
  const ringWrap = el("div",{style:{display:"flex",alignItems:"center",gap:"16px",flexWrap:"wrap"}});
  const pct = Math.min(total,100);
  const r=36,circ=2*Math.PI*r,dash=(pct/100)*circ;

      inventory_management: { en:"📦 Inventory Manager", ar:"📦 مدير المخزون",
        descEn:"You must submit the end-of-month inventory snapshot. You receive all low-stock alerts.",

      cash_status:          { en:"💵 Cash Manager",      ar:"💵 مدير الودائع",
        descEn:"You are accountable for logging the weekly Maadi cash deposit in the Operations App. You receive a reminder every Thursday by email and in-app. If the deposit is not logged by end of Friday, a ¼ day salary deduction is applied for that week. Repeated missed entries also lower your Leadership KPI score.",
        descAr:"أنت مسؤول عن تسجيل الإيداع الأسبوعي في ماعدي في تطبيق العمليات. ستتلقى تذكيراً كل خميس عبر البريد الإلكتروني والتطبيق. إذا لم يُسجَّل الإيداع بنهاية الجمعة، يُطبَّق خصم ربع يوم من راتبك عن تلك الأسبوع. التكرار يؤثر سلباً على نقاط القيادة." },
    };
    const myRole = lAssign ? (ROLE_KEYS.find(r => lAssign[r] === u.id) || null) : null;
    const roleCard = el("div",{class:"card",style:{marginBottom:"12px",borderColor:"var(--accent,#e8a020)"}});
    roleCard.appendChild(el("div",{style:{fontWeight:"700",fontSize:"13px",marginBottom:"6px",opacity:".7",letterSpacing:"1px",textTransform:"uppercase"}},

    if (myRole) {

        isAR ? info.ar : info.en));

        isAR ? info.descAr : info.descEn));
    } else {
      roleCard.appendChild(el("div",{style:{fontWeight:"600",fontSize:"14px",marginBottom:"4px"}},
        isAR?"لا يوجد دور قيادي مُخصص لك هذا الشهر":"No leadership role assigned this month"));
      roleCard.appendChild(el("div",{class:"muted small"},
        isAR?"النتيجة الافتراضية: 100 نقطة (لا مسؤولية محددة)":"Default score: 100 pts — no specific accountability obligation."));
    }
    wrap.appendChild(roleCard);
  })();

  // Category breakdown
  const catCard = el("div",{class:"card",style:{marginBottom:"12px"}});
  catCard.appendChild(el("div",{style:{fontWeight:"700",fontSize:"14px",marginBottom:"4px"}},isAR?"تفصيل النقاط":"Score Breakdown"));
  const SRC_LABELS = {
    punctuality: isAR?"تلقائي: بصمة الحضور":"Auto: Sign-In Stamp",
    waste:       isAR?"تلقائي: سجل الهدر":"Auto: Waste Log",
    cleanliness: isAR?"تلقائي: سجل النظافة":"Auto: Cleaning Log",
    craft:       isAR?"شهري: تقييمات coffeebeats.art":"Monthly: coffeebeats.art Reviews",
    upselling:   isAR?"شهري: تقرير حجم التذاكر":"Monthly: Ticket Size Report",
    customer:    isAR?"تلقائي: تقييمات العملاء":"Auto: Customer Reviews",
    teamwork:    isAR?"تلقائي: الالتزام بطلبات التوريد":"Auto: Reorder Compliance",
    leadership:  isAR?"تلقائي: دور القيادة الشهري":"Auto: Monthly Leadership Role",
    hygiene:     isAR?"تلقائي: سجل الغرامات":"Auto: Penalty Log",
  };
  catCard.appendChild(el("div",{class:"muted small",style:{marginBottom:"10px"}},
    isAR?"الأخضر = تلقائي من تصرفاتك · الرمادي = يدخله رئيس البريستا شهرياً":"Green = auto-calculated from your actions · Grey = entered monthly by management"));
  cats.forEach(k=>{
    const v = scores[k];
    const label = isAR?KPI_LABELS_AR[k]:KPI_LABELS_EN[k];

    rowDiv.appendChild(barWrap);
    const vEl = v!=null?el("div",{style:{fontWeight:"800",fontSize:"13px",color:kpiScoreColor(v),minWidth:"28px",textAlign:"right"}},String(v)):el("div",{class:"muted small",style:{minWidth:"28px",textAlign:"right"}},"—");
    rowDiv.appendChild(vEl);
    rowDiv.appendChild(el("div",{class:"pill",style:{fontSize:"10px"}},KPI_W()[k]+"%"));
    catCard.appendChild(rowDiv);
  });
  wrap.appendChild(catCard);

  // Rewards summary
  const month = kpiGrade(total,isHead);
  const rwdCard = el("div",{class:"card",style:{marginBottom:"12px",borderColor:total>=90?"gold":total>=80?"silver":"var(--border)"}});
  rwdCard.appendChild(el("div",{style:{fontWeight:"700",fontSize:"14px",marginBottom:"8px"}},isAR?"🎁 مكافأتي هذا الشهر":"🎁 My Monthly Reward"));
  const rwdText = {
    90:{ar:"🥇 ذهبي — يوم إجازة مكافأة + كوبون هدية + أولوية في الجدول",en:"🥇 Gold — Bonus day off · Gift voucher · Priority schedule"},
    80:{ar:"🥈 فضي — كوبون وجبة + تدريب من اختيارك + تهنئة على مستوى الفريق",en:"🥈 Silver — Meal voucher · Training of choice · Team shoutout"},
    70:{ar:"🥉 برونزي — رسالة تقدير + أولوية في الجداول الزمنية",en:"🥉 Bronze — Recognition letter · Schedule preference"},
    0: {ar:"📈 في تطور — حدد هدفاً مع رئيس البريستا هذا الشهر",en:"📈 Rising — Set a growth goal with Head Barista"},
  };
  const tier = total>=90?90:total>=80?80:total>=70?70:0;
  rwdCard.appendChild(el("div",{style:{fontSize:"13px",lineHeight:"1.6"}},isAR?rwdText[tier].ar:rwdText[tier].en));
  wrap.appendChild(rwdCard);

  // Recent logs
  const recent = (state.kpi_logs||[]).filter(l=>l.user_id===u.id).sort((a,b)=>b.at-a.at).slice(0,5);

      el("th",{style:{textAlign:"right"}},isAR?"النظافة":"Clean"),
    ])]));
    const ltb=el("tbody",{});
    recent.forEach(l=>{
      ltb.appendChild(el("tr",{},[
        el("td",{},fmtDay(l.at)),
        el("td",{class:"num",style:{color:kpiScoreColor(l.punctuality||0)}},l.punctuality!=null?String(l.punctuality):"—"),
        el("td",{class:"num",style:{color:kpiScoreColor(l.waste||0)}},l.waste!=null?String(l.waste):"—"),
        el("td",{class:"num",style:{color:kpiScoreColor(l.cleanliness||0)}},l.cleanliness!=null?String(l.cleanliness):"—"),

// ─── PERSONAL HR DASHBOARD (barista/head_barista self-view) ───────────────────
routes.my_hr = function(u, params) {
  const targetId   = (params && params.user_id && u.role === "owner") ? params.user_id : u.id;
  const targetUser = state.users.find(x => x.id === targetId) || u;
  const isAR  = targetUser.role === "barista" || targetUser.role === "head_barista";
  const isHead = targetUser.role === "head_barista";
  const dir   = isAR ? "rtl" : "ltr";
  const wrap  = el("div", { style: { direction: dir } });

  state.salary_config  = state.salary_config  || {};
  state.penalties      = state.penalties      || [];
  state.overtime_logs  = state.overtime_logs  || [];
  state.salary_loans   = state.salary_loans   || [];
  state.leaves         = state.leaves         || [];

  // Header
  const hdr = el("div", { class: "card", style: { textAlign: "center", marginBottom: "12px", background: "var(--ink)", color: "var(--accent-2)" } });
  hdr.appendChild(el("div", { style: { fontSize: "12px", letterSpacing: "2px", opacity: ".7", textTransform: "uppercase", marginBottom: "4px" } }, "Coffee Beats · ملخص الراتب والإجازات"));
  hdr.appendChild(el("div", { style: { fontSize: "20px", fontWeight: "800" } }, targetUser.name));
  if (targetUser.name_ar) {
    hdr.appendChild(el("div", { style: { fontSize: "16px", fontWeight: "600", marginTop: "2px", fontFamily: "'Noto Sans Arabic','Geeza Pro',serif", direction: "rtl" } }, targetUser.name_ar));
  }
  hdr.appendChild(el("div", { style: { fontSize: "13px", opacity: ".8", marginTop: "4px" } }, isHead ? "⭐ رئيس بريستا" : "بريستا"));
  wrap.appendChild(hdr);

  // Month selector
  const nowMonth = new Date().toISOString().slice(0, 7);
  let selMonth = nowMonth;
  const monthNav = el("div", { class: "card", style: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "12px" } });
  const prevBtn = el("button", { class: "btn ghost", style: { fontSize: "18px", padding: "4px 12px" } }, "‹");
  const nextBtn = el("button", { class: "btn ghost", style: { fontSize: "18px", padding: "4px 12px" } }, "›");
  const monthLbl = el("div", { style: { fontWeight: "700", fontSize: "15px" } }, selMonth);
  monthNav.appendChild(prevBtn);
  monthNav.appendChild(monthLbl);
  monthNav.appendChild(nextBtn);
  wrap.appendChild(monthNav);

  const body = el("div", {});
  wrap.appendChild(body);
  wrap.appendChild(btnBack());

  function shiftMonth(delta) {
    const [y, m] = selMonth.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    selMonth = d.toISOString().slice(0, 7);
    monthLbl.textContent = selMonth;
    drawBody();
  }
  prevBtn.addEventListener("click", () => shiftMonth(-1));
  nextBtn.addEventListener("click", () => shiftMonth(1));

  function drawBody() {
    body.innerHTML = "";
    const uid     = targetUser.id;
    const salary  = getSalaryForMonth(uid, selMonth);
    const monthFn = x => (x.month || (x.date || "").slice(0, 7)) === selMonth;
    const penList  = state.penalties.filter(x => x.user_id === uid && monthFn(x));
    const otList   = state.overtime_logs.filter(x => x.user_id === uid && monthFn(x));
    const loanList = state.salary_loans.filter(x => x.user_id === uid && monthFn(x));
    const penSum   = penList.reduce((s, r) => s + (Number(r.amount) || 0), 0);
    const otSum    = otList.reduce((s, r) => s + (Number(r.amount) || 0), 0);
    const otHrs    = otList.reduce((s, r) => s + (Number(r.hours) || 0), 0);
    const loanSum  = loanList.reduce((s, r) => s + (Number(r.amount) || 0), 0);
    const netDue   = Math.max(0, salary + otSum - penSum - loanSum);
    const netColor = netDue >= salary ? "var(--ok)" : netDue >= salary * 0.85 ? "var(--warn)" : "var(--bad)";

    // Section A — Pay Summary
    const payCard = el("div", { class: "card", style: { marginBottom: "12px" } });
    payCard.appendChild(el("div", { style: { fontWeight: "700", fontSize: "14px", marginBottom: "10px" } }, isAR ? "💳 ملخص الراتب" : "💳 Pay Summary"));
    const rows = [
      [isAR ? "الراتب الأساسي" : "Base Salary", money(salary), ""],
      [isAR ? `أوفرتايم (${otHrs}h)` : `Overtime (${otHrs}h)`, "+" + money(otSum), "var(--ok)"],
      [isAR ? "الخصومات" : "Penalties", "−" + money(penSum), penSum > 0 ? "var(--bad)" : ""],
      [isAR ? "سلف" : "Loans", "−" + money(loanSum), loanSum > 0 ? "var(--warn)" : ""],
    ];
    rows.forEach(([k, v, c]) => {
      const row = el("div", { class: "kv" });
      row.appendChild(el("div", { class: "k" }, k));
      row.appendChild(el("div", { class: "v", style: c ? { color: c } : {} }, v));
      payCard.appendChild(row);
    });
    const netRow = el("div", { class: "kv", style: { borderTop: "2px solid var(--border)", marginTop: "8px", paddingTop: "8px" } });
    netRow.appendChild(el("div", { style: { fontWeight: "800", fontSize: "15px" } }, isAR ? "صافي المستحق" : "Net Due"));
    netRow.appendChild(el("div", { style: { fontWeight: "800", fontSize: "18px", color: netColor } }, money(netDue)));
    payCard.appendChild(netRow);
    body.appendChild(payCard);

    // Section B — KPI Reward
    const scores = kpiGetUserScores(uid);
    const total  = scores ? kpiCalcTotal(scores) : 0;
    const rwdCard = el("div", { class: "card", style: { marginBottom: "12px" } });
    rwdCard.appendChild(el("div", { style: { fontWeight: "700", fontSize: "14px", marginBottom: "8px" } }, isAR ? "🏆 مكافأة الأداء" : "🏆 KPI Reward"));
    const tier = total >= 90 ? 90 : total >= 80 ? 80 : total >= 70 ? 70 : 0;
    const badges = { 90: "🥇 ذهبي", 80: "🥈 فضي", 70: "🥉 برونزي", 0: "📈 في تطور" };
    const rwdDescs = {
      90: isAR ? "يوم إجازة مكافأة + كوبون هدية + أولوية في الجدول" : "Bonus day off · Gift voucher · Priority schedule",
      80: isAR ? "كوبون وجبة + تدريب من اختيارك + تهنئة على مستوى الفريق" : "Meal voucher · Training of choice · Team shoutout",
      70: isAR ? "رسالة تقدير + أولوية في الجداول" : "Recognition letter · Schedule preference",
      0:  isAR ? "حدد هدفاً مع رئيس البريستا هذا الشهر" : "Set a growth goal with Head Barista",
    };
    rwdCard.appendChild(el("div", { style: { fontSize: "22px", fontWeight: "800", color: kpiScoreColor(total), marginBottom: "4px" } }, badges[tier] + "  " + total.toFixed(0) + "/100"));
    rwdCard.appendChild(el("div", { class: "muted", style: { fontSize: "13px", marginBottom: "8px" } }, rwdDescs[tier]));
    rwdCard.appendChild(el("button", { class: "btn secondary", style: { fontSize: "12px", padding: "7px 12px" }, onClick: () => go("my_scorecard") }, isAR ? "← تفاصيل الأداء الكاملة" : "Full performance breakdown →"));
    body.appendChild(rwdCard);

    // Section C — Penalties
    const penCard = el("div", { class: "card", style: { marginBottom: "12px" } });
    penCard.appendChild(el("div", { style: { fontWeight: "700", fontSize: "14px", marginBottom: "8px" } }, isAR ? "⚖ الخصومات" : "⚖ Penalties"));
    if (penList.length === 0) {
      penCard.appendChild(el("div", { class: "muted", style: { fontSize: "13px" } }, isAR ? "✅ لا توجد خصومات هذا الشهر" : "✅ No penalties this month"));
    } else {
      const t = el("table", {});
      t.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", {}, isAR ? "التاريخ" : "Date"),
        el("th", {}, isAR ? "السبب" : "Reason"),
        el("th", {}, isAR ? "النوع" : "Type"),
        el("th", { style: { textAlign: "right" } }, isAR ? "المبلغ" : "Amount"),
      ])]));
      const tb = el("tbody", {});
      penList.forEach(r => tb.appendChild(el("tr", {}, [
        el("td", {}, r.date || ""),
        el("td", {}, r.reason || r.note || "—"),
        el("td", {}, r.type || "—"),
        el("td", { class: "num", style: { color: "var(--bad)" } }, "−" + money(r.amount)),
      ])));
      t.appendChild(tb);
      penCard.appendChild(t);
    }
    body.appendChild(penCard);

    // Section D — Overtime
    const otCard = el("div", { class: "card", style: { marginBottom: "12px" } });
    otCard.appendChild(el("div", { style: { fontWeight: "700", fontSize: "14px", marginBottom: "8px" } }, isAR ? "⏱ الأوفرتايم" : "⏱ Overtime"));
    if (otList.length === 0) {
      otCard.appendChild(el("div", { class: "muted", style: { fontSize: "13px" } }, isAR ? "لا يوجد أوفرتايم هذا الشهر" : "No overtime this month"));
    } else {
      const t = el("table", {});
      t.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", {}, isAR ? "التاريخ" : "Date"),
        el("th", {}, isAR ? "النوع" : "Type"),
        el("th", {}, isAR ? "الساعات" : "Hours"),
        el("th", { style: { textAlign: "right" } }, isAR ? "المبلغ" : "Amount"),
        el("th", {}, isAR ? "الحالة" : "Status"),
      ])]));
      const tb = el("tbody", {});
      otList.forEach(r => {

    // Section F — Leaves
    const thisYear = selMonth.slice(0, 4);
    const allLeaves = state.leaves.filter(x => x.user_id === uid);
    const annualUsed = allLeaves
      .filter(x => x.status === "approved" && x.type === "annual" && (x.from_date || "").startsWith(thisYear))
      .reduce((s, x) => s + Math.round((new Date(x.to_date) - new Date(x.from_date)) / 86400000) + 1, 0);
    const sickUsed = allLeaves
      .filter(x => x.status === "approved" && x.type === "sick" && (x.from_date || "").startsWith(thisYear))
      .reduce((s, x) => s + Math.round((new Date(x.to_date) - new Date(x.from_date)) / 86400000) + 1, 0);
    const pending  = allLeaves.filter(x => x.status === "pending").sort((a, b) => b.requested_at.localeCompare(a.requested_at));
    const recent   = allLeaves.filter(x => x.status !== "pending").sort((a, b) => b.requested_at.localeCompare(a.requested_at)).slice(0, 5);

    const lvCard = el("div", { class: "card", style: { marginBottom: "12px" } });
    lvCard.appendChild(el("div", { style: { fontWeight: "700", fontSize: "14px", marginBottom: "10px" } }, isAR ? "🌴 الإجازات" : "🌴 Leaves"));
    const lvStats = el("div", { class: "grid c2", style: { gap: "8px", marginBottom: "10px" } });
    [
      [isAR ? `إجازة سنوية مستخدمة (${thisYear})` : `Annual used (${thisYear})`, annualUsed + (isAR ? " يوم" : " days")],
      [isAR ? `إجازة مرضية (${thisYear})` : `Sick used (${thisYear})`, sickUsed + (isAR ? " يوم" : " days")],
    ].forEach(([k, v]) => {
      const c = el("div", { class: "card", style: { padding: "10px", textAlign: "center" } });
      c.appendChild(el("div", { class: "muted", style: { fontSize: "11px", marginBottom: "4px" } }, k));
      c.appendChild(el("div", { style: { fontWeight: "800", fontSize: "16px" } }, String(v)));
      lvStats.appendChild(c);
    });
    lvCard.appendChild(lvStats);
    if (pending.length) {
      lvCard.appendChild(el("div", { style: { fontWeight: "600", fontSize: "13px", marginBottom: "6px" } }, isAR ? "⏳ طلبات معلقة" : "⏳ Pending requests"));
      pending.forEach(x => {
        const typeLabel = x.type === "annual" ? (isAR ? "سنوية" : "Annual") : (isAR ? "مرضية" : "Sick");
        lvCard.appendChild(el("div", { class: "muted small", style: { marginBottom: "4px" } }, `${typeLabel} · ${x.from_date} → ${x.to_date}`));
      });
    }
    if (recent.length) {
      lvCard.appendChild(el("div", { style: { fontWeight: "600", fontSize: "13px", margin: "8px 0 4px" } }, isAR ? "السجل الأخير" : "Recent"));
      recent.forEach(x => {
        const statusIcon = x.status === "approved" ? "✅" : "❌";
        const typeLabel  = x.type === "annual" ? (isAR ? "سنوية" : "Annual") : (isAR ? "مرضية" : "Sick");
        lvCard.appendChild(el("div", { class: "muted small", style: { marginBottom: "4px" } }, `${statusIcon} ${typeLabel} · ${x.from_date} → ${x.to_date}`));
      });
    }
    lvCard.appendChild(el("button", { class: "btn secondary", style: { marginTop: "8px", fontSize: "12px", padding: "7px 12px" }, onClick: () => go("leave_new") }, isAR ? "🌴 طلب إجازة" : "🌴 Request leave"));
    body.appendChild(lvCard);
  }

  drawBody();
  return wrap;
};

// ─── STAFF HR OVERVIEW (owner / head_barista / accountant) ────────────────────
routes.staff_hr = function(u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Staff HR Overview", "Monthly payroll, penalties, loans, KPI and leave summary. Archived staff remain visible in past months."));

  if (!["owner", "accountant", "head_barista"].includes(u.role)) {
    wrap.appendChild(el("div", { class: "card" }, "Access restricted."));
    wrap.appendChild(btnBack());
    return wrap;
  }

  state.salary_config  = state.salary_config  || {};
  state.penalties      = state.penalties      || [];
  state.overtime_logs  = state.overtime_logs  || [];
  state.salary_loans   = state.salary_loans   || [];
  state.leaves         = state.leaves         || [];

  const nowMonth = new Date().toISOString().slice(0, 7);
  let selMonth = nowMonth;

  const monthNav = el("div", { class: "card", style: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "12px" } });
  const prevBtn  = el("button", { class: "btn ghost", style: { fontSize: "18px", padding: "4px 12px" } }, "‹");
  const nextBtn  = el("button", { class: "btn ghost", style: { fontSize: "18px", padding: "4px 12px" } }, "›");
  const monthLbl = el("div", { style: { fontWeight: "700", fontSize: "15px" } }, selMonth);
  monthNav.appendChild(prevBtn);
  monthNav.appendChild(monthLbl);
  monthNav.appendChild(nextBtn);
  wrap.appendChild(monthNav);

  const body = el("div", {});
  wrap.appendChild(body);
  wrap.appendChild(btnBack());

  function shiftMonth(delta) {
    const [y, m] = selMonth.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    selMonth = d.toISOString().slice(0, 7);
    monthLbl.textContent = selMonth;
    drawBody();
  }
  prevBtn.addEventListener("click", () => shiftMonth(-1));
  nextBtn.addEventListener("click", () => shiftMonth(1));

  function drawBody() {
    body.innerHTML = "";
    const monthFn = x => (x.month || (x.date || "").slice(0, 7)) === selMonth;
    const isPast  = selMonth < nowMonth;

    // Active baristas + archived baristas who have any payroll record in this month
    // (or any salary configured, when viewing a past month — preserves full history)
    const staff = state.users.filter(x => {
      if (!["barista","head_barista"].includes(x.role)) return false;
      if (x.active) return true;
      if (!isPast)  return false; // never show archived for current month
      return !!(state.salary_config[x.id])
        || state.penalties.some(r => r.user_id === x.id && monthFn(r))
        || state.overtime_logs.some(r => r.user_id === x.id && monthFn(r))
        || state.salary_loans.some(r => r.user_id === x.id && monthFn(r))
        || state.salaries.some(r => r.user_id === x.id && monthFn(r));
    });
    const archivedCount = staff.filter(x => !x.active).length;

    // Summary stat cards
    let totalPayroll = 0, totalPen = 0, totalOT = 0;
    const staffData = staff.map(p => {
      const salary  = getSalaryForMonth(p.id, selMonth);
      const penSum  = state.penalties.filter(x => x.user_id === p.id && monthFn(x)).reduce((s, r) => s + (Number(r.amount) || 0), 0);
      const otSum   = state.overtime_logs.filter(x => x.user_id === p.id && monthFn(x)).reduce((s, r) => s + (Number(r.amount) || 0), 0);
      const loanSum = state.salary_loans.filter(x => x.user_id === p.id && monthFn(x)).reduce((s, r) => s + (Number(r.amount) || 0), 0);
      const netDue  = Math.max(0, salary + otSum - penSum - loanSum);
      const scores  = kpiGetUserScores(p.id);
      const kpiTotal = scores ? kpiCalcTotal(scores) : 0;
      const thisYear = selMonth.slice(0, 4);
      const lvDays  = (state.leaves || [])
        .filter(x => x.user_id === p.id && x.status === "approved" && x.type === "annual" && (x.from_date || "").startsWith(thisYear))
        .reduce((s, x) => s + Math.round((new Date(x.to_date) - new Date(x.from_date)) / 86400000) + 1, 0);
      totalPayroll += netDue;
      totalPen     += penSum;
      totalOT      += otSum;
      return { p, salary, penSum, otSum, loanSum, netDue, kpiTotal, lvDays };
    });

    const statsRow = el("div", { class: "grid c2", style: { gap: "8px", marginBottom: "12px" } });
    [
      ["👥 Staff" + (archivedCount ? ` (${archivedCount} archived)` : ""), String(staff.length)],
      ["💰 Total Payroll", money(totalPayroll)],
      ["⚖ Total Penalties", money(totalPen)],
      ["⏱ Total Overtime", money(totalOT)],
    ].forEach(([k, v]) => {
      const c = el("div", { class: "card", style: { padding: "12px", textAlign: "center" } });
      c.appendChild(el("div", { class: "muted", style: { fontSize: "11px", marginBottom: "4px" } }, k));
      c.appendChild(el("div", { style: { fontWeight: "800", fontSize: "16px" } }, v));
      statsRow.appendChild(c);
    });
    body.appendChild(statsRow);

    // Staff table
    const tableCard = el("div", { class: "card" });
    const t = el("table", {});
    t.appendChild(el("thead", {}, [el("tr", {}, [
      el("th", {}, "Name"),
      el("th", {}, "Role"),
      el("th", { style: { textAlign: "right" } }, "Base"),
      el("th", { style: { textAlign: "right" } }, "OT"),
      el("th", { style: { textAlign: "right" } }, "Penalties"),
      el("th", { style: { textAlign: "right" } }, "Loans"),
      el("th", { style: { textAlign: "right" } }, "Net Due"),
      el("th", { style: { textAlign: "center" } }, "KPI"),
      el("th", { style: { textAlign: "center" } }, "Leave Days"),
    ])]));
    const tb = el("tbody", {});
    let grandBase = 0, grandOT = 0, grandPen = 0, grandLoan = 0, grandNet = 0;
    staffData.forEach(({ p, salary, penSum, otSum, loanSum, netDue, kpiTotal, lvDays }) => {
      grandBase += salary; grandOT += otSum; grandPen += penSum; grandLoan += loanSum; grandNet += netDue;
      const netColor = netDue >= salary ? "var(--ok)" : netDue >= salary * 0.85 ? "var(--warn)" : "var(--bad)";
      const archivedStyle = p.active ? "" : "opacity:.55;font-style:italic";
      const tr = el("tr", { style: { cursor: "pointer" + (archivedStyle ? ";" + archivedStyle : "") }, onClick: () => go("my_hr", { user_id: p.id }) }, [
        el("td", { style: { fontWeight: "600" } }, p.name + (p.active ? "" : " (archived)")),
        el("td", { class: "muted small" }, p.role === "head_barista" ? "Head" : "Barista"),
        el("td", { class: "num" }, money(salary)),
        el("td", { class: "num", style: { color: "var(--ok)" } }, otSum ? "+" + money(otSum) : "—"),
        el("td", { class: "num", style: { color: penSum ? "var(--bad)" : "" } }, penSum ? "−" + money(penSum) : "—"),
        el("td", { class: "num", style: { color: loanSum ? "var(--warn)" : "" } }, loanSum ? "−" + money(loanSum) : "—"),
        el("td", { class: "num", style: { fontWeight: "700", color: netColor } }, money(netDue)),
        el("td", { style: { textAlign: "center", fontSize: "12px", fontWeight: "700", color: kpiScoreColor(kpiTotal) } }, kpiTotal ? kpiGradeEn(kpiTotal).split(" ")[0] + " " + kpiTotal.toFixed(0) : "—"),
        el("td", { style: { textAlign: "center" } }, lvDays ? String(lvDays) + "d" : "—"),
      ]);
      tb.appendChild(tr);
    });
    // Grand total row
    const totalTr = el("tr", { style: { borderTop: "2px solid var(--border)", fontWeight: "800" } }, [
      el("td", { colspan: "2", style: { fontWeight: "800" } }, "Total"),
      el("td", { class: "num" }, money(grandBase)),
      el("td", { class: "num" }, money(grandOT)),
      el("td", { class: "num" }, money(grandPen)),
      el("td", { class: "num" }, money(grandLoan)),
      el("td", { class: "num", style: { color: "var(--ok)" } }, money(grandNet)),
      el("td", {}), el("td", {}),
    ]);
    tb.appendChild(totalTr);
    t.appendChild(tb);
    tableCard.appendChild(t);
    body.appendChild(tableCard);
  }

  drawBody();
  return wrap;
};
