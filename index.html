routes.dashboard = function (u, params) {
  const wrap = el("div", {});
  wrap.appendChild(header("Dashboards", "Revenue, COGS, overheads, gross + net profit."));

  // Normalize each sales row's branch to canonical maadi/zawya for reliable filtering.
  // (An imported row tagged "Zawya - Cairo" or similar still matches even if the stored
  // value wasn't normalized at import time.)
  const branchKey = (b) => {
    const s = String(b || "").trim().toLowerCase();
    if (s.includes("zawya")) return "zawya";
    if (s.includes("maadi")) return "maadi";
    return s;
  };

  // Index every sale by canonical branch + month so we can show the user
  // exactly what data is loaded — the dashboard used to look empty even
  // though data was imported, because filter comparisons were case-sensitive.
  const salesIndex = new Map(); // key "branch|YYYY-MM" -> count
  const monthSet = new Set();
  const branchSet = new Set();
  for (const s of state.sales) {
    const b = branchKey(s.branch);
    // Strip Zawya concession items at runtime so they never appear in any report
    if (b === "zawya" && isZawyaExcluded(s.category, s.item)) continue;
    const m = normalizeDate(s.date).slice(0,7);
    if (!m) continue;
    monthSet.add(m); branchSet.add(b);
    const k = b + "|" + m;
    salesIndex.set(k, (salesIndex.get(k) || 0) + 1);
  }
  const salesMonths = [...monthSet].sort();
  const latestSalesMonth = salesMonths[salesMonths.length - 1];

  let branch = branchKey((params && params.branch) || (u.branches && u.branches[0]) || "maadi");
  // Multi-month range — default to latest available month (or current)
  const _defaultMonth = latestSalesMonth || (new Date()).toISOString().slice(0,7);
  let monthFrom = (params && params.month) || _defaultMonth;
  let monthTo   = (params && params.month) || _defaultMonth;

  const nav = makeBranchPicker(["maadi","zawya","events"], () => branch, b => { branch = b; eventCard.style.display = b === "events" ? "" : "none"; draw(); });
  wrap.appendChild(nav);

  // ---- Events config card (only visible when Events tab is active) ----
  const eventCard = el("div", { class: "card", style: { marginTop: "10px", display: branch === "events" ? "" : "none", borderColor: "var(--accent-2)" } });
  eventCard.appendChild(el("h2", {}, "🎪 External Event"));
  const _ec = (state.events_config && state.events_config[0]) || {};
  const evNameIn = el("input", { type: "text", placeholder: "Display name (e.g. Alma Market, El Gouna Festival)", value: _ec.name || "",
    style: { width: "100%", padding: "8px", borderRadius: "8px", border: "1px solid var(--border)", boxSizing: "border-box", marginBottom: "8px" } });
  const evNotesIn = el("textarea", { placeholder: "Notes (optional) — location, organiser, anything useful", rows: 2,
    style: { width: "100%", padding: "8px", borderRadius: "8px", border: "1px solid var(--border)", boxSizing: "border-box", marginBottom: "8px" } });
  evNotesIn.value = _ec.notes || "";

  // Dates display — auto-pulled from state.special_dates (branch="events") in the selected range
  const evDatesDisplay = el("div", { style: { marginBottom: "8px" } });

  // Sync from Google Calendar button
  const calSyncStatus = el("div", { class: "muted small", style: { marginTop: "6px" } });
  const calSyncBtn = el("button", { class: "btn ghost", style: { marginTop: "6px" } }, "📅 Sync from Google Calendar");
  calSyncBtn.addEventListener("click", async () => {
    calSyncBtn.disabled = true;
    calSyncStatus.textContent = "⏳ Fetching…";
    try {
      const from = monthFrom + "-01";
      const toDate = new Date(monthTo + "-01"); toDate.setMonth(toDate.getMonth() + 1); toDate.setDate(toDate.getDate() - 1);
      const to = toDate.toISOString().slice(0,10);
      const fetched = await fetchCalEventsRange(from, to);
      let added = 0;
      for (const ev of fetched) {
        const exists = (state.special_dates || []).some(e => e.branch === "events" && e.date === ev.date && e.title === ev.summary);
        if (!exists) {
          const s = stamp();
          state.special_dates.push({ id: uuid(), date: ev.date, branch: "events", title: ev.summary, note: "", by: s.by, by_name: s.by_name, at: s.at });
          added++;
        }
      }
      saveState();
      calSyncStatus.textContent = fetched.length === 0 ? "✅ No events found in this date range on the calendar." : `✅ ${fetched.length} event day(s) found · ${added} new added.`;
      renderEvDates();
      draw();
    } catch (e) {
      calSyncStatus.textContent = `❌ ${e.message}`;
    }
    calSyncBtn.disabled = false;
  });

  function renderEvDates() {
    evDatesDisplay.innerHTML = "";
    const evDates = (state.special_dates || []).filter(e => e.branch === "events").sort((a,b) => a.date.localeCompare(b.date));
    if (evDates.length === 0) {
      evDatesDisplay.appendChild(el("div", { class: "muted small" }, "No event dates found. Click \"Sync from Google Calendar\" or add them via the Schedule page → Special dates."));
      return;
    }
    evDatesDisplay.appendChild(el("div", { class: "muted small", style: { marginBottom: "4px" } },
      `${evDates.length} event day(s) in the app (showing all — date range filter applies on the dashboard):`));
    const pills = el("div", { style: { display: "flex", flexWrap: "wrap", gap: "6px" } });
    for (const e of evDates) {
      const chip = el("span", { class: "chip" }, `${e.date}${e.title ? " · " + e.title : ""}`);
      pills.appendChild(chip);
    }
    evDatesDisplay.appendChild(pills);
  }

  const saveEvBtn = el("button", { class: "btn", onClick: () => {
    state.events_config = [{ name: evNameIn.value.trim(), notes: evNotesIn.value.trim() }];
    saveState();
    toast("Event config saved");
    draw();
  }}, "Save label & notes");

  eventCard.appendChild(el("div", { class: "muted small", style: { marginBottom: "8px" } },
    "Event dates are pulled automatically from the Calendar in the Schedule page. Use the button below to sync any new dates."));
  eventCard.appendChild(evNameIn);
  eventCard.appendChild(el("div", { class: "muted small", style: { marginBottom: "4px" } }, "Notes:"));
  eventCard.appendChild(evNotesIn);
  eventCard.appendChild(saveEvBtn);
  eventCard.appendChild(el("div", { class: "hr", style: { margin: "12px 0" } }));
  eventCard.appendChild(evDatesDisplay);
  eventCard.appendChild(calSyncBtn);
  eventCard.appendChild(calSyncStatus);
  renderEvDates();
  wrap.appendChild(eventCard);

  // ---- Date range picker ----
  const rangeCard = el("div", { class: "card", style: { marginTop: "10px", display: "flex", flexWrap: "wrap", gap: "14px", alignItems: "flex-end" } });
  const mFromInput = el("input", { type: "month", value: monthFrom, style: { flex: "1", minWidth: "160px" } });
  const mToInput   = el("input", { type: "month", value: monthTo,   style: { flex: "1", minWidth: "160px" } });
  mFromInput.addEventListener("input", () => {
    monthFrom = mFromInput.value;
    // ensure from <= to
    if (monthTo < monthFrom) { monthTo = monthFrom; mToInput.value = monthTo; }
    draw();
  });
  mToInput.addEventListener("input", () => {
    monthTo = mToInput.value;
    // cap range to 12 months
    const fromDate = new Date(monthFrom + "-01");
    const toDate   = new Date(monthTo   + "-01");
    const diffMonths = (toDate.getFullYear() - fromDate.getFullYear()) * 12 + (toDate.getMonth() - fromDate.getMonth());
    if (diffMonths > 11) {
      const capped = new Date(fromDate); capped.setMonth(capped.getMonth() + 11);
      monthTo = capped.toISOString().slice(0,7);
      mToInput.value = monthTo;
    }
    if (monthTo < monthFrom) { monthTo = monthFrom; mToInput.value = monthTo; }
    draw();
  });
  rangeCard.appendChild(el("div", { style: { flex: "1", minWidth: "160px" } }, [
    el("label", { style: { display: "block", fontSize: "13px", color: "var(--ink-dim)", marginBottom: "4px" } }, "From month"),
    mFromInput,
  ]));
  rangeCard.appendChild(el("div", { style: { flex: "1", minWidth: "160px" } }, [
    el("label", { style: { display: "block", fontSize: "13px", color: "var(--ink-dim)", marginBottom: "4px" } }, "To month (max 12 months)"),
    mToInput,
  ]));
  // Quick-select buttons
  const quickBtns = el("div", { style: { display: "flex", gap: "6px", flexWrap: "wrap" } });
  const addQuick = (label, from, to) => {
    quickBtns.appendChild(el("button", { class: "chip", onClick: () => {
      monthFrom = from; monthTo = to;
      mFromInput.value = monthFrom; mToInput.value = monthTo; draw();
    }}, label));
  };
  // Build quick selects from available months
  if (salesMonths.length) {
    const last = salesMonths[salesMonths.length - 1];
    const prev = salesMonths.length >= 2 ? salesMonths[salesMonths.length - 2] : last;
    addQuick("Latest month", last, last);
    if (prev !== last) addQuick("Last 2 months", prev, last);
    if (salesMonths.length >= 3) addQuick("Last 3 months", salesMonths[salesMonths.length - 3], last);
    if (salesMonths.length >= 6) addQuick("Last 6 months", salesMonths[salesMonths.length - 6], last);
    if (salesMonths.length > 1)  addQuick("All data", salesMonths[0], last);
  }
  rangeCard.appendChild(el("div", { style: { width: "100%" } }, [
    el("div", { style: { fontSize: "12px", color: "var(--ink-faint)", marginBottom: "4px" } }, "Quick select"),
    quickBtns,
  ]));
  wrap.appendChild(rangeCard);

  // ---------- DATA COVERAGE DIAGNOSTIC ----------
  const diag = el("div", { class: "card", style: { marginTop: "10px", borderColor: "var(--accent)" } });
  wrap.appendChild(diag);

  const body = el("div", {});
  wrap.appendChild(body);

  // Helper: all months in [from, to] range
  function monthsInRange(from, to) {
    const result = [];
    let cur = new Date(from + "-01");
    const end = new Date(to + "-01");
    while (cur <= end) {
      result.push(cur.toISOString().slice(0,7));
      cur.setMonth(cur.getMonth() + 1);
    }
    return result;
  }

  function draw() {
    // Recompute salesMonths in case new data was added
    const currentMonths = [...monthSet].sort();

    // diagnostic
    diag.innerHTML = "";
    diag.appendChild(el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } }, "Sales data in the app"));
    const rangeMonths = monthsInRange(monthFrom, monthTo);
    const rangeLabel = monthFrom === monthTo ? monthFrom : `${monthFrom} → ${monthTo} (${rangeMonths.length} months)`;
    if (branch === "events") {
      const evName = _evCfg.name || "Events";
      const evDayCount = _evDays.size;
      // Get full event entries for display (with titles)
      const _evEntries = (state.special_dates || [])
        .filter(e => e.branch === "events" && e.date >= monthFrom + "-01" && e.date <= monthTo + "-31")
        .sort((a,b) => a.date.localeCompare(b.date));
      diag.appendChild(el("div", { style: { fontSize: "20px", fontWeight: "700" } }, `🎪 ${evName}`));
      diag.appendChild(el("div", { class: "muted small", style: { marginTop: "4px" } },
        evDayCount ? `${evDayCount} event day(s) in range · sourced from Maadi sales data` : "No event dates in this range — sync from Calendar or add them in Schedule → Special Dates"));
      if (_evCfg.notes) diag.appendChild(el("div", { class: "muted small" }, _evCfg.notes));
      if (evDayCount) {
        const pills = el("div", { style: { display: "flex", flexWrap: "wrap", gap: "6px", marginTop: "8px" } });
        _evEntries.forEach(e => pills.appendChild(el("span", { class: "chip" }, `${e.date}${e.title ? " · " + e.title : ""}`)));
        diag.appendChild(pills);
      }
    } else {
      diag.appendChild(el("div", { style: { fontSize: "20px", fontWeight: "700" } },
        `${state.sales.length} total rows · ${branchSet.size} branches · ${currentMonths.length} months stored`));
      diag.appendChild(el("div", { class: "muted small", style: { marginTop: "4px" } }, `Showing: ${rangeLabel}`));
    }
    if (branch !== "events") {
      if (currentMonths.length) {
        const combos = [...salesIndex.entries()].map(([k,count]) => { const [b,m]=k.split("|"); return { b, m, count }; })
          .sort((a,bb) => bb.m.localeCompare(a.m) || a.b.localeCompare(bb.b));
        const pills = el("div", { style: { display: "flex", flexWrap: "wrap", gap: "6px", marginTop: "8px" } });
        for (const c of combos.slice(0, 24)) {
          const inSel = (c.b === branch && c.m >= monthFrom && c.m <= monthTo);
          pills.appendChild(el("button", {
            class: "chip",
            style: inSel ? { background: "var(--accent)", color: "#2b1810", fontWeight: "700" } : {},
            onClick: () => { branch = c.b; monthFrom = c.m; monthTo = c.m; mFromInput.value = c.m; mToInput.value = c.m; draw(); },
          }, `${c.b} · ${c.m} (${c.count})`));
        }
        diag.appendChild(pills);
      } else {
        diag.appendChild(el("div", { class: "muted small", style: { marginTop: "6px" } }, "No sales uploaded yet. Use Upload Sales (POS) to add a CSV."));
      }
    }

    body.innerHTML = "";
    const monthStart    = monthFrom + "-01";
    const nextMonthStart = (() => { const d = new Date(monthTo + "-01"); d.setMonth(d.getMonth()+1); return d.toISOString().slice(0,10); })();

    // filter — case-insensitive branch + date range
    const inRange = (d) => { const nd = normalizeDate(d).slice(0,7); return nd >= monthFrom && nd <= monthTo; };

    // Events branch: use Maadi sales filtered to special_dates where branch="events"
    const _evCfg = (state.events_config && state.events_config[0]) || {};
    // Collect all event dates from special_dates (branch="events") within the selected range
    const _evDays = new Set(
      (state.special_dates || [])
        .filter(e => e.branch === "events" && e.date >= monthFrom + "-01" && e.date <= monthTo + "-31")
        .map(e => e.date)
    );
    const _isEventDay = (d) => _evDays.has(normalizeDate(d).slice(0,10));

    // Filter by branch + date, and strip Zawya concession items from all calculations at runtime
    const sales = state.sales.filter(s => {
      if (branch === "events") return branchKey(s.branch) === "maadi" && _isEventDay(s.date);
      return branchKey(s.branch) === branch && inRange(s.date) && !(branch === "zawya" && isZawyaExcluded(s.category, s.item));
    });
    const waste = branch === "events"
      ? state.waste.filter(w => branchKey(w.branch) === "maadi" && _isEventDay((w.at||"").slice(0,10)))
      : state.waste.filter(w => branchKey(w.branch) === branch && (w.at||"").slice(0,7) >= monthFrom && (w.at||"").slice(0,7) <= monthTo);
    const purch = branch === "events"
      ? state.purchases.filter(p => branchKey(p.branch) === "maadi" && _isEventDay(p.date))
      : state.purchases.filter(p => branchKey(p.branch) === branch && inRange(p.date));

    // Empty-state: tell the user exactly what went wrong if their current filter has no data
    if (sales.length === 0 && state.sales.length > 0) {
      const emptyMsg = branch === "events"
        ? (_evDays.size === 0 ? "No event dates in this range. Sync from Google Calendar or add them in Schedule → Special Dates." : `No Maadi sales found for the event date(s) in this range. Make sure Maadi sales are imported for those days.`)
        : `No sales for ${branch} · ${rangeLabel}. Tap one of the pills above to jump to data you have.`;
      body.appendChild(el("div", { class: "banner-arch", style: { borderColor: "var(--bad)", color: "var(--bad)", fontWeight: "700" } }, emptyMsg));
    }

    const revenue = sales.reduce((s,r) => s + (Number(r.net_sales)||0), 0);
    const discount = sales.reduce((s,r) => s + ((Number(r.gross_sales)||0) - (Number(r.net_sales)||0)), 0);
    const purchTotal = purch.reduce((s,p) => s + (Number(p.total)||0), 0);

    // COGS from sales × menu cost (normalized name match)
    const normName = (s) => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\([^)]*\)/g," ").replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();
    const menuByName = new Map(state.menu.map(m => [normName(m.name), m]));

    // Use actual quantities from order_items (File 2) when available — more accurate than qty=1 default
    // For events: filter Maadi order_items by exact event date (extracted from order_ref).
    // For regular branches: filter by branch + month range.
    const orderItemsInRange = branch === "events"
      ? (state.order_items || []).filter(i => i.branch === "maadi" && _isEventDay(i.date || i.month + "-15"))
      : (state.order_items || []).filter(i => i.branch === branch && i.month >= monthFrom && i.month <= monthTo);
    const qtyByItem = new Map();
    for (const i of orderItemsInRange) {
      const k = normName(i.name);
      qtyByItem.set(k, (qtyByItem.get(k)||0) + (Number(i.qty)||1));
    }
    const hasOrderItems = qtyByItem.size > 0;

    let cogsSales = 0, matched = 0, unmatched = 0;
    for (const r of sales) {
      const key = normName(r.item);
      const qty = hasOrderItems ? (qtyByItem.get(key) || 0) : (Number(r.qty)||0);
      const m = menuByName.get(key);
      if (m && m.cost_egp) { cogsSales += qty * (Number(m.cost_egp)||0); matched += qty; }
      else unmatched += qty;
    }

    function lastUnitCost(inv_item_id) {
      let last = null, lastAt = "";
      for (const p of state.purchases) for (const ln of p.lines) {
        if (ln.inv_item_id === inv_item_id && p.at > lastAt) { last = Number(ln.unit_cost)||0; lastAt = p.at; }
      }
      return last;
    }
    let wasteCost = 0;
    for (const w of waste) {
      const c = lastUnitCost(w.inv_item_id);
      if (c != null) wasteCost += c * (Number(w.qty_canonical)||0);
    }

    // Theoretical consumption from snapshots (unchanged)
    const snaps = state.snapshots.slice().sort((a,b) => a.created_at.localeCompare(b.created_at));
    const opening = [...snaps].reverse().find(s => s.created_at < monthStart) || snaps[0];
    const closing = [...snaps].reverse().find(s => s.created_at < nextMonthStart);
    let snapshotNote = "";
    if (!opening) snapshotNote = "No opening snapshot.";
    else if (!closing || closing.id === opening?.id) snapshotNote = "No closing snapshot for this month yet — theoretical consumption unavailable.";
    const theoretical = {};
    if (opening && closing && closing.id !== opening.id) {
      for (const it of state.items) {
        const o = opening.entries.find(e => e.branch === branch && e.item_id === it.id)?.qty || 0;
        const cqty = closing.entries.find(e => e.branch === branch && e.item_id === it.id)?.qty || 0;
        const p = purch.reduce((s,pp) => s + pp.lines.filter(l => l.inv_item_id === it.id).reduce((ss,ll)=>ss+(Number(ll.qty_canonical)||0),0), 0);
        theoretical[it.id] = o + p - cqty;
      }
    }
    let theoreticalCost = 0, theoreticalCounted = 0;
    for (const [iid, qty] of Object.entries(theoretical)) {
      const c = lastUnitCost(iid);
      if (c != null) { theoreticalCost += c * qty; theoreticalCounted++; }
    }

    // ---------- OVERHEADS + SALARIES for this branch+month ----------
    state.overheads = state.overheads || [];
    state.salaries = state.salaries || [];
    // Only PAID overheads impact net profit. Unpaid recurring bills (electricity, etc.)
    // are shown in the Overheads screen but excluded here until marked paid.
    const _ohBranch = branch === "events" ? "maadi" : branch;
    const ohRows = branch === "events" ? [] : state.overheads.filter(o =>
      (o.branch ? branchKey(o.branch) === _ohBranch : true) &&
      ((o.month || "") >= monthFrom && (o.month || "") <= monthTo) &&
      (o.paid !== false)
    );
    const overheadsTotal = ohRows.reduce((s,o) => s + (Number(o.amount)||0), 0);
    // Salaries: sum per-month snapshots across the range so historical changes are preserved.
    const _numMonths = rangeMonths.length || 1;
    const _activeStaff = (state.users || []).filter(x =>
      ["barista","head_barista"].includes(x.role) &&
      (x.active || !!(state.salary_config || {})[x.id])
    );
    const _totalStaffSalary = rangeMonths.reduce((total, m) =>
      total + _activeStaff.reduce((s, p) => s + getSalaryForMonth(p.id, m), 0), 0);
    const salariesTotal = Math.round(_totalStaffSalary / 2);
    const totalOpex = overheadsTotal + salariesTotal;

    // ---------- KEY METRICS ----------
    const cogs = cogsSales; // sales-derived (use theoretical if you prefer — see note on P&L card)
    const grossProfit = revenue - cogs;
    const netProfit = grossProfit - totalOpex;
    const cogsPct = revenue ? (cogs / revenue) * 100 : 0;
    const gmPct = revenue ? (grossProfit / revenue) * 100 : 0;
    const npPct = revenue ? (netProfit / revenue) * 100 : 0;

    // CB Sales % — only meaningful for Zawya (third-party concessions exist at that venue)
    // Deduplicate sales_meta by branch+month, keeping the latest entry (by id insertion order)
    // to avoid double-counting when the same month's data was re-uploaded multiple times.
    const salesMetaDeduped = (() => {
      const latest = new Map();
      for (const m of (state.sales_meta || [])) {
        latest.set(m.branch + "|" + m.month, m);
      }
      return [...latest.values()];
    })();
    const salesMetaInRange = salesMetaDeduped.filter(m => m.branch === branch && m.month >= monthFrom && m.month <= monthTo);
    const excludedNet = salesMetaInRange.reduce((s, m) => s + (Number(m.excluded_net) || 0), 0);
    const totalVenueNet = revenue + excludedNet;
    const cbPct = totalVenueNet > 0 ? (revenue / totalVenueNet) * 100 : null;

    // ---------- Zawya revenue after deductions ----------
    const revenueAfterVat    = branch === "zawya" ? revenue / 1.14 : null;
    const revenueAfterShares = revenueAfterVat   !== null ? revenueAfterVat * 0.90 : null;

    // ---------- top KPI cards ----------
    const topKpis = [
      kpi("Revenue (Net)", money(revenue), sales.length + " rows"),
      ...(branch === "zawya" ? [
        kpi("After 14% VAT", money(revenueAfterVat), `÷ 1.14 — ${money(revenue - revenueAfterVat)} VAT`),
        kpi("After Zawya 10%", money(revenueAfterShares), `CB keeps 90% — ${money(revenueAfterVat - revenueAfterShares)} to Zawya`),
      ] : []),
      kpi("Discount", money(discount), (revenue + discount) ? ((discount/(revenue+discount))*100).toFixed(1)+"%" : "—"),
      kpi("Purchases", money(purchTotal), purch.length + " invoices"),
      kpi("Waste events", String(waste.length), money(wasteCost) + " valued"),
    ];
    if (branch === "zawya" && cbPct !== null) {
      topKpis.push(kpi("CB Sales %", cbPct.toFixed(1) + "%", `CB ${money(revenue)} of ${money(totalVenueNet)} venue total`));
    }
    body.appendChild(el("div", { class: "grid c2" }, topKpis));

    // ---------- PROFITABILITY % CARDS ----------
    body.appendChild(el("div", { class: "card", style: { marginTop: "14px" } }, [
      el("h2", {}, "Profitability"),
      el("div", { class: "grid c3" }, [
        el("div", {}, [
          el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } }, "COGS %"),
          el("div", { style: { fontSize: "28px", fontWeight: "700", color: cogsPct > 35 ? "var(--bad)" : cogsPct > 28 ? "var(--warn)" : "var(--ok)" } }, (revenue ? cogsPct.toFixed(1) : "—") + "%"),
          el("div", { class: "muted small" }, money(cogs)),
        ]),
        el("div", {}, [
          el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } }, "Gross margin %"),
          el("div", { style: { fontSize: "28px", fontWeight: "700", color: gmPct >= 65 ? "var(--ok)" : gmPct >= 55 ? "var(--warn)" : "var(--bad)" } }, (revenue ? gmPct.toFixed(1) : "—") + "%"),
          el("div", { class: "muted small" }, money(grossProfit)),
        ]),
        el("div", {}, [
          el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } }, "Net profit %"),
          el("div", { style: { fontSize: "28px", fontWeight: "700", color: npPct >= 20 ? "var(--ok)" : npPct >= 10 ? "var(--warn)" : "var(--bad)" } }, (revenue ? npPct.toFixed(1) : "—") + "%"),
          el("div", { class: "muted small" }, money(netProfit)),
        ]),
      ]),
      el("div", { class: "muted small", style: { marginTop: "8px" } },
        `Revenue ${money(revenue)} − COGS ${money(cogs)} − Overheads ${money(overheadsTotal)} − Salaries ½ share ${money(salariesTotal)} = Net ${money(netProfit)}`),
    ]));

    // ---------- P&L reconciliation ----------
    body.appendChild(el("div", { class: "card", style: { marginTop: "14px" } }, [
      el("h2", {}, "P&L close — COGS reconciliation"),
      el("div", { class: "kv" }, [ el("div", { class: "k" }, "COGS from sales × item cost"), el("div", { class: "v" }, money(cogsSales)) ]),
      el("div", { class: "kv" }, [ el("div", { class: "k" }, "COGS theoretical (opening + purchases − closing)"), el("div", { class: "v" }, closing && opening && closing.id!==opening.id ? money(theoreticalCost) : "—") ]),
      el("div", { class: "kv" }, [ el("div", { class: "k" }, "Waste cost"), el("div", { class: "v" }, money(wasteCost)) ]),
      el("div", { class: "kv" }, [ el("div", { class: "k" }, "Theoretical − sales-derived (variance)"), el("div", { class: "v" }, (closing && opening && closing.id!==opening.id) ? money(theoreticalCost - cogsSales) : "—") ]),
      el("div", { class: "muted small", style: { marginTop: "6px" } }, snapshotNote || `Matched ${matched} units · unmatched ${unmatched} units · ${theoreticalCounted} inventory items valued.`),
    ]));

    // ---------- Overheads breakdown ----------
    if (ohRows.length || salariesTotal > 0) {
      const card = el("div", { class: "card", style: { marginTop: "14px" } });
      card.appendChild(el("h2", {}, `Overheads + salaries — ${rangeLabel}`));
      for (const o of ohRows) {
        card.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, `${o.category || "overhead"}${o.note ? " — " + o.note : ""}`),
          el("div", { class: "v" }, money(o.amount)),
        ]));
      }
      if (salariesTotal > 0) {
        card.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, [
            el("span", {}, "Staff salaries — ½ share (split equally across both branches)"),
            el("div", { class: "muted small" }, `${money(_totalStaffSalary / 2)}/mo × ${_numMonths} month(s) = ${money(salariesTotal)} this branch`),
          ]),
          el("div", { class: "v" }, money(salariesTotal)),
        ]));
      }
      card.appendChild(el("div", { class: "hr" }));
      card.appendChild(el("div", { class: "kv" }, [
        el("div", { class: "k" }, el("b", {}, "Total operating expenses")),
        el("div", { class: "v" }, el("b", {}, money(totalOpex))),
      ]));
      body.appendChild(card);
    }

    // ---------- top items ----------
    const byItem = new Map();
    for (const r of sales) {
      const k = r.item || "—";
      const cur = byItem.get(k) || { qty: 0, net: 0, cogs: 0 };
      const itemQty = hasOrderItems ? (qtyByItem.get(normName(k)) || 0) : (Number(r.qty)||0);
      cur.qty += itemQty;
      cur.net += Number(r.net_sales)||0;
      const m = menuByName.get(normName(k));
      if (m && m.cost_egp) cur.cogs += itemQty * (Number(m.cost_egp)||0);
      byItem.set(k, cur);
    }
    const top = [...byItem.entries()].map(([name, v]) => ({ name, ...v, margin: v.net ? ((v.net - v.cogs)/v.net)*100 : 0 }))
      .sort((a,b) => b.net - a.net).slice(0, 15);
    if (top.length) {
      const card = el("div", { class: "card", style: { marginTop: "14px" } });
      card.appendChild(el("h2", {}, "Top items by net revenue"));
      const tbl = el("table", {}, [
        el("thead", {}, el("tr", {}, ["Item","Qty","Net","Margin%"].map(h => el("th", {}, h)))),
        el("tbody", {}, top.map(r => el("tr", {}, [
          el("td", {}, r.name), el("td", { class: "num" }, String(r.qty)),
          el("td", { class: "num" }, money(r.net)),
          el("td", { class: "num", style: { color: r.margin>60?"var(--ok)":r.margin>40?"var(--warn)":"var(--bad)" } }, r.cogs ? r.margin.toFixed(0)+"%" : "—"),
        ]))),
      ]);
      card.appendChild(tbl);
      body.appendChild(card);
    }
  }
  draw();
  wrap.appendChild(btnBack());
  return wrap;
};

function kpi(label, val, sub) {
  return el("div", { class: "card" }, [
    el("div", { class: "muted" }, label),
    el("div", { style: { fontSize: "24px", fontWeight: "700" } }, val),
    el("div", { class: "muted small" }, sub || ""),
  ]);
}

// ==============================================================
// SETTINGS
// ==============================================================
routes.settings = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Settings", "Sync, exports, backup, starting balances."));

  // sync
  const s = el("div", { class: "card" });
  s.appendChild(el("h2", {}, "☁ Firebase sync"));
  s.appendChild(el("div", { class: "muted small" }, "Data is automatically synced to Firebase Firestore after every change. Photos and files go to Firebase Storage. No configuration needed."));
  s.appendChild(el("div", { class: "banner-arch", style: { marginTop: "10px" } },
    "Firebase is the single source of truth. Use 'Pull from Firebase' to load the latest data (overwrites local). Use 'Push now' to write your local state to Firebase."));
  s.appendChild(el("div", { class: "btn-row" }, [
    el("button", { class: "btn secondary", onClick: async () => { await doSync(); toast("Pushed to Firebase ✓"); } }, "⬆ Push now"),
    el("button", { class: "btn secondary", style: { background: "var(--accent-2)" }, onClick: async () => {
      if (hasPending()) {
        if (!confirm("You have local edits not yet synced. Push first?")) return;
        await doSync();
      }
      const result = await pullFromFirestore();
      if (result.ok) { markClean(); toast("Pulled from Firebase ✓"); render(); }
      else { updateSyncBadge("error"); toast("Pull failed: " + result.err, "error"); }
    } }, "⬇ Pull from Firebase"),
  ]));
  s.appendChild(el("div", { class: "muted small", style: { marginTop: "8px" } }, [
    document.createTextNode(`Last push: ${state.settings.last_sync ? fmtDate(state.settings.last_sync) : "—"}`),
    el("span", { style: { margin: "0 8px" } }, "·"),
    document.createTextNode(`Last pull: ${state.settings.last_pull ? fmtDate(state.settings.last_pull) : "—"}`),
  ]));
  wrap.appendChild(s);

  // Leave email settings
  const leaveEmail = el("div", { class: "card", style: { marginTop: "14px" } });
  leaveEmail.appendChild(el("h2", {}, "Leave request emails"));
  leaveEmail.appendChild(el("div", { class: "muted small" }, "When a barista submits a leave request, an approval email is sent automatically. Set the head barista email (To:) and owner email (CC:) below."));
  leaveEmail.appendChild(el("label", {}, "Head barista email (To:) — receives leave approval requests"));
  const hbEmailIn = el("input", { type: "email", value: state.settings.head_barista_email || "", placeholder: "headbarista@example.com" });
  leaveEmail.appendChild(hbEmailIn);
  leaveEmail.appendChild(el("label", {}, "Owner email (CC:) — kept in the loop on all leave requests"));
  const ownerEmailIn = el("input", { type: "email", value: state.settings.owner_email || "coffeebeats@haidiyacoub.com", placeholder: "coffeebeats@haidiyacoub.com" });
  leaveEmail.appendChild(ownerEmailIn);
  leaveEmail.appendChild(el("button", {
    class: "btn secondary",
    style: { marginTop: "10px" },
    onClick: () => {
      state.settings.head_barista_email = hbEmailIn.value.trim();
      state.settings.owner_email        = ownerEmailIn.value.trim() || "coffeebeats@haidiyacoub.com";
      saveState({ immediate: true });
      toast("Leave email settings saved ✓");
    },
  }, "Save email settings"));
  wrap.appendChild(leaveEmail);

  // petty cash opening balances
  const pc = el("div", { class: "card", style: { marginTop: "14px" } });
  pc.appendChild(el("h2", {}, "Petty cash opening balance"));
  for (const b of ["maadi","zawya"]) {
    const bal = pettyCashBalance(b);
    pc.appendChild(el("div", { class: "kv" }, [
      el("div", { class: "k" }, `${b}`),
      el("div", { class: "v" }, [
        (() => {
          const i = el("input", { type: "number", value: bal, style: { maxWidth: "130px" } });
          const btn = el("button", { class: "btn secondary", style: { width: "auto", marginLeft: "8px" }, onClick: () => {
            const v = Number(i.value) || 0;
            const stampNow = stamp();
            state.petty_cash.push({
              id: uuid(), branch: b, date: new Date().toISOString().slice(0,10),
              type: "adjustment", amount: v - bal, balance_after: v, ref: "opening",
              by: stampNow.by, by_name: stampNow.by_name, at: stampNow.at, note: "Set opening balance",
            });
            saveState(); toast("Saved"); render();
          }}, "Set");
          const wrap2 = el("span", {}); wrap2.appendChild(i); wrap2.appendChild(btn); return wrap2;
        })()
      ]),
    ]));
  }
  wrap.appendChild(pc);

  // ── External / Outsourced Team ──
  const extCard = el("div", { class: "card", style: { marginTop: "14px" } });
  extCard.appendChild(el("h2", {}, "🤝 External / Outsourced Team"));
  extCard.appendChild(el("div", { class: "muted small", style: { marginBottom: "10px" } },
    "Add freelance or outsourced baristas who help at external events. They appear in the Events shift dropdown alongside your Coffee Beats team. Set a daily rate to auto-calculate their events bonus."));

  function renderExtBaristas() {
    extCard.querySelectorAll(".ext-barista-row, .ext-barista-form, .ext-barista-list").forEach(e => e.remove());
    const list = el("div", { class: "ext-barista-list" });
    const extB = state.external_baristas || [];
    if (extB.length === 0) {
      list.appendChild(el("div", { class: "muted small", style: { fontStyle: "italic", marginBottom: "8px" } }, "No external baristas added yet."));
    } else {
      extB.forEach((b, i) => {
        const row = el("div", { class: "ext-barista-row kv", style: { alignItems: "center", gap: "8px", marginBottom: "6px" } });
        const nameEl = el("div", { class: "k" }, b.name);
        const rateEl = el("div", { class: "v muted small" }, b.daily_rate ? `${b.daily_rate} L.E./day` : "No rate set");
        const actBadge = el("span", { class: "pill", style: { background: b.active ? "rgba(34,197,94,0.15)" : "rgba(239,68,68,0.12)", fontSize: "11px" } }, b.active ? "Active" : "Inactive");
        const editBtn = el("button", { class: "btn secondary", style: { width: "auto", fontSize: "12px", padding: "3px 10px" }, onClick: () => {
          showExtForm(i);
        }}, "Edit");
        const delBtn = el("button", { class: "btn", style: { width: "auto", fontSize: "12px", padding: "3px 10px", background: "var(--bad)" }, onClick: () => {
          if (!confirm(`Remove ${b.name}?`)) return;
          state.external_baristas.splice(i, 1);
          saveState(); renderExtBaristas();
        }}, "Remove");
        row.appendChild(nameEl);
        row.appendChild(rateEl);
        row.appendChild(actBadge);
        row.appendChild(editBtn);
        row.appendChild(delBtn);
        list.appendChild(row);
      });
    }
    extCard.appendChild(list);

    const addBtn = el("button", { class: "btn secondary", style: { marginTop: "8px" }, onClick: () => showExtForm(null) }, "+ Add External Barista");
    addBtn.className += " ext-barista-form";
    extCard.appendChild(addBtn);
  }

  function showExtForm(idx) {
    extCard.querySelectorAll(".ext-barista-form").forEach(e => e.remove());
    const existing = idx !== null ? (state.external_baristas[idx] || {}) : {};
    const form = el("div", { class: "ext-barista-form card", style: { marginTop: "10px", background: "var(--bg2)", border: "1px solid var(--border)" } });
    form.appendChild(el("div", { class: "muted small", style: { marginBottom: "8px", fontWeight: "600" } }, idx !== null ? "Edit External Barista" : "Add External Barista"));

    form.appendChild(el("label", {}, "Name *"));
    const nameIn = el("input", { type: "text", value: existing.name || "", placeholder: "e.g. Ahmed (Outsourced)" });
    form.appendChild(nameIn);

    form.appendChild(el("label", {}, "Daily rate (L.E.) — used to calculate events bonus"));
    const rateIn = el("input", { type: "number", value: existing.daily_rate || "", placeholder: "e.g. 300" });
    form.appendChild(rateIn);

    form.appendChild(el("label", {}, "Notes (optional)"));
    const notesIn = el("input", { type: "text", value: existing.notes || "", placeholder: "e.g. Via Agency X, contact: ..." });
    form.appendChild(notesIn);

    const activeRow = el("div", { class: "kv", style: { marginTop: "6px" } });
    activeRow.appendChild(el("div", { class: "k" }, "Active"));
    const activeChk = el("input", { type: "checkbox" }); activeChk.checked = existing.active !== false;
    const activeWrap = el("div", { class: "v" }); activeWrap.appendChild(activeChk);
    activeRow.appendChild(activeWrap);
    form.appendChild(activeRow);

    const btnRow = el("div", { class: "btn-row", style: { marginTop: "10px" } });
    btnRow.appendChild(el("button", { class: "btn secondary", onClick: () => {
      const name = nameIn.value.trim();
      if (!name) { toast("Name is required", "error"); return; }
      const entry = { id: existing.id || uuid(), name, daily_rate: Number(rateIn.value) || 0, notes: notesIn.value.trim(), active: activeChk.checked };
      state.external_baristas = state.external_baristas || [];
      if (idx !== null) { state.external_baristas[idx] = entry; }
      else { state.external_baristas.push(entry); }
      saveState(); renderExtBaristas(); toast(idx !== null ? "External barista updated ✓" : "External barista added ✓");
    }}, "Save"));
    btnRow.appendChild(el("button", { class: "btn secondary", style: { background: "var(--bg3)" }, onClick: () => {
      form.remove(); renderExtBaristas();
    }}, "Cancel"));
    form.appendChild(btnRow);
    extCard.appendChild(form);
  }

  renderExtBaristas();
  wrap.appendChild(extCard);

  // export / backup
  const ex = el("div", { class: "card", style: { marginTop: "14px" } });
  ex.appendChild(el("h2", {}, "Export & backup"));
  ex.appendChild(el("div", { class: "btn-row" }, [
    el("button", { class: "btn secondary", onClick: exportJSONBackup }, "⬇ Full JSON backup"),
    el("button", { class: "btn secondary", onClick: exportAllCSVZip }, "⬇ All CSV (zip)"),
  ]));
  ex.appendChild(el("label", {}, "Restore from JSON backup"));
  const rf = el("input", { type: "file", accept: "application/json" });
  rf.addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    if (!confirm("Replace current data with this backup?")) return;
    const txt = await f.text(); try { state = JSON.parse(txt); saveState(); render(); toast("Restored"); } catch { toast("Bad file", "error"); }
  });
  ex.appendChild(rf);
  wrap.appendChild(ex);

  // ── Firebase photo storage ──
  const gd = el("div", { class: "card", style: { marginTop: "14px" } });
  gd.appendChild(el("h2", {}, "📷 Photo Storage (Firebase)"));
  gd.appendChild(el("div", { class: "muted small", style: { marginBottom: "10px" } },
    "Photos taken in the app are automatically uploaded to Firebase Storage. No setup needed — it's all handled by the Firebase project."));
  const gdTestBtn = el("button", { class: "btn" }, "Test connection");
  gdTestBtn.addEventListener("click", async () => {
    gdTestBtn.disabled = true; gdTestBtn.textContent = "Testing…";
    try {
      const tiny = await fetch("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==").then(r => r.blob());
      const ref = storage.ref("_test/connection_check.png");
      await ref.put(tiny, { contentType: "image/png" });
      const url = await ref.getDownloadURL();
      if (url) toast("✓ Firebase Storage connected!");
      else toast("Connection check returned no URL.", "error");
    } catch (e) {
      toast("Connection failed: " + e.message, "error");
    }
    gdTestBtn.disabled = false; gdTestBtn.textContent = "Test connection";
  });
  gd.appendChild(el("div", { class: "btn-row", style: { marginTop: "10px" } }, [
    gdTestBtn,
    el("button", { class: "btn secondary", onClick: () => go("photo_gallery") }, "📷 Open Photo Gallery"),
  ]));
  wrap.appendChild(gd);

  // ── Team / Barista Management ──
  const tm = el("div", { class: "card", style: { marginTop: "14px" } });
  tm.appendChild(el("h2", {}, "Team & Barista Management"));
  tm.appendChild(el("div", { class: "muted small", style: { marginBottom: "12px" } }, "Add, remove or reassign baristas per branch. Changes take effect immediately in the complimentary drinks dropdowns."));

  const teamBody = el("div", {});
  tm.appendChild(teamBody);

  async function renderTeam() {
    teamBody.innerHTML = '<div class="muted small" style="padding:8px">Loading…</div>';

    let allStaff;
    try {
      const snap = await db.collection("staff_public").get();
      allStaff = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
      allStaff.sort((a, b) => a.name.localeCompare(b.name));
    } catch (e) {
      teamBody.innerHTML = `<div class="muted small" style="color:var(--bad)">Failed to load staff: ${e.message}</div>`;
      return;
    }

    teamBody.innerHTML = "";
    const roleLabel = { owner: "Owner", accountant: "Accountant", head_barista: "Head Barista", barista: "Barista", manager: "Manager", helper: "Helper" };

    for (const s of allStaff) {
      const row = el("div", { style: { display: "flex", alignItems: "center", gap: "8px", padding: "9px 10px", background: s.active ? "var(--surface-2)" : "#fdecea", borderRadius: "8px", marginBottom: "6px" } });

      const info = el("div", { style: { flex: "1" } });
      info.appendChild(el("div", { style: { fontSize: "14px", fontWeight: "600" } }, s.name + (s.role === "head_barista" ? " ⭐" : "")));
      // Arabic name — inline editable
      const arRow = el("div", { style: { display: "flex", alignItems: "center", gap: "6px", margin: "3px 0" } });
      const arName = el("div", { style: { fontSize: "13px", direction: "rtl", color: "var(--ink-dim)", fontFamily: "'Noto Sans Arabic', 'Geeza Pro', serif", flex: "1" } }, s.name_ar || "");
      const arBtn  = el("button", { class: "btn ghost", style: { fontSize: "10px", padding: "2px 6px", width: "auto" } }, s.name_ar ? "✏️" : "+ Arabic name");
      arBtn.addEventListener("click", () => {
        const inp = el("input", { type: "text", placeholder: "الاسم بالعربية", value: s.name_ar || "", style: { direction: "rtl", fontFamily: "'Noto Sans Arabic','Geeza Pro',serif", fontSize: "13px", marginBottom: "0", padding: "4px 8px" } });
        const saveAr = el("button", { class: "btn secondary", style: { fontSize: "11px", padding: "3px 10px", width: "auto" } }, "Save");
        saveAr.addEventListener("click", async () => {
          const val = inp.value.trim();
          saveAr.disabled = true;
          try {
            await db.collection("staff_public").doc(s.uid).update({ name_ar: val });
            s.name_ar = val;
            arName.textContent = val;
            arBtn.textContent = val ? "✏️" : "+ Arabic name";
            arRow.innerHTML = "";
            arRow.appendChild(arName);
            arRow.appendChild(arBtn);
            toast("Arabic name saved ✓");
          } catch(e) { toast(e.message || "Failed to save", "error"); saveAr.disabled = false; }
        });
        arRow.innerHTML = "";
        arRow.appendChild(inp);
        arRow.appendChild(saveAr);
        setTimeout(() => inp.focus(), 50);
      });
      arRow.appendChild(arName);
      arRow.appendChild(arBtn);
      info.appendChild(arRow);
      info.appendChild(el("div", { class: "muted small" }, `${roleLabel[s.role] || s.role}${s.branches?.length ? " · " + s.branches.join(", ") : ""}${!s.active ? " · inactive" : ""}`));
      row.appendChild(info);

      if (s.role === "barista" || s.role === "head_barista") {
        for (const b of ["maadi", "zawya"]) {
          const has = (s.branches || []).includes(b);
          const bBtn = el("button", { class: has ? "btn secondary" : "btn ghost", style: { width: "auto", padding: "4px 9px", fontSize: "11px" } }, has ? `${b} ✓` : b);
          bBtn.addEventListener("click", async () => {
            const newBranches = has ? (s.branches || []).filter(br => br !== b) : [...new Set([...(s.branches || []), b])];
            bBtn.disabled = true;
            try {
              await functions.httpsCallable("setStaffRole")({ targetUid: s.uid, role: s.role, branches: newBranches });
              renderTeam();
            } catch (e) { toast(e.message || "Failed to update", "error"); bBtn.disabled = false; }
          });
          row.appendChild(bBtn);
        }
      }

      const activeBtn = el("button", { class: s.active ? "btn ghost" : "btn secondary", style: { width: "auto", padding: "5px 10px", fontSize: "12px" } }, s.active ? "Deactivate" : "Reactivate");
      activeBtn.addEventListener("click", () => {
        const isDeactivating = s.active;
        openPrompt({
          title: (isDeactivating ? "Deactivate " : "Reactivate ") + s.name,
          fields: [
            { key: "date", label: isDeactivating ? "Last working day" : "New start date", type: "date", value: new Date().toISOString().slice(0,10) },
            { key: "note", label: "Note (optional)", type: "text", value: "" },
          ],
          onSubmit: async (v) => {
            activeBtn.disabled = true;
            try {
              await functions.httpsCallable("setStaffActive")({ targetUid: s.uid, active: !s.active });
              if (v.date) {
                state.barista_dates = state.barista_dates || {};
                state.barista_dates[s.uid] = state.barista_dates[s.uid] || [];
                state.barista_dates[s.uid].push({ type: isDeactivating ? "left" : "joined", date: v.date, note: v.note || "", at: now() });
                saveState();
              }
              renderTeam();
            } catch (e) { toast(e.message || "Failed to update", "error"); activeBtn.disabled = false; }
          }
        });
      });
      row.appendChild(activeBtn);
      teamBody.appendChild(row);
    }

    // ── Add new staff member ──
    const addCard = el("div", { style: { background: "var(--surface-2)", borderRadius: "10px", padding: "12px", marginTop: "8px" } });
    addCard.appendChild(el("div", { style: { fontWeight: "600", fontSize: "13px", marginBottom: "10px" } }, "Add new staff member"));
    const nameIn = el("input", { type: "text", placeholder: "Full name", style: { marginBottom: "8px" } });
    const pinIn  = el("input", { type: "text", placeholder: "PIN (4 digits)", maxlength: "4", style: { marginBottom: "8px" } });
    const roleIn = el("select", { style: { marginBottom: "8px" } }, [
      el("option", { value: "barista" },      "Barista"),
      el("option", { value: "head_barista" }, "Head Barista"),
      el("option", { value: "manager" },      "Manager"),
      el("option", { value: "helper" },       "Helper"),
      el("option", { value: "accountant" },   "Accountant"),
    ]);
    const branchCheckboxes = el("div", { style: { display: "flex", gap: "12px", marginBottom: "10px", alignItems: "center" } });
    const cbMaadi = el("input", { type: "checkbox", id: "cb_maadi_new", checked: "true" });
    const cbZawya = el("input", { type: "checkbox", id: "cb_zawya_new" });
    branchCheckboxes.appendChild(el("label", { style: { display: "flex", alignItems: "center", gap: "4px", margin: "0" } }, [cbMaadi, document.createTextNode(" Maadi")]));
    branchCheckboxes.appendChild(el("label", { style: { display: "flex", alignItems: "center", gap: "4px", margin: "0" } }, [cbZawya, document.createTextNode(" Zawya")]));
    const dateLabel = el("div", { style: { fontSize: "12px", color: "var(--ink-dim)", marginBottom: "2px" } }, "Start date");
    const dateIn = el("input", { type: "date", value: new Date().toISOString().slice(0,10), style: { marginBottom: "8px" } });
    const addBtn = el("button", { class: "btn", style: { marginTop: "4px" } }, "+ Add Staff Member");
    addBtn.addEventListener("click", async () => {
      const name = nameIn.value.trim();
      const pin  = pinIn.value.trim();
      if (!name) { toast("Enter a name first.", "error"); return; }
      if (!pin || pin.length !== 4 || !/^\d{4}$/.test(pin)) { toast("Enter a 4-digit PIN.", "error"); return; }
      if (allStaff.some(x => x.name.toLowerCase() === name.toLowerCase())) { toast("Name already exists.", "error"); return; }
      const branches = [];
      if (cbMaadi.checked) branches.push("maadi");
      if (cbZawya.checked) branches.push("zawya");
      addBtn.disabled = true; addBtn.textContent = "Adding…";
      try {
        await functions.httpsCallable("createStaffUser")({ name, role: roleIn.value, branches, pin });
        await staffDir.load();
        const newUser = staffDir.all().find(x => x.name === name);
        if (newUser && dateIn.value) {
          state.barista_dates = state.barista_dates || {};
          state.barista_dates[newUser.uid] = state.barista_dates[newUser.uid] || [];
          state.barista_dates[newUser.uid].push({ type: "joined", date: dateIn.value, at: now() });
          saveState();
        }
        nameIn.value = ""; pinIn.value = "";
        toast(`${name} added ✓`);
        renderTeam();
      } catch (e) {
        toast(e.message || "Failed to add staff", "error");
        addBtn.disabled = false; addBtn.textContent = "+ Add Staff Member";
      }
    });
    [nameIn, pinIn, roleIn, branchCheckboxes, dateLabel, dateIn, addBtn].forEach(el2 => addCard.appendChild(el2));
    teamBody.appendChild(addCard);
  }

  renderTeam();
  wrap.appendChild(tm);

  // ── Team Access Code (owner only) ──
  if (u.role === "owner") {
    const tc = el("div", { class: "card", style: { marginTop: "14px" } });
    tc.appendChild(el("h2", {}, "🔐 Team Access Code"));
    tc.appendChild(el("div", { class: "muted small", style: { marginBottom: "10px" } },
      "Anyone visiting the app URL must enter this code before they can reach the PIN screen. Share it only with your team. Changes take effect immediately on all devices after their next page load."));
    tc.appendChild(el("label", {}, "Access code"));
    const tcIn = el("input", { type: "text", value: state.settings.team_code || "", placeholder: "e.g. coffeeteam2026", style: { letterSpacing: "2px" } });
    tc.appendChild(tcIn);
    const tcRow = el("div", { class: "btn-row", style: { marginTop: "10px" } });

    const tcSave = el("button", { class: "btn secondary" }, "Save code");
    tcSave.addEventListener("click", () => {
      const newCode = tcIn.value.trim();
      if (newCode.length < 6) { toast("Code must be at least 6 characters", "error"); return; }
      state.settings.team_code = newCode;
      saveState({ immediate: true });
      // Re-lock all devices (current device stays unlocked since it just changed the code)
      toast("Access code updated ✓ — share the new code with your team.");
    });
    tcRow.appendChild(tcSave);

    tc.appendChild(tcRow);
    wrap.appendChild(tc);
  }

  // ── Firebase Auth migration (owner only, one-time) ─────────────────────────
  if (u.role === "owner") {
    const migCard = el("div", { class: "card", style: { marginTop: "14px" } });
    migCard.appendChild(el("h2", {}, "🔐 Firebase Auth Migration"));
    migCard.appendChild(el("div", { class: "muted small", style: { marginBottom: "10px" } },
      "One-time setup: creates a secure Firebase Auth account for each staff member. Run this once after deploying Cloud Functions. Existing staff PINs will be hashed server-side."));
    const migLog = el("div", { style: { fontFamily: "monospace", fontSize: "12px", background: "var(--surface-2)", padding: "10px", borderRadius: "8px", maxHeight: "160px", overflowY: "auto", marginBottom: "10px", display: "none" } });
    migCard.appendChild(migLog);
    const migBtn = el("button", { class: "btn", onClick: async () => {
      if (!confirm("Create Firebase Auth accounts for all active staff? Existing accounts will be skipped.")) return;
      migBtn.disabled = true; migBtn.textContent = "Migrating…";
      migLog.style.display = "block"; migLog.innerHTML = "";
      const migrateUser = functions.httpsCallable("migrateUser");
      const users = (state.users || []).filter(u => u.active && u.role !== "manager" && u.role !== "helper");
      let ok = 0, skip = 0;
      for (const su of users) {
        if (su.staff_uid) { migLog.innerHTML += `⏭ ${su.name} — already migrated<br>`; skip++; continue; }
        try {
          const { data } = await migrateUser({ name: su.name, role: su.role, branches: su.branches || [], pin: su.pin || "0000", legacyId: su.id });
          su.staff_uid = data.uid;
          migLog.innerHTML += `✅ ${su.name} → ${data.uid}<br>`;
          ok++;
        } catch (e) {
          migLog.innerHTML += `❌ ${su.name} — ${e.message}<br>`;
        }
        migLog.scrollTop = migLog.scrollHeight;
      }
      saveState();
      migLog.innerHTML += `<br><b>Done: ${ok} created, ${skip} skipped.</b>`;
      migBtn.textContent = "Run Migration"; migBtn.disabled = false;
      toast(`Migration complete — ${ok} accounts created`);
    } }, "Run Migration");
    migCard.appendChild(migBtn);
    wrap.appendChild(migCard);
  }

  // danger
  const dz = el("div", { class: "card", style: { marginTop: "14px", borderColor: "var(--bad)" } });
  dz.appendChild(el("h2", {}, "Danger zone"));
  dz.appendChild(el("button", { class: "btn danger", onClick: () => {
    if (!confirm("Wipe ALL data on this device? Make sure you exported a backup first.")) return;
    localStorage.removeItem(STORAGE_KEY); location.reload();
  }}, "Wipe local data"));
  wrap.appendChild(dz);

  wrap.appendChild(btnBack());
  return wrap;
};

routes.shifts = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("My shifts", "Your own entries filtered to your branches."));
  const mine = state.waste.filter(w => w.by === u.id).slice().sort((a,b)=>b.at.localeCompare(a.at)).slice(0,100);
  const list = el("div", { class: "list" });
  for (const w of mine) list.appendChild(el("div", { class: "row" }, [
    el("div", { class: "grow" }, [
      el("div", { class: "title" }, `${w.item_name} · ${fmtQty(w.qty_canonical, w.unit)}`),

    ]),

  if (mine.length === 0) list.appendChild(el("div", { class: "muted" }, "No entries yet."));

  wrap.appendChild(btnBack());

// ==============================================================
// CLEANING LOG
// ==============================================================
routes.cleaning_log_new = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Cleaning Log", "Upload a photo of the completed cleaning checklist for this shift."));

  let branch = u.branches[0];
  let date   = new Date().toISOString().slice(0,10);
  let note   = "";
  const branchPicker = makeBranchPicker(u.branches, () => branch, b => { branch = b; });
  wrap.appendChild(branchPicker);

  wrap.appendChild(el("label", {}, "Date"));
  const dInput = el("input", { type: "date", value: date });
  dInput.addEventListener("input", () => date = dInput.value);
  wrap.appendChild(dInput);

  // ── Cleaning checklist ──────────────────────────────────────────────────────
  const isAR_clean = u.role === "barista" || u.role === "head_barista";
  const CLEAN_ITEMS_EN_LOC = [
    "Espresso machine group heads backflushed & flushed with water",
    "Steam wands purged & wiped with dedicated cloth after every use ✓",
    "Portafilters scrubbed, rinsed & dried — no coffee residue",
    "Bar counter cleared, sanitised & free of spills",
    "Milk fridge wiped down, FIFO labels checked, no expired product",
    "Drip trays emptied, rinsed & dried",
    "Grinder hopper, chute & doser brushed — no build-up",
    "Back bar and syrup shelf cleaned & organised",
    "Floor swept and wet-mopped in bar area",
    "Cups, glasses & tools restocked and polished",
  ];
  const CLEAN_ITEMS_AR_LOC = [
    "ظهر الإسبريسو: عمل backflush ثم شطف بالماء",
    "عصا البخار: تنقية ومسح بقماش مخصص بعد كل استخدام ✓",
    "الـ portafilters: تنظيف، شطف وتجفيف — لا بقايا قهوة",
    "كاونتر البار: تفريغ، تعقيم وخلوّه من البقع",
    "ثلاجة الحليب: مسح، مراجعة تواريخ FIFO، لا منتجات منتهية",
    "صينية التصريف: تفريغ، شطف وتجفيف",
    "الطاحونة: فرشاة الحوض والمجرى والدوزر — لا تراكمات",
    "الجزء الخلفي للبار وخانة الشراب: تنظيف وترتيب",
    "الأرضية: كنس وتمسيح منطقة البار",
    "الأكواب والأدوات: إعادة تعبئة وتلميع",
  ];
  let checkedItems = new Array(CLEAN_ITEMS_EN_LOC.length).fill(false);

  const checklistCard = el("div", { class: "card", style: { marginBottom: "14px" } });
  checklistCard.appendChild(el("div", { style: { fontWeight: "700", marginBottom: "4px", fontSize: "15px" } },
    "🧹 Cleaning Checklist / قائمة مهام النظافة"));
  checklistCard.appendChild(el("div", { class: "muted small", style: { marginBottom: "10px" } },
    "✅ Each checked item scores points. 100% earns a Clean Sweep badge! — كل بند محقق = نقاط في بطاقة أدائك."));

  const scoreDisplay = el("div", { style: { fontWeight: "700", marginBottom: "10px", color: "var(--accent)" } },
    "Score / النقاط: 0/100");

  CLEAN_ITEMS_EN_LOC.forEach((itemEN, i) => {
    const itemAR = CLEAN_ITEMS_AR_LOC[i];
    const lbl = el("label", { style: {
      display: "flex", alignItems: "flex-start", gap: "10px",
      padding: "9px 0", borderBottom: "1px solid var(--border)",
      cursor: "pointer",
    }});
    const chk = el("input", { type: "checkbox", style: { width: "18px", height: "18px", marginTop: "4px", flexShrink: "0", accentColor: "var(--accent)" } });
    chk.addEventListener("change", () => {
      checkedItems[i] = chk.checked;
      const pct = Math.round(checkedItems.filter(Boolean).length / CLEAN_ITEMS_EN_LOC.length * 100);
      scoreDisplay.textContent = `Score / النقاط: ${pct}/100`;
      scoreDisplay.style.color = pct >= 80 ? "var(--ok)" : pct >= 50 ? "var(--warn)" : "var(--bad)";
    });
    const textWrap = el("div", { style: { display: "flex", flexDirection: "column", gap: "2px" } });
    textWrap.appendChild(el("span", { style: { fontSize: "13.5px", lineHeight: "1.5" } }, itemEN));
    textWrap.appendChild(el("span", { style: { fontSize: "12.5px", lineHeight: "1.4", color: "var(--muted)", direction: "rtl", textAlign: "right" } }, itemAR));
    lbl.appendChild(chk);
    lbl.appendChild(textWrap);
    checklistCard.appendChild(lbl);
  });

routes.signin_stamp_new = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Sign-In Stamp", "Upload a photo of the iPad clock showing your arrival time."));

  let branch   = u.branches[0];
  let note     = "";

  const branchPicker = makeBranchPicker(u.branches, () => branch, b => { branch = b; });
  wrap.appendChild(branchPicker);

  wrap.appendChild(el("div", { class: "card", style: { background: "var(--surface-2)", marginBottom: "14px" } }, [
    el("div", { style: { fontWeight: "600", marginBottom: "4px" } }, "How to stamp in"),
    el("div", { class: "muted small" }, "1. Open the clock on the iPad (or any screen showing the time)."),
    el("div", { class: "muted small" }, "2. Photograph it clearly — date and time must be visible."),
    el("div", { class: "muted small" }, "3. Upload it below and tap Submit."),
  ]));

  const stampPhotoField = makePhotoField({ label: "Clock-in photo(s)", required: true, formLabel: "Sign-In Stamp" });
  wrap.appendChild(stampPhotoField.el);

  wrap.appendChild(el("label", {}, "Note (optional)"));
  const noteInput = el("input", { type: "text", placeholder: "e.g. Late — metro delay" });
  noteInput.addEventListener("input", () => note = noteInput.value);
  wrap.appendChild(noteInput);

  wrap.appendChild(el("div", { class: "sticky-actions" }, [
    el("button", {
      class: "btn",
      onClick: async () => {
        const photoBlobs = stampPhotoField.getBlobs();
        if (!photoBlobs.length) return toast("Please attach at least one clock-in photo", "error");
        const photoNames = photoBlobs.map(f => f.name);
        const s = stamp();
        const photoIds = photoBlobs.map(() => uuid());
        for (let i = 0; i < photoBlobs.length; i++) {
          try { await IDB.put(photoIds[i], photoBlobs[i]); } catch (e) { console.warn(e); }
        }
        // Pre-compute early_bonus before pushing so it's in the record
        const _stampSubmitTime = new Date(s.at);
        const _stampTodayStr   = localISODate(_stampSubmitTime);
        const _stampBot        = state.branch_opening_times || {};
        const _stampOpenStr    = ((_stampBot[branch?.toLowerCase()] || {})["morning"])
                                 || (branch?.toLowerCase() === "maadi" ? "10:00" : "12:00");
        const _stampOpeningMs  = new Date(_stampTodayStr + "T" + _stampOpenStr + ":00").getTime();
        const _stampMinsLate   = Math.round((_stampSubmitTime.getTime() - _stampOpeningMs) / 60000);
        const _earlyBonus      = _stampMinsLate <= -15;

        state.signin_stamps.push({
          id: uuid(), at: s.at, by: s.by, by_name: s.by_name, device: s.device,
          branch,
          photo_id: photoIds[0], photo_name: photoNames[0],
          photo_ids: photoIds, photo_names: photoNames,
          drive_ids: stampPhotoField.getDriveIds(),
          note: note.trim(),
          early_bonus: _earlyBonus,
          mins_late: _stampMinsLate,
        });

        // ── Auto late-penalty from photo upload timestamp ─────
        (function() {
          const submitTime = new Date(s.at);
          const todayStr   = localISODate(submitTime); // local date, not UTC
          const dayIndex   = (submitTime.getDay() + 6) % 7; // 0=Mon … 6=Sun
          const dayKey     = ROSTER_DAYS[dayIndex];
          const weekOf     = mondayOf(todayStr);

          // Sign-in stamp = morning shift only.
          // Only penalise if this barista is currently assigned to the morning shift
          // at this branch today — checked live so mid-week swaps take effect immediately.
          const morningEntry = (state.rosters || []).find(r =>
            r.week_of === weekOf &&
            r.branch  === branch.toLowerCase() &&
            r.day     === dayKey &&
            r.shift   === "morning" &&
            r.user_id === u.id
          );
          if (!morningEntry) {
            // Check if this barista is covering someone else's morning shift
            const anyMorningShift = (state.rosters || []).find(r =>
              r.week_of === weekOf &&
              r.branch  === branch.toLowerCase() &&
              r.day     === dayKey &&
              r.shift   === "morning"
            );
            if (anyMorningShift) {
              // Mark the stamp as a substitute cover and award +50 punctuality KPI bonus
              const lastStamp = state.signin_stamps[state.signin_stamps.length - 1];
              if (lastStamp) lastStamp.substitute_cover = true;
              saveState();
              toast(`⭐ Substitute cover recorded for ${u.name} — +50 punctuality bonus`, "ok");
            }
            return; // not today's assigned morning barista — no late penalty
          }

          // Get morning opening time for this branch from the schedule config
          const bot      = state.branch_opening_times || {};
          const openStr  = ((bot[branch.toLowerCase()] || {})["morning"])
                           || (branch.toLowerCase() === "maadi" ? "10:00" : "12:00");
          const openingMs = new Date(todayStr + "T" + openStr + ":00").getTime();
          const minsLate  = Math.round((submitTime.getTime() - openingMs) / 60000);

          if (minsLate <= 10) return; // on time or within grace period (≤10 min)

          // Prevent duplicate auto-penalty for same person on same date
          const already = (state.penalties || []).find(p =>
            p.auto_late && p.user_id === u.id && p.date === todayStr
          );
          if (already) return;

          notifyLeadershipRole("weekly_schedule",
            `Late arrival — ${u.name}`,
            `${minsLate} min late at ${branch} on ${todayStr}.`
          );

          // Penalty tier: 10–60 min = ½ day · 60–120 min = 1 day · >120 min = 2 days
          const kind   = minsLate > 120 ? "two_days" : minsLate > 60 ? "full_day" : "half_day";
          const salary = getSalaryForMonth(u.id, todayStr.slice(0, 7));
          let amount   = penaltyAmount(kind, salary);

          // Doubling rule: 2nd+ late incident from the same barista this month → double the penalty
          const thisMonth      = todayStr.slice(0, 7);
          const priorLateCount = (state.penalties || []).filter(p =>
            p.auto_late && p.user_id === u.id && p.month === thisMonth
          ).length;
          const doubled = priorLateCount >= 1;
          if (doubled) amount = amount * 2;

          const kLabels = { half_day: "Half day", full_day: "Full day", two_days: "2 days" };
          const kLabel  = kLabels[kind] || kind;
          const doubleNote = doubled ? " (×2 — 2nd+ late this month)" : "";

          state.penalties = state.penalties || [];
          state.penalties.push({
            id: uuid(), at: s.at, by: s.by, by_name: s.by_name,
            user_id: u.id, barista: u.name,
            kind, reason: "late",
            date: todayStr,
            month: thisMonth,
            branch,
            amount,
            note: `Auto: ${minsLate} min late — ${kLabel} deducted${doubleNote} (sign-in stamp)`,
            auto_late: true,
          });
          saveState();
          toast(`⚠ ${minsLate} min late — ${kLabel}${doubled ? " ×2" : ""} deducted from ${u.name}'s salary`, "warn");

          // ── High-priority in-app notification + email to owner/head barista ──
          const lateTitle = `🚨 Late Arrival: ${u.name}`;
          const lateBody  = `${minsLate} min late at ${branch} — ${kLabel}${doubleNote} deducted`;
          notifyHaidi(lateTitle, lateBody);
          notifyLeadershipRole("head_barista", lateTitle, lateBody);

          (() => {
            const ownerEmail = ((state.settings || {}).owner_email || "coffeebeats@haidiyacoub.com").trim();
            const hbEmail    = ((state.settings || {}).head_barista_email || "").trim();
            const lateSubj = encodeURIComponent(`[🚨 PRIORITY] [Late Arrival] ${u.name} · ${minsLate} min late · ${branch} · ${todayStr}`);
            const mailBody = encodeURIComponent(
              `🚨 High Priority — Late Arrival\n\nBarista: ${u.name}\nBranch: ${branch}\nDate: ${todayStr}\nMinutes late: ${minsLate}\nPenalty: ${kLabel}${doubleNote}\n\n— Coffee Beats Operations App`
            );
            if (hbEmail) {
              // Send to both HB (To:) and owner (CC:) with priority flag
              try { window.open(`mailto:${encodeURIComponent(hbEmail)}?cc=${encodeURIComponent(ownerEmail)}&subject=${lateSubj}&body=${mailBody}`, "_blank"); } catch(e) {}
            } else {
              // No HB configured — send to owner only with escalation note
              const fallbackSubj = encodeURIComponent(`[PRIORITY — No Head Barista] [Late Arrival] ${u.name} · ${minsLate} min late · ${branch} · ${todayStr}`);
              try { window.open(`mailto:${encodeURIComponent(ownerEmail)}?subject=${fallbackSubj}&body=${mailBody}`, "_blank"); } catch(e) {}
            }
          })();
          // ────────────────────────────────────────────────────────────────────
        })();
        // ─────────────────────────────────────────────────────

        // ── Early arrival bonus toast ─────────────────────────
        if (_earlyBonus) {
          toast(`⭐ ${Math.abs(_stampMinsLate)} min early — punctuality bonus recorded!`, "ok");
        }
        // ─────────────────────────────────────────────────────

        showPhotoConfirm({
          title: "Clock-in recorded!",
          names: photoNames,
          driveIds: stampPhotoField.getDriveIds(),
          onDone: () => go("signin_stamp_list"),
        });
      },
    }, "Submit clock-in"),
    el("button", { class: "btn ghost", style: { marginTop: "8px" }, onClick: () => go("home") }, "← Back to home"),
  ]));
  return wrap;
};

routes.signin_stamp_list = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Sign-In Stamps", "Clock-in records per barista."));

  const mine = state.signin_stamps
    .filter(s => u.role === "owner" || u.role === "accountant" || u.branches.includes(s.branch))
    .sort((a, b) => b.at.localeCompare(a.at))
    .slice(0, 100);

  const list = el("div", { class: "list" });
  if (mine.length === 0) list.appendChild(el("div", { class: "muted" }, "No sign-in stamps yet."));
  for (const s of mine) {
    // Compute status badge from stored mins_late or recalculate
    let minsLate = s.mins_late;
    if (minsLate === undefined) {
      try {
        const branch  = (s.branch||"maadi").toLowerCase();
        const bot     = state.branch_opening_times || {};
        const openStr = ((bot[branch]||{})["morning"]) || (branch === "maadi" ? "10:00" : "12:00");
        const dateStr = localISODate(new Date(s.at));
        const openMs  = new Date(dateStr + "T" + openStr + ":00").getTime();
        minsLate = Math.round((new Date(s.at).getTime() - openMs) / 60000);
      } catch(e) { minsLate = 0; }
    }
    const isEarly   = minsLate <= -15;
    const isOnTime  = minsLate <= 15;
    const isHalfDay = minsLate > 15  && minsLate <= 60;
    const isFullDay = minsLate > 60  && minsLate <= 120;
    const isTwoDays = minsLate > 120;
    const badge = isEarly   ? el("span", { class: "pill", style: { background: "var(--ok)",   color: "#fff" } }, "⭐ Early")
                : isOnTime  ? el("span", { class: "pill", style: { background: "var(--ok)",   color: "#fff" } }, "✅ On time")
                : isHalfDay ? el("span", { class: "pill", style: { background: "var(--warn)",  color: "#fff" } }, "⚠ ½ day")
                : isFullDay ? el("span", { class: "pill", style: { background: "var(--bad)",   color: "#fff" } }, "❌ 1 day")
                :             el("span", { class: "pill", style: { background: "var(--bad)",   color: "#fff" } }, "❌ 2 days");
    const minStr = isEarly ? `${Math.abs(minsLate)} min early` : minsLate > 0 ? `${minsLate} min late` : "on time";
    list.appendChild(el("div", { class: "row" }, [
      el("div", { class: "grow" }, [
        el("div", { class: "title" }, `${s.by_name} · ${s.branch}`),
        el("div", { class: "sub" }, `${fmtDate(s.at)} · ${minStr}${s.note ? " · " + s.note : ""}`),
      ]),
      badge,
    ]));
  }
  wrap.appendChild(list);
  wrap.appendChild(el("div", { class: "sticky-actions" }, [
    el("button", { class: "btn", onClick: () => go("signin_stamp_new") }, "+ New clock-in"),
    el("button", { class: "btn ghost", style: { marginTop: "8px" }, onClick: () => go("home") }, "← Home"),
  ]));
  return wrap;
};
