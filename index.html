routes.leave_list = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Leave Requests", "View, approve, and reject leave requests."));

  state.leaves = state.leaves || [];

  const canManage = (u.role === "owner" || u.role === "head_barista");

  // Filter leaves visible to this user
  const visible = canManage
    ? [...state.leaves].sort((a, b) => b.requested_at.localeCompare(a.requested_at))
    : state.leaves.filter(l => l.user_id === u.id).sort((a, b) => b.requested_at.localeCompare(a.requested_at));

  if (canManage) {
    wrap.appendChild(el("div", { class: "banner-arch" },
      "Approve or reject pending leave requests. Approved leaves block the barista from being assigned in the Weekly Schedule for those days."));
    wrap.appendChild(el("button", {
      class: "btn secondary",
      style: { marginTop: "10px", marginBottom: "4px" },
      onClick: () => go("leave_new"),
    }, "➕ Submit New Leave Request"));
  } else {
    wrap.appendChild(el("div", { class: "banner-arch" },
      "Your leave requests — you can cancel pending requests. Approved leaves cannot be cancelled here; contact the head barista."));
    wrap.appendChild(el("button", {
      class: "btn secondary",
      style: { marginTop: "10px", marginBottom: "4px" },
      onClick: () => go("leave_new"),
    }, "➕ Request New Leave"));
  }

  const list = el("div", { class: "list", style: { marginTop: "12px" } });
  wrap.appendChild(list);

  function draw() {
    list.innerHTML = "";
    const src = canManage
      ? [...state.leaves].sort((a, b) => b.requested_at.localeCompare(a.requested_at))
      : state.leaves.filter(l => l.user_id === u.id).sort((a, b) => b.requested_at.localeCompare(a.requested_at));

    if (!src.length) {
      list.appendChild(el("div", { class: "card muted" }, "No leave requests yet."));
      return;
    }

    for (const leave of src) {
      const days = Math.round((new Date(leave.to_date) - new Date(leave.from_date)) / 86400000) + 1;
      const typeLabel  = leave.type === "annual" ? "🌴 Annual" : "🤒 Sick";
      const statusColor = leave.status === "approved"  ? "var(--ok)"
                        : leave.status === "rejected"  ? "var(--bad)"
                        : leave.status === "cancelled" ? "var(--ink-faint)"
                        : "var(--warn)";
      const statusLabel = leave.status.charAt(0).toUpperCase() + leave.status.slice(1);

      const card = el("div", { class: "card", style: { marginTop: "8px" } });

      // Header row: name + type + status badge
      const hdr = el("div", { style: { display: "flex", alignItems: "center", gap: "8px", marginBottom: "8px" } });
      hdr.appendChild(el("div", { style: { fontWeight: "700", flex: "1" } }, `${leave.user_name}`));
      hdr.appendChild(el("span", { class: "pill" }, typeLabel));
      hdr.appendChild(el("span", { class: "pill", style: { color: statusColor, borderColor: statusColor } }, statusLabel));
      card.appendChild(hdr);

      // Dates & duration
      card.appendChild(el("div", { class: "kv" }, [
        el("div", { class: "k" }, "Dates"),
        el("div", { class: "v" }, `${leave.from_date} → ${leave.to_date}  (${days} day${days > 1 ? "s" : ""})`),
      ]));
      if (leave.reason) {
        card.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, "Reason"),
          el("div", { class: "v" }, leave.reason),
        ]));
      }
      card.appendChild(el("div", { class: "kv" }, [
        el("div", { class: "k" }, "Requested by"),
        el("div", { class: "v" }, `${leave.requested_by_name} · ${fmtDate(leave.requested_at)}`),
      ]));
      if (leave.reviewed_by_name) {
        card.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, `${statusLabel} by`),
          el("div", { class: "v" }, `${leave.reviewed_by_name} · ${fmtDate(leave.reviewed_at)}`),
        ]));
      }
      if (leave.review_note) {
        card.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, "Note"),
          el("div", { class: "v" }, leave.review_note),
        ]));
      }

      // Action buttons
      if (leave.status === "pending") {
        const btnRow = el("div", { class: "btn-row", style: { marginTop: "10px" } });

        if (canManage) {
          const approveBtn = el("button", { class: "btn", style: { background: "var(--ok)", color: "#fff" } }, "✓ Approve");
          approveBtn.addEventListener("click", () => {
            const note = prompt("Approval note (optional):") || "";
            const s = stamp();
            leave.status = "approved";
            leave.reviewed_by = s.by;
            leave.reviewed_by_name = s.by_name;
            leave.reviewed_at = s.at;
            leave.review_note = note;
            saveState();
            // Notify barista by email
            const person = state.users.find(x => x.id === leave.user_id);
            const personEmail = (person && person.email || "").trim();
            const ownerEmail  = (state.settings.owner_email || "coffeebeats@haidiyacoub.com").trim();
            if (personEmail) {
              const subj = encodeURIComponent(`[Leave Approved] ${leave.from_date} → ${leave.to_date}`);
              const body = encodeURIComponent(
                `Your leave request has been approved.\n\n` +
                `Type: ${leave.type === "annual" ? "Annual Leave" : "Sick Leave"}\n` +
                `From: ${leave.from_date}\nTo: ${leave.to_date}\n` +
                (note ? `Note: ${note}\n` : "") +
                `\nApproved by: ${s.by_name}\n— Coffee Beats Operations`
              );
              try { window.open(`mailto:${encodeURIComponent(personEmail)}?cc=${encodeURIComponent(ownerEmail)}&subject=${subj}&body=${body}`, "_blank"); } catch(e) {}
            }
            toast(`Leave approved for ${leave.user_name}`);
            draw();
          });

          const rejectBtn = el("button", { class: "btn danger" }, "✕ Reject");
          rejectBtn.addEventListener("click", () => {
            const note = prompt("Reason for rejection (required):") || "";
            if (!note.trim()) return toast("Please provide a rejection reason", "error");
            const s = stamp();
            leave.status = "rejected";
            leave.reviewed_by = s.by;
            leave.reviewed_by_name = s.by_name;
            leave.reviewed_at = s.at;
            leave.review_note = note;
            saveState();
            toast(`Leave rejected for ${leave.user_name}`);
            draw();
          });

          btnRow.appendChild(approveBtn);
          btnRow.appendChild(rejectBtn);
        }

        // Barista can cancel their own pending leave; head barista/owner can also cancel
        if (!canManage && leave.user_id === u.id || canManage) {
          const cancelBtn = el("button", { class: "btn ghost" }, "Cancel Request");
          cancelBtn.addEventListener("click", () => {
            if (!confirm("Cancel this leave request?")) return;
            const s = stamp();
            leave.status = "cancelled";
            leave.reviewed_by = s.by;
            leave.reviewed_by_name = s.by_name;
            leave.reviewed_at = s.at;
            leave.review_note = "Cancelled";
            saveState();
            toast("Leave request cancelled");
            draw();
          });
          btnRow.appendChild(cancelBtn);
        }

        card.appendChild(btnRow);
      } else if (leave.status === "approved" && canManage) {
        // Allow head barista/owner to revoke an approval (barista situation changed)
        const revokeBtn = el("button", {
          class: "btn ghost",
          style: { marginTop: "10px", width: "auto" },
        }, "↩ Revoke Approval");
        revokeBtn.addEventListener("click", () => {
          if (!confirm(`Revoke approval for ${leave.user_name}'s leave (${leave.from_date} → ${leave.to_date})? This will make the barista available in the schedule again.`)) return;
          const s = stamp();
          leave.status = "rejected";
          leave.reviewed_by = s.by;
          leave.reviewed_by_name = s.by_name;
          leave.reviewed_at = s.at;
          leave.review_note = "Approval revoked";
          saveState();
          toast(`Approval revoked — ${leave.user_name} is now available in the schedule`);
          draw();
        });
        card.appendChild(revokeBtn);
      }

      list.appendChild(card);
    }
  }

  draw();
  wrap.appendChild(btnBack());
  return wrap;
};

      ]
    },
    {
      number: "14", title: "Emergency Contacts",
      content: [
        { type: "para", text: "Each barista must have at least one emergency contact on file. Emergency contact information is stored in the Operations App under each barista's HR profile and is accessible to the owner and head barista at all times." },
        { type: "subheader", text: "What to Provide" },
        { type: "bullets", items: ["Emergency contact name", "Relationship (e.g. spouse, parent, sibling)", "Phone number"] },
        { type: "para", text: "Contact details must be kept up to date. Notify the head barista immediately if your emergency contact changes." },
      ]
    },
  ];

  if (!state.om_overrides) state.om_overrides = {};

  function omContentToText(content) {
    return content.map(item => {
      if (item.type === "para")      return item.text;
      if (item.type === "subheader") return "## " + item.text;
      if (item.type === "bullets")   return item.items.map(i => "- " + i.replace(/<[^>]+>/g, "")).join("\n");
      return "";
    }).join("\n\n");
  }

  function omTextToContent(text) {
    const lines = text.split("\n");
    const result = [];
    let bullets = [];
    for (const raw of lines) {
      const line = raw.trimEnd();
      if (!line.trim()) {
        if (bullets.length) { result.push({ type: "bullets", items: [...bullets] }); bullets = []; }
        continue;
      }
      if (line.startsWith("## ")) {
        if (bullets.length) { result.push({ type: "bullets", items: [...bullets] }); bullets = []; }
        result.push({ type: "subheader", text: line.slice(3).trim() });
      } else if (line.startsWith("- ")) {
        bullets.push(line.slice(2).trim());
      } else {
        if (bullets.length) { result.push({ type: "bullets", items: [...bullets] }); bullets = []; }
        result.push({ type: "para", text: line.trim() });
      }
    }
    if (bullets.length) result.push({ type: "bullets", items: bullets });
    return result;
  }

  function renderOMBody(content, bodyEl) {
    bodyEl.innerHTML = "";
    content.forEach(item => {
      if (item.type === "para") {
        const p = el("p", { style: { fontSize: "13.5px", lineHeight: "1.65", color: "var(--ink)", margin: "0 0 10px" } });
        p.textContent = item.text;
        bodyEl.appendChild(p);
      } else if (item.type === "subheader") {
        bodyEl.appendChild(el("div", { style: { fontWeight: "700", fontSize: "13px", color: "var(--ink)", margin: "10px 0 6px" } }, item.text));
      } else if (item.type === "bullets") {
        const ul = el("ul", { style: { margin: "0 0 10px", paddingInlineStart: "18px", fontSize: "13px", lineHeight: "1.65", color: "var(--ink)" } });
        item.items.forEach(txt => {
          const li = el("li", { style: { marginBottom: "5px" } });
          li.innerHTML = txt;
          ul.appendChild(li);
        });
        bodyEl.appendChild(ul);
      }
    });
  }

  const canEditOM = u && ["owner", "head_barista"].includes(u.role);

  const operatingModelSection = el("div", {});
  OM_SECTIONS.forEach(sec => {
    const card = el("div", { class: "card", style: { marginBottom: "14px", padding: "0", overflow: "hidden", border: "1px solid var(--border)", borderRadius: "8px" } });

    // ── Header row ──
    const cardHead = el("div", { style: { background: "#3b2314", color: "#f5e6d3", padding: "10px 14px", display: "flex", alignItems: "center", justifyContent: "space-between" } });
    cardHead.appendChild(el("div", { style: { fontWeight: "700", fontSize: "14px", letterSpacing: "0.3px" } }, `${sec.number}. ${sec.title}`));
    if (canEditOM) {
      const editBtn = el("button", { style: { background: "rgba(255,255,255,0.15)", color: "#f5e6d3", border: "none", borderRadius: "4px", padding: "3px 10px", fontSize: "12px", cursor: "pointer" } }, "Edit");
      cardHead.appendChild(editBtn);
      editBtn.addEventListener("click", () => {
        editForm.style.display = editForm.style.display === "none" ? "" : "none";
        if (editForm.style.display !== "none") {
          const currentContent = state.om_overrides[sec.number] || sec.content;
          ta.value = omContentToText(currentContent);
          ta.focus();
        }
      });
    }
    card.appendChild(cardHead);

    // ── Body ──
    const body = el("div", { style: { padding: "12px 14px" } });
    const currentContent = state.om_overrides[sec.number] || sec.content;
    renderOMBody(currentContent, body);
    card.appendChild(body);

    // ── Inline edit form (owner/head barista only) ──
    const editForm = el("div", { style: { display: "none", padding: "12px 14px", borderTop: "1px solid var(--border)", background: "var(--surface-2)" } });
    if (canEditOM) {
      const hint = el("div", { style: { fontSize: "11.5px", color: "var(--ink-dim)", marginBottom: "6px" } },
        "Lines starting with ## = sub-header  ·  Lines starting with - = bullet  ·  Other lines = paragraph");
      const ta = el("textarea", { style: { width: "100%", minHeight: "180px", fontSize: "13px", lineHeight: "1.6", padding: "8px", borderRadius: "6px", border: "1px solid var(--border)", background: "var(--bg)", color: "var(--ink)", fontFamily: "monospace", boxSizing: "border-box", resize: "vertical" } });
      const btnRow = el("div", { style: { display: "flex", gap: "8px", marginTop: "8px" } });
      const saveBtn = el("button", { class: "btn", style: { flex: "1" } }, "Save");
      const resetBtn = el("button", { class: "btn ghost", style: { flex: "1" } }, "Reset to default");
      const cancelBtn = el("button", { class: "btn ghost" }, "Cancel");
      btnRow.append(saveBtn, resetBtn, cancelBtn);
      editForm.append(hint, ta, btnRow);

      saveBtn.addEventListener("click", () => {
        state.om_overrides[sec.number] = omTextToContent(ta.value);
        saveState();
        renderOMBody(state.om_overrides[sec.number], body);
        editForm.style.display = "none";
        toast("Section updated", "ok");
      });
      resetBtn.addEventListener("click", () => {
        delete state.om_overrides[sec.number];
        saveState();
        renderOMBody(sec.content, body);
        editForm.style.display = "none";
        toast("Reset to default", "ok");
      });
      cancelBtn.addEventListener("click", () => { editForm.style.display = "none"; });
    }
    card.appendChild(editForm);

    operatingModelSection.appendChild(card);
  });
  wrap.appendChild(operatingModelSection);

  function renderSections() {
    recipesSection.style.display = activeTab === "recipes" ? "" : "none";
    operatingModelSection.style.display = activeTab === "operating_model" ? "" : "none";
  }
  renderSections();

  // ── Recipe editor modal ──
  function openRecipeEditor(existing) {
    const isNew = !existing;
    const draft = existing ? { ...existing, ingredients: [...(existing.ingredients||[])], steps: [...(existing.steps||[])] }
                           : { id: uuid(), category: "", name: "", size: "", time: "", coffee_notes: "", ingredients: [""], steps: [""] };

    const root = document.querySelector("#modal-root");
    root.innerHTML = "";
    const sheet = el("div", { class: "sheet", onClick: e => { if (e.target === sheet) root.innerHTML = ""; } });
    const inner = el("div", { class: "sheet-inner" });

    inner.appendChild(el("h2", { style: { marginBottom: "12px" } }, isNew ? "Add Recipe" : "Edit Recipe"));

    // Category
    inner.appendChild(el("label", {}, "Category"));
    const catIn = el("input", { type: "text", value: draft.category, placeholder: "e.g. Iced Coffee" });
    catIn.addEventListener("input", () => draft.category = catIn.value.trim());
    inner.appendChild(catIn);

    // Name
    inner.appendChild(el("label", {}, "Recipe Name"));
    const nameIn = el("input", { type: "text", value: draft.name, placeholder: "e.g. Iced Lavender Latte" });
    nameIn.addEventListener("input", () => draft.name = nameIn.value.trim());
    inner.appendChild(nameIn);

    // Size / Time row
    const metaRow = el("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px" } });
    const sizeIn = el("input", { type: "text", value: draft.size, placeholder: "e.g. 16 oz" });
    sizeIn.addEventListener("input", () => draft.size = sizeIn.value.trim());
    const timeIn = el("input", { type: "text", value: draft.time, placeholder: "e.g. 5 min" });
    timeIn.addEventListener("input", () => draft.time = timeIn.value.trim());
    metaRow.appendChild(el("div", {}, [el("label", { style: { marginTop: "0" } }, "Cup Size"), sizeIn]));
    metaRow.appendChild(el("div", {}, [el("label", { style: { marginTop: "0" } }, "Prep Time"), timeIn]));
    inner.appendChild(metaRow);

    // Coffee notes (optional banner)
    inner.appendChild(el("label", {}, "Coffee Notes (optional — e.g. Coffee Type 1 · Extraction: 26–30 sec · Brew Ratio 1:2)"));
    const notesIn = el("input", { type: "text", value: draft.coffee_notes || "", placeholder: "Leave blank to hide the banner" });
    notesIn.addEventListener("input", () => draft.coffee_notes = notesIn.value.trim());
    inner.appendChild(notesIn);

    // Ingredients dynamic list
    inner.appendChild(el("label", {}, "Ingredients"));
    const ingBox = el("div", {});
    function renderIngBox() {
      ingBox.innerHTML = "";
      draft.ingredients.forEach((ing, idx) => {
        const row = el("div", { style: { display: "flex", gap: "6px", marginBottom: "6px" } });
        const inp = el("input", { type: "text", value: ing, placeholder: "e.g. Espresso: 18 g", style: { flex: "1" } });
        inp.addEventListener("input", () => draft.ingredients[idx] = inp.value);
        const rem = el("button", { class: "btn ghost", style: { width: "auto", padding: "6px 10px", fontSize: "12px" } }, "✕");
        rem.addEventListener("click", () => { draft.ingredients.splice(idx, 1); renderIngBox(); });
        row.appendChild(inp); row.appendChild(rem);
        ingBox.appendChild(row);
      });
      const addIng = el("button", { class: "btn ghost", style: { fontSize: "12px", marginTop: "2px" } }, "+ Add ingredient");
      addIng.addEventListener("click", () => { draft.ingredients.push(""); renderIngBox(); });
      ingBox.appendChild(addIng);
    }
    renderIngBox();
    inner.appendChild(ingBox);

    // Steps dynamic list
    inner.appendChild(el("label", {}, "Preparation Steps"));
    const stepsBox = el("div", {});
    function renderStepsBox() {
      stepsBox.innerHTML = "";
      draft.steps.forEach((step, idx) => {
        const row = el("div", { style: { display: "flex", gap: "6px", marginBottom: "6px", alignItems: "flex-start" } });
        const num = el("span", { style: { padding: "12px 6px 0", fontSize: "13px", color: "var(--ink-dim)", flexShrink: "0" } }, `${idx+1}.`);
        const inp = el("textarea", { placeholder: "Describe step…", style: { flex: "1", minHeight: "48px", resize: "vertical" } });
        inp.value = step;
        inp.addEventListener("input", () => draft.steps[idx] = inp.value);
        const rem = el("button", { class: "btn ghost", style: { width: "auto", padding: "6px 10px", fontSize: "12px", marginTop: "6px" } }, "✕");
        rem.addEventListener("click", () => { draft.steps.splice(idx, 1); renderStepsBox(); });
        row.appendChild(num); row.appendChild(inp); row.appendChild(rem);
        stepsBox.appendChild(row);
      });
      const addStep = el("button", { class: "btn ghost", style: { fontSize: "12px", marginTop: "2px" } }, "+ Add step");
      addStep.addEventListener("click", () => { draft.steps.push(""); renderStepsBox(); });
      stepsBox.appendChild(addStep);
    }
    renderStepsBox();
    inner.appendChild(stepsBox);

    // Action buttons
    const btnRow = el("div", { class: "btn-row", style: { marginTop: "16px" } });

    if (!isNew) {
      const delBtn = el("button", { class: "btn danger", style: { flex: "0 0 auto" } }, "Delete");
      delBtn.addEventListener("click", () => {
        if (!confirm(`Delete "${existing.name}"?`)) return;
        state.handbook_recipes = state.handbook_recipes.filter(r => r.id !== existing.id);
        saveState(); root.innerHTML = ""; renderRecipes(); buildTabs(); toast("Recipe deleted.");
      });
      btnRow.appendChild(delBtn);
    }

    const cancelBtn = el("button", { class: "btn ghost" }, "Cancel");
    cancelBtn.addEventListener("click", () => root.innerHTML = "");
    btnRow.appendChild(cancelBtn);

    const saveBtn = el("button", { class: "btn" }, isNew ? "Add Recipe" : "Save Changes");
    saveBtn.addEventListener("click", () => {
      if (!draft.name) { toast("Enter a recipe name."); return; }
      if (!draft.category) { toast("Enter a category."); return; }
      draft.ingredients = draft.ingredients.filter(x => x.trim());
      draft.steps = draft.steps.filter(x => x.trim());
      if (isNew) {
        state.handbook_recipes.push(draft);
      } else {
        const idx = state.handbook_recipes.findIndex(r => r.id === existing.id);
        if (idx >= 0) state.handbook_recipes[idx] = draft;
      }
      saveState(); root.innerHTML = ""; renderRecipes(); buildTabs();
      toast(isNew ? "Recipe added ✓" : "Recipe updated ✓");
    });
    btnRow.appendChild(saveBtn);
    inner.appendChild(btnRow);

    sheet.appendChild(inner);
    root.appendChild(sheet);
  }

  wrap.appendChild(btnBack());
  return wrap;
};

routes.assets_new = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Upload Asset", "Store a file or document with a title and note."));

  let pendingUrl = "";
  let title = "";
  let note = "";
  let folder = "assets";

  const card = el("div", { class: "card" });

  // Title input
  card.appendChild(el("label", {}, "Title *"));
  const titleIn = el("input", { type: "text", placeholder: "e.g. Lease agreement, Equipment manual…" });
  titleIn.addEventListener("input", () => { title = titleIn.value.trim(); });
  card.appendChild(titleIn);

  // Note input
  card.appendChild(el("label", { style: { marginTop: "10px" } }, "Note (optional)"));
  const noteIn = el("input", { type: "text", placeholder: "Any additional context…" });
  noteIn.addEventListener("input", () => { note = noteIn.value.trim(); });
  card.appendChild(noteIn);

  // Photo/file upload using existing makePhotoField
  const assetPhotoField = makePhotoField({ label: "File / Photo *", required: true, multiple: false, formLabel: "Asset Upload" });
  card.appendChild(assetPhotoField.el);

  // Submit
  const submitBtn = el("button", { class: "btn", style: { marginTop: "14px" } }, "Save Asset");
  submitBtn.addEventListener("click", () => {
    const urls = assetPhotoField.getCloudUrls().filter(Boolean);
    if (!title) { toast("Enter a title first", "error"); return; }
    if (!urls.length) { toast("Upload a file first", "error"); return; }
    const s = stamp();
    state.assets = state.assets || [];
    state.assets.unshift({
      id: uuid(),
      at: s.at,
      by: s.by,
      by_name: s.by_name,
      title,
      note,

/**
 * makePhotoField({ label, required, multiple, formLabel })
 * Returns { el, getBlobs(), getCloudUrls(), count() }
 * Renders a drag-drop zone with live thumbnail previews.
 * Auto-uploads to Cloudinary (free) if configured in Settings.
 * formLabel: used for photo_log context (e.g. "Cleaning Log")
 */
function makePhotoField({ label = "Photo(s)", required = false, multiple = true, formLabel = "" } = {}) {
  const container = el("div", { style: { marginTop: "12px" } });
  const labelEl = el("div", { style: { fontWeight: "600", fontSize: "14px", color: "var(--ink-dim)", marginBottom: "8px" } },
    label + (required ? " *" : " (optional)"));
  container.appendChild(labelEl);

  // Drop zone
  const dropZone = el("div", { class: "photo-drop" });
  const fileInput = el("input", { type: "file", accept: "image/*" });
  if (multiple) fileInput.setAttribute("multiple", "true");
  dropZone.appendChild(el("div", { class: "drop-icon" }, "📷"));
  dropZone.appendChild(el("div", { class: "drop-label" }, multiple ? "Tap to add photos" : "Tap to add a photo"));
  dropZone.appendChild(el("div", { class: "drop-sub" }, multiple ? "Multiple files OK · drag & drop supported" : "Drag & drop supported"));
  dropZone.appendChild(fileInput);
  container.appendChild(dropZone);

  // Preview grid
  const grid = el("div", { class: "photo-preview-grid" });
  container.appendChild(grid);

  let blobs = [];
  let cloudUrls = []; // Cloudinary secure_url per photo

  async function tryCloudUpload(file, idx, statusBar, badge) {
    if (!Cloudinary.isConfigured()) return;
    statusBar.className = "ph-status uploading";
    try {
      // Build filename: April28_CleaningLog_Seif
      const _now = new Date();
      const _months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      const _dateStamp = _months[_now.getMonth()] + _now.getDate();
      const _uploader = (typeof currentUser === "function" && currentUser()?.name)
        ? currentUser().name.split(" ")[0]
        : "Unknown";
      const _label = formLabel ? formLabel.replace(/\s+/g,"") : "Upload";
      const filename = `${_dateStamp}_${_label}_${_uploader}`;
      const data = await Cloudinary.uploadPhoto(file, filename);
      cloudUrls[idx] = data.secure_url;
      // Log to state for gallery
      if (typeof state !== "undefined") {
        state.photo_log = state.photo_log || [];
        state.photo_log.unshift({
          id: data.public_id,
          url: data.secure_url,
          name: file.name,
          form: formLabel || "Upload",
          at: new Date().toISOString(),
        });
        // Keep log manageable (latest 500)
        if (state.photo_log.length > 500) state.photo_log.length = 500;
        // Persist and sync to Firestore
        saveState();
      }
      statusBar.className = "ph-status done";
      badge.style.display = "block";
    } catch (e) {
      console.warn("Cloudinary upload:", e.message);
      statusBar.className = "ph-status error";
    }
  }

  function addFiles(files) {
    for (const file of files) {
      if (!file.type.startsWith("image/")) continue;
      const idx = blobs.length;
      blobs.push(file);
      cloudUrls.push(null);

      const wrap = el("div", { class: "photo-thumb-wrap" });
      const img = new Image();
      img.style.cssText = "width:100%;height:100%;object-fit:cover;display:block;";
      img.src = URL.createObjectURL(file);
      wrap.appendChild(img);

      const rmBtn = el("button", { class: "ph-remove" }, "×");
      rmBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        blobs.splice(idx, 1);
        cloudUrls.splice(idx, 1);
        URL.revokeObjectURL(img.src);
        wrap.remove();
      });
      wrap.appendChild(rmBtn);

      const statusBar = el("div", { class: "ph-status" });
      wrap.appendChild(statusBar);

      const badge = el("div", { class: "drive-badge", style: { display: "none" } }, "☁ Saved");
      wrap.appendChild(badge);

      grid.appendChild(wrap);
      tryCloudUpload(file, idx, statusBar, badge);
    }
  }

  fileInput.addEventListener("change", (e) => { addFiles([...e.target.files]); fileInput.value = ""; });
  dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("drag-over"); });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
  dropZone.addEventListener("drop", (e) => { e.preventDefault(); dropZone.classList.remove("drag-over"); addFiles([...e.dataTransfer.files]); });

  return {
    el: container,
    getBlobs: () => blobs,
    getCloudUrls: () => cloudUrls,
    // backwards compat alias so existing submit code still works
    getDriveIds: () => cloudUrls,
    count: () => blobs.length,
  };
}

function header(title, sub) {
  return el("div", { style: { marginBottom: "8px" } }, [
    el("div", { style: { display: "flex", alignItems: "center", gap: "8px" } }, [
      el("button", { class: "chip", onClick: () => go("home") }, "← Home"),
      el("h2", { style: { margin: 0, fontSize: "18px" } }, title),
    ]),
    sub ? el("div", { class: "muted small" }, sub) : null,
  ]);
}
function btnBack() {
  return el("div", { class: "sticky-actions" }, [ el("button", { class: "btn ghost", onClick: () => go("home") }, "← Back to home") ]);
}
function openSheet(content) {
  const root = $("#modal-root"); root.innerHTML = "";
  const s = el("div", { class: "sheet", onClick: (e) => { if (e.target === s) root.innerHTML = ""; } },
    el("div", { class: "sheet-inner" }, [
      content,
      el("div", { class: "sticky-actions" }, el("button", { class: "btn ghost", onClick: () => root.innerHTML = "" }, "Close")),
    ]));
  root.appendChild(s);
}
function closeSheet() { $("#modal-root").innerHTML = ""; }
function openPrompt({ title, fields, onSubmit, extraButtons }) {
  const vals = {}; for (const f of fields) vals[f.key] = f.value;
  const body = el("div", {}, [ el("h2", {}, title) ]);
  for (const f of fields) {
    body.appendChild(el("label", {}, f.label));
    if (f.type === "file") {
      const i = el("input", { type: "file", accept: f.accept || "image/*" });
      i.addEventListener("change", () => { vals[f.key] = i.files && i.files[0] ? i.files[0] : null; });
      body.appendChild(i);
    } else if (f.type === "select" && Array.isArray(f.options)) {
      const sel = el("select", {});
      for (const opt of f.options) {
        const o = el("option", { value: String(opt.value != null ? opt.value : opt) }, String(opt.label != null ? opt.label : opt));
        if (String(opt.value != null ? opt.value : opt) === String(f.value)) o.selected = true;
        sel.appendChild(o);
      }
      sel.addEventListener("change", () => vals[f.key] = sel.value);
      body.appendChild(sel);
    } else {
      const i = el("input", { type: f.type || "text", value: String(f.value ?? "") });
      i.addEventListener("input", () => vals[f.key] = i.value);
      body.appendChild(i);
    }
  }
  const actions = el("div", { class: "sticky-actions" });
  actions.appendChild(el("button", { class: "btn", onClick: async () => { $("#modal-root").innerHTML = ""; await onSubmit(vals); } }, "Save"));
  if (Array.isArray(extraButtons)) {
    for (const b of extraButtons) {
      actions.appendChild(el("button", { class: "btn ghost", style: { marginTop: "8px" }, onClick: () => { $("#modal-root").innerHTML = ""; b.onClick(); } }, b.label));
    }
  }
  body.appendChild(actions);
  openSheet(body);
}

// ─── Auto-score helpers ────────────────────────────────────────────────────
function kpiLocalDateStr(ts) {
  // Returns YYYY-MM-DD in local timezone from a timestamp or ISO string
  const d = new Date(ts);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function kpiPunctualityScore(userId, cutoff) {
  const bot    = state.branch_opening_times || {};
  const today  = new Date();
  const todayStr = localISODate(today);

  // Build a map of stamp date+branch → stamp record for quick lookup
  const stampMap = {};
  (state.signin_stamps||[]).filter(s => s.by === userId).forEach(s => {
    const key = localISODate(new Date(s.at)) + "|" + (s.branch||"maadi").toLowerCase();
    if (!stampMap[key]) stampMap[key] = s; // keep earliest stamp per day/branch
  });

  // Find all morning shifts scheduled for this user in the scoring window
  const dayScores = [];
  const cutoffDate = new Date(cutoff);
  for (let d = new Date(cutoffDate); ; d.setDate(d.getDate() + 1)) {
    const dateStr = localISODate(d);
    if (dateStr >= todayStr) break; // don't score future/today (stamp may not be due yet)
    const dayIndex = (d.getDay() + 6) % 7;
    const dayKey   = ROSTER_DAYS[dayIndex];
    const weekOf   = mondayOf(dateStr);
    const entries  = (state.rosters||[]).filter(r =>
      r.week_of === weekOf && r.day === dayKey &&
      r.shift === "morning" && r.user_id === userId
    );
    for (const entry of entries) {
      const branch  = (entry.branch||"maadi").toLowerCase();
      const openStr = ((bot[branch]||{})["morning"]) || (branch === "maadi" ? "10:00" : "12:00");
      const openMs  = new Date(dateStr + "T" + openStr + ":00").getTime();
      const st      = stampMap[dateStr + "|" + branch];
      if (!st) {
        dayScores.push(0); // no stamp = worst score
      } else {
        const diff = Math.round((new Date(st.at).getTime() - openMs) / 60000);
        // early (≥30 min before): full score; on-time (<15 min late): full; half-day late: 50; full-day: 20
        dayScores.push(diff <= -30 ? 100 : diff <= 15 ? 100 : diff <= 120 ? 50 : 20);
      }
    }
  }

  // If no roster data, fall back to scoring stamps directly (no missing-stamp penalty)
  if (dayScores.length === 0) {
    const stamps = (state.signin_stamps||[]).filter(s => s.by === userId && new Date(s.at).getTime() >= cutoff);
    if (!stamps.length) return null;
    const scores = stamps.map(s => {
      try {
        const submitTime  = new Date(s.at);
        const branch      = (s.branch||"maadi").toLowerCase();
        const openStr     = ((bot[branch]||{})["morning"]) || (branch === "maadi" ? "10:00" : "12:00");
        const scheduledMs = new Date(localISODate(submitTime) + "T" + openStr + ":00").getTime();
        const diff        = Math.round((submitTime.getTime() - scheduledMs) / 60000);
        return diff <= -30 ? 100 : diff <= 15 ? 100 : diff <= 120 ? 50 : 20;
      } catch(e) { return 70; }
    });
    return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
  }

  return Math.round(dayScores.reduce((a,b)=>a+b,0)/dayScores.length);
}
// Applies 3-day deductions for morning-shift baristas who submitted no stamp on a given date.
// Returns the number of new penalties created.
function applyMissingStampPenalties(dateStr, appliedBy) {
  const dayIndex = (new Date(dateStr + "T12:00:00").getDay() + 6) % 7;
  const dayKey   = ROSTER_DAYS[dayIndex];
  const weekOf   = mondayOf(dateStr);
  const morning  = (state.rosters||[]).filter(r =>
    r.week_of === weekOf && r.day === dayKey && r.shift === "morning"
  );
  if (!morning.length) return 0;
  state.penalties = state.penalties || [];
  state.salary_config = state.salary_config || {};
  let created = 0;
  for (const entry of morning) {
    const uid    = entry.user_id;
    const branch = (entry.branch||"").toLowerCase();
    const user   = (state.users||[]).find(u => u.id === uid);
    if (!user) continue;
    // Check for existing stamp that day+branch
    const hasStamp = (state.signin_stamps||[]).some(s =>
      s.by === uid && localISODate(new Date(s.at)) === dateStr &&
      (s.branch||"").toLowerCase() === branch
    );
    if (hasStamp) continue;
    // Check no duplicate auto_no_stamp penalty for same user+date
    const already = state.penalties.find(p =>
      p.auto_no_stamp && p.user_id === uid && p.date === dateStr
    );
    if (already) continue;
    const salary = Number(((state.salary_config)[uid]||{}).monthly_salary || 0);
    const amount = penaltyAmount("three_days", salary);
    state.penalties.push({
      id: uuid(), at: now(), by: appliedBy.by, by_name: appliedBy.by_name,
      user_id: uid, barista: user.name,
      kind: "three_days", reason: "no_show",
      date: dateStr, month: dateStr.slice(0, 7), branch,
      amount,
      note: `Auto: no sign-in stamp — 3 days deducted`,
      auto_no_stamp: true,
    });
    notifyLeadershipRole("weekly_schedule",
      `Missing stamp — ${user.name}`,
      `No sign-in recorded for ${dateStr} at ${branch}. 3-day deduction applied.`
    );
    created++;
  }
  if (created) saveState();
  return created;
}

function kpiWasteScore(userId, cutoff) {
  const entries = (state.waste||[]).filter(w => w.by === userId && new Date(w.at).getTime() >= cutoff);
  if (!entries.length) return null;
  // Group by calendar day
  const byDay = {};
  entries.forEach(w => {
    const d = kpiLocalDateStr(new Date(w.at));
    if (!byDay[d]) byDay[d] = [];
    byDay[d].push(w);
  });
  const dayScores = Object.values(byDay).map(items => {
    if (items.every(i => i.item_name === "— No waste —")) return 100;
    let score = 100;
    items.filter(w => w.item_name !== "— No waste —").forEach(w => {
      const name = (w.item_name||"").toLowerCase();
      const qty  = w.qty_canonical || 0;
      const reason = (w.reason||"").toLowerCase();
      const isCal = reason.includes("training") || reason.includes("calibr");
      if (name.includes("espresso")||name.includes("shot")||name.includes("coffee")||name.includes("bean")) {
        score -= isCal ? qty*2 : qty*6;           // 6 pts per shot (SCA: ≤3 shots/shift target)
      } else if (name.includes("milk")||name.includes("oat")||name.includes("almond")||name.includes("soy")||name.includes("cream")) {
        const ml = (w.unit==="L"||(w.unit||"").toLowerCase()==="litre") ? qty*1000 : qty;
        score -= isCal ? Math.floor(ml/200)*3 : Math.floor(ml/100)*5; // 5 pts per 100ml (SCA: ≤100ml/shift)
      } else {
        score -= isCal ? qty*1 : qty*3;
      }
    });
    return Math.max(Math.round(score), 10);
  });
  return Math.round(dayScores.reduce((a,b)=>a+b,0)/dayScores.length);
}
function kpiCleanlinessScore(userId, cutoff) {
  const logs = (state.cleaning_logs||[]).filter(l => l.by === userId && new Date(l.at).getTime() >= cutoff);
  if (!logs.length) return null;
  const scores = logs.map(l => l.checklist_score != null ? l.checklist_score : 65); // legacy logs without checklist get 65
  return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
}
// Auto-calculates Coffee Craft score from customer reviews where the customer
// selected "coffee" as the standout. Uses star rating × 20 to produce 0–100.
// Falls back to manual entry if no matching reviews exist.
function kpiCraftScore(userId, cutoff) {
  const user     = (state.users||[]).find(u => u.id === userId);
  const userName = (user?.name || "").toLowerCase().trim();
  const feedbacks = (state.customer_feedback||[]).filter(f => {
    const byId   = f.user_id === userId || f.barista_id === userId;
    const bName  = (f.barista_name || "").toLowerCase().trim();
    const byName = userName && bName && (bName === userName || bName.startsWith(userName) || userName.startsWith(bName));
    const inWindow = (f.at ? new Date(f.at).getTime() : 0) >= cutoff;
    const standout = (f.standout || "").toLowerCase();
    const coffeeStandout = standout.includes("coffee") || standout.includes("craft") || standout.includes("espresso") || standout.includes("latte") || standout.includes("barista skill");
    return (byId || byName) && inWindow && coffeeStandout;
  });
  if (!feedbacks.length) return null;
  const avg = feedbacks.reduce((s,f) => s + (f.rating||0), 0) / feedbacks.length;
  return Math.round(avg * 20);
}
function kpiCustomerScore(userId) {
  const user     = (state.users||[]).find(u => u.id === userId);
  const userName = (user?.name || "").toLowerCase().trim();
  const cutoff   = Date.now() - 30*24*60*60*1000; // rolling 30 days, same as other KPI categories

  const feedbacks = (state.customer_feedback||[]).filter(f => {
    // Match by user_id / barista_id (internal) OR by barista_name string (from coffeebeats.art)
    const byId   = f.user_id === userId || f.barista_id === userId;
    const bName  = (f.barista_name || "").toLowerCase().trim();
    const byName = userName && bName && (bName === userName || bName.startsWith(userName) || userName.startsWith(bName));
    const inWindow = (f.at ? new Date(f.at).getTime() : 0) >= cutoff;
    return (byId || byName) && inWindow;
  });

  if (!feedbacks.length) return null;
  const avg = feedbacks.reduce((s,f) => s + (f.rating||0), 0) / feedbacks.length;
  return Math.round(avg * 20); // convert 0–5 stars to 0–100
}


// Auto-calculates teamwork score based on reorder action compliance in last 30 days.
// Penalty per alert where the on-shift barista is userId:
//   - Action within 24h of alert:          0 pts penalty
//   - Action within 3 days:               -10 pts
//   - Action after first follow-up (3d):  -20 pts
//   - Action after second follow-up (5d): -30 pts
//   - No action logged at all (>6d):      -50 pts
// Returns null if no relevant alerts found (score not counted).
function kpiTeamworkScore(userId, cutoff) {
  const alerts = (state.alert_log || []).filter(a => {
    const alertTime = new Date(a.date + "T00:00:00").getTime();
    return alertTime >= cutoff;
  });
  if (!alerts.length) return null;

  // Find alerts where this barista was on shift at the time of the alert
  const myAlerts = alerts.filter(a => {
    return (state.rosters || []).some(r =>
      r.user_id === userId &&
      r.branch  === a.branch &&
      r.week_of <= a.date && a.date <= r.week_of // same week — refine below
    ) || (state.reorder_actions || []).some(r => r.alert_key === a.key && r.by === userId);
  });

  // Fallback: include alerts the barista personally actioned regardless of roster match
  const alertsToScore = myAlerts.length > 0 ? myAlerts : [];
  if (!alertsToScore.length) return null;

  let penalty = 0;
  const now = Date.now();

  for (const a of alertsToScore) {
    const alertMs = new Date(a.date + "T00:00:00").getTime();
    const action = (state.reorder_actions || [])
      .filter(r => r.alert_key === a.key && r.by === userId)
      .sort((x, y) => x.at.localeCompare(y.at))[0];

    const followUps = Array.isArray(a.follow_ups) ? a.follow_ups.length : 0;
    const daysSince = Math.floor((now - alertMs) / 86400000);

    if (!action) {
      // No action at all
      if (daysSince > 6) penalty += 50;
      else if (followUps >= 2) penalty += 30;
      else if (followUps >= 1) penalty += 20;
      // else still within first 3 days — no penalty yet
    } else {
      const actionMs = new Date(action.at).getTime();
      const hoursToAction = (actionMs - alertMs) / 3600000;
      if (hoursToAction <= 24) penalty += 0;
      else if (hoursToAction <= 72) penalty += 10;
      else if (followUps >= 1 && hoursToAction <= 120) penalty += 20;
      else penalty += 30;
    }
  }

  return Math.max(0, 100 - penalty);
}

// ─── Leadership helpers ───────────────────────────────────────────────────────

function getLeadershipAssignment(month) {
  const assignments = state.leadership_assignments || [];
  const exact = assignments.find(a => a.month === month);
  if (exact) return exact;
  const sorted = assignments.filter(a => a.month < month).sort((a,b) => b.month.localeCompare(a.month));
  if (sorted.length) return { ...sorted[0], month, _carried_forward: true };
  return null;
}

function notifyLeadershipRole(roleKey, title, body) {
  notifyHaidi(title, body);
  const month = new Date().toISOString().slice(0,7);
  const assignment = getLeadershipAssignment(month);
  const roleUserId = assignment ? (assignment[roleKey] || null) : null;
  const cu = typeof currentUser === "function" ? currentUser() : null;
  if (roleUserId && cu && cu.id === roleUserId) {
    toast(`${title} — ${body}`, "warn");
  }
  state.leadership_notifications = state.leadership_notifications || [];
  state.leadership_notifications.push({
    id: uuid(), at: new Date().toISOString(),
    role_key: roleKey, role_user_id: roleUserId,
    title, body,
  });
  saveState();
}

function kpiLeadershipScore(userId, month) {
  const assignment = getLeadershipAssignment(month);
  const ROLES = ["weekly_schedule","inventory_management","cash_status","barista_hygiene"];
  const myRole = assignment ? (ROLES.find(r => assignment[r] === userId) || null) : null;
  if (!myRole) return 100;

  if (myRole === "weekly_schedule") {
    const [yr, mo] = month.split("-").map(Number);
    const monthStart = new Date(yr, mo - 1, 1);
    const monthEnd   = new Date(yr, mo, 0);
    const today      = new Date();
    const effectiveEnd = today < monthEnd ? today : monthEnd;
    const bot = state.branch_opening_times || {};
    let deductions = 0;
    for (let d = new Date(monthStart); d <= effectiveEnd; d.setDate(d.getDate() + 1)) {
      const dateStr  = localISODate(d);
      const dayIndex = (d.getDay() + 6) % 7;
      const dayKey   = ROSTER_DAYS[dayIndex];
      const weekOf   = mondayOf(dateStr);
      const morningEntries = (state.rosters || []).filter(r =>
        r.week_of === weekOf && r.day === dayKey && r.shift === "morning"
      );
      for (const entry of morningEntries) {
        const branch  = (entry.branch || "maadi").toLowerCase();
        const openStr = ((bot[branch] || {})["morning"]) || (branch === "maadi" ? "10:00" : "12:00");
        const openMs  = new Date(dateStr + "T" + openStr + ":00").getTime();
        const stamp = (state.signin_stamps || []).find(s =>
          s.by === entry.user_id &&
          localISODate(new Date(s.at)) === dateStr &&
          (s.branch || "").toLowerCase() === branch
        );
        if (!stamp) {
          const hasNoStampPenalty = (state.penalties || []).some(p =>
            p.auto_no_stamp && p.user_id === entry.user_id && p.date === dateStr
          );
          if (hasNoStampPenalty) deductions += 15;
        } else {
          const minsLate = Math.round((new Date(stamp.at).getTime() - openMs) / 60000);
          if (minsLate > 15) deductions += 10;
        }
      }
    }
    return Math.max(0, 100 - deductions);
  }

  if (myRole === "inventory_management") {
    const [yr, mo] = month.split("-").map(Number);
    const lastDay  = localISODate(new Date(yr, mo, 0));
    const today    = localISODate(new Date());
    if (today < lastDay) {
      const hasAny = (state.snapshots || []).some(s => (s.as_of || "").startsWith(month));
      return hasAny ? 80 : null;
    }
    const hasEOD = (state.snapshots || []).some(s => s.as_of === lastDay);
    return hasEOD ? 100 : 0;
  }

  if (myRole === "cash_status") {
    const [yr, mo] = month.split("-").map(Number);
    const monthStart = new Date(yr, mo - 1, 1);
    const monthEnd   = new Date(yr, mo, 0);
    const today      = new Date();
    const effectiveEnd = today < monthEnd ? today : monthEnd;
    const weeksInMonth = new Set();
    for (let d = new Date(monthStart); d <= effectiveEnd; d.setDate(d.getDate() + 1)) {
      weeksInMonth.add(mondayOf(localISODate(d)));
    }
    const totalWeeks = weeksInMonth.size;
    if (totalWeeks === 0) return null;
    const weeksWithDeposit = [...weeksInMonth].filter(weekOf =>
      (state.maadi_deposits || []).some(dep => dep.week_of === weekOf)
    ).length;
    return Math.round((weeksWithDeposit / totalWeeks) * 100);
  }

  if (myRole === "barista_hygiene") {
    const count = (state.penalties || []).filter(p =>
      p.reason_code === "no_uniform" && p.month === month
    ).length;
    if (count === 0) {
      const hasPenaltiesThisMonth = (state.penalties || []).some(p => p.month === month);
      if (!hasPenaltiesThisMonth) return null;
    }
    return Math.max(0, 100 - count * 25);
  }

  return null;
}

function runEndOfMonthLeadershipCheck(month, cu) {
  const assignment = getLeadershipAssignment(month);
  if (!assignment) { toast("No leadership assignment for " + month, "error"); return; }
  const [yr, mo] = month.split("-").map(Number);
  const lastDay   = localISODate(new Date(yr, mo, 0));
  const invMgrId  = assignment.inventory_management;
  if (!invMgrId) { toast("No inventory manager assigned for " + month, "warn"); return; }
  const hasSnapshot = (state.snapshots || []).some(s => s.as_of === lastDay);
  if (hasSnapshot) { toast("✅ Inventory snapshot found for " + lastDay + " — no penalty.", "ok"); return; }
  const already = (state.penalties || []).some(p =>
    p.auto_leadership && p.user_id === invMgrId && p.month === month
  );
  if (already) { toast("Penalty already applied for inventory failure in " + month, "warn"); return; }
  const invMgr = (state.users || []).find(u => u.id === invMgrId);
  const salary  = Number(((state.salary_config || {})[invMgrId] || {}).monthly_salary || 0);
  const amount  = penaltyAmount("half_day", salary);
  state.penalties = state.penalties || [];
  state.penalties.push({
    id: uuid(), at: new Date().toISOString(),
    by: cu.id, by_name: cu.name,
    user_id: invMgrId, barista: invMgr ? invMgr.name : invMgrId,
    kind: "half_day", kind_label: "Half day",
    reason: "leadership_fail", reason_code: "leadership_fail",
    date: lastDay, month,
    amount,
    note: "Auto: Inventory not updated for end of month " + month,
    auto_leadership: true,
    salary_at_time: salary,
  });
  saveState();
  toast(`⚠ Half-day penalty applied to ${invMgr ? invMgr.name : invMgrId} — no inventory snapshot for ${month}`, "warn");
  notifyHaidi(`Leadership penalty — ${invMgr ? invMgr.name : invMgrId}`, `No inventory snapshot for ${lastDay}. Half-day deducted.`);
}

function kpiHygieneScore(userId, month) {
  const pens = (state.penalties||[]).filter(p =>
    p.user_id === userId &&
    (p.month || (p.date||"").slice(0,7)) === month &&
    (p.reason_code === "no_uniform" || p.reason_code === "hygiene")
  );
  return Math.max(0, 100 - pens.length * 25);
}

function kpiGetUserScores(userId) {
  const cutoff = Date.now() - 30*24*60*60*1000;
  const month  = new Date().toISOString().slice(0,7);

  // ── AUTO from source tiles ──────────────────────────────────────────────
  const punctuality  = kpiPunctualityScore(userId, cutoff);
  const waste        = kpiWasteScore(userId, cutoff);           // ← waste_new entries
  const cleanliness  = kpiCleanlinessScore(userId, cutoff);    // ← cleaning_log entries
  const customer     = kpiCustomerScore(userId);
  const craftAuto    = kpiCraftScore(userId, cutoff);           // ← customer reviews where standout = coffee
  const teamworkAuto = kpiTeamworkScore(userId, cutoff);

  // ── MANUAL: entered monthly by owner / head barista in scorecard ─────────
  const manual = ((state.kpi_manual||[]).find(m => m.user_id===userId && m.month===month)) || {};

  const agg = {
    punctuality,
    waste,
    cleanliness,
    craft:     craftAuto ?? (manual.craft ?? null),  // auto first, manual fallback
    upselling: manual.upselling ?? null,
    customer:  customer ?? (manual.customer ?? null),
    // Teamwork: auto-calculated from reorder compliance; manual override by owner only
    teamwork:   teamworkAuto ?? (manual.teamwork ?? null),
    leadership: kpiLeadershipScore(userId, month) ?? null,
    hygiene:    kpiHygieneScore(userId, month),
  };

  const cats = Object.keys(KPI_W());
  if (!cats.some(k=>agg[k]!=null)) return null;
  return agg;
}

function kpiGetAllScores() {
  const result = {};
  for (const u of state.users) {
    if (!["barista","head_barista"].includes(u.role)) continue;
    const s = kpiGetUserScores(u.id);
    result[u.id] = s || { punctuality:null,waste:null,cleanliness:null,craft:null,upselling:null,customer:null,teamwork:null,leadership:null,hygiene:null };
  }
  return result;
}

// ─── BARISTA/HEAD: Upload government ID ───────────────────────────────────────
routes.my_id = function(u) {
  const wrap = el("div", {});
  wrap.appendChild(header("My Government ID", "Upload a photo of your national ID or passport. Once uploaded, only the owner can remove it."));

  const usr = state.users.find(x => x.id === u.id);
  if (!usr) {
    wrap.appendChild(el("div", { class: "card" }, "User record not found."));
    wrap.appendChild(btnBack());
    return wrap;
  }

  // Existing photos
  const existingWrap = el("div", {});
  wrap.appendChild(existingWrap);

  function renderExisting() {
    existingWrap.innerHTML = "";
    const urls = usr.id_photo_urls || [];
    if (urls.length > 0) {
      existingWrap.appendChild(el("div", { class: "banner-arch", style: { marginBottom: "8px" } },
        `✓ ${urls.length} ID photo${urls.length > 1 ? "s" : ""} on file. Only the owner can remove them.`));
      const grid = el("div", { style: { display: "flex", flexWrap: "wrap", gap: "10px", marginBottom: "16px" } });
      urls.forEach(url => {
        const card = el("div", { style: { display: "flex", flexDirection: "column", alignItems: "center", gap: "4px" } });
        card.appendChild(el("img", { src: url, style: { width: "100px", height: "70px", objectFit: "cover", borderRadius: "6px", border: "1px solid var(--border,#ddd)" } }));
        card.appendChild(el("a", { href: url, target: "_blank", class: "btn ghost", style: { fontSize: "12px", padding: "2px 10px" } }, "View"));
        grid.appendChild(card);
      });
      existingWrap.appendChild(grid);
    }
  }
  renderExisting();

  // Upload field
  const photoField = makePhotoField({ label: "ID photo(s)", multiple: true, formLabel: "Staff ID" });
  wrap.appendChild(photoField.el);

  wrap.appendChild(el("div", { class: "btn-row", style: { marginTop: "12px" } }, [
    el("button", { class: "btn", onClick: () => {
      if (photoField.count() === 0) return toast("Please select at least one photo", "error");
      const newUrls = photoField.getCloudUrls().filter(Boolean);
      if (newUrls.length < photoField.count()) return toast("Still uploading — please wait a moment", "error");
      usr.id_photo_urls = [...(usr.id_photo_urls || []), ...newUrls];
      saveState();
      toast("ID saved ✓");
      renderExisting();
    } }, "Save ID"),
  ]));

  wrap.appendChild(btnBack());
  return wrap;
};

// ─── PERSONAL HR DASHBOARD (barista/head_barista self-view) ───────────────────
routes.my_hr = function(u, params) {
  const targetId   = (params && params.user_id && u.role === "owner") ? params.user_id : u.id;
  const targetUser = state.users.find(x => x.id === targetId) || u;
  const isAR  = targetUser.role === "barista" || targetUser.role === "head_barista";
  const isHead = targetUser.role === "head_barista";
  const dir   = isAR ? "rtl" : "ltr";
  const wrap  = el("div", { style: { direction: dir } });

  state.salary_config  = state.salary_config  || {};
  state.penalties      = state.penalties      || [];
  state.overtime_logs  = state.overtime_logs  || [];
  state.salary_loans   = state.salary_loans   || [];
  state.leaves         = state.leaves         || [];

  // Header
  const hdr = el("div", { class: "card", style: { textAlign: "center", marginBottom: "12px", background: "var(--ink)", color: "var(--accent-2)" } });
  hdr.appendChild(el("div", { style: { fontSize: "12px", letterSpacing: "2px", opacity: ".7", textTransform: "uppercase", marginBottom: "4px" } }, "Coffee Beats · ملخص الراتب والإجازات"));
  hdr.appendChild(el("div", { style: { fontSize: "20px", fontWeight: "800" } }, targetUser.name));
  hdr.appendChild(el("div", { style: { fontSize: "13px", opacity: ".8", marginTop: "4px" } }, isHead ? "⭐ رئيس بريستا" : "بريستا"));
  wrap.appendChild(hdr);

  // Month selector
  const nowMonth = new Date().toISOString().slice(0, 7);
  let selMonth = nowMonth;
  const monthNav = el("div", { class: "card", style: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "12px" } });
  const prevBtn = el("button", { class: "btn ghost", style: { fontSize: "18px", padding: "4px 12px" } }, "‹");
  const nextBtn = el("button", { class: "btn ghost", style: { fontSize: "18px", padding: "4px 12px" } }, "›");
  const monthLbl = el("div", { style: { fontWeight: "700", fontSize: "15px" } }, selMonth);
  monthNav.appendChild(prevBtn);
  monthNav.appendChild(monthLbl);
  monthNav.appendChild(nextBtn);
  wrap.appendChild(monthNav);

  const body = el("div", {});
  wrap.appendChild(body);
  wrap.appendChild(btnBack());

  function shiftMonth(delta) {
    const [y, m] = selMonth.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    selMonth = d.toISOString().slice(0, 7);
    monthLbl.textContent = selMonth;
    drawBody();
  }
  prevBtn.addEventListener("click", () => shiftMonth(-1));
  nextBtn.addEventListener("click", () => shiftMonth(1));

  function drawBody() {
    body.innerHTML = "";
    const uid     = targetUser.id;
    const salary  = Number((state.salary_config[uid] || {}).monthly_salary || 0);
    const monthFn = x => (x.month || (x.date || "").slice(0, 7)) === selMonth;
    const penList  = state.penalties.filter(x => x.user_id === uid && monthFn(x));
    const otList   = state.overtime_logs.filter(x => x.user_id === uid && monthFn(x));
    const loanList = state.salary_loans.filter(x => x.user_id === uid && monthFn(x));
    const penSum   = penList.reduce((s, r) => s + (Number(r.amount) || 0), 0);
    const otSum    = otList.reduce((s, r) => s + (Number(r.amount) || 0), 0);
    const otHrs    = otList.reduce((s, r) => s + (Number(r.hours) || 0), 0);
    const loanSum  = loanList.reduce((s, r) => s + (Number(r.amount) || 0), 0);
    const netDue   = Math.max(0, salary + otSum - penSum - loanSum);
    const netColor = netDue >= salary ? "var(--ok)" : netDue >= salary * 0.85 ? "var(--warn)" : "var(--bad)";

    // Section A — Pay Summary
    const payCard = el("div", { class: "card", style: { marginBottom: "12px" } });

      70: isAR ? "رسالة تقدير + أولوية في الجداول" : "Recognition letter · Schedule preference",

        el("td", {}, r.reason || r.note || "—"),
        el("td", {}, r.type || "—"),
        el("td", { class: "num", style: { color: "var(--bad)" } }, "−" + money(r.amount)),
      ])));
      t.appendChild(tb);
      penCard.appendChild(t);

    // Section D — Overtime
    const otCard = el("div", { class: "card", style: { marginBottom: "12px" } });

    if (otList.length === 0) {
      otCard.appendChild(el("div", { class: "muted", style: { fontSize: "13px" } }, isAR ? "لا يوجد أوفرتايم هذا الشهر" : "No overtime this month"));
    } else {
      const t = el("table", {});
      t.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", {}, isAR ? "التاريخ" : "Date"),
        el("th", {}, isAR ? "الساعات" : "Hours"),
        el("th", { style: { textAlign: "right" } }, isAR ? "المبلغ" : "Amount"),
        el("th", {}, isAR ? "الحالة" : "Status"),
      ])]));
      const tb = el("tbody", {});
      otList.forEach(r => tb.appendChild(el("tr", {}, [
        el("td", {}, r.date || ""),
        el("td", { class: "num" }, String(r.hours || 0) + "h"),
        el("td", { class: "num", style: { color: "var(--ok)" } }, "+" + money(r.amount || 0)),
        el("td", {}, r.approved ? "✅" : "⏳"),
      ])));
      t.appendChild(tb);
      otCard.appendChild(t);
    }
    body.appendChild(otCard);

    // Section E — Loans
    const loanCard = el("div", { class: "card", style: { marginBottom: "12px" } });
    loanCard.appendChild(el("div", { style: { fontWeight: "700", fontSize: "14px", marginBottom: "8px" } }, isAR ? "💸 السلف والخصومات" : "💸 Loans / Deductions"));
    if (loanList.length === 0) {
      loanCard.appendChild(el("div", { class: "muted", style: { fontSize: "13px" } }, isAR ? "لا توجد سلف هذا الشهر" : "No loans this month"));
    } else {
      const t = el("table", {});
      t.appendChild(el("thead", {}, [el("tr", {}, [
        el("th", {}, isAR ? "التاريخ" : "Date"),
        el("th", {}, isAR ? "ملاحظة" : "Note"),
        el("th", { style: { textAlign: "right" } }, isAR ? "المبلغ" : "Amount"),
      ])]));
      const tb = el("tbody", {});
      loanList.forEach(r => tb.appendChild(el("tr", {}, [
        el("td", {}, r.date || ""),
        el("td", {}, r.note || "—"),
        el("td", { class: "num", style: { color: "var(--warn)" } }, "−" + money(r.amount || 0)),
      ])));
      t.appendChild(tb);
      loanCard.appendChild(t);
    }
    body.appendChild(loanCard);

    // Section F — Leaves
    const thisYear = selMonth.slice(0, 4);
    const allLeaves = state.leaves.filter(x => x.user_id === uid);
    const annualUsed = allLeaves
      .filter(x => x.status === "approved" && x.type === "annual" && (x.from_date || "").startsWith(thisYear))
      .reduce((s, x) => s + Math.round((new Date(x.to_date) - new Date(x.from_date)) / 86400000) + 1, 0);
    const sickUsed = allLeaves
      .filter(x => x.status === "approved" && x.type === "sick" && (x.from_date || "").startsWith(thisYear))
      .reduce((s, x) => s + Math.round((new Date(x.to_date) - new Date(x.from_date)) / 86400000) + 1, 0);
    const pending  = allLeaves.filter(x => x.status === "pending").sort((a, b) => b.requested_at.localeCompare(a.requested_at));
    const recent   = allLeaves.filter(x => x.status !== "pending").sort((a, b) => b.requested_at.localeCompare(a.requested_at)).slice(0, 5);

      [isAR ? `إجازة سنوية مستخدمة (${thisYear})` : `Annual used (${thisYear})`, annualUsed + (isAR ? " يوم" : " days")],
      [isAR ? `إجازة مرضية (${thisYear})` : `Sick used (${thisYear})`, sickUsed + (isAR ? " يوم" : " days")],
    ].forEach(([k, v]) => {
      const c = el("div", { class: "card", style: { padding: "10px", textAlign: "center" } });

      c.appendChild(el("div", { style: { fontWeight: "800", fontSize: "16px" } }, String(v)));
      lvStats.appendChild(c);

    lvCard.appendChild(lvStats);
    if (pending.length) {
      lvCard.appendChild(el("div", { style: { fontWeight: "600", fontSize: "13px", marginBottom: "6px" } }, isAR ? "⏳ طلبات معلقة" : "⏳ Pending requests"));
      pending.forEach(x => {
        const typeLabel = x.type === "annual" ? (isAR ? "سنوية" : "Annual") : (isAR ? "مرضية" : "Sick");
        lvCard.appendChild(el("div", { class: "muted small", style: { marginBottom: "4px" } }, `${typeLabel} · ${x.from_date} → ${x.to_date}`));
      });
    }
    if (recent.length) {
      lvCard.appendChild(el("div", { style: { fontWeight: "600", fontSize: "13px", margin: "8px 0 4px" } }, isAR ? "السجل الأخير" : "Recent"));
      recent.forEach(x => {
        const statusIcon = x.status === "approved" ? "✅" : "❌";
        const typeLabel  = x.type === "annual" ? (isAR ? "سنوية" : "Annual") : (isAR ? "مرضية" : "Sick");
        lvCard.appendChild(el("div", { class: "muted small", style: { marginBottom: "4px" } }, `${statusIcon} ${typeLabel} · ${x.from_date} → ${x.to_date}`));
      });
    }
    lvCard.appendChild(el("button", { class: "btn secondary", style: { marginTop: "8px", fontSize: "12px", padding: "7px 12px" }, onClick: () => go("leave_new") }, isAR ? "🌴 طلب إجازة" : "🌴 Request leave"));
    body.appendChild(lvCard);
  }

  drawBody();
  return wrap;
};

// ─── STAFF HR OVERVIEW (owner / head_barista / accountant) ────────────────────
routes.staff_hr = function(u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Staff HR Overview", "Monthly payroll, penalties, loans, KPI and leave summary for all active staff."));

  if (!["owner", "accountant", "head_barista"].includes(u.role)) {
    wrap.appendChild(el("div", { class: "card" }, "Access restricted."));
    wrap.appendChild(btnBack());
    return wrap;
  }

  state.salary_config  = state.salary_config  || {};
  state.penalties      = state.penalties      || [];
  state.overtime_logs  = state.overtime_logs  || [];
  state.salary_loans   = state.salary_loans   || [];
  state.leaves         = state.leaves         || [];

  const nowMonth = new Date().toISOString().slice(0, 7);
  let selMonth = nowMonth;

  const monthNav = el("div", { class: "card", style: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "12px" } });
  const prevBtn  = el("button", { class: "btn ghost", style: { fontSize: "18px", padding: "4px 12px" } }, "‹");
  const nextBtn  = el("button", { class: "btn ghost", style: { fontSize: "18px", padding: "4px 12px" } }, "›");
  const monthLbl = el("div", { style: { fontWeight: "700", fontSize: "15px" } }, selMonth);
  monthNav.appendChild(prevBtn);
  monthNav.appendChild(monthLbl);
  monthNav.appendChild(nextBtn);
  wrap.appendChild(monthNav);

  const body = el("div", {});
  wrap.appendChild(body);
  wrap.appendChild(btnBack());

  function shiftMonth(delta) {
    const [y, m] = selMonth.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    selMonth = d.toISOString().slice(0, 7);
    monthLbl.textContent = selMonth;
    drawBody();
  }
  prevBtn.addEventListener("click", () => shiftMonth(-1));
  nextBtn.addEventListener("click", () => shiftMonth(1));

  function drawBody() {
    body.innerHTML = "";
    const monthFn = x => (x.month || (x.date || "").slice(0, 7)) === selMonth;
    const staff = state.users.filter(x => x.active && (x.role === "barista" || x.role === "head_barista"));

    // Summary stat cards
    let totalPayroll = 0, totalPen = 0, totalOT = 0;
    const staffData = staff.map(p => {
      const salary  = Number((state.salary_config[p.id] || {}).monthly_salary || 0);
      const penSum  = state.penalties.filter(x => x.user_id === p.id && monthFn(x)).reduce((s, r) => s + (Number(r.amount) || 0), 0);
      const otSum   = state.overtime_logs.filter(x => x.user_id === p.id && monthFn(x)).reduce((s, r) => s + (Number(r.amount) || 0), 0);
      const loanSum = state.salary_loans.filter(x => x.user_id === p.id && monthFn(x)).reduce((s, r) => s + (Number(r.amount) || 0), 0);
      const netDue  = Math.max(0, salary + otSum - penSum - loanSum);
      const scores  = kpiGetUserScores(p.id);
      const kpiTotal = scores ? kpiCalcTotal(scores) : 0;
      const thisYear = selMonth.slice(0, 4);
      const lvDays  = (state.leaves || [])
        .filter(x => x.user_id === p.id && x.status === "approved" && x.type === "annual" && (x.from_date || "").startsWith(thisYear))
        .reduce((s, x) => s + Math.round((new Date(x.to_date) - new Date(x.from_date)) / 86400000) + 1, 0);
      totalPayroll += netDue;
      totalPen     += penSum;
      totalOT      += otSum;
      return { p, salary, penSum, otSum, loanSum, netDue, kpiTotal, lvDays };
    });

    const statsRow = el("div", { class: "grid c2", style: { gap: "8px", marginBottom: "12px" } });
    [
      ["👥 Active Staff", String(staff.length)],
      ["💰 Total Payroll", money(totalPayroll)],
      ["⚖ Total Penalties", money(totalPen)],
      ["⏱ Total Overtime", money(totalOT)],
    ].forEach(([k, v]) => {
      const c = el("div", { class: "card", style: { padding: "12px", textAlign: "center" } });
      c.appendChild(el("div", { class: "muted", style: { fontSize: "11px", marginBottom: "4px" } }, k));
      c.appendChild(el("div", { style: { fontWeight: "800", fontSize: "16px" } }, v));
      statsRow.appendChild(c);
    });
    body.appendChild(statsRow);

    // Staff table
    const tableCard = el("div", { class: "card" });
    const t = el("table", {});
    t.appendChild(el("thead", {}, [el("tr", {}, [
      el("th", {}, "Name"),
      el("th", {}, "Role"),
      el("th", { style: { textAlign: "right" } }, "Base"),
      el("th", { style: { textAlign: "right" } }, "OT"),
      el("th", { style: { textAlign: "right" } }, "Penalties"),
      el("th", { style: { textAlign: "right" } }, "Loans"),
      el("th", { style: { textAlign: "right" } }, "Net Due"),
      el("th", { style: { textAlign: "center" } }, "KPI"),
      el("th", { style: { textAlign: "center" } }, "Leave Days"),
    ])]));
    const tb = el("tbody", {});
    let grandBase = 0, grandOT = 0, grandPen = 0, grandLoan = 0, grandNet = 0;
    staffData.forEach(({ p, salary, penSum, otSum, loanSum, netDue, kpiTotal, lvDays }) => {
      grandBase += salary; grandOT += otSum; grandPen += penSum; grandLoan += loanSum; grandNet += netDue;
      const netColor = netDue >= salary ? "var(--ok)" : netDue >= salary * 0.85 ? "var(--warn)" : "var(--bad)";
      const tr = el("tr", { style: { cursor: "pointer" }, onClick: () => go("my_hr", { user_id: p.id }) }, [
        el("td", { style: { fontWeight: "600" } }, p.name),
        el("td", { class: "muted small" }, p.role === "head_barista" ? "Head" : "Barista"),
        el("td", { class: "num" }, money(salary)),
        el("td", { class: "num", style: { color: "var(--ok)" } }, otSum ? "+" + money(otSum) : "—"),
        el("td", { class: "num", style: { color: penSum ? "var(--bad)" : "" } }, penSum ? "−" + money(penSum) : "—"),
        el("td", { class: "num", style: { color: loanSum ? "var(--warn)" : "" } }, loanSum ? "−" + money(loanSum) : "—"),
        el("td", { class: "num", style: { fontWeight: "700", color: netColor } }, money(netDue)),
        el("td", { style: { textAlign: "center", fontSize: "12px", fontWeight: "700", color: kpiScoreColor(kpiTotal) } }, kpiTotal ? kpiGradeEn(kpiTotal).split(" ")[0] + " " + kpiTotal.toFixed(0) : "—"),
        el("td", { style: { textAlign: "center" } }, lvDays ? String(lvDays) + "d" : "—"),
      ]);
      tb.appendChild(tr);
    });
    // Grand total row
    const totalTr = el("tr", { style: { borderTop: "2px solid var(--border)", fontWeight: "800" } }, [
      el("td", { colspan: "2", style: { fontWeight: "800" } }, "Total"),
      el("td", { class: "num" }, money(grandBase)),
      el("td", { class: "num" }, money(grandOT)),
      el("td", { class: "num" }, money(grandPen)),
      el("td", { class: "num" }, money(grandLoan)),
      el("td", { class: "num", style: { color: "var(--ok)" } }, money(grandNet)),
      el("td", {}), el("td", {}),
    ]);
    tb.appendChild(totalTr);
    t.appendChild(tb);
    tableCard.appendChild(t);
    body.appendChild(tableCard);
  }

  drawBody();
  return wrap;
};

  nCard.appendChild(el("textarea",{id:"kl_notes",rows:"2",placeholder:isAR?"مثال: ضغط كبير في الصباح، لكن الفريق تعاون بشكل رائع":"e.g. Very busy morning but team worked great"}));
  nCard.appendChild(el("label",{},isAR?"شكر خاص لزميل (اختياري)":"Team shoutout (optional)"));
  nCard.appendChild(el("input",{type:"text",id:"kl_shout",placeholder:isAR?"مثال: رانا غطّت عني وقت الضغط — شكراً جزيلاً":"e.g. Rana covered for me during rush — huge help!"}));
  form.appendChild(nCard);

  wrap.appendChild(form);

  const submitBtn = el("button",{class:"btn",style:{marginTop:"12px"},onClick:submitKpiLog},isAR?"✅ إرسال تقرير الشيفت":"✅ Submit Shift Log");
  wrap.appendChild(submitBtn);
  wrap.appendChild(btnBack());

  // Live calc helpers attached to window for inline oninput handlers
  window.kpiLivePunct = function() {
    const sched = document.getElementById("kl_sched");
    const actual = document.getElementById("kl_actual");
    const res = document.getElementById("kpi_punct_res");
    if (!sched||!actual||!res||!actual.value) return;
    const [sh,sm]=sched.value.split(":").map(Number);
    const [ah,am]=actual.value.split(":").map(Number);
    const diff=(ah*60+am)-(sh*60+sm);
    let score,msg;
    if(diff<=0){score=100;msg=isAR?"🎉 في الموعد! علامة كاملة":"🎉 On time! Full marks";}
    else if(diff<=5){score=90;msg=isAR?"✅ تأخير ٥ دقائق — ٩٠ نقطة":"✅ Within grace — 90 pts";}
    else if(diff<=15){score=70;msg=isAR?"⚠️ تأخير ٦-١٥ دقيقة — ٧٠ نقطة":"⚠️ 6-15 min late — 70 pts";}
    else if(diff<=30){score=50;msg=isAR?"⚠️ تأخير ١٦-٣٠ دقيقة — ٥٠ نقطة":"⚠️ 16-30 min late — 50 pts";}
    else{score=20;msg=isAR?"❌ أكثر من ٣٠ دقيقة — ٢٠ نقطة":"❌ Over 30 min late — 20 pts";}
    res.textContent=msg;
    res.style.color=score>=90?"var(--ok)":score>=70?"var(--warn)":"var(--bad)";
  };
  window.kpiLiveWaste = function() {
    const shots=parseInt(document.getElementById("kl_shots")?.value)||0;
    const milk=parseInt(document.getElementById("kl_milk")?.value)||0;
    let score=100;
    if(shots>3)score-=(shots-3)*10;
    if(milk>100)score-=Math.floor((milk-100)/50)*10;
    score=Math.max(score,10);
    const el2=document.getElementById("kpi_waste_res");
    if(el2){el2.textContent=(isAR?"نقاط الهدر: ":"Waste score: ")+score+"/100";el2.style.color=kpiScoreColor(score);}
  };
  window.kpiLiveClean = function() {
    const boxes=document.querySelectorAll("[id^='kl_clean_']");
    const checked=Array.from(boxes).filter(b=>b.checked).length;
    const score=Math.round((checked/boxes.length)*100);
    const el2=document.getElementById("kpi_clean_score");
    if(el2){el2.textContent=score+"/100";el2.style.color=kpiScoreColor(score);}
  };

  function submitKpiLog() {
    const sched = document.getElementById("kl_sched")?.value||"09:00";
    const actual= document.getElementById("kl_actual")?.value||"";
    let pScore=70;
    if(actual){
      const [sh,sm]=sched.split(":").map(Number);
      const [ah,am]=actual.split(":").map(Number);
      const diff=(ah*60+am)-(sh*60+sm);
      pScore=diff<=0?100:diff<=5?90:diff<=15?70:diff<=30?50:20;
    }
    const shots=parseInt(document.getElementById("kl_shots")?.value)||0;
    const milk=parseInt(document.getElementById("kl_milk")?.value)||0;
    let wScore=100;
    if(shots>3)wScore-=(shots-3)*10;
    if(milk>100)wScore-=Math.floor((milk-100)/50)*10;
    wScore=Math.max(wScore,10);
    const boxes=document.querySelectorAll("[id^='kl_clean_']");
    const cleanScore=boxes.length?Math.round(Array.from(boxes).filter(b=>b.checked).length/boxes.length*100):0;
    const entry = {
      id:uuid(), user_id:u.id, at:now(),
      date:document.getElementById("kl_date_inp")?.value||fmtDay(now()),
      shift:document.getElementById("kl_shift")?.value||"morning",
      punctuality:pScore, waste:wScore, cleanliness:cleanScore,
      waste_notes:document.getElementById("kl_wnotes")?.value||"",
      notes:document.getElementById("kl_notes")?.value||"",
      shoutout:document.getElementById("kl_shout")?.value||"",
    };
    if(!state.kpi_logs) state.kpi_logs=[];
    state.kpi_logs.unshift(entry);
    save();
    toast(isAR?"✅ تم إرسال التقرير! شكراً على التزامك ⭐":"✅ Log submitted! Scores updated.");
    go("my_scorecard");
  }
  return wrap;
};

routes.my_id = function(u) {
  const wrap = el("div", {});
  wrap.appendChild(header("My ID", "Upload your ID documents"));
  wrap.appendChild(el("div", { class: "banner-arch" },
    "Your uploads are private — visible only to the owner and accountant."));

  const myUploads = (state.staff_ids[u.id] || []).slice();

  const gallery = el("div", { style: { marginBottom: "16px" } });

  function renderGallery() {
    gallery.innerHTML = "";
    if (!myUploads.length) {
      gallery.appendChild(el("div", { class: "muted small", style: { padding: "8px 0" } }, "No ID documents uploaded yet."));
      return;
    }
    const grid = el("div", { style: { display: "flex", flexWrap: "wrap", gap: "10px", marginTop: "8px" } });
    for (const entry of myUploads) {
      const thumb = el("div", { style: { position: "relative", display: "inline-block" } });
      const img = el("img", {
        src: entry.url, alt: "ID",
        style: { width: "100px", height: "100px", objectFit: "cover", borderRadius: "8px",
                 border: "1px solid var(--border)", cursor: "pointer", display: "block" },
      });
      img.addEventListener("click", () => window.open(entry.url, "_blank"));
      const del = el("button", {
        style: { position: "absolute", top: "2px", right: "2px", background: "rgba(0,0,0,0.6)",
                 color: "#fff", border: "none", borderRadius: "50%", width: "22px", height: "22px",
                 fontSize: "12px", cursor: "pointer", lineHeight: "1", textAlign: "center", padding: "0" },
      }, "✕");
      del.addEventListener("click", () => {
        if (!confirm("Remove this image?")) return;
        const idx = myUploads.findIndex(x => x.id === entry.id);
        if (idx !== -1) myUploads.splice(idx, 1);
        state.staff_ids[u.id] = myUploads.slice();
        saveState();
        renderGallery();
      });
      thumb.appendChild(img);
      thumb.appendChild(del);
      grid.appendChild(thumb);
    }
    gallery.appendChild(grid);
  }

  renderGallery();
  wrap.appendChild(gallery);

  // ── Upload section ──
  const uploadCard = el("div", { class: "card" });
  uploadCard.appendChild(el("div", { style: { fontWeight: "700", marginBottom: "10px" } }, "📎 Add ID images"));

  const fileInput = el("input", { type: "file", accept: "image/*" });
  fileInput.setAttribute("multiple", "true");
  fileInput.style.display = "none";

  const previewGrid = el("div", { style: { display: "flex", flexWrap: "wrap", gap: "8px", marginBottom: "10px" } });

  const pickBtn = el("button", { class: "btn secondary" }, "📷 Choose photos");
  pickBtn.addEventListener("click", () => fileInput.click());

  let selectedBlobs = [];

  fileInput.addEventListener("change", () => {
    selectedBlobs = [...fileInput.files].filter(f => f.type.startsWith("image/"));
    previewGrid.innerHTML = "";
    for (const f of selectedBlobs) {
      const img = el("img", {
        src: URL.createObjectURL(f),
        style: { width: "80px", height: "80px", objectFit: "cover", borderRadius: "8px",
                 border: "1px solid var(--border)" },
      });
      previewGrid.appendChild(img);
    }
    fileInput.value = "";
  });

  const saveBtn = el("button", { class: "btn", style: { marginTop: "4px" } }, "⬆ Upload & Save");
  saveBtn.addEventListener("click", async () => {
    if (!selectedBlobs.length) return toast("Choose at least one photo first", "warn");
    saveBtn.disabled = true;
    saveBtn.textContent = "Uploading…";
    if (!state.staff_ids[u.id]) state.staff_ids[u.id] = [];
    let ok = 0;
    for (const blob of selectedBlobs) {
      try {
        const filename = `ID_${u.name.replace(/\s+/g, "_")}`;
        const data = await Cloudinary.uploadPhoto(blob, filename);
        const entry = { id: uuid(), url: data.secure_url, at: new Date().toISOString(), name: u.name };
        state.staff_ids[u.id].push(entry);
        myUploads.push(entry);
        ok++;
      } catch (e) {
        console.warn("ID upload error:", e);
      }
    }
    saveBtn.disabled = false;
    saveBtn.textContent = "⬆ Upload & Save";
    if (ok > 0) {
      saveState();
      selectedBlobs = [];
      previewGrid.innerHTML = "";
      renderGallery();
      toast(`${ok} image${ok > 1 ? "s" : ""} saved`);
    } else {
      toast("Upload failed — check your connection", "error");
    }
  });

  uploadCard.appendChild(pickBtn);
  uploadCard.appendChild(previewGrid);
  uploadCard.appendChild(fileInput);
  uploadCard.appendChild(saveBtn);
  wrap.appendChild(uploadCard);
  wrap.appendChild(btnBack());
  return wrap;
};
