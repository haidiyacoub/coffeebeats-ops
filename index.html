routes.suggestions = function(u) {
  const wrap = el("div", {});
  state.suggestions = state.suggestions || [];
  const isOwner = u.role === "owner" || u.role === "accountant";

  wrap.appendChild(header("Suggestions & Complaints",
    isOwner ? "Full inbox · decide what to share with the team" : "Share ideas or raise issues — sent directly to the owner"));

  if (isOwner) {
    // ── Owner view: tabbed (Suggestions / Complaints) ──
    const card = el("div", { class: "card" });
    card.appendChild(el("div", { class: "muted small", style: { marginBottom: "12px" } },
      "Toggle \"Show to team\" to include an entry on the public board visible to everyone."));

    let activeTab = "suggestion";
    const tabBar = el("div", { style: { display: "flex", gap: "0", marginBottom: "16px", borderRadius: "10px", overflow: "hidden", border: "1.5px solid var(--border)" } });
    const tabs = ["suggestion", "complaint"];
    const tabLabels = { suggestion: "💡 Suggestions", complaint: "⚠️ Complaints" };
    const tabEls = {};
    tabs.forEach(type => {
      const count = (state.suggestions || []).filter(e => e.type === type).length;
      const btn = el("button", {
        style: { flex: "1", padding: "10px 8px", border: "none", cursor: "pointer", fontWeight: "700", fontSize: "13px",
                 background: type === activeTab ? "var(--ink)" : "var(--surface-2)",
                 color: type === activeTab ? "#fff" : "var(--ink-dim)", transition: "background .15s" },
      }, `${tabLabels[type]}${count ? ` (${count})` : ""}`);
      btn.addEventListener("click", () => {
        activeTab = type;
        tabs.forEach(t => {
          tabEls[t].style.background = t === activeTab ? "var(--ink)" : "var(--surface-2)";
          tabEls[t].style.color = t === activeTab ? "#fff" : "var(--ink-dim)";
        });
        renderOwnerList();
      });
      tabEls[type] = btn;
      tabBar.appendChild(btn);
    });
    card.appendChild(tabBar);

    const body = el("div", {});
    card.appendChild(body);

    function renderOwnerList() {
      body.innerHTML = "";
      const filtered = (state.suggestions || []).filter(e => e.type === activeTab).sort((a, b) => b.date.localeCompare(a.date));
      if (!filtered.length) {
        body.appendChild(el("div", { class: "muted small", style: { padding: "8px 0" } }, `No ${activeTab}s yet.`));
        return;
      }
      for (const e of filtered) {
        const row = el("div", { style: { background: "var(--surface-2)", borderRadius: "10px", padding: "12px", marginBottom: "8px" } });
        const meta = el("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "6px" } });
        const right = el("div", { style: { display: "flex", gap: "8px", alignItems: "center" } });
        right.appendChild(el("span", { class: "muted small" }, e.date));
        const ownerNameLabel = e.anonymous ? `— Anonymous (${e.author_name})` : `— ${e.author_name}`;
        right.appendChild(el("span", { style: { fontSize: "12px", fontWeight: "600", color: "var(--ink-dim)" } }, ownerNameLabel));
        meta.appendChild(el("span", { style: { fontWeight: "700", fontSize: "13px", opacity: ".5" } }, e.public ? "✓ public" : "private"));
        meta.appendChild(right);
        row.appendChild(meta);
        row.appendChild(el("div", { style: { fontSize: "14px", lineHeight: "1.5", marginBottom: "10px" } }, e.text));
        const btnRow = el("div", { style: { display: "flex", gap: "8px" } });
        const pubBtn = el("button", { class: e.public ? "btn" : "btn secondary", style: { fontSize: "12px", padding: "5px 12px", width: "auto" } },
          e.public ? "✓ Shown to team" : "Show to team");
        pubBtn.addEventListener("click", () => {
          e.public = !e.public;
          saveState();
          renderOwnerList();
        });
        const delBtn = el("button", { class: "btn ghost", style: { fontSize: "12px", padding: "5px 12px", width: "auto", color: "var(--bad)" } }, "Delete");
        delBtn.addEventListener("click", () => {
          if (!confirm("Delete this entry permanently?")) return;
          const idx = state.suggestions.indexOf(e);
          if (idx !== -1) state.suggestions.splice(idx, 1);
          saveState();
          renderOwnerList();
        });
        btnRow.appendChild(pubBtn);
        btnRow.appendChild(delBtn);
        row.appendChild(btnRow);
        body.appendChild(row);
      }
    }
    renderOwnerList();
    wrap.appendChild(card);

  } else {
    // ── Barista / team view: submit form + public board ──
    const formCard = el("div", { class: "card" });
    formCard.appendChild(el("div", { style: { fontWeight: "700", fontSize: "15px", marginBottom: "12px" } }, "Submit a new entry"));

    const typeRow = el("div", { style: { display: "flex", gap: "20px", marginBottom: "12px" } });
    let selectedType = "suggestion";
    const radSugg = el("input", { type: "radio", name: "sg_type", value: "suggestion" });
    radSugg.checked = true;
    const radComp = el("input", { type: "radio", name: "sg_type", value: "complaint" });
    radSugg.addEventListener("change", () => { selectedType = "suggestion"; });
    radComp.addEventListener("change", () => { selectedType = "complaint"; });
    const lblSugg = el("label", { style: { display: "flex", alignItems: "center", gap: "6px", margin: "0", cursor: "pointer" } });
    lblSugg.appendChild(radSugg);
    lblSugg.appendChild(document.createTextNode("💡 Suggestion"));
    const lblComp = el("label", { style: { display: "flex", alignItems: "center", gap: "6px", margin: "0", cursor: "pointer" } });
    lblComp.appendChild(radComp);
    lblComp.appendChild(document.createTextNode("⚠️ Complaint"));
    typeRow.appendChild(lblSugg);
    typeRow.appendChild(lblComp);
    formCard.appendChild(typeRow);

    const textArea = el("textarea", { placeholder: "Describe your idea or issue…", rows: "5", style: { marginBottom: "12px" } });
    formCard.appendChild(textArea);

    const anonRow = el("div", { style: { display: "flex", alignItems: "center", gap: "8px", marginBottom: "14px" } });
    const anonCheck = el("input", { type: "checkbox", id: "sg_anon" });
    const anonLabel = el("label", { for: "sg_anon", style: { margin: "0", cursor: "pointer", fontSize: "14px", color: "var(--ink-dim)" } });
    anonLabel.appendChild(document.createTextNode("Submit anonymously"));
    anonRow.appendChild(anonCheck);
    anonRow.appendChild(anonLabel);
    formCard.appendChild(anonRow);

    const submitBtn = el("button", { class: "btn" }, "Submit");
    submitBtn.addEventListener("click", () => {
      const text = textArea.value.trim();
      if (!text) { toast("Please write something first.", "error"); return; }
      const isAnon = anonCheck.checked;
      const entry = {
        id: uuid(),
        author_uid: u.uid || u.id,
        author_name: u.name,
        anonymous: isAnon,
        type: selectedType,
        text,
        date: new Date().toISOString().slice(0, 10),
        public: false,
      };
      state.suggestions.push(entry);
      saveState();
      textArea.value = "";
      anonCheck.checked = false;
      radSugg.checked = true;
      selectedType = "suggestion";
      toast("Submitted — thank you! The owner has been notified.");
      renderPublicBoard();
      // Email owner
      const ownerEmail = (state.settings.owner_email || "coffeebeats@haidiyacoub.com").trim();
      const typeLabel  = entry.type === "complaint" ? "Complaint" : "Suggestion";
      const displayName = isAnon ? `Anonymous (${u.name})` : u.name;
      const subj = encodeURIComponent(`New ${typeLabel} from ${isAnon ? "Anonymous" : u.name}`);
      const body = encodeURIComponent(`${typeLabel} submitted by ${displayName}\nDate: ${entry.date}\n\n${text}\n\n— Coffee Beats Operations App`);
      try { window.open(`mailto:${encodeURIComponent(ownerEmail)}?subject=${subj}&body=${body}`, "_blank"); } catch(e) {}
    });
    formCard.appendChild(submitBtn);
    wrap.appendChild(formCard);

    // Public board
    const boardCard = el("div", { class: "card", style: { marginTop: "14px" } });
    boardCard.appendChild(el("h2", {}, "From the Team"));
    boardCard.appendChild(el("div", { class: "muted small", style: { marginBottom: "10px" } },
      "Entries the owner has chosen to share with the whole team:"));
    const boardBody = el("div", {});
    boardCard.appendChild(boardBody);

    function renderPublicBoard() {
      boardBody.innerHTML = "";
      const pub = (state.suggestions || []).filter(e => e.public).sort((a, b) => b.date.localeCompare(a.date));
      if (!pub.length) {
        boardBody.appendChild(el("div", { class: "muted small" }, "Nothing shared yet — check back after the next team meeting."));
        return;
      }
      for (const e of pub) {
        const badge = e.type === "suggestion" ? "💡 Suggestion" : "⚠️ Complaint";
        const row = el("div", { style: { borderBottom: "1px solid var(--border)", padding: "10px 0" } });
        const topLine = el("div", { style: { display: "flex", justifyContent: "space-between", marginBottom: "6px" } });
        topLine.appendChild(el("span", { style: { fontWeight: "600", fontSize: "12px" } }, badge));
        topLine.appendChild(el("span", { class: "muted small" }, e.date));
        row.appendChild(topLine);
        row.appendChild(el("div", { style: { fontSize: "14px", lineHeight: "1.5" } }, e.text));
        boardBody.appendChild(row);
      }
    }
    renderPublicBoard();
    wrap.appendChild(boardCard);
  }

  wrap.appendChild(btnBack());
  return wrap;
};

// ==============================================================
// MY ID

routes.my_id = function(u) {
  const wrap = el("div", {});
  wrap.appendChild(header("My ID", "Upload your ID documents"));
  wrap.appendChild(el("div", { class: "banner-arch" },
    "Your uploads are private — visible only to the owner and accountant."));

  const myUploads = (state.staff_ids[u.id] || []).slice();

  const gallery = el("div", { style: { marginBottom: "16px" } });

  function renderGallery() {
    gallery.innerHTML = "";
    if (!myUploads.length) {
      gallery.appendChild(el("div", { class: "muted small", style: { padding: "8px 0" } }, "No ID documents uploaded yet."));
      return;
    }
    const grid = el("div", { style: { display: "flex", flexWrap: "wrap", gap: "10px", marginTop: "8px" } });
    for (const entry of myUploads) {
      const thumb = el("div", { style: { position: "relative", display: "inline-block" } });
      const img = el("img", {
        src: entry.url, alt: "ID",
        style: { width: "100px", height: "100px", objectFit: "cover", borderRadius: "8px",
                 border: "1px solid var(--border)", cursor: "pointer", display: "block" },
      });
      img.addEventListener("click", () => window.open(entry.url, "_blank"));
      const del = el("button", {
        style: { position: "absolute", top: "2px", right: "2px", background: "rgba(0,0,0,0.6)",
                 color: "#fff", border: "none", borderRadius: "50%", width: "22px", height: "22px",
                 fontSize: "12px", cursor: "pointer", lineHeight: "1", textAlign: "center", padding: "0" },
      }, "✕");
      del.addEventListener("click", () => {
        if (!confirm("Remove this image?")) return;
        const idx = myUploads.findIndex(x => x.id === entry.id);
        if (idx !== -1) myUploads.splice(idx, 1);
        state.staff_ids[u.id] = myUploads.slice();
        saveState();
        renderGallery();
      });
      thumb.appendChild(img);
      thumb.appendChild(del);
      grid.appendChild(thumb);
    }
    gallery.appendChild(grid);
  }

  renderGallery();
  wrap.appendChild(gallery);

  // ── Upload section ──
  const uploadCard = el("div", { class: "card" });
  uploadCard.appendChild(el("div", { style: { fontWeight: "700", marginBottom: "10px" } }, "📎 Add ID images"));

  const fileInput = el("input", { type: "file", accept: "image/*" });
  fileInput.setAttribute("multiple", "true");
  fileInput.style.display = "none";

  const previewGrid = el("div", { style: { display: "flex", flexWrap: "wrap", gap: "8px", marginBottom: "10px" } });

  const pickBtn = el("button", { class: "btn secondary" }, "📷 Choose photos");
  pickBtn.addEventListener("click", () => fileInput.click());

  let selectedBlobs = [];

  fileInput.addEventListener("change", () => {
    selectedBlobs = [...fileInput.files].filter(f => f.type.startsWith("image/"));
    previewGrid.innerHTML = "";
    for (const f of selectedBlobs) {
      const img = el("img", {
        src: URL.createObjectURL(f),
        style: { width: "80px", height: "80px", objectFit: "cover", borderRadius: "8px",
                 border: "1px solid var(--border)" },
      });
      previewGrid.appendChild(img);
    }
    fileInput.value = "";
  });

  const saveBtn = el("button", { class: "btn", style: { marginTop: "4px" } }, "⬆ Upload & Save");
  saveBtn.addEventListener("click", async () => {
    if (!selectedBlobs.length) return toast("Choose at least one photo first", "warn");
    saveBtn.disabled = true;
    saveBtn.textContent = "Uploading…";
    if (!state.staff_ids[u.id]) state.staff_ids[u.id] = [];
    let ok = 0;
    for (const blob of selectedBlobs) {
      try {
        const filename = `ID_${u.name.replace(/\s+/g, "_")}`;
        const data = await Cloudinary.uploadPhoto(blob, filename);
        const entry = { id: uuid(), url: data.secure_url, at: new Date().toISOString(), name: u.name };
        state.staff_ids[u.id].push(entry);
        myUploads.push(entry);
        ok++;
      } catch (e) {
        console.warn("ID upload error:", e);
      }
    }
    saveBtn.disabled = false;
    saveBtn.textContent = "⬆ Upload & Save";
    if (ok > 0) {
      saveState();
      selectedBlobs = [];
      previewGrid.innerHTML = "";
      renderGallery();
      toast(`${ok} image${ok > 1 ? "s" : ""} saved`);
    } else {
      toast("Upload failed — check your connection", "error");
    }
  });

  uploadCard.appendChild(pickBtn);
  uploadCard.appendChild(previewGrid);
  uploadCard.appendChild(fileInput);
  uploadCard.appendChild(saveBtn);
  wrap.appendChild(uploadCard);
  wrap.appendChild(btnBack());
  return wrap;
};

routes.leaderboard = function(u) {
  const wrap = el("div", {});
  const month = new Date().toISOString().slice(0, 7);
  const monthLabel = new Date().toLocaleString("en", { month: "long", year: "numeric" });
  wrap.appendChild(header("🏆 Leaderboard", monthLabel + " · updated daily"));

  const allStaff = state.users.filter(x => ["barista","head_barista"].includes(x.role) && x.active !== false);
  const allScores = kpiGetAllScores();
  const cats = Object.keys(KPI_W());

  const ranked = allStaff.map(x => {
    const s = allScores[x.id];
    const hasData = s && cats.some(k => s[k] != null);
    const total = hasData ? Math.round(kpiCalcTotal(s)) : null;
    return { ...x, total };
  }).sort((a, b) => {
    if (a.total == null && b.total == null) return 0;
    if (a.total == null) return 1;
    if (b.total == null) return -1;
    return b.total - a.total;
  });

  if (!ranked.some(x => x.total != null)) {
    const empty = el("div", { class: "card", style: { textAlign: "center", padding: "32px 16px" } });
    empty.appendChild(el("div", { style: { fontSize: "36px", marginBottom: "8px" } }, "📊"));
    empty.appendChild(el("div", { style: { fontWeight: "700" } }, "No scores yet this month"));
    empty.appendChild(el("div", { class: "muted small", style: { marginTop: "6px" } },
      "Scores appear once daily logs, sign-ins, and cleaning entries are submitted."));
    wrap.appendChild(empty);
    wrap.appendChild(btnBack());
    return wrap;
  }

  // ── Bonus banner for #1 ──
  const top = ranked[0];
  if (top.total != null) {
    const bonusBanner = el("div", { class: "card", style: {
      background: "linear-gradient(135deg,#f6d365,#fda085)",
      border: "none", marginBottom: "12px", textAlign: "center", padding: "18px 16px",
    }});
    bonusBanner.appendChild(el("div", { style: { fontSize: "28px", marginBottom: "4px" } }, "🏆"));
    bonusBanner.appendChild(el("div", { style: { fontWeight: "800", fontSize: "16px", color: "#333" } },
      top.name + " is leading!"));
    bonusBanner.appendChild(el("div", { style: { fontSize: "13px", color: "#555", marginTop: "4px" } },
      "Score: " + top.total + " · #1 at end of month earns a bonus 🎁"));
    wrap.appendChild(bonusBanner);
  }

  // ── Ranked list ──
  const medals = ["🥇", "🥈", "🥉"];
  const isMe = id => id === u.id;

  for (let i = 0; i < ranked.length; i++) {
    const m = ranked[i];
    const me = isMe(m.id);
    const card = el("div", { class: "card", style: {
      marginBottom: "8px",
      border: me ? "2px solid var(--accent)" : "1px solid var(--border)",
      background: me ? "var(--accent-bg,#fff8f5)" : "var(--surface)",
    }});

    const row = el("div", { style: { display: "flex", alignItems: "center", gap: "12px" } });

    // Rank medal/number
    row.appendChild(el("div", { style: {
      fontSize: i < 3 ? "22px" : "14px", fontWeight: "700",
      width: "32px", textAlign: "center", color: "var(--ink-dim)", flexShrink: "0",
    }}, medals[i] || String(i + 1)));

    // Avatar initials
    const initials = (m.name || "?").split(" ").map(w => w[0]).join("").toUpperCase().slice(0, 2);
    row.appendChild(el("div", { style: {
      width: "36px", height: "36px", borderRadius: "50%", flexShrink: "0",
      background: me ? "var(--accent)" : "var(--surface-2)",
      display: "flex", alignItems: "center", justifyContent: "center",
      fontWeight: "700", fontSize: "13px",
    }}, initials));

    // Name + role
    const info = el("div", { style: { flex: "1", minWidth: "0" } });
    info.appendChild(el("div", { style: { fontWeight: "700", fontSize: "14px" } },
      m.name + (me ? " (you)" : "")));
    info.appendChild(el("div", { class: "muted small" },
      m.role === "head_barista" ? "⭐ Head Barista" : "Barista"));
    row.appendChild(info);

    // Score + bar
    if (m.total != null) {
      const scoreCol = el("div", { style: { textAlign: "right", flexShrink: "0" } });
      scoreCol.appendChild(el("div", { style: {
        fontWeight: "800", fontSize: "20px", color: kpiScoreColor(m.total),
      }}, String(m.total)));
      const barWrap = el("div", { style: { height: "5px", background: "var(--surface-2)", borderRadius: "3px", width: "60px", marginTop: "3px" } });
      barWrap.appendChild(el("div", { style: {
        width: m.total + "%", height: "100%",
        background: kpiScoreColor(m.total), borderRadius: "3px",
      }}));
      scoreCol.appendChild(barWrap);
      row.appendChild(scoreCol);
    } else {
      row.appendChild(el("div", { class: "muted small", style: { flexShrink: "0" } }, "No data"));
    }

    card.appendChild(row);

    // Bonus eligible badge for rank 1
    if (i === 0 && m.total != null) {
      card.appendChild(el("div", { style: { marginTop: "8px", textAlign: "center" } },
        el("span", { class: "pill ok" }, "🎁 Bonus eligible")));
    }

    wrap.appendChild(card);
  }

  wrap.appendChild(el("div", { class: "muted small", style: { textAlign: "center", marginTop: "8px", marginBottom: "16px" } },
    "Scores are based on the last 30 days of activity. Ties are broken alphabetically."));

  wrap.appendChild(btnBack());
  return wrap;
};

// ==============================================================
// INVENTORY INTELLIGENCE ENGINE — UI
// ==============================================================
routes.inventory_engine = function(u) {
  const wrap = el("div", {});
  wrap.appendChild(header("🧠 Inventory Engine", "POS-driven consumption forecasting · predictive reorder · risk alerts"));

  // Run alert scan on entry
  try { runEngineAlertScan(); } catch(e) { console.warn("Engine scan error", e); }

  const sd = () => state.inv_engine_sales_data || [];
  const rc = () => state.inv_engine_recipes    || [];
  const cfg = () => state.inv_engine || {};
  const thresholds = () => (cfg().thresholds || {});
  const engSettings = () => (cfg().settings || {});

  let activeBranch = (u.branches && u.branches[0]) || "maadi";

  // Helper: format days number
  const fmtDays = d => !isFinite(d) || d > 999 ? "∞" : d.toFixed(1) + "d";

  // Helper: risk level from days remaining vs threshold
  function riskLevel(itemId, branch) {
    const cfg_ = thresholds()[itemId] || {};
    const days = invStockLongevity(itemId, branch, sd(), rc());
    if (!isFinite(days) || days === 0) {
      const stock = (computeStock(branch)||{})[itemId] || 0;
      if (stock <= 0) return "dead";
    }
    if (cfg_.priority === "Critical" && isFinite(days) && days < 3) return "critical";
    const threshold = invAdjustedReorderThreshold(itemId, branch, sd(), rc());
    const stock = (computeStock(branch)||{})[itemId] || 0;
    if (stock <= 0) return "dead";
    if (stock <= threshold) return cfg_.priority === "Critical" ? "critical" : "high";
    if (isFinite(days) && days < (cfg_.protection_days || 10)) return "medium";
    return "ok";
  }

  // ── [A] Summary cards ──────────────────────────────────────
  function buildSummaryCards(branch) {
    const alerts = (cfg().engine_alerts || []).filter(a => !a.dismissed && a.branch === branch);
    const critCount  = alerts.filter(a => a.type === "critical_stock").length;
    const lowCount   = alerts.filter(a => a.type === "low_stock").length;
    const spikeCount = alerts.filter(a => a.type === "spike").length;
    const deadCount  = alerts.filter(a => a.type === "dead_inventory").length;

    const cards = el("div", { class: "inv-summary-cards" });
    const mkCard = (num, label, color) => {
      const c = el("div", { class: "inv-summary-card" });
      c.appendChild(el("div", { class: "num", style: { color } }, String(num)));
      c.appendChild(el("div", { class: "lbl" }, label));
      return c;
    };
    cards.appendChild(mkCard(critCount,  "Critical Stock",    "#991b1b"));
    cards.appendChild(mkCard(lowCount,   "Low Stock Alerts",  "#92400e"));
    cards.appendChild(mkCard(spikeCount, "Consumption Spikes","#78350f"));
    cards.appendChild(mkCard(deadCount,  "Dead Inventory",    "#6b7280"));
    return cards;
  }

  // ── [C] Alert panel ────────────────────────────────────────
  function buildAlertPanel(branch) {
    const activeAlerts = (cfg().engine_alerts || []).filter(a => !a.dismissed && a.branch === branch);
    const panel = el("div", { class: "card", style: { marginBottom: "12px", padding: "0" } });
    const panelHead = el("div", {
      style: { padding: "10px 14px", borderBottom: "1px solid var(--border)", display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }
    });
    panelHead.appendChild(el("div", { style: { fontWeight: "700", fontSize: "13px" } },
      `⚠️ Active Alerts (${activeAlerts.length})`));
    const toggleBtn = el("span", { class: "chip", style: { fontSize: "11px" } }, "Show");
    panelHead.appendChild(toggleBtn);
    panel.appendChild(panelHead);

    const body = el("div", { style: { display: "none" } });
    panel.appendChild(body);
    panelHead.addEventListener("click", () => {
      const open = body.style.display !== "none";
      body.style.display = open ? "none" : "block";
      toggleBtn.textContent = open ? "Show" : "Hide";
    });

    if (!activeAlerts.length) {
      body.appendChild(el("div", { style: { padding: "16px", textAlign: "center", color: "var(--ink-dim)", fontSize: "13px" } },
        "✅ No active alerts for this branch"));
    } else {
      const TYPE_LABELS = {
        low_stock: "Low Stock", critical_stock: "Critical", dead_inventory: "Dead Stock",
        supplier_delay: "Supplier Risk", spike: "Spike",
      };
      for (const a of activeAlerts) {
        const d = a.detail || {};
        const row = el("div", { class: "inv-alert-row" });
        row.appendChild(el("span", { class: `inv-alert-type ${a.type}` }, TYPE_LABELS[a.type] || a.type));
        const info = el("div", { style: { flex: "1", fontSize: "12px" } });
        info.appendChild(el("div", { style: { fontWeight: "600" } }, a.item_name));
        let detail = "";
        if (a.type === "low_stock")      detail = `${fmtDays(d.days_remaining)} remaining · threshold ${d.threshold != null ? d.threshold.toFixed(2) : "—"}`;
        if (a.type === "critical_stock") detail = `Only ${fmtDays(d.days_remaining)} left · REORDER NOW`;
        if (a.type === "dead_inventory") detail = `No consumption in ${d.dead_since_days}+ days · ${d.stock != null ? d.stock.toFixed(2) : "?"} in stock`;
        if (a.type === "supplier_delay") detail = `${fmtDays(d.days_remaining)} remaining vs ${d.lead_time_days}d lead time`;
        if (a.type === "spike")          detail = `Recent avg ${(d.recent_avg||0).toFixed(3)} vs historical ${(d.historical_avg||0).toFixed(3)} (×${(d.spike_ratio||0).toFixed(1)})`;
        info.appendChild(el("div", { class: "muted small" }, detail));
        row.appendChild(info);
        const dismissBtn = el("button", { class: "chip", style: { fontSize: "10px", flexShrink: "0" } }, "Dismiss");
        dismissBtn.addEventListener("click", () => {
          a.dismissed = true;
          a.dismissed_by_id   = u.uid;
          a.dismissed_by_name = u.name;
          a.dismissed_at      = new Date().toISOString();
          saveState();
          render();
        });
        row.appendChild(dismissBtn);
        body.appendChild(row);
      }
    }
    return panel;
  }

  // ── [D] Intelligence table ─────────────────────────────────
  function buildTable(branch) {
    const stocks = computeStock(branch);
    const items = (state.items || []).filter(it => it.active !== false);

    const rows = items.map(it => {
      const consumption = invAvgDailyConsumption(it.id, branch, 30, sd(), rc());
      const days        = invStockLongevity(it.id, branch, sd(), rc());
      const threshold   = invAdjustedReorderThreshold(it.id, branch, sd(), rc());
      const stock       = stocks[it.id] || 0;
      const cfg_        = thresholds()[it.id] || {};
      const protDays    = cfg_.protection_days || 10;
      const stockoutDate = invEstimatedStockoutDate(it.id, branch, sd(), rc());
      const orderDate   = stockoutDate ? new Date(stockoutDate - protDays * 86400000) : null;
      const suggestedQty = consumption * (protDays + (cfg_.safety_buffer_days || engSettings().default_safety_buffer || 3));
      const risk        = riskLevel(it.id, branch);
      const series      = invDailyUsageSeries(it.id, branch, sd(), rc(), 14);
      const ma7         = series.length >= 2 ? (invMovingAverage(series, 7).slice(-1)[0]||{}).ma : null;
      const volatility  = invSalesVolatility(it.id, branch, sd(), rc());

      // supplier info
      const supplierList = (state.suppliers || {})[it.id] || [];
      const supplierName = supplierList.length ? supplierList[0].name : "—";

      return { it, stock, consumption, days, threshold, protDays, stockoutDate, orderDate,
               suggestedQty, risk, ma7, volatility, supplierName, cfg_ };
    });

    // Sort by risk severity then days remaining
    const riskOrder = { critical: 0, high: 1, medium: 2, ok: 3, dead: 4 };
    rows.sort((a, b) => {
      const rd = (riskOrder[a.risk] || 5) - (riskOrder[b.risk] || 5);
      if (rd !== 0) return rd;
      const ad = isFinite(a.days) ? a.days : 9999;
      const bd = isFinite(b.days) ? b.days : 9999;
      return ad - bd;
    });

    const fmtNum = (n, dec) => (n == null || isNaN(n)) ? "—" : Number(n).toFixed(dec != null ? dec : 3);
    const fmtDate = d => d ? localISODate(d) : "—";

    const RISK_LABEL = { critical: "Critical", high: "High", medium: "Medium", ok: "OK", dead: "Dead Stock" };
    const RISK_CLASS = { critical: "critical", high: "high", medium: "medium", ok: "ok", dead: "dead" };

    const scrollWrap = el("div", { class: "inv-engine-scroll" });
    const table = el("table", { class: "inv-engine-table" });
    const thead = el("thead", {});
    const hRow  = el("tr", {});
    for (const h of ["Item","Category","Priority","Unit","Avg Daily","Stock","Days Left","Reorder At","Prot. Days","Order By","Suggest Qty","MA 7d","Volatility","Risk","Supplier"]) {
      hRow.appendChild(el("th", {}, h));
    }
    thead.appendChild(hRow);
    table.appendChild(thead);

    const tbody = el("tbody", {});
    for (const r of rows) {
      const tr = el("tr", { class: `risk-${r.risk}` });
      const cells = [
        el("td", { style: { fontWeight: "600", whiteSpace: "nowrap" } }, r.it.name),
        el("td", { class: "muted" }, r.cfg_.category_rule || r.it.category || "—"),
        el("td", {}, el("span", { class: `risk-badge ${(r.cfg_.priority||"").toLowerCase()}` }, r.cfg_.priority || "—")),
        el("td", { class: "muted" }, r.it.unit || "—"),
        el("td", {}, fmtNum(r.consumption, 4)),
        el("td", { style: { fontWeight: "600" } }, fmtNum(r.stock, 3)),
        el("td", { style: { fontWeight: "700", color: r.risk === "critical" ? "#991b1b" : r.risk === "high" ? "#92400e" : "inherit" } }, fmtDays(r.days)),
        el("td", {}, fmtNum(r.threshold, 3)),
        el("td", {}, String(r.protDays) + "d"),
        el("td", {}, fmtDate(r.orderDate)),
        el("td", {}, fmtNum(r.suggestedQty, 3)),
        el("td", {}, r.ma7 != null ? fmtNum(r.ma7, 4) : "—"),
        el("td", {}, r.volatility > 0 ? (r.volatility * 100).toFixed(0) + "%" : "—"),
        el("td", {}, el("span", { class: `risk-badge ${RISK_CLASS[r.risk]}` }, RISK_LABEL[r.risk])),
        el("td", { class: "muted small" }, r.supplierName),
      ];
      for (const c of cells) tr.appendChild(c);
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    scrollWrap.appendChild(table);

    // No-data hint when consumption is all zeros
    const hasComputed = rows.some(r => r.consumption > 0);
    if (!hasComputed) {
      const hint = el("div", { class: "card", style: { background: "var(--surface-2)", marginBottom: "10px", fontSize: "13px", color: "var(--ink-dim)" } }, [
        el("b", {}, "No POS data loaded yet. "),
        "Upload order items reports below and a Recipe sheet to activate computed consumption. Until then, Excel seed values are shown in the Avg Daily column.",
      ]);
      const wrapper = el("div", {});
      wrapper.appendChild(hint);
      wrapper.appendChild(scrollWrap);
      return wrapper;
    }
    return scrollWrap;
  }

  // ── [F] Threshold editor ───────────────────────────────────

        { key: "lead_time_days",    label: "Lead Time (days)",  type: "number", step: "1" },
        { key: "safety_buffer_days",label: "Safety Buffer",     type: "number", step: "1" },
        { key: "priority",          label: "Priority",          type: "select", opts: ["Critical","High","Medium","Standard","Low"] },
        { key: "category_rule",     label: "Category",          type: "select", opts: ["critical","specialty","low_turnover","standard"] },
        { key: "expiry_days",       label: "Expiry (days)",     type: "number", step: "1" },
      ];

      for (const f of fields) {

    wrap.appendChild(btnBack());
  }

  draw();
  return wrap;
};

// ==============================================================
// NOTIFICATIONS & ALERTS CENTER

routes.notifications = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("🔔 Notifications & Alerts", "Engine alerts · Inventory actions · System notifications"));

  const SEVERITY = { critical_stock: 0, low_stock: 1, spike: 2, supplier_delay: 3, dead_inventory: 4 };
  const TYPE_LABELS = {
    low_stock: "Low Stock", critical_stock: "Critical Stock", dead_inventory: "Dead Stock",
    supplier_delay: "Supplier Risk", spike: "Spike",
  };
  const TYPE_CSS = {
    low_stock: "low", critical_stock: "critical", dead_inventory: "dead",
    supplier_delay: "delay", spike: "spike",
  };

  function fmtTs(iso) {
    if (!iso) return "—";
    return iso.slice(0, 16).replace("T", " ");
  }

  // ── Pre-compute data for badge counts ──────────────────────
  const allEngineAlerts = ((state.inv_engine && state.inv_engine.engine_alerts) || [])
    .slice()
    .sort((a, b) => {
      if (!a.dismissed && b.dismissed) return -1;
      if (a.dismissed && !b.dismissed) return 1;
      const sa = SEVERITY[a.type] ?? 99, sb = SEVERITY[b.type] ?? 99;
      if (sa !== sb) return sa - sb;
      return (b.fired_at || "").localeCompare(a.fired_at || "");
    });
  const activeEngineAlerts    = allEngineAlerts.filter(a => !a.dismissed);
  const dismissedEngineAlerts = allEngineAlerts.filter(a =>  a.dismissed);

  const cutoff = new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10);
  const legacyAlerts = (state.alert_log || [])
    .filter(a => a.date >= cutoff)
    .slice()
    .sort((a, b) => b.date.localeCompare(a.date));

  const sysNotifs = (state.leadership_notifications || [])
    .slice()
    .sort((a, b) => (b.at || "").localeCompare(a.at || ""))
    .slice(0, 50);

  // ── Tab bar ─────────────────────────────────────────────────
  let activeTab = "engine";
  const tabBar  = el("div", { class: "tabs", style: { marginBottom: "16px" } });
  const body    = el("div", {});

  const TAB_DEFS = [
    { key: "engine",  label: "⚡ Engine Alerts",      badge: activeEngineAlerts.length },
    { key: "legacy",  label: "📦 Inventory Actions",   badge: legacyAlerts.filter(a => {
        const resolved = isReorderResolved(a.item_id, a.date);
        const called   = isReorderActionedByCalling(a.key);
        return !resolved && !called;
      }).length },
    { key: "system",  label: "🔔 System",              badge: sysNotifs.length },
  ];

  function buildTabBar() {
    tabBar.innerHTML = "";
    TAB_DEFS.forEach(({ key, label, badge }) => {
      const btn = el("div", { class: "tab" + (activeTab === key ? " on" : "") });
      btn.appendChild(document.createTextNode(label));
      if (badge > 0) {
        btn.appendChild(el("span", { class: "notif-badge", style: { marginLeft: "5px" } }, String(badge)));
      }
      btn.addEventListener("click", () => { activeTab = key; buildTabBar(); renderBody(); });
      tabBar.appendChild(btn);
    });
  }

  // ── Tab body renderers ──────────────────────────────────────
  function renderEngineTab() {
    if (!allEngineAlerts.length) {
      body.appendChild(el("div", { class: "notif-empty card" }, "✅ No engine alerts on record."));
      return;
    }
    // Active alerts
    for (const a of activeEngineAlerts) {
      const d = a.detail || {};
      let detail = "";
      if (a.type === "low_stock")       detail = `${(d.days_remaining||0).toFixed(1)}d remaining · threshold ${d.threshold != null ? d.threshold.toFixed(2) : "—"}`;
      if (a.type === "critical_stock")  detail = `Only ${(d.days_remaining||0).toFixed(1)}d left — REORDER NOW`;
      if (a.type === "dead_inventory")  detail = `No consumption in ${d.dead_since_days || "?"}+ days · ${d.stock != null ? d.stock.toFixed(2) : "?"} in stock`;
      if (a.type === "supplier_delay")  detail = `${(d.days_remaining||0).toFixed(1)}d remaining vs ${d.lead_time_days}d lead time`;
      if (a.type === "spike")           detail = `Avg ${(d.recent_avg||0).toFixed(3)} vs historical ${(d.historical_avg||0).toFixed(3)} (×${(d.spike_ratio||0).toFixed(1)})`;

      const card = el("div", { class: `notif-card ${TYPE_CSS[a.type] || ""}` });
      const topRow = el("div", { style: { display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap" } });
      topRow.appendChild(el("span", { class: `inv-alert-type ${a.type}` }, TYPE_LABELS[a.type] || a.type));
      topRow.appendChild(el("span", { style: { fontWeight: "600", fontSize: "13px" } }, `${a.item_name} · ${a.branch}`));
      topRow.appendChild(el("span", { class: "notif-status-chip active" }, "Active"));
      card.appendChild(topRow);
      if (detail) card.appendChild(el("div", { class: "muted small" }, detail));
      card.appendChild(el("div", { class: "muted small" }, `Fired: ${fmtTs(a.fired_at)}`));
      if (Array.isArray(a.follow_ups) && a.follow_ups.length > 0) {
        card.appendChild(el("div", { style: { fontSize: "12px", color: "#c0392b" } },
          `⚠️ ${a.follow_ups.length} follow-up alarm${a.follow_ups.length > 1 ? "s" : ""} fired`));
      }
      body.appendChild(card);
    }
    // Dismissed — collapsed behind toggle
    if (dismissedEngineAlerts.length > 0) {
      const dismissedWrap = el("div", { style: { marginTop: "4px" } });
      const toggleBtn = el("button", { class: "chip", style: { fontSize: "11px", marginBottom: "8px" } },
        `Show ${dismissedEngineAlerts.length} dismissed / resolved`);
      const dismissedBody = el("div", { style: { display: "none" } });
      toggleBtn.addEventListener("click", () => {
        const open = dismissedBody.style.display !== "none";
        dismissedBody.style.display = open ? "none" : "block";
        toggleBtn.textContent = open ? `Show ${dismissedEngineAlerts.length} dismissed / resolved` : "Hide";
      });
      dismissedWrap.appendChild(toggleBtn);
      for (const a of dismissedEngineAlerts) {
        const isAutoResolved = a.dismissed_by_name === "Auto-resolved";
        const card = el("div", { class: "notif-card dead" });
        const topRow = el("div", { style: { display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap" } });
        topRow.appendChild(el("span", { class: `inv-alert-type ${a.type}` }, TYPE_LABELS[a.type] || a.type));
        topRow.appendChild(el("span", { style: { fontWeight: "600", fontSize: "13px" } }, `${a.item_name} · ${a.branch}`));
        if (isAutoResolved) {
          topRow.appendChild(el("span", { class: "notif-status-chip resolved" }, "✅ Auto-resolved"));
        } else {
          topRow.appendChild(el("span", { class: "notif-status-chip dismissed" },
            `Dismissed by ${a.dismissed_by_name || "unknown"}`));
        }
        card.appendChild(topRow);
        card.appendChild(el("div", { class: "muted small" }, `Fired: ${fmtTs(a.fired_at)}`));
        if (a.dismissed_at) {
          card.appendChild(el("div", { class: "muted small" },
            `${isAutoResolved ? "Resolved" : "Dismissed"}: ${fmtTs(a.dismissed_at)}`));
        }
        dismissedBody.appendChild(card);
      }
      dismissedWrap.appendChild(dismissedBody);
      body.appendChild(dismissedWrap);
    }
  }

  function renderLegacyTab() {
    if (!legacyAlerts.length) {
      body.appendChild(el("div", { class: "notif-empty card" }, "No inventory alerts in the last 30 days."));
      return;
    }
    for (const a of legacyAlerts) {
      const actions = (state.reorder_actions || []).filter(r => r.alert_key === a.key);
      const resolved       = isReorderResolved(a.item_id, a.date);
      const calledSupplier = isReorderActionedByCalling(a.key);
      const daysSince = Math.floor((Date.now() - new Date(a.date + "T00:00:00")) / 86400000);
      const isOverdue = !resolved && !calledSupplier && daysSince > 6;

      let statusLabel, statusClass;
      if (resolved)            { statusLabel = "✅ Resolved (purchased)"; statusClass = "resolved"; }
      else if (calledSupplier) { statusLabel = "✅ Supplier called";       statusClass = "resolved"; }
      else if (isOverdue)      { statusLabel = "🔴 Overdue";              statusClass = "active";   }
      else if (!actions.length){ statusLabel = "⏳ Pending";              statusClass = "active";   }
      else                     { statusLabel = "⏳ Awaiting purchase";     statusClass = "dismissed";}

      const card = el("div", { class: "notif-card legacy" });
      const topRow = el("div", { style: { display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap" } });
      topRow.appendChild(el("span", { style: { fontWeight: "600", fontSize: "13px" } }, `${a.item_name} · ${a.branch}`));
      topRow.appendChild(el("span", { class: `notif-status-chip ${statusClass}` }, statusLabel));
      card.appendChild(topRow);
      card.appendChild(el("div", { class: "muted small" }, `Alert date: ${a.date} · ${daysSince}d ago`));
      if (Array.isArray(a.follow_ups) && a.follow_ups.length > 0) {
        card.appendChild(el("div", { style: { fontSize: "12px", color: "#c0392b" } },
          `⚠️ ${a.follow_ups.length} follow-up alarm${a.follow_ups.length > 1 ? "s" : ""} fired`));
      }
      // Actions / acknowledgements
      if (actions.length > 0) {
        for (const r of actions) {
          const chips = [];
          if (r.called_supplier)       chips.push("☎️ Called supplier");
          if (r.notified_head_barista) chips.push("👤 Notified head barista");
          const aRow = el("div", { style: { background: "var(--surface-2,var(--surface))", border: "1px solid var(--border)", borderRadius: "8px", padding: "8px 10px", marginTop: "6px", fontSize: "12px" } });
          aRow.appendChild(el("div", { style: { fontWeight: "600", marginBottom: "2px" } }, chips.join(" · ") || "Action logged"));
          aRow.appendChild(el("div", { class: "muted small" }, `By: ${r.by_name} · ${fmtTs(r.at)}`));
          if (r.comment) aRow.appendChild(el("div", { style: { fontStyle: "italic", marginTop: "2px", fontSize: "11px" } }, `"${r.comment}"`));
          card.appendChild(aRow);
        }
      } else {
        card.appendChild(el("div", { style: { color: "#e67e22", fontSize: "12px", marginTop: "4px" } }, "No action logged yet."));
      }
      if (!resolved && !calledSupplier && ["barista","head_barista","owner","accountant"].includes(u.role)) {
        const btn = el("button", { class: "btn secondary", style: { marginTop: "8px", padding: "5px 12px", fontSize: "12px" } }, "📝 Log action");
        btn.addEventListener("click", () => go("reorder_action_list"));
        card.appendChild(btn);
      }
      body.appendChild(card);
    }
  }

  function renderSystemTab() {
    if (!sysNotifs.length) {
      body.appendChild(el("div", { class: "notif-empty card" }, "No system notifications on record."));
      return;
    }
    for (const n of sysNotifs) {
      const card = el("div", { class: "notif-card sysnotif" });
      card.appendChild(el("div", { style: { fontWeight: "600", fontSize: "13px" } }, n.title || "Notification"));
      if (n.body) card.appendChild(el("div", { class: "muted small", style: { marginTop: "2px" } }, n.body));
      card.appendChild(el("div", { class: "muted small" }, fmtTs(n.at)));
      if (n.role_key) {
        const roleNames = { weekly_schedule: "Schedule Manager", inventory_management: "Inventory Manager", cash_status: "Cash Manager" };
        card.appendChild(el("div", { class: "muted small" }, `Role: ${roleNames[n.role_key] || n.role_key}`));
      }
      body.appendChild(card);
    }
  }

  function renderBody() {
    body.innerHTML = "";
    if (activeTab === "engine") renderEngineTab();
    else if (activeTab === "legacy") renderLegacyTab();
    else if (activeTab === "system") renderSystemTab();
  }

  buildTabBar();
  renderBody();
  wrap.appendChild(tabBar);
  wrap.appendChild(body);
  wrap.appendChild(btnBack());
  return wrap;
};

// ── Training helpers ──────────────────────────────────────────

function trainingGetBaristaLevel(staffId) {
  const done = (state.training_quizzes || [])
    .filter(q => q.staff_id === staffId && q.status === "completed")
    .sort((a,b) => b.month.localeCompare(a.month));
  if (!done.length) return "beginner";
  const last = done[0];
  const idx  = TRAINING_LEVELS.indexOf(last.level);
  if (last.score >= 80 && idx < TRAINING_LEVELS.length - 1) return TRAINING_LEVELS[idx + 1];
  return last.level;
}

function trainingGetWeakTopics(staffId) {
  const done = (state.training_quizzes || [])
    .filter(q => q.staff_id === staffId && q.status === "completed")
    .sort((a,b) => b.month.localeCompare(a.month));
  if (!done.length) return [];
  const last = done[0];
  return Object.entries(last.topic_scores || {})
    .filter(([,pct]) => pct < 60)
    .map(([t]) => t);
}

function trainingBuildQuestions(staffId, level) {
  const base  = TRAINING_QUESTIONS.filter(q => q.level === level);
  const weak  = trainingGetWeakTopics(staffId);
  // Pull remedial questions from any level that cover the weak topics
  const remedial = weak.length
    ? TRAINING_QUESTIONS.filter(q => q.level !== level && weak.includes(q.topic))
        .slice(0, 3)
    : [];
  // Shuffle base and take up to 12, then append remedial
  const shuffled = [...base].sort(() => Math.random() - 0.5).slice(0, 12);
  return [...shuffled, ...remedial].map(q => q.id);
}

function trainingTriggerMonth(month) {
  const baristas = staffDir.active().filter(u => ["barista","head_barista"].includes(u.role));
  let created = 0;
  for (const u of baristas) {
    const exists = (state.training_quizzes || []).some(q => q.staff_id === u.id && q.month === month);
    if (exists) continue;
    const level  = trainingGetBaristaLevel(u.id);
    const qIds   = trainingBuildQuestions(u.id, level);
    state.training_quizzes.push({
      id: uuid(), staff_id: u.id, staff_name: u.name, month, level,
      question_ids: qIds, status: "pending",
      triggered_at: now(), answers: {}, score: null, topic_scores: {}, weak_topics: [],
    });
    created++;
  }
  if (created > 0) { saveState({ immediate: true }); toast(`${created} اختبار تم إنشاؤه · ${created} quiz${created > 1 ? "zes" : ""} generated`); }
  return created;
}

function trainingScoreQuiz(quiz) {
  const topicTotals = {};
  const topicCorrect = {};
  let correct = 0;
  for (const qId of quiz.question_ids) {
    const q = TRAINING_QUESTIONS.find(x => x.id === qId);
    if (!q) continue;
    topicTotals[q.topic]   = (topicTotals[q.topic]   || 0) + 1;
    const ans = quiz.answers[qId];
    if (ans === q.correct) {
      correct++;
      topicCorrect[q.topic] = (topicCorrect[q.topic] || 0) + 1;
    }
  }
  const total  = quiz.question_ids.length || 1;
  const score  = Math.round((correct / total) * 100);
  const topicScores = {};
  for (const t of Object.keys(topicTotals)) {
    topicScores[t] = Math.round(((topicCorrect[t] || 0) / topicTotals[t]) * 100);
  }
  const weakTopics = Object.entries(topicScores)
    .filter(([,pct]) => pct < 60).map(([t]) => t);
  return { score, topicScores, weakTopics };
}

    } else {
      card.appendChild(el("div", { style: { color: "var(--good)", fontWeight: "600", marginTop: "8px" } },
        "🌟 ممتاز! لا توجد نقاط ضعف · Excellent! No weak topics."));
    }
    wrap.appendChild(card);
  }

  // Past quizzes history
  if (allDone.length) {
    wrap.appendChild(el("div", { style: { fontWeight: "700", margin: "16px 0 6px" } }, "السجل · History"));
    for (const q of allDone.slice(0, 6)) {
      const sc = Math.round(q.score);
      const c  = sc >= 80 ? "var(--good)" : sc >= 60 ? "#f59e0b" : "var(--bad)";
      const row = el("div", { class: "row" });
      row.appendChild(el("div", { class: "grow" }, [
        el("div", { class: "title" }, q.month),
        el("div", { class: "sub" }, trainingLevelLabel(q.level)),
      ]));
      row.appendChild(el("div", { style: { color: c, fontWeight: "800", fontSize: "18px" } }, `${sc}%`));
      wrap.appendChild(row);
    }
  }

  wrap.appendChild(btnBack());
  return wrap;
};

// ── Route: training_quiz_take ─────────────────────────────────
routes.training_quiz_take = function(u) {
  const wrap = el("div", {});
  const month = new Date().toISOString().slice(0, 7);
  const quiz  = (state.training_quizzes || []).find(q => q.staff_id === u.id && q.month === month && q.status === "pending");

  if (!quiz) {
    wrap.appendChild(header("اختبار شهري · Monthly Quiz", ""));
    wrap.appendChild(el("div", { class: "card" }, [
      el("div", { style: { textAlign: "center", padding: "24px 0" } }, "لا يوجد اختبار نشط · No active quiz found."),
    ]));
    wrap.appendChild(btnBack());
    return wrap;
  }

  const questions = quiz.question_ids.map(id => TRAINING_QUESTIONS.find(q => q.id === id)).filter(Boolean);
  let currentIdx = 0;
  const answers  = { ...quiz.answers };
  // revealed[qId] = true once the barista has tapped an answer and seen the feedback
  const revealed = {};
  // Pre-mark already-answered questions as revealed (resumed quiz)
  for (const qId of Object.keys(answers)) revealed[qId] = true;

  function buildQuestion() {
    wrap.innerHTML = "";
    const q    = questions[currentIdx];
    const prog = `${currentIdx + 1} / ${questions.length}`;

    // Header bar
    const hdr = el("div", { style: { padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: "1px solid var(--border)", background: "var(--surface)" } });
    hdr.appendChild(el("div", { style: { fontWeight: "700" } }, `📝 اختبار ${month}`));
    hdr.appendChild(el("div", { class: "muted small" }, prog));
    wrap.appendChild(hdr);

    // Progress bar
    const pct  = Math.round(((currentIdx) / questions.length) * 100);
    const pBar = el("div", { style: { height: "4px", background: "var(--border)" } });
    pBar.appendChild(el("div", { style: { height: "100%", width: pct + "%", background: "var(--accent)", transition: "width .3s" } }));
    wrap.appendChild(pBar);

    const body = el("div", { style: { padding: "16px" } });

    // Topic chip
    body.appendChild(el("div", { class: "chip", style: { marginBottom: "10px", display: "inline-block" } },
      `${TRAINING_TOPIC_AR[q.topic] || q.topic}`));

    // Question text (Arabic primary)
    body.appendChild(el("div", { style: { fontSize: "18px", fontWeight: "700", marginBottom: "4px", direction: "rtl", textAlign: "right" } }, q.ar));
    body.appendChild(el("div", { class: "muted small", style: { marginBottom: "16px" } }, q.en));

    // Answer options
    const selected  = answers[q.id];
    const isRevealed = !!revealed[q.id];

    for (const opt of q.opts) {
      const isSelected = selected === opt.id;
      const isCorrect  = opt.id === q.correct;

      // Colour logic: only apply green/red after the barista has answered
      let borderColor = "var(--border)";
      let bgColor     = "var(--surface)";
      let badge       = "";

      if (isRevealed) {
        if (isCorrect) {
          borderColor = "#16a34a";
          bgColor     = "#f0fdf4";
          badge       = isSelected ? " ✓" : " ← الإجابة الصحيحة";
        } else if (isSelected) {
          borderColor = "#dc2626";
          bgColor     = "#fff1f2";
          badge       = " ✗";
        }
      } else if (isSelected) {
        borderColor = "var(--accent)";
        bgColor     = "var(--accent-soft, #fef3c7)";
      }

      const btn = el("div", {
        style: {
          border: `2px solid ${borderColor}`,
          background: bgColor,
          borderRadius: "10px", padding: "12px 14px", marginBottom: "8px",
          cursor: isRevealed ? "default" : "pointer",
          transition: "all .15s",
          opacity: isRevealed && !isCorrect && !isSelected ? "0.5" : "1",
        }
      });
      const optRow = el("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between" } });
      const optText = el("div", {});
      optText.appendChild(el("div", { style: { fontWeight: "600", direction: "rtl", textAlign: "right", marginBottom: "2px" } }, opt.ar));
      optText.appendChild(el("div", { class: "muted small" }, opt.en));
      optRow.appendChild(optText);
      if (badge) {
        optRow.appendChild(el("div", { style: {
          fontWeight: "800", fontSize: "13px", flexShrink: 0, marginLeft: "8px",
          color: isCorrect ? "#16a34a" : "#dc2626",
        }}, badge));
      }
      btn.appendChild(optRow);

      if (!isRevealed) {
        btn.addEventListener("click", () => {
          answers[q.id]  = opt.id;
          revealed[q.id] = true;
          quiz.answers   = answers;
          saveState({});
          buildQuestion();
        });
      }
      body.appendChild(btn);
    }

    // Feedback banner (shown after answering)
    if (isRevealed && selected) {
      const isRight = selected === q.correct;
      const fb = el("div", { style: {
        borderRadius: "10px", padding: "10px 14px", marginTop: "4px", marginBottom: "8px",
        background: isRight ? "#f0fdf4" : "#fff1f2",
        border: `1px solid ${isRight ? "#16a34a" : "#dc2626"}`,
        fontWeight: "700", fontSize: "14px",
        color: isRight ? "#15803d" : "#b91c1c",
      }});
      fb.appendChild(document.createTextNode(isRight ? "✓ إجابة صحيحة! · Correct!" : "✗ إجابة خاطئة · Wrong answer"));
      body.appendChild(fb);
    }

    // Navigation buttons
    const nav = el("div", { style: { display: "flex", gap: "8px", marginTop: "16px" } });
    if (currentIdx > 0) {
      const prev = el("button", { class: "btn ghost" }, "← السابق");
      prev.addEventListener("click", () => { currentIdx--; buildQuestion(); });
      nav.appendChild(prev);
    }
    nav.appendChild(el("div", { style: { flex: 1 } }));
    if (currentIdx < questions.length - 1) {
      // Only show Next after answering; Skip if not answered
      const nextLabel = isRevealed ? "التالي →" : "تخطى · Skip →";
      const next = el("button", { class: isRevealed ? "btn primary" : "btn ghost" }, nextLabel);
      next.addEventListener("click", () => { currentIdx++; buildQuestion(); });
      nav.appendChild(next);
    } else {
      // Last question — show Submit (only enabled once answered or skipped)
      const answered = questions.filter(q2 => answers[q2.id]).length;
      const submitBtn = el("button", { class: "btn primary" }, `إرسال الاختبار · Submit (${answered}/${questions.length})`);
      submitBtn.addEventListener("click", () => {
        if (answered < questions.length && !confirm(`لم تجب على ${questions.length - answered} سؤال. هل تريد الإرسال؟\nYou left ${questions.length - answered} unanswered. Submit anyway?`)) return;
        quiz.answers  = answers;
        const result  = trainingScoreQuiz(quiz);
        quiz.score        = result.score;
        quiz.topic_scores = result.topicScores;
        quiz.weak_topics  = result.weakTopics;
        quiz.status       = "completed";
        quiz.completed_at = now();
        saveState({ immediate: true });
        buildResult();
      });
      nav.appendChild(submitBtn);
    }
    body.appendChild(nav);
    wrap.appendChild(body);
  }

  function buildResult() {
    wrap.innerHTML = "";
    const sc = Math.round(quiz.score);
    const scoreColor = sc >= 80 ? "var(--good)" : sc >= 60 ? "#f59e0b" : "var(--bad)";
    const hdr = el("div", { style: { padding: "16px", textAlign: "center", borderBottom: "1px solid var(--border)" } });
    hdr.appendChild(el("div", { style: { fontSize: "40px", fontWeight: "900", color: scoreColor } }, `${sc}%`));
    hdr.appendChild(el("div", { style: { fontWeight: "700", fontSize: "16px", marginTop: "4px" } },
      sc >= 80 ? "ممتاز! 🌟 · Excellent!" : sc >= 60 ? "جيد! ✅ · Good!" : "تحتاج للمزيد من الدراسة ⚠ · Needs work"));
    hdr.appendChild(el("div", { class: "muted small", style: { marginTop: "2px" } }, trainingLevelLabel(quiz.level)));
    wrap.appendChild(hdr);

    const body = el("div", { style: { padding: "16px" } });

    // Topic breakdown
    body.appendChild(el("div", { style: { fontWeight: "700", marginBottom: "8px" } }, "النتائج حسب الموضوع · Results by topic:"));
    for (const [topic, pct] of Object.entries(quiz.topic_scores)) {
      const tc = pct >= 80 ? "var(--good)" : pct >= 60 ? "#f59e0b" : "var(--bad)";
      const row = el("div", { class: "kv" });
      row.appendChild(el("div", { class: "k" }, `${TRAINING_TOPIC_AR[topic] || topic}`));
      const bar = el("div", { style: { display: "flex", alignItems: "center", gap: "8px" } });
      bar.appendChild(el("div", { style: { width: "60px", height: "8px", background: "var(--border)", borderRadius: "4px", overflow: "hidden" } }, [
        el("div", { style: { height: "100%", width: pct + "%", background: tc, borderRadius: "4px" } })
      ]));
      bar.appendChild(el("div", { style: { color: tc, fontWeight: "700", fontSize: "13px" } }, `${pct}%`));
      row.appendChild(bar);
      body.appendChild(row);
    }

    // Weak topics study guide
    if (quiz.weak_topics.length) {
      const study = el("div", { style: { background: "#fff8f0", border: "1px solid #f59e0b", borderRadius: "10px", padding: "12px 14px", marginTop: "12px" } });
      study.appendChild(el("div", { style: { fontWeight: "700", marginBottom: "6px", color: "#92400e" } }, "📚 ادرس هذه المواضيع · Study these topics:"));
      for (const t of quiz.weak_topics) {
        study.appendChild(el("div", { style: { marginBottom: "2px" } }, `• ${TRAINING_TOPIC_AR[t] || t}`));
      }
      body.appendChild(study);
    }

    // Advancement message
    const nextLevel = TRAINING_LEVELS[Math.min(TRAINING_LEVELS.indexOf(quiz.level) + 1, TRAINING_LEVELS.length - 1)];
    const advMsg = el("div", { style: { marginTop: "12px", padding: "10px 12px", borderRadius: "8px",
      background: sc >= 80 ? "#d1fae5" : "#f1f5f9", color: sc >= 80 ? "#065f46" : "var(--ink-dim)", fontSize: "13px" } });
    advMsg.appendChild(document.createTextNode(
      sc >= 80
        ? `🎉 تهانينا! الشهر القادم ستنتقل إلى مستوى ${TRAINING_LEVEL_AR[nextLevel]} · You advance to ${nextLevel} next month!`
        : `استمر في الدراسة! ستبقى في مستوى ${TRAINING_LEVEL_AR[quiz.level]} الشهر القادم · Keep studying — you stay at ${quiz.level} next month.`
    ));
    body.appendChild(advMsg);

    const doneBtn = el("button", { class: "btn primary", style: { width: "100%", marginTop: "16px" } }, "رجوع للرئيسية · Back to Home");
    doneBtn.addEventListener("click", () => go("home"));
    body.appendChild(doneBtn);
    wrap.appendChild(body);
  }

  buildQuestion();
  return wrap;
};

// ── Route: training_dashboard (owner view) ────────────────────
routes.training_dashboard = function(u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Training Tests", "Monthly quiz dashboard · لوحة الاختبارات الشهرية"));

  const month  = new Date().toISOString().slice(0, 7);
  const quizzes = (state.training_quizzes || []).filter(q => q.month === month);

  // Auto-trigger if no quizzes exist for this month yet
  if (quizzes.length === 0) {
    const trigCount = trainingTriggerMonth(month);
    if (trigCount === 0) {
      wrap.appendChild(el("div", { class: "card" }, [
        el("div", { style: { textAlign: "center", padding: "24px 0", color: "var(--ink-dim)" } },
          "لا يوجد بارستا نشط لإنشاء اختبارات · No active baristas found.")
      ]));
    }
  }

  // Summary row
  const allQ = (state.training_quizzes || []).filter(q => q.month === month);
  const done  = allQ.filter(q => q.status === "completed");
  const pend  = allQ.filter(q => q.status === "pending");
  const avgScore = done.length ? Math.round(done.reduce((s,q) => s+q.score, 0) / done.length) : null;
  const summary = el("div", { class: "card", style: { marginBottom: "12px" } });
  summary.appendChild(el("div", { style: { fontWeight: "700", marginBottom: "8px" } }, `📊 ${month} — شهر الاختبار الحالي`));
  const sGrid = el("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "8px", textAlign: "center" } });
  [[allQ.length, "الإجمالي · Total"], [done.length, "أكمل · Done"], [pend.length, "معلق · Pending"]].forEach(([n,l]) => {
    const c = el("div", { style: { background: "var(--surface-2,var(--surface-alt,#f8f8f8))", borderRadius: "8px", padding: "10px 4px" } });
    c.appendChild(el("div", { style: { fontSize: "24px", fontWeight: "800" } }, String(n)));
    c.appendChild(el("div", { class: "muted small" }, l));
    sGrid.appendChild(c);
  });
  summary.appendChild(sGrid);
  if (avgScore !== null) {
    summary.appendChild(el("div", { style: { marginTop: "8px", textAlign: "center" } }, [
      el("span", { class: "muted small" }, "متوسط النتائج · Avg score: "),
      el("b", { style: { color: avgScore >= 80 ? "var(--good)" : avgScore >= 60 ? "#f59e0b" : "var(--bad)" } }, `${avgScore}%`),
    ]));
  }
  // Manual trigger button
  const trigBtn = el("button", { class: "btn secondary", style: { marginTop: "10px", width: "100%" } }, "🔄 إعادة توليد اختبارات الشهر · Regenerate quizzes");
  trigBtn.addEventListener("click", () => {
    if (!confirm(`إعادة توليد اختبارات ${month} للبارستا الذين لم يبدأوا بعد؟\nRegenerate ${month} quizzes for baristas without one?`)) return;
    trainingTriggerMonth(month);
    go("training_dashboard");
  });
  summary.appendChild(trigBtn);
  wrap.appendChild(summary);

  // Per-barista breakdown
  const baristas = staffDir.active().filter(u2 => ["barista","head_barista"].includes(u2.role));
  if (!baristas.length) {
    wrap.appendChild(el("div", { class: "muted small" }, "لا يوجد بارستا نشط · No active baristas."));
    wrap.appendChild(btnBack());
    return wrap;
  }

  // Sort: needs-work first, then pending, then advancing
  const rows = baristas.map(person => {
    const q  = allQ.find(x => x.staff_id === person.id);
    const level = trainingGetBaristaLevel(person.id);
    return { person, q, level };
  }).sort((a,b) => {
    const rankA = !a.q ? 2 : a.q.status === "pending" ? 1 : a.q.score < 70 ? 0 : 3;
    const rankB = !b.q ? 2 : b.q.status === "pending" ? 1 : b.q.score < 70 ? 0 : 3;
    return rankA - rankB;
  });

  // "Needs work" group header
  const needsWork = rows.filter(r => r.q && r.q.status === "completed" && r.q.score < 70);
  const advancing  = rows.filter(r => r.q && r.q.status === "completed" && r.q.score >= 80);

  if (needsWork.length) {
    wrap.appendChild(el("div", { style: { fontWeight: "700", color: "var(--bad)", margin: "12px 0 6px" } },
      `⚠ يحتاج إلى عمل · Needs work (${needsWork.length})`));
  }

  for (const { person, q, level } of rows) {
    const card = el("div", { class: "card", style: { marginBottom: "8px" } });
    const top  = el("div", { style: { display: "flex", alignItems: "center", gap: "10px", marginBottom: "6px" } });
    top.appendChild(el("div", { style: { fontWeight: "700", flex: 1 } }, person.name));
    top.appendChild(el("div", { class: "chip" }, trainingLevelLabel(level)));
    card.appendChild(top);

    if (!q) {
      card.appendChild(el("div", { class: "muted small" }, "لم يُنشأ اختبار · No quiz generated"));
    } else if (q.status === "pending") {
      card.appendChild(el("div", { style: { color: "#f59e0b", fontSize: "13px", fontWeight: "600" } }, "⏳ في انتظار البارستا · Pending barista"));
    } else {
      const sc = Math.round(q.score);
      const sc_color = sc >= 80 ? "var(--good)" : sc >= 60 ? "#f59e0b" : "var(--bad)";
      const scoreRow = el("div", { style: { display: "flex", alignItems: "center", gap: "8px", marginBottom: "4px" } });
      scoreRow.appendChild(el("div", { style: { fontSize: "22px", fontWeight: "800", color: sc_color } }, `${sc}%`));
      scoreRow.appendChild(el("div", { class: "muted small" }, sc >= 80 ? "🌟 يتقدم · Advancing" : sc >= 60 ? "✅ مقبول · Acceptable" : "⚠ يحتاج تركيز · Needs focus"));
      card.appendChild(scoreRow);

      // Topic scores bar chart
      if (q.topic_scores && Object.keys(q.topic_scores).length) {
        const topicWrap = el("div", { style: { marginTop: "4px" } });
        for (const [topic, pct] of Object.entries(q.topic_scores)) {
          const tc = pct >= 80 ? "var(--good)" : pct >= 60 ? "#f59e0b" : "var(--bad)";
          const tRow = el("div", { style: { display: "flex", alignItems: "center", gap: "6px", marginBottom: "3px", fontSize: "12px" } });
          tRow.appendChild(el("div", { style: { width: "90px", flexShrink: 0, color: pct < 60 ? "var(--bad)" : "var(--ink-dim)" } },
            TRAINING_TOPIC_AR[topic] || topic));
          tRow.appendChild(el("div", { style: { flex: 1, height: "6px", background: "var(--border)", borderRadius: "3px" } }, [
            el("div", { style: { height: "100%", width: pct + "%", background: tc, borderRadius: "3px" } })
          ]));
          tRow.appendChild(el("div", { style: { width: "30px", textAlign: "right", color: tc, fontWeight: "600" } }, `${pct}%`));
          topicWrap.appendChild(tRow);
        }
        card.appendChild(topicWrap);
      }

      // What to focus on
      if (q.weak_topics && q.weak_topics.length) {
        const focusDiv = el("div", { style: { marginTop: "6px", fontSize: "12px", color: "#92400e", fontStyle: "italic" } });
        focusDiv.appendChild(document.createTextNode(
          `يجب التركيز على: ${q.weak_topics.map(t => TRAINING_TOPIC_AR[t] || t).join(" · ")}`));
        card.appendChild(focusDiv);
      }
    }
    wrap.appendChild(card);
  }

  // All-time advancement overview
  wrap.appendChild(el("div", { style: { fontWeight: "700", margin: "16px 0 6px" } }, "📈 التقدم العام · Overall Advancement"));
  for (const person of baristas) {
    const allPersonQ = (state.training_quizzes || [])
      .filter(q => q.staff_id === person.id && q.status === "completed")
      .sort((a,b) => a.month.localeCompare(b.month));
    if (!allPersonQ.length) continue;
    const row = el("div", { class: "row" });
    row.appendChild(el("div", { class: "grow" }, [
      el("div", { class: "title" }, person.name),
      el("div", { class: "sub" }, allPersonQ.map(q => `${q.month}: ${Math.round(q.score)}%`).join(" · ")),
    ]));
    const curLevel = trainingGetBaristaLevel(person.id);
    row.appendChild(el("div", { class: "chip" }, TRAINING_LEVEL_AR[curLevel] || curLevel));
    wrap.appendChild(row);
  }

  wrap.appendChild(btnBack());
  return wrap;
};

// export helpers
// ==============================================================
function download(name, blob) {
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: name }); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function toCSV(rows) {
  if (!rows.length) return "";
  const keys = Object.keys(rows[0]);
  const esc = (v) => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  return [keys.join(","), ...rows.map(r => keys.map(k => esc(r[k])).join(","))].join("\n");
}
function exportJSONBackup() {
  download(`coffee-beats-backup-${new Date().toISOString().slice(0,10)}.json`, new Blob([JSON.stringify(state, null, 2)], { type: "application/json" }));
}
function exportAllCSVZip() {
  // simple concat — zip would need a lib; offer each file
  const files = {
    "items.csv": toCSV(state.items),
    "menu.csv": toCSV(state.menu.map(({ branches, ...rest }) => ({ ...rest, branches: (branches||[]).join("|") }))),
    "snapshots.csv": toCSV(state.snapshots.flatMap(s => s.entries.map(e => ({ snapshot_id: s.id, as_of: s.as_of, created_at: s.created_at, created_by: s.created_by_name||s.created_by, branch: e.branch, item_id: e.item_id, qty: e.qty })))),
    "waste.csv": toCSV(state.waste),
    "assets.csv": toCSV(state.assets || []),
    "purchases_header.csv": toCSV(state.purchases.map(({ lines, ...rest }) => rest)),
    "purchases_lines.csv": toCSV(state.purchases.flatMap(p => p.lines.map(l => ({ purchase_id: p.id, date: p.date, branch: p.branch, supplier: p.supplier, ...l })))),
    "petty_cash.csv": toCSV(state.petty_cash),
    "bank_ledger.csv": toCSV(state.bank_ledger),
    "sales.csv": toCSV(state.sales),
    "users.csv": toCSV(staffDir.all().map(({ uid, name, role, branches, active, legacy_id }) => ({ uid, name, role, active, branches: (branches||[]).join("|"), legacy_id: legacy_id||"", pin: "••••" }))),
  };
  for (const [name, text] of Object.entries(files)) {
    download(name, new Blob([text], { type: "text/csv" }));
  }
  toast(`Exported ${Object.keys(files).length} CSV files`);
}

// ==============================================================
// boot
// ==============================================================
state = loadState();

// Firebase Auth drives the entire session lifecycle.
// onAuthStateChanged fires on every page load and after signIn/signOut.
// Initialize render with a timeout fallback for local development
let authInitialized = false;
const renderTimeout = setTimeout(() => {
  if (!authInitialized) {
    console.warn("Firebase auth timeout - rendering with offline mode");
    render();
  }
}, 3000);

auth.onAuthStateChanged(async fbUser => {
  authInitialized = true;
  clearTimeout(renderTimeout);
  await _resolveAuth(fbUser);
  render();
  if (state._auth) {
    startIdleTimer();
    autoPullOnStart();
  } else {
    stopIdleTimer();
  }
});
