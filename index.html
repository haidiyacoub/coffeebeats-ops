  }

  state.overheads              = state.overheads              || [];
  state.overhead_presets       = state.overhead_presets       || {};
  state.overhead_monthly_amts  = state.overhead_monthly_amts  || {};

  // ─── SECTION 1: Fixed default amounts — both branches, inline edit ───────
  // Kept inside draw() so that typing a new amount re-renders all inputs from
  // state and the "Total overhead" card at the bottom stays in lockstep.
  const fixedWrap = el("div", {});
  wrap.appendChild(fixedWrap);

  function drawFixedCard() {
    fixedWrap.innerHTML = "";
    const fixedCard = el("div", { class: "card", style: { marginTop: "12px" } });
    fixedCard.appendChild(el("div", { style: { display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:"10px" } }, [
      el("div", { class: "muted small", style: { textTransform:"uppercase", letterSpacing:"1px", fontWeight:"700" } }, "Fixed monthly amounts"),
      el("div", { class: "muted small" }, "Edit → press Enter or tap away to save · pushed to Google Sheet instantly"),
    ]));
    const hdr = el("div", { style: {
      display:"grid", gridTemplateColumns:"1fr 1fr 1fr",
      gap:"8px", marginBottom:"10px", fontSize:"12px", fontWeight:"700",
      textTransform:"uppercase", letterSpacing:"0.8px", color:"var(--ink-dim)"
    }});
    hdr.appendChild(el("div", {}, "Category"));
    hdr.appendChild(el("div", { style:{textAlign:"center"} }, "🏠 Maadi (EGP)"));
    hdr.appendChild(el("div", { style:{textAlign:"center"} }, "🏢 Zawya (EGP)"));
    fixedCard.appendChild(hdr);

    for (const cat of OVERHEAD_CATEGORIES.filter(c => c.recurring)) {
      const row = el("div", { style: {
        display:"grid", gridTemplateColumns:"1fr 1fr 1fr",
        gap:"8px", alignItems:"center", paddingBottom:"8px",
        borderBottom:"1px solid var(--border)", marginBottom:"8px"
      }});
      row.appendChild(el("div", { style:{fontWeight:"500", fontSize:"14px"} }, cat.label));
      for (const br of ["maadi","zawya"]) {
        const pk = presetKey(br, cat.value);
        const preset = state.overhead_presets[pk] || {};
        const inp = el("input", {
          type:"number", min:"0", step:"1",
          value: preset.amount != null ? String(preset.amount) : "",
          placeholder:"0",
          style:{ textAlign:"right", padding:"8px 10px", fontSize:"15px", fontWeight:"600" }
        });
        const doSave = () => {
          const amt = Number(inp.value) || 0;
          const s = stamp();
          const before = Number((state.overhead_presets[pk] || {}).amount || 0);
          if (amt === before) return; // no-op — avoid spurious toasts + syncs on blur
          state.overhead_presets[pk] = {
            amount: amt,
            note: (state.overhead_presets[pk] || {}).note || "",
            updated_at: s.at, updated_by: s.by_name
          };
          // Propagate to the CURRENT month's unpaid row (if any). This is what
          // makes editing the fixed amount visibly flow into Section 2. Paid
          // rows are locked — they keep the amount the user actually paid.
          const existing = state.overheads.find(o =>
            o.branch === br && o.category === cat.value &&
            ((o.month || (o.date||"").slice(0,7)) === month));
          if (existing && !existing.paid) existing.amount = amt;
          // Also clear this month's manual override (the new preset is what
          // the user wants; the override was for a different intent).
          delete state.overhead_monthly_amts[monthlyKey(br, cat.value, month)];
          saveState({ immediate: true });
          toast(`${cat.label} · ${br === "maadi" ? "Maadi" : "Zawya"}: saved ${money(amt)}`, "ok");
          draw();
        };
        inp.addEventListener("blur", doSave);
        inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); });
        row.appendChild(inp);
      }
      fixedCard.appendChild(row);
    }
    fixedWrap.appendChild(fixedCard);
  }
  drawFixedCard();

  // ─── SECTION 2: Monthly tracking — both branches in parallel ─────────────
  let month = new Date().toISOString().slice(0,7);
  const monthInput = el("input", {
    type:"month", value:month,
    style:{ padding:"8px", borderRadius:"8px", border:"1px solid var(--border)" }
  });
  monthInput.addEventListener("change", () => { month = monthInput.value; draw(); });

  wrap.appendChild(el("div", { class:"card", style:{ display:"flex", gap:"12px", alignItems:"center", flexWrap:"wrap", marginTop:"12px" } }, [
    el("span", { class:"muted small", style:{fontWeight:"600"} }, "Month"),
    monthInput,
    el("button", { class:"btn secondary", style:{marginLeft:"auto"}, onClick:()=>addOverhead("marketing_fees","maadi") }, "➕ Maadi marketing/misc"),
    el("button", { class:"btn secondary", onClick:()=>addOverhead("marketing_fees","zawya") }, "➕ Zawya marketing/misc"),
  ]));

  const body = el("div", {});
  wrap.appendChild(body);
  draw();
  wrap.appendChild(btnBack());

  function draw() {
    // Re-render Section 1 (fixed preset inputs) so the amounts always reflect
    // the current state — critical when a pull from Sheets replaces preset values.
    drawFixedCard();
    body.innerHTML = "";
    // Two columns: Maadi | Zawya
    const twoCols = el("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"12px", marginTop:"12px" } });
    for (const br of ["maadi","zawya"]) twoCols.appendChild(drawBranchPanel(br));
    body.appendChild(twoCols);
    body.appendChild(drawSalaryCard());
    body.appendChild(drawTotalsCard());
  }

  function drawBranchPanel(br) {
    const panel = el("div", { class:"card" });
    panel.appendChild(el("div", { class:"muted small", style:{ textTransform:"uppercase", letterSpacing:"1px", marginBottom:"10px", fontWeight:"700" } },
      (br === "maadi" ? "🏠 Maadi" : "🏢 Zawya") + ` · ${month}`));

    let panelPaid = 0, panelUnpaid = 0;

    for (const cat of OVERHEAD_CATEGORIES.filter(c => c.recurring)) {
      const pk = presetKey(br, cat.value);
      const mk = monthlyKey(br, cat.value, month);
      const preset = state.overhead_presets[pk] || null;
      const monthlyOverride = state.overhead_monthly_amts[mk] != null ? state.overhead_monthly_amts[mk] : null;
      const existing = state.overheads.find(o =>
        o.branch === br && o.category === cat.value &&
        ((o.month || (o.date||"").slice(0,7)) === month));
      const amount = existing ? Number(existing.amount)
                   : monthlyOverride != null ? Number(monthlyOverride)
                   : (preset ? Number(preset.amount) : 0);
      const isPaid = !!(existing && existing.paid);
      const paidOn = existing ? (existing.paid_on || "") : "";

      if (isPaid) panelPaid += amount; else panelUnpaid += amount;

      const rowDiv = el("div", { style:{ borderBottom:"1px solid var(--border)", paddingBottom:"8px", marginBottom:"8px" } });
      rowDiv.appendChild(el("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center" } }, [
        el("div", { style:{ fontWeight:"500", fontSize:"13px", flex:"1" } }, cat.label),
        el("div", { style:{ fontWeight:"700", fontSize:"14px" } }, money(amount)),
      ]));
      rowDiv.appendChild(el("div", { style:{ display:"flex", gap:"4px", marginTop:"5px", flexWrap:"wrap" } }, [
        el("button", {
          class:"btn " + (isPaid ? "" : "secondary"),
          style:{ fontSize:"12px", padding:"4px 8px", minHeight:"30px" },
          onClick:() => togglePaid(br, cat, preset, existing, monthlyOverride)
        }, isPaid ? `✓ ${paidOn ? paidOn : "Paid"}` : "Mark paid"),
        el("button", {
          class:"btn ghost",
          style:{ fontSize:"12px", padding:"4px 8px", minHeight:"30px", color:"var(--warn)" },
          title:"Override amount for this month only",
          onClick:() => editMonthlyAmount(br, cat, monthlyOverride, mk)
        }, monthlyOverride != null ? "✎ Month" : "↕ Override"),
      ]));
      panel.appendChild(rowDiv);
    }

    // Variable entries (marketing, misc)
    const varRows = state.overheads.filter(o =>
      o.branch === br &&
      ((o.month || (o.date||"").slice(0,7)) === month) &&
      !OVERHEAD_CATEGORIES.find(c => c.value === o.category && c.recurring)
    ).sort((a,b) => (b.at||"").localeCompare(a.at||""));
    if (varRows.length > 0) {
      panel.appendChild(el("div", { class:"muted small", style:{ marginBottom:"4px", fontWeight:"600" } }, "Variable"));
      for (const r of varRows) {
        const catLabel = (OVERHEAD_CATEGORIES.find(c => c.value === r.category)||{}).label || r.category;
        panel.appendChild(el("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center", fontSize:"12px", marginBottom:"4px" } }, [
          el("div", { style:{ flex:"1" } }, `${catLabel}${r.label ? " — "+r.label : ""}`),
          el("div", { style:{ fontWeight:"700", marginRight:"6px" } }, money(r.amount)),
          el("button", { class:"btn ghost", style:{ fontSize:"11px", padding:"2px 6px", minHeight:"22px" }, onClick:() => {
            if (!confirm("Delete this entry?")) return;
            state.overheads = state.overheads.filter(x => x.id !== r.id);
            saveState(); toast("Deleted"); draw();
          }}, "🗑"),
        ]));
        panelPaid += Number(r.amount)||0;
      }
    }

    // Mini totals
    panel.appendChild(el("div", { style:{ borderTop:"1px solid var(--border)", paddingTop:"6px", marginTop:"4px" } }, [
      el("div", { style:{ display:"flex", justifyContent:"space-between", fontWeight:"700", fontSize:"13px" } }, [
        el("span", {}, "Paid this month"),
        el("span", { style:{ color:"var(--ok)" } }, money(panelPaid)),
      ]),
      ...(panelUnpaid > 0 ? [el("div", { style:{ display:"flex", justifyContent:"space-between", fontSize:"12px", marginTop:"3px" } }, [
        el("span", { style:{ color:"var(--warn)" } }, "Outstanding"),
        el("span", { style:{ color:"var(--warn)", fontWeight:"600" } }, money(panelUnpaid)),
      ])] : []),
    ]));
    return panel;
  }

  function drawSalaryCard() {
    const numBranches = 2;
    const allBaristas = state.users.filter(x => x.active && (x.role === "barista" || x.role === "head_barista"));
    const totalSalary = allBaristas.reduce((s, p) => {
      const cfg = (state.salary_config || {})[p.id] || {};
      return s + (Number(cfg.monthly_salary) || 0);
    }, 0);
    const salaryShare = totalSalary > 0 ? Math.round(totalSalary / numBranches) : 0;

    const card = el("div", { class:"card", style:{ marginTop:"12px" } });
    card.appendChild(el("div", { class:"muted small", style:{ textTransform:"uppercase", letterSpacing:"1px", marginBottom:"8px", fontWeight:"700" } },
      `Staff salaries — split equally · ${numBranches} branches`));
    card.appendChild(el("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"8px", alignItems:"center" } }, [
      el("div", {}, [
        el("div", { style:{ fontWeight:"500" } }, "Total all staff"),
        el("div", { class:"muted small" }, `÷ ${numBranches} = ${money(salaryShare)} per branch`),
      ]),
      el("div", { style:{ textAlign:"center", fontWeight:"700", fontSize:"22px" } }, money(totalSalary)),
      el("div", { style:{ textAlign:"right" } }, [
        el("div", { style:{ fontWeight:"700", fontSize:"16px" } }, `🏠 ${money(salaryShare)}`),
        el("div", { style:{ fontWeight:"700", fontSize:"16px" } }, `🏢 ${money(salaryShare)}`),
      ]),
    ]));
    if (allBaristas.length > 0) {
      const detail = el("div", { class:"muted small", style:{ marginTop:"6px", fontSize:"12px" } });
      detail.textContent = allBaristas.map(p => {
        const cfg = (state.salary_config || {})[p.id] || {};
        return `${p.name} ${money(Number(cfg.monthly_salary)||0)}`;
      }).join(" · ");
      card.appendChild(detail);
    }
    return card;
  }

  function drawTotalsCard() {
    const numBranches = 2;
    const allBaristas = state.users.filter(x => x.active && (x.role === "barista" || x.role === "head_barista"));
    const totalSalary = allBaristas.reduce((s, p) => {
      const cfg = (state.salary_config || {})[p.id] || {};
      return s + (Number(cfg.monthly_salary) || 0);
    }, 0);
    const salaryShare = totalSalary > 0 ? Math.round(totalSalary / numBranches) : 0;

    const card = el("div", { class:"card", style:{ marginTop:"12px" } });
    card.appendChild(el("div", { class:"muted small", style:{ textTransform:"uppercase", letterSpacing:"1px", marginBottom:"8px", fontWeight:"700" } },
      `Total overhead per branch · ${month}`));

    const hdrRow = el("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"8px", fontSize:"12px", color:"var(--ink-dim)", fontWeight:"700", marginBottom:"6px" } });
    hdrRow.appendChild(el("div", {}, "Line item"));
    hdrRow.appendChild(el("div", { style:{textAlign:"right"} }, "🏠 Maadi"));
    hdrRow.appendChild(el("div", { style:{textAlign:"right"} }, "🏢 Zawya"));
    card.appendChild(hdrRow);

    // Recurring bills breakdown
    for (const cat of OVERHEAD_CATEGORIES.filter(c => c.recurring)) {
      const vals = ["maadi","zawya"].map(br => {
        const pk = presetKey(br, cat.value);
        const mk = monthlyKey(br, cat.value, month);
        const preset = state.overhead_presets[pk] || null;
        const monthlyOverride = state.overhead_monthly_amts[mk] != null ? state.overhead_monthly_amts[mk] : null;
        const existing = state.overheads.find(o =>
          o.branch === br && o.category === cat.value &&
          ((o.month || (o.date||"").slice(0,7)) === month));
        return existing ? Number(existing.amount)
             : monthlyOverride != null ? Number(monthlyOverride)
             : (preset ? Number(preset.amount) : 0);
      });
      card.appendChild(el("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"8px", fontSize:"13px", paddingBottom:"4px" } }, [
        el("div", {}, cat.label),
        el("div", { style:{textAlign:"right"} }, money(vals[0])),
        el("div", { style:{textAlign:"right"} }, money(vals[1])),
      ]));
    }
    // Variable
    const varMaadi = state.overheads.filter(o => o.branch==="maadi" && ((o.month||(o.date||"").slice(0,7))===month) && !OVERHEAD_CATEGORIES.find(c=>c.value===o.category&&c.recurring)).reduce((s,o)=>s+(Number(o.amount)||0),0);
    const varZawya = state.overheads.filter(o => o.branch==="zawya" && ((o.month||(o.date||"").slice(0,7))===month) && !OVERHEAD_CATEGORIES.find(c=>c.value===o.category&&c.recurring)).reduce((s,o)=>s+(Number(o.amount)||0),0);
    if (varMaadi || varZawya) {
      card.appendChild(el("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"8px", fontSize:"13px", paddingBottom:"4px" } }, [
        el("div", { style:{color:"var(--ink-dim)"} }, "Variable"),
        el("div", { style:{textAlign:"right"} }, money(varMaadi)),
        el("div", { style:{textAlign:"right"} }, money(varZawya)),
      ]));
    }
    // Salary
    card.appendChild(el("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"8px", fontSize:"13px", paddingBottom:"4px", borderTop:"1px solid var(--border)", paddingTop:"6px", marginTop:"4px" } }, [
      el("div", {}, "Staff salary share"),
      el("div", { style:{textAlign:"right"} }, money(salaryShare)),
      el("div", { style:{textAlign:"right"} }, money(salaryShare)),
    ]));
    // Grand total
    const maadiBills = ["maadi"].reduce((s, br) =>
      s + OVERHEAD_CATEGORIES.filter(c=>c.recurring).reduce((ss, cat) => {
        const mk = monthlyKey(br, cat.value, month);
        const pk = presetKey(br, cat.value);
        const ex = state.overheads.find(o=>o.branch===br&&o.category===cat.value&&((o.month||(o.date||"").slice(0,7))===month));
        const ov = state.overhead_monthly_amts[mk];
        return ss + (ex ? Number(ex.amount) : ov != null ? Number(ov) : Number((state.overhead_presets[pk]||{}).amount||0));
      }, 0), 0);
    const zawyaBills = ["zawya"].reduce((s, br) =>
      s + OVERHEAD_CATEGORIES.filter(c=>c.recurring).reduce((ss, cat) => {
        const mk = monthlyKey(br, cat.value, month);
        const pk = presetKey(br, cat.value);
        const ex = state.overheads.find(o=>o.branch===br&&o.category===cat.value&&((o.month||(o.date||"").slice(0,7))===month));
        const ov = state.overhead_monthly_amts[mk];
        return ss + (ex ? Number(ex.amount) : ov != null ? Number(ov) : Number((state.overhead_presets[pk]||{}).amount||0));
      }, 0), 0);
    card.appendChild(el("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"8px", fontSize:"14px", fontWeight:"700", borderTop:"1px solid var(--border)", paddingTop:"6px", marginTop:"4px" } }, [
      el("div", {}, "Total overhead"),
      el("div", { style:{textAlign:"right", color:"var(--ok)"} }, money(maadiBills + varMaadi + salaryShare)),
      el("div", { style:{textAlign:"right", color:"var(--ok)"} }, money(zawyaBills + varZawya + salaryShare)),
    ]));
    return card;
  }

  function editMonthlyAmount(br, cat, current, mk) {
    openPrompt({
      title: `${cat.label} (${br === "maadi" ? "Maadi" : "Zawya"}) — override for ${month}`,
      fields: [
        { key: "amount", label: `Amount for ${month} only (EGP)`, type: "number", value: current != null ? current : (state.overhead_presets[presetKey(br, cat.value)]?.amount || 0) },
        { key: "clear",  label: "Clear override (use default amount)", type: "select", options: [{ label: "No — keep this amount", value: "no" }, { label: "Yes — revert to default", value: "yes" }], value: "no" },
      ],
      onSubmit: (vals) => {
        if (vals.clear === "yes") {
          delete state.overhead_monthly_amts[mk];
          saveState(); toast(`${cat.label}: reverted to default`); draw();
          return;
        }
        const amt = Number(vals.amount);
        if (amt < 0) return toast("Amount must be ≥ 0", "error");
        state.overhead_monthly_amts[mk] = amt;
        saveState(); toast(`${cat.label} (${br}): ${month} set to ${money(amt)}`); draw();
      }
    });
  }

  function togglePaid(br, cat, preset, existing, monthlyOverride) {
    if (existing && existing.paid) {
      existing.paid = false; existing.paid_on = "";
      saveState(); toast(`${cat.label}: unmarked`); draw();
      return;
    }
    const defaultAmount = existing ? Number(existing.amount)
                        : monthlyOverride != null ? Number(monthlyOverride)
                        : (preset ? Number(preset.amount) : 0);
    if (defaultAmount <= 0) {
      toast(`Set a fixed amount for ${cat.label} (${br}) first — edit the number at the top`, "error");
      return;
    }
    openPrompt({
      title: `Mark paid — ${cat.label} (${br === "maadi" ? "Maadi" : "Zawya"})`,
      fields: [
        { key: "amount",  label: "Amount paid (EGP)", type: "number", value: defaultAmount },
        { key: "paid_on", label: "Paid on (date)", type: "date", value: new Date().toISOString().slice(0,10) },
        { key: "note",    label: "Note", type: "text", value: existing?.note || preset?.note || "" },
      ],
      onSubmit: (vals) => {
        const amt = Number(vals.amount) || 0;
        if (amt <= 0) return toast("Enter a positive amount", "error");
        const s = stamp();
        if (existing) {
          existing.amount = amt;
          existing.paid = true;
          existing.paid_on = vals.paid_on;
          existing.note = vals.note || existing.note || "";
          existing.by = s.by; existing.by_name = s.by_name; existing.at = s.at;
        } else {
          state.overheads.push({
            id: uuid(),
            branch: br, category: cat.value,
            label: "",
            amount: amt,
            month,
            date: vals.paid_on,
            paid: true,
            paid_on: vals.paid_on,
            note: vals.note || "",
            by: s.by, by_name: s.by_name, at: s.at,
          });
        }
        saveState(); toast(`${cat.label} marked paid`); draw();
      }
    });
  }

  function addOverhead(defaultCat, defaultBranch) {
    const catOptions = OVERHEAD_CATEGORIES.filter(c => !c.recurring)
      .map(c => ({ label: c.label, value: c.value }));
    const branchOptions = [{ label: "🏠 Maadi", value: "maadi" }, { label: "🏢 Zawya", value: "zawya" }];
    openPrompt({
      title: "Log variable overhead",
      fields: [
        { key: "branch",   label: "Branch", type: "select", options: branchOptions, value: defaultBranch || "maadi" },
        { key: "category", label: "Category", type: "select", options: catOptions, value: defaultCat || "marketing_fees" },
        { key: "label",    label: "Describe (required for Miscellaneous)", type: "text", value: "" },
        { key: "amount",   label: "Amount (EGP)", type: "number", value: 0 },
        { key: "date",     label: "Date", type: "date", value: new Date().toISOString().slice(0,10) },
        { key: "note",     label: "Note", type: "text", value: "" },
      ],
      onSubmit: (vals) => {
        const amt = Number(vals.amount) || 0;
        if (amt <= 0) return toast("Enter a positive amount", "error");
        if (vals.category === "misc" && !(vals.label || "").trim()) {
          return toast("Please describe the miscellaneous item", "error");
        }
        const s = stamp();
        state.overheads.push({
          id: uuid(),
          branch: vals.branch, category: vals.category,
          label: (vals.label || "").trim(),
          amount: amt,
          month,
          date: vals.date,
          paid: true,
          paid_on: vals.date,
          note: vals.note || "",
          by: s.by, by_name: s.by_name, at: s.at,
        });
        saveState(); toast("Entry saved"); draw();
      }
    });
  }

  return wrap;
};

// ==============================================================
// BANK LEDGER (owner)
// ==============================================================
routes.bank = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Bank ledger (owner)", "Every owner-paid purchase + petty cash top-ups."));
  const rows = state.bank_ledger.slice().sort((a,b) => b.at.localeCompare(a.at)).slice(0, 200);
  const total = rows.reduce((s,r) => s + (Number(r.amount)||0), 0);
  wrap.appendChild(el("div", { class: "card" }, [
    el("div", { class: "muted" }, "Net outflow (last 200 entries)"),
    el("div", { style: { fontSize: "26px", fontWeight: "700" } }, money(total)),
  ]));
  wrap.appendChild(el("button", { class: "btn secondary", style: { marginTop:"12px" }, onClick: addManualBank }, "➕ Log manual bank entry"));
  const list = el("div", { class: "list" });
  for (const r of rows) {
    list.appendChild(el("div", { class: "row" }, [
      el("div", { class: "grow" }, [
        el("div", { class: "title" }, `${r.supplier} — ${money(r.amount)}`),
        el("div", { class: "sub" }, `${r.date} · ${r.type}${r.note?` · ${r.note}`:""}`),
        el("div", { class: "sub" }, `by ${r.by_name} · ${fmtDate(r.at)}`),
      ]),
    ]));
  }
  if (rows.length === 0) list.appendChild(el("div", { class: "muted" }, "No entries yet."));
  wrap.appendChild(list);
  wrap.appendChild(btnBack());
  function addManualBank() {
    openPrompt({
      title: "Manual bank entry",
      fields: [
        { key: "date", label: "Date", type: "date", value: new Date().toISOString().slice(0,10) },
        { key: "supplier", label: "Payee", type: "text", value: "" },
        { key: "amount", label: "Amount (positive inflow, negative outflow)", type: "number", value: 0 },
        { key: "note", label: "Note", type: "text", value: "" },
      ],
      onSubmit: (v) => {
        const amt = Number(v.amount); if (!amt) return toast("Amount required", "error");
        const s = stamp();
        state.bank_ledger.push({ id: uuid(), date: v.date, amount: amt, supplier: v.supplier, type: "manual", by: s.by, by_name: s.by_name, at: s.at, note: v.note });
        saveState(); toast("Saved"); render();
      }
    });
  }
  return wrap;
};

// ==============================================================
// SALES IMPORT
// ==============================================================
routes.sales_import = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Upload monthly POS sales", "CSV from Foodics / your POS. We match items by name or SKU."));

  wrap.appendChild(el("div", { class: "banner-arch" },
    "Pick a branch, pick a month (used if the CSV has no date column or dates can't be parsed), then upload the CSV. " +
    "When the branch is ZAWYA, Popcorn, Soft Drinks, Snacks and Merchandise are auto-removed."));

  let branchDefault = "maadi";
  const branchPicker = makeBranchPicker(["maadi","zawya"], () => branchDefault, b => { branchDefault = b; });
  wrap.appendChild(branchPicker);

  // ---- Month override (used when dates are missing or unparseable) ----
  const monthFallback = el("input", {
    type: "month",
    value: new Date().toISOString().slice(0,7),
    style: { padding: "8px", borderRadius: "8px", border: "1px solid var(--border)" }
  });
  wrap.appendChild(el("div", { class: "card", style: { display: "flex", gap: "12px", alignItems: "center", flexWrap: "wrap" } }, [
    el("div", { class: "muted small" }, "Fallback month (used if CSV rows have no parseable date)"),
    monthFallback,
    el("label", { style: { display: "flex", gap: "6px", alignItems: "center", marginLeft: "12px" } }, [
      (() => {
        const cb = el("input", { type: "checkbox" });
        cb.id = "_salesForceMonth";
        return cb;
      })(),
      el("span", { class: "muted small" }, "Force ALL rows into the fallback month (ignore CSV dates)"),
    ]),
  ]));

  const fInput = el("input", { type: "file", accept: ".csv,text/csv,.txt" });
  wrap.appendChild(fInput);

  // Running state-of-the-world card — always visible so the owner can see what's loaded right now
  const stateCard = el("div", { class: "card", style: { marginTop: "12px", borderColor: "var(--accent)" } });
  wrap.appendChild(stateCard);
  renderStateCard();

  function renderStateCard() {
    stateCard.innerHTML = "";
    stateCard.appendChild(el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } }, "Sales already in the app"));
    const byKey = new Map();
    for (const s of state.sales) {
      const br = (s.branch || "").toLowerCase();
      const m = (s.date || "").slice(0,7);
      const k = br + "|" + m;
      byKey.set(k, (byKey.get(k) || 0) + 1);
    }
    const combos = [...byKey.entries()].map(([k,n]) => { const [b,m] = k.split("|"); return { b, m, n }; })
      .sort((a,b) => (b.m||"").localeCompare(a.m||""));
    stateCard.appendChild(el("div", { style: { fontSize: "22px", fontWeight: "700" } }, `${state.sales.length} rows total`));
    if (combos.length === 0) {
      stateCard.appendChild(el("div", { class: "muted small" }, "No sales in the app yet."));
    } else {
      const pills = el("div", { style: { display: "flex", flexWrap: "wrap", gap: "6px", marginTop: "8px" } });
      for (const c of combos.slice(0, 24)) {
        pills.appendChild(el("span", { class: "chip" }, `${c.b || "?"} · ${c.m || "?"} (${c.n})`));
      }
      stateCard.appendChild(pills);
    }
    if (u.role === "owner" && state.sales.length > 0) {
      stateCard.appendChild(el("button", { class: "btn ghost", style: { marginTop: "12px" }, onClick: () => {
        if (!confirm(`Delete all ${state.sales.length} sales rows? This can't be undone.`)) return;
        state.sales = [];
        saveState();
        toast("All sales cleared");
        render();
      }}, "🗑 Clear ALL sales (owner only)"));
    }
  }

  const preview = el("div", { class: "card", style: { marginTop: "14px", display: "none" } });
  wrap.appendChild(preview);
  let parsed = null;
  let parseContext = null;

  fInput.addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    const text = await f.text();
    const forceMonth = $("#_salesForceMonth")?.checked || false;
    parsed = parseSalesCSV(text, branchDefault, monthFallback.value, forceMonth);
    parseContext = { filename: f.name, forceMonth, fallback: monthFallback.value };
    renderPreview();
  });

  function renderPreview() {
    preview.style.display = "block";
    preview.innerHTML = "";
    preview.appendChild(el("h2", {}, `Preview — ${parsed.rows.length} rows`));

    // --- Column mapping diagnostic (so you can see what auto-detect found) ---
    const mapCard = el("div", { class: "card" });
    mapCard.appendChild(el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } }, "Column mapping"));
    const mapList = el("div", {});
    const labels = { date: "Date", item: "Item", sku: "SKU", qty: "Qty", net: "Net Sales", gross: "Gross Sales", disc: "Discount (total)", disc_unit: "Discount per unit", disc_name: "Discount type", type: "Row type", cat: "Category", branch: "Branch" };
    for (const [key, idx] of Object.entries(parsed.mapping)) {
      mapList.appendChild(el("div", { class: "kv" }, [
        el("div", { class: "k" }, labels[key] || key),
        el("div", { class: "v", style: { color: idx < 0 ? "var(--bad)" : "var(--ok)" } },
          idx < 0 ? "— not found —" : `[col ${idx}] "${parsed.headerRaw[idx]}"`),
      ]));
    }
    mapCard.appendChild(mapList);
    mapCard.appendChild(el("div", { class: "muted small", style: { marginTop: "6px" } },
      `Headers seen: ${parsed.headerRaw.slice(0, 14).map(h => `"${h}"`).join(", ")}${parsed.headerRaw.length > 14 ? ` … (+${parsed.headerRaw.length - 14} more)` : ""}`));
    preview.appendChild(mapCard);

    // Optional manual override ui for critical columns
    if (parsed.mapping.date < 0 || parsed.mapping.item < 0 || parsed.mapping.qty < 0) {
      const override = el("div", { class: "card", style: { borderColor: "var(--bad)" } });
      override.appendChild(el("div", { class: "muted small" }, "Pick the right column if auto-detect missed one:"));
      const pickers = {};
      for (const key of ["date","item","sku","qty","net","gross","branch","cat"]) {
        const sel = el("select", {}, [
          el("option", { value: "-1" }, `— ${labels[key]}: not set —`),
          ...parsed.headerRaw.map((h,i) => el("option", { value: String(i), ...(parsed.mapping[key] === i ? { selected: true } : {}) }, `${i}: ${h}`)),
        ]);
        pickers[key] = sel;
        override.appendChild(el("label", { style: { display: "block", marginTop: "4px" } }, [ labels[key] + ": ", sel ]));
      }
      override.appendChild(el("button", { class: "btn secondary", style: { marginTop: "8px" }, onClick: () => {
        const newMap = {};
        for (const k of Object.keys(pickers)) newMap[k] = Number(pickers[k].value);
        parsed = parseSalesCSVFromMapping(parsed.rawLines, parsed.headerRaw, branchDefault, monthFallback.value, $("#_salesForceMonth")?.checked, newMap);
        renderPreview();
      }}, "Re-parse with my column choices"));
      preview.appendChild(override);
    }

    // --- Row-summary diagnostic ---
    const info = [];
    info.push(`${parsed.rows.length} kept`);
    if (parsed.droppedZawya)    info.push(`${parsed.droppedZawya} Zawya exclusions removed`);
    if (parsed.droppedModifier) info.push(`${parsed.droppedModifier} modifier option rows skipped`);
    if (parsed.droppedNoItem)   info.push(`${parsed.droppedNoItem} rows had no item`);
    if (parsed.usedFallbackDate) info.push(`${parsed.usedFallbackDate} rows used the fallback month (no parseable date)`);
    if (parsed.warnings.length) info.push(parsed.warnings.join(" · "));
    preview.appendChild(el("div", { class: "muted small" }, info.join(" · ")));

    // Per-month bucket
    const byMonth = new Map();
    for (const r of parsed.rows) {
      const m = (r.date || "").slice(0,7);
      byMonth.set(m, (byMonth.get(m) || 0) + 1);
    }
    const monthBreak = el("div", { style: { display: "flex", gap: "6px", flexWrap: "wrap", marginTop: "8px" } });
    for (const [m, n] of [...byMonth.entries()].sort()) {
      monthBreak.appendChild(el("span", { class: "chip" }, `${m || "no-date"} · ${n}`));
    }
    preview.appendChild(monthBreak);

    const tbl = el("table", {}, [
      el("thead", {}, el("tr", {}, ["Date","Item","SKU","Qty","Net","Gross","Branch"].map(h => el("th", {}, h)))),
      el("tbody", {}, parsed.rows.slice(0, 30).map(r => el("tr", {}, [
        el("td", {}, r.date || ""), el("td", {}, r.item || ""), el("td", {}, r.sku || ""),
        el("td", { class: "num" }, String(r.qty)), el("td", { class: "num" }, money(r.net)), el("td", { class: "num" }, money(r.gross)),
        el("td", {}, r.branch || ""),
      ]))),
    ]);
    preview.appendChild(tbl);
    preview.appendChild(el("button", { class: "btn", style: { marginTop: "12px" }, onClick: () => commit() }, `Import ${parsed.rows.length} rows`));
  }

  function commit() {
    if (!parsed || parsed.rows.length === 0) return toast("Nothing to import", "error");
    const s = stamp();
    const batch = uuid();
    const importedBranches = new Set();
    const importedMonths = new Set();
    for (const r of parsed.rows) {
      // Canonicalize branch at write time so dashboard filters always match
      const br = (String(r.branch || branchDefault).toLowerCase().includes("zawya")) ? "zawya"
               : (String(r.branch || branchDefault).toLowerCase().includes("maadi")) ? "maadi"
               : String(r.branch || branchDefault).toLowerCase();
      state.sales.push({
        id: uuid(), batch, at: s.at, by: s.by, by_name: s.by_name, device: s.device,
        branch: br,
        date: r.date, item: r.item, sku: r.sku, qty: r.qty,
        gross_sales: r.gross, net_sales: r.net, discount: r.discount, discount_name: r.discount_name || "",
        category: r.category,
      });
      importedBranches.add(br);
      if (r.date && r.date.length >= 7) importedMonths.add(r.date.slice(0,7));
    }
    saveState();
    const branchList = [...importedBranches].join(", ") || branchDefault;
    const monthList = [...importedMonths].sort().join(", ") || "—";
    toast(`✓ Imported ${parsed.rows.length} rows · branches: ${branchList} · months: ${monthList}`);
    // Jump to dashboard focused on the first imported combo so the data is visible immediately.
    const targetMonth = [...importedMonths].sort().pop() || monthFallback.value;
    const targetBranch = importedBranches.has(branchDefault) ? branchDefault : ([...importedBranches][0] || branchDefault);
    go("dashboard", { month: targetMonth, branch: targetBranch });
  }

  wrap.appendChild(btnBack());
  return wrap;
};

// ---- CSV helpers (shared) ----
function _csvParseLine(ln) {
  const out = []; let cur = ""; let q = false;
  for (let i=0; i<ln.length; i++) {
    const c = ln[i];
    if (q) {
      if (c === '"' && ln[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else {
      if (c === '"') q = true;
      else if (c === ',') { out.push(cur); cur = ""; }
      else cur += c;
    }
  }
  out.push(cur); return out;
}

function _salesHeaderMap(headerLower) {
  const col = (names) => { for (const n of names) { const idx = headerLower.indexOf(n); if (idx !== -1) return idx; } return -1; };
  // Wide alias list covering Foodics (new format), Square, generic POS exports, and minor naming drift
  return {
    date:      col(["business_date","date","business date","day","order date","transaction date","sales date","sold at","created","created at","time","timestamp","datetime","business day"]),
    item:      col(["item","name","product","item name","product name","menu item","menu item name","description","sku name"]),
    sku:       col(["sku","item id","product sku","item sku","menu item sku","barcode","code"]),
    qty:       col(["quantity","qty","net quantity","sold qty","sold quantity","items sold","count","units","units sold","item qty"]),
    net:       col(["net sales","net","net_sales","net amount","net revenue","total net","net total","net sale"]),
    gross:     col(["total_price","gross sales","gross","gross_sales","gross amount","gross revenue","total gross","gross total","subtotal","sales","revenue","total"]),
    disc:      col(["discount","total discount","discounts","disc","discount total"]),           // pre-totalled discount (old POS formats)
    disc_unit: col(["discount_amount","discount amount"]),                                       // per-unit discount — new Foodics format col O
    disc_name: col(["discount_name","discount type","discount name","promotion","promo type"]),  // discount label — new Foodics format col P
    type:      col(["type"]),                                                                    // "Product" vs "Modifier Option" — new Foodics format col D
    cat:       col(["category","cat","group","menu group","item category","product category","category name","section"]),
    branch:    col(["branch_name","branch","branch name","store","location","outlet","shop","site"]),
  };
}

function parseSalesCSV(text, defaultBranch, fallbackMonth, forceFallback) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const lines = text.split(/\r?\n/).filter(ln => ln.trim() !== "");
  if (lines.length === 0) return { rows: [], warnings: ["empty file"], droppedZawya: 0, droppedNoItem: 0, droppedModifier: 0, usedFallbackDate: 0, mapping: {}, headerRaw: [], rawLines: [] };
  const headerRaw = _csvParseLine(lines[0]).map(h => h.replace(/^\uFEFF/, "").trim());
  const headerLower = headerRaw.map(h => h.toLowerCase());
  const mapping = _salesHeaderMap(headerLower);
  return parseSalesCSVFromMapping(lines, headerRaw, defaultBranch, fallbackMonth, forceFallback, mapping);
}

function parseSalesCSVFromMapping(lines, headerRaw, defaultBranch, fallbackMonth, forceFallback, mapping) {
  const rows = [];
  const c = mapping;
  const warns = [];
  if (c.item < 0) warns.push("no item column mapped");
  if (c.qty < 0)  warns.push("no qty column mapped (qty will default to 1 per row)");
  if (c.date < 0) warns.push(`no date column mapped — using fallback month ${fallbackMonth}`);

  const normalizeBranch = (raw) => {
    const s = String(raw || "").trim().toLowerCase();
    if (!s) return defaultBranch;
    if (s.includes("zawya")) return "zawya";
    if (s.includes("maadi")) return "maadi";
    return defaultBranch;
  };

  const fbMonth = (fallbackMonth && /^\d{4}-\d{2}$/.test(fallbackMonth)) ? fallbackMonth : new Date().toISOString().slice(0,7);
  const fbDate = fbMonth + "-15"; // mid-month placeholder

  let droppedZawya = 0, droppedNoItem = 0, droppedModifier = 0, usedFallbackDate = 0;
  for (let i = 1; i < lines.length; i++) {
    const r = _csvParseLine(lines[i]);
    if (r.length < 1) continue;
    const toNum = (x) => { const n = Number(String(x||"").replace(/[,\s]/g,"")); return isNaN(n) ? 0 : n; };

    // Skip Modifier Option rows (milk/flavour add-ons in new Foodics format — not standalone products)
    if (c.type >= 0 && String(r[c.type] || "").trim() === "Modifier Option") { droppedModifier++; continue; }

    const rawDate = c.date >= 0 ? r[c.date] : "";
    const branch = c.branch >= 0 ? normalizeBranch(r[c.branch]) : defaultBranch;
    const category = c.cat >= 0 ? r[c.cat] : "";
    const item = c.item >= 0 ? String(r[c.item] || "").trim() : "";

    // Drop rows with no item (they're usually summary rows POSes include at the bottom)
    if (!item) { droppedNoItem++; continue; }

    // Branch exclusions for Zawya
    const isZawyaRow = branch === "zawya" || defaultBranch === "zawya";
    if (isZawyaRow && isZawyaExcluded(category, item)) { droppedZawya++; continue; }

    // Date handling — use fallback if we can't parse, or if the user forced it
    let dateIso = "";
    if (forceFallback) {
      dateIso = fbDate;
      usedFallbackDate++;
    } else {
      const parsed = normalizeDate(rawDate);
      if (parsed && /^\d{4}-\d{2}-\d{2}$/.test(parsed)) {
        dateIso = parsed;
      } else {
        dateIso = fbDate;
        usedFallbackDate++;
      }
    }

    const qty   = c.qty   >= 0 ? toNum(r[c.qty])   : 1;
    const gross = c.gross >= 0 ? toNum(r[c.gross])  : 0;

    // Discount: new Foodics format has per-unit amount (col O, disc_unit) → multiply by qty
    //           old POS formats have a pre-totalled discount column (disc) → use as-is
    let discount = 0;
    if      (c.disc_unit >= 0) discount = toNum(r[c.disc_unit]) * qty;
    else if (c.disc      >= 0) discount = toNum(r[c.disc]);
    else if (c.net       >= 0) discount = Math.max(0, gross - toNum(r[c.net]));

    const net           = c.net      >= 0 ? toNum(r[c.net]) : Math.max(0, gross - discount);
    const discount_name = c.disc_name >= 0 ? String(r[c.disc_name] || "").replace(/^-$/, "").trim() : "";

    rows.push({
      date: dateIso,
      item,
      sku: c.sku >= 0 ? String(r[c.sku] || "").trim() : "",
      qty,
      net,
      gross,
      discount,
      discount_name,
      category,
      branch,
    });
  }

  return { rows, warnings: warns, droppedZawya, droppedNoItem, droppedModifier, usedFallbackDate, mapping, headerRaw, rawLines: lines };
}

// ==============================================================
// WEEKLY ROSTER — head barista publishes; everyone reads.
// Each roster row = { id, week_of (Mon YYYY-MM-DD), branch, shift (morning/night),
// day (mon..sun), user_id, user_name, by, by_name, at, photo_id? }.
// Head barista + owner edit; everyone else reads.
// ==============================================================
function mondayOf(dateStr) {
  const d = dateStr ? new Date(dateStr) : new Date();
  // JS: Sunday=0, Monday=1, ..., Saturday=6. Shift so Monday is start.
  const dow = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dow);
  return d.toISOString().slice(0, 10);
}
const ROSTER_DAYS = ["mon","tue","wed","thu","fri","sat","sun"];
const ROSTER_DAY_LABELS = { mon:"Mon", tue:"Tue", wed:"Wed", thu:"Thu", fri:"Fri", sat:"Sat", sun:"Sun" };
const ROSTER_SHIFTS = ["morning","night"];

routes.roster = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Weekly schedule", "Morning & night shifts for Maadi and Zawya."));

  state.rosters = state.rosters || [];
  const canEdit = (u.role === "owner" || u.role === "head_barista");

  let weekOf = mondayOf(new Date().toISOString().slice(0,10));

  const weekPicker = el("input", { type: "date", value: weekOf });
  weekPicker.addEventListener("input", () => { weekOf = mondayOf(weekPicker.value); draw(); });
  wrap.appendChild(el("label", {}, "Week starting (we snap to Monday)"));
  wrap.appendChild(weekPicker);

  const body = el("div", { class: "stack" });
  wrap.appendChild(body);

  function rosterEntry(branch, shift, day) {
    return state.rosters.find(r => r.week_of === weekOf && r.branch === branch && r.shift === shift && r.day === day);
  }
  function setRosterEntry(branch, shift, day, user) {
    const s = stamp();
    const existing = rosterEntry(branch, shift, day);
    if (!user) {
      if (existing) state.rosters = state.rosters.filter(r => r.id !== existing.id);
    } else if (existing) {
      existing.user_id = user.id; existing.user_name = user.name;
      existing.by = s.by; existing.by_name = s.by_name; existing.at = s.at;
    } else {
      state.rosters.push({
        id: uuid(), week_of: weekOf, branch, shift, day,
        user_id: user.id, user_name: user.name,
        by: s.by, by_name: s.by_name, at: s.at,
      });
    }
    saveState();
  }

  function draw() {
    body.innerHTML = "";
    if (canEdit) {
      body.appendChild(el("div", { class: "banner-arch" },
        "Head barista/owner: assign baristas per day. Each day shows Maadi Morning, Maadi Night, Zawya Morning, Zawya Night. Changes save instantly."));
    } else {
      body.appendChild(el("div", { class: "banner-arch" }, "Read-only — your weekly schedule. Ask the head barista if anything looks off."));
    }

    const staff = state.users.filter(x => x.active && (x.role === "barista" || x.role === "head_barista"));

    // Helper: get approved-leave user IDs for a specific calendar date
    function onLeaveIds(dateStr) {
      return (state.leaves || [])
        .filter(l => l.status === "approved" && dateStr >= l.from_date && dateStr <= l.to_date)
        .map(l => l.user_id);
    }

    // Week start as a Date (weekOf is a Monday ISO string)
    const weekStart = new Date(weekOf + "T00:00:00");

    // Group by DAY → then branch+shift (Mon → Maadi Morning / Night, Zawya Morning / Night)
    for (let di = 0; di < ROSTER_DAYS.length; di++) {
      const day = ROSTER_DAYS[di];
      // Compute the actual calendar date for this roster day
      const dayDate = new Date(weekStart);
      dayDate.setDate(dayDate.getDate() + di);
      const dayDateStr = dayDate.toISOString().slice(0, 10);
      const onLeave = onLeaveIds(dayDateStr);

      const card = el("div", { class: "card", style: { marginTop: "10px" } });
      const dayHdr = el("h2", { style: { display: "flex", alignItems: "center", gap: "8px" } });
      dayHdr.appendChild(document.createTextNode(ROSTER_DAY_LABELS[day]));
      dayHdr.appendChild(el("span", { class: "muted small", style: { fontWeight: "400" } }, dayDateStr));
      if (onLeave.length) {
        const names = onLeave.map(id => { const s = staff.find(x => x.id === id); return s ? s.name : id; });
        dayHdr.appendChild(el("span", { class: "pill warn", style: { color: "var(--warn)", fontSize: "11px" } }, `🌴 On leave: ${names.join(", ")}`));
      }
      card.appendChild(dayHdr);

      // Build options: exclude staff on approved leave for this day
      const dayStaff = staff.filter(s => !onLeave.includes(s.id));
      const staffOptions = [["","— empty —"], ...dayStaff.map(s => [s.id, s.name])];

      for (const branch of ["maadi","zawya"]) {
        const branchLabel = branch[0].toUpperCase() + branch.slice(1);
        card.appendChild(el("div", { class: "muted small", style: { textTransform:"uppercase", letterSpacing:"1px", marginTop: "8px", marginBottom: "4px" } }, branchLabel));
        for (const shift of ROSTER_SHIFTS) {
          const entry = rosterEntry(branch, shift, day);
          const shiftLabel = shift[0].toUpperCase() + shift.slice(1);
          const row = el("div", { class: "kv", style: { alignItems: "center" } });
          row.appendChild(el("div", { class: "k", style: { minWidth: "80px" } }, shiftLabel));
          if (canEdit) {
            // If the currently-assigned person is on approved leave, show a warning
            const assignedOnLeave = entry && onLeave.includes(entry.user_id);
            const sel = el("select", { style: assignedOnLeave ? { borderColor: "var(--bad)" } : {} });
            for (const [val, lab] of staffOptions) {
              const o = el("option", { value: val }, lab);
              if (entry && entry.user_id === val) o.selected = true;
              sel.appendChild(o);
            }
            // If assigned person is now on leave, add them as a disabled option with warning
            if (assignedOnLeave) {
              const warnOpt = el("option", { value: entry.user_id, selected: "true", style: { color: "var(--bad)" } },
                `⚠ ${entry.user_name} (ON LEAVE — reassign!)`);
              sel.insertBefore(warnOpt, sel.children[1] || null);
            }
            sel.addEventListener("change", () => {
              // Block assigning someone on leave
              if (onLeave.includes(sel.value)) {
                toast("This barista has approved leave on this day — cannot assign them.", "error");
                sel.value = entry ? entry.user_id : "";
                return;
              }
              const user = staff.find(s => s.id === sel.value) || null;
              setRosterEntry(branch, shift, day, user);
              toast(`${ROSTER_DAY_LABELS[day]} · ${branchLabel} · ${shiftLabel} → ${user ? user.name : "empty"}`);
            });
            const cellWrap = el("div", { class: "v" }, [sel]);
            if (assignedOnLeave) {
              cellWrap.appendChild(el("div", { style: { fontSize: "11px", color: "var(--bad)", marginTop: "3px" } },
                "⚠ On approved leave — please reassign"));
            }
            row.appendChild(cellWrap);
          } else {
            const isOnLeave = entry && onLeave.includes(entry.user_id);
            row.appendChild(el("div", { class: "v", style: isOnLeave ? { color: "var(--bad)" } : {} },
              entry ? (isOnLeave ? `${entry.user_name} 🌴` : entry.user_name) : "—"));
          }
          card.appendChild(row);
        }
      }
      body.appendChild(card);
    }

    // Weekly summary — so baristas can scan who's on when
    const summary = el("div", { class: "card", style: { marginTop: "10px" } });
    summary.appendChild(el("h2", {}, `Summary — week of ${weekOf}`));
    const myId = u.id;
    const mine = state.rosters.filter(r => r.week_of === weekOf && r.user_id === myId);
    if (mine.length) {
      summary.appendChild(el("div", { class: "muted small" }, `Your shifts (${u.name}):`));
      for (const m of mine) {
        summary.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, `${ROSTER_DAY_LABELS[m.day]} · ${m.branch} · ${m.shift}`),
          el("div", { class: "v" }, fmtDate(m.at)),
        ]));
      }
    } else {
      summary.appendChild(el("div", { class: "muted small" }, "You have no shifts assigned this week."));
    }
    body.appendChild(summary);

    if (canEdit) {
      body.appendChild(el("div", { class: "btn-row", style: { marginTop: "10px" } }, [
        el("button", { class: "btn ghost", onClick: () => {
          if (!confirm(`Clear ALL schedule entries for the week of ${weekOf}?`)) return;
          state.rosters = state.rosters.filter(r => r.week_of !== weekOf);
          saveState(); toast("Week cleared"); draw();
        } }, "🗑 Clear this week"),
        el("button", { class: "btn ghost", onClick: () => {
          // Copy last week's roster to this week
          const prev = new Date(weekOf); prev.setDate(prev.getDate() - 7);
          const prevKey = prev.toISOString().slice(0,10);
          const src = state.rosters.filter(r => r.week_of === prevKey);
          if (!src.length) return toast("No schedule found for last week", "error");
          for (const r of src) {
            const exists = rosterEntry(r.branch, r.shift, r.day);
            if (!exists) {
              const s = stamp();
              state.rosters.push({
                id: uuid(), week_of: weekOf, branch: r.branch, shift: r.shift, day: r.day,
                user_id: r.user_id, user_name: r.user_name,
                by: s.by, by_name: s.by_name, at: s.at,
              });
            }
          }
          saveState(); toast(`Copied ${src.length} entries from ${prevKey}`); draw();
        } }, "📋 Copy last week"),
      ]));
    }
  }
  draw();
  wrap.appendChild(btnBack());
  return wrap;
};

// ROASTER — head barista posts weekly schedule to the whole team
// Read access: everyone (barista, head_barista, owner, accountant)

// ==============================================================
routes.roaster = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Roaster", "Head barista posts the weekly schedule for Maadi and Zawya — morning and night shifts."));

  state.roaster_schedules = state.roaster_schedules || [];

  wrap.appendChild(weekPicker);

  const body = el("div", { class: "stack" });
  wrap.appendChild(body);

  function currentSchedule() {

    if (canEdit) {
      body.appendChild(el("div", { class: "banner-arch" },

        "All team members can read this. Changes save when you tap Post."));

      const ta = el("textarea", {
        rows: "14",
        placeholder: "Paste or type the weekly roaster here…\n\nExample:\n━━ MAADI ━━\n  Morning: Barista 1, Khaled\n  Night:   Barista 2\n\n━━ ZAWYA ━━\n  Morning: Barista 3\n  Night:   Barista 1",
        style: { marginTop: "10px", width: "100%", fontFamily: "monospace", fontSize: "13px", lineHeight: "1.6" }
      });

      body.appendChild(ta);

      const btnRow = el("div", { class: "btn-row", style: { marginTop: "10px" } });
      btnRow.appendChild(el("button", { class: "btn", onClick: () => {

          sched.note = note;
          sched.updated_by = s.by;
          sched.updated_by_name = s.by_name;
          sched.updated_at = s.at;
        } else {
          state.roaster_schedules.push({
            id: uuid(), week_of: weekOf, note,
            by: s.by, by_name: s.by_name, at: s.at,
            updated_at: null,
          });
        }
        saveState();
        toast("📤 Roaster posted for week of " + weekOf);
        draw();
      } }, "📤 Post roaster"));

      if (sched) {
        btnRow.appendChild(el("button", { class: "btn danger", style: { width: "auto", flexShrink: "0" }, onClick: () => {
          if (!confirm("Clear roaster for week of " + weekOf + "?")) return;
          state.roaster_schedules = state.roaster_schedules.filter(r => r.week_of !== weekOf);
          saveState(); toast("Roaster cleared"); draw();
        } }, "🗑 Clear"));
      }
      body.appendChild(btnRow);
    } else {
      body.appendChild(el("div", { class: "banner-arch" },
        "Read-only — your weekly roaster is posted by the head barista."));
    }

    // Show the current week's posted schedule
    if (sched) {
      const card = el("div", { class: "card", style: { marginTop: "12px" } });
      card.appendChild(el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } },
        "Week of " + sched.week_of));
      card.appendChild(el("pre", {
        style: { margin: "10px 0 0", fontSize: "13px", whiteSpace: "pre-wrap", fontFamily: "monospace", lineHeight: "1.7", background: "var(--surface-2)", borderRadius: "10px", padding: "12px" }
      }, sched.note));
      const byLine = sched.updated_at
        ? "Updated by " + (sched.updated_by_name || "—") + " on " + fmtDate(sched.updated_at)
        : "Posted by " + (sched.by_name || "—") + " on " + fmtDate(sched.at);
      card.appendChild(el("div", { class: "muted small", style: { marginTop: "8px" } }, byLine));
      body.appendChild(card);
    } else if (!canEdit) {
      body.appendChild(el("div", { class: "card", style: { marginTop: "12px" } }, [
        el("div", { class: "muted small" }, "No roaster posted for this week yet — check back later."),
      ]));
    }

    // History: last 4 other weeks for quick navigation
    const recent = state.roaster_schedules
      .filter(r => r.week_of !== weekOf)
      .sort((a, b) => b.week_of.localeCompare(a.week_of))
      .slice(0, 4);
    if (recent.length > 0) {
      const hist = el("div", { class: "card", style: { marginTop: "10px" } });
      hist.appendChild(el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px", marginBottom: "6px" } }, "Recent weeks"));
      for (const r of recent) {
