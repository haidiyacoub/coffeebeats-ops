        vDiv.appendChild(el("div", { style: { fontSize: "12px" } }, `${emoji} ${ev.title}`));
        row.appendChild(vDiv);
        if (canEdit) {
          const delBtn = el("button", { class: "btn ghost", style: { fontSize: "11px", color: "var(--bad)", padding: "2px 6px", flexShrink: "0" } }, "🗑");
          delBtn.addEventListener("click", () => {
            state.special_dates = state.special_dates.filter(x => x.id !== ev.id);
            saveState(); toast("Event deleted"); drawSpecialDates(); draw();
          });
          row.appendChild(delBtn);
        }
        pastList.appendChild(row);
      }
      sdBody.appendChild(pastToggle);
      sdBody.appendChild(pastList);
    }

    if (canEdit) {
      sdBody.appendChild(el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px", marginTop: "14px", marginBottom: "6px" } }, "Add event"));
      const addForm = el("div", { style: { display: "flex", flexWrap: "wrap", gap: "8px", alignItems: "flex-end" } });
      const dateInp  = el("input",    { type: "date",   placeholder: "Date",   style: { maxWidth: "150px" } });
      const branchSel = el("select",  { style: { maxWidth: "150px" } });
      for (const [v, l] of [["all","All branches"],["maadi","Maadi"],["zawya","Zawya"],["events","Coffee Beats Events"]]) {
        branchSel.appendChild(el("option", { value: v }, l));
      }
      const titleInp = el("input",    { type: "text",   placeholder: "Title (e.g. Zawya Film Night)", style: { minWidth: "200px", flex: "1" } });
      const noteInp  = el("input",    { type: "text",   placeholder: "Note (optional)", style: { minWidth: "160px", flex: "1" } });
      const addBtn   = el("button",   { class: "btn", style: { flexShrink: "0" } }, "＋ Add");
      addBtn.addEventListener("click", () => {
        if (!dateInp.value) return toast("Please pick a date", "error");
        if (!titleInp.value.trim()) return toast("Please enter a title", "error");
        const s = stamp();
        state.special_dates.push({
          id: uuid(), date: dateInp.value, branch: branchSel.value,
          title: titleInp.value.trim(), note: noteInp.value.trim(),
          by: s.by, by_name: s.by_name, at: s.at,
        });
        saveState();
        toast(`Event added: ${titleInp.value.trim()}`);
        dateInp.value = ""; titleInp.value = ""; noteInp.value = "";
        drawSpecialDates(); draw();
      });
      addForm.append(dateInp, branchSel, titleInp, noteInp, addBtn);
      sdBody.appendChild(addForm);
    }
  }
  drawSpecialDates();
  sdCard.appendChild(sdBody);
  wrap.appendChild(sdCard);
  // ────────────────────────────────────────────────────────────

  const body = el("div", { class: "stack" });
  wrap.appendChild(body);

  function rosterEntry(branch, shift, day) {
    return state.rosters.find(r => r.week_of === weekOf && r.branch === branch && r.shift === shift && r.day === day);
  }
  function setRosterEntry(branch, shift, day, user) {
    const s = stamp();
    const existing = rosterEntry(branch, shift, day);
    if (!user) {
      if (existing) state.rosters = state.rosters.filter(r => r.id !== existing.id);
    } else if (existing) {
      existing.user_id = user.id; existing.user_name = user.name;
      existing.by = s.by; existing.by_name = s.by_name; existing.at = s.at;
    } else {
      state.rosters.push({
        id: uuid(), week_of: weekOf, branch, shift, day,
        user_id: user.id, user_name: user.name,
        by: s.by, by_name: s.by_name, at: s.at,
      });
    }
    saveState();
  }

  // ── Coffee Beats Events — Google Calendar API v3 ────────────
  let calEvents = []; // [{ date: "YYYY-MM-DD", summary: string, startHour: number }]
  let calStatus = "idle";
  // CB_CAL_ID, calItemDate, calApiHour defined at module scope above

  async function loadCalEvents() {
    const apiKey = (state.gcal_api_key || "").trim();
    if (!apiKey) {
      calStatus = "no_key";
      calStatusEl.textContent = "⚠ Enter your Google Calendar API key above and click Connect.";
      return;
    }
    calStatus = "loading";
    calStatusEl.textContent = "⏳ Loading…";
    const weekEnd = new Date(weekOf + "T12:00:00");
    weekEnd.setDate(weekEnd.getDate() + 7);
    // Use Cairo midnight (UTC+2) so events on Sunday aren't cut off
    const tMin = weekOf + "T00:00:00+02:00";
    const tMax = localISODate(weekEnd) + "T00:00:00+02:00";
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CB_CAL_ID)}/events`
      + `?key=${apiKey}&singleEvents=true&orderBy=startTime&timeMin=${encodeURIComponent(tMin)}&timeMax=${encodeURIComponent(tMax)}`;
    try {
      const ctrl = new AbortController();
      setTimeout(() => ctrl.abort(), 8000);
      const res = await fetch(url, { signal: ctrl.signal });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `HTTP ${res.status}`);
      }
      const data = await res.json();
      calEvents = (data.items || []).map(item => ({
        date: calItemDate(item),
        summary: item.summary || "Event",
        startHour: item.start.dateTime ? calApiHour(item.start.dateTime) : 10,
      })).filter(e => e.date);
      calStatus = "ok";
      calStatusEl.textContent = calEvents.length
        ? `✅ ${calEvents.length} event(s): ${calEvents.map(e => `${e.date} — ${e.summary}`).join(" · ")}`
        : `✅ No events (week ${weekOf} → ${localISODate(weekEnd)})`;
    } catch (e) {
      calEvents = [];
      calStatus = "error";
      const retryBtn = el("button", { class: "btn ghost", style: { fontSize: "12px", padding: "3px 10px", marginLeft: "8px" } }, "↻ Retry");
      retryBtn.addEventListener("click", loadCalEvents);
      calStatusEl.innerHTML = "";
      calStatusEl.appendChild(document.createTextNode(`❌ ${e.message} `));
      calStatusEl.appendChild(retryBtn);
    }
    draw();
  }
  // ────────────────────────────────────────────────────────────

  function draw() {
    body.innerHTML = "";
    if (canEdit) {
      body.appendChild(el("div", { class: "banner-arch" },
        "Assign baristas per shift per day — changes save instantly and take effect immediately. " +
        "You can update mid-week at any time (sick calls, emergencies). " +
        "⚠ The morning shift barista is the one responsible for the sign-in stamp. " +
        "If you swap the morning assignment, the penalty system picks up the new name automatically."));
    } else {
      body.appendChild(el("div", { class: "banner-arch" }, "Read-only — your weekly schedule. The morning shift barista is responsible for the daily sign-in stamp. Ask the head barista if anything looks off."));
    }

    const staff = state.users.filter(x => x.active && (x.role === "barista" || x.role === "head_barista"));

    // Helper: get approved-leave user IDs for a specific calendar date
    function onLeaveIds(dateStr) {
      return (state.leaves || [])
        .filter(l => l.status === "approved" && dateStr >= l.from_date && dateStr <= l.to_date)
        .map(l => l.user_id);
    }

    // Week start as local noon — avoids UTC-offset shifts when we reformat
    const weekStart = new Date(weekOf + "T12:00:00");

    // Group by DAY → then branch+shift (Mon → Maadi Morning / Night, Zawya Morning / Night)
    for (let di = 0; di < ROSTER_DAYS.length; di++) {
      const day = ROSTER_DAYS[di];
      // Compute the actual calendar date for this roster day using local time
      const dayDate = new Date(weekStart);
      dayDate.setDate(dayDate.getDate() + di);
      const dayDateStr = localISODate(dayDate); // local, not UTC
      const onLeave = onLeaveIds(dayDateStr);
      const { holidays, inRamadan } = getCalendarContext(dayDateStr);
      const daySpecialDates = (state.special_dates || []).filter(e =>
        e.date === dayDateStr && (e.branch === "all" || e.branch === "maadi" || e.branch === "zawya" || e.branch === "events")
      );

      // Choose card tint based on calendar context
      let cardBg = "";
      const hasEid = holidays.find(h => h.type === "eid_fitr" || h.type === "eid_adha");
      const hasPublicHol = holidays.find(h => h.type === "public_holiday");
      if (hasEid)                     cardBg = "rgba(212,175,55,0.09)";
      else if (inRamadan)             cardBg = "rgba(139,90,43,0.06)";
      else if (hasPublicHol)          cardBg = "rgba(59,130,246,0.06)";
      else if (daySpecialDates.length) cardBg = "rgba(139,92,246,0.06)";

      const card = el("div", { class: "card", style: { marginTop: "10px", ...(cardBg ? { background: cardBg } : {}) } });
      const dayHdr = el("h2", { style: { display: "flex", alignItems: "center", flexWrap: "wrap", gap: "8px" } });
      dayHdr.appendChild(document.createTextNode(ROSTER_DAY_LABELS[day]));
      dayHdr.appendChild(el("span", { class: "muted small", style: { fontWeight: "400" } }, dayDateStr));
      if (onLeave.length) {
        const names = onLeave.map(id => { const s = staff.find(x => x.id === id); return s ? s.name : id; });
        dayHdr.appendChild(el("span", { class: "pill warn", style: { color: "var(--warn)", fontSize: "11px" } }, `🌴 On leave: ${names.join(", ")}`));
      }
      // Holiday badges
      for (const h of holidays) {
        const bg = (h.type === "eid_fitr" || h.type === "eid_adha")
          ? "rgba(212,175,55,0.2)" : "rgba(59,130,246,0.12)";
        dayHdr.appendChild(el("span", { class: "pill", style: { background: bg, fontSize: "11px" } }, `${h.emoji} ${h.label}`));
      }
      if (inRamadan) {
        dayHdr.appendChild(el("span", { class: "pill", style: { background: "rgba(139,90,43,0.18)", fontSize: "11px" } }, "🌙 Ramadan"));
      }
      // Special event badges
      for (const ev of daySpecialDates) {
        const emoji = ev.branch === "zawya" ? "🎬" : ev.branch === "maadi" ? "⭐" : "📅";
        dayHdr.appendChild(el("span", { class: "pill", style: { background: "rgba(139,92,246,0.18)", fontSize: "11px" } }, `${emoji} ${ev.title}`));
      }
      card.appendChild(dayHdr);

      // Build options: exclude staff on approved leave for this day
      const dayStaff = staff.filter(s => !onLeave.includes(s.id));
      const staffOptions = [["","— empty —"], ...dayStaff.map(s => [s.id, s.name])];
      // External baristas (active only) — for events shifts
      const activeExtBaristas = (state.external_baristas || []).filter(b => b.active !== false);

      for (const branch of ["maadi","zawya","events"]) {
        let branchLabel, shiftsForBranch;
        if (branch === "events") {
          if (calStatus === "loading") {
            card.appendChild(el("div", { class: "muted small", style: { textTransform:"uppercase", letterSpacing:"1px", marginTop: "8px", marginBottom: "4px" } }, "🎪 Coffee Beats Events"));
            card.appendChild(el("div", { class: "muted small", style: { marginLeft: "4px", fontStyle: "italic" } }, "⏳ Loading calendar…"));
            continue;
          }
          const calEv = calEvents.find(e => e.date === dayDateStr) || null;
          if (!calEv) continue; // no event this day — skip events row
          const evNightStart = parseInt(((state.branch_opening_times.events || {}).night || "16:00").split(":")[0], 10);
          const calShift = calEv.startHour >= evNightStart ? "night" : "morning";
          branchLabel = `🎪 ${calEv.summary}`;
          shiftsForBranch = [calShift];
        } else {
          branchLabel = branch[0].toUpperCase() + branch.slice(1);
          shiftsForBranch = ROSTER_SHIFTS;
        }
        card.appendChild(el("div", { class: "muted small", style: { textTransform:"uppercase", letterSpacing:"1px", marginTop: "8px", marginBottom: "4px" } }, branchLabel));
        for (const shift of shiftsForBranch) {
          const entry = rosterEntry(branch, shift, day);
          const shiftLabel = shift[0].toUpperCase() + shift.slice(1);
          const row = el("div", { class: "kv", style: { alignItems: "center" } });
          row.appendChild(el("div", { class: "k", style: { minWidth: "80px" } }, shiftLabel));
          if (canEdit) {
            // If the currently-assigned person is on approved leave, show a warning
            const assignedOnLeave = entry && onLeave.includes(entry.user_id);
            const sel = el("select", { style: assignedOnLeave ? { borderColor: "var(--bad)" } : {} });
            if (branch === "events" && activeExtBaristas.length > 0) {
              // Events shift: show Coffee Beats team and outsourced team in separate groups
              sel.appendChild(el("option", { value: "" }, "— empty —"));
              const cbGroup = document.createElement("optgroup"); cbGroup.label = "☕ Coffee Beats Team";
              for (const s of dayStaff) {
                const o = el("option", { value: s.id }, s.name);
                if (entry && entry.user_id === s.id) o.selected = true;
                cbGroup.appendChild(o);
              }
              sel.appendChild(cbGroup);
              const extGroup = document.createElement("optgroup"); extGroup.label = "🤝 Outsourced Team";
              for (const b of activeExtBaristas) {
                const o = el("option", { value: "ext_" + b.id }, b.name + (b.daily_rate ? ` (${b.daily_rate} L.E./day)` : ""));
                if (entry && entry.user_id === "ext_" + b.id) o.selected = true;
                extGroup.appendChild(o);
              }
              sel.appendChild(extGroup);
            } else {
              for (const [val, lab] of staffOptions) {
                const o = el("option", { value: val }, lab);
                if (entry && entry.user_id === val) o.selected = true;
                sel.appendChild(o);
              }
            }
            // If assigned person is now on leave, add them as a disabled option with warning
            if (assignedOnLeave) {
              const warnOpt = el("option", { value: entry.user_id, selected: "true", style: { color: "var(--bad)" } },
                `⚠ ${entry.user_name} (ON LEAVE — reassign!)`);
              sel.insertBefore(warnOpt, sel.children[1] || null);
            }
            sel.addEventListener("change", () => {
              // Block assigning someone on leave
              if (onLeave.includes(sel.value)) {
                toast("This barista has approved leave on this day — cannot assign them.", "error");
                sel.value = entry ? entry.user_id : "";
                return;
              }
              const isExt = sel.value.startsWith("ext_");
              const extId = isExt ? sel.value.slice(4) : null;
              const extPerson = isExt ? (state.external_baristas || []).find(b => b.id === extId) : null;
              // Resolve user: either a Coffee Beats staff member or a synthetic external barista object
              const user = isExt
                ? (extPerson ? { id: "ext_" + extPerson.id, name: extPerson.name, _external: true, _daily_rate: extPerson.daily_rate } : null)
                : (staff.find(s => s.id === sel.value) || null);
              setRosterEntry(branch, shift, day, user);
              // ── Events bonus automation ───────────────────────────
              if (branch === "events") {
                state.overtime_logs = state.overtime_logs || [];
                // Remove any previous events_bonus for this date+shift
                state.overtime_logs = state.overtime_logs.filter(x =>
                  !(x.kind === "events_bonus" && x.date === dayDateStr && x.shift === shift)
                );
                if (user) {
                  let bonus = 0;
                  if (user._external) {
                    // External barista: bonus = their daily rate (no monthly salary formula)
                    bonus = user._daily_rate || 0;
                  } else {
                    const salary = getSalaryForMonth(user.id, dayDateStr.slice(0, 7));
                    bonus = Math.round((salary / 30) + (salary * 0.07));
                  }
                  if (bonus > 0) {
                    const sb = stamp();
                    state.overtime_logs.push({
                      id: uuid(), user_id: user.id, user_name: user.name,
                      date: dayDateStr, month: dayDateStr.slice(0, 7),
                      hours: 0, amount: bonus, kind: "events_bonus", shift,
                      note: `🎪 Events bonus — ${state.events_location_name || "Coffee Beats Events"}${user._external ? " (outsourced)" : ""}`,
                      approved: true,
                      by: sb.by, by_name: sb.by_name, at: sb.at,
                    });
                    saveState();
                    toast(`${ROSTER_DAY_LABELS[day]} · ${branchLabel} · ${shiftLabel} → ${user.name} (+${bonus} L.E. events bonus 🎪${user._external ? " · outsourced" : ""})`);
                    return;
                  }
                }
                saveState();
              }
              // ── Double-shift overtime automation ─────────────────
              state.overtime_logs = state.overtime_logs || [];
              const _prevUserId = entry ? entry.user_id : null;
              const _usersToCheck = new Set();
              if (user) _usersToCheck.add(user.id);
              if (_prevUserId && _prevUserId !== (user && user.id)) _usersToCheck.add(_prevUserId);
              for (const _uid of _usersToCheck) {
                state.overtime_logs = state.overtime_logs.filter(x =>
                  !(x.kind === "double_shift" && x.user_id === _uid && x.date === dayDateStr)
                );
                const _hasMorning = (state.rosters || []).some(r =>
                  r.week_of === weekOf && r.day === day && r.shift === "morning" && r.user_id === _uid
                );
                const _hasNight = (state.rosters || []).some(r =>
                  r.week_of === weekOf && r.day === day && r.shift === "night" && r.user_id === _uid
                );
                if (_hasMorning && _hasNight) {
                  const _person = (state.users || []).find(p => p.id === _uid);
                  const _sal = getSalaryForMonth(_uid, dayDateStr.slice(0, 7));
                  const _hrRate = _sal > 0 ? _sal / 30 / 8 : 0;
                  // 2nd shift = 8 h at 1.5× hourly rate
                  const _otHours = 8;
                  const _otAmt = Math.round(_hrRate * _otHours * 1.5 * 100) / 100;
                  if (_otAmt > 0) {
                    const _sb = stamp();
                    state.overtime_logs.push({
                      id: uuid(), user_id: _uid, barista: _person ? _person.name : _uid,
                      date: dayDateStr, month: dayDateStr.slice(0, 7),
                      hours: _otHours, rate: _hrRate, multiplier: 1.5, amount: _otAmt, kind: "double_shift",
                      note: `⏰ Double shift — 8 h × 1.5× rate on ${dayDateStr}`,
                      approved: true,
                      by: _sb.by, by_name: _sb.by_name, at: _sb.at,
                    });
                    toast(`${_person ? _person.name : _uid} — double shift OT auto-logged (+${_otAmt} L.E.)`);
                  }
                }
              }
              saveState();
              // ─────────────────────────────────────────────────────
              toast(`${ROSTER_DAY_LABELS[day]} · ${branchLabel} · ${shiftLabel} → ${user ? user.name : "empty"}`);
            });
            const cellWrap = el("div", { class: "v" }, [sel]);
            if (assignedOnLeave) {
              cellWrap.appendChild(el("div", { style: { fontSize: "11px", color: "var(--bad)", marginTop: "3px" } },
                "⚠ On approved leave — please reassign"));
            }
            row.appendChild(cellWrap);
          } else {
            const isOnLeave = entry && onLeave.includes(entry.user_id);
            row.appendChild(el("div", { class: "v", style: isOnLeave ? { color: "var(--bad)" } : {} },
              entry ? (isOnLeave ? `${entry.user_name} 🌴` : entry.user_name) : "—"));
          }
          card.appendChild(row);
        }
      }
      body.appendChild(card);
    }

    // Weekly summary — so baristas can scan who's on when
    const summary = el("div", { class: "card", style: { marginTop: "10px" } });
    summary.appendChild(el("h2", {}, `Summary — week of ${weekOf}`));
    const myId = u.id;
    const mine = state.rosters.filter(r => r.week_of === weekOf && r.user_id === myId);
    if (mine.length) {
      summary.appendChild(el("div", { class: "muted small" }, `Your shifts (${u.name}):`));
      for (const m of mine) {
        summary.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, `${ROSTER_DAY_LABELS[m.day]} · ${m.branch} · ${m.shift}`),
          el("div", { class: "v" }, fmtDate(m.at)),
        ]));
      }
    } else {
      summary.appendChild(el("div", { class: "muted small" }, "You have no shifts assigned this week."));
    }
    // Last-edit note — shows head barista exactly when the schedule was last changed
    const weekEntries = state.rosters.filter(r => r.week_of === weekOf);
    if (weekEntries.length) {
      const lastEdit = weekEntries.slice().sort((a,b) => (b.at||"").localeCompare(a.at||""))[0];
      summary.appendChild(el("div", { class: "muted small", style: { marginTop: "10px", borderTop: "1px solid var(--border)", paddingTop: "8px" } },
        `Last schedule update: ${fmtDate(lastEdit.at)} by ${lastEdit.by_name || "—"}`));
    }
    body.appendChild(summary);

    if (canEdit) {
      body.appendChild(el("div", { class: "btn-row", style: { marginTop: "10px" } }, [
        el("button", { class: "btn ghost", onClick: () => {
          if (!confirm(`Clear ALL schedule entries for the week of ${weekOf}?`)) return;
          state.rosters = state.rosters.filter(r => r.week_of !== weekOf);
          saveState(); toast("Week cleared"); draw();
        } }, "🗑 Clear this week"),
        el("button", { class: "btn ghost", onClick: () => {
          // Copy last week's roster to this week
          const prev = new Date(weekOf + "T12:00:00"); prev.setDate(prev.getDate() - 7);
          const prevKey = localISODate(prev);
          const src = state.rosters.filter(r => r.week_of === prevKey);
          if (!src.length) return toast("No schedule found for last week", "error");
          for (const r of src) {
            const exists = rosterEntry(r.branch, r.shift, r.day);
            if (!exists) {
              const s = stamp();
              state.rosters.push({
                id: uuid(), week_of: weekOf, branch: r.branch, shift: r.shift, day: r.day,
                user_id: r.user_id, user_name: r.user_name,
                by: s.by, by_name: s.by_name, at: s.at,
              });
            }
          }
          saveState(); toast(`Copied ${src.length} entries from ${prevKey}`); draw();
        } }, "📋 Copy last week"),
      ]));
    }
  }
  draw();
  wrap.appendChild(btnBack());
  return wrap;
};

// ==============================================================
// MENU ITEMS
// ==============================================================
routes.menu = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Menu items", "Price + cost per item. Cost drives margin; price drives revenue."));

  wrap.appendChild(el("div", { class: "banner-arch" }, [
    "Authoritative cost = ‘coffee beats menu analysis ver2’ → cost tab → column BF. Authoritative price = column BI. Upload a CSV — accepted columns: ",
    el("b", {}, "name"),
    " (or item / product), ",
    el("b", {}, "cost_egp"),
    " (or cost / bf), ",
    el("b", {}, "price_egp"),
    " (or price / bi), ",
    el("b", {}, "new_name"),
    " (optional — renames matched item). Uppercase section rows, trailing spaces, accents and parentheticals are all normalised; re-uploading always overwrites prior cost / price."
  ]));

  const up = el("input", { type: "file", accept: ".csv,.xlsx,.xls" });
  wrap.appendChild(el("label", {}, "Upload cost CSV or Excel"));
  wrap.appendChild(up);
  up.addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    const normFull = (s) => String(s||"").replace(/\s+/g," ").trim();
    const toNum = (x) => { const n = Number(String(x||"").replace(/[,\s]/g,"")); return isNaN(n) ? null : n; };
    const looksLikeSectionHeader = (name, cost, price) => {
      const hasNumbers = (cost != null && cost > 0) || (price != null && price > 0);
      if (hasNumbers) return false;
      const letters = name.replace(/[^A-Za-z]/g,"");
      if (!letters) return true;
      return letters === letters.toUpperCase() && letters.length > 1;
    };
    // itemRows: [{name, cost, price, category, sku}]
    let itemRows = [];
    if (/\.(xlsx|xls)$/i.test(f.name)) {
      // For xlsx: always read cost tab, columns by fixed index — A(0)=name, BF(57)=cost, BI(60)=price.
      const COL_NAME = 0, COL_COST = 57, COL_PRICE = 60;
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: true });
      const costSheetName = wb.SheetNames.find(n => n.trim().toLowerCase() === "cost") || wb.SheetNames[0];
      const ws = wb.Sheets[costSheetName];
      if (!ws || !ws['!ref']) { toast("Empty cost sheet", "error"); return; }
      const range = XLSX.utils.decode_range(ws['!ref']);
      const cv = (r, c) => { const cell = ws[XLSX.utils.encode_cell({r, c})]; return cell != null ? cell.v : null; };
      for (let r = 1; r <= range.e.r; r++) {
        const name = normFull(String(cv(r, COL_NAME) ?? ""));
        const rawCost  = cv(r, COL_COST);
        const rawPrice = cv(r, COL_PRICE);
        const cost  = rawCost  != null ? Number(rawCost)  : null;
        const price = rawPrice != null ? Number(rawPrice) : null;
        itemRows.push({ name, cost: isNaN(cost) ? null : cost, price: isNaN(price) ? null : price, category: "", sku: "" });
      }
    } else {
      // CSV fallback: detect columns by header name.
      let text = await f.text();
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      const parseLine = (ln) => {
        const out = []; let cur = ""; let q = false;
        for (let i=0; i<ln.length; i++) {
          const c = ln[i];
          if (q) { if (c === '"' && ln[i+1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
          else { if (c === '"') q = true; else if (c === ',') { out.push(cur); cur = ""; } else cur += c; }
        }
        out.push(cur); return out;
      };
      const lines = text.split(/\r?\n/).filter(s => s.trim() !== "");
      if (lines.length === 0) { toast("Empty CSV", "error"); return; }
      const h = parseLine(lines[0]).map(s => s.trim().toLowerCase());
      const findCol = (...aliases) => { for (const a of aliases) { const i = h.indexOf(a); if (i !== -1) return i; } return -1; };
      const iName  = findCol("name","item","item name","product","product name","menu item","bg");
      const iCost  = findCol("cost_egp","cost","bf","cost with cup and lid","cost_with_cup_and_lid","item cost");
      const iPrice = findCol("price_egp","price","bi","menu price","selling price");
      const iCat   = findCol("category","cat","type");
      const iSku   = findCol("sku","pos_sku","pos sku","item id","product sku");
      if (iName < 0 || (iCost < 0 && iPrice < 0)) {
        toast("CSV needs a name column + at least one of cost/price", "error"); return;
      }
      for (let i = 1; i < lines.length; i++) {
        const parts = parseLine(lines[i]);
        itemRows.push({
          name:     normFull(parts[iName]),
          cost:     iCost  >= 0 ? toNum(parts[iCost])  : null,
          price:    iPrice >= 0 ? toNum(parts[iPrice]) : null,
          category: iCat   >= 0 ? normFull(parts[iCat]) : "",
          sku:      iSku   >= 0 ? normFull(parts[iSku]) : ""
        });
      }
    }
    // Sheet is authoritative — wipe existing menu and rebuild from itemRows.
    const newMenu = [];
    let added = 0, skipped = 0;
    for (const { name, cost, price, category, sku } of itemRows) {
      if (!name) { skipped++; continue; }
      if (looksLikeSectionHeader(name, cost, price)) { skipped++; continue; }
      if (cost == null && price == null) { skipped++; continue; }
      newMenu.push({
        id: "menu_" + uuid().slice(0,6),
        name,
        price_egp: price ?? 0,
        cost_egp:  cost  ?? 0,
        category,
        pos_sku: sku || null,
        branches: ["maadi","zawya"]
      });
      added++;
    }
    state.menu = newMenu;
    saveState();
    toast(`Menu replaced: ${added} items loaded${skipped ? `, ${skipped} skipped` : ""}`);
    render();
  });

  // ---------- Add / dedupe controls ----------
  const menuBtnRow = el("div", { style: { display: "flex", gap: "8px", flexWrap: "wrap", marginTop: "8px" } });
  if (u.role === "owner" || u.role === "accountant") {
    menuBtnRow.appendChild(el("button", { class: "btn secondary", onClick: addMenuItem }, "➕ Add menu item"));
  }
  menuBtnRow.appendChild(el("button", { class: "btn ghost", onClick: dedupeMenu }, "🧹 Merge duplicate menu items"));
  wrap.appendChild(menuBtnRow);

  function addMenuItem() {
    openPrompt({
      title: "Add menu item",
      fields: [
        { key: "name", label: "Name", type: "text", value: "" },
        { key: "price_egp", label: "Price (EGP)", type: "number", value: 0 },
        { key: "cost_egp", label: "Cost (EGP)", type: "number", value: 0 },
        { key: "category", label: "Category", type: "text", value: "" },
      ],
      onSubmit: (v) => {
        if (!v.name || !v.name.trim()) return toast("Name is required", "error");
        state.menu.push({
          id: "menu_" + uuid().slice(0, 6),
          name: v.name.trim(),
          price_egp: Number(v.price_egp) || 0,
          cost_egp:  Number(v.cost_egp)  || 0,
          category:  v.category || "",
          branches:  ["maadi","zawya"],
        });
        saveState();
        toast(`Added ${v.name}`);
        render();
      }
    });
  }

  function dedupeMenu() {
    const nk = (s) => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\([^)]*\)/g," ").replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();
    const groups = new Map();
    for (const m of state.menu) {
      const k = nk(m.name);
      if (!k) continue;
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(m);
    }
    const dups = [...groups.entries()].filter(([,arr]) => arr.length > 1);
    if (!dups.length) return toast("No duplicates found");
    if (!confirm(`Merge ${dups.length} duplicate name groups?`)) return;
    const removeIds = new Set();
    for (const [,arr] of dups) {
      // Pick the "richest" record as keeper (highest cost + price + sku length)
      arr.sort((a,b) => (Number(b.cost_egp||0)+Number(b.price_egp||0)+(b.pos_sku?5:0)+(b.name.length||0)) - (Number(a.cost_egp||0)+Number(a.price_egp||0)+(a.pos_sku?5:0)+(a.name.length||0)));
      const keep = arr[0];
      for (let i = 1; i < arr.length; i++) {
        const d = arr[i];
        if (!keep.cost_egp && d.cost_egp) keep.cost_egp = d.cost_egp;
        if (!keep.price_egp && d.price_egp) keep.price_egp = d.price_egp;
        if (!keep.pos_sku && d.pos_sku) keep.pos_sku = d.pos_sku;
        if (!keep.category && d.category) keep.category = d.category;
        removeIds.add(d.id);
      }
    }
    state.menu = state.menu.filter(m => !removeIds.has(m.id));
    saveState();
    toast(`Merged ${removeIds.size} duplicate rows`);
    render();
  }

  const search = el("input", { type: "search", placeholder: "Search…", style: { marginTop: "12px" } });
  wrap.appendChild(search);

  const list = el("div", { class: "list" });
  wrap.appendChild(list);
  const draw = () => {
    list.innerHTML = "";
    const q = search.value.trim().toLowerCase();
    const items = state.menu.filter(m => q === "" || m.name.toLowerCase().includes(q)).slice(0, 300);
    for (const m of items) {
      const margin = (m.price_egp && m.cost_egp) ? ((m.price_egp - m.cost_egp) / m.price_egp * 100) : null;
      list.appendChild(el("div", { class: "row", onClick: () => editMenu(m) }, [
        el("div", { class: "grow" }, [
          el("div", { class: "title" }, m.name),
          el("div", { class: "sub" }, `${m.category || "—"} · price ${money(m.price_egp)} · cost ${m.cost_egp ? money(m.cost_egp) : "—"}`),
        ]),
        el("div", {}, [
          margin != null ? el("span", { class: "pill", style: { color: margin>60?"var(--ok)":margin>40?"var(--warn)":"var(--bad)" } }, `${margin.toFixed(0)}%`) : el("span", { class: "pill" }, "no cost"),
        ]),
      ]));
    }
  };
  search.addEventListener("input", draw); draw();

  function editMenu(m) {
    openPrompt({
      title: `Edit ${m.name}`,
      fields: [
        { key: "name", label: "Name", type: "text", value: m.name },
        { key: "price_egp", label: "Price (EGP)", type: "number", value: m.price_egp || 0 },
        { key: "cost_egp", label: "Cost (EGP)", type: "number", value: m.cost_egp || 0 },
        { key: "category", label: "Category", type: "text", value: m.category || "" },
        { key: "delete", label: "Type DELETE to remove this item (leave blank to just edit)", type: "text", value: "" },
      ],
      onSubmit: v => {
        if (String(v.delete || "").trim().toUpperCase() === "DELETE") {
          if (!(u.role === "owner" || u.role === "accountant")) return toast("Only owner/accountant can delete menu items", "error");
          state.menu = state.menu.filter(x => x.id !== m.id);
          saveState();
          toast(`Removed ${m.name}`);
          render();
          return;
        }
        m.name = v.name; m.price_egp = Number(v.price_egp)||0; m.cost_egp = Number(v.cost_egp)||0; m.category = v.category;
        saveState(); render();
      }
    });
  }

  wrap.appendChild(btnBack());
  return wrap;
};

        el("option", { value: "true",  selected: usr.active !== false ? "true" : null }, "Active"),

      try {
        const payload = { targetUid: usr.uid, emergency_number: emerInp.value.trim() || null };

          payload.role     = roleEl.value;
          payload.branches = [...(cbMaadi.checked ? ["maadi"] : []), ...(cbZawya.checked ? ["zawya"] : [])];

        if (lc) Object.assign(lc, { emergency_number: payload.emergency_number, ...(isOwner ? { role: payload.role, branches: payload.branches, active: payload.active } : {}) });
        await staffDir.load(); saveState();
        toast("Saved"); closeSheet(); render();
      } catch (e) { toast(e.message || "Save failed", "error"); }
      saveBtn.disabled = false; saveBtn.textContent = "Save";

    sheet.appendChild(saveBtn);

    // Access rights (owner only)
    if (isOwner) {
      const ar = el("button", { class: "btn ghost", style: { width: "100%", marginBottom: "10px" } }, "Access rights...");
      ar.addEventListener("click", () => editAccess(usr));

    // ID viewer

    // Deactivate button (owner only, not self)
    if (isOwner && !isSelf) {
      const delBtn = el("button", { class: "btn bad", style: { width: "100%", marginBottom: "10px" } }, "Deactivate & remove access");
      delBtn.addEventListener("click", () => {
        openPrompt({
          title: "Deactivate " + usr.name,
          fields: [
            { key: "left_date", label: "Last working day", type: "date", value: new Date().toISOString().slice(0,10) },
            { key: "note", label: "Note (optional)", type: "text", value: "" },
          ],
          onSubmit: async (v) => {
            delBtn.disabled = true; delBtn.textContent = "Removing...";
            try {
              await functions.httpsCallable("setStaffActive")({ targetUid: usr.uid, active: false });

                state.barista_dates = state.barista_dates || {};

    // PIN change (self or owner)

      pw.appendChild(el("div", { style: { fontWeight: "700", marginBottom: "2px" } }, "Change PIN"));
      pw.appendChild(el("div", { class: "muted small", style: { marginBottom: "12px" } }, "4-digit code used to sign in to the app."));

      const pinFieldStyle = { width: "100%", padding: "10px", borderRadius: "8px", border: "1px solid var(--border,#ddd)", background: "var(--surface,#fff)", color: "var(--ink,#222)", boxSizing: "border-box", fontSize: "22px", letterSpacing: "10px", textAlign: "center" };

      let curPinInp = null;
      if (!isOwner) {
        pw.appendChild(el("label", { style: { fontWeight: "600", display: "block", marginBottom: "4px" } }, "Current PIN"));
        curPinInp = el("input", { type: "password", inputmode: "numeric", pattern: "[0-9]*", maxlength: "4", placeholder: "••••", style: pinFieldStyle });
        pw.appendChild(curPinInp);
        pw.appendChild(el("div", { style: { height: "10px" } }));

      pw.appendChild(el("label", { style: { fontWeight: "600", display: "block", marginBottom: "4px" } }, "New PIN"));
      const newPinInp = el("input", { type: "password", inputmode: "numeric", pattern: "[0-9]*", maxlength: "4", placeholder: "••••", style: pinFieldStyle });

      pw.appendChild(el("div", { style: { height: "10px" } }));

      pw.appendChild(el("label", { style: { fontWeight: "600", display: "block", marginBottom: "4px" } }, "Confirm new PIN"));

        pinBtn.disabled = true; pinBtn.textContent = "Updating…";
        try {
          await functions.httpsCallable("updateStaffPin")({
            targetUid: usr.uid,
            newPin,
            ...(curPinInp ? { currentPin: curPinInp.value.trim() } : {}),
          });
          if (curPinInp) curPinInp.value = "";
          newPinInp.value = ""; cfmPinInp.value = "";
          toast("PIN updated ✓");
        } catch (e) {
          const msg = e.code === "functions/unauthenticated" ? "Current PIN is incorrect" : (e.message || "Failed to update PIN");
          toast(msg, "error");

      });
      pw.appendChild(pinBtn);
      sheet.appendChild(pw);

    sheet.appendChild(el("button", { class: "btn ghost", style: { width: "100%", marginTop: "8px" }, onClick: () => closeSheet() }, "Close"));

    function editAccess(usr) {
    if (u.role !== "owner") return toast("Only the owner can edit access rights", "error");
    const sheet = el("div", {});
    sheet.appendChild(el("h2", {}, `Access rights \u2014 ${usr.name}`));
    sheet.appendChild(el("div", { class: "muted small" }, `Role: ${usr.role}. \u201cDefault\u201d follows the role policy. \u201cAllow\u201d grants this route. \u201cDeny\u201d revokes it.`));
    const extras = new Set(usr.extra_access || []);
    const denies = new Set(usr.deny_access  || []);
    const rows = el("div", { class: "list" });
    sheet.appendChild(rows);
    const rolePolicy = ROLE_ACCESS[usr.role];
    const roleHas = (r) => rolePolicy === "*" || (Array.isArray(rolePolicy) && rolePolicy.includes(r));
    for (const r of MANAGEABLE_ROUTES) {
      const roleDefault = roleHas(r) ? "allow (by role)" : "deny (by role)";
      const state0 = extras.has(r) ? "allow" : denies.has(r) ? "deny" : "default";
      const sel = el("select", {}, [
        el("option", { value: "default", selected: state0==="default"?"true":null }, `Default \u2014 ${roleDefault}`),
        el("option", { value: "allow",   selected: state0==="allow"  ?"true":null }, "Allow (grant this route)"),
        el("option", { value: "deny",    selected: state0==="deny"   ?"true":null }, "Deny (revoke this route)"),
      ]);
      sel.addEventListener("change", () => {
        extras.delete(r); denies.delete(r);
        if (sel.value === "allow") extras.add(r);
        if (sel.value === "deny")  denies.add(r);
      });
      rows.appendChild(el("div", { class: "kv" }, [
        el("div", { class: "k" }, r),
        el("div", { class: "v" }, [sel]),
      ]));
    }
    sheet.appendChild(el("div", { class: "btn-row" }, [
      el("button", { class: "btn", onClick: () => {
        usr.extra_access = [...extras];
        usr.deny_access  = [...denies];
        const localEntry = (state.users || []).find(x => x.uid === usr.uid);
        if (localEntry) { localEntry.extra_access = usr.extra_access; localEntry.deny_access = usr.deny_access; }
        saveState(); toast("Access rights saved");
        closeSheet(); render();
      } }, "Save rights"),
      el("button", { class: "btn ghost", onClick: () => closeSheet() }, "Cancel"),
    ]));
    openSheet(sheet);
  }

  function staffIdSheet(usr) {
    const sheet = el("div", {});
    sheet.appendChild(el("h2", {}, `\ud83e\udeb9 Government ID \u2014 ${usr.name}`));
    const photosWrap = el("div", {});
    sheet.appendChild(photosWrap);
    function renderPhotos() {
      photosWrap.innerHTML = "";
      const urls = usr.id_photo_urls || [];
      if (urls.length === 0) {
        photosWrap.appendChild(el("div", { class: "muted small", style: { margin: "8px 0 16px" } }, "No ID uploaded yet."));
      } else {

        urls.forEach((url, i) => {
          const card = el("div", { style: { display: "flex", flexDirection: "column", alignItems: "center", gap: "4px" } });
          card.appendChild(el("img", { src: url, style: { width: "90px", height: "64px", objectFit: "cover", borderRadius: "6px", border: "1px solid var(--border,#ddd)" } }));
          const linkRow = el("div", { style: { display: "flex", gap: "6px" } });
          linkRow.appendChild(el("a", { href: url, target: "_blank", class: "btn ghost", style: { fontSize: "12px", padding: "2px 8px" } }, "View"));
          if (u.role === "owner") {
            linkRow.appendChild(el("button", { class: "btn bad", style: { fontSize: "12px", padding: "2px 8px" },
              onClick: () => {
                usr.id_photo_urls = (usr.id_photo_urls || []).filter((_, j) => j !== i);
                saveState(); toast("ID photo removed"); renderPhotos();
              }
            }, "\u2715 Remove"));
          }
          card.appendChild(linkRow);
          grid.appendChild(card);
        });
        photosWrap.appendChild(grid);
      }
    }
    renderPhotos();
    sheet.appendChild(el("div", { class: "btn-row" }, [
      el("button", { class: "btn ghost", onClick: () => closeSheet() }, "Close"),
    ]));
    openSheet(sheet);
  }

  return wrap;
};



// ==============================================================
// DASHBOARD + P&L CLOSE
