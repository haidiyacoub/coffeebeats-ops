routes.bank = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Bank ledger (owner)", "Bank & card payments only. Petty cash is tracked separately below."));

  // ── Petty Cash Summary (completely separate from bank) ──────
  const pcMaadi   = pettyCashBalance("maadi");
  const pcZawya   = pettyCashBalance("zawya");
  const pcCombined = pcMaadi + pcZawya;
  const pcCard = el("div", { class: "card", style: { borderColor: "var(--accent)", marginBottom: "16px" } });
  pcCard.appendChild(el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px", marginBottom: "8px" } }, "💵 Petty Cash — both branches"));
  pcCard.appendChild(el("div", { style: { display: "flex", gap: "16px", flexWrap: "wrap", alignItems: "flex-end" } }, [
    el("div", {}, [
      el("div", { class: "muted small" }, "Maadi"),
      el("div", { style: { fontSize: "22px", fontWeight: "700", color: pcMaadi < 0 ? "var(--bad)" : "var(--ink)" } }, money(pcMaadi)),
    ]),
    el("div", { style: { color: "var(--border)", fontSize: "20px", paddingBottom: "2px" } }, "+"),
    el("div", {}, [
      el("div", { class: "muted small" }, "Zawya"),
      el("div", { style: { fontSize: "22px", fontWeight: "700", color: pcZawya < 0 ? "var(--bad)" : "var(--ink)" } }, money(pcZawya)),
    ]),
    el("div", { style: { color: "var(--border)", fontSize: "20px", paddingBottom: "2px" } }, "="),
    el("div", {}, [
      el("div", { class: "muted small" }, "Combined"),
      el("div", { style: { fontSize: "26px", fontWeight: "700", color: pcCombined < PETTY_CASH_ALERT ? "var(--bad)" : "var(--ok)" } }, money(pcCombined)),
    ]),
  ]));
  if (pcCombined < PETTY_CASH_ALERT) {
    pcCard.appendChild(el("div", { class: "muted small", style: { color: "var(--bad)", marginTop: "6px" } }, `⚠ Combined below ${money(PETTY_CASH_ALERT)} — top-up needed`));
  }
  wrap.appendChild(pcCard);

  // ── Bank entries only (exclude petty_cash_topup) ────────────
  const BANK_TYPES = new Set(["purchase_payment","purchase_credit_card","manual","maadi_deposit"]);
  const allSorted  = state.bank_ledger.slice().sort((a,b) => b.at.localeCompare(a.at));
  const bankRows   = allSorted.filter(r => r.type !== "petty_cash_topup").slice(0, 200);
  const topupRows  = allSorted.filter(r => r.type === "petty_cash_topup").slice(0, 200);
  const bankTotal  = bankRows.reduce((s,r) => s + (Number(r.amount)||0), 0);

  wrap.appendChild(el("div", { class: "card", style: { marginBottom: "8px" } }, [
    el("div", { class: "muted" }, "🏦 Bank — net outflow (last 200 entries)"),
    el("div", { style: { fontSize: "26px", fontWeight: "700" } }, money(bankTotal)),
  ]));

  wrap.appendChild(el("button", { class: "btn secondary", style: { marginTop:"12px", marginBottom:"8px" }, onClick: addManualBank }, "➕ Log manual bank entry"));

  // toggle to show petty cash top-ups
  let showTopups = false;
  const toggleBtn = el("button", { class: "btn ghost small", style: { marginLeft: "8px", marginTop:"12px", marginBottom:"8px" }, onClick: () => {
    showTopups = !showTopups;
    toggleBtn.textContent = showTopups ? "Hide petty cash top-ups" : "Show petty cash top-ups";
    topupSection.style.display = showTopups ? "" : "none";
  }}, "Show petty cash top-ups");
  wrap.appendChild(toggleBtn);

  function makeEntryRow(r) {
    const typeLabel = {
      purchase_payment: "Bank transfer",
      purchase_credit_card: "Credit card",
      petty_cash_topup: "Petty cash top-up",
      maadi_deposit: "Maadi ATM deposit",
      manual: "Manual",
    }[r.type] || r.type;
    return el("div", { class: "row" }, [
      el("div", { class: "grow" }, [
        el("div", { class: "title" }, `${r.supplier || "—"} — ${money(r.amount)}`),
        el("div", { class: "sub" }, `${r.date} · ${typeLabel}${r.note ? ` · ${r.note}` : ""}`),
        el("div", { class: "sub" }, `by ${r.by_name || "—"} · ${fmtDate(r.at)}`),
      ]),
    ]);
  }

  const bankList = el("div", { class: "list" });
  for (const r of bankRows) bankList.appendChild(makeEntryRow(r));
  if (bankRows.length === 0) bankList.appendChild(el("div", { class: "muted" }, "No bank entries yet."));
  wrap.appendChild(bankList);

  // Petty cash top-ups section (hidden by default)
  const topupTotal = topupRows.reduce((s,r) => s + (Number(r.amount)||0), 0);
  const topupSection = el("div", { style: { display: "none", marginTop: "16px" } });
  topupSection.appendChild(el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px", marginBottom: "6px" } }, `💵 Petty cash top-ups — ${money(topupTotal)}`));
  const topupList = el("div", { class: "list" });
  for (const r of topupRows) topupList.appendChild(makeEntryRow(r));
  if (topupRows.length === 0) topupList.appendChild(el("div", { class: "muted" }, "No top-up entries yet."));
  topupSection.appendChild(topupList);
  wrap.appendChild(topupSection);

  wrap.appendChild(btnBack());

  function addManualBank() {
    openPrompt({
      title: "Manual bank entry",
      fields: [
        { key: "date", label: "Date", type: "date", value: new Date().toISOString().slice(0,10) },
        { key: "supplier", label: "Payee", type: "text", value: "" },
        { key: "amount", label: "Amount (positive inflow, negative outflow)", type: "number", value: 0 },
        { key: "note", label: "Note", type: "text", value: "" },
      ],
      onSubmit: (v) => {
        const amt = Number(v.amount); if (!amt) return toast("Amount required", "error");
        const s = stamp();
        state.bank_ledger.push({ id: uuid(), date: v.date, amount: amt, supplier: v.supplier, type: "manual", by: s.by, by_name: s.by_name, at: s.at, note: v.note });
        saveState(); toast("Saved"); render();
      }
    });
  }
  return wrap;
};

// ==============================================================
// SALES IMPORT
// ==============================================================
routes.sales_import = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Upload monthly POS sales", "CSV from Foodics / your POS. We match items by name or SKU."));

  wrap.appendChild(el("div", { class: "banner-arch" },
    "Pick a branch, pick a month (used if the CSV has no date column or dates can't be parsed), then upload the CSV. " +
    "When the branch is ZAWYA, Popcorn, Soft Drinks, Snacks and Merchandise are auto-removed."));

  let branchDefault = "maadi";
  const branchPicker = makeBranchPicker(["maadi","zawya"], () => branchDefault, b => { branchDefault = b; });
  wrap.appendChild(branchPicker);

  // ---- Month override (used when dates are missing or unparseable) ----
  const monthFallback = el("input", {
    type: "month",
    value: new Date().toISOString().slice(0,7),
    style: { padding: "8px", borderRadius: "8px", border: "1px solid var(--border)" }
  });
  wrap.appendChild(el("div", { class: "card", style: { display: "flex", gap: "12px", alignItems: "center", flexWrap: "wrap" } }, [
    el("div", { class: "muted small" }, "Fallback month (used if CSV rows have no parseable date)"),
    monthFallback,
    el("label", { style: { display: "flex", gap: "6px", alignItems: "center", marginLeft: "12px" } }, [
      (() => {
        const cb = el("input", { type: "checkbox" });
        cb.id = "_salesForceMonth";
        return cb;
      })(),
      el("span", { class: "muted small" }, "Force ALL rows into the fallback month (ignore CSV dates)"),
    ]),
  ]));

  const fInput = el("input", { type: "file", accept: ".csv,.xlsx,.xls,text/csv" });
  wrap.appendChild(fInput);

  // Running state-of-the-world card — always visible so the owner can see what's loaded right now
  const stateCard = el("div", { class: "card", style: { marginTop: "12px", borderColor: "var(--accent)" } });
  wrap.appendChild(stateCard);
  renderStateCard();

  function renderStateCard() {
    stateCard.innerHTML = "";
    stateCard.appendChild(el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } }, "Sales already in the app"));
    const byKey = new Map();
    for (const s of state.sales) {
      const br = (s.branch || "").toLowerCase();
      const m = (s.date || "").slice(0,7);
      const k = br + "|" + m;
      byKey.set(k, (byKey.get(k) || 0) + 1);
    }
    const combos = [...byKey.entries()].map(([k,n]) => { const [b,m] = k.split("|"); return { b, m, n }; })
      .sort((a,b) => (b.m||"").localeCompare(a.m||""));
    stateCard.appendChild(el("div", { style: { fontSize: "22px", fontWeight: "700" } }, `${state.sales.length} rows total`));
    if (combos.length === 0) {
      stateCard.appendChild(el("div", { class: "muted small" }, "No sales in the app yet."));
    } else {
      const pills = el("div", { style: { display: "flex", flexWrap: "wrap", gap: "6px", marginTop: "8px" } });
      for (const c of combos.slice(0, 24)) {
        pills.appendChild(el("span", { class: "chip" }, `${c.b || "?"} · ${c.m || "?"} (${c.n})`));
      }
      stateCard.appendChild(pills);
    }
    if (u.role === "owner" && state.sales.length > 0) {
      // Selective delete row
      const selRow = el("div", { style: { display: "flex", gap: "8px", alignItems: "center", flexWrap: "wrap", marginTop: "12px" } });

      const branchOpts = [el("option", { value: "" }, "All branches"), ...([...new Set(combos.map(c => c.b))].sort().map(b => el("option", { value: b }, b || "?")))]
      const monthOpts  = [el("option", { value: "" }, "All months"),  ...([...new Set(combos.map(c => c.m))].sort().reverse().map(m => el("option", { value: m }, m || "?")))]

      const brSel = el("select", { style: { padding: "6px 10px", borderRadius: "8px", border: "1px solid var(--border)", background: "var(--card)", color: "var(--fg)", fontSize: "14px" } }, branchOpts);
      const moSel = el("select", { style: { padding: "6px 10px", borderRadius: "8px", border: "1px solid var(--border)", background: "var(--card)", color: "var(--fg)", fontSize: "14px" } }, monthOpts);

      const delSelBtn = el("button", { class: "btn ghost", style: { color: "var(--warn)" }, onClick: () => {
        const br = brSel.value;
        const mo = moSel.value;
        const toDelete = state.sales.filter(s => {
          const matchBr = !br || (s.branch || "").toLowerCase() === br;
          const matchMo = !mo || (s.date || "").startsWith(mo);
          return matchBr && matchMo;
        });
        if (toDelete.length === 0) { toast("No matching rows", "error"); return; }
        const label = [br || "all branches", mo || "all months"].join(" · ");
        if (!confirm(`Delete ${toDelete.length} rows for ${label}? This can't be undone.`)) return;
        const ids = new Set(toDelete.map(s => s.id || JSON.stringify(s)));
        state.sales = state.sales.filter(s => !ids.has(s.id || JSON.stringify(s)));
        saveState();
        toast(`Deleted ${toDelete.length} rows (${label})`);
        renderStateCard();
      }}, "🗑 Delete selected");

      selRow.appendChild(brSel);
      selRow.appendChild(moSel);
      selRow.appendChild(delSelBtn);
      stateCard.appendChild(selRow);

      stateCard.appendChild(el("button", { class: "btn ghost", style: { marginTop: "8px", fontSize: "12px", opacity: "0.6" }, onClick: () => {
        if (!confirm(`Delete all ${state.sales.length} sales rows? This can't be undone.`)) return;
        state.sales = [];
        saveState();
        toast("All sales cleared");
        render();
      }}, "🗑 Clear ALL sales (owner only)"));
    }
  }

  // ---- File 2: order items ----
  wrap.appendChild(el("div", { class: "muted small", style: { marginTop: "14px", textTransform: "uppercase", letterSpacing: "1px" } }, "File 2 — Order Items (optional)"));
  wrap.appendChild(el("div", { class: "banner-arch" }, 'Named "{Branch} order items {Month} {Year}.xlsx" — provides actual quantities, ticket size, COGS, and margin per item.'));
  const fInput2 = el("input", { type: "file", accept: ".xlsx,.xls" });
  wrap.appendChild(fInput2);
  const preview2 = el("div", { class: "card", style: { marginTop: "10px", display: "none" } });
  wrap.appendChild(preview2);
  let parsedOrderItems = null;

  fInput2.addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    const detected = detectOrderItemsFilename(f.name);
    if (!detected) { toast("Filename must be: Branch order items Month Year.xlsx", "error"); return; }
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array", cellDates: true });
    parsedOrderItems = { rows: parseOrderItemsSheet(wb, detected.branch, detected.isoMonth), branch: detected.branch, month: detected.isoMonth };
    preview2.style.display = "block";
    preview2.innerHTML = "";
    preview2.appendChild(el("div", { class: "banner-arch" },
      `✓ ${detected.branch} · ${detected.isoMonth} — ${parsedOrderItems.rows.length} product lines (modifiers excluded)`));
    // Qty per item summary
    const qtyMap = new Map();
    for (const r of parsedOrderItems.rows) qtyMap.set(r.name, (qtyMap.get(r.name)||0) + (r.qty||1));
    const topItems = [...qtyMap.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10);
    // COGS preview using menu
    const normName = (s) => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\([^)]*\)/g," ").replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();
    const menuByName = new Map(state.menu.map(m => [normName(m.name), m]));
    const tbl2 = el("table", {}, [
      el("thead", {}, el("tr", {}, ["Item","Qty Sold","Unit Price","COGS%","Margin%"].map(h=>el("th",{},h)))),
      el("tbody", {}, topItems.map(([name, qty]) => {
        const m = menuByName.get(normName(name));
        const price = m?.price_egp || (parsedOrderItems.rows.find(r=>r.name===name)?.unit_price) || 0;
        const cost  = m?.cost_egp || 0;
        const cogsPct   = (price && cost) ? (cost/price*100) : null;
        const marginPct = (price && cost) ? ((price-cost)/price*100) : null;
        return el("tr", {}, [
          el("td", {}, name),
          el("td", { class:"num" }, String(qty)),
          el("td", { class:"num" }, price ? money(price) : "—"),
          el("td", { class:"num", style:{color: cogsPct!=null?(cogsPct>35?"var(--bad)":cogsPct>28?"var(--warn)":"var(--ok)"):"inherit"} }, cogsPct!=null ? cogsPct.toFixed(1)+"%" : "—"),
          el("td", { class:"num", style:{color: marginPct!=null?(marginPct>60?"var(--ok)":marginPct>40?"var(--warn)":"var(--bad)"):"inherit"} }, marginPct!=null ? marginPct.toFixed(1)+"%" : "—"),
        ]);
      })),
    ]);
    preview2.appendChild(tbl2);
  });

  // ---- File 3: orders (barista attribution) ----
  wrap.appendChild(el("div", { class: "muted small", style: { marginTop: "14px", textTransform: "uppercase", letterSpacing: "1px" } }, "File 3 — Orders (barista attribution, optional)"));
  wrap.appendChild(el("div", { class: "banner-arch" }, 'Named "{Branch} orders {Month} {Year}.xlsx" — links each order to the barista who created it. Feeds Upselling KPI automatically.'));
  const fInput3 = el("input", { type: "file", accept: ".xlsx,.xls" });
  wrap.appendChild(fInput3);
  const preview3 = el("div", { class: "card", style: { marginTop: "10px", display: "none" } });
  wrap.appendChild(preview3);
  let parsedOrders = null;

  fInput3.addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    const detected = detectOrdersFilename(f.name);
    if (!detected) { toast("Filename must be: Branch orders Month Year.xlsx", "error"); return; }
    const buf = await f.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array", cellDates: true });
    parsedOrders = { rows: parseOrdersSheet(wb, detected.branch, detected.isoMonth), branch: detected.branch, month: detected.isoMonth };
    preview3.style.display = "block";
    preview3.innerHTML = "";
    preview3.appendChild(el("div", { class: "banner-arch" },
      `✓ ${detected.branch} · ${detected.isoMonth} — ${parsedOrders.rows.length} orders attributed`));
    // Ticket size preview per barista (if File 2 also loaded for same branch/month)
    const matchingItems = (state.order_items||[]).concat(parsedOrderItems?.branch===detected.branch && parsedOrderItems?.month===detected.isoMonth ? parsedOrderItems.rows : []);
    const orderQty = new Map();
    for (const i of matchingItems) orderQty.set(i.order_ref, (orderQty.get(i.order_ref)||0)+(Number(i.qty)||1));
    const byBarista = new Map();
    for (const o of parsedOrders.rows) {
      const qty = orderQty.get(o.order_ref) || 1;
      const cur = byBarista.get(o.barista_name) || { orders:0, totalItems:0 };
      cur.orders++; cur.totalItems += qty;
      byBarista.set(o.barista_name, cur);
    }
    if (byBarista.size > 0) {
      const tbl3 = el("table", {}, [
        el("thead", {}, el("tr", {}, ["Barista","Orders","Total Items","Avg Ticket","Upselling Score"].map(h=>el("th",{},h)))),
        el("tbody", {}, [...byBarista.entries()].sort((a,b)=>b[1].totalItems/b[1].orders - a[1].totalItems/a[1].orders).map(([name,d]) => {
          const avg = d.orders>0 ? d.totalItems/d.orders : 1;
          const score = Math.round(Math.max(0, Math.min(100, (avg-1.0)/2.0*100)));
          return el("tr", {}, [
            el("td",{},name),
            el("td",{class:"num"},String(d.orders)),
            el("td",{class:"num"},String(d.totalItems)),
            el("td",{class:"num"},avg.toFixed(2)),
            el("td",{class:"num",style:{color:score>=70?"var(--ok)":score>=40?"var(--warn)":"var(--bad)"}},score+"/100"),
          ]);
        })),
      ]);
      preview3.appendChild(tbl3);
    } else {
      preview3.appendChild(el("div", { class: "muted small" }, "Upload File 2 first to see ticket size breakdown."));
    }
  });

  // ---- Import all button ----
  const importAllBtn = el("button", { class: "btn", style: { marginTop: "16px", width: "100%" }, onClick: () => commitAll() }, "Import All Uploaded Files");
  wrap.appendChild(importAllBtn);

  const preview = el("div", { class: "card", style: { marginTop: "14px", display: "none" } });
  wrap.appendChild(preview);
  let parsed = null;
  let parseContext = null;

  fInput.addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    const detected = detectBranchSalesFilename(f.name);
    if (detected && /\.(xlsx|xls)$/i.test(f.name)) {
      const buf = await f.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array", cellDates: true });
      parsed = parseBranchSalesSheet(wb, detected.branch, detected.isoMonth);
      branchDefault = detected.branch;
      branchPicker.querySelectorAll(".tab").forEach(tab => {
        tab.classList.toggle("on", tab.textContent.toLowerCase() === detected.branch);
      });
      monthFallback.value = detected.isoMonth;
      parseContext = { filename: f.name, mode: "fixed-column", branch: detected.branch, month: detected.isoMonth };
    } else {
      const text = await readFileAsCSV(f);
      const forceMonth = $("#_salesForceMonth")?.checked || false;
      parsed = parseSalesCSV(text, branchDefault, monthFallback.value, forceMonth);
      parseContext = { filename: f.name, forceMonth, fallback: monthFallback.value };
    }
    renderPreview();
  });

  function renderPreview() {
    preview.style.display = "block";
    preview.innerHTML = "";
    preview.appendChild(el("h2", {}, `Preview — ${parsed.rows.length} rows`));

    if (parseContext?.mode === "fixed-column") {
      preview.appendChild(el("div", { class: "banner-arch" },
        `✓ Detected format: ${parseContext.branch} · ${parseContext.month} — reading fixed columns A (item), C (category), G (net sales), I (discount)`));
    }

    // --- Column mapping diagnostic (hidden in fixed-column mode) ---
    if (parseContext?.mode !== "fixed-column") {
    const mapCard = el("div", { class: "card" });
    mapCard.appendChild(el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } }, "Column mapping"));
    const mapList = el("div", {});
    const labels = { date: "Date", item: "Item", sku: "SKU", qty: "Qty", net: "Net Sales", gross: "Gross Sales", disc: "Discount (total)", disc_unit: "Discount per unit", disc_name: "Discount type", type: "Row type", cat: "Category", branch: "Branch" };
    for (const [key, idx] of Object.entries(parsed.mapping)) {
      mapList.appendChild(el("div", { class: "kv" }, [
        el("div", { class: "k" }, labels[key] || key),
        el("div", { class: "v", style: { color: idx < 0 ? "var(--bad)" : "var(--ok)" } },
          idx < 0 ? "— not found —" : `[col ${idx}] "${parsed.headerRaw[idx]}"`),
      ]));
    }
    mapCard.appendChild(mapList);
    mapCard.appendChild(el("div", { class: "muted small", style: { marginTop: "6px" } },
      `Headers seen: ${parsed.headerRaw.slice(0, 14).map(h => `"${h}"`).join(", ")}${parsed.headerRaw.length > 14 ? ` … (+${parsed.headerRaw.length - 14} more)` : ""}`));
    preview.appendChild(mapCard);
    } // end non-fixed-column

    // Optional manual override ui for critical columns
    if (parseContext?.mode !== "fixed-column" && (parsed.mapping.date < 0 || parsed.mapping.item < 0 || parsed.mapping.qty < 0)) {
      const override = el("div", { class: "card", style: { borderColor: "var(--bad)" } });
      override.appendChild(el("div", { class: "muted small" }, "Pick the right column if auto-detect missed one:"));
      const pickers = {};
      for (const key of ["date","item","sku","qty","net","gross","branch","cat"]) {
        const sel = el("select", {}, [
          el("option", { value: "-1" }, `— ${labels[key]}: not set —`),
          ...parsed.headerRaw.map((h,i) => el("option", { value: String(i), ...(parsed.mapping[key] === i ? { selected: true } : {}) }, `${i}: ${h}`)),
        ]);
        pickers[key] = sel;
        override.appendChild(el("label", { style: { display: "block", marginTop: "4px" } }, [ labels[key] + ": ", sel ]));
      }
      override.appendChild(el("button", { class: "btn secondary", style: { marginTop: "8px" }, onClick: () => {
        const newMap = {};
        for (const k of Object.keys(pickers)) newMap[k] = Number(pickers[k].value);
        parsed = parseSalesCSVFromMapping(parsed.rawLines, parsed.headerRaw, branchDefault, monthFallback.value, $("#_salesForceMonth")?.checked, newMap);
        renderPreview();
      }}, "Re-parse with my column choices"));
      preview.appendChild(override);
    }

    // --- Row-summary diagnostic ---
    const info = [];
    info.push(`${parsed.rows.length} kept`);
    if (parsed.droppedZawya)    info.push(`${parsed.droppedZawya} Zawya exclusions removed`);
    if (parsed.droppedModifier) info.push(`${parsed.droppedModifier} modifier option rows skipped`);
    if (parsed.droppedNoItem)   info.push(`${parsed.droppedNoItem} rows had no item`);
    if (parsed.usedFallbackDate) info.push(parseContext?.mode === "fixed-column" ? `${parsed.usedFallbackDate} rows dated to ${parseContext.month}` : `${parsed.usedFallbackDate} rows used the fallback month (no parseable date)`);
    if (parsed.warnings.length) info.push(parsed.warnings.join(" · "));
    preview.appendChild(el("div", { class: "muted small" }, info.join(" · ")));

    // Per-month bucket
    const byMonth = new Map();
    for (const r of parsed.rows) {
      const m = (r.date || "").slice(0,7);
      byMonth.set(m, (byMonth.get(m) || 0) + 1);
    }
    const monthBreak = el("div", { style: { display: "flex", gap: "6px", flexWrap: "wrap", marginTop: "8px" } });
    for (const [m, n] of [...byMonth.entries()].sort()) {
      monthBreak.appendChild(el("span", { class: "chip" }, `${m || "no-date"} · ${n}`));
    }
    preview.appendChild(monthBreak);

    const tbl = el("table", {}, [
      el("thead", {}, el("tr", {}, ["Date","Item","SKU","Qty","Net","Gross","Branch"].map(h => el("th", {}, h)))),
      el("tbody", {}, parsed.rows.slice(0, 30).map(r => el("tr", {}, [
        el("td", {}, r.date || ""), el("td", {}, r.item || ""), el("td", {}, r.sku || ""),
        el("td", { class: "num" }, String(r.qty)), el("td", { class: "num" }, money(r.net)), el("td", { class: "num" }, money(r.gross)),
        el("td", {}, r.branch || ""),
      ]))),
    ]);
    preview.appendChild(tbl);
    preview.appendChild(el("button", { class: "btn", style: { marginTop: "12px" }, onClick: () => commit() }, `Import ${parsed.rows.length} rows`));
  }

  function commit() {
    if (!parsed || parsed.rows.length === 0) return toast("Nothing to import", "error");
    const s = stamp();
    const batch = uuid();
    const importedBranches = new Set();
    const importedMonths = new Set();
    for (const r of parsed.rows) {
      const br = (String(r.branch || branchDefault).toLowerCase().includes("zawya")) ? "zawya"
               : (String(r.branch || branchDefault).toLowerCase().includes("maadi")) ? "maadi"
               : String(r.branch || branchDefault).toLowerCase();
      state.sales.push({
        id: uuid(), batch, at: s.at, by: s.by, by_name: s.by_name, device: s.device,
        branch: br,
        date: r.date, item: r.item, sku: r.sku, qty: r.qty,
        gross_sales: r.gross, net_sales: r.net, discount: r.discount, discount_name: r.discount_name || "",
        category: r.category,
      });
      importedBranches.add(br);
      if (r.date && r.date.length >= 7) importedMonths.add(r.date.slice(0,7));
    }
    // Save excluded revenue so dashboard can compute CB% of total venue sales
    if ((parsed.zawyaExcludedNet || 0) > 0 || (parsed.zawyaExcludedGross || 0) > 0) {
      state.sales_meta = state.sales_meta || [];
      const metaMonths = importedMonths.size > 0 ? [...importedMonths] : [monthFallback.value || new Date().toISOString().slice(0,7)];
      // Remove stale entries for these months before inserting to prevent accumulation on re-upload
      state.sales_meta = state.sales_meta.filter(m => !(m.branch === "zawya" && metaMonths.includes(m.month)));
      for (const m of metaMonths) {
        state.sales_meta.push({ id: uuid(), batch, branch: "zawya", month: m, excluded_net: parsed.zawyaExcludedNet || 0, excluded_gross: parsed.zawyaExcludedGross || 0 });
      }
    }
    saveState();
    const branchList = [...importedBranches].join(", ") || branchDefault;
    const monthList = [...importedMonths].sort().join(", ") || "—";
    toast(`✓ Imported ${parsed.rows.length} rows · branches: ${branchList} · months: ${monthList}`);
    const targetMonth = [...importedMonths].sort().pop() || monthFallback.value;
    const targetBranch = importedBranches.has(branchDefault) ? branchDefault : ([...importedBranches][0] || branchDefault);
    go("dashboard", { month: targetMonth, branch: targetBranch });
  }

  function commitAll() {
    const s = stamp();
    const parts = [];

    // File 1 — sales rows
    if (parsed && parsed.rows.length > 0) {
      const batch = uuid();
      const importedBranches = new Set();
      const importedMonths = new Set();
      for (const r of parsed.rows) {
        const br = (String(r.branch || branchDefault).toLowerCase().includes("zawya")) ? "zawya"
                 : (String(r.branch || branchDefault).toLowerCase().includes("maadi")) ? "maadi"
                 : String(r.branch || branchDefault).toLowerCase();
        state.sales.push({
          id: uuid(), batch, at: s.at, by: s.by, by_name: s.by_name, device: s.device,
          branch: br, date: r.date, item: r.item, sku: r.sku, qty: r.qty,
          gross_sales: r.gross, net_sales: r.net, discount: r.discount, discount_name: r.discount_name || "",
          category: r.category,
        });
        importedBranches.add(br);
        if (r.date && r.date.length >= 7) importedMonths.add(r.date.slice(0,7));
      }
      parts.push(`File 1: ${parsed.rows.length} sales rows`);
      // Save excluded revenue so dashboard can compute CB% of total venue sales
      if ((parsed.zawyaExcludedNet || 0) > 0 || (parsed.zawyaExcludedGross || 0) > 0) {
        state.sales_meta = state.sales_meta || [];
        const metaMonths = importedMonths.size > 0 ? [...importedMonths] : [monthFallback.value || new Date().toISOString().slice(0,7)];
        // Remove stale entries for these months before inserting to prevent accumulation on re-upload
        state.sales_meta = state.sales_meta.filter(m => !(m.branch === "zawya" && metaMonths.includes(m.month)));
        for (const m of metaMonths) {
          state.sales_meta.push({ id: uuid(), batch, branch: "zawya", month: m, excluded_net: parsed.zawyaExcludedNet || 0, excluded_gross: parsed.zawyaExcludedGross || 0 });
        }
      }
    }

    // File 2 — order items
    if (parsedOrderItems && parsedOrderItems.rows.length > 0) {
      // Remove existing order_items for this branch+month before re-importing
      state.order_items = (state.order_items || []).filter(
        i => !(i.branch === parsedOrderItems.branch && i.month === parsedOrderItems.month));
      const batch = uuid();
      for (const r of parsedOrderItems.rows) {
        state.order_items.push({ id: uuid(), batch, at: s.at, by: s.by, by_name: s.by_name,
          branch: r.branch, month: r.month, date: r.date, order_ref: r.order_ref,
          name: r.name, unit_price: r.unit_price, qty: r.qty,
          discount: r.discount, disc_name: r.disc_name });
      }
      parts.push(`File 2: ${parsedOrderItems.rows.length} order lines`);
    }

    // File 3 — orders / barista attribution
    if (parsedOrders && parsedOrders.rows.length > 0) {
      state.orders = (state.orders || []).filter(
        o => !(o.branch === parsedOrders.branch && o.month === parsedOrders.month));
      const batch = uuid();
      for (const r of parsedOrders.rows) {
        state.orders.push({ id: uuid(), batch, at: s.at, by: s.by, by_name: s.by_name,
          branch: r.branch, month: r.month, date: r.date, order_ref: r.order_ref, barista_name: r.barista_name });
      }
      parts.push(`File 3: ${parsedOrders.rows.length} orders`);
    }

    if (parts.length === 0) return toast("No files loaded yet", "error");
    saveState();
    toast("✓ Imported — " + parts.join(" · "));
    const targetMonth = parsedOrderItems?.month || parsedOrders?.month || monthFallback.value;
    const targetBranch = parsedOrderItems?.branch || parsedOrders?.branch || branchDefault;
    go("dashboard", { month: targetMonth, branch: targetBranch });
  }

  wrap.appendChild(btnBack());
  return wrap;
};

// ---- CSV helpers (shared) ----

function detectBranchSalesFilename(filename) {
  const MONTHS = { january:"01",february:"02",march:"03",april:"04",may:"05",june:"06",
    july:"07",august:"08",september:"09",october:"10",november:"11",december:"12" };
  const base = filename.replace(/\.[^.]+$/, "").toLowerCase().trim();
  const m = base.match(/^(.+?)\s+sales\s+(january|february|march|april|may|june|july|august|september|october|november|december)\s+(\d{4})$/);
  if (!m) return null;
  const rawBranch = m[1].trim();
  const branch = rawBranch.includes("zawya") ? "zawya" : rawBranch.includes("maadi") ? "maadi" : rawBranch;
  const isoMonth = `${m[3]}-${MONTHS[m[2]]}`;
  return { branch, isoMonth };
}

function parseBranchSalesSheet(wb, branch, isoMonth) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
  const dataRows = raw.slice(6); // rows 0–4 preamble, row 5 header, data at row 6+
  const fbDate = isoMonth + "-15";
  const toNum = (x) => { const n = Number(String(x||"").replace(/[,\s]/g,"")); return isNaN(n) ? 0 : n; };
  const rows = [];
  let droppedNoItem = 0, droppedZawya = 0, zawyaExcludedNet = 0, zawyaExcludedGross = 0;
  for (const r of dataRows) {
    const item     = String(r[0] || "").trim();   // Col A — product name
    const category = String(r[2] || "").trim();   // Col C — category
    const net      = toNum(r[6]);                 // Col G — net sales with tax
    const discount = toNum(r[8]);                 // Col I — discount amount
    if (!item) { droppedNoItem++; continue; }
    if (branch === "zawya" && isZawyaExcluded(category, item)) { droppedZawya++; zawyaExcludedNet += net; zawyaExcludedGross += net + discount; continue; }
    rows.push({ date: fbDate, item, sku: "", qty: 1, net, gross: net + discount, discount, discount_name: "", category, branch });
  }
  return { rows, warnings: [], droppedZawya, zawyaExcludedNet, zawyaExcludedGross, droppedNoItem, droppedModifier: 0, usedFallbackDate: rows.length, mapping: {}, headerRaw: [], rawLines: [], detectedBranch: branch, detectedMonth: isoMonth };
}

// Returns { branch, isoMonth } if filename matches "{Branch} order items {Month} {Year}"
function detectOrderItemsFilename(filename) {

  const base = filename.replace(/\.[^.]+$/, "").toLowerCase().trim();
  const m = base.match(/^(.+?)\s+order\s+items\s+(january|february|march|april|may|june|july|august|september|october|november|december)\s+(\d{4})$/);
  if (!m) return null;

}

// Returns { branch, isoMonth } if filename matches "{Branch} orders {Month} {Year}"
function detectOrdersFilename(filename) {

}

// Parses "{Branch} order items {Month} {Year}" Excel format.
// Rows 0–4 preamble, row 5 header, data at row 6+.
/** Try to extract a YYYY-MM-DD date from a Foodics order_ref string.
 *  Foodics refs are typically "2026-06-05-00123" or "20260605-00123".
 *  Falls back to isoMonth + "-15" when no date can be found. */
function extractDateFromOrderRef(orderRef, isoMonth) {
  const s = String(orderRef || "");
  // Pattern 1: YYYY-MM-DD anywhere in the string
  const m1 = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m1 && m1[2] >= "01" && m1[2] <= "12" && m1[3] >= "01" && m1[3] <= "31") {
    const d = `${m1[1]}-${m1[2]}-${m1[3]}`;
    if (d.slice(0,7) === isoMonth) return d; // sanity: must be in expected month
  }
  // Pattern 2: YYYYMMDD at the start
  const m2 = s.match(/^(\d{4})(\d{2})(\d{2})/);
  if (m2 && m2[2] >= "01" && m2[2] <= "12" && m2[3] >= "01" && m2[3] <= "31") {
    const d = `${m2[1]}-${m2[2]}-${m2[3]}`;
    if (d.slice(0,7) === isoMonth) return d;
  }
  return isoMonth + "-15"; // mid-month placeholder
}

// A(0)=order_reference, D(3)=order_type, H(7)=name, J(9)=unit_price, L(11)=qty, O(14)=discount, P(15)=discount_name, U(20)=date
function parseOrderItemsSheet(wb, branch, isoMonth) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", cellDates: true });
  const dataRows = raw.slice(6);
  const toNum = (x) => { const n = Number(String(x||"").replace(/[,\s]/g,"")); return isNaN(n) ? 0 : n; };
  const parseColDate = (v) => {
    if (!v) return null;
    if (v instanceof Date) return v.toISOString().slice(0,10);
    const s = String(v).trim();
    const m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    return null;
  };
  const rows = [];
  for (const r of dataRows) {
    const order_ref  = String(r[0]  || "").trim();
    const order_type = String(r[3]  || "").trim().toLowerCase();
    const name       = String(r[7]  || "").trim();
    const unit_price = toNum(r[9]);
    const qty        = toNum(r[11]) || 1;
    const discount   = toNum(r[14]);
    const disc_name  = String(r[15] || "").trim();
    if (!order_ref || !name) continue;
    if (order_type === "modifier" || order_type === "modifier option") continue;
    if (branch === "zawya" && isZawyaExcluded("", name)) continue;
    const date = parseColDate(r[20]) || extractDateFromOrderRef(order_ref, isoMonth);
    rows.push({ order_ref, name, unit_price, qty, discount, disc_name, branch, month: isoMonth, date });
  }
  return rows;
}

// Parses "{Branch} orders {Month} {Year}" Excel format.
// Rows 0–4 preamble, row 5 header, data at row 6+.
// A(0)=order_reference, J(9)=date, X(23)=barista_name
function parseOrdersSheet(wb, branch, isoMonth) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", cellDates: true });
  const dataRows = raw.slice(6);
  const parseColDate = (v) => {
    if (!v) return null;
    if (v instanceof Date) return v.toISOString().slice(0,10);
    const s = String(v).trim();
    const m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    return null;
  };
  const rows = [];
  for (const r of dataRows) {
    const order_ref    = String(r[0]  || "").trim();
    const barista_name = String(r[23] || "").trim();
    if (!order_ref || !barista_name) continue;
    const date = parseColDate(r[9]) || extractDateFromOrderRef(order_ref, isoMonth);
    rows.push({ order_ref, barista_name, branch, month: isoMonth, date });
  }
  return rows;
}

function _csvParseLine(ln) {
  const out = []; let cur = ""; let q = false;
  for (let i=0; i<ln.length; i++) {
    const c = ln[i];
    if (q) {
      if (c === '"' && ln[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else {
      if (c === '"') q = true;
      else if (c === ',') { out.push(cur); cur = ""; }
      else cur += c;
    }
  }
  out.push(cur); return out;
}

function _salesHeaderMap(headerLower) {
  const col = (names) => { for (const n of names) { const idx = headerLower.indexOf(n); if (idx !== -1) return idx; } return -1; };
  // Wide alias list covering Foodics (new format), Square, generic POS exports, and minor naming drift
  return {
    date:      col(["business_date","date","business date","day","order date","transaction date","sales date","sold at","created","created at","time","timestamp","datetime","business day"]),
    item:      col(["item","name","product","item name","product name","menu item","menu item name","description","sku name"]),
    sku:       col(["sku","item id","product sku","item sku","menu item sku","barcode","code"]),
    qty:       col(["quantity","qty","net quantity","sold qty","sold quantity","items sold","count","units","units sold","item qty"]),
    net:       col(["net sales","net","net_sales","net amount","net revenue","total net","net total","net sale"]),
    gross:     col(["total_price","gross sales","gross","gross_sales","gross amount","gross revenue","total gross","gross total","subtotal","sales","revenue","total"]),
    disc:      col(["discount","total discount","discounts","disc","discount total"]),           // pre-totalled discount (old POS formats)
    disc_unit: col(["discount_amount","discount amount"]),                                       // per-unit discount — new Foodics format col O
    disc_name: col(["discount_name","discount type","discount name","promotion","promo type"]),  // discount label — new Foodics format col P
    type:      col(["type"]),                                                                    // "Product" vs "Modifier Option" — new Foodics format col D
    cat:       col(["category","cat","group","menu group","item category","product category","category name","section"]),
    branch:    col(["branch_name","branch","branch name","store","location","outlet","shop","site"]),
  };
}

function parseSalesCSV(text, defaultBranch, fallbackMonth, forceFallback) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const lines = text.split(/\r?\n/).filter(ln => ln.trim() !== "");
  if (lines.length === 0) return { rows: [], warnings: ["empty file"], droppedZawya: 0, droppedNoItem: 0, droppedModifier: 0, usedFallbackDate: 0, mapping: {}, headerRaw: [], rawLines: [] };
  const headerRaw = _csvParseLine(lines[0]).map(h => h.replace(/^\uFEFF/, "").trim());
  const headerLower = headerRaw.map(h => h.toLowerCase());
  const mapping = _salesHeaderMap(headerLower);
  return parseSalesCSVFromMapping(lines, headerRaw, defaultBranch, fallbackMonth, forceFallback, mapping);
}

function parseSalesCSVFromMapping(lines, headerRaw, defaultBranch, fallbackMonth, forceFallback, mapping) {
  const rows = [];
  const c = mapping;
  const warns = [];
  if (c.item < 0) warns.push("no item column mapped");
  if (c.qty < 0)  warns.push("no qty column mapped (qty will default to 1 per row)");
  if (c.date < 0) warns.push(`no date column mapped — using fallback month ${fallbackMonth}`);

  const normalizeBranch = (raw) => {
    const s = String(raw || "").trim().toLowerCase();
    if (!s) return defaultBranch;
    if (s.includes("zawya")) return "zawya";
    if (s.includes("maadi")) return "maadi";
    return defaultBranch;
  };

  const fbMonth = (fallbackMonth && /^\d{4}-\d{2}$/.test(fallbackMonth)) ? fallbackMonth : new Date().toISOString().slice(0,7);
  const fbDate = fbMonth + "-15"; // mid-month placeholder

  let droppedZawya = 0, zawyaExcludedNet = 0, zawyaExcludedGross = 0, droppedNoItem = 0, droppedModifier = 0, usedFallbackDate = 0;
  for (let i = 1; i < lines.length; i++) {
    const r = _csvParseLine(lines[i]);
    if (r.length < 1) continue;
    const toNum = (x) => { const n = Number(String(x||"").replace(/[,\s]/g,"")); return isNaN(n) ? 0 : n; };

    // Skip Modifier Option rows (milk/flavour add-ons in new Foodics format — not standalone products)
    if (c.type >= 0 && String(r[c.type] || "").trim() === "Modifier Option") { droppedModifier++; continue; }

    const rawDate = c.date >= 0 ? r[c.date] : "";
    const branch = c.branch >= 0 ? normalizeBranch(r[c.branch]) : defaultBranch;
    const category = c.cat >= 0 ? r[c.cat] : "";
    const item = c.item >= 0 ? String(r[c.item] || "").trim() : "";

    // Drop rows with no item (they're usually summary rows POSes include at the bottom)
    if (!item) { droppedNoItem++; continue; }

    // Branch exclusions for Zawya
    const isZawyaRow = branch === "zawya" || defaultBranch === "zawya";
    if (isZawyaRow && isZawyaExcluded(category, item)) {
      droppedZawya++;
      // Accumulate excluded revenue so dashboard can show CB% of total venue sales
      const excGross = c.gross >= 0 ? toNum(r[c.gross]) : 0;
      const excNet   = c.net   >= 0 ? toNum(r[c.net])   : Math.max(0, excGross - (c.disc >= 0 ? toNum(r[c.disc]) : 0));
      zawyaExcludedNet   += excNet;
      zawyaExcludedGross += excGross;
      continue;
    }

    // Date handling — use fallback if we can't parse, or if the user forced it
    let dateIso = "";
    if (forceFallback) {
      dateIso = fbDate;
      usedFallbackDate++;
    } else {
      const parsed = normalizeDate(rawDate);
      if (parsed && /^\d{4}-\d{2}-\d{2}$/.test(parsed)) {
        dateIso = parsed;
      } else {
        dateIso = fbDate;
        usedFallbackDate++;
      }
    }

    const qty   = c.qty   >= 0 ? toNum(r[c.qty])   : 1;
    const gross = c.gross >= 0 ? toNum(r[c.gross])  : 0;

    // Discount: new Foodics format has per-unit amount (col O, disc_unit) → multiply by qty
    //           old POS formats have a pre-totalled discount column (disc) → use as-is
    let discount = 0;
    if      (c.disc_unit >= 0) discount = toNum(r[c.disc_unit]) * qty;
    else if (c.disc      >= 0) discount = toNum(r[c.disc]);
    else if (c.net       >= 0) discount = Math.max(0, gross - toNum(r[c.net]));

    const net           = c.net      >= 0 ? toNum(r[c.net]) : Math.max(0, gross - discount);
    const discount_name = c.disc_name >= 0 ? String(r[c.disc_name] || "").replace(/^-$/, "").trim() : "";

    rows.push({
      date: dateIso,
      item,
      sku: c.sku >= 0 ? String(r[c.sku] || "").trim() : "",
      qty,
      net,
      gross,
      discount,
      discount_name,
      category,
      branch,
    });
  }

  return { rows, warnings: warns, droppedZawya, zawyaExcludedNet, zawyaExcludedGross, droppedNoItem, droppedModifier, usedFallbackDate, mapping, headerRaw, rawLines: lines };
}

// Format a Date as YYYY-MM-DD using LOCAL time (not UTC).
// toISOString() returns UTC which is offset by Cairo's UTC+2/+3, causing
// dates to appear one day behind. This helper fixes that everywhere.
function localISODate(d) {
  const y  = d.getFullYear();
  const m  = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${dd}`;
}
function mondayOf(dateStr) {
  // Parse date-only strings as LOCAL noon to avoid DST / UTC-offset shifts.
  const d = dateStr
    ? new Date(dateStr.length === 10 ? dateStr + "T12:00:00" : dateStr)
    : new Date();
  // JS: Sunday=0, Monday=1, ..., Saturday=6. Shift so Monday is start.
  const dow = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dow);
  return localISODate(d);
}
function sundayOf(dateStr) {
  const d = dateStr
    ? new Date(dateStr.length === 10 ? dateStr + "T12:00:00" : dateStr)
    : new Date();
  d.setDate(d.getDate() - d.getDay()); // JS getDay(): Sunday=0
  return localISODate(d);
}

// Returns { holidays: [{label, emoji, type}], inRamadan: bool } for a given YYYY-MM-DD
function getCalendarContext(dateStr) {
  const holidays = [];
  const monthDay = dateStr.slice(5); // MM-DD
  const year = parseInt(dateStr.slice(0, 4), 10);

  // Fixed Gregorian holidays
  for (const h of EG_FIXED_HOLIDAYS) {
    if (h.monthDay === monthDay) holidays.push(h);
  }

  // Islamic holidays
  const islamic = ISLAMIC_DATES[year];
  if (islamic) {
    if (islamic.eid_fitr.includes(dateStr))
      holidays.push({ label: "Eid Al-Fitr", emoji: "🌙", type: "eid_fitr" });
    if (islamic.eid_adha.includes(dateStr))
      holidays.push({ label: "Eid Al-Adha", emoji: "🐑", type: "eid_adha" });
    if (islamic.islamic_new_year === dateStr)
      holidays.push({ label: "Islamic New Year", emoji: "🌙", type: "public_holiday" });
    if (islamic.mawlid === dateStr)
      holidays.push({ label: "Mawlid Al-Nabi", emoji: "🕌", type: "public_holiday" });
  }

  const inRamadan = !!(islamic &&
    dateStr >= islamic.ramadan.start &&
    dateStr <= islamic.ramadan.end &&
    !holidays.find(h => h.type === "eid_fitr"));

  return { holidays, inRamadan };
}

const CB_CAL_ID = "c_2f564847884c6daa36066faf75962669f717c476550c0e8acc94c19120aa8c6b@group.calendar.google.com";

function calItemDate(item) {
  if (item.start.date) return item.start.date;
  const dt = item.start.dateTime;
  if (!dt) return "";
  const utcMs = new Date(dt).getTime();
  return new Date(utcMs + 2 * 3600 * 1000).toISOString().slice(0, 10);
}

function calApiHour(dtStr) {
  if (!dtStr || dtStr.length < 16) return 10;
  const utcMs = new Date(dtStr).getTime();
  const cairoMs = utcMs + 2 * 3600 * 1000;
  const d = new Date(cairoMs);
  return d.getUTCHours() + d.getUTCMinutes() / 60;
}

/** Fetch all CB Events calendar entries between isoFrom and isoTo (YYYY-MM-DD).
 *  Returns [{date, summary, startHour}] or throws. */
async function fetchCalEventsRange(isoFrom, isoTo) {
  const apiKey = (state.gcal_api_key || "").trim();
  if (!apiKey) throw new Error("No Google Calendar API key — add it in the Schedule page → Connect Calendar.");
  const tMax = new Date(isoTo + "T00:00:00");
  tMax.setDate(tMax.getDate() + 1);
  const tMaxStr = tMax.toISOString().slice(0,10) + "T00:00:00+02:00";
  const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CB_CAL_ID)}/events`
    + `?key=${encodeURIComponent(apiKey)}&singleEvents=true&orderBy=startTime`
    + `&timeMin=${encodeURIComponent(isoFrom + "T00:00:00+02:00")}`
    + `&timeMax=${encodeURIComponent(tMaxStr)}`;
  const ctrl = new AbortController();
  setTimeout(() => ctrl.abort(), 10000);
  const res = await fetch(url, { signal: ctrl.signal });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${res.status}`);
  }
  const data = await res.json();
  return (data.items || []).map(item => ({
    date: calItemDate(item),
    summary: item.summary || "Event",
    startHour: item.start.dateTime ? calApiHour(item.start.dateTime) : 10,
  })).filter(e => e.date);
}
