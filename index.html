// Low-cash alert threshold — when either branch (or the combined float) drops below
// this, the owner sees a visible warning banner on the petty-cash page and, if browser
// notifications were granted, a toast + system notification.
const PETTY_CASH_ALERT = 1000;
function notifyHaidi(title, body) {
  try { toast(`${title} — ${body}`, "error"); } catch (e) {}
  if (typeof Notification !== "undefined" && Notification.permission === "granted") {
    try { new Notification(title, { body, icon: CB_LOGO_SRC }); } catch (e) {}
  } else if (typeof Notification !== "undefined" && Notification.permission !== "denied") {
    try { Notification.requestPermission().then(p => { if (p === "granted") new Notification(title, { body, icon: CB_LOGO_SRC }); }); } catch (e) {}
  }
}

// Weekly total outflow for a given branch (or "combined"). Used for the
// "weekly expenditures" widget on the petty-cash page.
function weeklyExpenditure(scope /* "maadi" | "zawya" | "combined" */) {
  const now = new Date();
  const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000).toISOString();
  return state.petty_cash
    .filter(p => {
      if ((p.at || "") < weekAgo) return false;
      if ((Number(p.amount) || 0) >= 0) return false; // only outflows
      if (scope === "combined") return true;
      return p.branch === scope;
    })
    .reduce((s, p) => s + Math.abs(Number(p.amount) || 0), 0);
}

routes.petty_cash = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Petty cash", "Top-ups logged by owner, day-to-day expenditures by head barista."));

  // Visibility: owner and accountant see both branches + combined; head barista sees their branch(es).
  // Salaries & penalties live in their own routes — not visible here.
  const canSeeAll = (u.role === "owner" || u.role === "accountant");

  // ---------- Combined view ----------
  if (canSeeAll) {
    const combinedBal = pettyCashBalance("maadi") + pettyCashBalance("zawya");
    const combinedCard = el("div", { class: "card", style: { borderColor: "var(--accent)" } });
    combinedCard.appendChild(el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } }, "Combined (Maadi + Zawya)"));
    combinedCard.appendChild(el("div", { style: { fontSize: "30px", fontWeight: "700", color: combinedBal < PETTY_CASH_ALERT ? "var(--bad)" : "var(--ink)" } }, money(combinedBal)));
    combinedCard.appendChild(el("div", { class: "muted small" }, `Weekly outflow: ${money(weeklyExpenditure("combined"))}`));
    if (combinedBal < PETTY_CASH_ALERT) {
      combinedCard.appendChild(el("div", { class: "banner-arch", style: { borderColor: "var(--bad)", color: "var(--bad)", fontWeight: "700", marginTop: "8px" } },
        `⚠ Total cash under ${money(PETTY_CASH_ALERT)} — top-up required.`));
      if (u.role === "owner" && !state.settings.alerted_combined) {
        notifyHaidi("Low petty cash (combined)", `Total is ${money(combinedBal)} (under ${money(PETTY_CASH_ALERT)})`);
        state.settings.alerted_combined = true;
        saveState();
      }
    } else if (state.settings.alerted_combined) {
      delete state.settings.alerted_combined;
      saveState();
    }
    wrap.appendChild(combinedCard);
  }

  // ---------- Per-branch cards ----------
  const branches = canSeeAll ? ["maadi","zawya"] : u.branches;
  for (const b of branches) {
    const bal = pettyCashBalance(b);
    const weekly = weeklyExpenditure(b);
    const card = el("div", { class: "card", style: { marginTop: "12px" } });
    card.appendChild(el("h2", {}, `${b[0].toUpperCase()+b.slice(1)} balance: ${money(bal)}`));

    card.appendChild(el("div", { class: "kv" }, [
      el("div", { class: "k" }, "This week's expenditures"),
      el("div", { class: "v" }, money(weekly)),
    ]));

    // Action buttons — role-restricted
    const btns = el("div", { class: "btn-row", style: { flexWrap: "wrap", gap: "8px" } }, []);
    if (u.role === "owner") {
      // TOP-UP — OWNER ONLY
      btns.appendChild(el("button", { class: "btn secondary", onClick: () => addTopup(b) }, "➕ Top-up"));
    }
    if (u.role === "head_barista" && u.branches.includes(b)) {
      // EXPENDITURE — HEAD BARISTA ONLY (for their branch)
      btns.appendChild(el("button", { class: "btn secondary", onClick: () => addExpense(b) }, "🧾 Expenditure"));
    }
    if (btns.children.length > 0) card.appendChild(btns);

    // Recent ledger rows — exclude salary & penalty (those have their own sections)
    const rows = state.petty_cash
      .filter(p => p.branch === b && p.type !== "salary" && p.type !== "penalty")
      .sort((x,y) => (y.at || "").localeCompare(x.at || ""))
      .slice(0, 20);
    card.appendChild(el("div", { class: "hr" }));
    if (rows.length === 0) {
      card.appendChild(el("div", { class: "muted small" }, "No entries yet."));
    } else {
      for (const r of rows) {
        const label = r.type === "expense" ? `Expense — ${r.note || ""}`
                    : r.type === "topup" ? `Top-up — ${r.note || ""}`
                    : `${r.type} — ${r.note || ""}`;
        card.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, [
            el("div", {}, label),
            el("div", { class: "muted small" }, `${fmtDate(r.at)} · by ${r.by_name || r.by || "—"}`),
          ]),
          el("div", { class: "v", style: { color: r.amount < 0 ? "var(--bad)" : "var(--ok)" } }, money(r.amount)),
        ]));
      }
    }
    wrap.appendChild(card);
  }
  wrap.appendChild(btnBack());

  // ---------- Handlers ----------
  function pushEntry(branch, type, amount, note, date) {
    const s = stamp();
    const bal = pettyCashBalance(branch);
    state.petty_cash.push({
      id: uuid(), branch, date: date || new Date().toISOString().slice(0,10),
      type, amount, balance_after: bal + amount, ref: "manual",
      by: s.by, by_name: s.by_name, at: s.at, note: note || "",
    });
    // Alert when combined total drops below threshold
    const total = pettyCashBalance("maadi") + pettyCashBalance("zawya");
    if (total < PETTY_CASH_ALERT) {
      notifyHaidi("Low petty cash — combined", `Total is ${money(total)} (under ${money(PETTY_CASH_ALERT)})`);
    }
  }

  function addTopup(branch) {
    openPrompt({
      title: `Top-up ${branch} petty cash (owner)`,
      fields: [
        { key: "amount", label: "Amount (EGP)", type: "number", value: 0 },
        { key: "date", label: "Date", type: "date", value: new Date().toISOString().slice(0,10) },
        { key: "note", label: "Note", type: "text", value: "Top-up from Haïdi" },
      ],
      onSubmit: (vals) => {
        const amt = Number(vals.amount) || 0;
        if (amt <= 0) return toast("Enter a positive amount", "error");
        pushEntry(branch, "topup", amt, vals.note, vals.date);
        const s = stamp();
        state.bank_ledger.push({
          id: uuid(), date: vals.date, amount: -amt, supplier: `Petty cash (${branch})`, type: "petty_cash_topup",
          by: s.by, by_name: s.by_name, at: s.at, note: `Top-up to ${branch} head barista`,
        });
        delete state.settings.alerted_combined;
        saveState(); toast("Top-up recorded"); render();
      }
    });
  }

  function addExpense(branch) {
    openPrompt({
      title: `Record expenditure — ${branch}`,
      fields: [
        { key: "amount", label: "Amount spent (EGP)", type: "number", value: 0 },
        { key: "date", label: "Date", type: "date", value: new Date().toISOString().slice(0,10) },
        { key: "note", label: "What was it for?", type: "text", value: "" },
      ],
      onSubmit: (vals) => {
        const amt = Number(vals.amount) || 0;
        if (amt <= 0) return toast("Enter a positive amount", "error");
        pushEntry(branch, "expense", -amt, vals.note, vals.date);
        saveState(); toast(`Remaining: ${money(pettyCashBalance(branch))}`); render();
      }
    });
  }

  return wrap;
};

// Shared: owner-only inline "add barista" — usable from Salaries, Penalties, anywhere.
function addBaristaQuick(onDone) {
  openPrompt({
    title: "Add a new barista",
    fields: [
      { key: "name", label: "Name", type: "text", value: "" },
      { key: "role", label: "Role", type: "select", options: [
        { label: "Barista", value: "barista" },
        { label: "Head barista", value: "head_barista" },
      ], value: "barista" },
      { key: "pin",  label: "4-digit PIN", type: "text", value: "" },
      { key: "branches", label: "If head barista — branches (maadi,zawya)", type: "text", value: "maadi,zawya" },
    ],
    onSubmit: (v) => {
      const name = (v.name || "").trim();
      if (!name) return toast("Enter a name", "error");
      if (!/^\d{4}$/.test(v.pin || "")) return toast("PIN must be 4 digits", "error");
      if (state.users.some(u => u.pin === v.pin)) return toast("That PIN is already in use — pick another", "error");
      const role = v.role === "head_barista" ? "head_barista" : "barista";
      const branches = role === "barista"
        ? ["maadi","zawya"]
        : (v.branches || "").split(",").map(s => s.trim().toLowerCase()).filter(Boolean);
      state.users.push({ id: uuid(), name, role, pin: v.pin, branches, active: true });
      saveState();
      toast(`${name} added`);
      if (typeof onDone === "function") onDone();
      else render();
    }
  });
}

// ==============================================================
// SALARIES — per-barista monthly salary config, loans, payouts, total due.
// Visible only to accountant, head_barista, and owner.
// ==============================================================
//
// Data model:
//   state.salary_config = { [userId]: { monthly_salary: Number, updated_at } }
//   state.salary_loans  = [ { id, user_id, barista, amount, date, note, by, by_name, at, month } ]
//   state.salaries      = [ { id, user_id, recipient, branch, amount, month, date, note, by, by_name, at } ]  // the payouts
//
routes.salaries = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Salaries", "Set each barista's salary, track loans, and see total due this month."));

  if (!["owner","accountant","head_barista"].includes(u.role)) {
    wrap.appendChild(el("div", { class: "card" }, "Access restricted."));
    wrap.appendChild(btnBack());
    return wrap;
  }

  state.salaries       = state.salaries || [];
  state.salary_config  = state.salary_config || {};
  state.salary_loans   = state.salary_loans  || [];
  state.penalties      = state.penalties     || [];

  // Month picker (defaults to current month) — scopes the "Total due" calc.
  const monthInput = el("input", {
    type: "month",
    value: new Date().toISOString().slice(0,7),
    style: { padding: "8px", borderRadius: "8px", border: "1px solid var(--border)" }
  });
  const headerRow = el("div", { class: "card", style: { display: "flex", gap: "12px", alignItems: "center", flexWrap: "wrap" } }, [
    el("div", { class: "muted small" }, "Month"),
    monthInput,
  ]);
  if (u.role === "owner") {
    headerRow.appendChild(el("button", {
      class: "btn secondary",
      style: { marginLeft: "auto" },
      onClick: () => addBaristaQuick()
    }, "➕ Add new barista"));
  }
  wrap.appendChild(headerRow);
  monthInput.addEventListener("change", () => drawBody());

  const body = el("div", {});
  wrap.appendChild(body);

  drawBody();

  wrap.appendChild(btnBack());

  function drawBody() {
    body.innerHTML = "";
    const month = monthInput.value || new Date().toISOString().slice(0,7);

    // All active baristas + head baristas
    const staff = state.users.filter(x => (x.role === "barista" || x.role === "head_barista") && x.active);

    // ---- 1) Per-barista salary config card ----
    const cfgCard = el("div", { class: "card", style: { marginTop: "12px" } });
    cfgCard.appendChild(el("div", { class: "muted small", style: { textTransform:"uppercase", letterSpacing:"1px" } }, "Monthly salary — per barista"));
    if (staff.length === 0) {
      cfgCard.appendChild(el("div", { class: "muted small" }, "No active baristas."));
    } else {
      for (const p of staff) {
        const cfg = state.salary_config[p.id] || { monthly_salary: 0 };
        const salaryBox = el("div", { class: "kv" }, [
          el("div", { class: "k" }, [
            el("div", {}, `${p.name}`),
            el("div", { class: "muted small" }, `${p.role === "head_barista" ? "Head barista" : "Barista"} · ${p.branches.join(", ")}`),
          ]),
          el("div", { class: "v" }, money(cfg.monthly_salary || 0)),
        ]);
        if (u.role === "owner" || u.role === "accountant") {
          salaryBox.appendChild(el("button", {
            class: "btn ghost",
            style: { marginLeft: "8px" },
            onClick: () => editSalaryConfig(p)
          }, "Edit"));
        }
        cfgCard.appendChild(salaryBox);
      }
    }
    body.appendChild(cfgCard);

    // ---- 2) Loans card ----
    const loansCard = el("div", { class: "card", style: { marginTop: "12px" } });
    loansCard.appendChild(el("div", { class: "muted small", style: { textTransform:"uppercase", letterSpacing:"1px" } }, "Loans (deducted end of month)"));
    loansCard.appendChild(el("button", { class: "btn secondary", style: { marginTop: "8px" }, onClick: addLoan }, "➕ Record loan"));
    const monthLoans = state.salary_loans.filter(l => (l.month || (l.date||"").slice(0,7)) === month);
    if (monthLoans.length === 0) {
      loansCard.appendChild(el("div", { class: "muted small", style: { marginTop: "8px" } }, "No loans recorded for this month."));
    } else {
      for (const r of monthLoans.slice().sort((a,b) => (b.at||"").localeCompare(a.at||""))) {
        loansCard.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, [
            el("div", {}, `${r.barista || "—"}`),
            el("div", { class: "muted small" }, `${fmtDate(r.at)} · by ${r.by_name || r.by || "—"}${r.note ? " · " + r.note : ""}`),
          ]),
          el("div", { class: "v" }, money(r.amount)),
        ]));
      }
    }
    body.appendChild(loansCard);

    // ---- 2.5) Overtime card ----
    state.overtime_logs = state.overtime_logs || [];
    const otCard = el("div", { class: "card", style: { marginTop: "12px" } });
    otCard.appendChild(el("div", { class: "muted small", style: { textTransform:"uppercase", letterSpacing:"1px", marginBottom:"10px" } }, "Overtime — extra hours per day"));
    // Hourly rates display
    for (const p of staff) {
      const cfg = state.salary_config[p.id] || { monthly_salary: 0 };
      const sal = Number(cfg.monthly_salary) || 0;
      const hrRate = sal > 0 ? (sal / 30 / 8) : 0;
      const otHrs  = (state.overtime_logs).filter(x => x.user_id === p.id && (x.month || (x.date||"").slice(0,7)) === month).reduce((s,r)=>s+(Number(r.hours)||0),0);
      const otAmt  = (state.overtime_logs).filter(x => x.user_id === p.id && (x.month || (x.date||"").slice(0,7)) === month).reduce((s,r)=>s+(Number(r.amount)||0),0);
      otCard.appendChild(el("div", { class: "kv" }, [
        el("div", { class: "k" }, [
          el("div", {}, p.name),
          el("div", { class: "muted small" }, `Rate: ${money(Math.round(hrRate*100)/100)}/hr · This month: ${otHrs}h = +${money(Math.round(otAmt*100)/100)}`),
        ]),
        el("div", { class: "v" }, ""),
      ]));
    }
    if (u.role === "owner" || u.role === "accountant" || u.role === "head_barista") {
      otCard.appendChild(el("button", { class: "btn secondary", style: { marginTop: "10px" }, onClick: addOvertime }, "➕ Log overtime hours"));
    }
    const monthOT = state.overtime_logs.filter(l => (l.month || (l.date||"").slice(0,7)) === month);
    if (monthOT.length === 0) {
      otCard.appendChild(el("div", { class: "muted small", style: { marginTop: "8px" } }, "No overtime logged this month."));
    } else {
      for (const r of monthOT.slice().sort((a,b) => (b.at||"").localeCompare(a.at||""))) {
        const statusPill = r.approved
          ? el("span", { class: "pill ok", style: { fontSize:"11px" } }, "✓ Approved")
          : el("span", { class: "pill warn", style: { fontSize:"11px", color:"var(--warn)" } }, "⏳ Pending");
        otCard.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, [
            el("div", {}, `${r.barista || "—"} · ${r.date || ""} · ${r.hours}h`),
            el("div", { class: "muted small" }, `${fmtDate(r.at)} · by ${r.by_name || "—"}${r.note ? " · " + r.note : ""} · +${money(Math.round((r.amount||0)*100)/100)}`),
          ]),
          el("div", { class: "v", style: { display:"flex", flexDirection:"column", alignItems:"flex-end", gap:"4px" } }, [
            statusPill,
            ...((!r.approved && (u.role === "owner")) ? [el("button", { class: "btn ghost", style: { fontSize:"11px", padding:"4px 10px", minHeight:"unset" }, onClick: () => { r.approved = true; r.approved_by = state.session; saveState(); drawBody(); } }, "Approve")] : []),
          ]),
        ]));
      }
    }
    body.appendChild(otCard);

    // ---- 3) Total due THIS MONTH (per person + grand total) ----
    const dueCard = el("div", { class: "card", style: { marginTop: "12px" } });
    dueCard.appendChild(el("div", { class: "muted small", style: { textTransform:"uppercase", letterSpacing:"1px" } }, `Total due · ${month}`));
    let grandDue = 0;
    for (const p of staff) {
      const salary  = Number((state.salary_config[p.id] || {}).monthly_salary || 0);
      const penSum  = state.penalties.filter(x => x.user_id === p.id && (x.month || (x.date||"").slice(0,7)) === month)
                                     .reduce((s,r)=>s+(Number(r.amount)||0),0);
      const loanSum = state.salary_loans.filter(x => x.user_id === p.id && (x.month || (x.date||"").slice(0,7)) === month)
                                        .reduce((s,r)=>s+(Number(r.amount)||0),0);
      const otSum   = state.overtime_logs.filter(x => x.user_id === p.id && (x.month || (x.date||"").slice(0,7)) === month)
                                         .reduce((s,r)=>s+(Number(r.amount)||0),0);
      const due = Math.max(0, salary + otSum - penSum - loanSum);
      grandDue += due;
      dueCard.appendChild(el("div", { class: "kv" }, [
        el("div", { class: "k" }, [
          el("div", {}, p.name),
          el("div", { class: "muted small" }, `Salary ${money(salary)} + OT ${money(Math.round(otSum*100)/100)} − Penalties ${money(penSum)} − Loans ${money(loanSum)}`),
        ]),
        el("div", { class: "v" }, money(due)),
      ]));
    }
    dueCard.appendChild(el("div", { class: "kv", style: { borderTop: "1px solid var(--border)", marginTop: "6px", paddingTop: "6px", fontWeight: "700" } }, [
      el("div", { class: "k" }, "Grand total due"),
      el("div", { class: "v" }, money(grandDue)),
    ]));
    body.appendChild(dueCard);

    // ---- 4) Record actual payouts ----
    body.appendChild(el("button", { class: "btn secondary", style: { marginTop: "12px" }, onClick: addSalary }, "➕ Log salary payout"));

    const paidThis = state.salaries.filter(r => (r.month || (r.date||"").slice(0,7)) === month)
      .slice().sort((a,b) => (b.at||"").localeCompare(a.at||""));
    const paidTotal = paidThis.reduce((s,r)=>s+(Number(r.amount)||0),0);
    body.appendChild(el("div", { class: "card", style: { marginTop: "12px" } }, [
      el("div", { class: "muted small", style: { textTransform:"uppercase", letterSpacing:"1px" } }, `Paid · ${month}`),
      el("div", { style: { fontSize: "26px", fontWeight: "700" } }, money(paidTotal)),
    ]));

    const list = el("div", { class: "card", style: { marginTop: "12px" } });
    if (paidThis.length === 0) {
      list.appendChild(el("div", { class: "muted small" }, "No salary payouts logged this month."));
    } else {
      for (const r of paidThis) {
        list.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, [

        const s = stamp();
        state.salary_loans.push({
          id: uuid(), user_id: person.id, barista: person.name,
          amount: amt, date: vals.date, month: vals.month || (vals.date||"").slice(0,7),
          note: vals.note || "", by: s.by, by_name: s.by_name, at: s.at,

        saveState(); toast(`Loan recorded for ${person.name}`); render();

  function addOvertime() {
    const staff = state.users.filter(x => (x.role === "barista" || x.role === "head_barista") && x.active);
    const options = staff.map(p => ({ label: p.name, value: p.id }));
    openPrompt({
      title: "Log overtime hours",
      fields: [
        { key: "user_id", label: "Barista", type: "select", options, value: options[0] ? options[0].value : "" },
        { key: "date",    label: "Date", type: "date", value: new Date().toISOString().slice(0,10) },
        { key: "hours",   label: "Overtime hours (e.g. 2.5)", type: "number", value: 1 },
        { key: "note",    label: "Reason / note", type: "text", value: "" },
      ],
      onSubmit: (vals) => {
        const hrs = Number(vals.hours) || 0;
        if (hrs <= 0) return toast("Enter a positive number of hours", "error");
        const person = state.users.find(x => x.id === vals.user_id);
        if (!person) return toast("Pick a barista", "error");
        const sal = Number((state.salary_config[person.id] || {}).monthly_salary || 0);
        const hrRate = sal > 0 ? sal / 30 / 8 : 0;
        const amount = Math.round(hrRate * hrs * 100) / 100;
        const s = stamp();
        const mon = monthInput.value || new Date().toISOString().slice(0,7);
        state.overtime_logs = state.overtime_logs || [];
        state.overtime_logs.push({
          id: uuid(), user_id: person.id, barista: person.name,
          date: vals.date, hours: hrs, rate: hrRate, amount,
          month: mon || (vals.date||"").slice(0,7),
          note: vals.note || "", by: s.by, by_name: s.by_name, at: s.at,
          approved: false,
        });
        saveState();
        // Send approval email
        const subj = encodeURIComponent(`[OT Approval Needed] ${person.name} · ${vals.date} · ${hrs}h · EGP ${amount.toFixed(2)}`);
        const bod  = encodeURIComponent(
          `Overtime submitted for your approval:\n\n` +
          `Barista: ${person.name}\nDate: ${vals.date}\nHours: ${hrs}\n` +
          `Hourly rate: EGP ${hrRate.toFixed(2)}\nTotal OT pay: EGP ${amount.toFixed(2)}\n` +
          `Month: ${mon}\nNote: ${vals.note || "—"}\nSubmitted by: ${s.by_name}\n\n` +
          `Log in to the Operations app > Salaries to approve.`
        );
        try { window.open(`mailto:coffeebeats@haidiyacoub.com?subject=${subj}&body=${bod}`, "_blank"); } catch(e) {}
        toast(`Overtime logged · EGP ${amount.toFixed(2)} · Approval email sent ✉️`);
        drawBody();

    });
  }

  function addSalary() {
    const staff = state.users.filter(x => (x.role === "barista" || x.role === "head_barista") && x.active);
    const options = staff.map(p => ({ label: p.name, value: p.id }));
    openPrompt({
      title: "Log salary payout",
      fields: [
        { key: "user_id", label: "Recipient", type: "select", options, value: options[0] ? options[0].value : "" },
        { key: "branch",  label: "Branch (maadi/zawya)", type: "text", value: u.branches[0] || "maadi" },
        { key: "amount",  label: "Amount paid (EGP)", type: "number", value: 0 },

        { key: "note",    label: "Note", type: "text", value: "Monthly salary" },

        const person = state.users.find(x => x.id === vals.user_id);
        const s = stamp();
        state.salaries.push({
          id: uuid(),
          user_id: person ? person.id : null,
          recipient: person ? person.name : (vals.recipient || ""),
          branch: String(vals.branch || "maadi").toLowerCase(),
          amount: amt,
          month: vals.month || "",
          date: vals.date,
          note: vals.note || "",
          by: s.by, by_name: s.by_name, at: s.at,
        });
        saveState(); toast("Payout logged"); render();
      }
    });
  }

  return wrap;
};

// ==============================================================
// PENALTIES — per-barista deductions with auto-calc from monthly salary.
// 1 day = monthly_salary / 30 ; half day = that / 2 ; 1 hour = day / 8 (approx).
// Entry restricted to owner + head_barista per spec.
// ==============================================================
//
// Reasons dropdown (per Haïdi):
//   - up to 1 hour late            (1 hour penalty)
//   - half day late                (half day penalty)
//   - no show                      (full day penalty)
//   - not wearing the uniform      (half day penalty)
//   - not following the rules      (half day penalty)
//   - other — please specify       (custom amount, free-text reason)
//
// Four fixed durations — amount auto-calculated from monthly salary.
// "other" lets the head barista/owner type a free-text amount.
const PENALTY_KINDS = [
  { label: "Half day",  value: "half_day",   days: 0.5 },
  { label: "Full day",  value: "full_day",   days: 1   },
  { label: "2 days",    value: "two_days",   days: 2   },
  { label: "3 days",    value: "three_days", days: 3   },
  { label: "Other (custom amount)", value: "custom", days: null },
];
// Optional context (doesn't affect amount — just labels the penalty)
const PENALTY_REASONS = [
  { label: "Late",                     value: "late" },
  { label: "No show",                  value: "no_show" },
  { label: "Not wearing the uniform",  value: "no_uniform" },
  { label: "Not following the rules",  value: "rules_break" },
  { label: "Other",                    value: "other" },
];

function penaltyAmount(kind, monthlySalary) {
  const s = Number(monthlySalary) || 0;
  const day = s / 30;
  const k = PENALTY_KINDS.find(x => x.value === kind);
  if (!k || k.days == null) return 0;
  return Math.round(day * k.days);
}

routes.penalties = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Penalties", "Auto-calculated from each barista's monthly salary."));

  // Per spec: only owner + head_barista can ENTER. Accountant can VIEW.
  if (!["owner","accountant","head_barista"].includes(u.role)) {
    wrap.appendChild(el("div", { class: "card" }, "Access restricted."));
    wrap.appendChild(btnBack());
    return wrap;
  }

  state.penalties           = state.penalties           || [];
  state.salary_config       = state.salary_config       || {};
  state.deleted_penalties   = state.deleted_penalties   || [];

  const canEnter = (u.role === "owner" || u.role === "head_barista");

  const btnRow = el("div", { style: { display: "flex", gap: "8px", flexWrap: "wrap" } });
  if (canEnter) {
    btnRow.appendChild(el("button", { class: "btn secondary", onClick: addPenalty }, "➕ Record penalty"));
  } else {
    wrap.appendChild(el("div", { class: "banner-arch" }, "View-only access. Penalties are entered by the owner or head barista."));
  }
  if (u.role === "owner") {
    btnRow.appendChild(el("button", { class: "btn secondary", onClick: () => addBaristaQuick() }, "➕ Add new barista"));
  }
  wrap.appendChild(btnRow);

  const visible = state.penalties.slice().sort((a,b) => (b.at||"").localeCompare(a.at||""));
  const total = visible.reduce((s,r) => s + (Number(r.amount)||0), 0);
  wrap.appendChild(el("div", { class: "card", style: { marginTop: "12px" } }, [
    el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } }, "Total deductions (all time)"),
    el("div", { style: { fontSize: "26px", fontWeight: "700" } }, money(total)),
  ]));

  const list = el("div", { class: "card", style: { marginTop: "12px" } });
  if (visible.length === 0) {
    list.appendChild(el("div", { class: "muted small" }, "No penalties recorded."));
  } else {
    for (const r of visible) {
      const reasonLabel = (PENALTY_REASONS.find(x => x.value === r.reason_code) || {}).label || r.reason_code || r.reason || "—";
      const kindLabel = r.kind_label || (PENALTY_KINDS.find(x => x.value === r.kind) || {}).label || r.kind || "—";
      const row = el("div", { class: "kv", style: { alignItems: "center" } }, [
        el("div", { class: "k" }, [
          el("div", {}, `${r.barista || "—"} · ${kindLabel} · ${r.branch || ""}`),
          el("div", { class: "muted small" }, `${fmtDate(r.at)} · by ${r.by_name || r.by || "—"} · ${reasonLabel}${r.note ? " — " + r.note : ""}`),
        ]),
        el("div", { class: "v" }, money(r.amount)),
      ]);
      if (canEnter) {
        row.appendChild(el("button", {
          class: "btn ghost",
          style: { marginLeft: "8px", color: "var(--bad)", border: "1px solid var(--bad)" },
          title: "Delete this penalty",
          onClick: () => {
            if (!confirm(`Delete penalty ${money(r.amount)} for ${r.barista}? You can undo below.`)) return;
            state.penalties = state.penalties.filter(x => x.id !== r.id);
            state.deleted_penalties.unshift({ ...r, deleted_at: now(), deleted_by: currentUser()?.name || "?" });
            state.deleted_penalties = state.deleted_penalties.slice(0, 20); // keep last 20
            saveState();
            toast(`Penalty deleted — scroll down to undo`);
            render();
          }
        }, "🗑"));
      }
      list.appendChild(row);
    }
  }
  wrap.appendChild(list);

  // ---- Deleted / trash (undo) ----
  if (state.deleted_penalties && state.deleted_penalties.length > 0) {
    const trash = el("div", { class: "card", style: { marginTop: "12px", borderColor: "var(--warn)" } });
    trash.appendChild(el("div", { class: "muted small", style: { textTransform:"uppercase", letterSpacing:"1px", color:"var(--warn)" } }, "Recently deleted (tap to restore)"));
    for (const r of state.deleted_penalties.slice(0, 10)) {
      const reasonLabel = (PENALTY_REASONS.find(x => x.value === r.reason_code) || {}).label || r.reason_code || r.reason || "—";
      const kindLabel = r.kind_label || (PENALTY_KINDS.find(x => x.value === r.kind) || {}).label || r.kind || "—";
      trash.appendChild(el("div", { class: "kv", style: { alignItems:"center" } }, [
        el("div", { class: "k" }, [
          el("div", { style: { color: "var(--ink-dim)" } }, `${r.barista || "—"} · ${kindLabel} · ${money(r.amount)}`),
          el("div", { class: "muted small" }, `Deleted ${fmtDate(r.deleted_at)} · originally ${fmtDate(r.at)}`),
        ]),
        el("button", {
          class: "btn secondary",
          style: { width: "auto" },
          onClick: () => {
            const { deleted_at, deleted_by, ...original } = r;
            state.penalties.push(original);
            state.deleted_penalties = state.deleted_penalties.filter(x => x.id !== r.id);
            saveState();
            toast(`Penalty for ${r.barista} restored ✓`);
            render();
          }
        }, "↩ Restore"),
      ]));
    }
    if (canEnter) {
      trash.appendChild(el("button", {
        class: "btn ghost",
        style: { marginTop: "8px", color: "var(--bad)" },
        onClick: () => {
          if (!confirm("Permanently clear all deleted penalties?")) return;
          state.deleted_penalties = [];
          saveState(); toast("Trash cleared"); render();
        }
      }, "🗑 Clear trash"));
    }
    wrap.appendChild(trash);
  }

  wrap.appendChild(btnBack());

  function addPenalty() {
    const staff = state.users.filter(x => (x.role === "barista" || x.role === "head_barista") && x.active);
    const staffOptions = staff.map(p => ({ label: p.name, value: p.id }));
    const kindOptions = PENALTY_KINDS.map(k => ({ label: k.label, value: k.value }));
    const reasonOptions = PENALTY_REASONS.map(r => ({ label: r.label, value: r.value }));

    openPrompt({
      title: "Record penalty",
      fields: [
        { key: "branch",  label: "Branch (maadi/zawya)", type: "text", value: u.branches[0] || "maadi" },
        { key: "user_id", label: "Barista", type: "select", options: staffOptions, value: staffOptions[0] ? staffOptions[0].value : "" },
        { key: "kind",    label: "Duration (auto-calc from salary)", type: "select", options: kindOptions, value: "half_day" },
        { key: "reason_code", label: "Reason (for the record)", type: "select", options: reasonOptions, value: "late" },
        { key: "custom_reason", label: "Reason note (optional / required for Other)", type: "text", value: "" },
        { key: "custom_amount", label: "Custom amount (only used if duration = Other)", type: "number", value: 0 },
        { key: "date",    label: "Date", type: "date", value: new Date().toISOString().slice(0,10) },
      ],
      onSubmit: (vals) => {
        const person = state.users.find(x => x.id === vals.user_id);
        if (!person) return toast("Pick a barista", "error");
        const salary = Number((state.salary_config[person.id] || {}).monthly_salary || 0);
        const kindSpec = PENALTY_KINDS.find(k => k.value === vals.kind) || PENALTY_KINDS[0];
        const reasonSpec = PENALTY_REASONS.find(r => r.value === vals.reason_code) || PENALTY_REASONS[0];

        let amount;
        if (kindSpec.value === "custom") {
          amount = Number(vals.custom_amount) || 0;
          if (amount <= 0) return toast("Enter a positive custom amount", "error");
          if (!vals.custom_reason || !vals.custom_reason.trim()) return toast("Please specify the reason note", "error");
        } else {
          if (salary <= 0) return toast(`No monthly salary set for ${person.name} — set it in Salaries first`, "error");
          amount = penaltyAmount(kindSpec.value, salary);
        }

        const s = stamp();
        state.penalties.push({
          id: uuid(),
          user_id: person.id,
          branch: String(vals.branch || "maadi").toLowerCase(),
          barista: person.name,
          kind: kindSpec.value,
          kind_label: kindSpec.label,
          amount,
          date: vals.date,
          month: (vals.date || "").slice(0,7),
          reason_code: reasonSpec.value,
          reason: reasonSpec.label,
          note: (vals.custom_reason || "").trim(),
          salary_at_time: salary,
          by: s.by, by_name: s.by_name, at: s.at,
        });
        saveState();
        toast(`Penalty ${money(amount)} — ${person.name} (${kindSpec.label})`);
        render();
      }
    });
  }
  return wrap;
};

routes.maadi_deposits = function (u) {
  const wrap = el("div", {});

        { key: "bank", label: "Bank / branch", type: "text", value: "" },
        { key: "ref", label: "Reference / slip #", type: "text", value: "" },
        { key: "note", label: "Note", type: "text", value: "" },
        { key: "proof", label: "Proof of deposit (photo)", type: "file" },
      ],
      onSubmit: async (vals) => {
        const amt = Number(vals.amount) || 0;
        if (amt <= 0) return toast("Enter a positive amount", "error");
        const s = stamp();
        let photoId = null;
        if (vals.proof && vals.proof instanceof File) {
          photoId = uuid();
          try { await IDB.put(photoId, vals.proof); } catch (e) { console.warn("proof photo save failed", e); photoId = null; }
        }
        state.maadi_deposits.push({
          id: uuid(),
          amount: amt,
          week_of: vals.week_of || "",
          date: vals.date,
          bank: vals.bank || "",
          ref: vals.ref || "",
          note: vals.note || "",
          proof_photo_id: photoId,
          by: s.by, by_name: s.by_name, at: s.at,
        });
        // Mirror the deposit in bank_ledger for owner visibility
        state.bank_ledger.push({
          id: uuid(), date: vals.date, amount: amt, supplier: `Maadi cash deposit`, type: "cash_deposit",
          by: s.by, by_name: s.by_name, at: s.at, note: `Week of ${vals.week_of || ""} · ref ${vals.ref || ""}`,
        });
        saveState(); toast("Deposit recorded"); render();
      }
    });
  }
  return wrap;
};

// Recurring bills have PRESET amounts stored once in state.overhead_presets
// ({branch}|{category}) → { amount, note }. Each month we auto-materialise a
// row per recurring category, with a paid-yes/no toggle and a paid-on date.
// Marketing + Miscellaneous stay manual per Haïdi's note.
// ==============================================================
const OVERHEAD_CATEGORIES = [
  { value: "electricity",       label: "Electricity bill",   recurring: true  },
  { value: "internet",          label: "Internet bill",      recurring: true  },
  { value: "cleaner_salary",    label: "Cleaner salary",     recurring: true  },
  { value: "accountant_salary", label: "Accountant salary",  recurring: true  },
  { value: "pos_fees",          label: "POS fees",           recurring: true  },
  { value: "gardener_salary",   label: "Gardener salary",    recurring: true  },
  { value: "marketing_fees",    label: "Marketing fees",     recurring: false },
  { value: "misc",              label: "Miscellaneous (specify)", recurring: false },
];

function presetKey(branch, category) { return `${branch}|${category}`; }
function monthlyKey(branch, category, month) { return `${branch}|${category}|${month}`; }

routes.overheads = function (u) {
  const wrap = el("div", {});
