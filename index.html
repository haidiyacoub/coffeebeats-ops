        "Assign baristas per shift per day — changes save instantly and take effect immediately. " +
        "You can update mid-week at any time (sick calls, emergencies). " +
        "⚠ The morning shift barista is the one responsible for the sign-in stamp. " +
        "If you swap the morning assignment, the penalty system picks up the new name automatically."));
    } else {
      body.appendChild(el("div", { class: "banner-arch" }, "Read-only — your weekly schedule. The morning shift barista is responsible for the daily sign-in stamp. Ask the head barista if anything looks off."));
    }

    const staff = state.users.filter(x => x.active && (x.role === "barista" || x.role === "head_barista"));

    // Helper: get approved-leave user IDs for a specific calendar date
    function onLeaveIds(dateStr) {
      return (state.leaves || [])
        .filter(l => l.status === "approved" && dateStr >= l.from_date && dateStr <= l.to_date)
        .map(l => l.user_id);
    }

    // Week start as local noon — avoids UTC-offset shifts when we reformat
    const weekStart = new Date(weekOf + "T12:00:00");

    // Group by DAY → then branch+shift (Mon → Maadi Morning / Night, Zawya Morning / Night)
    for (let di = 0; di < ROSTER_DAYS.length; di++) {
      const day = ROSTER_DAYS[di];
      // Compute the actual calendar date for this roster day using local time
      const dayDate = new Date(weekStart);
      dayDate.setDate(dayDate.getDate() + di);
      const dayDateStr = localISODate(dayDate); // local, not UTC
      const onLeave = onLeaveIds(dayDateStr);

      const card = el("div", { class: "card", style: { marginTop: "10px" } });
      const dayHdr = el("h2", { style: { display: "flex", alignItems: "center", gap: "8px" } });
      dayHdr.appendChild(document.createTextNode(ROSTER_DAY_LABELS[day]));
      dayHdr.appendChild(el("span", { class: "muted small", style: { fontWeight: "400" } }, dayDateStr));
      if (onLeave.length) {
        const names = onLeave.map(id => { const s = staff.find(x => x.id === id); return s ? s.name : id; });
        dayHdr.appendChild(el("span", { class: "pill warn", style: { color: "var(--warn)", fontSize: "11px" } }, `🌴 On leave: ${names.join(", ")}`));
      }
      card.appendChild(dayHdr);

      // Build options: exclude staff on approved leave for this day
      const dayStaff = staff.filter(s => !onLeave.includes(s.id));
      const staffOptions = [["","— empty —"], ...dayStaff.map(s => [s.id, s.name])];

      for (const branch of ["maadi","zawya"]) {
        const branchLabel = branch[0].toUpperCase() + branch.slice(1);
        card.appendChild(el("div", { class: "muted small", style: { textTransform:"uppercase", letterSpacing:"1px", marginTop: "8px", marginBottom: "4px" } }, branchLabel));
        for (const shift of ROSTER_SHIFTS) {
          const entry = rosterEntry(branch, shift, day);
          const shiftLabel = shift[0].toUpperCase() + shift.slice(1);
          const row = el("div", { class: "kv", style: { alignItems: "center" } });
          row.appendChild(el("div", { class: "k", style: { minWidth: "80px" } }, shiftLabel));
          if (canEdit) {
            // If the currently-assigned person is on approved leave, show a warning
            const assignedOnLeave = entry && onLeave.includes(entry.user_id);
            const sel = el("select", { style: assignedOnLeave ? { borderColor: "var(--bad)" } : {} });
            for (const [val, lab] of staffOptions) {
              const o = el("option", { value: val }, lab);
              if (entry && entry.user_id === val) o.selected = true;
              sel.appendChild(o);
            }
            // If assigned person is now on leave, add them as a disabled option with warning
            if (assignedOnLeave) {
              const warnOpt = el("option", { value: entry.user_id, selected: "true", style: { color: "var(--bad)" } },
                `⚠ ${entry.user_name} (ON LEAVE — reassign!)`);
              sel.insertBefore(warnOpt, sel.children[1] || null);
            }
            sel.addEventListener("change", () => {
              // Block assigning someone on leave
              if (onLeave.includes(sel.value)) {
                toast("This barista has approved leave on this day — cannot assign them.", "error");
                sel.value = entry ? entry.user_id : "";
                return;
              }
              const user = staff.find(s => s.id === sel.value) || null;
              setRosterEntry(branch, shift, day, user);
              toast(`${ROSTER_DAY_LABELS[day]} · ${branchLabel} · ${shiftLabel} → ${user ? user.name : "empty"}`);
            });
            const cellWrap = el("div", { class: "v" }, [sel]);
            if (assignedOnLeave) {
              cellWrap.appendChild(el("div", { style: { fontSize: "11px", color: "var(--bad)", marginTop: "3px" } },
                "⚠ On approved leave — please reassign"));
            }
            row.appendChild(cellWrap);
          } else {
            const isOnLeave = entry && onLeave.includes(entry.user_id);
            row.appendChild(el("div", { class: "v", style: isOnLeave ? { color: "var(--bad)" } : {} },
              entry ? (isOnLeave ? `${entry.user_name} 🌴` : entry.user_name) : "—"));
          }
          card.appendChild(row);
        }
      }
      body.appendChild(card);
    }

    // Weekly summary — so baristas can scan who's on when
    const summary = el("div", { class: "card", style: { marginTop: "10px" } });
    summary.appendChild(el("h2", {}, `Summary — week of ${weekOf}`));
    const myId = u.id;
    const mine = state.rosters.filter(r => r.week_of === weekOf && r.user_id === myId);
    if (mine.length) {
      summary.appendChild(el("div", { class: "muted small" }, `Your shifts (${u.name}):`));
      for (const m of mine) {
        summary.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, `${ROSTER_DAY_LABELS[m.day]} · ${m.branch} · ${m.shift}`),
          el("div", { class: "v" }, fmtDate(m.at)),
        ]));
      }
    } else {
      summary.appendChild(el("div", { class: "muted small" }, "You have no shifts assigned this week."));
    }
    // Last-edit note — shows head barista exactly when the schedule was last changed
    const weekEntries = state.rosters.filter(r => r.week_of === weekOf);
    if (weekEntries.length) {
      const lastEdit = weekEntries.slice().sort((a,b) => (b.at||"").localeCompare(a.at||""))[0];
      summary.appendChild(el("div", { class: "muted small", style: { marginTop: "10px", borderTop: "1px solid var(--border)", paddingTop: "8px" } },
        `Last schedule update: ${fmtDate(lastEdit.at)} by ${lastEdit.by_name || "—"}`));
    }
    body.appendChild(summary);

    if (canEdit) {
      body.appendChild(el("div", { class: "btn-row", style: { marginTop: "10px" } }, [
        el("button", { class: "btn ghost", onClick: () => {
          if (!confirm(`Clear ALL schedule entries for the week of ${weekOf}?`)) return;
          state.rosters = state.rosters.filter(r => r.week_of !== weekOf);
          saveState(); toast("Week cleared"); draw();
        } }, "🗑 Clear this week"),
        el("button", { class: "btn ghost", onClick: () => {
          // Copy last week's roster to this week
          const prev = new Date(weekOf + "T12:00:00"); prev.setDate(prev.getDate() - 7);
          const prevKey = localISODate(prev);
          const src = state.rosters.filter(r => r.week_of === prevKey);
          if (!src.length) return toast("No schedule found for last week", "error");
          for (const r of src) {
            const exists = rosterEntry(r.branch, r.shift, r.day);
            if (!exists) {
              const s = stamp();
              state.rosters.push({
                id: uuid(), week_of: weekOf, branch: r.branch, shift: r.shift, day: r.day,
                user_id: r.user_id, user_name: r.user_name,
                by: s.by, by_name: s.by_name, at: s.at,
              });
            }
          }
          saveState(); toast(`Copied ${src.length} entries from ${prevKey}`); draw();
        } }, "📋 Copy last week"),
      ]));
    }
  }
  draw();
  wrap.appendChild(btnBack());
  return wrap;
};

// ==============================================================
// ROASTER — head barista posts weekly schedule to the whole team
// Read access: everyone (barista, head_barista, owner, accountant)
// Edit access: head_barista + owner only
// ==============================================================
routes.roaster = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Roaster", "Head barista posts the weekly schedule for Maadi and Zawya — morning and night shifts."));

  state.roaster_schedules = state.roaster_schedules || [];

  const canEdit = (u.role === "owner" || u.role === "head_barista");

  let weekOf = mondayOf(new Date().toISOString().slice(0,10));

  const weekPicker = el("input", { type: "date", value: weekOf });
  weekPicker.addEventListener("input", () => { weekOf = mondayOf(weekPicker.value); draw(); });
  wrap.appendChild(el("label", {}, "Week starting (snaps to Monday)"));
  wrap.appendChild(weekPicker);

  const body = el("div", { class: "stack" });
  wrap.appendChild(body);

  function currentSchedule() {
    return state.roaster_schedules.find(r => r.week_of === weekOf);
  }

  function draw() {
    body.innerHTML = "";
    const sched = currentSchedule();

    if (canEdit) {
      body.appendChild(el("div", { class: "banner-arch" },
        "Post the weekly roaster for all baristas — Maadi and Zawya, morning and night. " +
        "All team members can read this. Changes save when you tap Post."));

      const ta = el("textarea", {
        rows: "14",
        placeholder: "Paste or type the weekly roaster here…\n\nExample:\n━━ MAADI ━━\n  Morning: Barista 1, Khaled\n  Night:   Barista 2\n\n━━ ZAWYA ━━\n  Morning: Barista 3\n  Night:   Barista 1",
        style: { marginTop: "10px", width: "100%", fontFamily: "monospace", fontSize: "13px", lineHeight: "1.6" }
      });
      if (sched) ta.value = sched.note || "";

      body.appendChild(ta);

      const btnRow = el("div", { class: "btn-row", style: { marginTop: "10px" } });
      btnRow.appendChild(el("button", { class: "btn", onClick: () => {
        const note = ta.value.trim();
        if (!note) return toast("Write the roaster before posting", "error");
        const s = stamp();
        if (sched) {
          sched.note = note;
          sched.updated_by = s.by;
          sched.updated_by_name = s.by_name;
          sched.updated_at = s.at;
        } else {
          state.roaster_schedules.push({
            id: uuid(), week_of: weekOf, note,
            by: s.by, by_name: s.by_name, at: s.at,
            updated_at: null,
          });
        }
        saveState();
        toast("📤 Roaster posted for week of " + weekOf);
        draw();
      } }, "📤 Post roaster"));

      if (sched) {
        btnRow.appendChild(el("button", { class: "btn danger", style: { width: "auto", flexShrink: "0" }, onClick: () => {
          if (!confirm("Clear roaster for week of " + weekOf + "?")) return;
          state.roaster_schedules = state.roaster_schedules.filter(r => r.week_of !== weekOf);
          saveState(); toast("Roaster cleared"); draw();
        } }, "🗑 Clear"));
      }
      body.appendChild(btnRow);
    } else {
      body.appendChild(el("div", { class: "banner-arch" },
        "Read-only — your weekly roaster is posted by the head barista."));
    }

    // Show the current week's posted schedule
    if (sched) {
      const card = el("div", { class: "card", style: { marginTop: "12px" } });
      card.appendChild(el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } },
        "Week of " + sched.week_of));
      card.appendChild(el("pre", {
        style: { margin: "10px 0 0", fontSize: "13px", whiteSpace: "pre-wrap", fontFamily: "monospace", lineHeight: "1.7", background: "var(--surface-2)", borderRadius: "10px", padding: "12px" }
      }, sched.note));
      const byLine = sched.updated_at
        ? "Updated by " + (sched.updated_by_name || "—") + " on " + fmtDate(sched.updated_at)
        : "Posted by " + (sched.by_name || "—") + " on " + fmtDate(sched.at);
      card.appendChild(el("div", { class: "muted small", style: { marginTop: "8px" } }, byLine));
      body.appendChild(card);
    } else if (!canEdit) {
      body.appendChild(el("div", { class: "card", style: { marginTop: "12px" } }, [
        el("div", { class: "muted small" }, "No roaster posted for this week yet — check back later."),
      ]));
    }

    // History: last 4 other weeks for quick navigation
    const recent = state.roaster_schedules
      .filter(r => r.week_of !== weekOf)
      .sort((a, b) => b.week_of.localeCompare(a.week_of))
      .slice(0, 4);
    if (recent.length > 0) {
      const hist = el("div", { class: "card", style: { marginTop: "10px" } });
      hist.appendChild(el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px", marginBottom: "6px" } }, "Recent weeks"));
      for (const r of recent) {
        hist.appendChild(el("div", { class: "kv", style: { cursor: "pointer" }, onClick: () => {
          weekPicker.value = r.week_of;
          weekOf = r.week_of;
          draw();
        } }, [
          el("div", { class: "k" }, r.week_of),
          el("div", { class: "v muted small" }, "by " + (r.by_name || "—")),
        ]));
      }
      body.appendChild(hist);
    }
  }

  draw();
  wrap.appendChild(btnBack());
  return wrap;
};

// ==============================================================
// MENU ITEMS
// ==============================================================
routes.menu = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Menu items", "Price + cost per item. Cost drives margin; price drives revenue."));

  wrap.appendChild(el("div", { class: "banner-arch" }, [
    "Authoritative cost = ‘coffee beats menu analysis ver2’ → cost tab → column BF. Authoritative price = column BI. Upload a CSV — accepted columns: ",
    el("b", {}, "name"),
    " (or item / product), ",
    el("b", {}, "cost_egp"),
    " (or cost / bf), ",
    el("b", {}, "price_egp"),
    " (or price / bi), ",
    el("b", {}, "new_name"),
    " (optional — renames matched item). Uppercase section rows, trailing spaces, accents and parentheticals are all normalised; re-uploading always overwrites prior cost / price."
  ]));

  const up = el("input", { type: "file", accept: ".csv" });
  wrap.appendChild(el("label", {}, "Upload cost CSV"));
  wrap.appendChild(up);
  up.addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    let text = await f.text();
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const parseLine = (ln) => {
      const out = []; let cur = ""; let q = false;
      for (let i=0; i<ln.length; i++) {
        const c = ln[i];
        if (q) { if (c === '"' && ln[i+1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
        else { if (c === '"') q = true; else if (c === ',') { out.push(cur); cur = ""; } else cur += c; }
      }
      out.push(cur); return out;
    };
    const lines = text.split(/\r?\n/).filter(s => s.trim() !== "");
    if (lines.length === 0) { toast("Empty CSV", "error"); return; }
    const h = parseLine(lines[0]).map(s => s.trim().toLowerCase());
    const findCol = (...aliases) => { for (const a of aliases) { const i = h.indexOf(a); if (i !== -1) return i; } return -1; };
    const iName    = findCol("name","item","item name","product","product name","menu item","bg");
    const iCost    = findCol("cost_egp","cost","bf","cost with cup and lid","cost_with_cup_and_lid","item cost");
    const iPrice   = findCol("price_egp","price","bi","menu price","selling price");
    const iCat     = findCol("category","cat","type");
    const iSku     = findCol("sku","pos_sku","pos sku","item id","product sku");
    const iNewName = findCol("new_name","rename","new name","renamed","rename to");
    if (iName < 0 || (iCost < 0 && iPrice < 0)) {
      toast("CSV needs a name column + at least one of cost/price", "error");
      return;
    }
    // Aggressive normalization — strips parens content, diacritics, punctuation, collapses whitespace.
    // This is what fixes "match by name" failures: the menu uses names like
    // "Original Beats (Espresso)" or "Pistacchio Latte" and CSVs often have
    // slightly different spacing/accents/parens.
    const normFull = (s) => String(s||"").replace(/\s+/g," ").trim();
    const normKey = (s) => String(s||"")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")   // strip accents
      .toLowerCase()
      .replace(/\([^)]*\)/g, " ")                         // drop parenthetical
      .replace(/[^a-z0-9]+/g, " ")                        // keep alnum only
      .replace(/\s+/g, " ")
      .trim();
    const toNum = (x) => { const n = Number(String(x||"").replace(/[,\s]/g,"")); return isNaN(n) ? null : n; };
    // Build lookup maps once. IMPORTANT: the seed menu contains duplicates
    // (e.g. "Original Beats" and "Original Beats (Espresso)" both normalize to
    // "original beats"). We keep ALL entries per key in an array and update
    // every single one, otherwise the visible duplicate shows an empty cost.
    const byNameKey = new Map(); // key -> array of menu items
    const bySkuKey = new Map();
    for (const m of state.menu) {
      const k = normKey(m.name);
      if (!byNameKey.has(k)) byNameKey.set(k, []);
      byNameKey.get(k).push(m);
      if (m.pos_sku) bySkuKey.set(String(m.pos_sku).trim().toLowerCase(), m);
    }
    let updated = 0, added = 0, skipped = 0, renamed = 0, dupsTouched = 0;
    const unmatchedNames = [];
    // Heuristic: a row is a "section header" if it's all uppercase (like "HOT BEATS"),
    // or if both cost and price are missing/zero. We never want to add those to the menu.
    const looksLikeSectionHeader = (name, cost, price) => {
      const hasNumbers = (cost != null && cost > 0) || (price != null && price > 0);
      if (hasNumbers) return false;
      const letters = name.replace(/[^A-Za-z]/g,"");
      if (!letters) return true;
      return letters === letters.toUpperCase() && letters.length > 1;
    };
    for (let i=1; i<lines.length; i++) {
      const parts = parseLine(lines[i]);
      const name = normFull(parts[iName]);
      if (!name) { skipped++; continue; }
      const cost  = iCost  >= 0 ? toNum(parts[iCost])  : null;
      const price = iPrice >= 0 ? toNum(parts[iPrice]) : null;
      const category = iCat >= 0 ? normFull(parts[iCat]) : "";
      const sku = iSku >= 0 ? normFull(parts[iSku]) : "";
      const newName = iNewName >= 0 ? normFull(parts[iNewName]) : "";
      if (looksLikeSectionHeader(name, cost, price)) { skipped++; continue; }
      if ((cost == null || cost === 0) && (price == null || price === 0) && !newName) { skipped++; continue; }
      // Try SKU first, then normalized name key (returns ALL matches).
      let foundArr = null;
      if (sku) {
        const skuMatch = bySkuKey.get(sku.toLowerCase());
        if (skuMatch) foundArr = [skuMatch];
      }
      if (!foundArr) foundArr = byNameKey.get(normKey(name)) || null;
      // As a last resort, fall back to fuzzy contains match so "Pistacchio Latte"
      // still matches "Pistachio Latte" even with typos. Returns ALL matching items.
      if (!foundArr) {
        const key = normKey(name);
        const fuzzy = [];
        for (const m of state.menu) {
          const mk = normKey(m.name);
          if (!mk) continue;
          if (mk === key || mk.includes(key) || key.includes(mk)) fuzzy.push(m);
        }
        if (fuzzy.length) foundArr = fuzzy;
      }
      if (foundArr && foundArr.length) {
        // Apply cost/price to EVERY matching item. Fixes the common case where
        // the seed menu has duplicates with the same normalized name — uploading
        // once should zero out "cost: —" everywhere for that item.
        for (const found of foundArr) {
          if (cost  != null) found.cost_egp  = cost;
          if (price != null) found.price_egp = price;
          if (category) found.category = category;
          if (newName && newName.toLowerCase() !== found.name.toLowerCase()) {
            byNameKey.delete(normKey(found.name));
            found.name = newName;
            const nk = normKey(newName);
            if (!byNameKey.has(nk)) byNameKey.set(nk, []);
            byNameKey.get(nk).push(found);
            renamed++;
          }
        }
        if (foundArr.length > 1) dupsTouched += foundArr.length - 1;
        updated++;
      } else {
        unmatchedNames.push(name);
        state.menu.push({ id: "menu_" + uuid().slice(0,6), name: newName || name, price_egp: price||0, cost_egp: cost||0, category, branches: ["maadi","zawya"] });
        added++;
      }
    }
    saveState();
    const extra = unmatchedNames.length
      ? ` · New (no menu match): ${unmatchedNames.slice(0,5).join(", ")}${unmatchedNames.length > 5 ? "…" : ""}`
      : "";
    const renameNote = renamed ? `, ${renamed} renamed` : "";
    const dupNote = dupsTouched ? `, ${dupsTouched} duplicates also updated` : "";
    toast(`Menu updated: ${updated} matched${dupNote}${renameNote}, ${added} added${skipped?`, ${skipped} skipped`:""}${extra}`);
    render();
  });

  // ---------- Add / dedupe controls ----------
  const menuBtnRow = el("div", { style: { display: "flex", gap: "8px", flexWrap: "wrap", marginTop: "8px" } });
  if (u.role === "owner" || u.role === "accountant") {
    menuBtnRow.appendChild(el("button", { class: "btn secondary", onClick: addMenuItem }, "➕ Add menu item"));
  }
  menuBtnRow.appendChild(el("button", { class: "btn ghost", onClick: dedupeMenu }, "🧹 Merge duplicate menu items"));
  wrap.appendChild(menuBtnRow);

  function addMenuItem() {
    openPrompt({
      title: "Add menu item",
      fields: [
        { key: "name", label: "Name", type: "text", value: "" },
        { key: "price_egp", label: "Price (EGP)", type: "number", value: 0 },
        { key: "cost_egp", label: "Cost (EGP)", type: "number", value: 0 },
        { key: "category", label: "Category", type: "text", value: "" },
      ],
      onSubmit: (v) => {
        if (!v.name || !v.name.trim()) return toast("Name is required", "error");
        state.menu.push({
          id: "menu_" + uuid().slice(0, 6),
          name: v.name.trim(),
          price_egp: Number(v.price_egp) || 0,
          cost_egp:  Number(v.cost_egp)  || 0,
          category:  v.category || "",
          branches:  ["maadi","zawya"],
        });
        saveState();
        toast(`Added ${v.name}`);
        render();
      }
    });
  }

  function dedupeMenu() {
    const nk = (s) => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\([^)]*\)/g," ").replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();
    const groups = new Map();
    for (const m of state.menu) {
      const k = nk(m.name);
      if (!k) continue;
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(m);
    }
    const dups = [...groups.entries()].filter(([,arr]) => arr.length > 1);
    if (!dups.length) return toast("No duplicates found");
    if (!confirm(`Merge ${dups.length} duplicate name groups?`)) return;
    const removeIds = new Set();
    for (const [,arr] of dups) {
      // Pick the "richest" record as keeper (highest cost + price + sku length)
      arr.sort((a,b) => (Number(b.cost_egp||0)+Number(b.price_egp||0)+(b.pos_sku?5:0)+(b.name.length||0)) - (Number(a.cost_egp||0)+Number(a.price_egp||0)+(a.pos_sku?5:0)+(a.name.length||0)));
      const keep = arr[0];
      for (let i = 1; i < arr.length; i++) {
        const d = arr[i];
        if (!keep.cost_egp && d.cost_egp) keep.cost_egp = d.cost_egp;
        if (!keep.price_egp && d.price_egp) keep.price_egp = d.price_egp;
        if (!keep.pos_sku && d.pos_sku) keep.pos_sku = d.pos_sku;
        if (!keep.category && d.category) keep.category = d.category;
        removeIds.add(d.id);
      }
    }
    state.menu = state.menu.filter(m => !removeIds.has(m.id));
    saveState();
    toast(`Merged ${removeIds.size} duplicate rows`);
    render();
  }

  const search = el("input", { type: "search", placeholder: "Search…", style: { marginTop: "12px" } });
  wrap.appendChild(search);

  const list = el("div", { class: "list" });
  wrap.appendChild(list);
  const draw = () => {
    list.innerHTML = "";
    const q = search.value.trim().toLowerCase();
    const items = state.menu.filter(m => q === "" || m.name.toLowerCase().includes(q)).slice(0, 300);
    for (const m of items) {
      const margin = (m.price_egp && m.cost_egp) ? ((m.price_egp - m.cost_egp) / m.price_egp * 100) : null;
      list.appendChild(el("div", { class: "row", onClick: () => editMenu(m) }, [
        el("div", { class: "grow" }, [
          el("div", { class: "title" }, m.name),
          el("div", { class: "sub" }, `${m.category || "—"} · price ${money(m.price_egp)} · cost ${m.cost_egp ? money(m.cost_egp) : "—"}`),
        ]),
        el("div", {}, [
          margin != null ? el("span", { class: "pill", style: { color: margin>60?"var(--ok)":margin>40?"var(--warn)":"var(--bad)" } }, `${margin.toFixed(0)}%`) : el("span", { class: "pill" }, "no cost"),
        ]),
      ]));
    }
  };
  search.addEventListener("input", draw); draw();

  function editMenu(m) {
    openPrompt({
      title: `Edit ${m.name}`,
      fields: [
        { key: "name", label: "Name", type: "text", value: m.name },
        { key: "price_egp", label: "Price (EGP)", type: "number", value: m.price_egp || 0 },
        { key: "cost_egp", label: "Cost (EGP)", type: "number", value: m.cost_egp || 0 },
        { key: "category", label: "Category", type: "text", value: m.category || "" },
        { key: "delete", label: "Type DELETE to remove this item (leave blank to just edit)", type: "text", value: "" },
      ],
      onSubmit: v => {
        if (String(v.delete || "").trim().toUpperCase() === "DELETE") {
          if (!(u.role === "owner" || u.role === "accountant")) return toast("Only owner/accountant can delete menu items", "error");
          state.menu = state.menu.filter(x => x.id !== m.id);
          saveState();
          toast(`Removed ${m.name}`);
          render();
          return;
        }
        m.name = v.name; m.price_egp = Number(v.price_egp)||0; m.cost_egp = Number(v.cost_egp)||0; m.category = v.category;
        saveState(); render();
      }
    });
  }

  wrap.appendChild(btnBack());
  return wrap;
};

// Routes the owner can grant/revoke per-user via the Users screen. Order matters —
// this is the order they appear in the access-rights editor.
const MANAGEABLE_ROUTES = [
  "home","shifts","roster","roaster","handbook",
  "waste_new","waste_list","snapshot_new",
  "purchase_new","purchase_list","petty_cash",
  "shift_close_new","shift_close_list",
  "cleaning_log_new","cleaning_log_list",
  "signin_stamp_new","signin_stamp_list",
  "salaries","penalties","maadi_deposits",

  "leave_new","leave_list",
  "my_id","staff_hr","leaderboard",
];

routes.users = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Users", "Add team members, set PINs, grant or revoke access rights."));

  // Only owner/accountant can manage users (matches role policy — but double-check here
  // so someone with a manually-granted "users" route can't also mutate users)
  if (u.role !== "owner" && u.role !== "accountant") {
    wrap.appendChild(el("div", { class: "card" }, "Access restricted — owner/accountant only."));
    wrap.appendChild(btnBack());
    return wrap;
  }

  wrap.appendChild(el("div", { class: "banner-arch" },
    "Baristas rotate between Maadi and Zawya — they are never assigned to a single branch. " +
    "Only owners and head baristas can be pinned to a branch."));

  const btnRow = el("div", { style: { display: "flex", gap: "8px", flexWrap: "wrap" } });
  btnRow.appendChild(el("button", { class: "btn secondary", onClick: () => addUser() }, "➕ Add user"));
  btnRow.appendChild(el("button", { class: "btn ghost", onClick: () => {
    // Re-run migration — idempotent; adds any missing default baristas if not already there.
    // Won't overwrite renamed users — lookup is by ID/PIN, not name.
    migrateState(state);
    saveState();
    toast("Missing baristas seeded");
    render();
  } }, "🔄 Seed missing baristas"));
  wrap.appendChild(btnRow);

  // Normalize any existing baristas that were assigned to a single branch — they should all rotate.
  let migrated = 0;
  for (const usr of state.users) {
    if (usr.role === "barista") {
      const both = ["maadi","zawya"];
      if (!usr.branches || usr.branches.length !== 2 ||
          !usr.branches.includes("maadi") || !usr.branches.includes("zawya")) {
        usr.branches = both;
        migrated++;
      }
    }
  }
  if (migrated > 0) { saveState(); }

  const list = el("div", { class: "list", style: { marginTop: "12px" } });
  const _currentMonth = new Date().toISOString().slice(0,7);
  const _leaderAssign = getLeadershipAssignment(_currentMonth) || {};
  const LEADERSHIP_ROLE_BADGES = {
    weekly_schedule:      "📅 Schedule",
    inventory_management: "📦 Inventory",
    cash_status:          "💵 Cash",
    barista_hygiene:      "🧹 Hygiene",
  };
  for (const usr of state.users) {
    const branchLabel = usr.role === "barista"
      ? "rotates (Maadi + Zawya)"
      : (usr.branches && usr.branches.length ? usr.branches.join(", ") : "—");
    const extra = (usr.extra_access || []).length;
    const deny  = (usr.deny_access  || []).length;
    const rightsNote = (extra || deny) ? ` · +${extra}/-${deny} custom rights` : "";
    let leaderBadgeLabel = null;
    for (const [rk, label] of Object.entries(LEADERSHIP_ROLE_BADGES)) {
      if (_leaderAssign[rk] === usr.id) { leaderBadgeLabel = label; break; }
    }
    const rowChildren = [
      el("div", { class: "grow" }, [
        el("div", { class: "title" }, usr.name),
        el("div", { class: "sub" }, `${usr.role} · ${branchLabel} · PIN ${usr.pin}${rightsNote}`),
      ]),
      el("span", { class: "pill " + (usr.active ? "ok" : "bad") }, usr.active ? "active" : "disabled"),
    ];
    if (leaderBadgeLabel) {
      rowChildren.push(el("span", {
        class: "pill",
        style: { background: "var(--accent-bg,#fff8e1)", color: "var(--ink)", border: "1px solid var(--accent,#e8a020)", fontSize: "11px" },
      }, leaderBadgeLabel));
    }
    if ((usr.id_photo_urls || []).length > 0) {
      rowChildren.push(el("span", { class: "pill ok", style: { fontSize: "11px" } }, "🪪 ID"));
    }
    list.appendChild(el("div", { class: "row", onClick: () => editUser(usr) }, rowChildren));

  wrap.appendChild(list); wrap.appendChild(btnBack());

  function addUser() {
    openPrompt({
      title: "Add user",
      fields: [
        { key: "name", label: "Name", type: "text", value: "" },
        { key: "role", label: "Role (owner / accountant / head_barista / barista)", type: "text", value: "barista" },
        { key: "pin", label: "4-digit PIN", type: "text", value: "0000" },
        { key: "branches", label: "Branches (owner / head_barista only — baristas always rotate)", type: "text", value: "maadi,zawya" },
        { key: "email", label: "Email (for leave notifications — optional)", type: "text", value: "" },
      ],
      onSubmit: v => {
        if (!/^\d{4}$/.test(v.pin)) return toast("PIN must be 4 digits", "error");
        if (state.users.some(x => x.pin === v.pin)) return toast("That PIN is already in use — pick another", "error");
        const role = (v.role || "barista").trim();
        const branches = role === "barista"
          ? ["maadi","zawya"]
          : v.branches.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);
        state.users.push({ id: uuid(), name: v.name, role, pin: v.pin, branches, active: true, email: (v.email || "").trim() });
        saveState(); toast(`Added ${v.name}`); render();
      }
    });
  }

  function editUser(usr) {
    openPrompt({
      title: `Edit ${usr.name}`,
      fields: [
        { key: "name", label: "Name", type: "text", value: usr.name },
        { key: "role", label: "Role", type: "text", value: usr.role },
        { key: "pin", label: "PIN", type: "text", value: usr.pin },
        { key: "branches", label: "Branches (ignored for baristas — they always rotate)", type: "text", value: (usr.branches || []).join(",") },
        { key: "email", label: "Email (for leave approval notifications — optional)", type: "text", value: usr.email || "" },
        { key: "active", label: "Active? (yes/no)", type: "text", value: usr.active ? "yes" : "no" },
        { key: "delete", label: "Type DELETE to permanently remove this user", type: "text", value: "" },
      ],
      extraButtons: [
        { label: "🔐 Access rights…", onClick: () => editAccess(usr) },
        { label: "🪪 View / remove ID…", onClick: () => staffIdSheet(usr) },
      ],
      onSubmit: v => {
        if (String(v.delete || "").trim().toUpperCase() === "DELETE") {
          if (u.role !== "owner") return toast("Only the owner can delete users", "error");
          if (!confirm(`Remove ${usr.name} permanently? Their historical entries stay but they can no longer log in.`)) return;
          state.users = state.users.filter(x => x.id !== usr.id);
          saveState(); toast(`Removed ${usr.name}`); render();
          return;
        }
        usr.name = v.name; usr.role = v.role; usr.pin = v.pin;
        usr.branches = usr.role === "barista"
          ? ["maadi","zawya"]
          : v.branches.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);
        usr.email  = (v.email || "").trim();
        usr.active = /yes|y|true|1/i.test(v.active);
        saveState(); render();
      }
    });
  }

  function editAccess(usr) {
    if (u.role !== "owner") return toast("Only the owner can edit access rights", "error");
    // Build a dialog that shows every manageable route with a tri-state:
    //   default (follow role) | grant | revoke
    const sheet = el("div", {});
    sheet.appendChild(el("h2", {}, `Access rights — ${usr.name}`));
    sheet.appendChild(el("div", { class: "muted small" }, `Role: ${usr.role}. "Default" follows the role policy. "Allow" grants this route. "Deny" revokes it.`));
    const extras = new Set(usr.extra_access || []);
    const denies = new Set(usr.deny_access  || []);
    const rows = el("div", { class: "list" });
    sheet.appendChild(rows);
    const rolePolicy = ROLE_ACCESS[usr.role];
    const roleHas = (r) => rolePolicy === "*" || (Array.isArray(rolePolicy) && rolePolicy.includes(r));
    for (const r of MANAGEABLE_ROUTES) {
      const roleDefault = roleHas(r) ? "allow (by role)" : "deny (by role)";
      const state0 = extras.has(r) ? "allow" : denies.has(r) ? "deny" : "default";
      const sel = el("select", {}, [
        el("option", { value: "default", selected: state0==="default"?"true":null }, `Default — ${roleDefault}`),
        el("option", { value: "allow",   selected: state0==="allow"  ?"true":null }, "Allow (grant this route)"),
        el("option", { value: "deny",    selected: state0==="deny"   ?"true":null }, "Deny (revoke this route)"),
      ]);
      sel.addEventListener("change", () => {
        extras.delete(r); denies.delete(r);
        if (sel.value === "allow") extras.add(r);
        if (sel.value === "deny")  denies.add(r);
      });
      rows.appendChild(el("div", { class: "kv" }, [
        el("div", { class: "k" }, r),
        el("div", { class: "v" }, [sel]),
      ]));
    }
    sheet.appendChild(el("div", { class: "btn-row" }, [
      el("button", { class: "btn", onClick: () => {
        usr.extra_access = [...extras];
        usr.deny_access  = [...denies];
        saveState(); toast("Access rights saved");
        closeSheet();
        render();
      } }, "Save rights"),
      el("button", { class: "btn ghost", onClick: () => closeSheet() }, "Cancel"),
    ]));
    openSheet(sheet);
  }

  function staffIdSheet(usr) {
    const sheet = el("div", {});
    sheet.appendChild(el("h2", {}, `🪪 Government ID — ${usr.name}`));

    const photosWrap = el("div", {});
    sheet.appendChild(photosWrap);

    function renderPhotos() {
      photosWrap.innerHTML = "";
      const urls = usr.id_photo_urls || [];
      if (urls.length === 0) {
        photosWrap.appendChild(el("div", { class: "muted small", style: { margin: "8px 0 16px" } }, "No ID uploaded yet."));
      } else {
        const grid = el("div", { style: { display: "flex", flexWrap: "wrap", gap: "10px", margin: "8px 0 16px" } });
        urls.forEach((url, i) => {
          const card = el("div", { style: { display: "flex", flexDirection: "column", alignItems: "center", gap: "4px" } });
          card.appendChild(el("img", { src: url, style: { width: "90px", height: "64px", objectFit: "cover", borderRadius: "6px", border: "1px solid var(--border,#ddd)" } }));
          const linkRow = el("div", { style: { display: "flex", gap: "6px" } });
          linkRow.appendChild(el("a", { href: url, target: "_blank", class: "btn ghost", style: { fontSize: "12px", padding: "2px 8px" } }, "View"));
          if (u.role === "owner") {
            linkRow.appendChild(el("button", { class: "btn bad", style: { fontSize: "12px", padding: "2px 8px" },
              onClick: () => {
                usr.id_photo_urls = (usr.id_photo_urls || []).filter((_, j) => j !== i);
                saveState();
                toast("ID photo removed");
                renderPhotos();
              }
            }, "✕ Remove"));
          }
          card.appendChild(linkRow);
          grid.appendChild(card);
        });
        photosWrap.appendChild(grid);
      }
    }

    renderPhotos();

    sheet.appendChild(el("div", { class: "btn-row" }, [
      el("button", { class: "btn ghost", onClick: () => closeSheet() }, "Close"),
    ]));

    openSheet(sheet);
  }

  return wrap;
};

routes.dashboard = function (u, params) {
  const wrap = el("div", {});
  wrap.appendChild(header("Dashboards", "Revenue, COGS, overheads, gross + net profit."));

  // Normalize each sales row's branch to canonical maadi/zawya for reliable filtering.
  // (An imported row tagged "Zawya - Cairo" or similar still matches even if the stored
  // value wasn't normalized at import time.)
  const branchKey = (b) => {
    const s = String(b || "").trim().toLowerCase();
    if (s.includes("zawya")) return "zawya";
    if (s.includes("maadi")) return "maadi";
    return s;
  };

  // Index every sale by canonical branch + month so we can show the user
  // exactly what data is loaded — the dashboard used to look empty even
  // though data was imported, because filter comparisons were case-sensitive.
  const salesIndex = new Map(); // key "branch|YYYY-MM" -> count
  const monthSet = new Set();
  const branchSet = new Set();
  for (const s of state.sales) {
    const b = branchKey(s.branch);
    // Strip Zawya concession items at runtime so they never appear in any report
    if (b === "zawya" && isZawyaExcluded(s.category, s.item)) continue;
    const m = normalizeDate(s.date).slice(0,7);
    if (!m) continue;
    monthSet.add(m); branchSet.add(b);
    const k = b + "|" + m;
    salesIndex.set(k, (salesIndex.get(k) || 0) + 1);
  }
  const salesMonths = [...monthSet].sort();
  const latestSalesMonth = salesMonths[salesMonths.length - 1];

  let branch = branchKey((params && params.branch) || (u.branches && u.branches[0]) || "maadi");
  // Multi-month range — default to latest available month (or current)
  const _defaultMonth = latestSalesMonth || (new Date()).toISOString().slice(0,7);
  let monthFrom = (params && params.month) || _defaultMonth;
  let monthTo   = (params && params.month) || _defaultMonth;

  const nav = makeBranchPicker(["maadi","zawya"], () => branch, b => { branch = b; draw(); });
  wrap.appendChild(nav);

  // ---- Date range picker ----
  const rangeCard = el("div", { class: "card", style: { marginTop: "10px", display: "flex", flexWrap: "wrap", gap: "14px", alignItems: "flex-end" } });
  const mFromInput = el("input", { type: "month", value: monthFrom, style: { flex: "1", minWidth: "160px" } });
  const mToInput   = el("input", { type: "month", value: monthTo,   style: { flex: "1", minWidth: "160px" } });
  mFromInput.addEventListener("input", () => {
    monthFrom = mFromInput.value;
    // ensure from <= to
    if (monthTo < monthFrom) { monthTo = monthFrom; mToInput.value = monthTo; }
    draw();
  });
  mToInput.addEventListener("input", () => {
    monthTo = mToInput.value;
    // cap range to 12 months
    const fromDate = new Date(monthFrom + "-01");
    const toDate   = new Date(monthTo   + "-01");
    const diffMonths = (toDate.getFullYear() - fromDate.getFullYear()) * 12 + (toDate.getMonth() - fromDate.getMonth());
    if (diffMonths > 11) {
      const capped = new Date(fromDate); capped.setMonth(capped.getMonth() + 11);
      monthTo = capped.toISOString().slice(0,7);
      mToInput.value = monthTo;
    }
    if (monthTo < monthFrom) { monthTo = monthFrom; mToInput.value = monthTo; }
    draw();
  });
  rangeCard.appendChild(el("div", { style: { flex: "1", minWidth: "160px" } }, [
    el("label", { style: { display: "block", fontSize: "13px", color: "var(--ink-dim)", marginBottom: "4px" } }, "From month"),
    mFromInput,
  ]));
  rangeCard.appendChild(el("div", { style: { flex: "1", minWidth: "160px" } }, [
    el("label", { style: { display: "block", fontSize: "13px", color: "var(--ink-dim)", marginBottom: "4px" } }, "To month (max 12 months)"),
    mToInput,
  ]));
  // Quick-select buttons
  const quickBtns = el("div", { style: { display: "flex", gap: "6px", flexWrap: "wrap" } });
  const addQuick = (label, from, to) => {
    quickBtns.appendChild(el("button", { class: "chip", onClick: () => {
      monthFrom = from; monthTo = to;
      mFromInput.value = monthFrom; mToInput.value = monthTo; draw();
    }}, label));
  };
  // Build quick selects from available months
  if (salesMonths.length) {
    const last = salesMonths[salesMonths.length - 1];
    const prev = salesMonths.length >= 2 ? salesMonths[salesMonths.length - 2] : last;
    addQuick("Latest month", last, last);
    if (prev !== last) addQuick("Last 2 months", prev, last);
    if (salesMonths.length >= 3) addQuick("Last 3 months", salesMonths[salesMonths.length - 3], last);
    if (salesMonths.length >= 6) addQuick("Last 6 months", salesMonths[salesMonths.length - 6], last);
    if (salesMonths.length > 1)  addQuick("All data", salesMonths[0], last);
  }
  rangeCard.appendChild(el("div", { style: { width: "100%" } }, [
    el("div", { style: { fontSize: "12px", color: "var(--ink-faint)", marginBottom: "4px" } }, "Quick select"),
    quickBtns,
  ]));
  wrap.appendChild(rangeCard);

  // ---------- DATA COVERAGE DIAGNOSTIC ----------
  const diag = el("div", { class: "card", style: { marginTop: "10px", borderColor: "var(--accent)" } });
  wrap.appendChild(diag);

  const body = el("div", {});
  wrap.appendChild(body);

  // Helper: all months in [from, to] range
  function monthsInRange(from, to) {
    const result = [];
    let cur = new Date(from + "-01");
    const end = new Date(to + "-01");
    while (cur <= end) {
      result.push(cur.toISOString().slice(0,7));
      cur.setMonth(cur.getMonth() + 1);
    }
    return result;
  }

  function draw() {
    // Recompute salesMonths in case new data was added
    const currentMonths = [...monthSet].sort();

    // diagnostic
    diag.innerHTML = "";
    diag.appendChild(el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } }, "Sales data in the app"));
    const rangeMonths = monthsInRange(monthFrom, monthTo);
    const rangeLabel = monthFrom === monthTo ? monthFrom : `${monthFrom} → ${monthTo} (${rangeMonths.length} months)`;
    diag.appendChild(el("div", { style: { fontSize: "20px", fontWeight: "700" } },
      `${state.sales.length} total rows · ${branchSet.size} branches · ${currentMonths.length} months stored`));
    diag.appendChild(el("div", { class: "muted small", style: { marginTop: "4px" } }, `Showing: ${rangeLabel}`));
    if (currentMonths.length) {
      const combos = [...salesIndex.entries()].map(([k,count]) => { const [b,m]=k.split("|"); return { b, m, count }; })
        .sort((a,bb) => bb.m.localeCompare(a.m) || a.b.localeCompare(bb.b));
      const pills = el("div", { style: { display: "flex", flexWrap: "wrap", gap: "6px", marginTop: "8px" } });
      for (const c of combos.slice(0, 24)) {
        const inSel = (c.b === branch && c.m >= monthFrom && c.m <= monthTo);
        pills.appendChild(el("button", {
          class: "chip",
          style: inSel ? { background: "var(--accent)", color: "#2b1810", fontWeight: "700" } : {},
          onClick: () => { branch = c.b; monthFrom = c.m; monthTo = c.m; mFromInput.value = c.m; mToInput.value = c.m; draw(); },
        }, `${c.b} · ${c.m} (${c.count})`));
      }
      diag.appendChild(pills);
    } else {
      diag.appendChild(el("div", { class: "muted small", style: { marginTop: "6px" } }, "No sales uploaded yet. Use Upload Sales (POS) to add a CSV."));
    }

    body.innerHTML = "";
    const monthStart    = monthFrom + "-01";
    const nextMonthStart = (() => { const d = new Date(monthTo + "-01"); d.setMonth(d.getMonth()+1); return d.toISOString().slice(0,10); })();

    // filter — case-insensitive branch + date range
    const inRange = (d) => { const nd = normalizeDate(d).slice(0,7); return nd >= monthFrom && nd <= monthTo; };
    // Filter by branch + date, and strip Zawya concession items from all calculations at runtime
    const sales = state.sales.filter(s =>
      branchKey(s.branch) === branch &&
      inRange(s.date) &&
      !(branch === "zawya" && isZawyaExcluded(s.category, s.item))
    );
    const waste = state.waste.filter(w => branchKey(w.branch) === branch && (w.at||"").slice(0,7) >= monthFrom && (w.at||"").slice(0,7) <= monthTo);
    const purch = state.purchases.filter(p => branchKey(p.branch) === branch && inRange(p.date));

    // Empty-state: tell the user exactly what went wrong if their current filter has no data
    if (sales.length === 0 && state.sales.length > 0) {
      body.appendChild(el("div", { class: "banner-arch", style: { borderColor: "var(--bad)", color: "var(--bad)", fontWeight: "700" } },
        `No sales for ${branch} · ${rangeLabel}. Tap one of the pills above to jump to data you have.`));
    }

    const revenue = sales.reduce((s,r) => s + (Number(r.net_sales)||0), 0);
    const discount = sales.reduce((s,r) => s + ((Number(r.gross_sales)||0) - (Number(r.net_sales)||0)), 0);
    const purchTotal = purch.reduce((s,p) => s + (Number(p.total)||0), 0);

    // COGS from sales × menu cost (normalized name match)
    const normName = (s) => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\([^)]*\)/g," ").replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();
    const menuByName = new Map(state.menu.map(m => [normName(m.name), m]));
    let cogsSales = 0, matched = 0, unmatched = 0;
    for (const r of sales) {
      const m = menuByName.get(normName(r.item));
      if (m && m.cost_egp) { cogsSales += (Number(r.qty)||0) * (Number(m.cost_egp)||0); matched += Number(r.qty)||0; }
      else unmatched += Number(r.qty)||0;
    }

    function lastUnitCost(inv_item_id) {
      let last = null, lastAt = "";
      for (const p of state.purchases) for (const ln of p.lines) {
        if (ln.inv_item_id === inv_item_id && p.at > lastAt) { last = Number(ln.unit_cost)||0; lastAt = p.at; }
      }
      return last;
    }
    let wasteCost = 0;
    for (const w of waste) {
      const c = lastUnitCost(w.inv_item_id);
      if (c != null) wasteCost += c * (Number(w.qty_canonical)||0);
    }

    // Theoretical consumption from snapshots (unchanged)
    const snaps = state.snapshots.slice().sort((a,b) => a.created_at.localeCompare(b.created_at));
    const opening = [...snaps].reverse().find(s => s.created_at < monthStart) || snaps[0];
    const closing = [...snaps].reverse().find(s => s.created_at < nextMonthStart);
    let snapshotNote = "";
    if (!opening) snapshotNote = "No opening snapshot.";
    else if (!closing || closing.id === opening?.id) snapshotNote = "No closing snapshot for this month yet — theoretical consumption unavailable.";
    const theoretical = {};
    if (opening && closing && closing.id !== opening.id) {
      for (const it of state.items) {
        const o = opening.entries.find(e => e.branch === branch && e.item_id === it.id)?.qty || 0;
        const cqty = closing.entries.find(e => e.branch === branch && e.item_id === it.id)?.qty || 0;
        const p = purch.reduce((s,pp) => s + pp.lines.filter(l => l.inv_item_id === it.id).reduce((ss,ll)=>ss+(Number(ll.qty_canonical)||0),0), 0);
        theoretical[it.id] = o + p - cqty;
      }
    }
    let theoreticalCost = 0, theoreticalCounted = 0;
    for (const [iid, qty] of Object.entries(theoretical)) {
      const c = lastUnitCost(iid);
      if (c != null) { theoreticalCost += c * qty; theoreticalCounted++; }
    }

    // ---------- OVERHEADS + SALARIES for this branch+month ----------
    state.overheads = state.overheads || [];
    state.salaries = state.salaries || [];
    // Only PAID overheads impact net profit. Unpaid recurring bills (electricity, etc.)
    // are shown in the Overheads screen but excluded here until marked paid.
    const ohRows = state.overheads.filter(o =>
      (o.branch ? branchKey(o.branch) === branch : true) &&
      ((o.month || "") >= monthFrom && (o.month || "") <= monthTo) &&
      (o.paid !== false) // legacy rows without the flag count as paid
    );
    const overheadsTotal = ohRows.reduce((s,o) => s + (Number(o.amount)||0), 0);
    // Salaries: multiply by number of months in range
    const _numMonths = rangeMonths.length || 1;
    const _activeStaff = (state.users || []).filter(x => x.active && (x.role === "barista" || x.role === "head_barista"));
    const _totalStaffSalary = _activeStaff.reduce((sum, p) => {
      const cfg = (state.salary_config || {})[p.id] || {};
      return sum + (Number(cfg.monthly_salary) || 0);
    }, 0);
    const salariesTotal = _totalStaffSalary > 0 ? Math.round((_totalStaffSalary / 2) * _numMonths) : 0;
    const totalOpex = overheadsTotal + salariesTotal;

    // ---------- KEY METRICS ----------
    const cogs = cogsSales; // sales-derived (use theoretical if you prefer — see note on P&L card)
    const grossProfit = revenue - cogs;
    const netProfit = grossProfit - totalOpex;
    const cogsPct = revenue ? (cogs / revenue) * 100 : 0;
    const gmPct = revenue ? (grossProfit / revenue) * 100 : 0;
    const npPct = revenue ? (netProfit / revenue) * 100 : 0;

    // ---------- top KPI cards ----------
    body.appendChild(el("div", { class: "grid c2" }, [
      kpi("Revenue (Net)", money(revenue), sales.length + " rows"),
      kpi("Discount", money(discount), (revenue + discount) ? ((discount/(revenue+discount))*100).toFixed(1)+"%" : "—"),
      kpi("Purchases", money(purchTotal), purch.length + " invoices"),
      kpi("Waste events", String(waste.length), money(wasteCost) + " valued"),
    ]));

    // ---------- PROFITABILITY % CARDS ----------
    body.appendChild(el("div", { class: "card", style: { marginTop: "14px" } }, [
      el("h2", {}, "Profitability"),
      el("div", { class: "grid c3" }, [
        el("div", {}, [
          el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } }, "COGS %"),
          el("div", { style: { fontSize: "28px", fontWeight: "700", color: cogsPct > 35 ? "var(--bad)" : cogsPct > 28 ? "var(--warn)" : "var(--ok)" } }, (revenue ? cogsPct.toFixed(1) : "—") + "%"),
          el("div", { class: "muted small" }, money(cogs)),
        ]),
        el("div", {}, [
          el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } }, "Gross margin %"),
          el("div", { style: { fontSize: "28px", fontWeight: "700", color: gmPct >= 65 ? "var(--ok)" : gmPct >= 55 ? "var(--warn)" : "var(--bad)" } }, (revenue ? gmPct.toFixed(1) : "—") + "%"),
          el("div", { class: "muted small" }, money(grossProfit)),
        ]),
        el("div", {}, [
          el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } }, "Net profit %"),
          el("div", { style: { fontSize: "28px", fontWeight: "700", color: npPct >= 20 ? "var(--ok)" : npPct >= 10 ? "var(--warn)" : "var(--bad)" } }, (revenue ? npPct.toFixed(1) : "—") + "%"),
          el("div", { class: "muted small" }, money(netProfit)),
        ]),
      ]),
      el("div", { class: "muted small", style: { marginTop: "8px" } },
        `Revenue ${money(revenue)} − COGS ${money(cogs)} − Overheads ${money(overheadsTotal)} − Salaries ½ share ${money(salariesTotal)} = Net ${money(netProfit)}`),
    ]));

    // ---------- P&L reconciliation ----------
    body.appendChild(el("div", { class: "card", style: { marginTop: "14px" } }, [
      el("h2", {}, "P&L close — COGS reconciliation"),
      el("div", { class: "kv" }, [ el("div", { class: "k" }, "COGS from sales × item cost"), el("div", { class: "v" }, money(cogsSales)) ]),
      el("div", { class: "kv" }, [ el("div", { class: "k" }, "COGS theoretical (opening + purchases − closing)"), el("div", { class: "v" }, closing && opening && closing.id!==opening.id ? money(theoreticalCost) : "—") ]),
      el("div", { class: "kv" }, [ el("div", { class: "k" }, "Waste cost"), el("div", { class: "v" }, money(wasteCost)) ]),
      el("div", { class: "kv" }, [ el("div", { class: "k" }, "Theoretical − sales-derived (variance)"), el("div", { class: "v" }, (closing && opening && closing.id!==opening.id) ? money(theoreticalCost - cogsSales) : "—") ]),
      el("div", { class: "muted small", style: { marginTop: "6px" } }, snapshotNote || `Matched ${matched} units · unmatched ${unmatched} units · ${theoreticalCounted} inventory items valued.`),
    ]));

    // ---------- Overheads breakdown ----------
    if (ohRows.length || salariesTotal > 0) {
      const card = el("div", { class: "card", style: { marginTop: "14px" } });
      card.appendChild(el("h2", {}, `Overheads + salaries — ${rangeLabel}`));
      for (const o of ohRows) {
        card.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, `${o.category || "overhead"}${o.note ? " — " + o.note : ""}`),
          el("div", { class: "v" }, money(o.amount)),
        ]));
      }
      if (salariesTotal > 0) {
        card.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, [
            el("span", {}, "Staff salaries — ½ share (split equally across both branches)"),
            el("div", { class: "muted small" }, `${money(_totalStaffSalary / 2)}/mo × ${_numMonths} month(s) = ${money(salariesTotal)} this branch`),
          ]),
          el("div", { class: "v" }, money(salariesTotal)),
        ]));
      }
      card.appendChild(el("div", { class: "hr" }));
      card.appendChild(el("div", { class: "kv" }, [
        el("div", { class: "k" }, el("b", {}, "Total operating expenses")),
        el("div", { class: "v" }, el("b", {}, money(totalOpex))),
      ]));
      body.appendChild(card);
    }

    // ---------- top items ----------
    const byItem = new Map();
    for (const r of sales) {
      const k = r.item || "—";
      const cur = byItem.get(k) || { qty: 0, net: 0, cogs: 0 };
      cur.qty += Number(r.qty)||0;
      cur.net += Number(r.net_sales)||0;
      const m = menuByName.get(normName(k));
      if (m && m.cost_egp) cur.cogs += (Number(r.qty)||0) * (Number(m.cost_egp)||0);
      byItem.set(k, cur);
    }
    const top = [...byItem.entries()].map(([name, v]) => ({ name, ...v, margin: v.net ? ((v.net - v.cogs)/v.net)*100 : 0 }))
      .sort((a,b) => b.net - a.net).slice(0, 15);
    if (top.length) {
      const card = el("div", { class: "card", style: { marginTop: "14px" } });
      card.appendChild(el("h2", {}, "Top items by net revenue"));
      const tbl = el("table", {}, [
        el("thead", {}, el("tr", {}, ["Item","Qty","Net","Margin%"].map(h => el("th", {}, h)))),
        el("tbody", {}, top.map(r => el("tr", {}, [
          el("td", {}, r.name), el("td", { class: "num" }, String(r.qty)),
          el("td", { class: "num" }, money(r.net)),
          el("td", { class: "num", style: { color: r.margin>60?"var(--ok)":r.margin>40?"var(--warn)":"var(--bad)" } }, r.cogs ? r.margin.toFixed(0)+"%" : "—"),
        ]))),
      ]);
      card.appendChild(tbl);
      body.appendChild(card);
    }
  }
  draw();
  wrap.appendChild(btnBack());
  return wrap;
};

function kpi(label, val, sub) {
  return el("div", { class: "card" }, [
    el("div", { class: "muted" }, label),
    el("div", { style: { fontSize: "24px", fontWeight: "700" } }, val),
    el("div", { class: "muted small" }, sub || ""),
  ]);
}

    pc.appendChild(el("div", { class: "kv" }, [
      el("div", { class: "k" }, `${b}`),

            });
            saveState(); toast("Saved"); render();

          const wrap2 = el("span", {}); wrap2.appendChild(i); wrap2.appendChild(btn); return wrap2;

    tcSave.addEventListener("click", () => {
      const newCode = tcIn.value.trim();
      if (newCode.length < 6) { toast("Code must be at least 6 characters", "error"); return; }
      state.settings.team_code = newCode;
      saveState({ immediate: true });
      // Re-lock all devices (current device stays unlocked since it just changed the code)
      toast("Access code updated ✓ — share the new code with your team.");
    });
    tcRow.appendChild(tcSave);

    tc.appendChild(tcRow);
    wrap.appendChild(tc);
  }

  // ── Firebase Auth migration (owner only, one-time) ─────────────────────────
  if (u.role === "owner") {
    const migCard = el("div", { class: "card", style: { marginTop: "14px" } });
    migCard.appendChild(el("h2", {}, "🔐 Firebase Auth Migration"));
    migCard.appendChild(el("div", { class: "muted small", style: { marginBottom: "10px" } },
      "One-time setup: creates a secure Firebase Auth account for each staff member. Run this once after deploying Cloud Functions. Existing staff PINs will be hashed server-side."));
    const migLog = el("div", { style: { fontFamily: "monospace", fontSize: "12px", background: "var(--surface-2)", padding: "10px", borderRadius: "8px", maxHeight: "160px", overflowY: "auto", marginBottom: "10px", display: "none" } });
    migCard.appendChild(migLog);
    const migBtn = el("button", { class: "btn", onClick: async () => {
      if (!confirm("Create Firebase Auth accounts for all active staff? Existing accounts will be skipped.")) return;
      migBtn.disabled = true; migBtn.textContent = "Migrating…";
      migLog.style.display = "block"; migLog.innerHTML = "";
      const migrateUser = functions.httpsCallable("migrateUser");
      const users = (state.users || []).filter(u => u.active && u.role !== "manager" && u.role !== "helper");
      let ok = 0, skip = 0;
      for (const su of users) {
        if (su.staff_uid) { migLog.innerHTML += `⏭ ${su.name} — already migrated<br>`; skip++; continue; }
        try {
          const { data } = await migrateUser({ name: su.name, role: su.role, branches: su.branches || [], pin: su.pin || "0000", legacyId: su.id });
          su.staff_uid = data.uid;
          migLog.innerHTML += `✅ ${su.name} → ${data.uid}<br>`;
          ok++;
        } catch (e) {
          migLog.innerHTML += `❌ ${su.name} — ${e.message}<br>`;
        }
        migLog.scrollTop = migLog.scrollHeight;
      }
      saveState();
      migLog.innerHTML += `<br><b>Done: ${ok} created, ${skip} skipped.</b>`;
      migBtn.textContent = "Run Migration"; migBtn.disabled = false;
      toast(`Migration complete — ${ok} accounts created`);
    } }, "Run Migration");
    migCard.appendChild(migBtn);
    wrap.appendChild(migCard);
  }

  // danger
  const dz = el("div", { class: "card", style: { marginTop: "14px", borderColor: "var(--bad)" } });
  dz.appendChild(el("h2", {}, "Danger zone"));
  dz.appendChild(el("button", { class: "btn danger", onClick: () => {
    if (!confirm("Wipe ALL data on this device? Make sure you exported a backup first.")) return;
    localStorage.removeItem(STORAGE_KEY); location.reload();
  }}, "Wipe local data"));
  wrap.appendChild(dz);

  wrap.appendChild(btnBack());
  return wrap;
};

routes.signin_stamp_new = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Sign-In Stamp", "Upload a photo of the iPad clock showing your arrival time."));

  let branch   = u.branches[0];
  let note     = "";

  const branchPicker = makeBranchPicker(u.branches, () => branch, b => { branch = b; });
  wrap.appendChild(branchPicker);

  wrap.appendChild(el("div", { class: "card", style: { background: "var(--surface-2)", marginBottom: "14px" } }, [
    el("div", { style: { fontWeight: "600", marginBottom: "4px" } }, "How to stamp in"),
    el("div", { class: "muted small" }, "1. Open the clock on the iPad (or any screen showing the time)."),
    el("div", { class: "muted small" }, "2. Photograph it clearly — date and time must be visible."),
    el("div", { class: "muted small" }, "3. Upload it below and tap Submit."),
  ]));

  const stampPhotoField = makePhotoField({ label: "Clock-in photo(s)", required: true, formLabel: "Sign-In Stamp" });
  wrap.appendChild(stampPhotoField.el);

  wrap.appendChild(el("label", {}, "Note (optional)"));
  const noteInput = el("input", { type: "text", placeholder: "e.g. Late — metro delay" });
  noteInput.addEventListener("input", () => note = noteInput.value);
  wrap.appendChild(noteInput);

  wrap.appendChild(el("div", { class: "sticky-actions" }, [
    el("button", {
      class: "btn",
      onClick: async () => {
        const photoBlobs = stampPhotoField.getBlobs();
        if (!photoBlobs.length) return toast("Please attach at least one clock-in photo", "error");
        const photoNames = photoBlobs.map(f => f.name);
        const s = stamp();
        const photoIds = photoBlobs.map(() => uuid());
        for (let i = 0; i < photoBlobs.length; i++) {
          try { await IDB.put(photoIds[i], photoBlobs[i]); } catch (e) { console.warn(e); }
        }
        // Pre-compute early_bonus before pushing so it's in the record
        const _stampSubmitTime = new Date(s.at);
        const _stampTodayStr   = localISODate(_stampSubmitTime);
        const _stampBot        = state.branch_opening_times || {};
        const _stampOpenStr    = ((_stampBot[branch?.toLowerCase()] || {})["morning"])
                                 || (branch?.toLowerCase() === "maadi" ? "10:00" : "12:00");
        const _stampOpeningMs  = new Date(_stampTodayStr + "T" + _stampOpenStr + ":00").getTime();
        const _stampMinsLate   = Math.round((_stampSubmitTime.getTime() - _stampOpeningMs) / 60000);
        const _earlyBonus      = _stampMinsLate <= -30;

        state.signin_stamps.push({
          id: uuid(), at: s.at, by: s.by, by_name: s.by_name, device: s.device,
          branch,
          photo_id: photoIds[0], photo_name: photoNames[0],
          photo_ids: photoIds, photo_names: photoNames,
          drive_ids: stampPhotoField.getDriveIds(),
          note: note.trim(),
          early_bonus: _earlyBonus,
          mins_late: _stampMinsLate,
        });

        // ── Auto late-penalty from photo upload timestamp ─────
        (function() {
          const submitTime = new Date(s.at);
          const todayStr   = localISODate(submitTime); // local date, not UTC
          const dayIndex   = (submitTime.getDay() + 6) % 7; // 0=Mon … 6=Sun
          const dayKey     = ROSTER_DAYS[dayIndex];
          const weekOf     = mondayOf(todayStr);

          // Sign-in stamp = morning shift only.
          // Only penalise if this barista is currently assigned to the morning shift
          // at this branch today — checked live so mid-week swaps take effect immediately.
          const morningEntry = (state.rosters || []).find(r =>
            r.week_of === weekOf &&
            r.branch  === branch.toLowerCase() &&
            r.day     === dayKey &&
            r.shift   === "morning" &&
            r.user_id === u.id
          );
          if (!morningEntry) return; // not today's morning barista — no penalty

          // Get morning opening time for this branch from the schedule config
          const bot      = state.branch_opening_times || {};
          const openStr  = ((bot[branch.toLowerCase()] || {})["morning"])
                           || (branch.toLowerCase() === "maadi" ? "10:00" : "12:00");
          const openingMs = new Date(todayStr + "T" + openStr + ":00").getTime();
          const minsLate  = Math.round((submitTime.getTime() - openingMs) / 60000);

          if (minsLate <= 15) return; // on time or within grace period

          // Prevent duplicate auto-penalty for same person on same date
          const already = (state.penalties || []).find(p =>
            p.auto_late && p.user_id === u.id && p.date === todayStr
          );
          if (already) return;

          notifyLeadershipRole("weekly_schedule",
            `Late arrival — ${u.name}`,
            `${minsLate} min late at ${branch} on ${todayStr}.`
          );

          // Penalty tier: >15 min = ½ day · >60 min = 1 day · >120 min = 2 days
          const kind   = minsLate > 120 ? "two_days" : minsLate > 60 ? "full_day" : "half_day";
          const salary = Number(((state.salary_config || {})[u.id] || {}).monthly_salary || 0);
          let amount   = penaltyAmount(kind, salary);

          // Doubling rule: >2 late incidents from the same barista this month → double the penalty
          const thisMonth      = todayStr.slice(0, 7);
          const priorLateCount = (state.penalties || []).filter(p =>
            p.auto_late && p.user_id === u.id && p.month === thisMonth
          ).length;
          const doubled = priorLateCount >= 2;
          if (doubled) amount = amount * 2;

          const kLabels = { half_day: "Half day", full_day: "Full day", two_days: "2 days" };
          const kLabel  = kLabels[kind] || kind;
          const doubleNote = doubled ? " (×2 — 3rd+ late this month)" : "";

          state.penalties = state.penalties || [];
          state.penalties.push({
            id: uuid(), at: s.at, by: s.by, by_name: s.by_name,
            user_id: u.id, barista: u.name,
            kind, reason: "late",
            date: todayStr,
            month: thisMonth,
            branch,
            amount,
            note: `Auto: ${minsLate} min late — ${kLabel} deducted${doubleNote} (sign-in stamp)`,
            auto_late: true,
          });
          saveState();
          toast(`⚠ ${minsLate} min late — ${kLabel}${doubled ? " ×2" : ""} deducted from ${u.name}'s salary`, "warn");

          // ── High-priority in-app notification + email to owner/head barista ──
          const lateTitle = `🚨 Late Arrival: ${u.name}`;
          const lateBody  = `${minsLate} min late at ${branch} — ${kLabel}${doubleNote} deducted`;
          notifyHaidi(lateTitle, lateBody);
          notifyLeadershipRole("head_barista", lateTitle, lateBody);

          (() => {
            const ownerEmail = ((state.settings || {}).owner_email || "coffeebeats@haidiyacoub.com").trim();
            const hbEmail    = ((state.settings || {}).head_barista_email || "").trim();
            const subj = encodeURIComponent(`[Late Arrival] ${u.name} · ${minsLate} min late · ${branch} · ${todayStr}`);
            const mailBody = encodeURIComponent(
              `🚨 High Priority — Late Arrival\n\nBarista: ${u.name}\nBranch: ${branch}\nDate: ${todayStr}\nMinutes late: ${minsLate}\nPenalty: ${kLabel}${doubleNote}\n\n— Coffee Beats Operations App`
            );
            const toAddr  = hbEmail || ownerEmail;
            const ccPart  = hbEmail ? `&cc=${encodeURIComponent(ownerEmail)}` : "";
            try { window.open(`mailto:${encodeURIComponent(toAddr)}?subject=${subj}${ccPart}&body=${mailBody}`, "_blank"); } catch(e) {}
          })();
          // ────────────────────────────────────────────────────────────────────
        })();
        // ─────────────────────────────────────────────────────

        // ── Early arrival bonus toast ─────────────────────────
        if (_earlyBonus) {
          toast(`⭐ ${Math.abs(_stampMinsLate)} min early — punctuality bonus recorded!`, "ok");
        }
        // ─────────────────────────────────────────────────────

        showPhotoConfirm({
          title: "Clock-in recorded!",
          names: photoNames,
          driveIds: stampPhotoField.getDriveIds(),
          onDone: () => go("signin_stamp_list"),
        });
      },
    }, "Submit clock-in"),
    el("button", { class: "btn ghost", style: { marginTop: "8px" }, onClick: () => go("home") }, "← Back to home"),
  ]));
  return wrap;
};

routes.signin_stamp_list = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Sign-In Stamps", "Clock-in records per barista."));

  const mine = state.signin_stamps
    .filter(s => u.role === "owner" || u.role === "accountant" || u.branches.includes(s.branch))
    .sort((a, b) => b.at.localeCompare(a.at))
    .slice(0, 100);

  const list = el("div", { class: "list" });
  if (mine.length === 0) list.appendChild(el("div", { class: "muted" }, "No sign-in stamps yet."));
  for (const s of mine) {
    // Compute status badge from stored mins_late or recalculate
    let minsLate = s.mins_late;
    if (minsLate === undefined) {
      try {
        const branch  = (s.branch||"maadi").toLowerCase();
        const bot     = state.branch_opening_times || {};
        const openStr = ((bot[branch]||{})["morning"]) || (branch === "maadi" ? "10:00" : "12:00");
        const dateStr = localISODate(new Date(s.at));
        const openMs  = new Date(dateStr + "T" + openStr + ":00").getTime();
        minsLate = Math.round((new Date(s.at).getTime() - openMs) / 60000);
      } catch(e) { minsLate = 0; }
    }
    const isEarly   = minsLate <= -30;
    const isOnTime  = minsLate <= 15;
    const isHalfDay = minsLate > 15  && minsLate <= 60;
    const isFullDay = minsLate > 60  && minsLate <= 120;
    const isTwoDays = minsLate > 120;
    const badge = isEarly   ? el("span", { class: "pill", style: { background: "var(--ok)",   color: "#fff" } }, "⭐ Early")
                : isOnTime  ? el("span", { class: "pill", style: { background: "var(--ok)",   color: "#fff" } }, "✅ On time")
                : isHalfDay ? el("span", { class: "pill", style: { background: "var(--warn)",  color: "#fff" } }, "⚠ ½ day")
                : isFullDay ? el("span", { class: "pill", style: { background: "var(--bad)",   color: "#fff" } }, "❌ 1 day")
                :             el("span", { class: "pill", style: { background: "var(--bad)",   color: "#fff" } }, "❌ 2 days");
    const minStr = isEarly ? `${Math.abs(minsLate)} min early` : minsLate > 0 ? `${minsLate} min late` : "on time";
    list.appendChild(el("div", { class: "row" }, [
      el("div", { class: "grow" }, [
        el("div", { class: "title" }, `${s.by_name} · ${s.branch}`),
        el("div", { class: "sub" }, `${fmtDate(s.at)} · ${minStr}${s.note ? " · " + s.note : ""}`),
      ]),
      badge,
    ]));
  }
  wrap.appendChild(list);
  wrap.appendChild(el("div", { class: "sticky-actions" }, [
    el("button", { class: "btn", onClick: () => go("signin_stamp_new") }, "+ New clock-in"),
    el("button", { class: "btn ghost", style: { marginTop: "8px" }, onClick: () => go("home") }, "← Home"),
  ]));
  return wrap;
};

// Legacy IndexedDB kept for any previously stored uploads
(function setupHandbookDB() {
  const DB = "coffee-beats-handbook", STORE = "files";
  window._hdbInstance = null;
  window._openHandbookDB = () => {
    if (window._hdbInstance) return Promise.resolve(window._hdbInstance);
    return new Promise((res, rej) => {
      const req = indexedDB.open(DB, 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore(STORE);
      req.onsuccess = e => { window._hdbInstance = e.target.result; res(e.target.result); };
      req.onerror = e => rej(e.target.error);
    });
  };
  window._saveHandbook = async (file, uploader) => {
    const data = await file.arrayBuffer();
    const db = await window._openHandbookDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put({ name: file.name, type: file.type, data, uploadedAt: new Date().toISOString(), uploadedBy: uploader || "" }, "handbook");
      tx.oncomplete = () => res();
      tx.onerror = e => rej(e.target.error);
    });
  };
  window._loadHandbook = async () => {
    const db = await window._openHandbookDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, "readonly");
      const req = tx.objectStore(STORE).get("handbook");
      req.onsuccess = e => res(e.target.result || null);
      req.onerror = e => rej(e.target.error);
    });
  };
})();

// ==============================================================
// LEAVE — REQUEST (annual / sick)
// All roles can access; baristas auto-select themselves.
// Head barista / owner can submit on behalf of any barista.
// Leave must start at least 7 days from today.
// On submit: mailto: → head barista (To:), owner (CC:)
// ==============================================================
routes.leave_new = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Request Leave", "Submit annual or sick leave — must be requested at least 1 week ahead."));

  state.leaves = state.leaves || [];

  const canRequestForOthers = (u.role === "owner" || u.role === "head_barista");
  const staff = state.users.filter(x => x.active && (x.role === "barista" || x.role === "head_barista"));

  // Minimum start date = today + 7 days
  const minDate = (() => {
    const d = new Date(); d.setDate(d.getDate() + 7);
    return d.toISOString().slice(0, 10);
  })();

  const form = el("div", { class: "card", style: { marginTop: "12px" } });

  // Who is this leave for?
  let targetUserId = u.id;
  if (canRequestForOthers) {
    form.appendChild(el("label", {}, "Leave for (barista)"));
    const staffSel = el("select", {});
    for (const s of staff) {
      const o = el("option", { value: s.id }, s.name);
      if (s.id === u.id) o.selected = true;
      staffSel.appendChild(o);
    }
    staffSel.addEventListener("change", () => { targetUserId = staffSel.value; });
    form.appendChild(staffSel);
  } else {
    form.appendChild(el("div", { class: "kv" }, [
      el("div", { class: "k" }, "Requesting for"),
      el("div", { class: "v" }, el("b", {}, u.name)),
    ]));
  }

  // Leave type
  form.appendChild(el("label", {}, "Leave type"));
  const typeSel = el("select", {}, [
    el("option", { value: "annual" }, "🌴 Annual Leave"),
    el("option", { value: "sick"   }, "🤒 Sick Leave"),
  ]);
  form.appendChild(typeSel);

  // Dates
  form.appendChild(el("label", {}, `From date (earliest: ${minDate})`));
  const fromIn = el("input", { type: "date", min: minDate, value: minDate });
  form.appendChild(fromIn);

  form.appendChild(el("label", {}, "To date"));
  const toIn = el("input", { type: "date", min: minDate, value: minDate });
  form.appendChild(toIn);

  // Keep to ≥ from as user changes from
  fromIn.addEventListener("change", () => {
    if (toIn.value < fromIn.value) toIn.value = fromIn.value;
    toIn.min = fromIn.value;
  });

  // Reason
  form.appendChild(el("label", {}, "Reason (optional)"));
  const reasonIn = el("textarea", { rows: "3", placeholder: "Brief reason for leave…" });
  form.appendChild(reasonIn);

  wrap.appendChild(form);

  const submitBtn = el("button", { class: "btn", style: { marginTop: "14px" } }, "📩 Submit Leave Request");
  submitBtn.addEventListener("click", () => {
    const from = fromIn.value;
    const to   = toIn.value;
    if (!from || !to) return toast("Please fill in both dates", "error");
    if (to < from)    return toast("End date can't be before start date", "error");
    if (from < minDate) return toast(`Leave must start at least 7 days from today (${minDate})`, "error");

    const person = canRequestForOthers
      ? state.users.find(x => x.id === targetUserId)
      : u;
    if (!person) return toast("Could not find selected barista", "error");

    // Check for overlapping approved/pending leaves for this person
    const overlap = (state.leaves || []).find(l =>
      l.user_id === person.id &&
      (l.status === "approved" || l.status === "pending") &&
      l.from_date <= to && l.to_date >= from
    );
    if (overlap) {
      return toast(`${person.name} already has a ${overlap.status} leave overlapping those dates`, "error");
    }

    const s = stamp();
    const leave = {
      id: uuid(),
      user_id: person.id,
      user_name: person.name,
      type: typeSel.value,
      from_date: from,
      to_date: to,
      reason: reasonIn.value.trim(),
      status: "pending",
      requested_by: s.by,
      requested_by_name: s.by_name,
      requested_at: s.at,
      reviewed_by: null,
      reviewed_by_name: null,
      reviewed_at: null,
      review_note: "",
    };
    state.leaves.push(leave);
    saveState();

    // Count calendar days
    const days = Math.round((new Date(to) - new Date(from)) / 86400000) + 1;

    // Send email to head barista (To:) and owner (CC:)
    const hbEmail    = (state.settings.head_barista_email || "").trim();
    const ownerEmail = (state.settings.owner_email || "coffeebeats@haidiyacoub.com").trim();
    const typeLabel  = leave.type === "annual" ? "Annual Leave" : "Sick Leave";
    const subj = encodeURIComponent(
      `[Leave Request] ${person.name} · ${typeLabel} · ${from} → ${to} (${days}d)`
    );
    const body = encodeURIComponent(
      `A leave request has been submitted and is pending your approval.\n\n` +
      `Barista: ${person.name}\n` +
      `Leave type: ${typeLabel}\n` +
      `From: ${from}\n` +
      `To: ${to}\n` +
      `Duration: ${days} day${days > 1 ? "s" : ""}\n` +
      `Reason: ${leave.reason || "—"}\n` +
      `Submitted by: ${s.by_name}\n\n` +
      `Please log in to the Operations app → Leave Requests to approve or reject.\n\n` +
      `— Coffee Beats Operations`
    );

    const to_addr = hbEmail || ownerEmail;
    const cc_part = hbEmail ? `&cc=${encodeURIComponent(ownerEmail)}` : "";
    try {
      window.open(`mailto:${encodeURIComponent(to_addr)}?subject=${subj}${cc_part}&body=${body}`, "_blank");
    } catch(e) {}

    toast(`Leave request submitted for ${person.name} · ${days} day${days > 1 ? "s" : ""} · Email sent ✉️`);
    go("leave_list");
  });
  wrap.appendChild(submitBtn);
  wrap.appendChild(btnBack());
  return wrap;
};
