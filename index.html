<style>
  :root {
    /* Coffee Beats brand palette (per brand guide) */
    --bg: #EFECE5;          /* warm cream */
    --surface: #FFFFFF;     /* white cards */
    --surface-2: #F4EFE8;   /* slightly warmer cream for inputs */
    --ink: #333333;         /* deep charcoal */
    --ink-dim: #5F6668;     /* medium slate */
    --ink-faint: #9AA0A1;   /* muted slate */
    --accent: #EFBBA3;      /* brand peach */
    --accent-2: #F0D3C3;    /* peach tint */
    --accent-ink: #333333;  /* text on peach */
    --ok: #2f8a55;
    --warn: #b7791f;
    --bad: #c23b3b;
    --border: rgba(51,51,51,.12);
    --shadow: 0 2px 10px rgba(51,51,51,.08);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }
  a { color: var(--accent); text-decoration: none; }
  button { font: inherit; }
  input, select, textarea {
    font: inherit;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    width: 100%;
    outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  label { display: block; margin-top: 12px; color: var(--ink-dim); font-size: 14px; }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex; align-items: center; gap: 10px;
    padding-top: calc(10px + env(safe-area-inset-top));
  }
  .topbar .logo { height: 40px; width: auto; display: block; }
  .topbar h1 { font-size: 13px; margin: 0; flex: 1; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink); font-family: "Montserrat", -apple-system, BlinkMacSystemFont, sans-serif; }
  .topbar .who { font-size: 12px; color: var(--ink-dim); }
  .chip { font-size: 11px; padding: 4px 9px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; color: var(--ink-dim); cursor: pointer; }
  .chip.ok { color: var(--ok); }
  .chip.warn { color: var(--warn); }
  .chip.bad { color: var(--bad); }
  main { padding: 16px; max-width: 900px; margin: 0 auto; }
  .grid { display: grid; gap: 12px; }
  .grid.c2 { grid-template-columns: 1fr 1fr; }
  .grid.c3 { grid-template-columns: 1fr 1fr 1fr; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow);
  }
  .card h2 { margin: 0 0 8px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .muted { color: var(--ink-dim); font-size: 13px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%;
    padding: 14px 16px;
    background: var(--accent);
    color: #2b1810;
    border: 0;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    min-height: 48px;
  }
  .btn.secondary { background: var(--surface-2); color: var(--ink); }
  .btn.ghost { background: transparent; color: var(--ink-dim); border: 1px solid var(--border); }
  .btn.danger { background: var(--bad); color: #fff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }
  .tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px;
    padding: 22px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-align: center;
    cursor: pointer;
    color: var(--ink);
    min-height: 110px;
  }
  .tile .icon { font-size: 34px; line-height: 1; }
  .tile .label { font-size: 14px; font-weight: 600; }
  .tile .sub { font-size: 11px; color: var(--ink-dim); }
  .tile:active { background: var(--surface-2); }
  .list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .row .grow { flex: 1; min-width: 0; }
  .row .title { font-weight: 500; font-size: 14px; }
  .row .sub { font-size: 12px; color: var(--ink-dim); }
  .row .qty { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent-2); }
  .pill {
    font-size: 11px; padding: 3px 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--ink-dim);
  }
  .tabs { display: flex; gap: 10px; margin-bottom: 14px; overflow-x: auto; padding: 6px 2px; }
  .tab {
    white-space: nowrap;
    padding: 12px 22px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 999px;
    color: var(--ink-dim);
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .6px;
    text-transform: uppercase;
    transition: background .15s, color .15s, border-color .15s, box-shadow .15s, transform .1s;
    position: relative;
  }
  .tab:active { transform: scale(0.96); }
  .tab.on {
    background: var(--accent) !important;
    color: #2b1810 !important;
    border-color: var(--ink) !important;
    box-shadow: 0 3px 12px rgba(239,187,163,.6), inset 0 0 0 1px rgba(51,51,51,.08);
    transform: scale(1.03);
  }
  .tab.on::before { content: "✓ "; font-weight: 900; color: #2b1810; }
  .tab:not(.on):hover { border-color: var(--accent); color: var(--ink); }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dashed var(--border); }
  .kv:last-child { border-bottom: 0; }
  .kv .k { color: var(--ink-dim); font-size: 13px; }
  .kv .v { font-variant-numeric: tabular-nums; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: left; }
  th { color: var(--ink-dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .sheet {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.6);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 30;
  }
  .sheet-inner {
    background: var(--surface);
    width: 100%; max-width: 680px;
    border-top-left-radius: 20px; border-top-right-radius: 20px;
    padding: 16px;
    max-height: 90dvh;
    overflow: auto;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  .pin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .pin-key {
    padding: 22px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    font-size: 22px; font-weight: 600;
    text-align: center; cursor: pointer;
    color: var(--ink);
  }
  .pin-dots { display: flex; gap: 12px; justify-content: center; margin-top: 18px; }
  .pin-dots .d { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--ink-dim); }
  .pin-dots .d.on { background: var(--accent); border-color: var(--accent); }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .warn { color: var(--warn); }
  .bad { color: var(--bad); }
  .ok { color: var(--ok); }
  .hr { height: 1px; background: var(--border); margin: 14px 0; border: 0; }
  .small { font-size: 12px; }
  .sticky-actions {
    position: sticky; bottom: 0;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
    margin-top: 14px;
  }
  .search { position: sticky; top: 56px; z-index: 5; background: var(--bg); padding: 8px 0; }
  .item-pick { padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .qty-stepper { display: flex; align-items: center; gap: 8px; }
  .qty-stepper button { width: 36px; height: 36px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); border-radius: 8px; font-size: 18px; font-weight: 600; cursor: pointer; }
  .qty-stepper input { width: 80px; text-align: center; }
  .thumb { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); }
  @media (min-width: 600px) {
    main { padding: 24px; }
    .grid.c2 { grid-template-columns: 1fr 1fr; }
    .grid.c3 { grid-template-columns: 1fr 1fr 1fr 1fr; }

  @media (min-width: 768px) {

    .pin-grid { max-width: 340px; margin: 0 auto; }
    .pin-key { font-size: 22px; padding: 20px; }
    table { font-size: 14px; }
    .card { padding: 18px; }
    .tabs { gap: 14px; }
    .tab { font-size: 14px; padding: 10px 18px; }
    .grid.c2 { grid-template-columns: 1fr 1fr; gap: 16px; }

    #home-grid { grid-template-columns: repeat(3,1fr); gap: 16px; }
    .btn { min-height: 52px; font-size: 16px; }
    input, select, textarea { font-size: 16px; padding: 14px 16px; }

  .photo-drop {

  .ph-status.error { background: var(--bad); }
  @keyframes ph-pulse { from { opacity: .4; } to { opacity: 1; } }
  /* ── Site gate ─────────────────────────────────────────────── */
  #gate-overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 9999; padding: 32px 24px;
  }
  #gate-overlay .gate-logo { height: 60px; margin-bottom: 28px; }
  #gate-overlay .gate-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; text-align: center; }
  #gate-overlay .gate-sub { font-size: 13px; color: var(--ink-dim); margin-bottom: 28px; text-align: center; }
  #gate-overlay .gate-box { width: 100%; max-width: 340px; }
  #gate-overlay .gate-input {
    font-size: 18px; text-align: center; letter-spacing: 3px;
    padding: 16px; border-radius: 14px; border: 2px solid var(--border);
    background: var(--surface); width: 100%; margin-bottom: 12px;
    font-family: inherit; color: var(--ink);
    transition: border-color .2s;
  }
  #gate-overlay .gate-input:focus { border-color: var(--accent); outline: none; }
  #gate-overlay .gate-input.shake {
    animation: gate-shake .35s ease;
    border-color: var(--bad);
  }
  @keyframes gate-shake {
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 60%{transform:translateX(8px)}
  }
  #gate-overlay .gate-err { color: var(--bad); font-size: 13px; text-align: center; margin-bottom: 10px; min-height: 18px; }
  .drive-badge {
    position: absolute; bottom: 5px; left: 5px;
    background: var(--ok); color: #fff; font-size: 9px;
    padding: 1px 5px; border-radius: 999px; font-weight: 700; z-index: 2;
  }
  /* Photo confirm sheet */
  .photo-confirm-sheet { text-align: center; padding: 8px 0 4px; }
  /* Gallery row hover */
  a.gallery-row:hover { background: var(--surface-2) !important; }
</style>

function startReviewsListener() {
  db.collection("reviews").orderBy("at", "asc").onSnapshot(snap => {
    if (!state.customer_feedback) state.customer_feedback = [];
    const existingIds = new Set(state.customer_feedback.map(f => f.id));
    let added = 0;
    snap.docChanges().forEach(change => {
      if (change.type !== "added") return;
      const doc = change.doc;
      if (existingIds.has(doc.id)) return;
      const d = doc.data();
      const matchUser = (state.users || []).find(u =>
        u.name && d.barista && u.name.toLowerCase().startsWith(d.barista.toLowerCase().split(' ')[0])
      );
      state.customer_feedback.push({
        id: doc.id,
        at: d.at || new Date(d.timestamp).getTime(),
        by: "website",
        by_name: "coffeebeats.art",
        barista_name: d.barista || "",
        barista_id: matchUser?.id || null,
        user_id: matchUser?.id || null,
        rating: d.rating || 0,
        source: "coffeebeats.art",
        standout: d.standout || "",
        note: [d.feedback, d.standout].filter(Boolean).join(' | '),
        branch: d.branch || "",
        month: new Date(d.at || Date.now()).toISOString().slice(0, 7)
      });
      existingIds.add(doc.id);
      added++;
    });
    if (added > 0) { saveState(); render(); }
  }, err => console.warn("Reviews listener error:", err));
}

// ZAWYA sales categories that should always be filtered out on import
// (per coffee-beats-cost-rule: Popcorn, Soft Drinks, Snacks, Merchandise).
const ZAWYA_EXCLUDED_CATEGORIES = [
  "popcorn","pop corn","pop-corn",
  "soft drinks","soft drink","softdrinks","soft-drinks","softdrink","soda","sodas","beverage-soft",
  "snacks","snack",
  "merchandise","merch","retail","retail items","merch items"
];
// Specific item-name patterns that should trigger exclusion regardless of category.
// These are all third-party concession items sold at Zawya that are NOT operated by Coffee Beats.
const ZAWYA_EXCLUDED_ITEM_PATTERNS = [
  // Popcorn (all variants)
  "pop corn","popcorn",
  // Soft drinks / canned beverages
  "v cola","v7 cola","v7 diet","v7 pink","sun top","moussy","red bull",
  "coca cola","pepsi","sprite","fanta","7up","schweppes","freska",
  // Water (Zawya water is a third-party concession; Maadi water is Coffee Beats')
  "water",
  // Confectionery / snacks
  "kitkat","kit kat","bounty","snickers","m&m","galaxy","cookies","cookie",
  // Non-food consumables
  "tissues","tissue",
  // Merchandise / retail
  "tote","socks","t-shirt","tshirt",
];
function isZawyaExcluded(category, item) {
  const c = String(category || "").trim().toLowerCase();
  const n = String(item || "").trim().toLowerCase();
  if (!c && !n) return false;
  for (const ex of ZAWYA_EXCLUDED_CATEGORIES) {
    if (c === ex || c.includes(ex)) return true;
  }
  for (const ex of ZAWYA_EXCLUDED_ITEM_PATTERNS) {
    if (n.includes(ex)) return true;
  }
  return false;
}

// Normalize a date string into ISO yyyy-mm-dd. Handles dd/mm/yyyy, mm/dd/yyyy,
// yyyy-mm-dd, yyyy/mm/dd, dd-mm-yyyy and optional trailing time. Falls back to
// the raw string if we can't parse it.
function normalizeDate(raw) {
  if (!raw) return "";
  const s = String(raw).trim();
  if (!s) return "";
  // already ISO yyyy-mm-dd
  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T].*)?$/);
  if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
  // yyyy/mm/dd
  const isoSlash = s.match(/^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})(?:[ T].*)?$/);
  if (isoSlash) return `${isoSlash[1]}-${String(isoSlash[2]).padStart(2,"0")}-${String(isoSlash[3]).padStart(2,"0")}`;
  // d/m/yyyy or m/d/yyyy (with / - or .) with optional time
  const ambig = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[ T].*)?$/);
  if (ambig) {
    let a = Number(ambig[1]), b = Number(ambig[2]), y = Number(ambig[3]);
    if (y < 100) y += 2000;
    // Heuristic: if one is > 12 it must be the day; otherwise assume day/month (EU default).
    let d, m;
    if (a > 12) { d = a; m = b; }
    else if (b > 12) { d = b; m = a; }
    else { d = a; m = b; } // default day-first
    return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  }
  // fallback: try native Date parse
  const dt = new Date(s);
  if (!isNaN(dt.getTime())) return dt.toISOString().slice(0,10);
  return s;
}

// ----- tiny helpers -----
const $ = (sel, root=document) => root.querySelector(sel);
const el = (tag, props={}, children=[]) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k === "style") Object.assign(n.style, v);
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "html") n.innerHTML = v;
    else if (v !== undefined && v !== null) n.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null || c === false) continue;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return n;
};
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : ("x"+Math.random().toString(36).slice(2)+Date.now()));
const now = () => new Date().toISOString();
const fmtDate = (iso) => {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString([], { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
};
const fmtDay = (iso) => {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString([], { year: "numeric", month: "short", day: "numeric" });
};
const money = (n) => (n == null ? "—" : (Math.round(n*100)/100).toLocaleString("en-EG", { style: "currency", currency: "EGP", minimumFractionDigits: 0 }));
const fmtQty = (n, unit) => {
  if (n == null) return "—";
  const pretty = Math.abs(n) >= 1000 && (unit==="g"||unit==="ml")
    ? `${(n/1000).toFixed(2)} ${unit==="g"?"kg":"L"}`
    : `${Math.round(n*100)/100} ${unit}`;
  return pretty;
};
const toast = (msg, kind="") => {
  const t = el("div", { class: "toast " + kind }, msg);
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), 3200);
};

// Branch tab picker that redraws itself on click (fixes .on class not moving).
// getCurrent() returns the current branch string; onPick(b) updates state + does any
// downstream re-render. The picker itself is rebuilt each click, so the highlight
// always reflects the active branch.
function makeBranchPicker(branches, getCurrent, onPick) {
  const wrap = el("div", { class: "tabs" });
  function repaint() {
    wrap.innerHTML = "";
    const cur = getCurrent();
    branches.forEach(b => {
      wrap.appendChild(el("div", {
        class: "tab" + (b === cur ? " on" : ""),
        onClick: () => { onPick(b); repaint(); }
      }, b[0].toUpperCase() + b.slice(1)));
    });
  }
  repaint();
  return wrap;
}

const STORAGE_KEY = "cb.v1.state";
const DEVICE_KEY = "cb.device";

const deviceId = (() => {
  let id = localStorage.getItem(DEVICE_KEY);
  if (!id) { id = uuid(); localStorage.setItem(DEVICE_KEY, id); }
  return id;
})();

// IndexedDB for photos
const IDB = (() => {
  let dbP;
  const open = () => dbP ||= new Promise((res, rej) => {
    const r = indexedDB.open("cb_photos", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("photos");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return {
    put: async (id, blob) => { const db = await open(); return new Promise((res,rej)=>{ const tx=db.transaction("photos","readwrite"); tx.objectStore("photos").put(blob,id); tx.oncomplete=()=>res(id); tx.onerror=()=>rej(tx.error); }); },
    get: async (id) => { const db = await open(); return new Promise((res,rej)=>{ const tx=db.transaction("photos","readonly"); const r=tx.objectStore("photos").get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  };
})();

// ─── Firebase Storage photo upload ───────────────────────────
const Cloudinary = (() => {
  const isConfigured = () => true; // always available via Firebase

  async function uploadPhoto(blob, filename) {
    const ext = blob.type === "image/png" ? "png" : blob.type === "image/webp" ? "webp" : "jpg";
    const safeName = filename.replace(/[^a-zA-Z0-9_\-]/g, "_");
    const path = `photos/${safeName}_${Date.now()}.${ext}`;
    const ref = storage.ref(path);
    const snap = await ref.put(blob, { contentType: blob.type });
    const secure_url = await snap.ref.getDownloadURL();
    return {
      secure_url,
      public_id: path,
      created_at: new Date().toISOString(),
      original_filename: filename,
      bytes: blob.size,
    };
  }

  return { isConfigured, uploadPhoto, cloudName: () => "firebase" };
})();

// ─── Site access gate ────────────────────────────────────────
// Sits in front of the PIN login. Anyone visiting the URL must enter the
// team access code first. Code is set in Settings (owner only).
// Auth is remembered in localStorage for 7 days.
const Gate = (() => {
  const KEY = "cb_gate_auth";
  const TTL = 7 * 24 * 60 * 60 * 1000; // 7 days in ms

  function isUnlocked() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return false;
      const { ts } = JSON.parse(raw);
      return (Date.now() - ts) < TTL;
    } catch { return false; }
  }

  function unlock() {
    localStorage.setItem(KEY, JSON.stringify({ ts: Date.now() }));
  }

  function lock() {
    localStorage.removeItem(KEY);
  }

  function check(inputCode, correctCode) {
    // Case-insensitive, trim whitespace
    return inputCode.trim().toLowerCase() === (correctCode || "").trim().toLowerCase();
  }

  function show(correctCode, onUnlock) {
    // Remove any existing overlay
    const existing = document.getElementById("gate-overlay");
    if (existing) existing.remove();

    const overlay = document.createElement("div");
    overlay.id = "gate-overlay";

    // Logo
    const logo = document.createElement("img");
    logo.className = "gate-logo";
    logo.src = CB_LOGO_SRC;
    logo.alt = "Coffee Beats";
    overlay.appendChild(logo);

    overlay.appendChild(Object.assign(document.createElement("div"), { className: "gate-title", textContent: "Coffee Beats — Team Portal" }));
    overlay.appendChild(Object.assign(document.createElement("div"), { className: "gate-sub", textContent: "Enter your team access code to continue." }));

    const box = document.createElement("div");
    box.className = "gate-box";

    const inp = document.createElement("input");
    inp.className = "gate-input";
    inp.type = "password";
    inp.placeholder = "• • • • • •";
    inp.autocomplete = "off";
    inp.setAttribute("autocapitalize", "none");
    box.appendChild(inp);

    const err = document.createElement("div");
    err.className = "gate-err";
    box.appendChild(err);

    const btn = document.createElement("button");
    btn.className = "btn";
    btn.style.cssText = "width:100%;font-size:16px;";
    btn.textContent = "Enter";
    box.appendChild(btn);

    overlay.appendChild(box);
    document.body.appendChild(overlay);
    setTimeout(() => inp.focus(), 100);

    function attempt() {
      if (check(inp.value, correctCode)) {
        unlock();
        overlay.style.transition = "opacity .3s";
        overlay.style.opacity = "0";
        setTimeout(() => { overlay.remove(); onUnlock(); }, 300);
      } else {
        err.textContent = "Incorrect code — try again.";
        inp.classList.add("shake");
        inp.value = "";
        setTimeout(() => inp.classList.remove("shake"), 400);
        inp.focus();
      }
    }

    btn.addEventListener("click", attempt);
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") attempt(); });
  }

  return { isUnlocked, unlock, lock, show, check };
})();

// Runs once per load. Safe to re-run — each step is idempotent.
function migrateState(s) {
  s.users = s.users || [];
  const hasName = (n) => s.users.some(u => (u.name || "").toLowerCase() === n.toLowerCase());
  const takenPin = (p) => s.users.some(u => u.pin === p);
  const nextPin = () => { for (let i = 1000; i < 9999; i++) { const p = String(i); if (!takenPin(p)) return p; } return "0000"; };

  // Track seeded user IDs so renames don't trigger re-seeding.
  // We check by PIN (which is stable) in addition to name — if neither the default
  // name NOR the default PIN exists, the slot is genuinely empty and we seed it.
  s._seeded_ids = s._seeded_ids || {};

  // Helper: find a user by stored seeded ID, then by name, then by default PIN.
  function findSeeded(key, defaultName, defaultPin) {
    if (s._seeded_ids[key]) {
      const byId = s.users.find(u => u.id === s._seeded_ids[key]);
      if (byId) return byId;
    }
    const byName = s.users.find(u => (u.name||"").toLowerCase() === defaultName.toLowerCase());
    if (byName) { s._seeded_ids[key] = byName.id; return byName; }
    const byPin  = s.users.find(u => u.pin === defaultPin);
    if (byPin)  { s._seeded_ids[key] = byPin.id;  return byPin;  }
    return null;
  }

  // Seed Khaled + Barista 3 if they don't already exist (for upgrades from older state).
  // Checks by name OR by default PIN so renaming doesn't cause a duplicate to be seeded.
  if (!findSeeded("khaled", "Khaled", "7777")) {
    const u = { id: uuid(), name: "Khaled", role: "barista", pin: takenPin("7777") ? nextPin() : "7777", branches: ["maadi","zawya"], active: true };
    s.users.push(u); s._seeded_ids.khaled = u.id;
  }
  if (!findSeeded("barista3", "Barista 3", "6666")) {
    const u = { id: uuid(), name: "Barista 3", role: "barista", pin: takenPin("6666") ? nextPin() : "6666", branches: ["maadi","zawya"], active: true };
    s.users.push(u); s._seeded_ids.barista3 = u.id;

  // One-time migration: Khaled was mistakenly set to "owner" in earlier builds.
  // Only run once (flag prevents it from fighting any deliberate role change the owner makes).
  if (!s._migration_khaled_role_fixed) {

    if (khaledUser && khaledUser.role === "owner") {

    s.users.push(u); s._seeded_ids.mohamed = u.id;

  // Ensure handbook_recipes collection exists (seeded with full menu on first run).

    s.kpi_settings.weights = { punctuality:5, waste:15, cleanliness:10, craft:15, upselling:10, customer:15, teamwork:5, leadership:20, hygiene:5 };
  }
  s.leadership_assignments   = s.leadership_assignments   || [];

  s.leaves              = s.leaves        || []; // leave requests (annual / sick)
  s.settings.team_code           = s.settings.team_code           || "coffeeteam2026";
  s.settings.head_barista_email  = s.settings.head_barista_email  || "";
  s.settings.owner_email         = s.settings.owner_email         || "coffeebeats@haidiyacoub.com";

  // Strip items that were removed from the menu (per Haïdi, April 2026):
  // Coffee Type 4 and Spiced Turkish Coffee should no longer appear anywhere.
  const isDead = (name) => {
    const n = String(name || "").toLowerCase();
    return /coffee\s*type\s*4/.test(n) || /spiced\s*turkish/.test(n);
  };
  s.menu  = (s.menu  || []).filter(m => !isDead(m.name));
  if (Array.isArray(s.items)) {
    for (const it of s.items) { if (isDead(it.name)) it.active = false; }

// `opts.immediate` pushes to Firestore right now instead of waiting for the
// 2.5s debounce — use it for any write the user expects reflected immediately.
function saveState(opts) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  markDirty();
  if (opts && opts.immediate) {
    clearTimeout(syncTimer);
    doSync();
  } else {
    queueSync();
  }
}

// ----- Firebase Firestore sync -----
// Firestore is the single source of truth. State is split into chunks
// to stay well under the 1 MB document limit.
let syncTimer = null;
let syncInFlight = false;
let pendingWrites = 0;
const SYNC_DIRTY_KEY = "cb_ops_sync_dirty_v1";

// Each chunk key maps to the state keys it owns.
const STATE_CHUNKS = {
  config:      ["settings", "salary_config"],
  users_items: ["users", "items", "menu", "snapshots", "handbook_recipes", "purchase_units", "inventory_alerts", "suppliers"],
  waste:       ["waste"],
  purchases:   ["purchases", "petty_cash", "bank_ledger"],
  sales:       ["sales", "shifts"],
  operations:  ["shift_closes", "cleaning_logs", "signin_stamps"],
  roster:      ["rosters", "roaster_schedules", "maadi_deposits"],
  hr:          ["salaries", "salary_loans", "overtime_logs", "penalties", "deleted_penalties", "leaves"],
  overhead:    ["overheads", "overhead_presets", "overhead_monthly_amts"],
  media:       ["photo_log", "assets"],
  kpi:         ["kpi_manual", "customer_feedback", "alert_log", "kpi_settings", "reorder_actions", "leadership_assignments", "leadership_notifications"],
  meta:        ["_seeded_ids", "_migration_khaled_role_fixed", "_migration_signature_drinks", "version", "created_at", "branch_opening_times"],
};

function markDirty() {
  pendingWrites++;
  try { localStorage.setItem(SYNC_DIRTY_KEY, String(pendingWrites)); } catch(e) {}
  updateSyncBadge("syncing");
}
function markClean() {
  pendingWrites = 0;
  try { localStorage.setItem(SYNC_DIRTY_KEY, "0"); } catch(e) {}
  updateSyncBadge("synced");
}
function hasPending() {
  if (pendingWrites > 0) return true;
  try { return Number(localStorage.getItem(SYNC_DIRTY_KEY) || 0) > 0; } catch(e) { return false; }
}
try { pendingWrites = Number(localStorage.getItem(SYNC_DIRTY_KEY) || 0); } catch(e) {}

function updateSyncBadge(status) {
  let badge = document.getElementById("syncBadge");
  if (!badge) {
    badge = document.createElement("div");
    badge.id = "syncBadge";
    badge.style.cssText = "position:fixed;bottom:10px;right:10px;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:600;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.15);font-family:system-ui,sans-serif;pointer-events:none;";
    document.body.appendChild(badge);
  }
  badge.style.display = "";
  if (status === "syncing") { badge.textContent = "⟳ Syncing…"; badge.style.background = "#fef3c7"; badge.style.color = "#92400e"; }
  else if (status === "synced") { badge.textContent = "✓ Synced"; badge.style.background = "#d1fae5"; badge.style.color = "#065f46"; }
  else if (status === "error")  { badge.textContent = "⚠ Sync failed"; badge.style.background = "#fee2e2"; badge.style.color = "#991b1b"; }
}

function queueSync() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(doSync, 2500);
}

async function doSync() {
  if (syncInFlight) return;
  syncInFlight = true;
  const batchSize = pendingWrites;
  updateSyncBadge("syncing");
  try {
    const writes = Object.entries(STATE_CHUNKS).map(([chunk, keys]) => {
      const doc = {};
      for (const k of keys) { const v = state[k]; doc[k] = v !== undefined ? v : null; }
      return db.collection("state").doc(chunk).set(doc);
    });
    await Promise.all(writes);
    state.settings.last_sync = now();
    pendingWrites = Math.max(0, pendingWrites - batchSize);
    try { localStorage.setItem(SYNC_DIRTY_KEY, String(pendingWrites)); } catch(e) {}
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (pendingWrites === 0) updateSyncBadge("synced");
    else { updateSyncBadge("syncing"); queueSync(); }
  } catch (e) {
    console.warn("Firebase sync failed", e);
    updateSyncBadge("error");
  } finally {
    syncInFlight = false;
  }
}

// Pull full state from Firestore (makes Firestore the single source of truth)
async function pullFromFirestore() {
  try {
    const chunkNames = Object.keys(STATE_CHUNKS);
    const docs = await Promise.all(chunkNames.map(c => db.collection("state").doc(c).get()));
    const remote = {};
    for (let i = 0; i < chunkNames.length; i++) {
      if (docs[i].exists) Object.assign(remote, docs[i].data());
    }
    if (!remote.users && !remote.items) return { ok: false, err: "No data in Firestore yet" };
    const settingsBak = state.settings;
    Object.assign(state, remote);
    migrateState(state);
    state.settings = { ...remote.settings, ...settingsBak };
    state.settings.last_pull = now();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    doSync(); // push back any migration fixes
    startReviewsListener();
    return { ok: true };
  } catch (e) {
    return { ok: false, err: String(e) };
  }
}

// Alias so any remaining callsites using pullFromSheets still work
const pullFromSheets = pullFromFirestore;

// Auto-pull on start — flush any unsynced local edits first so they aren't clobbered.
async function autoPullOnStart() {
  if (hasPending()) {
    console.log("Flushing pending local writes to Firestore before pull…");
    await doSync();
  }
  const result = await pullFromFirestore();
  if (result.ok) {
    markClean();
    console.log("Auto-pulled from Firestore on start");
    render();
  } else {
    console.warn("Auto-pull failed:", result.err);
    updateSyncBadge(hasPending() ? "error" : "synced");
  }
}

// ----- auth / session -----
// state._auth holds the resolved user profile for the current Firebase Auth session.
// It is in-memory only — never persisted to localStorage or Firestore.
function currentUser() {
  return state._auth || null;
}

async function _resolveAuth(fbUser) {
  if (!fbUser) { state._auth = null; return; }
  const claims   = (await fbUser.getIdTokenResult()).claims;
  const staffSnap = await db.collection("staff").doc(fbUser.uid).get();
  const staffData = staffSnap.exists ? staffSnap.data() : {};
  // Merge claims (role, branches from JWT) with per-user overrides from Firestore
  state._auth = {
    uid:          fbUser.uid,
    id:           fbUser.uid,  // alias so legacy code using u.id still works
    name:         staffData.name  || fbUser.displayName || "Staff",
    role:         claims.role     || staffData.role,
    branches:     claims.branches || staffData.branches || [],
    active:       staffData.active !== false,
    deny_access:  staffData.deny_access  || [],
    extra_access: staffData.extra_access || [],
    legacy_id:    staffData.legacy_id    || null,
  };
}

// ----- inactivity auto-logout (10 minutes) -----
const IDLE_TIMEOUT_MS = 10 * 60 * 1000; // 10 min
let _idleTimer = null;
let _idleWarnTimer = null;
let _idleBanner = null;

function startIdleTimer() {
  stopIdleTimer();
  // Show a 60-second warning banner before logging out
  _idleWarnTimer = setTimeout(() => {
    if (!state._auth) return;
    if (_idleBanner) return;
    _idleBanner = document.createElement("div");
    _idleBanner.id = "idle-banner";
    _idleBanner.style.cssText = "position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:999;background:#2b1810;color:#f5e6d0;padding:14px 20px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.35);display:flex;gap:14px;align-items:center;";
    _idleBanner.innerHTML = `<span>⏱ You'll be signed out in <b id="idle-countdown">60</b>s due to inactivity.</span><button onclick="startIdleTimer()" style="background:var(--accent,#EFBBA3);color:#2b1810;border:0;border-radius:8px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;">Stay signed in</button>`;
    document.body.appendChild(_idleBanner);
    let secs = 60;
    const tick = setInterval(() => {
      secs--;
      const el = document.getElementById("idle-countdown");
      if (el) el.textContent = String(secs);
      if (secs <= 0) clearInterval(tick);
    }, 1000);
  }, IDLE_TIMEOUT_MS - 60000);

  _idleTimer = setTimeout(() => {
    if (!state._auth) return;
    if (_idleBanner) { _idleBanner.remove(); _idleBanner = null; }
    auth.signOut().then(() => {
      setTimeout(() => {

// ----- running stock (computed) -----
function computeStock(branch) {
  // start from latest snapshot
  const snaps = state.snapshots.slice().sort((a,b) => a.created_at.localeCompare(b.created_at));
  const last = snaps[snaps.length - 1];
  const stock = {};
  for (const it of state.items) stock[it.id] = 0;
  if (last) for (const e of last.entries) if (e.branch === branch) stock[e.item_id] = Number(e.qty) || 0;
  const tsAfter = last ? last.created_at : "0000";
  // apply purchases & waste recorded AFTER the snapshot
  for (const p of state.purchases) {
    if (p.branch !== branch) continue;
    if (p.at <= tsAfter) continue;
    for (const ln of p.lines) {
      if (ln.inv_item_id && stock[ln.inv_item_id] != null) {
        stock[ln.inv_item_id] += Number(ln.qty_canonical) || 0;
      }
    }
  }
  for (const w of state.waste) {
    if (w.branch !== branch) continue;
    if (w.at <= tsAfter) continue;
    if (w.inv_item_id && stock[w.inv_item_id] != null) {
      stock[w.inv_item_id] -= Number(w.qty_canonical) || 0;
    }
  }
  return stock;
}

// ---------------- Predictive inventory consumption ----------------
// Uses the last two snapshots for the given branch. Between them, the change in
// stock should equal (purchases + positive adjustments) − (waste + sales usage).
// We don't know sales usage directly, so we infer it from the snapshot drop:
//
//   usage_per_day = (prev_stock + purchases_between − next_stock) / days_between
//
// This treats everything that disappeared (sales + unlogged breakage) as usage.
// Less noisy than waste-only, and matches what the barista actually needs to
// re-order. Returns 0 if we can't estimate (fewer than 2 snapshots, same day,
// or no data for this item).
function branchSnapshotEntries(snap, branch, itemId) {
  if (!snap) return null;
  const entry = snap.entries.find(e => e.branch === branch && e.item_id === itemId);
  return entry ? Number(entry.qty) || 0 : null;
}
function computeDailyUsage(itemId, branch) {
  const snaps = state.snapshots.slice().sort((a,b) => a.created_at.localeCompare(b.created_at));
  // find the last two snapshots that have an entry for this branch+item
  const relevant = snaps.filter(s => branchSnapshotEntries(s, branch, itemId) !== null);
  if (relevant.length < 2) return 0;
  const prev = relevant[relevant.length - 2];
  const curr = relevant[relevant.length - 1];
  const prevQty = branchSnapshotEntries(prev, branch, itemId);
  const currQty = branchSnapshotEntries(curr, branch, itemId);
  const msPerDay = 24 * 60 * 60 * 1000;
  const days = Math.max(1, (new Date(curr.created_at) - new Date(prev.created_at)) / msPerDay);
  // Purchases in the window that added this item to this branch
  let purchased = 0;
  for (const p of state.purchases) {
    if (p.branch !== branch) continue;
    if (p.at <= prev.created_at || p.at > curr.created_at) continue;
    for (const ln of p.lines) {
      if (ln.inv_item_id === itemId) purchased += Number(ln.qty_canonical) || 0;
    }
  }
  const consumed = prevQty + purchased - currQty;
  if (consumed <= 0) return 0;
  return consumed / days;
}
function daysOfCover(itemId, branch) {
  const stock = computeStock(branch)[itemId] || 0;
  const usage = computeDailyUsage(itemId, branch);
  if (usage <= 0) return Infinity;
  return stock / usage;
}
// Returns [{ item, branch, stock, daily_usage, days_of_cover, threshold_days }]
// for every item that's under its per-item reorder-days threshold.
// Default threshold = 7 days if none set. Items with no usage data are skipped.
function lowStockItems(branch) {
  const out = [];
  const stocks = computeStock(branch);
  for (const it of state.items) {
    if (!it.active) continue;
    const cfg = (state.inventory_alerts || {})[it.id] || {};
    const threshold = Number(cfg.reorder_threshold_days) > 0
      ? Number(cfg.reorder_threshold_days)
      : 7;
    const usage = computeDailyUsage(it.id, branch);
    if (usage <= 0) continue; // no prediction possible yet
    const stock = stocks[it.id] || 0;
    const cover = stock / usage;
    if (cover < threshold) {
      out.push({ item: it, branch, stock, daily_usage: usage, days_of_cover: cover, threshold_days: threshold });
    }
  }
  out.sort((a,b) => a.days_of_cover - b.days_of_cover);
  return out;
}
// Fire browser notifications for any item that is newly low (not already in alert_log
// for today). Also writes to state.alert_log.
function scanAndNotifyLowStock() {
  const branches = ["maadi","zawya"];
  const today = new Date().toISOString().slice(0,10);
  state.alert_log = state.alert_log || [];
  for (const b of branches) {
    const rows = lowStockItems(b);
    for (const r of rows) {
      const key = `${today}|${b}|${r.item.id}`;
      if (state.alert_log.some(a => a.key === key)) continue;
      state.alert_log.push({
        key, date: today, branch: b, item_id: r.item.id, item_name: r.item.name,
        stock: r.stock, days_of_cover: r.days_of_cover, threshold_days: r.threshold_days,
        at: new Date().toISOString(),
        follow_ups: [], // escalation records: [{ level:"3d"|"5d"|"6d", fired_at }]
      });
      notifyHaidi(
        `Low stock — ${r.item.name} (${b})`,
        `~${r.days_of_cover.toFixed(1)}d cover left (threshold ${r.threshold_days}d). ${fmtQty(r.stock, r.item.unit)} on hand.`
      );
      notifyLeadershipRole("inventory_management",
        `Low stock — ${r.item.name} (${b})`,
        `~${r.days_of_cover.toFixed(1)}d cover left. Inventory manager action required.`
      );
    }
  }
  saveState();
}

// Returns true if item has been logged in the purchase log since alertDate.
function isReorderResolved(itemId, alertDate) {
  return (state.purchases || []).some(p => {
    if ((p.date || p.at || "").slice(0,10) < alertDate) return false;
    return (p.lines || []).some(l => l.inv_item_id === itemId);
  });
}

// Returns true if barista has logged a "called_supplier" action for this alert key.
function isReorderActionedByCalling(alertKey) {
  return (state.reorder_actions || []).some(a => a.alert_key === alertKey && a.called_supplier);
}

// Checks all open alerts and fires escalating follow-up notifications:
// +3 days, +5 days, +6 days since the original alert.
// Stops when item is purchased or barista has ticked called_supplier.
function scanReorderFollowUps() {
  state.alert_log = state.alert_log || [];
  state.reorder_actions = state.reorder_actions || [];
  const now = new Date();
  const today = now.toISOString().slice(0,10);
  let dirty = false;

  const LEVELS = [
    { label: "3d", days: 3, urgency: "⚠️ Reorder follow-up" },
    { label: "5d", days: 5, urgency: "🚨 URGENT — reorder overdue" },
    { label: "6d", days: 6, urgency: "🔴 CRITICAL — reorder still missing" },
  ];

  for (const alert of state.alert_log) {
    if (!alert.date) continue;
    // Migrate old entries that lack follow_ups
    if (!Array.isArray(alert.follow_ups)) { alert.follow_ups = []; dirty = true; }

    if (isReorderResolved(alert.item_id, alert.date)) continue;
    if (isReorderActionedByCalling(alert.key)) continue;

    const alertDate = new Date(alert.date + "T00:00:00");
    const daysSince = Math.floor((now - alertDate) / 86400000);

    for (const lvl of LEVELS) {
      if (daysSince < lvl.days) break;
      if (alert.follow_ups.some(f => f.level === lvl.label)) continue;
      // Fire this level's follow-up once
      alert.follow_ups.push({ level: lvl.label, fired_at: now.toISOString() });
      dirty = true;
      notifyHaidi(
        `${lvl.urgency} — ${alert.item_name} (${alert.branch})`,
        `Low-stock alert from ${alert.date} still unresolved. Log your action in the app.`
      );
      notifyLeadershipRole("inventory_management",
        `${lvl.urgency} — ${alert.item_name} (${alert.branch})`,
        `Reorder alert from ${alert.date} still unresolved.`
      );
    }
  }
  if (dirty) saveState();
}

function scanCashDepositReminders() {
  const today = new Date();
  if (today.getDay() !== 4) return; // Thursday only
  const todayStr = localISODate(today);
  const weekOf   = mondayOf(todayStr);
  const alreadyFired = (state.leadership_notifications || []).some(n =>
    n.role_key === "cash_status" && n.title === "Deposit reminder" &&
    typeof n.at === "string" && mondayOf(n.at.slice(0,10)) === weekOf
  );
  if (alreadyFired) return;
  const hasDeposit = (state.maadi_deposits || []).some(dep => dep.week_of === weekOf);
  if (hasDeposit) return;
  notifyLeadershipRole("cash_status",
    "Deposit reminder",
    `No Maadi cash deposit logged for week of ${weekOf}. Please deposit before end of day.`
  );
}

function scanCashDepositPenalties() {
  const today = new Date();
  if (today.getDay() !== 5) return; // Friday only — day after Thursday reminder
  const todayStr    = localISODate(today);
  const weekOf      = mondayOf(todayStr);
  const currentMonth = todayStr.slice(0, 7);
  const hasDeposit  = (state.maadi_deposits || []).some(dep => dep.week_of === weekOf);
  if (hasDeposit) return;
  const alreadyPenalised = (state.penalties || []).some(p =>
    p.auto_cash_deposit && p.week_of === weekOf
  );
  if (alreadyPenalised) return;
  const assignment  = getLeadershipAssignment(currentMonth);
  const cashMgrId   = assignment ? (assignment.cash_status || null) : null;
  if (!cashMgrId) return;
  const cashMgr = (state.users || []).find(u => u.id === cashMgrId);
  const salary  = Number(((state.salary_config || {})[cashMgrId] || {}).monthly_salary || 0);
  const amount  = penaltyAmount("quarter_day", salary);
  state.penalties = state.penalties || [];
  state.penalties.push({
    id: uuid(), at: new Date().toISOString(),
    by: "system", by_name: "System",
    user_id: cashMgrId, barista: cashMgr ? cashMgr.name : cashMgrId,
    kind: "quarter_day", kind_label: "Quarter day",
    reason: "leadership_fail", reason_code: "cash_deposit_missed",
    date: todayStr, month: currentMonth,
    amount,
    note: "Auto: Maadi deposit not logged for week of " + weekOf,
    auto_cash_deposit: true,
    week_of: weekOf,
    salary_at_time: salary,
  });
  saveState();
  notifyHaidi(
    `Cash deposit penalty — ${cashMgr ? cashMgr.name : cashMgrId}`,
    `No Maadi deposit logged for week of ${weekOf}. ¼ day deducted from salary.`
  );
}

// ----- role access policy -----
// Barista: inventory count + record waste + record purchases only
// Head barista: all barista + salaries + penalties + Maadi deposits + petty cash + bank ledger
// Accountant: full read access + petty cash (view), salaries, penalties, overheads, dashboard, bank, sales import, menu
// Owner: full access
const ROLE_ACCESS = {
  owner: "*",         // full access
  accountant: "*",    // full access (per Haïdi: "Accountant and owner have all access rights")
  // Per Haïdi: head barista = all barista + salaries + penalties + Maadi deposits + petty cash + roster (edit)
  head_barista: ["home","shifts","snapshot_new","waste_new","waste_list","purchase_new","purchase_list",
                 "petty_cash","salaries","penalties","maadi_deposits","roster",
                 "shift_close_new","shift_close_list","cleaning_log_new","cleaning_log_list",
                 "signin_stamp_new","signin_stamp_list",
                 "leave_new","leave_list",
                 "scorecard","my_scorecard","my_jd",
                 "reorder_action_new","reorder_action_list","supplier_list","items_list",
                 "my_hr","staff_hr"],
  // Per Haïdi: barista = only waste log, weekly schedule (read), barista handbook, shift close, sign-in stamp, cleaning log, leave requests
  barista: ["home","waste_new","roster","handbook","shift_close_new","signin_stamp_new","cleaning_log_new","leave_new","leave_list","my_scorecard","my_jd","reorder_action_new","my_hr"],
  // Zawya-only roles — no app access, kept in list for barista drink allowance tracking
  manager: [],
  helper:  [],
};
function canAccess(routeName, u) {
  if (!u) return false;
  if (routeName === "login" || routeName === "home") return true;
  // Per-user denylist (revokes default role access) — edited by the owner
  // in the Users screen. Lets Haïdi take something away from a specific person
  // even if their role normally has it.
  if (Array.isArray(u.deny_access) && u.deny_access.includes(routeName)) return false;
  // Per-user allowlist adds to role grants
  if (Array.isArray(u.extra_access) && u.extra_access.includes(routeName)) return true;
  const allow = ROLE_ACCESS[u.role];
  if (allow === "*") return true;
  if (!Array.isArray(allow)) return false;
  return allow.includes(routeName);
}

// ----- root render -----
function render() {
  const root = $("#app");
  root.innerHTML = "";
  if (!state._auth) { stopIdleTimer(); stopNoStampCheck(); root.appendChild(loginView()); return; }
  const u = currentUser();
  if (!u || !u.active) { auth.signOut(); return; }
  if (["owner", "head_barista"].includes(u.role)) startNoStampCheck();
  else stopNoStampCheck();
  // Guard direct-access to restricted routes
  if (!canAccess(route.name, u)) {
    route = { name: "home", params: {} };
  }
  root.appendChild(topbar(u));
  const main = el("main", {});
  root.appendChild(main);
  const viewResult = (routes[route.name] || routes.home)(u, route.params);
  // Some routes (e.g. handbook) are async — handle both Promise and direct DOM node.
  if (viewResult && typeof viewResult.then === "function") {
    viewResult.then(node => { if (node) main.appendChild(node); });
  } else {
    main.appendChild(viewResult);
  }
}

  try { scanReorderFollowUps(); } catch (e) { console.warn(e); }
  try { scanCashDepositReminders(); } catch (e) { console.warn(e); }
  try { scanCashDepositPenalties(); } catch (e) { console.warn(e); }

    ...lowStockItems("maadi").map(r => ({...r, _b: "maadi"})),
    ...lowStockItems("zawya").map(r => ({...r, _b: "zawya"})),
  ];

    }

  // Shown to barista + head_barista: alerts where no "called_supplier" or
  // "notified_head_barista" action has been logged yet.
  if (u.role === "barista" || u.role === "head_barista") {
    const pending = (state.alert_log || []).filter(a => {
      if (isReorderResolved(a.item_id, a.date)) return false;
      if (isReorderActionedByCalling(a.key)) return false;
      const hasAnyAction = (state.reorder_actions || []).some(r => r.alert_key === a.key && (r.called_supplier || r.notified_head_barista));
      if (hasAnyAction) return false;
      // Only surface alerts from the last 10 days
      const daysSince = Math.floor((Date.now() - new Date(a.date + "T00:00:00")) / 86400000);
      return daysSince <= 10;
    });
    if (pending.length > 0) {
      const raCard = el("div", { class: "card", style: { borderColor: "#c0392b", background: "#fff5f5", marginTop: "12px", cursor: "pointer" } });

        const hasFollowUp = Array.isArray(a.follow_ups) && a.follow_ups.length > 0;

        ]);
        row.addEventListener("click", () => go("reorder_action_new", { alert_key: a.key }));
        raCard.appendChild(row);

        raCard.appendChild(el("div", { class: "sub muted", style: { marginTop: "4px", fontSize: "12px" } }, `+${pending.length - 6} more — tap to view all`));
      }
      raCard.addEventListener("click", (e) => { if (e.target === raCard) go("reorder_action_list"); });
      wrap.appendChild(raCard);
    }
  }

  // quick today stats
  const today = fmtDay(now());
  const todayWaste = state.waste.filter(w => fmtDay(w.at) === today);
  const todayPurch = state.purchases.filter(p => fmtDay(p.at) === today);
  const kpis = el("div", { class: "grid c2", style: { marginTop: "16px" } }, [
    el("div", { class: "card" }, [

    ]),
  ]);
  wrap.appendChild(kpis);

  return wrap;
};

routes.waste_new = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Record Waste", "Picks an item, qty, and reason. Reduces stock."));

  let branch = u.branches[0];
  let itemId = null;

  // ── No-waste quick-log ──────────────────────────────────────────
  const noWasteCard = el("div", { class: "card", style: { marginBottom: "14px", background: "var(--surface-2)", border: "1.5px dashed var(--border)" } }, [
    el("div", { class: "muted small", style: { marginBottom: "8px" } }, "No waste to report this shift? Tap below to log a clear shift — this still counts as your required daily entry."),
    el("button", {
      class: "btn secondary",
      onClick: () => {
        const s = stamp();
        state.waste.push({
          id: uuid(), at: s.at, by: s.by, by_name: s.by_name, device: s.device,
          branch,
          inv_item_id: null, item_name: "— No waste —", unit: "",
          qty_canonical: 0,
          reason: "No waste", note: "Barista confirmed: no waste this shift.",
        });
        saveState();
        toast("✓ Clear shift logged — no waste recorded");
        go("waste_list");
      },
    }, "✓ No waste this shift"),
  ]);
  wrap.appendChild(noWasteCard);
  let qty = 0;
  let reason = "Spilled";
  let note = "";

  const branchPicker = makeBranchPicker(u.branches, () => branch, b => { branch = b; update(); });
  wrap.appendChild(branchPicker);

  const search = el("input", { type: "search", placeholder: "Search item (milk, coffee, caramel…)" });
  wrap.appendChild(el("div", { class: "search" }, [search]));

  const pickBox = el("div", { class: "list" });
  wrap.appendChild(pickBox);

  const bottom = el("div", { class: "card", style: { marginTop: "14px" } });
  wrap.appendChild(bottom);

  function update() {
    pickBox.innerHTML = "";
    const q = search.value.trim().toLowerCase();
    const stock = computeStock(branch);
    const list = state.items.filter(i => i.active && (q === "" || i.name.toLowerCase().includes(q)));
    list.slice(0, 50).forEach(it => {
      const row = el("div", {
        class: "row",
        style: { cursor: "pointer", outline: itemId === it.id ? "2px solid var(--accent)" : "none" },
        onClick: () => { itemId = it.id; update(); },
      }, [
        el("div", { class: "grow" }, [
          el("div", { class: "title" }, it.name),
          el("div", { class: "sub" }, it.category || "—"),
        ]),
        el("div", { class: "qty" }, `${fmtQty(stock[it.id]||0, it.unit)}`),
      ]);
      pickBox.appendChild(row);
    });

    bottom.innerHTML = "";
    if (!itemId) {
      bottom.appendChild(el("div", { class: "muted" }, "Pick an item above."));
      return;
    }
    const it = state.items.find(x => x.id === itemId);
    bottom.appendChild(el("h2", {}, `${it.name}  ·  current ${fmtQty(stock[itemId]||0, it.unit)}`));

    bottom.appendChild(el("label", {}, `Qty (${it.unit})`));
    const qtyInput = el("input", { type: "number", min: "0", step: "any", value: qty || "" });
    qtyInput.addEventListener("input", () => qty = Number(qtyInput.value) || 0);
    const stepper = el("div", { class: "qty-stepper" }, [
      el("button", { onClick: () => { qty = Math.max(0, (Number(qtyInput.value)||0) - (it.unit==="unit"?1:10)); qtyInput.value = qty; } }, "−"),
      qtyInput,
      el("button", { onClick: () => { qty = (Number(qtyInput.value)||0) + (it.unit==="unit"?1:10); qtyInput.value = qty; } }, "+"),
    ]);
    bottom.appendChild(stepper);

    bottom.appendChild(el("label", {}, "Reason"));
    const reasonSel = el("select", {}, ["Spilled","Expired","Returned by customer","Staff drink (comp)","Quality issue","Training / calibration","Other"].map(r => el("option", { value: r, selected: r===reason ? "true" : null }, r)));
    reasonSel.addEventListener("change", () => reason = reasonSel.value);
    bottom.appendChild(reasonSel);

    bottom.appendChild(el("label", {}, "Note (optional)"));
    const noteInput = el("input", { type: "text", value: note, placeholder: "e.g. dropped pitcher" });
    noteInput.addEventListener("input", () => note = noteInput.value);
    bottom.appendChild(noteInput);

    bottom.appendChild(el("div", { class: "sticky-actions" }, [
      el("button", { class: "btn", onClick: submit }, "Submit waste entry"),
      el("div", { class: "small muted", style: { marginTop: "6px", textAlign: "center" } }, `Will reduce ${it.name} at ${branch} by ${qty || 0} ${it.unit}.`),
    ]));
  }
  // ── Photo evidence (multi-image, auto-uploads to Cloudinary) ──
  const wastePhotoField = makePhotoField({ label: "Evidence photo(s)", multiple: true, formLabel: "Record Waste" });
  wrap.appendChild(wastePhotoField.el);

  search.addEventListener("input", update);
  update();

  function submit() {
    const it = state.items.find(x => x.id === itemId);
    if (!it || !qty || qty <= 0) { toast("Pick an item and qty > 0", "error"); return; }
    const s = stamp();
    const photoUrls = wastePhotoField.getCloudUrls().filter(Boolean);
    state.waste.push({
      id: uuid(), at: s.at, by: s.by, by_name: s.by_name, device: s.device,
      branch,
      inv_item_id: itemId, item_name: it.name, unit: it.unit,
      qty_canonical: qty,
      reason, note,
      photos: photoUrls,
      image_url: photoUrls[0] || "",
    });
    saveState();
    // KPI waste score is derived live in kpiGetUserScores() from state.waste — no extra storage needed
    const photoMsg = photoUrls.length ? ` · ${photoUrls.length} photo${photoUrls.length > 1 ? "s" : ""} saved` : "";
    toast("Waste recorded" + photoMsg);
    go("waste_list");
  }

  return wrap;
};

routes.waste_list = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Recent waste", "Signed entries. Tap + to add."));

  const list = el("div", { class: "list" });
  const mine = state.waste.filter(w => u.role === "owner" || u.branches.includes(w.branch))
    .sort((a,b) => b.at.localeCompare(a.at)).slice(0, 200);
  if (mine.length === 0) list.appendChild(el("div", { class: "muted" }, "No entries yet."));
  for (const w of mine) {
    const photoCount = (w.photos || []).length;
    const titleNode = el("div", { class: "title" });
    titleNode.appendChild(document.createTextNode(`${w.item_name} — ${fmtQty(w.qty_canonical, w.unit)}`));
    if (photoCount) titleNode.appendChild(el("span", { style: { marginLeft: "6px", fontSize: "12px", color: "var(--ok)", fontWeight: "600" } }, `📷 ${photoCount}`));
    const growParts = [
      titleNode,
      el("div", { class: "sub" }, `${w.branch} · ${w.reason}${w.note ? ` · ${w.note}` : ""}`),
      el("div", { class: "sub" }, `by ${w.by_name} · ${fmtDate(w.at)}`),
    ];
    if (photoCount) {
      const thumbRow = el("div", { style: { display: "flex", gap: "6px", marginTop: "6px", flexWrap: "wrap" } });
      (w.photos || []).forEach(url => {
        const thumb = el("img", { src: url, style: { width: "56px", height: "56px", objectFit: "cover", borderRadius: "8px", border: "1px solid var(--border)", cursor: "pointer" } });
        thumb.addEventListener("click", () => { const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; a.click(); });
        thumbRow.appendChild(thumb);
      });
      growParts.push(thumbRow);
    }
    list.appendChild(el("div", { class: "row" }, [
      el("div", { class: "grow" }, growParts),
      el("span", { class: "pill" }, w.branch),
    ]));
  }
  wrap.appendChild(list);
  wrap.appendChild(el("div", { class: "sticky-actions" }, [
    el("button", { class: "btn", onClick: () => go("waste_new") }, "+ New waste entry"),
    el("button", { class: "btn ghost", style: { marginTop: "8px" }, onClick: () => go("home") }, "← Home"),
  ]));
  return wrap;
};
