routes.shift_close_new = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Shift Close", "Fill in every field before you leave. This is your end-of-shift report."));

  let branch   = u.branches[0];
  let date     = new Date().toISOString().slice(0,10);
  let cash     = "";
  let instapay = "";
  let cc       = "";
  let talabat_credit = "";
  let talabat_cash   = "";

  // Barista allowance drinks — dynamic rows [{who, drink}]
  // Returns all active baristas/head-baristas assigned to the current branch.
  function getBaristaList() {
    return state.users
      .filter(x => x.active && (x.role === "barista" || x.role === "head_barista" || x.role === "manager" || x.role === "helper") && x.branches.includes(branch))
      .map(x => x.name);
  }
  let baristaAllowanceDrinks = [{ who: "", drink: "" }];

  // Extra money notes (e.g. unexpected cash/visa surplus)
  let extraMoneyNotes = "";

  // Closing barista name
  let closingBarista = "";

  // Cinema hospitality free drinks — count + note
  let cinemaFreeCount = "";
  let cinemaFreeNote  = "";

  // Management drinks — dynamic rows [{who, drink}]
  const MANAGERS = ["Haïdi", "Luke", "Youssef"];
  let mgmtDrinks = [{ who: "Haïdi", drink: "" }];

  // Discount receipt photos — managed by makePhotoField
  let discountPhotoField = null;

  const branchPicker = makeBranchPicker(u.branches, () => branch, b => { branch = b; drawBaristaAllowance(); });
  wrap.appendChild(branchPicker);

  const form = el("div", { class: "stack" });
  wrap.appendChild(form);

  function mkInput(type, value, onchange, placeholder) {
    const inp = el("input", { type, value: value || "", placeholder: placeholder || "" });
    inp.addEventListener("input", () => onchange(inp.value));
    return inp;
  }

  function drawMgmt() {
    mgmtBox.innerHTML = "";
    mgmtDrinks.forEach((row, idx) => {
      const rowEl = el("div", { style: { display: "flex", gap: "8px", marginTop: "8px", alignItems: "center" } }, [
        (() => {
          const sel = el("select", { style: { flex: "0 0 auto", width: "120px" } },
            MANAGERS.map(m => el("option", { value: m, selected: m === row.who ? "true" : null }, m)));
          sel.addEventListener("change", () => { row.who = sel.value; });
          return sel;
        })(),
        (() => {
          const inp = el("input", { type: "text", placeholder: "Drink name", value: row.drink, style: { flex: "1" } });
          inp.addEventListener("input", () => { row.drink = inp.value; });
          return inp;
        })(),
        el("button", { class: "btn ghost", style: { width: "auto", padding: "8px 12px" }, onClick: () => { mgmtDrinks.splice(idx, 1); drawMgmt(); } }, "✕"),
      ]);
      mgmtBox.appendChild(rowEl);
    });
  }
  const mgmtBox = el("div", {});

  function drawBaristaAllowance() {
    baristaAllowanceBox.innerHTML = "";
    baristaAllowanceDrinks.forEach((row, idx) => {
      const rowEl = el("div", { style: { display: "flex", gap: "8px", marginTop: "8px", alignItems: "center" } }, [
        (() => {
          const sel = el("select", { style: { flex: "0 0 auto", width: "130px" } },
            [el("option", { value: "" }, "— who? —"),
             ...getBaristaList().map(b => el("option", { value: b, selected: b === row.who ? "true" : null }, b))]);
          sel.addEventListener("change", () => { row.who = sel.value; });
          return sel;
        })(),
        (() => {
          const inp = el("input", { type: "text", placeholder: "Drink name", value: row.drink, style: { flex: "1" } });
          inp.addEventListener("input", () => { row.drink = inp.value; });
          return inp;
        })(),
        el("button", { class: "btn ghost", style: { width: "auto", padding: "8px 12px" }, onClick: () => { baristaAllowanceDrinks.splice(idx, 1); drawBaristaAllowance(); } }, "✕"),
      ]);
      baristaAllowanceBox.appendChild(rowEl);
    });
  }
  const baristaAllowanceBox = el("div", {});

  function draw() {
    form.innerHTML = "";

    form.appendChild(el("label", {}, "Date"));
    const dInput = el("input", { type: "date", value: date });
    dInput.addEventListener("input", () => date = dInput.value);
    form.appendChild(dInput);

    form.appendChild(el("label", {}, "Closing barista"));
    const cbSel = el("select", {},
      [el("option", { value: "" }, "— select barista —"),
       ...getBaristaList().map(b => el("option", { value: b, selected: b === closingBarista ? "true" : null }, b))]);
    cbSel.addEventListener("change", () => { closingBarista = cbSel.value; });
    form.appendChild(cbSel);

    // ── Cash & digital payments ──
    form.appendChild(el("h2", { style: { marginTop: "14px" } }, "Payments received"));
    form.appendChild(el("label", {}, "Cash (EGP)"));
    form.appendChild(mkInput("number", cash, v => cash = v, "0.00"));
    form.appendChild(el("label", {}, "Instapay (EGP)"));
    form.appendChild(mkInput("number", instapay, v => instapay = v, "0.00"));
    form.appendChild(el("label", {}, "Customer credit card (EGP)"));
    form.appendChild(mkInput("number", cc, v => cc = v, "0.00"));
    form.appendChild(el("label", {}, "Talabat — credit"));
    form.appendChild(mkInput("number", talabat_credit, v => talabat_credit = v, "0.00"));
    form.appendChild(el("label", {}, "Talabat — cash"));
    form.appendChild(mkInput("number", talabat_cash, v => talabat_cash = v, "0.00"));

    const totalShift = (Number(cash)||0) + (Number(instapay)||0) + (Number(cc)||0) + (Number(talabat_credit)||0) + (Number(talabat_cash)||0);
    form.appendChild(el("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: "10px", padding: "10px 12px", background: "var(--surface2, #f5f5f5)", borderRadius: "8px", fontWeight: "600" } }, [
      el("span", {}, "Total shift payments"),
      el("span", { class: "pill" }, `EGP ${totalShift.toFixed(2)}`),
    ]));

    form.appendChild(el("label", { style: { marginTop: "10px" } }, "Extra money — notes (visa or cash surplus/discrepancy)"));
    const emInp = el("textarea", { placeholder: "e.g. Visa machine had EGP 50 extra · Cash drawer over by EGP 20", rows: "2", style: { resize: "vertical" } }, extraMoneyNotes);
    emInp.addEventListener("input", () => extraMoneyNotes = emInp.value);
    form.appendChild(emInp);

    // ── Complimentary drinks ──
    form.appendChild(el("h2", { style: { marginTop: "14px" } }, "Complimentary drinks"));

    form.appendChild(el("div", { class: "muted small" }, "Log each drink per barista — who had what."));
    form.appendChild(baristaAllowanceBox);
    drawBaristaAllowance();
    form.appendChild(el("button", {
      class: "btn ghost",
      style: { marginTop: "8px" },
      onClick: () => { baristaAllowanceDrinks.push({ who: "", drink: "" }); drawBaristaAllowance(); },
    }, "+ Add barista drink"));

    form.appendChild(el("label", {}, "Cinema hospitality — number of free drinks"));
    form.appendChild(mkInput("number", cinemaFreeCount, v => cinemaFreeCount = v, "0"));
    form.appendChild(el("label", {}, "Cinema hospitality — note (optional)"));
    form.appendChild(mkInput("text", cinemaFreeNote, v => cinemaFreeNote = v, "e.g. Screening room, group of 8"));

    // ── Management drinks ──
    form.appendChild(el("h2", { style: { marginTop: "14px" } }, "Management drinks"));
    form.appendChild(el("div", { class: "muted small" }, "Log each drink consumed by Haïdi, Luke, or Youssef — who had what."));
    form.appendChild(mgmtBox);
    drawMgmt();
    form.appendChild(el("button", {
      class: "btn ghost",
      style: { marginTop: "8px" },
      onClick: () => { mgmtDrinks.push({ who: "Haïdi", drink: "" }); drawMgmt(); },
    }, "+ Add management drink"));

    // ── Discount receipts ──
    discountPhotoField = makePhotoField({ label: "Discounts — signed receipt photo(s)", formLabel: "Shift Close" });
    form.appendChild(discountPhotoField.el);

    form.appendChild(el("div", { class: "sticky-actions" }, [
      el("button", { class: "btn", onClick: () => submit() }, "Submit shift close"),
      el("button", { class: "btn ghost", style: { marginTop: "8px" }, onClick: () => go("home") }, "← Back to home"),
    ]));
  }
  draw();

  function submit() {
    if (!date) return toast("Pick a date", "error");
    if (cash === "" && instapay === "" && cc === "" && talabat_credit === "" && talabat_cash === "")
      return toast("Enter at least one payment amount", "error");

    const s = stamp();
    const doSave = async () => {
      const dpBlobs = discountPhotoField ? discountPhotoField.getBlobs() : [];
      const dpNames = dpBlobs.map(f => f.name);
      const discountPhotoIds = [];
      for (const pb of dpBlobs) {
        const pid = uuid();
        try { await IDB.put(pid, pb); } catch (e) { console.warn(e); }
        discountPhotoIds.push(pid);
      }
      const photoId = discountPhotoIds[0] || null;
      state.shift_closes.push({
        id: uuid(), at: s.at, by: s.by, by_name: s.by_name, device: s.device,
        branch, date,
        closing_barista: closingBarista,
        cash:            Number(cash)           || 0,
        instapay:        Number(instapay)       || 0,
        cc:              Number(cc)             || 0,
        talabat_credit:  Number(talabat_credit) || 0,
        talabat_cash:    Number(talabat_cash)   || 0,
        extra_money_notes: extraMoneyNotes.trim(),
        barista_allowance_drinks: baristaAllowanceDrinks.filter(r => r.drink.trim()),
        cinema_free_count: Number(cinemaFreeCount) || 0,
        cinema_free_note:  cinemaFreeNote.trim(),
        mgmt_drinks: mgmtDrinks.filter(r => r.drink.trim()),
        discount_photo_id: photoId,
        discount_photo_ids: discountPhotoIds,
        discount_photo_names: dpNames,
        discount_drive_ids: discountPhotoField ? discountPhotoField.getDriveIds() : [],
      });
      saveState();
      if (dpNames.length) {
        showPhotoConfirm({
          title: "Shift close submitted!",
          names: dpNames,
          driveIds: discountPhotoField ? discountPhotoField.getDriveIds() : [],
          onDone: () => go("shift_close_list"),
        });
      } else {
        toast("Shift close submitted ✓");
        go("shift_close_list");
      }
    };
    doSave();
  }

  return wrap;
};

routes.shift_close_list = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Shift Closes", "End-of-shift reports. Tap + to add today's."));

  const mine = state.shift_closes
    .filter(c => u.role === "owner" || u.role === "accountant" || u.branches.includes(c.branch))
    .sort((a, b) => b.at.localeCompare(a.at))
    .slice(0, 100);

  const list = el("div", { class: "list" });
  if (mine.length === 0) list.appendChild(el("div", { class: "muted" }, "No shift closes yet."));
  for (const c of mine) {
    const total = (c.cash||0) + (c.instapay||0) + (c.cc||0) + (c.talabat_credit||0) + (c.talabat_cash||0);
    const mgmt = (c.mgmt_drinks||[]).map(d => `${d.who}: ${d.drink}`).join(" · ") || "—";
    const baDrinks = (c.barista_allowance_drinks||[]).map(d => `${d.who||"?"}:${d.drink}`).join(" · ") || (c.barista_allowance || "—");
    list.appendChild(el("div", { class: "card", style: { marginBottom: "8px" } }, [
      el("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } }, [
        el("div", { style: { fontWeight: "600" } }, `${c.branch} · ${c.date}${c.closing_barista ? " · " + c.closing_barista : ""}`),
        el("div", { class: "pill" }, `${money(total)} total`),
      ]),
      el("div", { class: "muted small", style: { marginTop: "4px" } }, [
        `Cash ${money(c.cash||0)} · Instapay ${money(c.instapay||0)} · CC ${money(c.cc||0)} · Talabat cr ${money(c.talabat_credit||0)} · Talabat ca ${money(c.talabat_cash||0)}`
      ]),
      c.extra_money_notes ? el("div", { class: "muted small", style: { color: "var(--warn, #b45309)" } }, `💰 Extra: ${c.extra_money_notes}`) : null,
      el("div", { class: "muted small" }, `Barista drinks: ${baDrinks}`),
      el("div", { class: "muted small" }, `Cinema free: ${c.cinema_free_count||0}${c.cinema_free_note ? " · " + c.cinema_free_note : ""}`),
      el("div", { class: "muted small" }, `Mgmt drinks: ${mgmt}`),
      c.discount_photo_id ? el("div", { class: "muted small", style: { color: "var(--ok)" } }, "📷 Discount receipt photo attached") : null,
      el("div", { class: "muted small" }, `by ${c.by_name} · ${fmtDate(c.at)}`),
    ]));
  }
  wrap.appendChild(list);
  wrap.appendChild(el("div", { class: "sticky-actions" }, [
    el("button", { class: "btn", onClick: () => go("shift_close_new") }, "+ New shift close"),
    el("button", { class: "btn ghost", style: { marginTop: "8px" }, onClick: () => go("home") }, "← Home"),
  ]));
  return wrap;
};

// ==============================================================
// INVENTORY SNAPSHOT (monthly count)
// ==============================================================
routes.snapshot_new = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Monthly inventory count", "Count every item. We pre-fill the last counted value. Submit when done."));
  let branch = u.branches[0];
  let asOf = new Date().toISOString().slice(0,10);
  const branchPicker = makeBranchPicker(u.branches, () => branch, b => { branch = b; draw(); });
  wrap.appendChild(branchPicker);

  const dateLab = el("div", {}, [
    el("label", {}, "As of date"),
    (() => { const i = el("input", { type:"date", value: asOf }); i.addEventListener("input", () => asOf = i.value); return i; })(),
  ]);
  wrap.appendChild(dateLab);

  const search = el("input", { type: "search", placeholder: "Filter items…" });
  wrap.appendChild(el("div", { class: "search" }, [search]));
  search.addEventListener("input", draw);

  const inputs = {}; // item_id -> input el
  const list = el("div", { class: "list" });
  wrap.appendChild(list);

  function draw() {
    list.innerHTML = "";
    const stock = computeStock(branch);
    const q = search.value.trim().toLowerCase();
    const items = state.items.filter(i => i.active && (q==="" || i.name.toLowerCase().includes(q)));
    for (const it of items) {
      const pre = stock[it.id] || 0;
      // Blank placeholder so barista can clearly see what they type (not the prefill).
      const inp = inputs[it.id] || el("input", {
        type: "number", step: "any", placeholder: String(pre),
        style: { maxWidth: "120px" }
      });
      inputs[it.id] = inp;
      // Predictive usage + current threshold
      const usage = computeDailyUsage(it.id, branch);
      const cfg = (state.inventory_alerts || {})[it.id] || {};
      const threshold = Number(cfg.reorder_threshold_days) > 0 ? Number(cfg.reorder_threshold_days) : 7;
      const cover = usage > 0 ? (pre / usage) : null;
      const coverTxt = cover == null ? "usage unknown" : `~${cover.toFixed(1)}d cover`;
      const low = cover != null && cover < threshold;
      const subStyle = low ? { color: "var(--bad)", fontWeight: "700" } : {};
      const thresholdBtn = el("button", { class: "btn ghost", style: { padding: "4px 10px", fontSize: "12px" },
        onClick: (e) => {
          e.stopPropagation();
          const v = prompt(`Alert when "${it.name}" has fewer than this many days of cover (default 7):`, String(threshold));
          if (v == null) return;
          const n = Number(v);
          state.inventory_alerts = state.inventory_alerts || {};
          if (!n || n <= 0) { delete state.inventory_alerts[it.id]; }
          else { state.inventory_alerts[it.id] = { reorder_threshold_days: n }; }
          saveState();
          draw();
          toast(`Reorder threshold for ${it.name} set.`);
        }
      }, `⏰ ${threshold}d`);
      const titleRow = el("div", { style: { display: "flex", alignItems: "center", gap: "6px" } });
      titleRow.appendChild(el("span", { class: "title" }, it.name));
      if (u.role === "owner" || u.role === "accountant") {
        const editItemBtn = el("button", { class: "btn ghost", style: { padding: "2px 7px", fontSize: "11px" } }, "✏️");
        editItemBtn.title = "Edit item";
        editItemBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          const INV_CATEGORIES = [
            { value: "coffee-beans", label: "Coffee Beans" }, { value: "milk", label: "Milk" },
            { value: "tea", label: "Tea" }, { value: "powder", label: "Powder" },
            { value: "spices", label: "Spices" }, { value: "sugar", label: "Sugar" },
            { value: "puree", label: "Puree" }, { value: "syrup", label: "Syrup" },
            { value: "sauce", label: "Sauce" }, { value: "dairy-extras", label: "Dairy Extras" },
            { value: "halo-snacks", label: "Halo Snacks" }, { value: "beverages", label: "Beverages" },
            { value: "packaging", label: "Packaging" },
          ];
          openPrompt({
            title: `Edit item: ${it.name}`,
            fields: [
              { key: "name",     label: "Name",     type: "text",   value: it.name },
              { key: "unit",     label: "Unit",     type: "select", value: it.unit,
                options: [{ value: "g", label: "g (grams)" }, { value: "ml", label: "ml (millilitres)" }, { value: "unit", label: "unit (each)" }] },
              { key: "category", label: "Category", type: "select", value: it.category, options: INV_CATEGORIES },
            ],
            onSubmit: (v) => {
              if (!v.name || !v.name.trim()) return toast("Name is required", "error");
              it.name = v.name.trim(); it.unit = v.unit; it.category = v.category;
              saveState(); draw();
              toast(`Updated ${it.name}`);
            }
          });
        });
        titleRow.appendChild(editItemBtn);
      }
      list.appendChild(el("div", { class: "row" }, [
        el("div", { class: "grow" }, [
          titleRow,
          el("div", { class: "sub" }, `${it.category} · theoretical ${fmtQty(pre, it.unit)}`),
          el("div", { class: "sub", style: subStyle }, `${coverTxt} · daily use ~${fmtQty(usage, it.unit)}`),
        ]),
        el("div", { style: { display: "flex", flexDirection: "column", gap: "4px", alignItems: "flex-end" } }, [
          inp,
          el("div", { class: "sub", style: { textAlign: "right" } }, it.unit),
          thresholdBtn,
        ]),
      ]));
    }
  }
  draw();

  // Undo stack — last submitted snapshot ids the user can roll back this session.
  const undoStack = [];
  const actionsBar = el("div", { class: "sticky-actions" }, [
    el("button", { class: "btn", onClick: submit }, "Submit count"),
    el("button", { class: "btn ghost", style: { marginTop: "8px" }, onClick: () => go("home") }, "Cancel"),
  ]);
  wrap.appendChild(actionsBar);

  const undoBar = el("div", { class: "card", style: { marginTop: "8px", display: "none", borderColor: "var(--accent)" } });
  wrap.appendChild(undoBar);
  function renderUndo() {
    undoBar.innerHTML = "";
    if (!undoStack.length) { undoBar.style.display = "none"; return; }
    undoBar.style.display = "block";
    undoBar.appendChild(el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } }, "Recent submissions (tap to undo)"));
    for (const snapId of [...undoStack].reverse().slice(0, 5)) {
      const snap = state.snapshots.find(s => s.id === snapId);
      if (!snap) continue;
      const row = el("div", { class: "row", style: { alignItems: "center" } }, [
        el("div", { class: "grow" }, [
          el("div", { class: "title" }, `${snap.branch} count — ${snap.as_of}`),
          el("div", { class: "sub" }, `${snap.entries.filter(e => e.branch === snap.branch).length} items · ${fmtDate(snap.created_at)} · by ${snap.created_by_name || "—"}`),
        ]),
        el("button", { class: "btn secondary", onClick: () => undoSnapshot(snap.id) }, "↶ Undo"),
      ]);
      undoBar.appendChild(row);
    }
  }

  function undoSnapshot(snapId) {
    if (!confirm("Remove this inventory submission? The previous counts will become active again.")) return;
    state.snapshots = state.snapshots.filter(s => s.id !== snapId);
    const i = undoStack.indexOf(snapId);
    if (i >= 0) undoStack.splice(i, 1);
    saveState();
    toast("Submission removed");
    renderUndo();
    draw();
  }

  function submit() {
    // Build snapshot entries: carry over the OTHER branches' latest counts unchanged,
    // replace THIS branch's values with inputs. Only rows where the user actually typed
    // something are applied — blank inputs mean "no count taken for this item".
    const s = stamp();
    const latest = state.snapshots.slice().sort((a,b) => a.created_at.localeCompare(b.created_at)).slice(-1)[0];
    const byKey = {};
    if (latest) for (const e of latest.entries) byKey[e.branch + "|" + e.item_id] = Number(e.qty) || 0;
    let counted = 0;
    for (const it of state.items) {
      const inp = inputs[it.id];
      if (inp && String(inp.value).trim() !== "") {
        byKey[branch + "|" + it.id] = Number(inp.value) || 0;
        counted++;
      }
    }
    if (counted === 0) { toast("Type at least one count first", "error"); return; }
    const entries = [];
    for (const [k, v] of Object.entries(byKey)) {
      const [br, id] = k.split("|"); entries.push({ branch: br, item_id: id, qty: v });
    }
    const snapId = uuid();
    state.snapshots.push({
      id: snapId, as_of: asOf, branch, created_at: s.at, created_by: s.by, created_by_name: s.by_name, device: s.device,
      entries,
      notes: `${branch} count`,
      image_url: "",
    });
    undoStack.push(snapId);
    saveState();
    // Clear every input — the new "theoretical" on the left is now the count they just saved.
    for (const id of Object.keys(inputs)) {
      inputs[id].value = "";
      inputs[id].defaultValue = "";
    }
    toast(`Saved ${counted} item counts — theoretical updated. Undo available below.`);
    // Predictive low-stock scan — surfaces items that just dipped under their
    // reorder threshold, based on usage implied by the fresh count + purchases.
    try { scanAndNotifyLowStock(); } catch (e) { console.warn(e); }
    renderUndo();
    draw();
  }

  // ── Manage Items panel (owner + head_barista only) ──────────────
  if (["owner", "head_barista"].includes(u.role)) {
    let panelOpen = false;
    let showInactive = false;

    const panelBody = el("div", { style: { display: "none", marginTop: "12px" } });

    // Add-item form
    const nameIn = el("input", { type: "text", placeholder: "Item name (e.g. Oat Milk)" });
    const unitIn = el("input", { type: "text", placeholder: "Unit (e.g. ml, g, pcs, kg)" });
    const catIn  = el("input", { type: "text", placeholder: "Category (e.g. Milk, Syrup, Packaging)" });

    const mgmtList = el("div", { class: "list", style: { marginTop: "12px" } });

    function drawMgmt() {
      mgmtList.innerHTML = "";
      let items = state.items.filter(i =>
        showInactive || i.active
      ).slice().sort((a, b) => {
        if (a.active !== b.active) return a.active ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
      if (!items.length) {
        mgmtList.appendChild(el("div", { class: "muted", style: { padding: "12px 4px" } }, "No items."));
        return;
      }
      for (const it of items) {
        const badge = el("span", {
          style: {
            padding: "2px 8px", borderRadius: "10px", fontSize: "11px", fontWeight: "700",
            background: it.active ? "#dcfce7" : "#f3f4f6",
            color: it.active ? "#16a34a" : "#9ca3af",
            marginLeft: "6px",
          }
        }, it.active ? "Active" : "Inactive");
        const toggleBtn = el("button", {
          class: "btn ghost",
          style: { padding: "5px 12px", fontSize: "12px", color: it.active ? "var(--bad,#dc2626)" : "var(--good,#16a34a)" },
          onClick: () => {
            const msg = it.active
              ? `Deactivate "${it.name}"? It will no longer appear in counts.`
              : `Restore "${it.name}"? It will reappear in counts.`;
            if (!confirm(msg)) return;
            it.active      = !it.active;
            it.modified_by = currentUser() ? currentUser().name : "—";
            it.modified_at = now();
            saveState();
            toast(`"${it.name}" ${it.active ? "restored ✓" : "deactivated ✓"}`);
            drawMgmt();
            draw(); // refresh the count list above
          }
        }, it.active ? "Deactivate" : "Restore");
        mgmtList.appendChild(el("div", { class: "row", style: { opacity: it.active ? "1" : "0.5" } }, [
          el("div", { class: "grow" }, [
            el("div", { class: "title" }, [it.name, badge]),
            el("div", { class: "sub" }, `${it.category || "—"} · ${it.unit}`),
          ]),
          toggleBtn,
        ]));
      }
    }

    function addMgmtItem() {
      const name = nameIn.value.trim();
      const unit = unitIn.value.trim();
      const cat  = catIn.value.trim();
      if (!name) { toast("Enter an item name", "error"); return; }
      if (!unit) { toast("Enter a unit (e.g. ml, g, pcs)", "error"); return; }
      if (state.items.some(i => i.name.toLowerCase() === name.toLowerCase())) {
        toast("An item with that name already exists.", "error"); return;
      }
      state.items.push({
        id: "inv_" + String(Date.now()),
        name, unit,
        category: cat || "Other",
        active: true,
        added_by: currentUser() ? currentUser().name : "—",
        added_at: now(),
      });
      saveState();
      nameIn.value = ""; unitIn.value = ""; catIn.value = "";
      toast(`"${name}" added ✓`);
      drawMgmt();
      draw(); // refresh count list above
    }

    const toggleInactiveBtn = el("button", {
      class: "btn ghost",
      style: { fontSize: "12px", marginTop: "8px" },
      onClick: () => {
        showInactive = !showInactive;
        toggleInactiveBtn.textContent = showInactive ? "Hide inactive items" : "Show inactive items";
        drawMgmt();
      }
    }, "Show inactive items");

    panelBody.appendChild(el("div", { class: "card", style: { marginBottom: "8px" } }, [
      el("div", { class: "muted", style: { textTransform: "uppercase", letterSpacing: "1px", fontSize: "11px", marginBottom: "10px", fontWeight: "700" } }, "Add new item"),
      el("div", { class: "form-field" }, [ el("label", {}, "Name"), nameIn ]),
      el("div", { class: "form-field" }, [ el("label", {}, "Unit"), unitIn ]),
      el("div", { class: "form-field" }, [ el("label", {}, "Category"), catIn ]),
      el("button", { class: "btn", style: { marginTop: "8px" }, onClick: addMgmtItem }, "＋ Add item"),
    ]));
    panelBody.appendChild(toggleInactiveBtn);
    panelBody.appendChild(mgmtList);

    const togglePanelBtn = el("button", {
      class: "btn ghost",
      style: { marginTop: "24px", width: "100%", borderStyle: "dashed", fontSize: "13px" },
      onClick: () => {
        panelOpen = !panelOpen;
        panelBody.style.display = panelOpen ? "block" : "none";
        togglePanelBtn.textContent = panelOpen ? "▲ Hide item management" : "🗂️ Manage items (add / remove)";
        if (panelOpen) drawMgmt();
      }
    }, "🗂️ Manage items (add / remove)");

    wrap.appendChild(togglePanelBtn);
    wrap.appendChild(panelBody);
  }
  // ── end Manage Items ────────────────────────────────────────────

  return wrap;
};

// ==============================================================
// PURCHASES
// Two line types:
//   - "inventory" — an item that sits in the stock count. Has a purchase unit
//     (bottle, pack, carton…) + pack size in the inventory unit (ml, g, pcs).
// ==============================================================
// REORDER ACTIONS
// ==============================================================
routes.reorder_action_new = function (u, params) {
  params = params || {};
  const wrap = el("div", {});
  wrap.appendChild(header("Reorder Action", "Log the action you took for a low-stock alert."));

  state.alert_log = state.alert_log || [];
  state.reorder_actions = state.reorder_actions || [];

  // Build list of actionable alerts (not resolved, no action yet — or follow-up needed)
  const now = Date.now();
  const pending = state.alert_log.filter(a => {
    if (isReorderResolved(a.item_id, a.date)) return false;
    if (isReorderActionedByCalling(a.key)) return false;
    const daysSince = Math.floor((now - new Date(a.date + "T00:00:00")) / 86400000);
    return daysSince <= 14;
  });

  if (pending.length === 0) {
    wrap.appendChild(el("div", { class: "card", style: { textAlign: "center", padding: "32px 16px" } }, [
      el("div", { style: { fontSize: "32px", marginBottom: "8px" } }, "✅"),
      el("div", { style: { fontWeight: "700", marginBottom: "4px" } }, "No pending reorder actions"),
      el("div", { class: "muted" }, "All low-stock alerts have been actioned or resolved."),
    ]));
    return wrap;
  }

  // Pre-select alert from params or default to first
  let selectedKey = params.alert_key || pending[0].key;
  if (!pending.some(a => a.key === selectedKey)) selectedKey = pending[0].key;

  // Alert picker (if multiple pending)
  if (pending.length > 1) {
    const pickerLabel = el("div", { class: "muted small", style: { marginBottom: "4px" } }, "Select alert to action:");
    const picker = el("select", { style: { marginBottom: "14px" } });
    pending.forEach(a => {
      const daysSince = Math.floor((now - new Date(a.date + "T00:00:00")) / 86400000);
      const opt = el("option", { value: a.key }, `${a.item_name} · ${a.branch} · ${daysSince}d ago`);
      if (a.key === selectedKey) opt.selected = true;
      picker.appendChild(opt);
    });
    picker.addEventListener("change", () => { selectedKey = picker.value; renderForm(); });
    wrap.appendChild(pickerLabel);
    wrap.appendChild(picker);
  }

  const formArea = el("div", {});
  wrap.appendChild(formArea);

  function renderForm() {
    formArea.innerHTML = "";
    const alert = pending.find(a => a.key === selectedKey) || pending[0];
    if (!alert) return;

    const daysSince = Math.floor((now - new Date(alert.date + "T00:00:00")) / 86400000);
    const isOverdue = Array.isArray(alert.follow_ups) && alert.follow_ups.length > 0;

    // Alert summary card
    const summaryCard = el("div", { class: "card", style: { background: isOverdue ? "#fff5f5" : "var(--surface-2)", border: `1px solid ${isOverdue ? "#c0392b" : "var(--border)"}`, marginBottom: "14px" } });
    summaryCard.appendChild(el("div", { style: { fontWeight: "700", fontSize: "15px", marginBottom: "4px" } }, `📦 ${alert.item_name}`));
    summaryCard.appendChild(el("div", { class: "muted small" }, `Branch: ${alert.branch} · Alert date: ${alert.date} · ${daysSince} day${daysSince!==1?"s":""} ago`));
    if (isOverdue) {
      summaryCard.appendChild(el("div", { style: { color: "#c0392b", fontWeight: "600", fontSize: "12px", marginTop: "6px" } }, `🔴 ${alert.follow_ups.length} follow-up alarm${alert.follow_ups.length>1?"s":""} fired — action overdue`));
    }
    formArea.appendChild(summaryCard);

    // Supplier info
    const suppliers = (state.suppliers || {})[alert.item_id] || [];
    const supCard = el("div", { class: "card", style: { marginBottom: "14px" } });
    supCard.appendChild(el("div", { style: { fontWeight: "600", marginBottom: "8px" } }, "📞 Supplier Info"));
    if (suppliers.length === 0) {
      supCard.appendChild(el("div", { class: "muted small" }, "No suppliers loaded yet for this item. Contact head barista or owner."));
    } else {
      suppliers.forEach(s => {
        const row = el("div", { style: { marginBottom: "8px", paddingBottom: "8px", borderBottom: "1px solid var(--border)" } });
        row.appendChild(el("div", { style: { fontWeight: "600" } }, s.name));
        if (s.contact) row.appendChild(el("div", { class: "muted small" }, `📱 ${s.contact}`));
        if (s.notes)   row.appendChild(el("div", { class: "muted small" }, s.notes));
        supCard.appendChild(row);
      });
    }
    formArea.appendChild(supCard);

    // Action checkboxes
    let calledSupplier = false;
    let notifiedHead = false;

    const actionCard = el("div", { class: "card", style: { marginBottom: "14px" } });
    actionCard.appendChild(el("div", { style: { fontWeight: "600", marginBottom: "10px" } }, "Action Taken (tick at least one)"));

    const cbCalled = el("input", { type: "checkbox" });
    cbCalled.addEventListener("change", () => { calledSupplier = cbCalled.checked; });
    const lblCalled = el("label", { style: { display: "flex", alignItems: "center", gap: "10px", marginBottom: "10px", cursor: "pointer", fontSize: "14px" } });
    lblCalled.appendChild(cbCalled);
    lblCalled.appendChild(el("span", {}, "☎️ Called the supplier directly"));
    actionCard.appendChild(lblCalled);

    const cbHead = el("input", { type: "checkbox" });
    cbHead.addEventListener("change", () => { notifiedHead = cbHead.checked; });
    const lblHead = el("label", { style: { display: "flex", alignItems: "center", gap: "10px", cursor: "pointer", fontSize: "14px" } });
    lblHead.appendChild(cbHead);
    lblHead.appendChild(el("span", {}, "👤 Communicated to head barista to order"));
    actionCard.appendChild(lblHead);
    formArea.appendChild(actionCard);

    // Comment field
    const commentCard = el("div", { class: "card", style: { marginBottom: "14px" } });
    commentCard.appendChild(el("div", { style: { fontWeight: "600", marginBottom: "8px" } }, "Comment (optional but recommended)"));
    const commentIn = el("textarea", { placeholder: "e.g. Called Beano's — delivery Thursday. / Told Ahmed to order before weekend.", rows: "3", style: { width: "100%", resize: "vertical" } });
    commentCard.appendChild(commentIn);
    formArea.appendChild(commentCard);

    // Save button
    const saveBtn = el("button", { class: "btn", style: { width: "100%" } }, "Save Action");
    saveBtn.addEventListener("click", () => {
      if (!calledSupplier && !notifiedHead) {
        toast("Tick at least one action before saving.");
        return;
      }
      const s = stamp();
      state.reorder_actions.push({
        id: uuid(),
        alert_key: alert.key,
        item_id: alert.item_id,
        item_name: alert.item_name,
        branch: alert.branch,
        alert_date: alert.date,
        called_supplier: calledSupplier,
        notified_head_barista: notifiedHead,
        comment: commentIn.value.trim(),
        by: s.by, by_name: s.by_name, at: s.at,
      });
      saveState();
      toast("✓ Reorder action saved");
      go("home");
    });
    formArea.appendChild(saveBtn);
  }

  renderForm();
  return wrap;
};

routes.reorder_action_list = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Supplier Orders", "Reorder actions logged by baristas."));

  state.alert_log = state.alert_log || [];
  state.reorder_actions = state.reorder_actions || [];

  const now = Date.now();

  // Build enriched list of all alerts from last 30 days
  const cutoff = new Date(Date.now() - 30 * 86400000).toISOString().slice(0,10);
  const alerts = state.alert_log.filter(a => a.date >= cutoff).sort((a,b) => b.date.localeCompare(a.date));

  if (alerts.length === 0) {
    wrap.appendChild(el("div", { class: "card muted", style: { textAlign: "center", padding: "32px 16px" } }, "No low-stock alerts in the last 30 days."));
    return wrap;
  }

  alerts.forEach(a => {
    const actions = (state.reorder_actions).filter(r => r.alert_key === a.key);
    const resolved = isReorderResolved(a.item_id, a.date);
    const calledSupplier = isReorderActionedByCalling(a.key);
    const daysSince = Math.floor((now - new Date(a.date + "T00:00:00")) / 86400000);
    const isOverdue = !resolved && !calledSupplier && daysSince > 6;
    const hasPending = !resolved && actions.length === 0;

    let statusLabel, statusColor;
    if (resolved) { statusLabel = "✅ Resolved (purchased)"; statusColor = "#27ae60"; }
    else if (calledSupplier) { statusLabel = "✅ Supplier called"; statusColor = "#27ae60"; }
    else if (isOverdue) { statusLabel = "🔴 Overdue"; statusColor = "#c0392b"; }
    else if (hasPending) { statusLabel = "⏳ Pending action"; statusColor = "#e67e22"; }
    else { statusLabel = "⏳ Actioned — awaiting purchase"; statusColor = "#2980b9"; }

    const card = el("div", { class: "card", style: { marginBottom: "12px", borderLeft: `4px solid ${statusColor}` } });

    // Header row
    const hdr = el("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "8px" } });
    hdr.appendChild(el("div", { style: { fontWeight: "700" } }, `${a.item_name} · ${a.branch}`));
    hdr.appendChild(el("div", { style: { fontSize: "12px", color: statusColor, fontWeight: "600" } }, statusLabel));
    card.appendChild(hdr);
    card.appendChild(el("div", { class: "muted small", style: { marginBottom: "8px" } }, `Alert: ${a.date} · ${daysSince}d ago`));

    // Follow-up alarms fired
    if (Array.isArray(a.follow_ups) && a.follow_ups.length > 0) {
      card.appendChild(el("div", { style: { fontSize: "12px", color: "#c0392b", marginBottom: "8px" } }, `⚠️ ${a.follow_ups.length} follow-up alarm${a.follow_ups.length>1?"s":""} fired`));
    }

    // Actions logged
    if (actions.length > 0) {
      actions.forEach(r => {
        const actionRow = el("div", { style: { background: "var(--surface-2)", borderRadius: "6px", padding: "8px 10px", marginBottom: "6px", fontSize: "13px" } });
        const chips = [];
        if (r.called_supplier) chips.push("☎️ Called supplier");
        if (r.notified_head_barista) chips.push("👤 Notified head barista");
        actionRow.appendChild(el("div", { style: { fontWeight: "600", marginBottom: "4px" } }, chips.join(" · ")));
        actionRow.appendChild(el("div", { class: "muted small" }, `${r.by_name} · ${r.at.slice(0,16).replace("T"," ")}`));
        if (r.comment) actionRow.appendChild(el("div", { style: { marginTop: "4px", fontStyle: "italic", fontSize: "12px" } }, `"${r.comment}"`));
        card.appendChild(actionRow);
      });
    } else {
      card.appendChild(el("div", { style: { color: "#e67e22", fontSize: "13px" } }, "No action logged yet."));
    }

    // Quick-action button for pending items
    if (hasPending || (!resolved && !calledSupplier)) {
      const btn = el("button", { class: "btn secondary", style: { marginTop: "8px", padding: "6px 14px", fontSize: "12px" } }, "📝 Log action");
      btn.addEventListener("click", () => go("reorder_action_new", { alert_key: a.key }));
      card.appendChild(btn);
    }

    wrap.appendChild(card);
  });

  return wrap;
};

routes.supplier_list = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Supplier List", "Assign suppliers to inventory items. Baristas see this when a reorder alert fires."));

  state.suppliers = state.suppliers || {};
  const items = (state.items || []).filter(it => it.active !== false).sort((a,b) => a.name.localeCompare(b.name));

  // ── Mode: "single" (click to edit one item) or "bulk" (checkboxes → assign to many) ──
  let mode = "single";
  let selectedItemId = items.length > 0 ? items[0].id : null;
  let checkedIds = new Set();
  let searchQ = "";

  // Mode toggle bar
  const modeBar = el("div", { style: { display: "flex", gap: "8px", marginBottom: "14px", flexWrap: "wrap", alignItems: "center" } });
  const btnSingle = el("button", { class: "chip ok" }, "✏️ Edit single item");
  const btnBulk   = el("button", { class: "chip" },    "☑️ Bulk assign supplier");
  modeBar.appendChild(btnSingle);
  modeBar.appendChild(btnBulk);
  modeBar.appendChild(el("span", { class: "muted small", style: { marginLeft: "4px" } },
    "Bulk: tick items that share the same supplier, then fill in supplier details once."));
  wrap.appendChild(modeBar);

  function setMode(m) {
    mode = m;
    checkedIds = new Set();
    btnSingle.className = mode === "single" ? "chip ok" : "chip";
    btnBulk.className   = mode === "bulk"   ? "chip ok" : "chip";
    renderItemList();
    renderRight();
  }
  btnSingle.addEventListener("click", () => setMode("single"));
  btnBulk.addEventListener("click",   () => setMode("bulk"));

  const layout = el("div", { style: { display: "flex", gap: "12px", alignItems: "flex-start" } });

  // ── Left panel — item list ──
  const leftPanel = el("div", { style: { width: "42%", flexShrink: "0" } });
  const searchIn  = el("input", { type: "search", placeholder: "Search items…", style: { marginBottom: "8px" } });
  const itemList  = el("div", { style: { maxHeight: "70vh", overflowY: "auto" } });

  function renderItemList() {
    itemList.innerHTML = "";
    const filtered = items.filter(it => !searchQ || it.name.toLowerCase().includes(searchQ));

    if (mode === "bulk" && filtered.length > 0) {
      // Select-all / clear row
      const allChecked = filtered.every(it => checkedIds.has(it.id));
      const selAllRow = el("div", { style: { display: "flex", justifyContent: "space-between", marginBottom: "6px", fontSize: "12px" } });
      const selAllBtn = el("button", { class: "chip", style: { fontSize: "11px", padding: "2px 8px" } },
        allChecked ? "Deselect all" : "Select all");
      selAllBtn.addEventListener("click", () => {
        if (allChecked) filtered.forEach(it => checkedIds.delete(it.id));
        else            filtered.forEach(it => checkedIds.add(it.id));
        renderItemList(); renderRight();
      });
      selAllRow.appendChild(el("span", { class: "muted" }, `${checkedIds.size} selected`));
      selAllRow.appendChild(selAllBtn);
      itemList.appendChild(selAllRow);
    }

    filtered.forEach(it => {
      const hasSuppliers = (state.suppliers[it.id] || []).length > 0;
      const isChecked    = checkedIds.has(it.id);
      const isSelected   = mode === "single" && it.id === selectedItemId;

      const row = el("div", { style: {
        padding: "8px 10px", borderRadius: "6px", cursor: "pointer", marginBottom: "4px",
        background: isSelected ? "var(--ink)" : isChecked ? "#e8f4f8" : "var(--surface-2)",
        color: isSelected ? "var(--accent)" : "var(--ink)",
        border: isChecked ? "1.5px solid var(--ok)" : "1.5px solid transparent",
        fontSize: "13px", display: "flex", alignItems: "center", gap: "8px",
      }});

      if (mode === "bulk") {
        const cb = el("input", { type: "checkbox" });
        cb.checked = isChecked;
        cb.addEventListener("change", (e) => {
          e.stopPropagation();
          if (cb.checked) checkedIds.add(it.id); else checkedIds.delete(it.id);
          renderItemList(); renderRight();
        });
        row.appendChild(cb);
      }

      const nameSpan = el("span", { style: { flex: "1" } }, it.name);
      row.appendChild(nameSpan);

      if (hasSuppliers) {
        row.appendChild(el("span", { style: { fontSize: "10px", opacity: "0.65", flexShrink: "0" } },
          `${state.suppliers[it.id].length}✓`));
      }

      row.addEventListener("click", () => {
        if (mode === "single") { selectedItemId = it.id; renderItemList(); renderRight(); }
        else {
          if (checkedIds.has(it.id)) checkedIds.delete(it.id); else checkedIds.add(it.id);
          renderItemList(); renderRight();
        }
      });
      itemList.appendChild(row);
    });
  }

  searchIn.addEventListener("input", () => { searchQ = searchIn.value.toLowerCase(); renderItemList(); });
  leftPanel.appendChild(searchIn);
  leftPanel.appendChild(itemList);
  layout.appendChild(leftPanel);

  // ── Right panel — supplier editor ──
  const rightPanel = el("div", { style: { flex: "1" } });
  layout.appendChild(rightPanel);

  // ── Single-item editor ──
  function renderSingleRight() {
    rightPanel.innerHTML = "";
    if (!selectedItemId) return;
    const item = items.find(it => it.id === selectedItemId);
    if (!item) return;

    rightPanel.appendChild(el("div", { style: { fontWeight: "700", marginBottom: "12px", fontSize: "15px" } }, `📦 ${item.name}`));

    const suppliers = state.suppliers[selectedItemId] || [];

    suppliers.forEach((s, idx) => {
      const sCard = el("div", { class: "card", style: { marginBottom: "10px", padding: "10px 12px" } });
      const nameIn    = el("input", { type: "text", placeholder: "Supplier name",               value: s.name    || "", style: { marginBottom: "6px" } });
      const contactIn = el("input", { type: "text", placeholder: "Phone / email",               value: s.contact || "", style: { marginBottom: "6px" } });
      const notesIn   = el("input", { type: "text", placeholder: "Notes (min order, delivery…)", value: s.notes   || "" });

      [nameIn, contactIn, notesIn].forEach(inp => {
        inp.addEventListener("input", () => {
          state.suppliers[selectedItemId][idx].name    = nameIn.value.trim();
          state.suppliers[selectedItemId][idx].contact = contactIn.value.trim();
          state.suppliers[selectedItemId][idx].notes   = notesIn.value.trim();
          saveState();
        });
      });

      const removeBtn = el("button", { class: "btn secondary", style: { marginTop: "8px", padding: "4px 10px", fontSize: "12px", color: "var(--bad)" } }, "Remove");
      removeBtn.addEventListener("click", () => {
        state.suppliers[selectedItemId].splice(idx, 1);
        saveState(); renderSingleRight(); renderItemList();
      });

      sCard.appendChild(nameIn); sCard.appendChild(contactIn); sCard.appendChild(notesIn); sCard.appendChild(removeBtn);
      rightPanel.appendChild(sCard);
    });

    const addBtn = el("button", { class: "btn secondary", style: { width: "100%" } }, "+ Add Supplier");
    addBtn.addEventListener("click", () => {
      if (!state.suppliers[selectedItemId]) state.suppliers[selectedItemId] = [];
      state.suppliers[selectedItemId].push({ id: uuid(), name: "", contact: "", notes: "" });
      saveState(); renderSingleRight(); renderItemList();
    });
    rightPanel.appendChild(addBtn);
  }

  // ── Bulk-assign panel ──
  function renderBulkRight() {
    rightPanel.innerHTML = "";

    if (checkedIds.size === 0) {
      rightPanel.appendChild(el("div", { class: "card", style: { textAlign: "center", padding: "32px 16px", color: "var(--ink-dim)" } }, [
        el("div", { style: { fontSize: "28px", marginBottom: "8px" } }, "☑️"),
        el("div", { style: { fontWeight: "600" } }, "Tick items on the left"),
        el("div", { class: "muted small", style: { marginTop: "4px" } }, "Select all items that share the same supplier, then fill in the details once."),
      ]));
      return;
    }

    const selectedItems = items.filter(it => checkedIds.has(it.id));

    // Summary of selected items
    const summaryCard = el("div", { class: "card", style: { marginBottom: "12px", background: "var(--surface-2)" } });
    summaryCard.appendChild(el("div", { style: { fontWeight: "600", marginBottom: "8px" } },
      `📦 Assigning supplier to ${selectedItems.length} item${selectedItems.length > 1 ? "s" : ""}:`));
    const tagWrap = el("div", { style: { display: "flex", flexWrap: "wrap", gap: "6px" } });
    selectedItems.forEach(it => tagWrap.appendChild(el("span", { class: "chip" }, it.name)));
    summaryCard.appendChild(tagWrap);
    rightPanel.appendChild(summaryCard);

    // Supplier form
    const formCard = el("div", { class: "card", style: { marginBottom: "12px" } });
    formCard.appendChild(el("div", { style: { fontWeight: "600", marginBottom: "10px" } }, "Supplier details"));

    const nameIn    = el("input", { type: "text", placeholder: "Supplier name *",              style: { marginBottom: "8px" } });
    const contactIn = el("input", { type: "text", placeholder: "Phone / email",                style: { marginBottom: "8px" } });
    const notesIn   = el("input", { type: "text", placeholder: "Notes (min order, delivery…)" });

    formCard.appendChild(nameIn);
    formCard.appendChild(contactIn);
    formCard.appendChild(notesIn);
    rightPanel.appendChild(formCard);

    // Option: skip items that already have this supplier
    const skipLabel = el("label", { style: { display: "flex", alignItems: "center", gap: "8px", fontSize: "13px", marginBottom: "12px", cursor: "pointer" } });
    const skipCb = el("input", { type: "checkbox" });
    skipCb.checked = true;
    skipLabel.appendChild(skipCb);
    skipLabel.appendChild(el("span", {}, "Skip items that already have a supplier with this name"));
    rightPanel.appendChild(skipLabel);

    const saveBtn = el("button", { class: "btn", style: { width: "100%" } },
      `Assign to ${selectedItems.length} item${selectedItems.length > 1 ? "s" : ""}`);

    saveBtn.addEventListener("click", () => {
      const name    = nameIn.value.trim();
      const contact = contactIn.value.trim();
      const notes   = notesIn.value.trim();
      if (!name) { toast("Enter a supplier name first."); return; }

      let assigned = 0, skipped = 0;
      selectedItems.forEach(it => {
        if (!state.suppliers[it.id]) state.suppliers[it.id] = [];
        const alreadyHas = skipCb.checked &&
          state.suppliers[it.id].some(s => s.name.toLowerCase() === name.toLowerCase());
        if (alreadyHas) { skipped++; return; }
        state.suppliers[it.id].push({ id: uuid(), name, contact, notes });
        assigned++;
      });

      saveState();
      renderItemList();
      toast(`✓ "${name}" assigned to ${assigned} item${assigned !== 1 ? "s" : ""}${skipped ? ` (${skipped} skipped — already had this supplier)` : ""}`);

      // Clear form + selection after save
      checkedIds = new Set();
      renderItemList();
      renderRight();
    });
    rightPanel.appendChild(saveBtn);
  }

  function renderRight() {
    if (mode === "single") renderSingleRight();
    else renderBulkRight();
  }

  renderItemList();
  renderRight();
  wrap.appendChild(layout);
  return wrap;
};

// ==============================================================
// INVENTORY ITEMS — master item list management
// ==============================================================
routes.items_list = function (u) {
  const canEdit = u.role === "owner" || u.role === "accountant";

  const INV_CATEGORIES = [
    { value: "coffee-beans",  label: "Coffee Beans" },
    { value: "milk",          label: "Milk" },
    { value: "tea",           label: "Tea" },
    { value: "powder",        label: "Powder" },
    { value: "spices",        label: "Spices" },
    { value: "sugar",         label: "Sugar" },
    { value: "puree",         label: "Puree" },
    { value: "syrup",         label: "Syrup" },
    { value: "sauce",         label: "Sauce" },
    { value: "dairy-extras",  label: "Dairy Extras" },
    { value: "halo-snacks",   label: "Halo Snacks" },
    { value: "beverages",     label: "Beverages" },
    { value: "packaging",     label: "Packaging" },
  ];
  const catLabel = v => (INV_CATEGORIES.find(c => c.value === v) || {}).label || v;

  const wrap = el("div", {});
  wrap.appendChild(header("Inventory Items", "Add, edit or remove items tracked in stock."));

  if (canEdit) {
    const addBtn = el("button", { class: "btn secondary", style: { marginBottom: "12px" } }, "➕ Add item");
    addBtn.addEventListener("click", () => {
      openPrompt({
        title: "Add inventory item",
        fields: [
          { key: "name",     label: "Name",     type: "text",   value: "" },
          { key: "unit",     label: "Unit",      type: "select", value: "g",
            options: [{ value: "g", label: "g (grams)" }, { value: "ml", label: "ml (millilitres)" }, { value: "unit", label: "unit (each)" }] },
          { key: "category", label: "Category", type: "select", value: "coffee-beans", options: INV_CATEGORIES },
        ],
        onSubmit: (v) => {
          if (!v.name || !v.name.trim()) return toast("Name is required", "error");
          const nums = (state.items || []).map(it => {
            const m = (it.id || "").match(/^inv_(\d+)$/);
            return m ? parseInt(m[1], 10) : 0;
          });
          const nextNum = (nums.length ? Math.max(...nums) : 0) + 1;
          const id = "inv_" + String(nextNum).padStart(4, "0");
          state.items = state.items || [];
          state.items.push({ id, name: v.name.trim(), unit: v.unit, category: v.category, active: true });
          saveState();
          toast(`Added ${v.name.trim()}`);
          render();
        }
      });
    });
    wrap.appendChild(addBtn);
  }

  const search = el("input", { type: "search", placeholder: "Search items…", style: { marginBottom: "12px" } });
  wrap.appendChild(search);

  const list = el("div", { class: "list" });
  wrap.appendChild(list);

  function draw() {
    list.innerHTML = "";
    const q = search.value.trim().toLowerCase();
    const sorted = [...(state.items || [])].sort((a, b) => a.name.localeCompare(b.name));
    const filtered = sorted.filter(it => !q || it.name.toLowerCase().includes(q) || (it.category || "").includes(q));
    if (!filtered.length) {
      list.appendChild(el("div", { class: "muted", style: { padding: "24px", textAlign: "center" } }, "No items found."));
      return;
    }
    for (const it of filtered) {
      const inactive = it.active === false;
      const rowParts = [
        el("div", { class: "grow" }, [
          el("div", { class: "title" }, it.name),
          el("div", { class: "sub" }, `${catLabel(it.category)} · ${it.unit}`),
        ]),
        el("div", { style: { display: "flex", alignItems: "center", gap: "8px" } }, [
          inactive
            ? el("span", { class: "pill", style: { color: "var(--bad)" } }, "inactive")
            : el("span", { class: "pill", style: { color: "var(--ok)" } }, "active"),
        ]),
      ];
      if (canEdit) {
        const editBtn = el("button", { class: "btn ghost", style: { padding: "4px 10px", fontSize: "12px" } }, "✏️ Edit");
        editBtn.addEventListener("click", (e) => { e.stopPropagation(); editItem(it); });
        rowParts[1].appendChild(editBtn);
      }
      const row = el("div", { class: "row", style: { opacity: inactive ? "0.55" : "1" } }, rowParts);
      list.appendChild(row);
    }
  }

  function editItem(it) {
    openPrompt({
      title: `Edit ${it.name}`,
      fields: [
        { key: "name",     label: "Name",     type: "text",   value: it.name },
        { key: "unit",     label: "Unit",      type: "select", value: it.unit,
          options: [{ value: "g", label: "g (grams)" }, { value: "ml", label: "ml (millilitres)" }, { value: "unit", label: "unit (each)" }] },
        { key: "category", label: "Category", type: "select", value: it.category, options: INV_CATEGORIES },
        { key: "active",   label: "Status",    type: "select", value: it.active === false ? "inactive" : "active",
          options: [{ value: "active", label: "Active" }, { value: "inactive", label: "Inactive (hidden from pickers)" }] },
        { key: "del", label: "Type DELETE to permanently remove this item (owner only)", type: "text", value: "" },
      ],
      onSubmit: (v) => {
        if (String(v.del || "").trim().toUpperCase() === "DELETE") {
          if (u.role !== "owner") return toast("Only the owner can permanently delete items", "error");
          state.items = state.items.filter(x => x.id !== it.id);
          saveState();
          toast(`Removed ${it.name}`);
          render();
          return;
        }
        if (!v.name || !v.name.trim()) return toast("Name is required", "error");
        it.name     = v.name.trim();
        it.unit     = v.unit;
        it.category = v.category;
        it.active   = v.active !== "inactive";
        saveState();
        render();
      }
    });
  }

  search.addEventListener("input", draw);
  draw();

  wrap.appendChild(btnBack());
  return wrap;
};

//     Inventory gets credited with purchase_qty × pack_size (canonical units).
//     Last conversion per item is remembered in state.purchase_units so the
//     next purchase pre-fills it.
//   - "other" — transportation, packaging, card fees… not in the stock count,
//     but still counted in the purchase total so cash/bank ledgers stay honest.
// ==============================================================
routes.purchase_new = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("New purchase", "Log delivery & receipt. Inventory items update stock; Other lines record costs only."));

  state.purchase_units = state.purchase_units || {};

  let branch = u.branches[0];
  let supplier = "";
  let paid_by = "petty_cash";
  let date = new Date().toISOString().slice(0,10);
  let lines = [{
    kind: "inventory",
    inv_item_id: null,
    purchase_unit: "",   // "bottle", "pack", "carton"
    pack_size: 0,        // inventory units per purchase unit (e.g. 850 ml per bottle)
    purchase_qty: 1,     // how many bottles/packs bought
    unit_price: 0,       // EGP per purchase unit (e.g. 40 EGP per bottle)
    note: "",
  }];
  // Receipt photos — initialized once, re-appended on each draw()
  const receiptPhotoField = makePhotoField({ label: "Receipt photo(s)", formLabel: "Purchase Receipt" });

  const branchPicker = makeBranchPicker(u.branches, () => branch, b => { branch = b; draw(); });
  wrap.appendChild(branchPicker);

  const form = el("div", { class: "stack" });
  wrap.appendChild(form);

  // When picking an item, prefill unit + pack size from last saved conversion
  function applyLastConversion(ln) {
    if (!ln.inv_item_id) return;
    const saved = state.purchase_units[ln.inv_item_id];
    if (saved) {
      if (!ln.purchase_unit) ln.purchase_unit = saved.unit_label || "";
      if (!ln.pack_size)     ln.pack_size     = Number(saved.pack_size_canonical) || 0;
      if (!ln.unit_price && saved.last_unit_price) ln.unit_price = Number(saved.last_unit_price) || 0;
    }
  }

  function lineTotal(ln) {
    if (ln.kind === "other") return Number(ln.amount) || 0;
    return (Number(ln.purchase_qty)||0) * (Number(ln.unit_price)||0);
  }
  function lineCanonicalQty(ln) {
    if (ln.kind !== "inventory") return 0;
    return (Number(ln.purchase_qty)||0) * (Number(ln.pack_size)||0);
  }
  function lineCanonicalUnitCost(ln) {
    if (ln.kind !== "inventory") return 0;
    const qty = lineCanonicalQty(ln);
    if (!qty) return 0;
    return lineTotal(ln) / qty;
  }

  function draw() {
    form.innerHTML = "";
    form.appendChild(el("label", {}, "Date"));
    const dInput = el("input", { type:"date", value: date });
    dInput.addEventListener("input", () => date = dInput.value); form.appendChild(dInput);

    form.appendChild(el("label", {}, "Supplier"));
    const sInput = el("input", { type:"text", value: supplier, placeholder: "e.g. Beano's, Juhayna, Ahmad Tea" });
    sInput.addEventListener("input", () => supplier = sInput.value); form.appendChild(sInput);

    form.appendChild(el("label", {}, "Paid by"));
    const paySel = el("select", {},
      [
        ["petty_cash","Petty cash (head barista)"],
        ["owner_bank","Bank transfer (owner)"],
        ["credit_card","Credit card"],
        ["unpaid","Unpaid / credit"],
      ].map(([v,l]) => el("option", { value: v, selected: paid_by===v?"true":null }, l))
    );
    paySel.addEventListener("change", () => { paid_by = paySel.value; draw(); });
    form.appendChild(paySel);

    if (paid_by === "petty_cash") {
      const bal = pettyCashBalance(branch);
      form.appendChild(el("div", { class: "muted small" }, `Current petty cash at ${branch}: ${money(bal)}`));
    }

    // lines
    form.appendChild(el("h2", { style: { marginTop: "12px" } }, "Lines"));
    lines.forEach((ln, idx) => {
      const card = el("div", { class: "card" });
      form.appendChild(card);

      // Line type selector
      card.appendChild(el("label", {}, `Line ${idx+1} — Type`));
      const typeSel = el("select", {}, [
        el("option", { value: "inventory", selected: ln.kind === "inventory" ? "true" : null }, "Inventory item (milk, coffee, etc.)"),
        el("option", { value: "other",     selected: ln.kind === "other"     ? "true" : null }, "Other (transportation, packaging, card fees…)"),
      ]);
      typeSel.addEventListener("change", () => {
        ln.kind = typeSel.value;
        if (ln.kind === "other") { ln.amount = ln.amount || 0; ln.description = ln.description || ""; }
        draw();
      });
      card.appendChild(typeSel);

      if (ln.kind === "inventory") {
        // Item picker
        card.appendChild(el("label", {}, "Item (inventory)"));
        const pick = el("select", {}, [
          el("option", { value: "" }, "— select —"),
          ...state.items.filter(i => i.active).map(i => el("option", {
            value: i.id, selected: ln.inv_item_id===i.id?"true":null
          }, `${i.name} (${i.unit})`))
        ]);
        pick.addEventListener("change", () => {
          ln.inv_item_id = pick.value || null;
          // reset conversion fields; then pre-fill from saved
          ln.purchase_unit = ""; ln.pack_size = 0; ln.unit_price = 0;
          applyLastConversion(ln);
          draw();
        });
        card.appendChild(pick);

        const it = state.items.find(i => i.id === ln.inv_item_id);
        const invUnit = it ? it.unit : "";

        // Conversion box — explain and capture purchase unit + pack size
        if (it) {
          card.appendChild(el("div", { class: "banner-arch", style: { marginTop: "8px" } },
            `You buy this by e.g. bottle, pack, carton. Inventory counts in ${invUnit}. ` +
            `Tell us how many ${invUnit} are in one purchase unit — we'll remember it next time.`));

          card.appendChild(el("label", {}, "Purchase unit (e.g. bottle, pack, carton)"));
          const puInput = el("input", { type: "text", value: ln.purchase_unit || "", placeholder: "bottle" });
          puInput.addEventListener("input", () => { ln.purchase_unit = puInput.value; updateTotal(); });
          card.appendChild(puInput);

          card.appendChild(el("label", {}, `Pack size — ${invUnit} per ${ln.purchase_unit || "purchase unit"} (e.g. 850)`));
          const psInput = el("input", { type: "number", step: "any", value: ln.pack_size || "", placeholder: "850" });
          psInput.addEventListener("input", () => { ln.pack_size = Number(psInput.value) || 0; updateTotal(); });
          card.appendChild(psInput);

          card.appendChild(el("label", {}, `Quantity bought (how many ${ln.purchase_unit || "purchase units"})`));
          const qInput = el("input", { type: "number", step: "any", value: ln.purchase_qty });
          qInput.addEventListener("input", () => { ln.purchase_qty = Number(qInput.value) || 0; updateTotal(); });
          card.appendChild(qInput);

          card.appendChild(el("label", {}, `Price per ${ln.purchase_unit || "purchase unit"} (EGP)`));
          const pInput = el("input", { type: "number", step: "any", value: ln.unit_price });
          pInput.addEventListener("input", () => { ln.unit_price = Number(pInput.value) || 0; updateTotal(); });
          card.appendChild(pInput);

          // Live conversion preview
          const canQty = lineCanonicalQty(ln);
          const canCost = lineCanonicalUnitCost(ln);
          card.appendChild(el("div", { class: "card", style: { marginTop: "8px", background: "var(--bg)" } }, [
            el("div", { class: "muted small" }, "Inventory impact (auto)"),
            el("div", { style: { fontSize: "16px", fontWeight: "700" } },
              `+${canQty || 0} ${invUnit}  ·  ${money(lineTotal(ln))}  ·  ${canCost ? money(canCost) : "—"} / ${invUnit}`),
          ]));
        }

        card.appendChild(el("label", {}, "Note (batch, expiry, ref)"));
        const nInput = el("input", { type: "text", value: ln.note||"", placeholder: "optional" });
        nInput.addEventListener("input", () => ln.note = nInput.value);
        card.appendChild(nInput);
      } else {
        // OTHER line — no inventory impact
        card.appendChild(el("label", {}, "Description (transportation, packaging, card fees, etc.)"));
        const dsc = el("input", { type: "text", value: ln.description || "", placeholder: "e.g. delivery transport" });
        dsc.addEventListener("input", () => { ln.description = dsc.value; });
        card.appendChild(dsc);

        card.appendChild(el("label", {}, "Amount (EGP)"));
        const amtI = el("input", { type: "number", step: "any", value: ln.amount || 0 });
        amtI.addEventListener("input", () => { ln.amount = Number(amtI.value) || 0; updateTotal(); });
        card.appendChild(amtI);

        card.appendChild(el("label", {}, "Note"));
        const nInput = el("input", { type: "text", value: ln.note||"", placeholder: "optional" });
        nInput.addEventListener("input", () => ln.note = nInput.value);
        card.appendChild(nInput);
      }

      if (lines.length > 1) {
        card.appendChild(el("button", { class: "btn ghost", style: { marginTop:"10px" }, onClick: () => { lines.splice(idx,1); draw(); } }, "Remove line"));
      }
    });

    form.appendChild(el("div", { style: { display: "flex", gap: "8px", flexWrap: "wrap" } }, [
      el("button", {
        class: "btn secondary",
        onClick: () => {
          lines.push({ kind: "inventory", inv_item_id: null, purchase_unit: "", pack_size: 0, purchase_qty: 1, unit_price: 0, note: "" });
          draw();
        }
      }, "+ Inventory line"),
      el("button", {
        class: "btn secondary",
        onClick: () => {
          lines.push({ kind: "other", description: "", amount: 0, note: "" });
          draw();
        }
      }, "+ Other (transport, fees…)"),
    ]));

    // photo(s)
    form.appendChild(receiptPhotoField.el);

    // total
    const totalEl = el("div", { class: "card", style: { marginTop: "14px", textAlign: "right" } }, [
      el("div", { class: "muted" }, "Total"), el("div", { style: { fontSize: "24px", fontWeight: "700" } }, money(lines.reduce((s,l)=>s+lineTotal(l),0)))
    ]);
    form.appendChild(totalEl);
    function updateTotal() {
      totalEl.lastChild.textContent = money(lines.reduce((s,l)=>s+lineTotal(l),0));
    }

    form.appendChild(el("div", { class: "sticky-actions" }, [
      el("button", { class: "btn", onClick: submit }, "Submit purchase"),
    ]));
  }
  draw();

  async function submit() {
    if (!supplier) return toast("Enter supplier name", "error");
    for (const ln of lines) {
      if (ln.kind === "inventory") {
        if (!ln.inv_item_id) return toast("Pick an inventory item for every inventory line", "error");
        if (!ln.purchase_qty) return toast("Enter a quantity for every inventory line", "error");
        if (!ln.pack_size)    return toast("Enter the pack size (e.g. ml per bottle) for every inventory line", "error");
      } else {
        if (!ln.description || !ln.description.trim()) return toast("Describe every Other line", "error");
        if (!(Number(ln.amount) > 0)) return toast("Enter an amount for every Other line", "error");
      }
    }

    const s = stamp();
    const total = lines.reduce((s2, l) => s2 + lineTotal(l), 0);
    const rpBlobs = receiptPhotoField.getBlobs();
    const photoNames = rpBlobs.map(f => f.name);
    const photoIds = [];
    for (const pb of rpBlobs) {
      const pid = uuid();
      try { await IDB.put(pid, pb); } catch (e) { console.warn(e); }
      photoIds.push(pid);
    }
    const photoId = photoIds[0] || null;

    const outLines = lines.map(l => {
      if (l.kind === "inventory") {
        const item = state.items.find(i => i.id === l.inv_item_id);
        const canonicalQty = lineCanonicalQty(l);
        const cost = lineTotal(l);
        // remember conversion for next time
        state.purchase_units[l.inv_item_id] = {
          unit_label: l.purchase_unit || "",
          pack_size_canonical: Number(l.pack_size) || 0,
          last_unit_price: Number(l.unit_price) || 0,
          updated_at: s.at,
        };
        return {
          kind: "inventory",
          inv_item_id: l.inv_item_id,
          item_name: item ? item.name : "",
          unit: item ? item.unit : "",
          purchase_unit: l.purchase_unit || "",
          pack_size_canonical: Number(l.pack_size) || 0,
          purchase_qty: Number(l.purchase_qty) || 0,
          unit_price: Number(l.unit_price) || 0,        // EGP per purchase unit
          qty_canonical: canonicalQty,                  // inventory units added (used by inventory / dashboard)
          unit_cost: canonicalQty ? cost / canonicalQty : 0,  // EGP per inventory unit
          line_total: cost,
          note: l.note || "",
        };
      }
      return {
        kind: "other",
        description: l.description || "",
        amount: Number(l.amount) || 0,
        line_total: Number(l.amount) || 0,
        qty_canonical: 0,
        note: l.note || "",
      };
    });

    const purch = {
      id: uuid(), at: s.at, by: s.by, by_name: s.by_name, device: s.device,
      branch, date, supplier, paid_by, total,
      lines: outLines,
      receipt_photo_id: photoId,
      receipt_photo_ids: photoIds,
      receipt_photo_names: photoNames,
      receipt_drive_ids: receiptPhotoField.getDriveIds(),
      image_url: (receiptPhotoField.getCloudUrls().filter(Boolean)[0]) || "",
    };
    state.purchases.push(purch);
    // ledger side-effects
    if (paid_by === "petty_cash") {
      const bal = pettyCashBalance(branch);
      state.petty_cash.push({
        id: uuid(), branch, date, type: "purchase", amount: -total,
        balance_after: bal - total, ref: purch.id,
        by: s.by, by_name: s.by_name, at: s.at, note: `Purchase from ${supplier}`,
      });
    } else if (paid_by === "owner_bank") {
      state.bank_ledger.push({
        id: uuid(), date, amount: -total, supplier, ref: purch.id, type: "purchase_payment",
        by: s.by, by_name: s.by_name, at: s.at, note: `Bank transfer to ${supplier}`,
      });
    } else if (paid_by === "credit_card") {
      state.bank_ledger.push({
        id: uuid(), date, amount: -total, supplier, ref: purch.id, type: "purchase_credit_card",
        by: s.by, by_name: s.by_name, at: s.at, note: `Credit card payment to ${supplier}`,
      });
    }
    saveState();
    const rpNames = receiptPhotoField.getBlobs().map(f => f.name);
    if (rpNames.length) {
      showPhotoConfirm({
        title: "Purchase saved!",
        names: rpNames,
        driveIds: receiptPhotoField.getDriveIds(),
        onDone: () => go("home"),
      });
    } else {
      toast("Purchase saved");
      go("home");
    }
  }
  return wrap;
};

routes.purchase_list = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Purchases", "Tap a row for details."));
  const list = el("div", { class: "list" });
  const rows = state.purchases.filter(p => u.role === "owner" || u.branches.includes(p.branch))
    .sort((a,b) => b.at.localeCompare(a.at)).slice(0, 200);
  for (const p of rows) {
    list.appendChild(el("div", { class: "row", onClick: () => showPurchase(p) }, [
      el("div", { class: "grow" }, [
        el("div", { class: "title" }, `${p.supplier} — ${money(p.total)}`),
        el("div", { class: "sub" }, `${p.branch} · ${p.date} · ${p.lines.length} line(s) · ${p.paid_by}`),
        el("div", { class: "sub" }, `by ${p.by_name} · ${fmtDate(p.at)}`),
      ]),
      el("span", { class: "pill" }, p.paid_by.replace("_"," ")),
    ]));
  }
  if (rows.length === 0) list.appendChild(el("div", { class: "muted" }, "No purchases yet."));
  wrap.appendChild(list);
  wrap.appendChild(btnBack());
  return wrap;
};

async function showPurchase(p) {
  const photo = p.receipt_photo_id ? await IDB.get(p.receipt_photo_id) : null;
  const url = photo ? URL.createObjectURL(photo) : null;
  openSheet(el("div", {}, [
    el("h2", {}, `Purchase — ${p.supplier}`),
    el("div", { class: "muted" }, `${p.branch} · ${p.date} · ${p.paid_by} · ${money(p.total)}`),
    el("div", { class: "hr" }),
    ...p.lines.map(l => {
      // Backward compat: legacy purchase lines had no `kind` — treat them as inventory.
      const k = l.kind || "inventory";
      if (k === "other") {
        return el("div", { class: "kv" }, [
          el("div", { class: "k" }, `Other — ${l.description || "(no description)"}${l.note ? ` · ${l.note}` : ""}`),
          el("div", { class: "v" }, money(l.line_total || l.amount || 0)),
        ]);
      }
      return el("div", { class: "kv" }, [
        el("div", { class: "k" }, `${l.item_name || "—"} (${fmtQty(l.qty_canonical || 0, l.unit || "")})${l.purchase_unit ? ` · ${l.purchase_qty||0} ${l.purchase_unit}` : ""}`),
        el("div", { class: "v" }, money(l.line_total || 0)),
      ]);
    }),
    el("div", { class: "hr" }),

    el("div", { class: "sub muted" }, `Entered by ${p.by_name} at ${fmtDate(p.at)} (device ${p.device?.slice(0,8)||"—"})`),
  ]));
