// ZAWYA sales categories that should always be filtered out on import
// (per coffee-beats-cost-rule: Popcorn, Soft Drinks, Snacks, Merchandise).
const ZAWYA_EXCLUDED_CATEGORIES = [
  "popcorn","pop corn","pop-corn",
  "soft drinks","soft drink","softdrinks","soft-drinks","softdrink","soda","sodas","beverage-soft",
  "snacks","snack",
  "merchandise","merch","retail","retail items","merch items"
];
// Specific item-name patterns that should trigger exclusion regardless of category.
// These are all third-party concession items sold at Zawya that are NOT operated by Coffee Beats.
const ZAWYA_EXCLUDED_ITEM_PATTERNS = [
  // Popcorn (all variants)
  "pop corn","popcorn",
  // Soft drinks / canned beverages
  "v cola","v7 cola","v7 diet","v7 pink","sun top","moussy","red bull",
  "coca cola","pepsi","sprite","fanta","7up","schweppes","freska",
  // Water (Zawya water is a third-party concession; Maadi water is Coffee Beats')
  "water",
  // Confectionery / snacks
  "kitkat","kit kat","bounty","snickers","m&m","galaxy","cookies","cookie",
  // Non-food consumables
  "tissues","tissue",
  // Merchandise / retail
  "tote","socks","t-shirt","tshirt",
];
function isZawyaExcluded(category, item) {
  const c = String(category || "").trim().toLowerCase();
  const n = String(item || "").trim().toLowerCase();
  if (!c && !n) return false;
  for (const ex of ZAWYA_EXCLUDED_CATEGORIES) {
    if (c === ex || c.includes(ex)) return true;
  }
  for (const ex of ZAWYA_EXCLUDED_ITEM_PATTERNS) {
    if (n.includes(ex)) return true;
  }
  return false;
}

// Normalize a date string into ISO yyyy-mm-dd. Handles dd/mm/yyyy, mm/dd/yyyy,
// yyyy-mm-dd, yyyy/mm/dd, dd-mm-yyyy and optional trailing time. Falls back to
// the raw string if we can't parse it.
function normalizeDate(raw) {
  if (!raw) return "";
  const s = String(raw).trim();
  if (!s) return "";
  // already ISO yyyy-mm-dd
  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T].*)?$/);
  if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
  // yyyy/mm/dd
  const isoSlash = s.match(/^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})(?:[ T].*)?$/);
  if (isoSlash) return `${isoSlash[1]}-${String(isoSlash[2]).padStart(2,"0")}-${String(isoSlash[3]).padStart(2,"0")}`;
  // d/m/yyyy or m/d/yyyy (with / - or .) with optional time
  const ambig = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[ T].*)?$/);
  if (ambig) {
    let a = Number(ambig[1]), b = Number(ambig[2]), y = Number(ambig[3]);
    if (y < 100) y += 2000;
    // Heuristic: if one is > 12 it must be the day; otherwise assume day/month (EU default).
    let d, m;
    if (a > 12) { d = a; m = b; }
    else if (b > 12) { d = b; m = a; }
    else { d = a; m = b; } // default day-first
    return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  }
  // fallback: try native Date parse
  const dt = new Date(s);
  if (!isNaN(dt.getTime())) return dt.toISOString().slice(0,10);
  return s;
}

// ----- tiny helpers -----
const $ = (sel, root=document) => root.querySelector(sel);
const el = (tag, props={}, children=[]) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k === "style") Object.assign(n.style, v);
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "html") n.innerHTML = v;
    else if (v !== undefined && v !== null) n.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null || c === false) continue;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return n;
};
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : ("x"+Math.random().toString(36).slice(2)+Date.now()));
const now = () => new Date().toISOString();
const fmtDate = (iso) => {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString([], { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
};
const fmtDay = (iso) => {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString([], { year: "numeric", month: "short", day: "numeric" });
};
const money = (n) => (n == null ? "—" : (Math.round(n*100)/100).toLocaleString("en-EG", { style: "currency", currency: "EGP", minimumFractionDigits: 0 }));
const fmtQty = (n, unit) => {
  if (n == null) return "—";
  const pretty = Math.abs(n) >= 1000 && (unit==="g"||unit==="ml")
    ? `${(n/1000).toFixed(2)} ${unit==="g"?"kg":"L"}`
    : `${Math.round(n*100)/100} ${unit}`;
  return pretty;
};
const toast = (msg, kind="") => {
  const t = el("div", { class: "toast " + kind }, msg);
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), 3200);
};

// Branch tab picker that redraws itself on click (fixes .on class not moving).
// getCurrent() returns the current branch string; onPick(b) updates state + does any
// downstream re-render. The picker itself is rebuilt each click, so the highlight
// always reflects the active branch.
function makeBranchPicker(branches, getCurrent, onPick) {
  const wrap = el("div", { class: "tabs" });
  function repaint() {
    wrap.innerHTML = "";
    const cur = getCurrent();
    branches.forEach(b => {
      wrap.appendChild(el("div", {
        class: "tab" + (b === cur ? " on" : ""),
        onClick: () => { onPick(b); repaint(); }
      }, b[0].toUpperCase() + b.slice(1)));
    });
  }
  repaint();
  return wrap;
}

// IndexedDB for photos
const IDB = (() => {
  let dbP;
  const open = () => dbP ||= new Promise((res, rej) => {
    const r = indexedDB.open("cb_photos", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("photos");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return {
    put: async (id, blob) => { const db = await open(); return new Promise((res,rej)=>{ const tx=db.transaction("photos","readwrite"); tx.objectStore("photos").put(blob,id); tx.oncomplete=()=>res(id); tx.onerror=()=>rej(tx.error); }); },
    get: async (id) => { const db = await open(); return new Promise((res,rej)=>{ const tx=db.transaction("photos","readonly"); const r=tx.objectStore("photos").get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  };
})();

// ─── Cloudinary photo upload (free, no backend needed) ────────
// Uses an "unsigned upload preset" — sign up free at cloudinary.com,
// create an Upload Preset set to "Unsigned", paste cloud name + preset in Settings.
const Cloudinary = (() => {
  const cloudName   = () => (typeof state !== "undefined" && state?.settings?.cloudinary_cloud) || "dbharv4kb";
  const uploadPreset= () => (typeof state !== "undefined" && state?.settings?.cloudinary_preset) || "coffee-beats-ops";
  const isConfigured= () => !!(cloudName() && uploadPreset());

  async function uploadPhoto(blob, filename) {
    if (!isConfigured()) throw new Error("Cloudinary not configured. Add Cloud Name and Upload Preset in Settings → Photo Storage.");
    const form = new FormData();
    form.append("file", blob, filename);
    form.append("upload_preset", uploadPreset());
    form.append("folder", "coffee-beats");
    // Store original filename as a tag so it shows in the gallery
    form.append("context", `original_name=${encodeURIComponent(filename)}`);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName()}/auto/upload`, {
      method: "POST", body: form,
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(`Upload failed: ${err.error?.message || res.status}`);
    }
    const data = await res.json();
    // Returns { secure_url, public_id, created_at, original_filename, bytes }
    return data;
  }

  return { isConfigured, uploadPhoto, cloudName };
})();

// ─── Site access gate ────────────────────────────────────────
// Sits in front of the PIN login. Anyone visiting the URL must enter the
// team access code first. Code is set in Settings (owner only).
// Auth is remembered in localStorage for 7 days.
const Gate = (() => {
  const KEY = "cb_gate_auth";
  const TTL = 7 * 24 * 60 * 60 * 1000; // 7 days in ms

  function isUnlocked() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return false;
      const { ts } = JSON.parse(raw);
      return (Date.now() - ts) < TTL;
    } catch { return false; }
  }

  function unlock() {
    localStorage.setItem(KEY, JSON.stringify({ ts: Date.now() }));
  }

  function lock() {
    localStorage.removeItem(KEY);
  }

  function check(inputCode, correctCode) {
    // Case-insensitive, trim whitespace
    return inputCode.trim().toLowerCase() === (correctCode || "").trim().toLowerCase();
  }

  function show(correctCode, onUnlock) {
    // Remove any existing overlay
    const existing = document.getElementById("gate-overlay");
    if (existing) existing.remove();

    const overlay = document.createElement("div");
    overlay.id = "gate-overlay";

    // Logo
    const logo = document.createElement("img");
    logo.className = "gate-logo";
    logo.src = CB_LOGO_SRC;
    logo.alt = "Coffee Beats";
    overlay.appendChild(logo);

    overlay.appendChild(Object.assign(document.createElement("div"), { className: "gate-title", textContent: "Coffee Beats — Team Portal" }));
    overlay.appendChild(Object.assign(document.createElement("div"), { className: "gate-sub", textContent: "Enter your team access code to continue." }));

    const box = document.createElement("div");
    box.className = "gate-box";

    const inp = document.createElement("input");
    inp.className = "gate-input";
    inp.type = "password";
    inp.placeholder = "• • • • • •";
    inp.autocomplete = "off";
    inp.setAttribute("autocapitalize", "none");
    box.appendChild(inp);

    const err = document.createElement("div");
    err.className = "gate-err";
    box.appendChild(err);

    const btn = document.createElement("button");
    btn.className = "btn";
    btn.style.cssText = "width:100%;font-size:16px;";
    btn.textContent = "Enter";
    box.appendChild(btn);

    overlay.appendChild(box);
    document.body.appendChild(overlay);
    setTimeout(() => inp.focus(), 100);

    function attempt() {
      if (check(inp.value, correctCode)) {
        unlock();
        overlay.style.transition = "opacity .3s";
        overlay.style.opacity = "0";
        setTimeout(() => { overlay.remove(); onUnlock(); }, 300);
      } else {
        err.textContent = "Incorrect code — try again.";
        inp.classList.add("shake");
        inp.value = "";
        setTimeout(() => inp.classList.remove("shake"), 400);
        inp.focus();
      }
    }

    btn.addEventListener("click", attempt);
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") attempt(); });
  }

  return { isUnlocked, unlock, lock, show, check };
})();

  } catch (e) {

// Runs once per load. Safe to re-run — each step is idempotent.
function migrateState(s) {
  s.users = s.users || [];
  const hasName = (n) => s.users.some(u => (u.name || "").toLowerCase() === n.toLowerCase());
  const takenPin = (p) => s.users.some(u => u.pin === p);
  const nextPin = () => { for (let i = 1000; i < 9999; i++) { const p = String(i); if (!takenPin(p)) return p; } return "0000"; };

  // Track seeded user IDs so renames don't trigger re-seeding.
  // We check by PIN (which is stable) in addition to name — if neither the default
  // name NOR the default PIN exists, the slot is genuinely empty and we seed it.
  s._seeded_ids = s._seeded_ids || {};

  // Helper: find a user by stored seeded ID, then by name, then by default PIN.
  function findSeeded(key, defaultName, defaultPin) {
    if (s._seeded_ids[key]) {
      const byId = s.users.find(u => u.id === s._seeded_ids[key]);
      if (byId) return byId;
    }
    const byName = s.users.find(u => (u.name||"").toLowerCase() === defaultName.toLowerCase());
    if (byName) { s._seeded_ids[key] = byName.id; return byName; }
    const byPin  = s.users.find(u => u.pin === defaultPin);
    if (byPin)  { s._seeded_ids[key] = byPin.id;  return byPin;  }
    return null;
  }

  // Seed Khaled + Barista 3 if they don't already exist (for upgrades from older state).
  // Checks by name OR by default PIN so renaming doesn't cause a duplicate to be seeded.
  if (!findSeeded("khaled", "Khaled", "7777")) {
    const u = { id: uuid(), name: "Khaled", role: "barista", pin: takenPin("7777") ? nextPin() : "7777", branches: ["maadi","zawya"], active: true };
    s.users.push(u); s._seeded_ids.khaled = u.id;
  }
  if (!findSeeded("barista3", "Barista 3", "6666")) {
    const u = { id: uuid(), name: "Barista 3", role: "barista", pin: takenPin("6666") ? nextPin() : "6666", branches: ["maadi","zawya"], active: true };
    s.users.push(u); s._seeded_ids.barista3 = u.id;
  }

  // One-time migration: Khaled was mistakenly set to "owner" in earlier builds.
  // Only run once (flag prevents it from fighting any deliberate role change the owner makes).
  if (!s._migration_khaled_role_fixed) {
    const khaledUser = findSeeded("khaled", "Khaled", "7777");
    if (khaledUser && khaledUser.role === "owner") {
      khaledUser.role         = "barista";

      khaledUser.deny_access  = [];
      khaledUser.extra_access = [];

    }
    s._migration_khaled_role_fixed = true;
  }

  // Seed Zawya staff Bakr (helper) & Mohamed (manager) if they don't exist yet.
  // Same PIN-aware check so renames are safe.
  // Both are Zawya-only with no app access but appear in the barista drink allowance list.
  if (!findSeeded("bakr", "Bakr", "8888")) {
    const u = { id: uuid(), name: "Bakr", role: "helper", pin: takenPin("8888") ? nextPin() : "8888", branches: ["zawya"], active: true, deny_access: [] };
    s.users.push(u); s._seeded_ids.bakr = u.id;
  } else {
    const u = findSeeded("bakr", "Bakr", "8888");
    if (u) {
      if (!u.branches.includes("zawya")) u.branches = [...new Set([...u.branches, "zawya"])];
      // Upgrade role to helper (Zawya-only, no app access)
      if (u.role === "barista") { u.role = "helper"; u.deny_access = []; }
    }
  }
  if (!findSeeded("mohamed", "Mohamed", "9876")) {
    const u = { id: uuid(), name: "Mohamed", role: "manager", pin: takenPin("9876") ? nextPin() : "9876", branches: ["zawya"], active: true, deny_access: [] };
    s.users.push(u); s._seeded_ids.mohamed = u.id;
  } else {
    const u = findSeeded("mohamed", "Mohamed", "9876");
    if (u) {
      if (!u.branches.includes("zawya")) u.branches = [...new Set([...u.branches, "zawya"])];
      // Upgrade role to manager (Zawya-only, no app access)
      if (u.role === "barista") { u.role = "manager"; u.deny_access = []; }

  }

  // Ensure handbook_recipes collection exists (seeded with full menu on first run).
  s.handbook_recipes = s.handbook_recipes || null;

  // Ensure new collections exist
  s.salary_config  = s.salary_config  || {};
  s.salary_loans   = s.salary_loans   || [];
  s.salaries       = s.salaries       || [];
  s.overtime_logs  = s.overtime_logs  || [];

  s.purchase_units         = s.purchase_units         || {}; // inv_item_id → { unit_label, pack_size_canonical }
  s.inventory_alerts = s.inventory_alerts || {}; // inv_item_id → { reorder_threshold_days }
  s.alert_log           = s.alert_log || [];
  s.rosters             = s.rosters || []; // weekly shift rosters
  s.roaster_schedules   = s.roaster_schedules || []; // weekly roaster — head barista posts to whole team
  s.shift_closes        = s.shift_closes  || [];
  s.cleaning_logs       = s.cleaning_logs || [];

  if (!s.settings.sync_url) s.settings.sync_url = BOOTSTRAP_SYNC_URL; // backfill on any existing device that never had it

  // Strip items that were removed from the menu (per Haïdi, April 2026):
  // Coffee Type 4 and Spiced Turkish Coffee should no longer appear anywhere.
  const isDead = (name) => {
    const n = String(name || "").toLowerCase();

  };
  s.menu  = (s.menu  || []).filter(m => !isDead(m.name));

  }
}
// `opts.immediate` pushes to Google Sheets right now instead of waiting for the
// 2.5s debounce — use it for any write the user expects to see reflected on the
// sheet immediately (overhead presets, user-role edits, etc.).
function saveState(opts) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  markDirty();
  if (opts && opts.immediate) {
    clearTimeout(syncTimer);
    doSync();
  } else {
    queueSync();
  }
}

// ----- sync -----
// Google Sheets is the single source of truth. The app keeps a local cache
// (localStorage) but every write is pushed to Sheets, and a "dirty" flag is
// kept so auto-pull can't clobber unsynced edits.
let syncTimer = null;
let syncInFlight = false;
let pendingWrites = 0; // count of local edits not yet pushed
const SYNC_DIRTY_KEY = "cb_ops_sync_dirty_v1";

function markDirty() {
  pendingWrites++;
  try { localStorage.setItem(SYNC_DIRTY_KEY, String(pendingWrites)); } catch(e) {}
  updateSyncBadge("syncing");
}
function markClean() {
  pendingWrites = 0;
  try { localStorage.setItem(SYNC_DIRTY_KEY, "0"); } catch(e) {}
  updateSyncBadge("synced");
}
function hasPending() {
  if (pendingWrites > 0) return true;
  try { return Number(localStorage.getItem(SYNC_DIRTY_KEY) || 0) > 0; } catch(e) { return false; }
}
// Restore pendingWrites from localStorage (in case the tab was closed mid-sync)
try { pendingWrites = Number(localStorage.getItem(SYNC_DIRTY_KEY) || 0); } catch(e) {}

// Small corner badge so the user can see whether their edits are safe on the sheet.
function updateSyncBadge(status) {
  let badge = document.getElementById("syncBadge");
  if (!badge) {
    badge = document.createElement("div");
    badge.id = "syncBadge";
    badge.style.cssText = "position:fixed;bottom:10px;right:10px;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:600;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.15);font-family:system-ui,sans-serif;pointer-events:none;";
    document.body.appendChild(badge);
  }
  if (!state?.settings?.sync_url) {
    badge.style.display = "none";
    return;
  }
  badge.style.display = "";
  if (status === "syncing") { badge.textContent = "⟳ Syncing…"; badge.style.background = "#fef3c7"; badge.style.color = "#92400e"; }
  else if (status === "synced") { badge.textContent = "✓ Synced to Sheet"; badge.style.background = "#d1fae5"; badge.style.color = "#065f46"; }
  else if (status === "error")  { badge.textContent = "⚠ Sync failed"; badge.style.background = "#fee2e2"; badge.style.color = "#991b1b"; }
}

function queueSync() {
  if (!state?.settings?.sync_url) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(doSync, 2500);
}
async function doSync() {
  if (!state?.settings?.sync_url) return;
  if (syncInFlight) return; // let the in-flight push drain; pendingWrites will trigger another
  syncInFlight = true;
  const batchSize = pendingWrites;
  updateSyncBadge("syncing");
  try {
    const payload = {
      secret: state.settings.sync_secret || "",
      device: deviceId,
      at: now(),
      state: {
        users: state.users,
        items: state.items,
        snapshots: state.snapshots,
        waste: state.waste,
        purchases: state.purchases,
        petty_cash: state.petty_cash,
        bank_ledger: state.bank_ledger,
        sales: state.sales,
        shifts: state.shifts,
        menu: state.menu,
        salary_config: state.salary_config,
        salary_loans: state.salary_loans,
        penalties: state.penalties,
        deleted_penalties: state.deleted_penalties,
        overheads: state.overheads,
        overhead_presets: state.overhead_presets,
        overhead_monthly_amts: state.overhead_monthly_amts,
        rosters: state.rosters,
        roaster_schedules: state.roaster_schedules,
        maadi_deposits: state.maadi_deposits,
      },
    };
    await fetch(state.settings.sync_url, {
      method: "POST",
      mode: "no-cors",        // Apps Script returns opaque; that's fine
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
    state.settings.last_sync = now();
    // only mark clean if no NEW writes landed while the push was in flight
    pendingWrites = Math.max(0, pendingWrites - batchSize);
    try { localStorage.setItem(SYNC_DIRTY_KEY, String(pendingWrites)); } catch(e) {}
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (pendingWrites === 0) updateSyncBadge("synced");
    else { updateSyncBadge("syncing"); queueSync(); }
  } catch (e) {
    console.warn("sync failed", e);
    updateSyncBadge("error");
    // leave pendingWrites as-is so the next save retries
  } finally {
    syncInFlight = false;
  }
}

// Pull full state from Google Sheets (makes Sheets the single source of truth)
async function pullFromSheets() {
  const url = state?.settings?.sync_url;
  if (!url) return { ok: false, err: "No sync URL configured" };
  try {
    // Append ?action=pull&secret=... to the Apps Script URL
    const pullUrl = url + (url.includes("?") ? "&" : "?") + "action=pull&secret=" + encodeURIComponent(state.settings.sync_secret || "");
    const res = await fetch(pullUrl);
    if (!res.ok) return { ok: false, err: `HTTP ${res.status}` };
    const data = await res.json();
    if (!data.ok) return { ok: false, err: data.err || "Unknown error" };
    const remote = data.state;
    if (!remote) return { ok: false, err: "No state in response" };
    // Merge: overwrite local with remote for all data keys, keep settings/session local
    const settingsBak = state.settings;
    const sessionBak  = state.session;
    Object.assign(state, remote);
    // Re-run migrations so corrections (e.g. Khaled = barista, overhead_monthly_amts init)
    // survive a pull — Google Sheets is source of truth but migrations always win.
    migrateState(state);
    state.settings = { ...remote.settings, ...settingsBak }; // keep local URL/secret
    state.session  = sessionBak;
    state.settings.last_pull = now();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    // Push the corrected/migrated state back to Sheets so the sheet stays in sync
    // with any role fixes or data migrations we just applied.
    if (state.settings?.sync_url) doSync();
    return { ok: true };
  } catch (e) {
    return { ok: false, err: String(e) };
  }
}

// Auto-pull on start if sync URL is configured.
// Google Sheets is the source of truth — BUT if this device has unsynced local
// edits (the tab was closed before the last push completed), flush them to the
// sheet first so they aren't clobbered by the pull.
async function autoPullOnStart() {
  if (!state?.settings?.sync_url) {
    updateSyncBadge("synced"); // hidden when sync isn't configured
    return;
  }
  if (hasPending()) {
    console.log("Flushing pending local writes to Sheets before pull…");
    await doSync();
  }
  const result = await pullFromSheets();
  if (result.ok) {
    markClean();
    console.log("Auto-pulled from Google Sheets on start");
    render();
  } else {
    console.warn("Auto-pull failed:", result.err);
    updateSyncBadge(hasPending() ? "error" : "synced");
  }
}

  state.session = user ? { user_id: user.id, login_at: now() } : null;

// ----- inactivity auto-logout (10 minutes) -----
const IDLE_TIMEOUT_MS = 10 * 60 * 1000; // 10 min
let _idleTimer = null;
let _idleWarnTimer = null;
let _idleBanner = null;

function startIdleTimer() {
  stopIdleTimer();
  // Show a 60-second warning banner before logging out
  _idleWarnTimer = setTimeout(() => {
    if (!state.session) return;
    if (_idleBanner) return;
    _idleBanner = document.createElement("div");
    _idleBanner.id = "idle-banner";
    _idleBanner.style.cssText = "position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:999;background:#2b1810;color:#f5e6d0;padding:14px 20px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.35);display:flex;gap:14px;align-items:center;";
    _idleBanner.innerHTML = `<span>⏱ You'll be signed out in <b id="idle-countdown">60</b>s due to inactivity.</span><button onclick="startIdleTimer()" style="background:var(--accent,#EFBBA3);color:#2b1810;border:0;border-radius:8px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;">Stay signed in</button>`;
    document.body.appendChild(_idleBanner);
    let secs = 60;
    const tick = setInterval(() => {
      secs--;
      const el = document.getElementById("idle-countdown");
      if (el) el.textContent = String(secs);
      if (secs <= 0) clearInterval(tick);
    }, 1000);
  }, IDLE_TIMEOUT_MS - 60000);

  _idleTimer = setTimeout(() => {
    if (!state.session) return;
    if (_idleBanner) { _idleBanner.remove(); _idleBanner = null; }
    setSession(null);
    // Show a brief notice on the login screen

// ----- running stock (computed) -----
function computeStock(branch) {
  // start from latest snapshot
  const snaps = state.snapshots.slice().sort((a,b) => a.created_at.localeCompare(b.created_at));
  const last = snaps[snaps.length - 1];
  const stock = {};
  for (const it of state.items) stock[it.id] = 0;
  if (last) for (const e of last.entries) if (e.branch === branch) stock[e.item_id] = Number(e.qty) || 0;
  const tsAfter = last ? last.created_at : "0000";
  // apply purchases & waste recorded AFTER the snapshot
  for (const p of state.purchases) {
    if (p.branch !== branch) continue;
    if (p.at <= tsAfter) continue;
    for (const ln of p.lines) {
      if (ln.inv_item_id && stock[ln.inv_item_id] != null) {
        stock[ln.inv_item_id] += Number(ln.qty_canonical) || 0;
      }
    }
  }
  for (const w of state.waste) {
    if (w.branch !== branch) continue;
    if (w.at <= tsAfter) continue;
    if (w.inv_item_id && stock[w.inv_item_id] != null) {
      stock[w.inv_item_id] -= Number(w.qty_canonical) || 0;
    }
  }
  return stock;
}

// ---------------- Predictive inventory consumption ----------------
// Uses the last two snapshots for the given branch. Between them, the change in
// stock should equal (purchases + positive adjustments) − (waste + sales usage).
// We don't know sales usage directly, so we infer it from the snapshot drop:
//
//   usage_per_day = (prev_stock + purchases_between − next_stock) / days_between
//
// This treats everything that disappeared (sales + unlogged breakage) as usage.
// Less noisy than waste-only, and matches what the barista actually needs to
// re-order. Returns 0 if we can't estimate (fewer than 2 snapshots, same day,
// or no data for this item).
function branchSnapshotEntries(snap, branch, itemId) {
  if (!snap) return null;
  const entry = snap.entries.find(e => e.branch === branch && e.item_id === itemId);
  return entry ? Number(entry.qty) || 0 : null;
}
function computeDailyUsage(itemId, branch) {
  const snaps = state.snapshots.slice().sort((a,b) => a.created_at.localeCompare(b.created_at));
  // find the last two snapshots that have an entry for this branch+item
  const relevant = snaps.filter(s => branchSnapshotEntries(s, branch, itemId) !== null);
  if (relevant.length < 2) return 0;
  const prev = relevant[relevant.length - 2];
  const curr = relevant[relevant.length - 1];
  const prevQty = branchSnapshotEntries(prev, branch, itemId);
  const currQty = branchSnapshotEntries(curr, branch, itemId);
  const msPerDay = 24 * 60 * 60 * 1000;
  const days = Math.max(1, (new Date(curr.created_at) - new Date(prev.created_at)) / msPerDay);
  // Purchases in the window that added this item to this branch
  let purchased = 0;
  for (const p of state.purchases) {
    if (p.branch !== branch) continue;
    if (p.at <= prev.created_at || p.at > curr.created_at) continue;
    for (const ln of p.lines) {
      if (ln.inv_item_id === itemId) purchased += Number(ln.qty_canonical) || 0;
    }
  }
  const consumed = prevQty + purchased - currQty;
  if (consumed <= 0) return 0;
  return consumed / days;
}
function daysOfCover(itemId, branch) {
  const stock = computeStock(branch)[itemId] || 0;
  const usage = computeDailyUsage(itemId, branch);
  if (usage <= 0) return Infinity;
  return stock / usage;
}
// Returns [{ item, branch, stock, daily_usage, days_of_cover, threshold_days }]
// for every item that's under its per-item reorder-days threshold.
// Default threshold = 7 days if none set. Items with no usage data are skipped.
function lowStockItems(branch) {
  const out = [];
  const stocks = computeStock(branch);
  for (const it of state.items) {
    if (!it.active) continue;
    const cfg = (state.inventory_alerts || {})[it.id] || {};
    const threshold = Number(cfg.reorder_threshold_days) > 0
      ? Number(cfg.reorder_threshold_days)
      : 7;
    const usage = computeDailyUsage(it.id, branch);
    if (usage <= 0) continue; // no prediction possible yet
    const stock = stocks[it.id] || 0;
    const cover = stock / usage;
    if (cover < threshold) {
      out.push({ item: it, branch, stock, daily_usage: usage, days_of_cover: cover, threshold_days: threshold });
    }
  }
  out.sort((a,b) => a.days_of_cover - b.days_of_cover);
  return out;
}
// Fire browser notifications for any item that is newly low (not already in alert_log
// for today). Also writes to state.alert_log.
function scanAndNotifyLowStock() {
  const branches = ["maadi","zawya"];
  const today = new Date().toISOString().slice(0,10);
  state.alert_log = state.alert_log || [];
  for (const b of branches) {
    const rows = lowStockItems(b);
    for (const r of rows) {
      const key = `${today}|${b}|${r.item.id}`;
      if (state.alert_log.some(a => a.key === key)) continue;
      state.alert_log.push({
        key, date: today, branch: b, item_id: r.item.id, item_name: r.item.name,
        stock: r.stock, days_of_cover: r.days_of_cover, threshold_days: r.threshold_days,
        at: new Date().toISOString(),
      });
      notifyHaidi(
        `Low stock — ${r.item.name} (${b})`,
        `~${r.days_of_cover.toFixed(1)}d cover left (threshold ${r.threshold_days}d). ${fmtQty(r.stock, r.item.unit)} on hand.`
      );
    }
  }
  saveState();
}

function pettyCashBalance(branch) {
  const rows = state.petty_cash.filter(p => p.branch === branch)
    .sort((a,b) => a.at.localeCompare(b.at));
  const last = rows[rows.length - 1];
  return last ? Number(last.balance_after) || 0 : 0;
}

let route = { name: "login", params: {} };
function go(name, params={}) {
  // Enforce role access at navigation time
  const u = currentUser();
  if (u && !canAccess(name, u)) {
    toast("You don't have access to that section.");
    route = { name: "home", params: {} };
    render();
    return;
  }
  route = { name, params }; render();
}

// ----- role access policy -----
// Barista: inventory count + record waste + record purchases only
// Head barista: all barista + salaries + penalties + Maadi deposits + petty cash + bank ledger
// Accountant: full read access + petty cash (view), salaries, penalties, overheads, dashboard, bank, sales import, menu
// Owner: full access
const ROLE_ACCESS = {
  owner: "*",         // full access
  accountant: "*",    // full access (per Haïdi: "Accountant and owner have all access rights")
  // Per Haïdi: head barista = all barista + salaries + penalties + Maadi deposits + petty cash + roster (edit)
  head_barista: ["home","shifts","snapshot_new","waste_new","waste_list","purchase_new","purchase_list",
                 "petty_cash","salaries","penalties","maadi_deposits","roster",
                 "shift_close_new","shift_close_list","cleaning_log_new","cleaning_log_list",
                 "signin_stamp_new","signin_stamp_list",
                 "leave_new","leave_list"],
  // Per Haïdi: barista = only waste log, weekly schedule (read), barista handbook, shift close, sign-in stamp, cleaning log, leave requests
  barista: ["home","waste_new","roster","handbook","shift_close_new","signin_stamp_new","cleaning_log_new","leave_new","leave_list"],
  // Zawya-only roles — no app access, kept in list for barista drink allowance tracking
  manager: [],
  helper:  [],
};
function canAccess(routeName, u) {
  if (!u) return false;
  if (routeName === "login" || routeName === "home") return true;
  // Per-user denylist (revokes default role access) — edited by the owner
  // in the Users screen. Lets Haïdi take something away from a specific person
  // even if their role normally has it.
  if (Array.isArray(u.deny_access) && u.deny_access.includes(routeName)) return false;
  // Per-user allowlist adds to role grants
  if (Array.isArray(u.extra_access) && u.extra_access.includes(routeName)) return true;
  const allow = ROLE_ACCESS[u.role];
  if (allow === "*") return true;
  if (!Array.isArray(allow)) return false;
  return allow.includes(routeName);
}

// ----- root render -----
function render() {
  const root = $("#app");
  root.innerHTML = "";
  if (!state.session) { stopIdleTimer(); root.appendChild(loginView()); return; }
  const u = currentUser();
  if (!u || !u.active) { setSession(null); return; }
  // Guard direct-access to restricted routes
  if (!canAccess(route.name, u)) {
    route = { name: "home", params: {} };
  }
  root.appendChild(topbar(u));
  const main = el("main", {});
  root.appendChild(main);
  const viewResult = (routes[route.name] || routes.home)(u, route.params);
  // Some routes (e.g. handbook) are async — handle both Promise and direct DOM node.
  if (viewResult && typeof viewResult.then === "function") {
    viewResult.then(node => { if (node) main.appendChild(node); });
  } else {
    main.appendChild(viewResult);
  }
}

  let branch = u.branches[0];
  let itemId = null;

  // ── No-waste quick-log ──────────────────────────────────────────
  const noWasteCard = el("div", { class: "card", style: { marginBottom: "14px", background: "var(--surface-2)", border: "1.5px dashed var(--border)" } }, [
    el("div", { class: "muted small", style: { marginBottom: "8px" } }, "No waste to report this shift? Tap below to log a clear shift — this still counts as your required daily entry."),
    el("button", {
      class: "btn secondary",
      onClick: () => {
        const s = stamp();
        state.waste.push({
          id: uuid(), at: s.at, by: s.by, by_name: s.by_name, device: s.device,
          branch,
          inv_item_id: null, item_name: "— No waste —", unit: "",
          qty_canonical: 0,
          reason: "No waste", note: "Barista confirmed: no waste this shift.",
        });
        saveState();
        toast("✓ Clear shift logged — no waste recorded");
        go("waste_list");
      },
    }, "✓ No waste this shift"),
  ]);
  wrap.appendChild(noWasteCard);
  let qty = 0;
  let reason = "Spilled";
  let note = "";

  const branchPicker = makeBranchPicker(u.branches, () => branch, b => { branch = b; update(); });
  wrap.appendChild(branchPicker);

  const search = el("input", { type: "search", placeholder: "Search item (milk, coffee, caramel…)" });
  wrap.appendChild(el("div", { class: "search" }, [search]));

  const pickBox = el("div", { class: "list" });
  wrap.appendChild(pickBox);

  const bottom = el("div", { class: "card", style: { marginTop: "14px" } });
  wrap.appendChild(bottom);

  function update() {
    pickBox.innerHTML = "";
    const q = search.value.trim().toLowerCase();
    const stock = computeStock(branch);
    const list = state.items.filter(i => i.active && (q === "" || i.name.toLowerCase().includes(q)));
    list.slice(0, 50).forEach(it => {
      const row = el("div", {
        class: "row",
        style: { cursor: "pointer", outline: itemId === it.id ? "2px solid var(--accent)" : "none" },
        onClick: () => { itemId = it.id; update(); },
      }, [
        el("div", { class: "grow" }, [
          el("div", { class: "title" }, it.name),
          el("div", { class: "sub" }, it.category || "—"),
        ]),
        el("div", { class: "qty" }, `${fmtQty(stock[it.id]||0, it.unit)}`),
      ]);
      pickBox.appendChild(row);
    });

    bottom.innerHTML = "";
    if (!itemId) {
      bottom.appendChild(el("div", { class: "muted" }, "Pick an item above."));
      return;
    }
    const it = state.items.find(x => x.id === itemId);
    bottom.appendChild(el("h2", {}, `${it.name}  ·  current ${fmtQty(stock[itemId]||0, it.unit)}`));

    bottom.appendChild(el("label", {}, `Qty (${it.unit})`));
    const qtyInput = el("input", { type: "number", min: "0", step: "any", value: qty || "" });
    qtyInput.addEventListener("input", () => qty = Number(qtyInput.value) || 0);
    const stepper = el("div", { class: "qty-stepper" }, [
      el("button", { onClick: () => { qty = Math.max(0, (Number(qtyInput.value)||0) - (it.unit==="unit"?1:10)); qtyInput.value = qty; } }, "−"),
      qtyInput,
      el("button", { onClick: () => { qty = (Number(qtyInput.value)||0) + (it.unit==="unit"?1:10); qtyInput.value = qty; } }, "+"),
    ]);
    bottom.appendChild(stepper);

    bottom.appendChild(el("label", {}, "Reason"));
    const reasonSel = el("select", {}, ["Spilled","Expired","Returned by customer","Staff drink (comp)","Quality issue","Training / calibration","Other"].map(r => el("option", { value: r, selected: r===reason ? "true" : null }, r)));
    reasonSel.addEventListener("change", () => reason = reasonSel.value);
    bottom.appendChild(reasonSel);

    bottom.appendChild(el("label", {}, "Note (optional)"));
    const noteInput = el("input", { type: "text", value: note, placeholder: "e.g. dropped pitcher" });
    noteInput.addEventListener("input", () => note = noteInput.value);
    bottom.appendChild(noteInput);

    bottom.appendChild(el("div", { class: "sticky-actions" }, [
      el("button", { class: "btn", onClick: submit }, "Submit waste entry"),
      el("div", { class: "small muted", style: { marginTop: "6px", textAlign: "center" } }, `Will reduce ${it.name} at ${branch} by ${qty || 0} ${it.unit}.`),
    ]));
  }
  // ── Photo evidence (multi-image, auto-uploads to Cloudinary) ──
  const wastePhotoField = makePhotoField({ label: "Evidence photo(s)", multiple: true, formLabel: "Record Waste" });
  wrap.appendChild(wastePhotoField.el);

  search.addEventListener("input", update);
  update();

  function submit() {
    const it = state.items.find(x => x.id === itemId);
    if (!it || !qty || qty <= 0) { toast("Pick an item and qty > 0", "error"); return; }
    const s = stamp();
    const photoUrls = wastePhotoField.getCloudUrls().filter(Boolean);
    state.waste.push({
      id: uuid(), at: s.at, by: s.by, by_name: s.by_name, device: s.device,
      branch,
      inv_item_id: itemId, item_name: it.name, unit: it.unit,
      qty_canonical: qty,
      reason, note,
      photos: photoUrls,
      image_url: photoUrls[0] || "",
    });
    saveState();
    const photoMsg = photoUrls.length ? ` · ${photoUrls.length} photo${photoUrls.length > 1 ? "s" : ""} saved` : "";
    toast("Waste recorded" + photoMsg);
    go("waste_list");
  }

  return wrap;
};

routes.shift_close_new = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Shift Close", "Fill in every field before you leave. This is your end-of-shift report."));

  let branch   = u.branches[0];
  let date     = new Date().toISOString().slice(0,10);
  let cash     = "";
  let instapay = "";
  let cc       = "";
  let talabat_credit = "";
  let talabat_cash   = "";

  // Barista allowance drinks — dynamic rows [{who, drink}]
  // Returns all active baristas/head-baristas assigned to the current branch.
  function getBaristaList() {
    return state.users
      .filter(x => x.active && (x.role === "barista" || x.role === "head_barista" || x.role === "manager" || x.role === "helper") && x.branches.includes(branch))
      .map(x => x.name);
  }
  let baristaAllowanceDrinks = [{ who: "", drink: "" }];

  // Extra money notes (e.g. unexpected cash/visa surplus)
  let extraMoneyNotes = "";

  // Closing barista name
  let closingBarista = "";

  // Cinema hospitality free drinks — count + note
  let cinemaFreeCount = "";
  let cinemaFreeNote  = "";

  // Management drinks — dynamic rows [{who, drink}]
  const MANAGERS = ["Haïdi", "Luke", "Youssef"];
  let mgmtDrinks = [{ who: "Haïdi", drink: "" }];

  // Discount receipt photos — managed by makePhotoField
  let discountPhotoField = null;

  const branchPicker = makeBranchPicker(u.branches, () => branch, b => { branch = b; drawBaristaAllowance(); });
  wrap.appendChild(branchPicker);

  const form = el("div", { class: "stack" });
  wrap.appendChild(form);

  function mkInput(type, value, onchange, placeholder) {
    const inp = el("input", { type, value: value || "", placeholder: placeholder || "" });
    inp.addEventListener("input", () => onchange(inp.value));
    return inp;
  }

  function drawMgmt() {
    mgmtBox.innerHTML = "";
    mgmtDrinks.forEach((row, idx) => {
      const rowEl = el("div", { style: { display: "flex", gap: "8px", marginTop: "8px", alignItems: "center" } }, [
        (() => {
          const sel = el("select", { style: { flex: "0 0 auto", width: "120px" } },
            MANAGERS.map(m => el("option", { value: m, selected: m === row.who ? "true" : null }, m)));
          sel.addEventListener("change", () => { row.who = sel.value; });
          return sel;
        })(),
        (() => {
          const inp = el("input", { type: "text", placeholder: "Drink name", value: row.drink, style: { flex: "1" } });
          inp.addEventListener("input", () => { row.drink = inp.value; });
          return inp;
        })(),
        el("button", { class: "btn ghost", style: { width: "auto", padding: "8px 12px" }, onClick: () => { mgmtDrinks.splice(idx, 1); drawMgmt(); } }, "✕"),
      ]);
      mgmtBox.appendChild(rowEl);
    });
  }
  const mgmtBox = el("div", {});

  function drawBaristaAllowance() {
    baristaAllowanceBox.innerHTML = "";
    baristaAllowanceDrinks.forEach((row, idx) => {
      const rowEl = el("div", { style: { display: "flex", gap: "8px", marginTop: "8px", alignItems: "center" } }, [
        (() => {
          const sel = el("select", { style: { flex: "0 0 auto", width: "130px" } },
            [el("option", { value: "" }, "— who? —"),
             ...getBaristaList().map(b => el("option", { value: b, selected: b === row.who ? "true" : null }, b))]);
          sel.addEventListener("change", () => { row.who = sel.value; });
          return sel;
        })(),
        (() => {
          const inp = el("input", { type: "text", placeholder: "Drink name", value: row.drink, style: { flex: "1" } });
          inp.addEventListener("input", () => { row.drink = inp.value; });
          return inp;
        })(),
        el("button", { class: "btn ghost", style: { width: "auto", padding: "8px 12px" }, onClick: () => { baristaAllowanceDrinks.splice(idx, 1); drawBaristaAllowance(); } }, "✕"),
      ]);
      baristaAllowanceBox.appendChild(rowEl);
    });
  }
  const baristaAllowanceBox = el("div", {});

  function draw() {
    form.innerHTML = "";

    form.appendChild(el("label", {}, "Date"));
    const dInput = el("input", { type: "date", value: date });
    dInput.addEventListener("input", () => date = dInput.value);
    form.appendChild(dInput);

    form.appendChild(el("label", {}, "Closing barista"));
    const cbSel = el("select", {},
      [el("option", { value: "" }, "— select barista —"),
       ...getBaristaList().map(b => el("option", { value: b, selected: b === closingBarista ? "true" : null }, b))]);
    cbSel.addEventListener("change", () => { closingBarista = cbSel.value; });
    form.appendChild(cbSel);

    // ── Cash & digital payments ──
    form.appendChild(el("h2", { style: { marginTop: "14px" } }, "Payments received"));
    form.appendChild(el("label", {}, "Cash (EGP)"));
    form.appendChild(mkInput("number", cash, v => cash = v, "0.00"));
    form.appendChild(el("label", {}, "Instapay (EGP)"));
    form.appendChild(mkInput("number", instapay, v => instapay = v, "0.00"));
    form.appendChild(el("label", {}, "Customer credit card (EGP)"));
    form.appendChild(mkInput("number", cc, v => cc = v, "0.00"));
    form.appendChild(el("label", {}, "Talabat — credit"));
    form.appendChild(mkInput("number", talabat_credit, v => talabat_credit = v, "0.00"));
    form.appendChild(el("label", {}, "Talabat — cash"));
    form.appendChild(mkInput("number", talabat_cash, v => talabat_cash = v, "0.00"));

    const totalShift = (Number(cash)||0) + (Number(instapay)||0) + (Number(cc)||0) + (Number(talabat_credit)||0) + (Number(talabat_cash)||0);
    form.appendChild(el("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: "10px", padding: "10px 12px", background: "var(--surface2, #f5f5f5)", borderRadius: "8px", fontWeight: "600" } }, [
      el("span", {}, "Total shift payments"),
      el("span", { class: "pill" }, `EGP ${totalShift.toFixed(2)}`),
    ]));

    form.appendChild(el("label", { style: { marginTop: "10px" } }, "Extra money — notes (visa or cash surplus/discrepancy)"));
    const emInp = el("textarea", { placeholder: "e.g. Visa machine had EGP 50 extra · Cash drawer over by EGP 20", rows: "2", style: { resize: "vertical" } }, extraMoneyNotes);
    emInp.addEventListener("input", () => extraMoneyNotes = emInp.value);
    form.appendChild(emInp);

    // ── Complimentary drinks ──
    form.appendChild(el("h2", { style: { marginTop: "14px" } }, "Complimentary drinks"));

    form.appendChild(el("div", { class: "muted small" }, "Log each drink per barista — who had what."));
    form.appendChild(baristaAllowanceBox);
    drawBaristaAllowance();
    form.appendChild(el("button", {
      class: "btn ghost",
      style: { marginTop: "8px" },
      onClick: () => { baristaAllowanceDrinks.push({ who: "", drink: "" }); drawBaristaAllowance(); },
    }, "+ Add barista drink"));

    form.appendChild(el("label", {}, "Cinema hospitality — number of free drinks"));
    form.appendChild(mkInput("number", cinemaFreeCount, v => cinemaFreeCount = v, "0"));
    form.appendChild(el("label", {}, "Cinema hospitality — note (optional)"));
    form.appendChild(mkInput("text", cinemaFreeNote, v => cinemaFreeNote = v, "e.g. Screening room, group of 8"));

    // ── Management drinks ──
    form.appendChild(el("h2", { style: { marginTop: "14px" } }, "Management drinks"));
    form.appendChild(el("div", { class: "muted small" }, "Log each drink consumed by Haïdi, Luke, or Youssef — who had what."));
    form.appendChild(mgmtBox);
    drawMgmt();
    form.appendChild(el("button", {
      class: "btn ghost",
      style: { marginTop: "8px" },
      onClick: () => { mgmtDrinks.push({ who: "Haïdi", drink: "" }); drawMgmt(); },
    }, "+ Add management drink"));

    // ── Discount receipts ──
    discountPhotoField = makePhotoField({ label: "Discounts — signed receipt photo(s)", formLabel: "Shift Close" });
    form.appendChild(discountPhotoField.el);

    form.appendChild(el("div", { class: "sticky-actions" }, [
      el("button", { class: "btn", onClick: () => submit() }, "Submit shift close"),
      el("button", { class: "btn ghost", style: { marginTop: "8px" }, onClick: () => go("home") }, "← Back to home"),
    ]));
  }
  draw();

  function submit() {
    if (!date) return toast("Pick a date", "error");
    if (cash === "" && instapay === "" && cc === "" && talabat_credit === "" && talabat_cash === "")
      return toast("Enter at least one payment amount", "error");

    const s = stamp();
    const doSave = async () => {
      const dpBlobs = discountPhotoField ? discountPhotoField.getBlobs() : [];
      const dpNames = dpBlobs.map(f => f.name);
      const discountPhotoIds = [];
      for (const pb of dpBlobs) {
        const pid = uuid();
        try { await IDB.put(pid, pb); } catch (e) { console.warn(e); }
        discountPhotoIds.push(pid);
      }
      const photoId = discountPhotoIds[0] || null;
      state.shift_closes.push({
        id: uuid(), at: s.at, by: s.by, by_name: s.by_name, device: s.device,
        branch, date,
        closing_barista: closingBarista,
        cash:            Number(cash)           || 0,
        instapay:        Number(instapay)       || 0,
        cc:              Number(cc)             || 0,
        talabat_credit:  Number(talabat_credit) || 0,
        talabat_cash:    Number(talabat_cash)   || 0,
        extra_money_notes: extraMoneyNotes.trim(),
        barista_allowance_drinks: baristaAllowanceDrinks.filter(r => r.drink.trim()),
        cinema_free_count: Number(cinemaFreeCount) || 0,
        cinema_free_note:  cinemaFreeNote.trim(),
        mgmt_drinks: mgmtDrinks.filter(r => r.drink.trim()),
        discount_photo_id: photoId,
        discount_photo_ids: discountPhotoIds,
        discount_photo_names: dpNames,
        discount_drive_ids: discountPhotoField ? discountPhotoField.getDriveIds() : [],
      });
      saveState();
      if (dpNames.length) {
        showPhotoConfirm({
          title: "Shift close submitted!",
          names: dpNames,
          driveIds: discountPhotoField ? discountPhotoField.getDriveIds() : [],
          onDone: () => go("shift_close_list"),
        });
      } else {
        toast("Shift close submitted ✓");
        go("shift_close_list");
      }
    };
    doSave();
  }

  return wrap;
};

routes.snapshot_new = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Monthly inventory count", "Count every item. We pre-fill the last counted value. Submit when done."));
  let branch = u.branches[0];
  let asOf = new Date().toISOString().slice(0,10);
  const branchPicker = makeBranchPicker(u.branches, () => branch, b => { branch = b; draw(); });
  wrap.appendChild(branchPicker);

  const dateLab = el("div", {}, [
    el("label", {}, "As of date"),
    (() => { const i = el("input", { type:"date", value: asOf }); i.addEventListener("input", () => asOf = i.value); return i; })(),
  ]);
  wrap.appendChild(dateLab);

  const search = el("input", { type: "search", placeholder: "Filter items…" });
  wrap.appendChild(el("div", { class: "search" }, [search]));
  search.addEventListener("input", draw);

  const inputs = {}; // item_id -> input el
  const list = el("div", { class: "list" });
  wrap.appendChild(list);

  function draw() {
    list.innerHTML = "";
    const stock = computeStock(branch);
    const q = search.value.trim().toLowerCase();
    const items = state.items.filter(i => i.active && (q==="" || i.name.toLowerCase().includes(q)));
    for (const it of items) {
      const pre = stock[it.id] || 0;
      // Blank placeholder so barista can clearly see what they type (not the prefill).
      const inp = inputs[it.id] || el("input", {
        type: "number", step: "any", placeholder: String(pre),
        style: { maxWidth: "120px" }
      });
      inputs[it.id] = inp;
      // Predictive usage + current threshold
      const usage = computeDailyUsage(it.id, branch);
      const cfg = (state.inventory_alerts || {})[it.id] || {};
      const threshold = Number(cfg.reorder_threshold_days) > 0 ? Number(cfg.reorder_threshold_days) : 7;
      const cover = usage > 0 ? (pre / usage) : null;
      const coverTxt = cover == null ? "usage unknown" : `~${cover.toFixed(1)}d cover`;
      const low = cover != null && cover < threshold;
      const subStyle = low ? { color: "var(--bad)", fontWeight: "700" } : {};
      const thresholdBtn = el("button", { class: "btn ghost", style: { padding: "4px 10px", fontSize: "12px" },
        onClick: (e) => {
          e.stopPropagation();
          const v = prompt(`Alert when "${it.name}" has fewer than this many days of cover (default 7):`, String(threshold));
          if (v == null) return;
          const n = Number(v);
          state.inventory_alerts = state.inventory_alerts || {};
          if (!n || n <= 0) { delete state.inventory_alerts[it.id]; }
          else { state.inventory_alerts[it.id] = { reorder_threshold_days: n }; }
          saveState();
          draw();
          toast(`Reorder threshold for ${it.name} set.`);
        }
      }, `⏰ ${threshold}d`);
      list.appendChild(el("div", { class: "row" }, [
        el("div", { class: "grow" }, [
          el("div", { class: "title" }, it.name),
          el("div", { class: "sub" }, `${it.category} · theoretical ${fmtQty(pre, it.unit)}`),
          el("div", { class: "sub", style: subStyle }, `${coverTxt} · daily use ~${fmtQty(usage, it.unit)}`),
        ]),
        el("div", { style: { display: "flex", flexDirection: "column", gap: "4px", alignItems: "flex-end" } }, [
          inp,
          el("div", { class: "sub", style: { textAlign: "right" } }, it.unit),
          thresholdBtn,
        ]),
      ]));
    }
  }
  draw();

  // Undo stack — last submitted snapshot ids the user can roll back this session.
  const undoStack = [];
  const actionsBar = el("div", { class: "sticky-actions" }, [
    el("button", { class: "btn", onClick: submit }, "Submit count"),
    el("button", { class: "btn ghost", style: { marginTop: "8px" }, onClick: () => go("home") }, "Cancel"),
  ]);
  wrap.appendChild(actionsBar);

  const undoBar = el("div", { class: "card", style: { marginTop: "8px", display: "none", borderColor: "var(--accent)" } });
  wrap.appendChild(undoBar);
  function renderUndo() {
    undoBar.innerHTML = "";
    if (!undoStack.length) { undoBar.style.display = "none"; return; }
    undoBar.style.display = "block";
    undoBar.appendChild(el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } }, "Recent submissions (tap to undo)"));
    for (const snapId of [...undoStack].reverse().slice(0, 5)) {
      const snap = state.snapshots.find(s => s.id === snapId);
      if (!snap) continue;
      const row = el("div", { class: "row", style: { alignItems: "center" } }, [
        el("div", { class: "grow" }, [
          el("div", { class: "title" }, `${snap.branch} count — ${snap.as_of}`),
          el("div", { class: "sub" }, `${snap.entries.filter(e => e.branch === snap.branch).length} items · ${fmtDate(snap.created_at)} · by ${snap.created_by_name || "—"}`),
        ]),
        el("button", { class: "btn secondary", onClick: () => undoSnapshot(snap.id) }, "↶ Undo"),
      ]);
      undoBar.appendChild(row);
    }
  }

  function undoSnapshot(snapId) {
    if (!confirm("Remove this inventory submission? The previous counts will become active again.")) return;
    state.snapshots = state.snapshots.filter(s => s.id !== snapId);
    const i = undoStack.indexOf(snapId);
    if (i >= 0) undoStack.splice(i, 1);
    saveState();
    toast("Submission removed");
    renderUndo();
    draw();
  }

  function submit() {
    // Build snapshot entries: carry over the OTHER branches' latest counts unchanged,
    // replace THIS branch's values with inputs. Only rows where the user actually typed
    // something are applied — blank inputs mean "no count taken for this item".
    const s = stamp();
    const latest = state.snapshots.slice().sort((a,b) => a.created_at.localeCompare(b.created_at)).slice(-1)[0];
    const byKey = {};
    if (latest) for (const e of latest.entries) byKey[e.branch + "|" + e.item_id] = Number(e.qty) || 0;
    let counted = 0;
    for (const it of state.items) {
      const inp = inputs[it.id];
      if (inp && String(inp.value).trim() !== "") {
        byKey[branch + "|" + it.id] = Number(inp.value) || 0;
        counted++;
      }
    }
    if (counted === 0) { toast("Type at least one count first", "error"); return; }
    const entries = [];
    for (const [k, v] of Object.entries(byKey)) {
      const [br, id] = k.split("|"); entries.push({ branch: br, item_id: id, qty: v });
    }
    const snapId = uuid();
    state.snapshots.push({
      id: snapId, as_of: asOf, branch, created_at: s.at, created_by: s.by, created_by_name: s.by_name, device: s.device,
      entries,
      notes: `${branch} count`,
      image_url: "",
    });
    undoStack.push(snapId);
    saveState();
    // Clear every input — the new "theoretical" on the left is now the count they just saved.
    for (const id of Object.keys(inputs)) {
      inputs[id].value = "";
      inputs[id].defaultValue = "";
    }
    toast(`Saved ${counted} item counts — theoretical updated. Undo available below.`);
    // Predictive low-stock scan — surfaces items that just dipped under their
    // reorder threshold, based on usage implied by the fresh count + purchases.
    try { scanAndNotifyLowStock(); } catch (e) { console.warn(e); }
    renderUndo();
    draw();
  }

  // ── Manage Items panel (owner + head_barista only) ──────────────
  if (["owner", "head_barista"].includes(u.role)) {
    let panelOpen = false;
    let showInactive = false;

    const panelBody = el("div", { style: { display: "none", marginTop: "12px" } });

    // Add-item form
    const nameIn = el("input", { type: "text", placeholder: "Item name (e.g. Oat Milk)" });
    const unitIn = el("input", { type: "text", placeholder: "Unit (e.g. ml, g, pcs, kg)" });
    const catIn  = el("input", { type: "text", placeholder: "Category (e.g. Milk, Syrup, Packaging)" });

    const mgmtList = el("div", { class: "list", style: { marginTop: "12px" } });

    function drawMgmt() {
      mgmtList.innerHTML = "";
      let items = state.items.filter(i =>
        showInactive || i.active
      ).slice().sort((a, b) => {
        if (a.active !== b.active) return a.active ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
      if (!items.length) {
        mgmtList.appendChild(el("div", { class: "muted", style: { padding: "12px 4px" } }, "No items."));
        return;
      }
      for (const it of items) {
        const badge = el("span", {
          style: {
            padding: "2px 8px", borderRadius: "10px", fontSize: "11px", fontWeight: "700",
            background: it.active ? "#dcfce7" : "#f3f4f6",
            color: it.active ? "#16a34a" : "#9ca3af",
            marginLeft: "6px",
          }
        }, it.active ? "Active" : "Inactive");
        const toggleBtn = el("button", {
          class: "btn ghost",
          style: { padding: "5px 12px", fontSize: "12px", color: it.active ? "var(--bad,#dc2626)" : "var(--good,#16a34a)" },
          onClick: () => {
            const msg = it.active
              ? `Deactivate "${it.name}"? It will no longer appear in counts.`
              : `Restore "${it.name}"? It will reappear in counts.`;
            if (!confirm(msg)) return;
            it.active      = !it.active;
            it.modified_by = currentUser() ? currentUser().name : "—";
            it.modified_at = now();
            saveState();
            toast(`"${it.name}" ${it.active ? "restored ✓" : "deactivated ✓"}`);
            drawMgmt();
            draw(); // refresh the count list above
          }
        }, it.active ? "Deactivate" : "Restore");
        mgmtList.appendChild(el("div", { class: "row", style: { opacity: it.active ? "1" : "0.5" } }, [
          el("div", { class: "grow" }, [
            el("div", { class: "title" }, [it.name, badge]),
            el("div", { class: "sub" }, `${it.category || "—"} · ${it.unit}`),
          ]),
          toggleBtn,
        ]));
      }
    }

    function addMgmtItem() {
      const name = nameIn.value.trim();
      const unit = unitIn.value.trim();
      const cat  = catIn.value.trim();
      if (!name) { toast("Enter an item name", "error"); return; }
      if (!unit) { toast("Enter a unit (e.g. ml, g, pcs)", "error"); return; }
      if (state.items.some(i => i.name.toLowerCase() === name.toLowerCase())) {
        toast("An item with that name already exists.", "error"); return;
      }
      state.items.push({
        id: "inv_" + String(Date.now()),
        name, unit,
        category: cat || "Other",
        active: true,
        added_by: currentUser() ? currentUser().name : "—",
        added_at: now(),
      });
      saveState();
      nameIn.value = ""; unitIn.value = ""; catIn.value = "";
      toast(`"${name}" added ✓`);
      drawMgmt();
      draw(); // refresh count list above
    }

    const toggleInactiveBtn = el("button", {
      class: "btn ghost",
      style: { fontSize: "12px", marginTop: "8px" },
      onClick: () => {
        showInactive = !showInactive;
        toggleInactiveBtn.textContent = showInactive ? "Hide inactive items" : "Show inactive items";
        drawMgmt();
      }
    }, "Show inactive items");

    panelBody.appendChild(el("div", { class: "card", style: { marginBottom: "8px" } }, [
      el("div", { class: "muted", style: { textTransform: "uppercase", letterSpacing: "1px", fontSize: "11px", marginBottom: "10px", fontWeight: "700" } }, "Add new item"),
      el("div", { class: "form-field" }, [ el("label", {}, "Name"), nameIn ]),
      el("div", { class: "form-field" }, [ el("label", {}, "Unit"), unitIn ]),
      el("div", { class: "form-field" }, [ el("label", {}, "Category"), catIn ]),
      el("button", { class: "btn", style: { marginTop: "8px" }, onClick: addMgmtItem }, "＋ Add item"),
    ]));
    panelBody.appendChild(toggleInactiveBtn);
    panelBody.appendChild(mgmtList);

    const togglePanelBtn = el("button", {
      class: "btn ghost",
      style: { marginTop: "24px", width: "100%", borderStyle: "dashed", fontSize: "13px" },
      onClick: () => {
        panelOpen = !panelOpen;
        panelBody.style.display = panelOpen ? "block" : "none";
        togglePanelBtn.textContent = panelOpen ? "▲ Hide item management" : "🗂️ Manage items (add / remove)";
        if (panelOpen) drawMgmt();
      }
    }, "🗂️ Manage items (add / remove)");

    wrap.appendChild(togglePanelBtn);
    wrap.appendChild(panelBody);
  }
  // ── end Manage Items ────────────────────────────────────────────

  return wrap;
};

// ==============================================================
// PURCHASES
// Two line types:
//   - "inventory" — an item that sits in the stock count. Has a purchase unit
//     (bottle, pack, carton…) + pack size in the inventory unit (ml, g, pcs).
//     Inventory gets credited with purchase_qty × pack_size (canonical units).
//     Last conversion per item is remembered in state.purchase_units so the
//     next purchase pre-fills it.
//   - "other" — transportation, packaging, card fees… not in the stock count,
//     but still counted in the purchase total so cash/bank ledgers stay honest.
// ==============================================================
routes.purchase_new = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("New purchase", "Log delivery & receipt. Inventory items update stock; Other lines record costs only."));

  state.purchase_units = state.purchase_units || {};

  let branch = u.branches[0];
  let supplier = "";
  let paid_by = "petty_cash";
  let date = new Date().toISOString().slice(0,10);
  let lines = [{
    kind: "inventory",
    inv_item_id: null,
    purchase_unit: "",   // "bottle", "pack", "carton"
    pack_size: 0,        // inventory units per purchase unit (e.g. 850 ml per bottle)
    purchase_qty: 1,     // how many bottles/packs bought
    unit_price: 0,       // EGP per purchase unit (e.g. 40 EGP per bottle)
    note: "",
  }];
  // Receipt photos — initialized once, re-appended on each draw()
  const receiptPhotoField = makePhotoField({ label: "Receipt photo(s)", formLabel: "Purchase Receipt" });

  const branchPicker = makeBranchPicker(u.branches, () => branch, b => { branch = b; draw(); });
  wrap.appendChild(branchPicker);

  const form = el("div", { class: "stack" });
  wrap.appendChild(form);

  // When picking an item, prefill unit + pack size from last saved conversion
  function applyLastConversion(ln) {
    if (!ln.inv_item_id) return;
    const saved = state.purchase_units[ln.inv_item_id];
    if (saved) {
      if (!ln.purchase_unit) ln.purchase_unit = saved.unit_label || "";
      if (!ln.pack_size)     ln.pack_size     = Number(saved.pack_size_canonical) || 0;
      if (!ln.unit_price && saved.last_unit_price) ln.unit_price = Number(saved.last_unit_price) || 0;
    }
  }

  function lineTotal(ln) {
    if (ln.kind === "other") return Number(ln.amount) || 0;
    return (Number(ln.purchase_qty)||0) * (Number(ln.unit_price)||0);
  }
  function lineCanonicalQty(ln) {
    if (ln.kind !== "inventory") return 0;
    return (Number(ln.purchase_qty)||0) * (Number(ln.pack_size)||0);
  }
  function lineCanonicalUnitCost(ln) {
    if (ln.kind !== "inventory") return 0;
    const qty = lineCanonicalQty(ln);
    if (!qty) return 0;
    return lineTotal(ln) / qty;
  }

  function draw() {
    form.innerHTML = "";
    form.appendChild(el("label", {}, "Date"));
    const dInput = el("input", { type:"date", value: date });
    dInput.addEventListener("input", () => date = dInput.value); form.appendChild(dInput);

    form.appendChild(el("label", {}, "Supplier"));
    const sInput = el("input", { type:"text", value: supplier, placeholder: "e.g. Beano's, Juhayna, Ahmad Tea" });
    sInput.addEventListener("input", () => supplier = sInput.value); form.appendChild(sInput);

    form.appendChild(el("label", {}, "Paid by"));
    const paySel = el("select", {},
      [
        ["petty_cash","Petty cash (head barista)"],
        ["owner_bank","Bank transfer (owner)"],
        ["credit_card","Credit card"],
        ["unpaid","Unpaid / credit"],
      ].map(([v,l]) => el("option", { value: v, selected: paid_by===v?"true":null }, l))
    );
    paySel.addEventListener("change", () => { paid_by = paySel.value; draw(); });
    form.appendChild(paySel);

    if (paid_by === "petty_cash") {
      const bal = pettyCashBalance(branch);
      form.appendChild(el("div", { class: "muted small" }, `Current petty cash at ${branch}: ${money(bal)}`));
    }

    // lines
    form.appendChild(el("h2", { style: { marginTop: "12px" } }, "Lines"));
    lines.forEach((ln, idx) => {
      const card = el("div", { class: "card" });
      form.appendChild(card);

      // Line type selector
      card.appendChild(el("label", {}, `Line ${idx+1} — Type`));
      const typeSel = el("select", {}, [
        el("option", { value: "inventory", selected: ln.kind === "inventory" ? "true" : null }, "Inventory item (milk, coffee, etc.)"),
        el("option", { value: "other",     selected: ln.kind === "other"     ? "true" : null }, "Other (transportation, packaging, card fees…)"),
      ]);
      typeSel.addEventListener("change", () => {
        ln.kind = typeSel.value;
        if (ln.kind === "other") { ln.amount = ln.amount || 0; ln.description = ln.description || ""; }
        draw();
      });
      card.appendChild(typeSel);

      if (ln.kind === "inventory") {
        // Item picker
        card.appendChild(el("label", {}, "Item (inventory)"));
        const pick = el("select", {}, [
          el("option", { value: "" }, "— select —"),
          ...state.items.filter(i => i.active).map(i => el("option", {
            value: i.id, selected: ln.inv_item_id===i.id?"true":null
          }, `${i.name} (${i.unit})`))
        ]);
        pick.addEventListener("change", () => {
          ln.inv_item_id = pick.value || null;
          // reset conversion fields; then pre-fill from saved
          ln.purchase_unit = ""; ln.pack_size = 0; ln.unit_price = 0;
          applyLastConversion(ln);
          draw();
        });
        card.appendChild(pick);

        const it = state.items.find(i => i.id === ln.inv_item_id);
        const invUnit = it ? it.unit : "";

        // Conversion box — explain and capture purchase unit + pack size
        if (it) {
          card.appendChild(el("div", { class: "banner-arch", style: { marginTop: "8px" } },
            `You buy this by e.g. bottle, pack, carton. Inventory counts in ${invUnit}. ` +
            `Tell us how many ${invUnit} are in one purchase unit — we'll remember it next time.`));

          card.appendChild(el("label", {}, "Purchase unit (e.g. bottle, pack, carton)"));
          const puInput = el("input", { type: "text", value: ln.purchase_unit || "", placeholder: "bottle" });
          puInput.addEventListener("input", () => { ln.purchase_unit = puInput.value; updateTotal(); });
          card.appendChild(puInput);

          card.appendChild(el("label", {}, `Pack size — ${invUnit} per ${ln.purchase_unit || "purchase unit"} (e.g. 850)`));
          const psInput = el("input", { type: "number", step: "any", value: ln.pack_size || "", placeholder: "850" });
          psInput.addEventListener("input", () => { ln.pack_size = Number(psInput.value) || 0; updateTotal(); });
          card.appendChild(psInput);

          card.appendChild(el("label", {}, `Quantity bought (how many ${ln.purchase_unit || "purchase units"})`));
          const qInput = el("input", { type: "number", step: "any", value: ln.purchase_qty });
          qInput.addEventListener("input", () => { ln.purchase_qty = Number(qInput.value) || 0; updateTotal(); });
          card.appendChild(qInput);

          card.appendChild(el("label", {}, `Price per ${ln.purchase_unit || "purchase unit"} (EGP)`));
          const pInput = el("input", { type: "number", step: "any", value: ln.unit_price });
          pInput.addEventListener("input", () => { ln.unit_price = Number(pInput.value) || 0; updateTotal(); });
          card.appendChild(pInput);

          // Live conversion preview
          const canQty = lineCanonicalQty(ln);
          const canCost = lineCanonicalUnitCost(ln);
          card.appendChild(el("div", { class: "card", style: { marginTop: "8px", background: "var(--bg)" } }, [
            el("div", { class: "muted small" }, "Inventory impact (auto)"),
            el("div", { style: { fontSize: "16px", fontWeight: "700" } },
              `+${canQty || 0} ${invUnit}  ·  ${money(lineTotal(ln))}  ·  ${canCost ? money(canCost) : "—"} / ${invUnit}`),
          ]));
        }

        card.appendChild(el("label", {}, "Note (batch, expiry, ref)"));
        const nInput = el("input", { type: "text", value: ln.note||"", placeholder: "optional" });
        nInput.addEventListener("input", () => ln.note = nInput.value);
        card.appendChild(nInput);
      } else {
        // OTHER line — no inventory impact
        card.appendChild(el("label", {}, "Description (transportation, packaging, card fees, etc.)"));
        const dsc = el("input", { type: "text", value: ln.description || "", placeholder: "e.g. delivery transport" });
        dsc.addEventListener("input", () => { ln.description = dsc.value; });
        card.appendChild(dsc);

        card.appendChild(el("label", {}, "Amount (EGP)"));
        const amtI = el("input", { type: "number", step: "any", value: ln.amount || 0 });
        amtI.addEventListener("input", () => { ln.amount = Number(amtI.value) || 0; updateTotal(); });
        card.appendChild(amtI);

        card.appendChild(el("label", {}, "Note"));
        const nInput = el("input", { type: "text", value: ln.note||"", placeholder: "optional" });
        nInput.addEventListener("input", () => ln.note = nInput.value);
        card.appendChild(nInput);
      }

      if (lines.length > 1) {
        card.appendChild(el("button", { class: "btn ghost", style: { marginTop:"10px" }, onClick: () => { lines.splice(idx,1); draw(); } }, "Remove line"));
      }
    });

    form.appendChild(el("div", { style: { display: "flex", gap: "8px", flexWrap: "wrap" } }, [
      el("button", {
        class: "btn secondary",
        onClick: () => {
          lines.push({ kind: "inventory", inv_item_id: null, purchase_unit: "", pack_size: 0, purchase_qty: 1, unit_price: 0, note: "" });
          draw();
        }
      }, "+ Inventory line"),
      el("button", {
        class: "btn secondary",
        onClick: () => {
          lines.push({ kind: "other", description: "", amount: 0, note: "" });
          draw();
        }
      }, "+ Other (transport, fees…)"),
    ]));

    // photo(s)
    form.appendChild(receiptPhotoField.el);

    // total
    const totalEl = el("div", { class: "card", style: { marginTop: "14px", textAlign: "right" } }, [
      el("div", { class: "muted" }, "Total"), el("div", { style: { fontSize: "24px", fontWeight: "700" } }, money(lines.reduce((s,l)=>s+lineTotal(l),0)))
    ]);
    form.appendChild(totalEl);
    function updateTotal() {
      totalEl.lastChild.textContent = money(lines.reduce((s,l)=>s+lineTotal(l),0));
    }

    form.appendChild(el("div", { class: "sticky-actions" }, [
      el("button", { class: "btn", onClick: submit }, "Submit purchase"),
    ]));
  }
  draw();

  async function submit() {
    if (!supplier) return toast("Enter supplier name", "error");
    for (const ln of lines) {
      if (ln.kind === "inventory") {
        if (!ln.inv_item_id) return toast("Pick an inventory item for every inventory line", "error");
        if (!ln.purchase_qty) return toast("Enter a quantity for every inventory line", "error");
        if (!ln.pack_size)    return toast("Enter the pack size (e.g. ml per bottle) for every inventory line", "error");
      } else {
        if (!ln.description || !ln.description.trim()) return toast("Describe every Other line", "error");
        if (!(Number(ln.amount) > 0)) return toast("Enter an amount for every Other line", "error");
      }
    }

    const s = stamp();
    const total = lines.reduce((s2, l) => s2 + lineTotal(l), 0);
    const rpBlobs = receiptPhotoField.getBlobs();
    const photoNames = rpBlobs.map(f => f.name);
    const photoIds = [];
    for (const pb of rpBlobs) {
      const pid = uuid();
      try { await IDB.put(pid, pb); } catch (e) { console.warn(e); }
      photoIds.push(pid);
    }
    const photoId = photoIds[0] || null;

    const outLines = lines.map(l => {
      if (l.kind === "inventory") {
        const item = state.items.find(i => i.id === l.inv_item_id);
        const canonicalQty = lineCanonicalQty(l);
        const cost = lineTotal(l);
        // remember conversion for next time
        state.purchase_units[l.inv_item_id] = {
          unit_label: l.purchase_unit || "",
          pack_size_canonical: Number(l.pack_size) || 0,
          last_unit_price: Number(l.unit_price) || 0,
          updated_at: s.at,
        };
        return {
          kind: "inventory",
          inv_item_id: l.inv_item_id,
          item_name: item ? item.name : "",
          unit: item ? item.unit : "",
          purchase_unit: l.purchase_unit || "",
          pack_size_canonical: Number(l.pack_size) || 0,
          purchase_qty: Number(l.purchase_qty) || 0,
          unit_price: Number(l.unit_price) || 0,        // EGP per purchase unit
          qty_canonical: canonicalQty,                  // inventory units added (used by inventory / dashboard)
          unit_cost: canonicalQty ? cost / canonicalQty : 0,  // EGP per inventory unit
          line_total: cost,
          note: l.note || "",
        };
      }
      return {
        kind: "other",
        description: l.description || "",
        amount: Number(l.amount) || 0,
        line_total: Number(l.amount) || 0,
        qty_canonical: 0,
        note: l.note || "",
      };
    });

    const purch = {
      id: uuid(), at: s.at, by: s.by, by_name: s.by_name, device: s.device,
      branch, date, supplier, paid_by, total,
      lines: outLines,
      receipt_photo_id: photoId,
      receipt_photo_ids: photoIds,
      receipt_photo_names: photoNames,
      receipt_drive_ids: receiptPhotoField.getDriveIds(),
      image_url: (receiptPhotoField.getCloudUrls().filter(Boolean)[0]) || "",
    };
    state.purchases.push(purch);
    // ledger side-effects
    if (paid_by === "petty_cash") {
      const bal = pettyCashBalance(branch);
      state.petty_cash.push({
        id: uuid(), branch, date, type: "purchase", amount: -total,
        balance_after: bal - total, ref: purch.id,
        by: s.by, by_name: s.by_name, at: s.at, note: `Purchase from ${supplier}`,
      });
    } else if (paid_by === "owner_bank") {
      state.bank_ledger.push({
        id: uuid(), date, amount: -total, supplier, ref: purch.id, type: "purchase_payment",
        by: s.by, by_name: s.by_name, at: s.at, note: `Bank transfer to ${supplier}`,
      });
    } else if (paid_by === "credit_card") {
      state.bank_ledger.push({
        id: uuid(), date, amount: -total, supplier, ref: purch.id, type: "purchase_credit_card",
        by: s.by, by_name: s.by_name, at: s.at, note: `Credit card payment to ${supplier}`,
      });
    }
    saveState();
    const rpNames = receiptPhotoField.getBlobs().map(f => f.name);

        driveIds: receiptPhotoField.getDriveIds(),
        onDone: () => go("home"),
      });
    } else {
      toast("Purchase saved");
      go("home");
    }
  }
  return wrap;
};
