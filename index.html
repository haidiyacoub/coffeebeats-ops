// ----- unit conversion -----
function invCanonicalizeQty(qty, fromUnit, toUnit) {
  const q = Number(qty) || 0;
  const f = String(fromUnit || "").toLowerCase().trim();
  const t = String(toUnit  || "").toLowerCase().trim();
  if (f === t) return q;
  if ((f === "ml" || f === "milliliter" || f === "milliliters") &&
      (t === "l"  || t === "liter"     || t === "liters"      || t === "litre" || t === "litres")) return q / 1000;
  if ((f === "l"  || f === "liter"     || f === "liters")      &&
      (t === "ml" || t === "milliliter"|| t === "milliliters")) return q * 1000;
  if ((f === "g"  || f === "gram"      || f === "grams"       || f === "gr") &&
      (t === "kg" || t === "kilogram"  || t === "kilograms")) return q / 1000;
  if ((f === "kg" || f === "kilogram"  || f === "kilograms")   &&
      (t === "g"  || t === "gram"      || t === "grams"       || t === "gr")) return q * 1000;
  return q; // same unit family or unknown — return as-is
}

// ----- core consumption calculations -----

// totalIngredientUsage: sum of (recipe_qty × products_sold) for ingredientId
// dateRange: { from: "YYYY-MM-DD", to: "YYYY-MM-DD" } — optional filter
function invTotalIngredientUsage(ingredientId, branch, dateRange, salesData, recipes) {
  // find all recipes that use this ingredient
  const relRecipes = recipes.filter(r => r.inv_item_id === ingredientId);
  if (!relRecipes.length) return 0;

  // collect all rows for this branch in range
  const rows = [];
  for (const batch of salesData) {
    if (branch && batch.branch !== branch) continue;
    for (const r of (batch.rows || [])) {
      if (dateRange && r.date < dateRange.from) continue;
      if (dateRange && r.date > dateRange.to)   continue;
      rows.push(r);
    }
  }
  if (!rows.length) return 0;

  // build product name → qty map
  const qtyByProduct = {};
  for (const r of rows) {
    const key = String(r.product_name || "").toLowerCase().trim();
    qtyByProduct[key] = (qtyByProduct[key] || 0) + (Number(r.qty) || 0);
  }

  // get ingredient unit to canonicalize into
  const item = (state.items || []).find(it => it.id === ingredientId);
  const itemUnit = item ? String(item.unit || "").toLowerCase().trim() : "";

  let total = 0;
  for (const rec of relRecipes) {
    const productKey = String(rec.menu_item_name || "").toLowerCase().trim();
    const sold = qtyByProduct[productKey] || 0;
    if (!sold) continue;
    const recipeUnit = String(rec.unit || "").toLowerCase().trim();
    const qtyCanon = invCanonicalizeQty(rec.qty_per_serving, recipeUnit, itemUnit);
    total += qtyCanon * sold;
  }
  return total;
}

// avgDailyConsumption: returns units/day; falls back to seed if < MIN_DAYS data
function invAvgDailyConsumption(ingredientId, branch, days, salesData, recipes) {
  const MIN_DAYS = 14;
  const today = localISODate(new Date());
  const fromDate = localISODate(new Date(Date.now() - days * 86400000));
  const dateRange = { from: fromDate, to: today };

  // count distinct operational days in the window for this branch
  const daySet = new Set();
  for (const batch of salesData) {
    if (branch && batch.branch !== branch) continue;
    for (const r of (batch.rows || [])) {
      if (r.date >= fromDate && r.date <= today) daySet.add(r.date);
    }
  }
  const opDays = daySet.size;

  if (opDays >= MIN_DAYS) {
    const total = invTotalIngredientUsage(ingredientId, branch, dateRange, salesData, recipes);
    return opDays > 0 ? total / opDays : 0;
  }

  // fallback: use Excel seed
  const cfg = (state.inv_engine.thresholds || {})[ingredientId];
  return cfg ? cfg.avg_daily_usage : 0;
}

// stockLongevity: days remaining at current consumption rate
function invStockLongevity(ingredientId, branch, salesData, recipes) {
  const stock = (computeStock(branch) || {})[ingredientId] || 0;
  const consumption = invAvgDailyConsumption(ingredientId, branch, 30, salesData, recipes);
  if (consumption <= 0) return Infinity;
  return stock / consumption;
}

// invGetLeadTime: ordering window in days for an item, resolved in priority order:
// 1. explicit per-item seed value  2. category window  3. supplier window  4. default
function invGetLeadTime(itemId) {
  const cfg = (state.inv_engine.thresholds || {})[itemId] || {};
  if (cfg.lead_time_days != null) return cfg.lead_time_days;

  const settings = state.inv_engine.settings || {};
  const item = (state.items || []).find(it => it.id === itemId);

  if (item && settings.category_ordering_windows) {
    const catDays = settings.category_ordering_windows[item.category];
    if (catDays != null) return catDays;
  }

  if (settings.supplier_ordering_windows) {
    const sups = (state.suppliers || {})[itemId] || [];
    for (const sup of sups) {
      const supDays = settings.supplier_ordering_windows[sup.name];
      if (supDays != null) return supDays;
    }
  }

  return settings.default_lead_time_days ?? 5;
}

// dynamicReorderThreshold: stock level at which to reorder
function invDynamicReorderThreshold(ingredientId, branch, salesData, recipes) {
  const cfg = (state.inv_engine.thresholds || {})[ingredientId] || {};
  const consumption = invAvgDailyConsumption(ingredientId, branch, 30, salesData, recipes);
  const lead   = invGetLeadTime(ingredientId);
  const buffer = cfg.safety_buffer_days ?? state.inv_engine.settings.default_safety_buffer;
  return consumption * (lead + buffer);
}

// dailyUsageSeries: [{date, usage}] for the last N days
function invDailyUsageSeries(ingredientId, branch, salesData, recipes, days) {
  const today = localISODate(new Date());
  const fromDate = localISODate(new Date(Date.now() - (days || 60) * 86400000));
  const relRecipes = recipes.filter(r => r.inv_item_id === ingredientId);
  if (!relRecipes.length) return [];

  const item = (state.items || []).find(it => it.id === ingredientId);
  const itemUnit = item ? String(item.unit || "").toLowerCase().trim() : "";

  // group rows by date
  const byDate = {};
  for (const batch of salesData) {
    if (branch && batch.branch !== branch) continue;
    for (const r of (batch.rows || [])) {
      if (r.date < fromDate || r.date > today) continue;
      if (!byDate[r.date]) byDate[r.date] = {};
      const key = String(r.product_name || "").toLowerCase().trim();
      byDate[r.date][key] = (byDate[r.date][key] || 0) + (Number(r.qty) || 0);
    }
  }

  return Object.entries(byDate).sort((a, b) => a[0].localeCompare(b[0])).map(([date, qtyByProd]) => {
    let usage = 0;
    for (const rec of relRecipes) {
      const sold = qtyByProd[String(rec.menu_item_name || "").toLowerCase().trim()] || 0;
      const recipeUnit = String(rec.unit || "").toLowerCase().trim();
      usage += invCanonicalizeQty(rec.qty_per_serving, recipeUnit, itemUnit) * sold;
    }
    return { date, usage };
  });
}

// movingAverage: [{date, ma}] with windowDays rolling average
function invMovingAverage(series, windowDays) {
  return series.map((pt, i) => {
    const start = Math.max(0, i - windowDays + 1);
    const window = series.slice(start, i + 1);
    const ma = window.reduce((s, p) => s + p.usage, 0) / window.length;
    return { date: pt.date, ma };
  });
}

// weekdayVsWeekend: avg daily consumption split
function invWeekdayVsWeekend(ingredientId, branch, salesData, recipes) {
  const series = invDailyUsageSeries(ingredientId, branch, salesData, recipes, 60);
  const weekday = series.filter(p => { const d = new Date(p.date).getDay(); return d >= 1 && d <= 4; });
  const weekend = series.filter(p => { const d = new Date(p.date).getDay(); return d === 5 || d === 6 || d === 0; });
  const avg = arr => arr.length ? arr.reduce((s, p) => s + p.usage, 0) / arr.length : 0;
  return { weekday: avg(weekday), weekend: avg(weekend) };
}

// salesVolatility: coefficient of variation (stddev / mean)
function invSalesVolatility(ingredientId, branch, salesData, recipes) {
  const series = invDailyUsageSeries(ingredientId, branch, salesData, recipes, 30);
  if (series.length < 3) return 0;
  const mean = series.reduce((s, p) => s + p.usage, 0) / series.length;
  if (mean <= 0) return 0;
  const variance = series.reduce((s, p) => s + Math.pow(p.usage - mean, 2), 0) / series.length;
  return Math.sqrt(variance) / mean;
}

// estimatedStockoutDate
function invEstimatedStockoutDate(ingredientId, branch, salesData, recipes) {
  const days = invStockLongevity(ingredientId, branch, salesData, recipes);
  if (!isFinite(days) || days <= 0) return null;
  return new Date(Date.now() + days * 86400000);
}

// volatility-adjusted reorder threshold
function invAdjustedReorderThreshold(ingredientId, branch, salesData, recipes) {
  const base = invDynamicReorderThreshold(ingredientId, branch, salesData, recipes);
  const cv = invSalesVolatility(ingredientId, branch, salesData, recipes);
  return base * (1 + Math.min(cv, 1.0));
}

// ----- alert detectors -----
function _invNewAlert(type, itemId, itemName, branch, detail) {
  return { id: uuid(), type, item_id: itemId, item_name: itemName, branch, fired_at: now(), detail, dismissed: false };
}

function invDetectLowStockAlerts(branch, salesData, recipes) {
  const out = [];
  const stocks = computeStock(branch);
  for (const it of (state.items || [])) {
    if (!it.active) continue;
    const threshold = invAdjustedReorderThreshold(it.id, branch, salesData, recipes);
    if (threshold <= 0) continue;
    const stock = stocks[it.id] || 0;
    const days  = invStockLongevity(it.id, branch, salesData, recipes);
    if (stock <= threshold) {
      const cfg = (state.inv_engine.thresholds || {})[it.id] || {};
      out.push(_invNewAlert("low_stock", it.id, it.name, branch, {
        stock, threshold, days_remaining: isFinite(days) ? days : null,
        priority: cfg.priority || "Standard",
      }));
    }
  }
  return out;
}

function invDetectCriticalStockAlerts(branch, salesData, recipes) {
  const out = [];
  const stocks = computeStock(branch);
  for (const it of (state.items || [])) {
    if (!it.active) continue;
    const cfg = (state.inv_engine.thresholds || {})[it.id] || {};
    if (cfg.priority !== "Critical") continue;
    const days = invStockLongevity(it.id, branch, salesData, recipes);
    if (isFinite(days) && days < 3) {
      out.push(_invNewAlert("critical_stock", it.id, it.name, branch, {
        days_remaining: days, stock: stocks[it.id] || 0, priority: "Critical",
      }));
    }
  }
  return out;
}

function invDetectDeadInventoryAlerts(branch, salesData, recipes) {
  const out = [];
  const stocks = computeStock(branch);
  const deadDays = (state.inv_engine.settings || {}).dead_stock_days || 30;
  const cutoff = localISODate(new Date(Date.now() - deadDays * 86400000));
  for (const it of (state.items || [])) {
    if (!it.active) continue;
    const stock = stocks[it.id] || 0;
    if (stock <= 0) continue;
    // check if any consumption in the window
    const usage = invTotalIngredientUsage(it.id, branch, { from: cutoff, to: localISODate(new Date()) }, salesData, recipes);
    if (usage <= 0) {
      out.push(_invNewAlert("dead_inventory", it.id, it.name, branch, { stock, dead_since_days: deadDays }));
    }
  }
  return out;
}

function invDetectSupplierDelayRisk(branch, salesData, recipes) {
  const out = [];
  for (const it of (state.items || [])) {
    if (!it.active) continue;
    const leadTime = invGetLeadTime(it.id);
    const days = invStockLongevity(it.id, branch, salesData, recipes);
    if (isFinite(days) && days < leadTime * 1.5) {
      out.push(_invNewAlert("supplier_delay", it.id, it.name, branch, {
        days_remaining: days, lead_time_days: leadTime,
      }));
    }
  }
  return out;
}

function invDetectConsumptionSpike(branch, salesData, recipes) {
  const out = [];
  const spikeMultiplier = (state.inv_engine.settings || {}).spike_multiplier || 1.5;
  const maWindow = (state.inv_engine.settings || {}).ma_window_days || 7;
  for (const it of (state.items || [])) {
    if (!it.active) continue;
    const series = invDailyUsageSeries(it.id, branch, salesData, recipes, 37);
    if (series.length < maWindow + 7) continue;
    const historicalAvg = series.slice(0, series.length - maWindow).reduce((s, p) => s + p.usage, 0) / (series.length - maWindow);
    if (historicalAvg <= 0) continue;
    const recent = series.slice(-maWindow);
    const recentAvg = recent.reduce((s, p) => s + p.usage, 0) / recent.length;
    if (recentAvg > historicalAvg * spikeMultiplier) {
      out.push(_invNewAlert("spike", it.id, it.name, branch, {
        recent_avg: recentAvg, historical_avg: historicalAvg,
        spike_ratio: recentAvg / historicalAvg,
      }));
    }
  }
  return out;
}

// runEngineAlertScan: runs all detectors, deduplicates, auto-dismisses resolved alerts
function runEngineAlertScan() {
  const sd = state.inv_engine_sales_data || [];
  const rc = state.inv_engine_recipes    || [];
  const today = localISODate(new Date());
  let dirty = false;

  // Auto-dismiss resolved low-stock/critical alerts when a purchase covers the item
  for (const alert of (state.inv_engine.engine_alerts || [])) {
    if (alert.dismissed) continue;
    if (alert.type === "low_stock" || alert.type === "critical_stock" || alert.type === "supplier_delay") {
      const alertDate = alert.fired_at ? alert.fired_at.slice(0, 10) : today;
      if (isReorderResolved(alert.item_id, alertDate)) {
        alert.dismissed = true;
        alert.dismissed_by_id   = "system";
        alert.dismissed_by_name = "Auto-resolved";
        alert.dismissed_at      = new Date().toISOString();
        dirty = true;
      }
    }
  }

  const branches = ["maadi", "zawya"];
  const newAlerts = [];
  for (const b of branches) {
    newAlerts.push(...invDetectLowStockAlerts(b, sd, rc));
    newAlerts.push(...invDetectCriticalStockAlerts(b, sd, rc));
    newAlerts.push(...invDetectDeadInventoryAlerts(b, sd, rc));
    newAlerts.push(...invDetectSupplierDelayRisk(b, sd, rc));
    newAlerts.push(...invDetectConsumptionSpike(b, sd, rc));
  }

  // Deduplicate: don't add if same type+item+branch already fired today and not dismissed
  for (const a of newAlerts) {
    const exists = (state.inv_engine.engine_alerts || []).some(e =>
      !e.dismissed && e.type === a.type && e.item_id === a.item_id &&
      e.branch === a.branch && (e.fired_at || "").slice(0, 10) === today
    );
    if (!exists) {
      state.inv_engine.engine_alerts = state.inv_engine.engine_alerts || [];
      state.inv_engine.engine_alerts.push(a);
      dirty = true;
      // Fire push notifications for critical alerts
      if (a.type === "critical_stock") {
        const d = a.detail || {};
        notifyHaidi(`CRITICAL stock — ${a.item_name} (${a.branch})`,
          `Only ${(d.days_remaining || 0).toFixed(1)}d of cover left. Reorder immediately.`);
        notifyLeadershipRole("inventory_management",
          `CRITICAL stock — ${a.item_name} (${a.branch})`,
          `${(d.days_remaining || 0).toFixed(1)} days remaining. Immediate reorder required.`);
      }
    }
  }
  if (dirty) saveState();
}

// ----- fuzzy ingredient name matcher -----
function invFuzzyMatchIngredient(name, items) {
  const norm = s => String(s || "").toLowerCase().trim().replace(/\s+/g, " ");
  const target = norm(name);
  // exact match first
  let match = items.find(it => norm(it.name) === target);
  if (match) return { item: match, confidence: 1.0 };
  // prefix match
  match = items.find(it => norm(it.name).startsWith(target) || target.startsWith(norm(it.name)));
  if (match) return { item: match, confidence: 0.85 };
  // contains match
  match = items.find(it => norm(it.name).includes(target) || target.includes(norm(it.name)));
  if (match) return { item: match, confidence: 0.7 };
  // token overlap match
  const targetTokens = target.split(" ");
  let bestScore = 0, bestItem = null;
  for (const it of items) {
    const tokens = norm(it.name).split(" ");
    const overlap = targetTokens.filter(t => tokens.includes(t)).length;
    const score = overlap / Math.max(targetTokens.length, tokens.length);
    if (score > bestScore) { bestScore = score; bestItem = it; }
  }
  if (bestScore >= 0.5) return { item: bestItem, confidence: bestScore };
  return { item: null, confidence: 0 };
}

// ----- POS order items parser for the engine -----
// Accepts SheetJS workbook parsed from monthly "Branch order items Month Year" XLSX/CSV
function invParsePOSOrderItems(wb, branch, isoMonth) {
  const rows = [];
  const sheetName = wb.SheetNames[0];
  const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: null });

  // Normalize column names to find product and quantity columns
  const norm = s => String(s || "").toLowerCase().replace(/\s+/g, "_").replace(/[^a-z0-9_]/g, "");
  const dateFormats = [
    v => { if (!v) return null; const s = String(v); if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10); return null; },
    v => { if (!v) return null; const d = new Date(v); return isNaN(d) ? null : localISODate(d); },
  ];

  for (const row of raw) {
    const keys = Object.keys(row);
    const normKeys = keys.map(norm);

    // find product name
    const nameKey = keys[normKeys.findIndex(k =>
      k.includes("item") || k.includes("product") || k.includes("name") || k.includes("modifier")
    )];
    // find quantity
    const qtyKey = keys[normKeys.findIndex(k =>
      k.includes("qty") || k.includes("quantity") || k.includes("sold") || k.includes("count") || k === "total"
    )];
    // find date
    const dateKey = keys[normKeys.findIndex(k =>
      k.includes("date") || k.includes("day") || k.includes("time") || k.includes("created")
    )];

    if (!nameKey || !qtyKey) continue;
    const productName = String(row[nameKey] || "").trim();
    const qty = Number(row[qtyKey]) || 0;
    if (!productName || qty <= 0) continue;

    let date = null;
    if (dateKey) {
      for (const fmt of dateFormats) { date = fmt(row[dateKey]); if (date) break; }
    }
    if (!date) date = isoMonth + "-01"; // fallback to first of month

    rows.push({ date, product_name: productName, qty });
  }

  return { id: uuid(), branch, month: isoMonth, uploaded_at: now(), uploaded_by: (currentUser()||{}).id || "anon", rows };
}

// ----- Recipe BOM parser — reads "Receipe" tab (wide matrix format) -----
function invParseRecipeBOM(wb) {
  // Find the recipe sheet (name may be misspelled)
  const sheetName = wb.SheetNames.find(n =>
    /rec[ei]+pe?/i.test(n)
  ) || wb.SheetNames[0];

  const ws = wb.Sheets[sheetName];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
  if (!raw.length) return [];

  // Row 0 = headers: ["Product", "WATER (ML)", "Coffee Type 1 (gr)", ...]
  const headers = (raw[0] || []).map(h => String(h || "").trim());
  const recipes = [];
  const now_ = now();

  // Parse unit from header like "Coffee Type 1 (gr)" → { name: "Coffee Type 1", unit: "gr" }
  function parseHeader(h) {
    const m = h.match(/^(.+?)\s*\(([^)]+)\)\s*$/);
    if (m) return { name: m[1].trim(), unit: m[2].trim().toLowerCase() };
    return { name: h, unit: "" };
  }

  // Columns 1+ are ingredients (column 0 is "Product")
  const ingredientCols = [];
  for (let c = 1; c < headers.length; c++) {
    if (!headers[c]) continue;
    const { name, unit } = parseHeader(headers[c]);
    if (!name) continue;
    // Resolve to inventory item
    const match = invFuzzyMatchIngredient(name, state.items || []);
    ingredientCols.push({ colIdx: c, name, unit, match });
  }

  // Rows 1+ are products (skip category header rows that have no qty values)
  for (let r = 1; r < raw.length; r++) {
    const row = raw[r];
    if (!row) continue;
    const productName = String(row[0] || "").trim();
    if (!productName) continue;
    // Skip category header rows (all qty columns are null)
    const hasQty = ingredientCols.some(ic => row[ic.colIdx] != null && Number(row[ic.colIdx]) > 0);
    if (!hasQty) continue;

    for (const ic of ingredientCols) {
      const qty = Number(row[ic.colIdx]);
      if (!qty || qty <= 0) continue;
      // Apply modifier milk serving→L conversion: if ingredient is milk type and unit is ml
      let finalQty = qty;
      let finalUnit = ic.unit;
      const isModifierMilk = /oat|almond|coconut|skimmed|full.?cream/.test(ic.name.toLowerCase());
      if (isModifierMilk && (ic.unit === "ml" || ic.unit === "milliliter")) {
        // Already in ml — will be canonicalized to L when calculating; keep as-is
      }

      recipes.push({
        id: uuid(),
        menu_item_name: productName,
        ingredient_name: ic.name,
        inv_item_id: ic.match.item ? ic.match.item.id : null,
        qty_per_serving: finalQty,
        unit: finalUnit,
        uploaded_at: now_,
        _confidence: ic.match.confidence || 0,
      });
    }
  }
  return recipes;
}

function pettyCashBalance(branch) {
  const rows = state.petty_cash.filter(p => p.branch === branch)
    .sort((a,b) => a.at.localeCompare(b.at));
  const last = rows[rows.length - 1];
  return last ? Number(last.balance_after) || 0 : 0;
}

// ----- router -----
let route = { name: "login", params: {} };
function go(name, params={}) {
  // Enforce role access at navigation time
  const u = currentUser();
  if (u && !canAccess(name, u)) {
    toast("You don't have access to that section.");
    route = { name: "home", params: {} };
    render();
    return;
  }
  route = { name, params }; render();
}

// ----- role access policy -----
// Barista: inventory count + record waste + record purchases only
// Head barista: all barista + salaries + penalties + Maadi deposits + petty cash + bank ledger
// Accountant: full read access + petty cash (view), salaries, penalties, overheads, dashboard, bank, sales import, menu
// Owner: full access
const ROLE_ACCESS = {
  owner: "*",         // full access
  accountant: "*",    // full access (per Haïdi: "Accountant and owner have all access rights")
  // Per Haïdi: head barista = all barista + salaries + penalties + Maadi deposits + petty cash + roster (edit)
  head_barista: ["home","shifts","snapshot_new","waste_new","waste_list","purchase_new","purchase_list",
                 "petty_cash","salaries","penalties","maadi_deposits","roster",
                 "shift_close_new","shift_close_list","cleaning_log_new","cleaning_log_list",
                 "signin_stamp_new","signin_stamp_list",
                 "leave_new","leave_list",
                 "scorecard","my_scorecard","my_jd",
                 "reorder_action_list","supplier_list","items_list",
                 "inventory_engine",
                 "my_hr","staff_hr","leaderboard","notifications","suggestions",
                 "my_training","training_quiz_take","app_guide"],
  // Per Haïdi: barista = only waste log, weekly schedule (read), barista handbook, shift close, sign-in stamp, cleaning log, leave requests
  barista: ["home","my_id","waste_new","roster","handbook","shift_close_new","signin_stamp_new","cleaning_log_new","leave_new","leave_list","my_scorecard","my_jd","my_hr","leaderboard","notifications","suggestions",
            "my_training","training_quiz_take","app_guide"],
  // Zawya-only support roles — minimal access: home screen + own profile
  manager: ["home","my_id","users","leave_new","leave_list","my_hr","handbook","notifications","suggestions","app_guide"],
  helper:  ["home","my_id","users","handbook","notifications","suggestions","app_guide"],

};
function canAccess(routeName, u) {
  if (!u) return false;
  if (routeName === "login" || routeName === "home") return true;
  // Per-user denylist (revokes default role access)
  if (Array.isArray(u.deny_access) && u.deny_access.includes(routeName)) return false;
  // Per-user allowlist adds to role grants
  if (Array.isArray(u.extra_access) && u.extra_access.includes(routeName)) return true;
  // Leadership role grants — auto-expire when a new month's assignment is set.
  const _laMonth = new Date().toISOString().slice(0, 7);
  const _laAssign = getLeadershipAssignment(_laMonth);
  if (_laAssign) {
    const BUDGET_INV_ROUTES = [
      "inventory_engine","items_list","supplier_list","reorder_action_list",
      "snapshot_new","waste_new","waste_list","purchase_new","purchase_list",
      "petty_cash","maadi_deposits"
    ];
    const isBudgetMgr = _laAssign.budget_inventory === u.id
      || _laAssign.inventory_management === u.id
      || _laAssign.cash_status === u.id;
    if (isBudgetMgr && BUDGET_INV_ROUTES.includes(routeName)) return true;
    if (_laAssign.weekly_schedule === u.id &&
        ["leave_new","leave_list","roster"].includes(routeName)) return true;
  }
  const allow = ROLE_ACCESS[u.role];
  if (allow === "*") return true;
  if (!Array.isArray(allow)) return false;
  return allow.includes(routeName);
}

// Real-time listener for the sign-in page — cleaned up when a user logs in.
let _loginPeopleUnsub = null;

// ----- root render -----
function render() {
  const root = $("#app");
  root.innerHTML = "";
  if (!state._auth) { stopIdleTimer(); stopNoStampCheck(); root.appendChild(loginView()); return; }
  // Clean up sign-in listener once someone is authenticated.
  if (_loginPeopleUnsub) { _loginPeopleUnsub(); _loginPeopleUnsub = null; }
  const u = currentUser();
  if (!u || !u.active) { auth.signOut(); return; }
  if (["owner", "head_barista"].includes(u.role)) startNoStampCheck();
  else stopNoStampCheck();
  // Guard direct-access to restricted routes
  if (!canAccess(route.name, u)) {
    route = { name: "home", params: {} };
  }
  root.appendChild(topbar(u));
  const main = el("main", {});
  root.appendChild(main);
  const viewResult = (routes[route.name] || routes.home)(u, route.params);
  // Some routes (e.g. handbook) are async — handle both Promise and direct DOM node.
  if (viewResult && typeof viewResult.then === "function") {
    viewResult.then(node => { if (node) main.appendChild(node); });
  } else {
    main.appendChild(viewResult);
  }
}

function loginView() {
  let pick = null;
  let pin = "";
  let _busy = false;
  const wrap = el("div", {});
  wrap.appendChild(el("div", { class: "topbar" }, [
    el("img", { class: "logo", src: CB_LOGO_SRC, alt: "Coffee Beats", style: { height: "52px" } }),

  wrap.appendChild(main);

  main.appendChild(el("div", {
    style: { textAlign: "center", padding: "18px 0 8px", display: "flex", flexDirection: "column", alignItems: "center", gap: "8px" }
  }, [
    el("img", { src: CB_LOGO_SRC, alt: "Coffee Beats", style: { height: "84px", width: "auto" } }),
    el("div", { style: { fontSize: "11px", letterSpacing: "2px", color: "#EFBBA3", textTransform: "uppercase", fontWeight: "700" } }, "Specialty Coffee for Creators"),
  ]));

  main.appendChild(el("div", { class: "banner-arch" }, "Tap your name, then enter your 4-digit PIN."));

  const userList = el("div", { class: "list" });
  main.appendChild(userList);

  const pinPad = el("div", { class: "card", style: { marginTop: "16px", display: "none" } });
  main.appendChild(pinPad);

  const roleMap = { owner: "Owner", accountant: "Accountant", head_barista: "Head Barista", barista: "Barista", manager: "Manager", helper: "Helper" };

  function buildUserList(people) {
    userList.innerHTML = "";
    for (const u of people) {
      const icon = u.role === "owner" ? "🗝️" : u.role === "accountant" ? "🧮" : u.role === "head_barista" ? "⭐" : "👤";
      const branchLabel = u.role === "barista" ? "rotates" : (u.role === "accountant" ? "all branches" : (u.branches || []).join(", "));
      userList.appendChild(el("div", { class: "row", onClick: () => selectUser(u) }, [
        el("div", { class: "icon", style: { fontSize: "22px" } }, icon),
        el("div", { class: "grow" }, [
          el("div", { class: "title" }, u.name),
          el("div", { class: "sub" }, `${roleMap[u.role] || u.role} · ${branchLabel}`),
        ]),
        el("div", { class: "pill" }, "Tap"),
      ]));
    }
  }

  // Real-time listener — list updates immediately when a barista is deactivated.
  try {
    _loginPeopleUnsub = db.collection("staff_public")
      .where("active", "==", true)
      .onSnapshot(snap => {
        buildUserList(snap.docs.map(doc => ({ id: doc.id, uid: doc.id, ...doc.data() })));
      }, () => {
        buildUserList(staffDir.active());
      });
  } catch (_) {
    buildUserList(staffDir.active());
  }

  function selectUser(u) {
    pick = u; pin = "";
    pinPad.style.display = "block";
    pinPad.innerHTML = "";
    pinPad.appendChild(el("h2", {}, `PIN for ${u.name}`));
    const dots = el("div", { class: "pin-dots" }, [0,1,2,3].map(i => el("div", { class: "d" })));
    pinPad.appendChild(dots);
    const grid = el("div", { class: "pin-grid" });
    pinPad.appendChild(grid);
    const keys = ["1","2","3","4","5","6","7","8","9","⌫","0","OK"];
    for (const k of keys) {
      grid.appendChild(el("button", { class: "pin-key", onClick: () => press(k) }, k));
    }
    function refresh() {
      dots.innerHTML = "";
      [0,1,2,3].forEach(i => dots.appendChild(el("div", { class: "d" + (i < pin.length ? " on" : "") })));
    }
    function press(k) {
      if (_busy) return;
      if (k === "⌫") { pin = pin.slice(0,-1); refresh(); return; }
      if (k === "OK") { tryLogin(); return; }
      if (pin.length < 4) { pin += k; refresh(); if (pin.length === 4) tryLogin(); }
    }
    async function tryLogin() {
      if (_busy || pin.length < 4) return;
      _busy = true;
      // staffId is the Firebase UID (uid field, set during migration).
      // Falls back to legacy id for pre-migration state.users entries.
      const staffId = pick.uid || pick.id;
      try {
        const verifyPin = functions.httpsCallable("verifyPin");
        const { data } = await verifyPin({ staffId, pin });
        await auth.signInWithCustomToken(data.token);
        // onAuthStateChanged fires automatically → _resolveAuth → render()
      } catch (e) {
        const msg = e.code === "functions/unauthenticated" ? "Wrong PIN" : (e.message || "Login failed");
        toast(msg, "error");
        pin = ""; refresh();
        _busy = false;
      }
    }
  }

  return wrap;
}

    tiles.appendChild(tile("⚖️", "Penalties", "Half/full day deductions", () => go("penalties")));
    tiles.appendChild(tile("📋", "Leave Requests", "Approve · reject · view all", () => go("leave_list")));
    tiles.appendChild(tile("👥", "Coffee Beats Team", "PINs & roles", () => go("users")));
    tiles.appendChild(_suggTile(u));
  }
  wrap.appendChild(tiles);

  // ---------- Low stock banner ----------
  // Shown to anyone who can act on it: owner, accountant, head_barista, barista.
  // Runs a scan first so the log picks up anything new. Predictive logic uses the
  // last two snapshots + purchases to estimate daily usage; default reorder window
  // is 7 days of cover unless overridden per item.
  try { scanAndNotifyLowStock(); } catch (e) { console.warn(e); }
  try { scanReorderFollowUps(); } catch (e) { console.warn(e); }
  try { scanCashDepositReminders(); } catch (e) { console.warn(e); }
  try { scanCashDepositPenalties(); } catch (e) { console.warn(e); }
  try { runEngineAlertScan(); } catch (e) { console.warn(e); }
  const lowBoth = [
    ...lowStockItems("maadi").map(r => ({...r, _b: "maadi"})),
    ...lowStockItems("zawya").map(r => ({...r, _b: "zawya"})),
  ];
  if (lowBoth.length) {
    const card = el("div", { class: "card", style: { borderColor: "var(--bad)", marginTop: "16px" } });
    card.appendChild(el("div", { style: { color: "var(--bad)", fontWeight: "700", marginBottom: "6px" } }, `⚠ Low stock — ${lowBoth.length} item${lowBoth.length>1?"s":""} need re-ordering`));
    for (const r of lowBoth.slice(0, 8)) {
      card.appendChild(el("div", { class: "kv" }, [
        el("div", { class: "k" }, `${r.item.name} · ${r._b}`),
        el("div", { class: "v" }, `${fmtQty(r.stock, r.item.unit)} · ~${r.days_of_cover.toFixed(1)}d cover`),
      ]));
    }
    if (lowBoth.length > 8) {
      card.appendChild(el("div", { class: "sub muted", style: { marginTop: "4px" } }, `+${lowBoth.length - 8} more`));
    }
    wrap.appendChild(card);
  }

  // ---------- Reorder action banner ----------
  // Shown to barista + head_barista: alerts where no "called_supplier" or
  // "notified_head_barista" action has been logged yet.
  if (u.role === "barista" || u.role === "head_barista") {
    const pending = (state.alert_log || []).filter(a => {
      if (isReorderResolved(a.item_id, a.date)) return false;
      if (isReorderActionedByCalling(a.key)) return false;
      const hasAnyAction = (state.reorder_actions || []).some(r => r.alert_key === a.key && (r.called_supplier || r.notified_head_barista));
      if (hasAnyAction) return false;
      // Only surface alerts from the last 10 days
      const daysSince = Math.floor((Date.now() - new Date(a.date + "T00:00:00")) / 86400000);
      return daysSince <= 10;
    });
    if (pending.length > 0) {
      const raCard = el("div", { class: "card", style: { borderColor: "#c0392b", background: "#fff5f5", marginTop: "12px", cursor: "pointer" } });
      raCard.appendChild(el("div", { style: { color: "#c0392b", fontWeight: "700", marginBottom: "8px", fontSize: "14px" } }, `📦 ${pending.length} reorder action${pending.length>1?"s":""} awaiting your response`));
      for (const a of pending.slice(0, 6)) {
        const daysSince = Math.floor((Date.now() - new Date(a.date + "T00:00:00")) / 86400000);
        const hasFollowUp = Array.isArray(a.follow_ups) && a.follow_ups.length > 0;
        const row = el("div", { class: "kv", style: { borderBottom: "1px solid #ffd6d6", padding: "6px 0", cursor: "pointer" } }, [
          el("div", { class: "k", style: { fontWeight: "600" } }, `${a.item_name} · ${a.branch}`),
          el("div", { class: "v", style: { color: hasFollowUp ? "#c0392b" : "#666", fontSize: "12px" } }, hasFollowUp ? `🔴 ${daysSince}d overdue` : `${daysSince}d ago`),
        ]);
        row.addEventListener("click", () => go("reorder_action_list"));
        raCard.appendChild(row);
      }
      if (pending.length > 6) {
        raCard.appendChild(el("div", { class: "sub muted", style: { marginTop: "4px", fontSize: "12px" } }, `+${pending.length - 6} more — tap to view all`));
      }
      raCard.addEventListener("click", (e) => { if (e.target === raCard) go("reorder_action_list"); });
      wrap.appendChild(raCard);
    }
  }

  // quick today stats
  const today = fmtDay(now());
  const todayWaste = state.waste.filter(w => fmtDay(w.at) === today);
  const todayPurch = state.purchases.filter(p => fmtDay(p.at) === today);
  const kpis = el("div", { class: "grid c2", style: { marginTop: "16px" } }, [
    el("div", { class: "card" }, [
      el("div", { class: "muted" }, "Today's waste entries"),
      el("div", { style: { fontSize: "26px", fontWeight: "700" } }, String(todayWaste.length)),
    ]),
    el("div", { class: "card" }, [
      el("div", { class: "muted" }, "Today's purchases"),
      el("div", { style: { fontSize: "26px", fontWeight: "700" } }, String(todayPurch.length)),
    ]),
  ]);
  wrap.appendChild(kpis);

  return wrap;
};

function tile(icon, label, sub, onClick) {
  return el("div", { class: "tile", onClick }, [
    el("div", { class: "icon" }, icon),
    el("div", { class: "label" }, label),
    el("div", { class: "sub" }, sub),
  ]);
}

function sectionHeader(label) {
  return el("div", {
    style: { gridColumn: "1 / -1", background: "var(--ink)", color: "#fff",
             fontWeight: "700", fontSize: "11px", letterSpacing: "0.12em",
             textTransform: "uppercase", padding: "7px 14px", borderRadius: "10px",
             marginTop: "10px" },
  }, label);
}

routes.waste_new = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Record Waste", "Picks an item, qty, and reason. Reduces stock."));

  let branch = u.branches[0];
  let itemId = null;

  // ── No-waste quick-log ──────────────────────────────────────────
  const noWasteCard = el("div", { class: "card", style: { marginBottom: "14px", background: "var(--surface-2)", border: "1.5px dashed var(--border)" } }, [
    el("div", { class: "muted small", style: { marginBottom: "8px" } }, "No waste to report this shift? Tap below to log a clear shift — this still counts as your required daily entry."),
    el("button", {
      class: "btn secondary",
      onClick: () => {
        const s = stamp();
        state.waste.push({
          id: uuid(), at: s.at, by: s.by, by_name: s.by_name, device: s.device,
          branch,
          inv_item_id: null, item_name: "— No waste —", unit: "",
          qty_canonical: 0,
          reason: "No waste", note: "Barista confirmed: no waste this shift.",
        });
        saveState();
        toast("✓ Clear shift logged — no waste recorded");
        go("waste_list");
      },
    }, "✓ No waste this shift"),
  ]);
  wrap.appendChild(noWasteCard);
  let qty = 0;
  let reason = "Spilled";
  let note = "";

  const branchPicker = makeBranchPicker(u.branches, () => branch, b => { branch = b; update(); });
  wrap.appendChild(branchPicker);

  const search = el("input", { type: "search", placeholder: "Search item (milk, coffee, caramel…)" });
  wrap.appendChild(el("div", { class: "search" }, [search]));

  const pickBox = el("div", { class: "list" });
  wrap.appendChild(pickBox);

  const bottom = el("div", { class: "card", style: { marginTop: "14px" } });
  wrap.appendChild(bottom);

  function update() {
    pickBox.innerHTML = "";
    const q = search.value.trim().toLowerCase();
    const stock = computeStock(branch);
    const list = state.items.filter(i => i.active && (q === "" || i.name.toLowerCase().includes(q)));
    list.slice(0, 50).forEach(it => {
      const row = el("div", {
        class: "row",
        style: { cursor: "pointer", outline: itemId === it.id ? "2px solid var(--accent)" : "none" },
        onClick: () => { itemId = it.id; update(); },
      }, [
        el("div", { class: "grow" }, [
          el("div", { class: "title" }, it.name),
          el("div", { class: "sub" }, it.category || "—"),
        ]),
        el("div", { class: "qty" }, `${fmtQty(stock[it.id]||0, it.unit)}`),
      ]);
      pickBox.appendChild(row);
    });

    bottom.innerHTML = "";
    if (!itemId) {
      bottom.appendChild(el("div", { class: "muted" }, "Pick an item above."));
      return;
    }
    const it = state.items.find(x => x.id === itemId);
    bottom.appendChild(el("h2", {}, `${it.name}  ·  current ${fmtQty(stock[itemId]||0, it.unit)}`));

    bottom.appendChild(el("label", {}, `Qty (${it.unit})`));
    const qtyInput = el("input", { type: "number", min: "0", step: "any", value: qty || "" });
    qtyInput.addEventListener("input", () => qty = Number(qtyInput.value) || 0);
    const stepper = el("div", { class: "qty-stepper" }, [
      el("button", { onClick: () => { qty = Math.max(0, (Number(qtyInput.value)||0) - (it.unit==="unit"?1:10)); qtyInput.value = qty; } }, "−"),
      qtyInput,
      el("button", { onClick: () => { qty = (Number(qtyInput.value)||0) + (it.unit==="unit"?1:10); qtyInput.value = qty; } }, "+"),
    ]);
    bottom.appendChild(stepper);

    bottom.appendChild(el("label", {}, "Reason"));
    const reasonSel = el("select", {}, ["سكب","منتهي الصلاحية","مرجوع من العميل","تدريب / معايرة","أخرى"].map(r => el("option", { value: r, selected: r===reason ? "true" : null }, r)));
    const expiryPhotoNote = el("div", { class: "banner-warn", style: { display: "none", marginTop: "8px", fontSize: "13px" } }, "📷 Photo required for expired milk — attach before submitting.");
    reasonSel.addEventListener("change", () => {
      reason = reasonSel.value;
      const isMilk = (state.items.find(x => x.id === itemId)?.name || "").toLowerCase().match(/milk|oat|almond|soy|cream/);
      expiryPhotoNote.style.display = (reason === "منتهي الصلاحية" && isMilk) ? "block" : "none";
    });
    bottom.appendChild(reasonSel);
    bottom.appendChild(expiryPhotoNote);

    bottom.appendChild(el("label", {}, "Note (optional)"));
    const noteInput = el("input", { type: "text", value: note, placeholder: "e.g. dropped pitcher" });
    noteInput.addEventListener("input", () => note = noteInput.value);
    bottom.appendChild(noteInput);

    bottom.appendChild(el("div", { class: "sticky-actions" }, [
      el("button", { class: "btn", onClick: submit }, "Submit waste entry"),
      el("div", { class: "small muted", style: { marginTop: "6px", textAlign: "center" } }, `Will reduce ${it.name} at ${branch} by ${qty || 0} ${it.unit}.`),
    ]));
  }
  // ── Photo evidence (multi-image, auto-uploads to Cloudinary) ──
  const wastePhotoField = makePhotoField({ label: "Evidence photo(s)", multiple: true, formLabel: "Record Waste" });
  wrap.appendChild(wastePhotoField.el);

  search.addEventListener("input", update);
  update();

  function submit() {
    const it = state.items.find(x => x.id === itemId);
    if (!it || !qty || qty <= 0) { toast("Pick an item and qty > 0", "error"); return; }
    const isMilkItem = (it.name||"").toLowerCase().match(/milk|oat|almond|soy|cream/);
    if (reason === "منتهي الصلاحية" && isMilkItem && !wastePhotoField.getCloudUrls().filter(Boolean).length) {
      toast("📷 Attach a photo of the expired milk before submitting", "error"); return;
    }
    const s = stamp();
    const photoUrls = wastePhotoField.getCloudUrls().filter(Boolean);
    state.waste.push({
      id: uuid(), at: s.at, by: s.by, by_name: s.by_name, device: s.device,
      branch,
      inv_item_id: itemId, item_name: it.name, unit: it.unit,
      qty_canonical: qty,
      reason, note,
      photos: photoUrls,
      image_url: photoUrls[0] || "",
    });
    saveState();
    // KPI waste score is derived live in kpiGetUserScores() from state.waste — no extra storage needed
    const photoMsg = photoUrls.length ? ` · ${photoUrls.length} photo${photoUrls.length > 1 ? "s" : ""} saved` : "";
    toast("Waste recorded" + photoMsg);
    go("waste_list");
  }

  return wrap;
};

routes.waste_list = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Recent waste", "Signed entries. Tap + to add."));

  const list = el("div", { class: "list" });
  const mine = state.waste.filter(w => u.role === "owner" || u.branches.includes(w.branch))
    .sort((a,b) => b.at.localeCompare(a.at)).slice(0, 200);
  if (mine.length === 0) list.appendChild(el("div", { class: "muted" }, "No entries yet."));
  for (const w of mine) {
    const photoCount = (w.photos || []).length;
    const titleNode = el("div", { class: "title" });
    titleNode.appendChild(document.createTextNode(`${w.item_name} — ${fmtQty(w.qty_canonical, w.unit)}`));
    if (photoCount) titleNode.appendChild(el("span", { style: { marginLeft: "6px", fontSize: "12px", color: "var(--ok)", fontWeight: "600" } }, `📷 ${photoCount}`));
    const growParts = [
      titleNode,
      el("div", { class: "sub" }, `${w.branch} · ${w.reason}${w.note ? ` · ${w.note}` : ""}`),
      el("div", { class: "sub" }, `by ${w.by_name} · ${fmtDate(w.at)}`),
    ];
    if (photoCount) {
      const thumbRow = el("div", { style: { display: "flex", gap: "6px", marginTop: "6px", flexWrap: "wrap" } });
      (w.photos || []).forEach(url => {
        const thumb = el("img", { src: url, style: { width: "56px", height: "56px", objectFit: "cover", borderRadius: "8px", border: "1px solid var(--border)", cursor: "pointer" } });
        thumb.addEventListener("click", () => { const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener"; a.click(); });
        thumbRow.appendChild(thumb);
      });
      growParts.push(thumbRow);
    }
    list.appendChild(el("div", { class: "row" }, [
      el("div", { class: "grow" }, growParts),
      el("span", { class: "pill" }, w.branch),
    ]));
  }
  wrap.appendChild(list);
  wrap.appendChild(el("div", { class: "sticky-actions" }, [
    el("button", { class: "btn", onClick: () => go("waste_new") }, "+ New waste entry"),
    el("button", { class: "btn ghost", style: { marginTop: "8px" }, onClick: () => go("home") }, "← Home"),
  ]));
  return wrap;
};

routes.shift_close_new = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Shift Close", "Fill in every field before you leave. This is your end-of-shift report."));

  let branch   = u.branches[0];
  let date     = new Date().toISOString().slice(0,10);
  let cash     = "";
  let instapay = "";
  let cc       = "";
  let talabat_credit = "";
  let talabat_cash   = "";

  // Barista allowance drinks — dynamic rows [{who, drink}]
  // Returns all active baristas/head-baristas/managers/helpers assigned to the current branch.
  function getBaristaList() {
    const list = staffDir.shiftStaff(branch);
    return (list.length ? list : staffDir.shiftStaff()).map(x => x.name);
  }
  let baristaAllowanceDrinks = [{ who: "", drink: "" }];

  // Extra money notes (e.g. unexpected cash/visa surplus)
  let extraMoneyNotes = "";

  // Closing barista name
  let closingBarista = "";

  // Cinema hospitality free drinks — count + note
  let cinemaFreeCount = "";
  let cinemaFreeNote  = "";

  // Management drinks — dynamic rows [{who, drink}]
  const MANAGERS = ["Haïdi", "Luke", "Youssef"];
  let mgmtDrinks = [{ who: "Haïdi", drink: "" }];

  // Discount receipt photos — managed by makePhotoField
  let discountPhotoField = null;

  const hospitalityCountLabel = el("label", {});
  const hospitalityNoteLabel  = el("label", {});

  function drawHospitalityLabels() {
    const name = branch === "zawya" ? "Cinema hospitality drink" : "Hospitality drink";
    hospitalityCountLabel.textContent = `${name} — number of free drinks`;
    hospitalityNoteLabel.textContent  = `${name} — note (optional)`;
  }

  const branchPicker = makeBranchPicker(u.branches, () => branch, b => {
    branch = b;
    baristaAllowanceDrinks = [{ who: "", drink: "" }];
    drawBaristaAllowance();
    drawHospitalityLabels();
  });
  wrap.appendChild(branchPicker);

  const form = el("div", { class: "stack" });
  wrap.appendChild(form);

  function mkInput(type, value, onchange, placeholder) {
    const inp = el("input", { type, value: value || "", placeholder: placeholder || "" });
    inp.addEventListener("input", () => onchange(inp.value));
    return inp;
  }

  function drawMgmt() {
    mgmtBox.innerHTML = "";
    mgmtDrinks.forEach((row, idx) => {
      const rowEl = el("div", { style: { display: "flex", gap: "8px", marginTop: "8px", alignItems: "center" } }, [
        (() => {
          const sel = el("select", { style: { flex: "0 0 auto", width: "120px" } },
            MANAGERS.map(m => el("option", { value: m, selected: m === row.who ? "true" : null }, m)));
          sel.addEventListener("change", () => { row.who = sel.value; });
          return sel;
        })(),
        (() => {
          const inp = el("input", { type: "text", placeholder: "Drink name", value: row.drink, style: { flex: "1" } });
          inp.addEventListener("input", () => { row.drink = inp.value; });
          return inp;
        })(),
        el("button", { class: "btn ghost", style: { width: "auto", padding: "8px 12px" }, onClick: () => { mgmtDrinks.splice(idx, 1); drawMgmt(); } }, "✕"),
      ]);
      mgmtBox.appendChild(rowEl);
    });
  }
  const mgmtBox = el("div", {});

  function drawBaristaAllowance() {
    baristaAllowanceBox.innerHTML = "";
    baristaAllowanceDrinks.forEach((row, idx) => {
      const rowEl = el("div", { style: { display: "flex", gap: "8px", marginTop: "8px", alignItems: "center" } }, [
        (() => {
          const sel = el("select", { style: { flex: "0 0 auto", width: "130px" } },
            [el("option", { value: "" }, "— who? —"),
             ...[...new Set([...staffDir.shiftStaff().map(x => x.name), "Mohamed", "Bakr"])].map(b => el("option", { value: b, selected: b === row.who ? "true" : null }, b))]);
          sel.addEventListener("change", () => { row.who = sel.value; });
          return sel;
        })(),
        (() => {
          const inp = el("input", { type: "text", placeholder: "Drink name", value: row.drink, style: { flex: "1" } });
          inp.addEventListener("input", () => { row.drink = inp.value; });
          return inp;
        })(),
        el("button", { class: "btn ghost", style: { width: "auto", padding: "8px 12px" }, onClick: () => { baristaAllowanceDrinks.splice(idx, 1); drawBaristaAllowance(); } }, "✕"),
      ]);
      baristaAllowanceBox.appendChild(rowEl);
    });
  }
  const baristaAllowanceBox = el("div", {});

  function draw() {
    form.innerHTML = "";

    form.appendChild(el("label", {}, "Date"));
    const dInput = el("input", { type: "date", value: date });
    dInput.addEventListener("input", () => date = dInput.value);
    form.appendChild(dInput);

    form.appendChild(el("label", {}, "Closing barista"));
    const cbSel = el("select", {},
      [el("option", { value: "" }, "— select barista —"),
       ...getBaristaList().map(b => el("option", { value: b, selected: b === closingBarista ? "true" : null }, b))]);
    cbSel.addEventListener("change", () => { closingBarista = cbSel.value; });
    form.appendChild(cbSel);

    // ── Cash & digital payments ──
    form.appendChild(el("h2", { style: { marginTop: "14px" } }, "Payments received"));
    form.appendChild(el("label", {}, "Cash (EGP)"));
    form.appendChild(mkInput("number", cash, v => cash = v, "0.00"));
    form.appendChild(el("label", {}, "Instapay (EGP)"));
    form.appendChild(mkInput("number", instapay, v => instapay = v, "0.00"));
    form.appendChild(el("label", {}, "Customer credit card (EGP)"));
    form.appendChild(mkInput("number", cc, v => cc = v, "0.00"));
    form.appendChild(el("label", {}, "Talabat — credit"));
    form.appendChild(mkInput("number", talabat_credit, v => talabat_credit = v, "0.00"));
    form.appendChild(el("label", {}, "Talabat — cash"));
    form.appendChild(mkInput("number", talabat_cash, v => talabat_cash = v, "0.00"));

    const totalShift = (Number(cash)||0) + (Number(instapay)||0) + (Number(cc)||0) + (Number(talabat_credit)||0) + (Number(talabat_cash)||0);
    form.appendChild(el("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: "10px", padding: "10px 12px", background: "var(--surface2, #f5f5f5)", borderRadius: "8px", fontWeight: "600" } }, [
      el("span", {}, "Total shift payments"),
      el("span", { class: "pill" }, `EGP ${totalShift.toFixed(2)}`),
    ]));

    form.appendChild(el("label", { style: { marginTop: "10px" } }, "Extra money — notes (visa or cash surplus/discrepancy)"));
    const emInp = el("textarea", { placeholder: "e.g. Visa machine had EGP 50 extra · Cash drawer over by EGP 20", rows: "2", style: { resize: "vertical" } }, extraMoneyNotes);
    emInp.addEventListener("input", () => extraMoneyNotes = emInp.value);
    form.appendChild(emInp);

    // ── Complimentary drinks ──
    form.appendChild(el("h2", { style: { marginTop: "14px" } }, "Complimentary drinks"));

    form.appendChild(el("div", { class: "muted small" }, "Log each drink per barista — who had what. Enter all complimentary drinks on Foodics using the relevant discount code."));
    form.appendChild(baristaAllowanceBox);
    drawBaristaAllowance();
    form.appendChild(el("button", {
      class: "btn ghost",
      style: { marginTop: "8px" },
      onClick: () => { baristaAllowanceDrinks.push({ who: "", drink: "" }); drawBaristaAllowance(); },
    }, "+ Add barista drink"));

    drawHospitalityLabels();
    form.appendChild(hospitalityCountLabel);
    form.appendChild(mkInput("number", cinemaFreeCount, v => cinemaFreeCount = v, "0"));
    form.appendChild(hospitalityNoteLabel);
    form.appendChild(mkInput("text", cinemaFreeNote, v => cinemaFreeNote = v, "e.g. Screening room, group of 8"));

    // ── Management drinks ──
    form.appendChild(el("h2", { style: { marginTop: "14px" } }, "Management drinks"));
    form.appendChild(el("div", { class: "muted small" }, "Log each drink consumed by Haïdi, Luke, or Youssef — who had what."));
    form.appendChild(mgmtBox);
    drawMgmt();
    form.appendChild(el("button", {
      class: "btn ghost",
      style: { marginTop: "8px" },
      onClick: () => { mgmtDrinks.push({ who: "Haïdi", drink: "" }); drawMgmt(); },
    }, "+ Add management drink"));

    // ── Discount receipts ──
    discountPhotoField = makePhotoField({ label: "Discounts — signed receipt photo(s)", formLabel: "Shift Close" });
    form.appendChild(discountPhotoField.el);

    form.appendChild(el("div", { class: "sticky-actions" }, [
      el("button", { class: "btn", onClick: () => submit() }, "Submit shift close"),
      el("button", { class: "btn ghost", style: { marginTop: "8px" }, onClick: () => go("home") }, "← Back to home"),
    ]));
  }
  draw();

  function submit() {
    if (!date) return toast("Pick a date", "error");
    if (cash === "" && instapay === "" && cc === "" && talabat_credit === "" && talabat_cash === "")
      return toast("Enter at least one payment amount", "error");

    const s = stamp();
    const doSave = async () => {
      const dpBlobs = discountPhotoField ? discountPhotoField.getBlobs() : [];
      const dpNames = dpBlobs.map(f => f.name);
      const discountPhotoIds = [];
      for (const pb of dpBlobs) {
        const pid = uuid();
        try { await IDB.put(pid, pb); } catch (e) { console.warn(e); }
        discountPhotoIds.push(pid);
      }
      const photoId = discountPhotoIds[0] || null;
      state.shift_closes.push({
        id: uuid(), at: s.at, by: s.by, by_name: s.by_name, device: s.device,
        branch, date,
        closing_barista: closingBarista,
        cash:            Number(cash)           || 0,
        instapay:        Number(instapay)       || 0,
        cc:              Number(cc)             || 0,
        talabat_credit:  Number(talabat_credit) || 0,
        talabat_cash:    Number(talabat_cash)   || 0,
        extra_money_notes: extraMoneyNotes.trim(),
        barista_allowance_drinks: baristaAllowanceDrinks.filter(r => r.drink.trim()),
        cinema_free_count: Number(cinemaFreeCount) || 0,
        cinema_free_note:  cinemaFreeNote.trim(),
        mgmt_drinks: mgmtDrinks.filter(r => r.drink.trim()),
        discount_photo_id: photoId,
        discount_photo_ids: discountPhotoIds,
        discount_photo_names: dpNames,
        discount_drive_ids: discountPhotoField ? discountPhotoField.getDriveIds() : [],
      });
      saveState();
      if (dpNames.length) {
        showPhotoConfirm({
          title: "Shift close submitted!",
          names: dpNames,
          driveIds: discountPhotoField ? discountPhotoField.getDriveIds() : [],
          onDone: () => go("shift_close_list"),
        });
      } else {
        toast("Shift close submitted ✓");
        go("shift_close_list");
      }
    };
    doSave();
  }

  return wrap;
};

      el("div", { class: "muted small" }, `Mgmt drinks: ${mgmt}`),
      c.discount_photo_id ? el("div", { class: "muted small", style: { color: "var(--ok)" } }, "📷 Discount receipt photo attached") : null,
