// Legacy IndexedDB kept for any previously stored uploads
(function setupHandbookDB() {
  const DB = "coffee-beats-handbook", STORE = "files";
  window._hdbInstance = null;
  window._openHandbookDB = () => {
    if (window._hdbInstance) return Promise.resolve(window._hdbInstance);
    return new Promise((res, rej) => {
      const req = indexedDB.open(DB, 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore(STORE);
      req.onsuccess = e => { window._hdbInstance = e.target.result; res(e.target.result); };
      req.onerror = e => rej(e.target.error);
    });
  };
  window._saveHandbook = async (file, uploader) => {
    const data = await file.arrayBuffer();
    const db = await window._openHandbookDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put({ name: file.name, type: file.type, data, uploadedAt: new Date().toISOString(), uploadedBy: uploader || "" }, "handbook");
      tx.oncomplete = () => res();
      tx.onerror = e => rej(e.target.error);
    });
  };
  window._loadHandbook = async () => {
    const db = await window._openHandbookDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, "readonly");
      const req = tx.objectStore(STORE).get("handbook");
      req.onsuccess = e => res(e.target.result || null);
      req.onerror = e => rej(e.target.error);
    });
  };
})();

// ==============================================================
// LEAVE — REQUEST (annual / sick)
// All roles can access; baristas auto-select themselves.
// Head barista / owner can submit on behalf of any barista.
// Leave must start at least 7 days from today.
// On submit: mailto: → head barista (To:), owner (CC:)
// ==============================================================
routes.leave_new = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Request Leave", "Submit annual or sick leave. Annual leave requires 1 week notice; sick leave is recorded immediately."));

  state.leaves = state.leaves || [];

  const canRequestForOthers = (u.role === "owner" || u.role === "head_barista");
  const staff = state.users.filter(x => x.active && (x.role === "barista" || x.role === "head_barista"));

  const today = new Date().toISOString().slice(0, 10);
  // Minimum start date for annual leave = today + 7 days
  const minAnnual = (() => {
    const d = new Date(); d.setDate(d.getDate() + 7);
    return d.toISOString().slice(0, 10);
  })();

  const form = el("div", { class: "card", style: { marginTop: "12px" } });

  // Who is this leave for?
  let targetUserId = u.id;
  if (canRequestForOthers) {
    form.appendChild(el("label", {}, "Leave for (barista)"));
    const staffSel = el("select", {});
    for (const s of staff) {
      const o = el("option", { value: s.id }, s.name);
      if (s.id === u.id) o.selected = true;
      staffSel.appendChild(o);
    }
    staffSel.addEventListener("change", () => { targetUserId = staffSel.value; });
    form.appendChild(staffSel);
  } else {
    form.appendChild(el("div", { class: "kv" }, [
      el("div", { class: "k" }, "Requesting for"),
      el("div", { class: "v" }, el("b", {}, u.name)),
    ]));
  }

  // Leave type
  form.appendChild(el("label", {}, "Leave type"));
  const typeSel = el("select", {}, [
    el("option", { value: "annual" }, "🌴 Annual Leave"),
    el("option", { value: "sick"   }, "🤒 Sick Leave"),
  ]);
  form.appendChild(typeSel);

  // Dates — sick leave defaults to today with no minimum; annual requires 7-day notice
  const fromLabel = el("div", { class: "label" }, `From date (earliest for annual: ${minAnnual})`);
  form.appendChild(fromLabel);
  const fromIn = el("input", { type: "date", min: minAnnual, value: minAnnual });
  form.appendChild(fromIn);

  form.appendChild(el("label", {}, "To date"));
  const toIn = el("input", { type: "date", min: minAnnual, value: minAnnual });
  form.appendChild(toIn);

  // Adjust date constraints when type changes
  function updateDateConstraints() {
    const isSick = typeSel.value === "sick";
    const minVal = isSick ? today : minAnnual;
    fromIn.min = minVal;
    toIn.min   = minVal;
    if (isSick) {
      fromIn.value = today;
      toIn.value   = today;
      fromLabel.textContent = "From date";
    } else {
      fromIn.value = minAnnual;
      toIn.value   = minAnnual;
      fromLabel.textContent = `From date (earliest: ${minAnnual})`;
    }
  }
  typeSel.addEventListener("change", updateDateConstraints);

  // Keep to ≥ from as user changes from
  fromIn.addEventListener("change", () => {
    if (toIn.value < fromIn.value) toIn.value = fromIn.value;
    toIn.min = fromIn.value;
  });

  // Reason
  form.appendChild(el("label", {}, "Reason (optional)"));
  const reasonIn = el("textarea", { rows: "3", placeholder: "Brief reason for leave…" });
  form.appendChild(reasonIn);

  wrap.appendChild(form);

  const submitBtn = el("button", { class: "btn", style: { marginTop: "14px" } }, "📩 Submit Leave Request");
  submitBtn.addEventListener("click", () => {
    const from = fromIn.value;
    const to   = toIn.value;
    if (!from || !to) return toast("Please fill in both dates", "error");
    if (to < from)    return toast("End date can't be before start date", "error");
    const isSick = typeSel.value === "sick";
    if (!isSick && from < minAnnual) return toast(`Annual leave must start at least 7 days from today (${minAnnual})`, "error");

    const person = canRequestForOthers
      ? state.users.find(x => x.id === targetUserId)
      : u;
    if (!person) return toast("Could not find selected barista", "error");

    // Check for overlapping approved/pending leaves for this person
    const overlap = (state.leaves || []).find(l =>
      l.user_id === person.id &&
      (l.status === "approved" || l.status === "pending") &&
      l.from_date <= to && l.to_date >= from
    );
    if (overlap) {
      return toast(`${person.name} already has a ${overlap.status} leave overlapping those dates`, "error");
    }

    const s = stamp();
    // Sick leave is auto-approved immediately; annual leave goes through approval flow
    const leave = {
      id: uuid(),
      user_id: person.id,
      user_name: person.name,
      type: typeSel.value,
      from_date: from,
      to_date: to,
      reason: reasonIn.value.trim(),
      status: isSick ? "approved" : "pending",
      requested_by: s.by,
      requested_by_name: s.by_name,
      requested_at: s.at,
      reviewed_by: isSick ? s.by : null,
      reviewed_by_name: isSick ? s.by_name : null,
      reviewed_at: isSick ? s.at : null,
      review_note: isSick ? "Auto-approved" : "",
    };
    state.leaves.push(leave);

    // Sick leave: immediately create salary deduction (¼ day per sick day)
    if (isSick) {
      const days = Math.round((new Date(to) - new Date(from)) / 86400000) + 1;
      const mon  = from.slice(0, 7);
      const sal  = getSalaryForMonth(person.id, mon);
      const amount = Math.round((sal / 30 / 4) * days * 100) / 100;
      state.sick_leave_deductions = state.sick_leave_deductions || [];
      state.sick_leave_deductions.push({
        id: uuid(), leave_id: leave.id,
        user_id: person.id, barista: person.name,
        days, amount, date: from,
        month: mon,
        note: leave.reason || "Sick leave",
        by: s.by, by_name: s.by_name, at: s.at,
      });
    }

    saveState();

    // Count calendar days
    const days = Math.round((new Date(to) - new Date(from)) / 86400000) + 1;

    // Send notification email
    const hbEmail    = (state.settings.head_barista_email || "").trim();
    const ownerEmail = (state.settings.owner_email || "coffeebeats@haidiyacoub.com").trim();
    const typeLabel  = leave.type === "annual" ? "Annual Leave" : "Sick Leave";
    const subj = encodeURIComponent(
      isSick
        ? `[Sick Leave Recorded] ${person.name} · ${from} → ${to} (${days}d) — deduction applied`
        : `[Leave Request] ${person.name} · ${typeLabel} · ${from} → ${to} (${days}d)`
    );
    const body = encodeURIComponent(
      isSick
        ? `Sick leave has been recorded and the salary deduction applied automatically.\n\n` +
          `Barista: ${person.name}\nFrom: ${from}\nTo: ${to}\n` +
          `Duration: ${days} day${days > 1 ? "s" : ""}\nReason: ${leave.reason || "—"}\n` +
          `Deduction: ¼ day × ${days} = EGP ${(getSalaryForMonth(person.id, from.slice(0,7)) / 30 / 4 * days).toFixed(2)}\n` +
          `Submitted by: ${s.by_name}\n— Coffee Beats Operations`
        : `A leave request has been submitted and is pending your approval.\n\n` +
          `Barista: ${person.name}\n` +
          `Leave type: ${typeLabel}\n` +
          `From: ${from}\n` +
          `To: ${to}\n` +
          `Duration: ${days} day${days > 1 ? "s" : ""}\n` +
          `Reason: ${leave.reason || "—"}\n` +
          `Submitted by: ${s.by_name}\n\n` +
          `Please log in to the Operations app → Leave Requests to approve or reject.\n\n` +
          `— Coffee Beats Operations`
    );

    const to_addr    = hbEmail || ownerEmail;
    const cc_part    = hbEmail ? `&cc=${encodeURIComponent(ownerEmail)}` : "";
    const leaveSubj  = hbEmail ? subj : encodeURIComponent(
      isSick
        ? `[PRIORITY — No Head Barista] [Sick Leave Recorded] ${person.name} · ${from} → ${to} (${days}d) — deduction applied`
        : `[PRIORITY — No Head Barista] [Leave Request] ${person.name} · ${typeLabel} · ${from} → ${to} (${days}d)`
    );
    try {
      window.open(`mailto:${encodeURIComponent(to_addr)}?subject=${leaveSubj}${cc_part}&body=${body}`, "_blank");
    } catch(e) {}

    toast(isSick
      ? `Sick leave recorded · ${days} day${days > 1 ? "s" : ""} · deduction applied automatically ✓`
      : `Leave request submitted for ${person.name} · ${days} day${days > 1 ? "s" : ""} · Email sent ✉️`
    );
    go("leave_list");
  });
  wrap.appendChild(submitBtn);
  wrap.appendChild(btnBack());
  return wrap;
};

// ==============================================================
// LEAVE — LIST / MANAGE
// Owner + Head Barista: see all leaves, can approve or reject pending ones.
// Barista: sees only their own leaves, can cancel pending ones.
// ==============================================================
routes.leave_list = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Leave Requests", "View, approve, and reject leave requests."));

  state.leaves = state.leaves || [];

  const canManage = (u.role === "owner" || u.role === "head_barista");

  // Filter leaves visible to this user
  const visible = canManage
    ? [...state.leaves].sort((a, b) => b.requested_at.localeCompare(a.requested_at))
    : state.leaves.filter(l => l.user_id === u.id).sort((a, b) => b.requested_at.localeCompare(a.requested_at));

  if (canManage) {
    wrap.appendChild(el("div", { class: "banner-arch" },
      "Approve or reject pending leave requests. Approved leaves block the barista from being assigned in the Weekly Schedule for those days."));
    wrap.appendChild(el("button", {
      class: "btn secondary",
      style: { marginTop: "10px", marginBottom: "4px" },
      onClick: () => go("leave_new"),
    }, "➕ Submit New Leave Request"));
  } else {
    wrap.appendChild(el("div", { class: "banner-arch" },
      "Your leave requests — you can cancel pending requests. Approved leaves cannot be cancelled here; contact the head barista."));
    wrap.appendChild(el("button", {
      class: "btn secondary",
      style: { marginTop: "10px", marginBottom: "4px" },
      onClick: () => go("leave_new"),
    }, "➕ Request New Leave"));
  }

  const list = el("div", { class: "list", style: { marginTop: "12px" } });
  wrap.appendChild(list);

  function draw() {
    list.innerHTML = "";
    const src = canManage
      ? [...state.leaves].sort((a, b) => b.requested_at.localeCompare(a.requested_at))
      : state.leaves.filter(l => l.user_id === u.id).sort((a, b) => b.requested_at.localeCompare(a.requested_at));

    if (!src.length) {
      list.appendChild(el("div", { class: "card muted" }, "No leave requests yet."));
      return;
    }

    for (const leave of src) {
      const days = Math.round((new Date(leave.to_date) - new Date(leave.from_date)) / 86400000) + 1;
      const typeLabel  = leave.type === "annual" ? "🌴 Annual" : "🤒 Sick";
      const statusColor = leave.status === "approved"  ? "var(--ok)"
                        : leave.status === "rejected"  ? "var(--bad)"
                        : leave.status === "cancelled" ? "var(--ink-faint)"
                        : "var(--warn)";
      const statusLabel = leave.status.charAt(0).toUpperCase() + leave.status.slice(1);

      const card = el("div", { class: "card", style: { marginTop: "8px" } });

      // Header row: name + type + status badge
      const hdr = el("div", { style: { display: "flex", alignItems: "center", gap: "8px", marginBottom: "8px" } });
      hdr.appendChild(el("div", { style: { fontWeight: "700", flex: "1" } }, `${leave.user_name}`));
      hdr.appendChild(el("span", { class: "pill" }, typeLabel));
      hdr.appendChild(el("span", { class: "pill", style: { color: statusColor, borderColor: statusColor } }, statusLabel));
      card.appendChild(hdr);

      // Dates & duration
      card.appendChild(el("div", { class: "kv" }, [
        el("div", { class: "k" }, "Dates"),
        el("div", { class: "v" }, `${leave.from_date} → ${leave.to_date}  (${days} day${days > 1 ? "s" : ""})`),
      ]));
      if (leave.reason) {
        card.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, "Reason"),
          el("div", { class: "v" }, leave.reason),
        ]));
      }
      card.appendChild(el("div", { class: "kv" }, [
        el("div", { class: "k" }, "Requested by"),
        el("div", { class: "v" }, `${leave.requested_by_name} · ${fmtDate(leave.requested_at)}`),
      ]));
      if (leave.reviewed_by_name) {
        card.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, `${statusLabel} by`),
          el("div", { class: "v" }, `${leave.reviewed_by_name} · ${fmtDate(leave.reviewed_at)}`),
        ]));
      }
      if (leave.review_note) {
        card.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, "Note"),
          el("div", { class: "v" }, leave.review_note),
        ]));
      }

      // Helper: remove the linked sick_leave_deduction when sick leave is cancelled/rejected
      function removeSickDeduction() {
        if (leave.type !== "sick") return;
        state.sick_leave_deductions = (state.sick_leave_deductions || []).filter(x => x.leave_id !== leave.id);
      }

      // Action buttons
      if (leave.status === "pending") {
        const btnRow = el("div", { class: "btn-row", style: { marginTop: "10px" } });

        if (canManage && leave.type !== "sick") {
          const approveBtn = el("button", { class: "btn", style: { background: "var(--ok)", color: "#fff" } }, "✓ Approve");
          approveBtn.addEventListener("click", () => {
            const note = prompt("Approval note (optional):") || "";
            const s = stamp();
            leave.status = "approved";
            leave.reviewed_by = s.by;
            leave.reviewed_by_name = s.by_name;
            leave.reviewed_at = s.at;
            leave.review_note = note;
            saveState();
            // Notify barista by email
            const person = state.users.find(x => x.id === leave.user_id);
            const personEmail = (person && person.email || "").trim();
            const ownerEmail  = (state.settings.owner_email || "coffeebeats@haidiyacoub.com").trim();
            if (personEmail) {
              const subj = encodeURIComponent(`[Leave Approved] ${leave.from_date} → ${leave.to_date}`);
              const body = encodeURIComponent(
                `Your leave request has been approved.\n\n` +
                `Type: ${leave.type === "annual" ? "Annual Leave" : "Sick Leave"}\n` +
                `From: ${leave.from_date}\nTo: ${leave.to_date}\n` +
                (note ? `Note: ${note}\n` : "") +
                `\nApproved by: ${s.by_name}\n— Coffee Beats Operations`
              );
              try { window.open(`mailto:${encodeURIComponent(personEmail)}?cc=${encodeURIComponent(ownerEmail)}&subject=${subj}&body=${body}`, "_blank"); } catch(e) {}
            }
            toast(`Leave approved for ${leave.user_name}`);
            draw();
          });

          const rejectBtn = el("button", { class: "btn danger" }, "✕ Reject");
          rejectBtn.addEventListener("click", () => {
            const note = prompt("Reason for rejection (required):") || "";
            if (!note.trim()) return toast("Please provide a rejection reason", "error");
            const s = stamp();
            leave.status = "rejected";
            leave.reviewed_by = s.by;
            leave.reviewed_by_name = s.by_name;
            leave.reviewed_at = s.at;
            leave.review_note = note;
            removeSickDeduction();
            saveState();
            toast(`Leave rejected for ${leave.user_name}`);
            draw();
          });

          btnRow.appendChild(approveBtn);
          btnRow.appendChild(rejectBtn);
        }

        // Barista can cancel their own pending leave; head barista/owner can also cancel
        if (!canManage && leave.user_id === u.id || canManage) {
          const cancelBtn = el("button", { class: "btn ghost" }, "Cancel Request");
          cancelBtn.addEventListener("click", () => {
            if (!confirm("Cancel this leave request?")) return;
            const s = stamp();
            leave.status = "cancelled";
            leave.reviewed_by = s.by;
            leave.reviewed_by_name = s.by_name;
            leave.reviewed_at = s.at;
            leave.review_note = "Cancelled";
            removeSickDeduction();
            saveState();
            toast("Leave request cancelled");
            draw();
          });
          btnRow.appendChild(cancelBtn);
        }

        card.appendChild(btnRow);
      } else if (leave.status === "approved" && canManage) {
        // Allow head barista/owner to revoke an approval (barista situation changed)
        const revokeBtn = el("button", {
          class: "btn ghost",
          style: { marginTop: "10px", width: "auto" },
        }, "↩ Revoke Approval");
        revokeBtn.addEventListener("click", () => {
          if (!confirm(`Revoke approval for ${leave.user_name}'s leave (${leave.from_date} → ${leave.to_date})? This will make the barista available in the schedule again.`)) return;
          const s = stamp();
          leave.status = "rejected";
          leave.reviewed_by = s.by;
          leave.reviewed_by_name = s.by_name;
          leave.reviewed_at = s.at;
          leave.review_note = "Approval revoked";
          removeSickDeduction();
          saveState();
          toast(`Approval revoked — ${leave.user_name} is now available in the schedule`);
          draw();
        });
        card.appendChild(revokeBtn);
      }

      list.appendChild(card);
    }
  }

  draw();
  wrap.appendChild(btnBack());
  return wrap;
};

  if (!state.om_overrides)    state.om_overrides    = {};
  if (!state.om_ar_overrides) state.om_ar_overrides = {};

  const canEditOM = u && ["owner", "head_barista"].includes(u.role);
  const operatingModelSection = el("div", {});

  function buildOMSection() {
    operatingModelSection.innerHTML = "";
    const isAr = lang === "ar";
    OM_SECTIONS.forEach(sec => {
      const card = el("div", { class: "card", style: { marginBottom: "14px", padding: "0", overflow: "hidden", border: "1px solid var(--border)", borderRadius: "8px" } });

      const cardHead = el("div", { style: { background: "#3b2314", color: "#f5e6d3", padding: "10px 14px", display: "flex", alignItems: "center", justifyContent: "space-between", direction: isAr ? "rtl" : "ltr" } });
      cardHead.appendChild(el("div", { style: { fontWeight: "700", fontSize: "14px", letterSpacing: "0.3px" } }, `${sec.number}. ${isAr ? sec.ar_title : sec.title}`));

      if (canEditOM) {
        const editBtn = el("button", { style: { background: "rgba(255,255,255,0.15)", color: "#f5e6d3", border: "none", borderRadius: "4px", padding: "3px 10px", fontSize: "12px", cursor: "pointer" } }, "Edit");
        cardHead.appendChild(editBtn);
        editBtn.addEventListener("click", () => {
          editForm.style.display = editForm.style.display === "none" ? "" : "none";
          if (editForm.style.display !== "none") {
            const currentContent = isAr
              ? (state.om_ar_overrides[sec.number] || state.om_overrides[sec.number] || sec.ar_content)
              : (state.om_overrides[sec.number] || sec.content);
            ta.value = omContentToText(currentContent);
            ta.focus();
          }
        });
      }
      card.appendChild(cardHead);

      const body = el("div", { style: { padding: "12px 14px", direction: isAr ? "rtl" : "ltr" } });
      // Rule: English edits always reflect in Arabic (Arabic falls back to English override, then to default Arabic)
      const currentContent = isAr
        ? (state.om_ar_overrides[sec.number] || state.om_overrides[sec.number] || sec.ar_content)
        : (state.om_overrides[sec.number] || sec.content);
      renderOMBody(currentContent, body);
      card.appendChild(body);

      const editForm = el("div", { style: { display: "none", padding: "12px 14px", borderTop: "1px solid var(--border)", background: "var(--surface-2)" } });
      if (canEditOM) {
        const hint = el("div", { style: { fontSize: "11.5px", color: "var(--ink-dim)", marginBottom: "6px" } },
          isAr
            ? "أسطر تبدأ بـ ## = عنوان فرعي  ·  أسطر تبدأ بـ - = نقطة  ·  غيرها = فقرة"
            : "Lines starting with ## = sub-header  ·  Lines starting with - = bullet  ·  Other lines = paragraph");
        const ta = el("textarea", { style: { width: "100%", minHeight: "180px", fontSize: "13px", lineHeight: "1.6", padding: "8px", borderRadius: "6px", border: "1px solid var(--border)", background: "var(--bg)", color: "var(--ink)", fontFamily: "monospace", boxSizing: "border-box", resize: "vertical", direction: isAr ? "rtl" : "ltr" } });
        const btnRow = el("div", { style: { display: "flex", gap: "8px", marginTop: "8px" } });
        const saveBtn   = el("button", { class: "btn", style: { flex: "1" } }, isAr ? "حفظ" : "Save");
        const resetBtn  = el("button", { class: "btn ghost", style: { flex: "1" } }, isAr ? "إعادة ضبط" : "Reset to default");
        const cancelBtn = el("button", { class: "btn ghost" }, isAr ? "إلغاء" : "Cancel");
        btnRow.append(saveBtn, resetBtn, cancelBtn);
        editForm.append(hint, ta, btnRow);

        saveBtn.addEventListener("click", () => {
          const parsed = omTextToContent(ta.value);
          if (isAr) {
            state.om_ar_overrides[sec.number] = parsed;
          } else {
            state.om_overrides[sec.number] = parsed;
            // Rule: English edit reflects in Arabic — clear any stale Arabic-specific override
            // so Arabic falls back to this updated English content
            delete state.om_ar_overrides[sec.number];
          }
          saveState();
          renderOMBody(parsed, body);
          editForm.style.display = "none";
          toast("Section updated", "ok");
        });
        resetBtn.addEventListener("click", () => {
          if (isAr) {
            delete state.om_ar_overrides[sec.number];
            const fallback = state.om_overrides[sec.number] || sec.ar_content;
            renderOMBody(fallback, body);
          } else {
            delete state.om_overrides[sec.number];
            delete state.om_ar_overrides[sec.number];
            renderOMBody(sec.content, body);
          }
          saveState();
          editForm.style.display = "none";
          toast("Reset to default", "ok");
        });
        cancelBtn.addEventListener("click", () => { editForm.style.display = "none"; });
      }
      card.appendChild(editForm);
      operatingModelSection.appendChild(card);
    });
  }

  buildOMSection();

  function omContentToText(content) {
    return content.map(item => {
      if (item.type === "para")      return item.text;
      if (item.type === "subheader") return "## " + item.text;
      if (item.type === "bullets")   return item.items.map(i => "- " + i.replace(/<[^>]+>/g, "")).join("\n");
      return "";
    }).join("\n\n");
  }

  function omTextToContent(text) {
    const lines = text.split("\n");
    const result = [];
    let bullets = [];
    for (const raw of lines) {
      const line = raw.trimEnd();
      if (!line.trim()) {
        if (bullets.length) { result.push({ type: "bullets", items: [...bullets] }); bullets = []; }
        continue;
      }
      if (line.startsWith("## ")) {
        if (bullets.length) { result.push({ type: "bullets", items: [...bullets] }); bullets = []; }
        result.push({ type: "subheader", text: line.slice(3).trim() });
      } else if (line.startsWith("- ")) {
        bullets.push(line.slice(2).trim());
      } else {
        if (bullets.length) { result.push({ type: "bullets", items: [...bullets] }); bullets = []; }
        result.push({ type: "para", text: line.trim() });
      }
    }
    if (bullets.length) result.push({ type: "bullets", items: bullets });
    return result;
  }

  function renderOMBody(content, bodyEl) {
    bodyEl.innerHTML = "";
    content.forEach(item => {
      if (item.type === "para") {
        const p = el("p", { style: { fontSize: "13.5px", lineHeight: "1.65", color: "var(--ink)", margin: "0 0 10px" } });
        p.textContent = item.text;
        bodyEl.appendChild(p);
      } else if (item.type === "subheader") {
        bodyEl.appendChild(el("div", { style: { fontWeight: "700", fontSize: "13px", color: "var(--ink)", margin: "10px 0 6px" } }, item.text));
      } else if (item.type === "bullets") {
        const ul = el("ul", { style: { margin: "0 0 10px", paddingInlineStart: "18px", fontSize: "13px", lineHeight: "1.65", color: "var(--ink)" } });
        item.items.forEach(txt => {
          const li = el("li", { style: { marginBottom: "5px" } });
          li.innerHTML = txt;
          ul.appendChild(li);
        });
        bodyEl.appendChild(ul);
      }
    });
  }

  function renderSections() {
    recipesSection.style.display = activeTab === "recipes" ? "" : "none";
    operatingModelSection.style.display = activeTab === "operating_model" ? "" : "none";
  }
  renderSections();

  // ── Recipe editor modal ──
  function openRecipeEditor(existing) {
    const isNew = !existing;
    const draft = existing ? { ...existing, ingredients: [...(existing.ingredients||[])], steps: [...(existing.steps||[])] }
                           : { id: uuid(), category: "", name: "", size: "", time: "", coffee_notes: "", description: "", ingredients: [""], steps: [""] };

    const root = document.querySelector("#modal-root");
    root.innerHTML = "";
    const sheet = el("div", { class: "sheet", onClick: e => { if (e.target === sheet) root.innerHTML = ""; } });
    const inner = el("div", { class: "sheet-inner" });

    inner.appendChild(el("h2", { style: { marginBottom: "12px" } }, isNew ? "Add Recipe" : "Edit Recipe"));

    // Category
    inner.appendChild(el("label", {}, "Category"));
    const catIn = el("input", { type: "text", value: draft.category, placeholder: "e.g. Iced Coffee" });
    catIn.addEventListener("input", () => draft.category = catIn.value.trim());
    inner.appendChild(catIn);

    // Name
    inner.appendChild(el("label", {}, "Recipe Name"));
    const nameIn = el("input", { type: "text", value: draft.name, placeholder: "e.g. Iced Lavender Latte" });
    nameIn.addEventListener("input", () => draft.name = nameIn.value.trim());
    inner.appendChild(nameIn);

    // Size / Time row
    const metaRow = el("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px" } });
    const sizeIn = el("input", { type: "text", value: draft.size, placeholder: "e.g. 16 oz" });
    sizeIn.addEventListener("input", () => draft.size = sizeIn.value.trim());
    const timeIn = el("input", { type: "text", value: draft.time, placeholder: "e.g. 5 min" });
    timeIn.addEventListener("input", () => draft.time = timeIn.value.trim());
    metaRow.appendChild(el("div", {}, [el("label", { style: { marginTop: "0" } }, "Cup Size"), sizeIn]));
    metaRow.appendChild(el("div", {}, [el("label", { style: { marginTop: "0" } }, "Prep Time"), timeIn]));
    inner.appendChild(metaRow);

    // Coffee notes (optional banner)
    inner.appendChild(el("label", {}, "Coffee Notes (optional — e.g. Coffee Type 1 · Extraction: 26–30 sec · Brew Ratio 1:2)"));
    const notesIn = el("input", { type: "text", value: draft.coffee_notes || "", placeholder: "Leave blank to hide the banner" });
    notesIn.addEventListener("input", () => draft.coffee_notes = notesIn.value.trim());
    inner.appendChild(notesIn);

    // Description
    inner.appendChild(el("label", {}, "Description"));
    const descIn = el("textarea", { placeholder: "Short description of this drink…", style: { minHeight: "56px", resize: "vertical" } });
    descIn.value = draft.description || "";
    descIn.addEventListener("input", () => draft.description = descIn.value.trim());
    inner.appendChild(descIn);

    // Ingredients dynamic list
    inner.appendChild(el("label", {}, "Ingredients"));
    const ingBox = el("div", {});
    function renderIngBox() {
      ingBox.innerHTML = "";
      draft.ingredients.forEach((ing, idx) => {
        const row = el("div", { style: { display: "flex", gap: "6px", marginBottom: "6px" } });
        const inp = el("input", { type: "text", value: ing, placeholder: "e.g. Espresso: 18 g", style: { flex: "1" } });
        inp.addEventListener("input", () => draft.ingredients[idx] = inp.value);
        const rem = el("button", { class: "btn ghost", style: { width: "auto", padding: "6px 10px", fontSize: "12px" } }, "✕");
        rem.addEventListener("click", () => { draft.ingredients.splice(idx, 1); renderIngBox(); });
        row.appendChild(inp); row.appendChild(rem);
        ingBox.appendChild(row);
      });
      const addIng = el("button", { class: "btn ghost", style: { fontSize: "12px", marginTop: "2px" } }, "+ Add ingredient");
      addIng.addEventListener("click", () => { draft.ingredients.push(""); renderIngBox(); });
      ingBox.appendChild(addIng);
    }
    renderIngBox();
    inner.appendChild(ingBox);

    // Steps dynamic list
    inner.appendChild(el("label", {}, "Preparation Steps"));
    const stepsBox = el("div", {});
    function renderStepsBox() {
      stepsBox.innerHTML = "";
      draft.steps.forEach((step, idx) => {
        const row = el("div", { style: { display: "flex", gap: "6px", marginBottom: "6px", alignItems: "flex-start" } });
        const num = el("span", { style: { padding: "12px 6px 0", fontSize: "13px", color: "var(--ink-dim)", flexShrink: "0" } }, `${idx+1}.`);
        const inp = el("textarea", { placeholder: "Describe step…", style: { flex: "1", minHeight: "48px", resize: "vertical" } });
        inp.value = step;
        inp.addEventListener("input", () => draft.steps[idx] = inp.value);
        const rem = el("button", { class: "btn ghost", style: { width: "auto", padding: "6px 10px", fontSize: "12px", marginTop: "6px" } }, "✕");
        rem.addEventListener("click", () => { draft.steps.splice(idx, 1); renderStepsBox(); });
        row.appendChild(num); row.appendChild(inp); row.appendChild(rem);
        stepsBox.appendChild(row);
      });
      const addStep = el("button", { class: "btn ghost", style: { fontSize: "12px", marginTop: "2px" } }, "+ Add step");
      addStep.addEventListener("click", () => { draft.steps.push(""); renderStepsBox(); });
      stepsBox.appendChild(addStep);
    }
    renderStepsBox();
    inner.appendChild(stepsBox);

    // Action buttons — Save/Cancel row on top, Delete below
    const topBtnRow = el("div", { class: "btn-row", style: { marginTop: "16px" } });

    const cancelBtn = el("button", { class: "btn ghost" }, "Cancel");
    cancelBtn.addEventListener("click", () => root.innerHTML = "");
    topBtnRow.appendChild(cancelBtn);

    const saveBtn = el("button", { class: "btn" }, isNew ? "Add Recipe" : "Save Changes");
    saveBtn.addEventListener("click", () => {
      if (!draft.name) { toast("Enter a recipe name."); return; }
      if (!draft.category) { toast("Enter a category."); return; }
      draft.ingredients = draft.ingredients.filter(x => x.trim());
      draft.steps = draft.steps.filter(x => x.trim());
      if (isNew) {
        state.handbook_recipes.push(draft);
      } else {
        const idx = state.handbook_recipes.findIndex(r => r.id === existing.id);
        if (idx >= 0) state.handbook_recipes[idx] = draft;
      }
      saveState(); root.innerHTML = ""; renderRecipes(); buildTabs();
      toast(isNew ? "Recipe added ✓" : "Recipe updated ✓");
    });
    topBtnRow.appendChild(saveBtn);
    inner.appendChild(topBtnRow);

    if (!isNew) {
      const delRow = el("div", { style: { marginTop: "10px" } });
      const delBtn = el("button", { class: "btn danger", style: { flex: "0 0 auto" } }, "Delete Recipe");
      delBtn.addEventListener("click", () => {
        if (!confirm(`Delete "${existing.name}"?`)) return;
        state.handbook_recipes = state.handbook_recipes.filter(r => r.id !== existing.id);
        saveState(); root.innerHTML = ""; renderRecipes(); buildTabs(); toast("Recipe deleted.");
      });
      delRow.appendChild(delBtn);
      inner.appendChild(delRow);
    }

    sheet.appendChild(inner);
    root.appendChild(sheet);
  }

  // ── Bottom action bar: Back + Export Recipes + Export Operating Model ──
  const handbookBar = el("div", { class: "sticky-actions", style: { display: "flex", gap: "8px", flexWrap: "wrap" } });
  handbookBar.appendChild(el("button", { class: "btn ghost", onClick: () => go("home") }, "← Back to home"));

  if (u.role === "owner") {
  const exportRecipesBtn = el("button", { class: "btn secondary", style: { marginLeft: "auto" } }, "⬇ Export Recipes");
  exportRecipesBtn.addEventListener("click", () => {
    const rows = (state.handbook_recipes || []).map(r => ({
      category: r.category, name: r.name, size: r.size, time: r.time,
      coffee_notes: r.coffee_notes || "", description: r.description || "",
      ingredients: (r.ingredients || []).join(" | "),
      steps: (r.steps || []).join(" | "),
    }));
    if (!rows.length) { toast("No recipes to export."); return; }
    const dateStr = new Date().toISOString().slice(0, 10);
    download(`cb-handbook-recipes-${dateStr}.csv`, new Blob([toCSV(rows)], { type: "text/csv" }));
    toast(`Exported ${rows.length} recipes`);
  });
  handbookBar.appendChild(exportRecipesBtn);

  const exportOMBtn = el("button", { class: "btn secondary" }, "⬇ Export Operating Model");
  exportOMBtn.addEventListener("click", () => {
    const rows = OM_SECTIONS.map(sec => {
      const content = state.om_overrides[sec.number] || sec.content;
      return {
        section: sec.number,
        title: sec.title,
        content: content.map(item => {
          if (item.type === "para")      return item.text;
          if (item.type === "subheader") return "## " + item.text;
          if (item.type === "bullets")   return item.items.map(i => "- " + i.replace(/<[^>]+>/g, "")).join("; ");
          return "";
        }).join(" | "),
      };
    });
    const dateStr = new Date().toISOString().slice(0, 10);
    download(`cb-handbook-om-${dateStr}.csv`, new Blob([toCSV(rows)], { type: "text/csv" }));
    toast(`Exported ${rows.length} sections`);
  });
  handbookBar.appendChild(exportOMBtn);
  } // end owner-only exports

  wrap.appendChild(handbookBar);
  return wrap;
};

routes.assets_new = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Upload Asset", "Store a file or document with a title and note."));

  let pendingUrl = "";
  let title = "";
  let note = "";
  let folder = "assets";

  const card = el("div", { class: "card" });

  // Title input
  card.appendChild(el("label", {}, "Title *"));
  const titleIn = el("input", { type: "text", placeholder: "e.g. Lease agreement, Equipment manual…" });
  titleIn.addEventListener("input", () => { title = titleIn.value.trim(); });
  card.appendChild(titleIn);

  // Note input
  card.appendChild(el("label", { style: { marginTop: "10px" } }, "Note (optional)"));
  const noteIn = el("input", { type: "text", placeholder: "Any additional context…" });
  noteIn.addEventListener("input", () => { note = noteIn.value.trim(); });

  const assetPhotoField = makePhotoField({ label: "File / Photo *", required: true, multiple: false, formLabel: "Asset Upload" });

  const submitBtn = el("button", { class: "btn", style: { marginTop: "14px" } }, "Save Asset");

      title,
      note,
      url: urls[0],
      folder: "assets",

    toast("Asset saved ✓");
    go("assets_list");

  wrap.appendChild(card);
  wrap.appendChild(btnBack());
  return wrap;
};

    ]));
    wrap.appendChild(btnBack());

    const groups = {};

                 color: "var(--ink)", cursor: ph.url ? "pointer" : "default" },
      };
      if (ph.url) { rowAttrs.href = ph.url; rowAttrs.target = "_blank"; rowAttrs.rel = "noopener"; }
      const row = el(rowTag, rowAttrs);

      // Thumbnail
      const thumb = el("div", {
        style: { flexShrink: "0", width: "72px", height: "72px", borderRadius: "8px",
                 overflow: "hidden", background: "var(--surface-2)", border: "1px solid var(--border)" },
      });
      if (ph.url) {
        // Cloudinary thumbnail: append w_72,h_72,c_fill transform
        const thumbUrl = ph.url.replace("/upload/", "/upload/w_144,h_144,c_fill/");
        thumb.appendChild(el("img", {
          src: thumbUrl, loading: "lazy",
          style: { width: "100%", height: "100%", objectFit: "cover", display: "block" },
        }));
      } else {
        thumb.appendChild(el("div", {
          style: { display: "flex", alignItems: "center", justifyContent: "center", height: "100%", fontSize: "26px" },
        }, "🖼"));
      }
      row.appendChild(thumb);

      // Info
      const info = el("div", { style: { flex: "1", minWidth: "0" } });
      info.appendChild(el("div", {
        style: { fontWeight: "600", fontSize: "13px", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" },
      }, ph.name || "photo"));
      info.appendChild(el("div", { class: "muted small", style: { marginTop: "3px" } },
        [ph.form || "", fmtPhotoDate(ph.at)].filter(Boolean).join(" · ")));
      if (ph.url) {
        info.appendChild(el("div", { style: { fontSize: "11px", color: "var(--accent)", marginTop: "4px", fontWeight: "600" } }, "Open full size ↗"));
      } else {
        info.appendChild(el("div", { class: "muted small", style: { marginTop: "4px", fontSize: "11px" } }, "Saved locally · not synced to cloud"));
      }
      row.appendChild(info);

      // Delete button — owner only
      if (u.role === "owner") {
        const delBtn = el("button", {
          style: {
            flexShrink: "0", background: "none", border: "none", cursor: "pointer",
            color: "var(--bad)", fontSize: "18px", padding: "8px", lineHeight: "1",
          },
          title: "Delete photo",
          onClick: (e) => {
            e.preventDefault(); e.stopPropagation();
            if (!confirm(`Delete "${ph.name || "this photo"}"? This only removes it from the log — the file on Cloudinary is unaffected.`)) return;
            state.photo_log = (state.photo_log || []).filter(p => p !== ph);
            saveState();
            toast("Photo removed from log");
            go("photo_gallery");
          },
        }, "🗑️");
        row.appendChild(delBtn);
      }

      listEl.appendChild(row);
    }
  }

  wrap.appendChild(listEl);
  wrap.appendChild(btnBack());
  return wrap;
};

/**
 * makePhotoField({ label, required, multiple, formLabel })
 * Returns { el, getBlobs(), getCloudUrls(), count() }
 * Renders a drag-drop zone with live thumbnail previews.
 * Auto-uploads to Cloudinary (free) if configured in Settings.
 * formLabel: used for photo_log context (e.g. "Cleaning Log")
 */
function makePhotoField({ label = "Photo(s)", required = false, multiple = true, formLabel = "" } = {}) {
  const container = el("div", { style: { marginTop: "12px" } });
  const labelEl = el("div", { style: { fontWeight: "600", fontSize: "14px", color: "var(--ink-dim)", marginBottom: "8px" } },
    label + (required ? " *" : " (optional)"));
  container.appendChild(labelEl);

  // Drop zone
  const dropZone = el("div", { class: "photo-drop" });
  const fileInput = el("input", { type: "file", accept: "image/*" });
  if (multiple) fileInput.setAttribute("multiple", "true");
  dropZone.appendChild(el("div", { class: "drop-icon" }, "📷"));
  dropZone.appendChild(el("div", { class: "drop-label" }, multiple ? "Tap to add photos" : "Tap to add a photo"));
  dropZone.appendChild(el("div", { class: "drop-sub" }, multiple ? "Multiple files OK · drag & drop supported" : "Drag & drop supported"));
  dropZone.appendChild(fileInput);
  container.appendChild(dropZone);

  // Preview grid
  const grid = el("div", { class: "photo-preview-grid" });
  container.appendChild(grid);

  let blobs = [];
  let cloudUrls = []; // Cloudinary secure_url per photo

  async function tryCloudUpload(file, idx, statusBar, badge) {
    if (!Cloudinary.isConfigured()) return;
    statusBar.className = "ph-status uploading";
    try {
      // Build filename: April28_CleaningLog_Seif
      const _now = new Date();
      const _months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      const _dateStamp = _months[_now.getMonth()] + _now.getDate();
      const _uploader = (typeof currentUser === "function" && currentUser()?.name)
        ? currentUser().name.split(" ")[0]
        : "Unknown";
      const _label = formLabel ? formLabel.replace(/\s+/g,"") : "Upload";
      const filename = `${_dateStamp}_${_label}_${_uploader}`;
      const data = await Cloudinary.uploadPhoto(file, filename);
      cloudUrls[idx] = data.secure_url;
      // Log to state for gallery
      if (typeof state !== "undefined") {
        state.photo_log = state.photo_log || [];
        state.photo_log.unshift({
          id: data.public_id,
          url: data.secure_url,
          name: file.name,
          form: formLabel || "Upload",
          at: new Date().toISOString(),
        });
        // Keep log manageable (latest 500)
        if (state.photo_log.length > 500) state.photo_log.length = 500;
        // Persist and sync to Firestore
        saveState();
      }
      statusBar.className = "ph-status done";
      badge.style.display = "block";
    } catch (e) {
      console.warn("Cloudinary upload:", e.message);
      statusBar.className = "ph-status error";
    }
  }

  function addFiles(files) {
    for (const file of files) {
      if (!file.type.startsWith("image/")) continue;
      const idx = blobs.length;
      blobs.push(file);
      cloudUrls.push(null);

      const wrap = el("div", { class: "photo-thumb-wrap" });
      const img = new Image();
      img.style.cssText = "width:100%;height:100%;object-fit:cover;display:block;";
      img.src = URL.createObjectURL(file);
      wrap.appendChild(img);

      const rmBtn = el("button", { class: "ph-remove" }, "×");
      rmBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        blobs.splice(idx, 1);
        cloudUrls.splice(idx, 1);
        URL.revokeObjectURL(img.src);
        wrap.remove();
      });
      wrap.appendChild(rmBtn);

      const statusBar = el("div", { class: "ph-status" });
      wrap.appendChild(statusBar);

      const badge = el("div", { class: "drive-badge", style: { display: "none" } }, "☁ Saved");
      wrap.appendChild(badge);

      grid.appendChild(wrap);
      tryCloudUpload(file, idx, statusBar, badge);
    }
  }

  fileInput.addEventListener("change", (e) => { addFiles([...e.target.files]); fileInput.value = ""; });
  dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("drag-over"); });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("drag-over"));
  dropZone.addEventListener("drop", (e) => { e.preventDefault(); dropZone.classList.remove("drag-over"); addFiles([...e.dataTransfer.files]); });

  return {
    el: container,
    getBlobs: () => blobs,
    getCloudUrls: () => cloudUrls,
    // backwards compat alias so existing submit code still works
    getDriveIds: () => cloudUrls,
    count: () => blobs.length,
  };
}

// Maps route names to a function that returns { rows: Array, name: String }
// for CSV export. btnBack() checks this and appends an export button automatically.
const ROUTE_EXPORTS = {
  waste_list:          () => ({ rows: state.waste || [], name: "waste" }),
  shift_close_list:    () => ({ rows: state.shift_closes || [], name: "shift-closes" }),
  reorder_action_list: () => ({ rows: state.reorder_actions || [], name: "reorder-actions" }),
  purchase_list:       () => ({
    rows: (state.purchases || []).flatMap(p =>
      (p.lines || []).map(l => ({ date: p.date || (p.at || "").slice(0,10), branch: p.branch, supplier: p.supplier, ...l }))),
    name: "purchases" }),
  petty_cash:          () => ({ rows: state.petty_cash || [], name: "petty-cash" }),
  penalties:           () => ({ rows: (state.penalties || []).filter(p => !p._deleted), name: "penalties" }),
  maadi_deposits:      () => ({ rows: state.maadi_deposits || [], name: "maadi-deposits" }),
  bank:                () => ({ rows: state.bank_ledger || [], name: "bank-ledger" }),
  shifts:              () => ({ rows: state.shifts || [], name: "shifts" }),
  cleaning_log_list:   () => ({ rows: state.cleaning_logs || [], name: "cleaning-logs" }),
  signin_stamp_list:   () => ({ rows: state.signin_stamps || [], name: "signin-stamps" }),
  leave_list:          () => ({ rows: state.leaves || [], name: "leaves" }),
  assets_list:         () => ({ rows: state.assets || [], name: "assets" }),
  users:               () => ({
    rows: staffDir.all().map(({ uid, name, role, branches, active }) =>
      ({ uid, name, role, active, branches: (branches || []).join("|") })),
    name: "staff" }),
  menu:                () => ({
    rows: (state.menu || []).map(({ branches, ...r }) => ({ ...r, branches: (branches || []).join("|") })),
    name: "menu" }),
  items_list:          () => ({ rows: state.items || [], name: "inventory-items" }),
  supplier_list:       () => ({
    rows: Object.entries(state.suppliers || {}).flatMap(([itemId, sups]) =>
      (sups || []).map(s => ({ item_id: itemId, ...s }))),
    name: "suppliers" }),
  salaries:            () => ({ rows: state.salaries || [], name: "salaries" }),
  overheads:           () => ({ rows: state.overheads || [], name: "overheads" }),
  snapshot_new:        () => ({
    rows: (state.snapshots || []).flatMap(s =>
      (s.entries || []).map(e => ({ snapshot_id: s.id, as_of: s.as_of, branch: e.branch, item_id: e.item_id, qty: e.qty }))),
    name: "snapshots" }),
  leadership_roles:    () => ({ rows: state.leadership_assignments || [], name: "leadership-assignments" }),
  leave_new:           () => ({ rows: state.leaves || [], name: "leaves" }),
  inventory_engine:    () => ({
    rows: (state.items || []).filter(it => it.active !== false).map(it => {
      const sd_ = state.inv_engine_sales_data || [];
      const rc_ = state.inv_engine_recipes    || [];
      const mStock = (computeStock("maadi") || {})[it.id] || 0;
      const zStock = (computeStock("zawya") || {})[it.id] || 0;
      const mConsump = invAvgDailyConsumption(it.id, "maadi", 30, sd_, rc_);
      const zConsump = invAvgDailyConsumption(it.id, "zawya", 30, sd_, rc_);
      const mDays  = invStockLongevity(it.id, "maadi", sd_, rc_);
      const zDays  = invStockLongevity(it.id, "zawya", sd_, rc_);
      const cfg_   = (state.inv_engine.thresholds || {})[it.id] || {};
      return {
        item: it.name, unit: it.unit, category: cfg_.category_rule || it.category || "",
        priority: cfg_.priority || "",
        maadi_stock: mStock.toFixed(3), maadi_avg_daily: mConsump.toFixed(4),
        maadi_days_remaining: isFinite(mDays) ? mDays.toFixed(1) : "∞",
        zawya_stock: zStock.toFixed(3), zawya_avg_daily: zConsump.toFixed(4),
        zawya_days_remaining: isFinite(zDays) ? zDays.toFixed(1) : "∞",
        reorder_threshold: invAdjustedReorderThreshold(it.id, "maadi", sd_, rc_).toFixed(3),
        protection_days: cfg_.protection_days || "",
      };
    }),
    name: "inventory-engine" }),
};

function btnBack() {
  const exportDef = ROUTE_EXPORTS[route.name];
  const bar = el("div", { class: "sticky-actions", style: { display: "flex", gap: "8px" } });
  bar.appendChild(el("button", { class: "btn ghost", onClick: () => go("home") }, "← Back to home"));
  if (exportDef) {
    bar.appendChild(el("button", { class: "btn secondary", style: { marginLeft: "auto" }, onClick: () => {
      try {
        const { rows, name } = exportDef();
        if (!rows || !rows.length) { toast("Nothing to export."); return; }
        const dateStr = new Date().toISOString().slice(0, 10);
        download(`cb-${name}-${dateStr}.csv`, new Blob([toCSV(rows)], { type: "text/csv" }));
        toast(`Exported ${rows.length} rows → cb-${name}-${dateStr}.csv`);
      } catch (e) { console.error(e); toast("Export failed: " + e.message); }
    }}, "⬇ Export CSV"));
  }
  return bar;
}
function openSheet(content) {
  const root = $("#modal-root"); root.innerHTML = "";
  const s = el("div", { class: "sheet", onClick: (e) => { if (e.target === s) root.innerHTML = ""; } },
    el("div", { class: "sheet-inner" }, [
      content,
      el("div", { class: "sticky-actions" }, el("button", { class: "btn ghost", onClick: () => root.innerHTML = "" }, "Close")),
    ]));
  root.appendChild(s);
}
function closeSheet() { $("#modal-root").innerHTML = ""; }
function openPrompt({ title, fields, onSubmit, extraButtons }) {
  const vals = {}; for (const f of fields) vals[f.key] = f.value;
  const body = el("div", {}, [ el("h2", {}, title) ]);
  for (const f of fields) {
    body.appendChild(el("label", {}, f.label));
    if (f.type === "file") {
      const i = el("input", { type: "file", accept: f.accept || "image/*" });
      i.addEventListener("change", () => { vals[f.key] = i.files && i.files[0] ? i.files[0] : null; });
      body.appendChild(i);
    } else if (f.type === "select" && Array.isArray(f.options)) {
      const sel = el("select", {});
      for (const opt of f.options) {
        const o = el("option", { value: String(opt.value != null ? opt.value : opt) }, String(opt.label != null ? opt.label : opt));
        if (String(opt.value != null ? opt.value : opt) === String(f.value)) o.selected = true;
        sel.appendChild(o);
      }
      sel.addEventListener("change", () => vals[f.key] = sel.value);
      body.appendChild(sel);
    } else {
      const i = el("input", { type: f.type || "text", value: String(f.value ?? "") });
      i.addEventListener("input", () => vals[f.key] = i.value);
      body.appendChild(i);
    }
  }
  const actions = el("div", { class: "sticky-actions" });
  actions.appendChild(el("button", { class: "btn", onClick: async () => { $("#modal-root").innerHTML = ""; await onSubmit(vals); } }, "Save"));
  if (Array.isArray(extraButtons)) {
    for (const b of extraButtons) {
      actions.appendChild(el("button", { class: "btn ghost", style: { marginTop: "8px" }, onClick: () => { $("#modal-root").innerHTML = ""; b.onClick(); } }, b.label));
    }
  }
  body.appendChild(actions);
  openSheet(body);
}

function kpiCalcTotal(scores) {
  const w = KPI_W();
  const s = scores || {};
  let total;
  if (s.leadership == null) {
    const lw = w.leadership;
    const others = Object.keys(w).filter(k => k !== 'leadership');
    const bonus = lw / others.length;
    total = others.reduce((sum, k) => sum + (s[k] || 0) * (w[k] + bonus) / 100, 0);
  } else {
    total = Object.keys(w).reduce((sum, k) => sum + (s[k] || 0) * w[k] / 100, 0);
  }
  // Late-penalty overflow: deductions that exceeded the punctuality score spill into the total
  total = Math.max(0, total - (s._lateOverflow || 0));
  return total;
}
