    const combinedBal = pettyCashBalance("maadi") + pettyCashBalance("zawya");
    const combinedCard = el("div", { class: "card", style: { borderColor: "var(--accent)" } });
    combinedCard.appendChild(el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } }, "Combined (Maadi + Zawya)"));
    combinedCard.appendChild(el("div", { style: { fontSize: "30px", fontWeight: "700", color: combinedBal < PETTY_CASH_ALERT ? "var(--bad)" : "var(--ink)" } }, money(combinedBal)));
    combinedCard.appendChild(el("div", { class: "muted small" }, `Weekly outflow: ${money(weeklyExpenditure("combined"))}`));
    if (combinedBal < PETTY_CASH_ALERT) {
      combinedCard.appendChild(el("div", { class: "banner-arch", style: { borderColor: "var(--bad)", color: "var(--bad)", fontWeight: "700", marginTop: "8px" } },
        `⚠ Total cash under ${money(PETTY_CASH_ALERT)} — top-up required.`));
      if (u.role === "owner" && !state.settings.alerted_combined) {
        notifyHaidi("Low petty cash (combined)", `Total is ${money(combinedBal)} (under ${money(PETTY_CASH_ALERT)})`);
        state.settings.alerted_combined = true;
        saveState();
      }
    } else if (state.settings.alerted_combined) {
      delete state.settings.alerted_combined;
      saveState();
    }
    wrap.appendChild(combinedCard);
  }

  // ---------- Per-branch cards ----------
  const branches = canSeeAll ? ["maadi","zawya"] : u.branches;
  for (const b of branches) {
    const bal = pettyCashBalance(b);
    const weekly = weeklyExpenditure(b);
    const card = el("div", { class: "card", style: { marginTop: "12px" } });
    card.appendChild(el("h2", {}, `${b[0].toUpperCase()+b.slice(1)} balance: ${money(bal)}`));

    card.appendChild(el("div", { class: "kv" }, [
      el("div", { class: "k" }, "This week's expenditures"),
      el("div", { class: "v" }, money(weekly)),
    ]));

    // Action buttons — role-restricted
    const btns = el("div", { class: "btn-row", style: { flexWrap: "wrap", gap: "8px" } }, []);
    if (u.role === "owner") {
      // TOP-UP — OWNER ONLY
      btns.appendChild(el("button", { class: "btn secondary", onClick: () => addTopup(b) }, "➕ Top-up"));
    }
    if (u.role === "head_barista" && u.branches.includes(b)) {
      // EXPENDITURE — HEAD BARISTA ONLY (for their branch)
      btns.appendChild(el("button", { class: "btn secondary", onClick: () => addExpense(b) }, "🧾 Expenditure"));
    }
    if (btns.children.length > 0) card.appendChild(btns);

    // Recent ledger rows — exclude salary & penalty (those have their own sections)
    const rows = state.petty_cash
      .filter(p => p.branch === b && p.type !== "salary" && p.type !== "penalty")
      .sort((x,y) => (y.at || "").localeCompare(x.at || ""))
      .slice(0, 20);
    card.appendChild(el("div", { class: "hr" }));
    if (rows.length === 0) {
      card.appendChild(el("div", { class: "muted small" }, "No entries yet."));
    } else {
      for (const r of rows) {
        const label = r.type === "expense" ? `Expense — ${r.note || ""}`
                    : r.type === "topup" ? `Top-up — ${r.note || ""}`
                    : `${r.type} — ${r.note || ""}`;
        card.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, [
            el("div", {}, label),
            el("div", { class: "muted small" }, `${fmtDate(r.at)} · by ${r.by_name || r.by || "—"}`),
          ]),
          el("div", { class: "v", style: { color: r.amount < 0 ? "var(--bad)" : "var(--ok)" } }, money(r.amount)),
        ]));
      }
    }
    wrap.appendChild(card);
  }
  wrap.appendChild(btnBack());

  // ---------- Handlers ----------
  function pushEntry(branch, type, amount, note, date) {
    const s = stamp();
    const bal = pettyCashBalance(branch);
    state.petty_cash.push({
      id: uuid(), branch, date: date || new Date().toISOString().slice(0,10),
      type, amount, balance_after: bal + amount, ref: "manual",
      by: s.by, by_name: s.by_name, at: s.at, note: note || "",
    });
    // Alert when combined total drops below threshold
    const total = pettyCashBalance("maadi") + pettyCashBalance("zawya");
    if (total < PETTY_CASH_ALERT) {
      notifyHaidi("Low petty cash — combined", `Total is ${money(total)} (under ${money(PETTY_CASH_ALERT)})`);
    }
  }

  function addTopup(branch) {
    openPrompt({
      title: `Top-up ${branch} petty cash (owner)`,
      fields: [
        { key: "amount", label: "Amount (EGP)", type: "number", value: 0 },
        { key: "date", label: "Date", type: "date", value: new Date().toISOString().slice(0,10) },
        { key: "note", label: "Note", type: "text", value: "Top-up from Haïdi" },
      ],
      onSubmit: (vals) => {
        const amt = Number(vals.amount) || 0;
        if (amt <= 0) return toast("Enter a positive amount", "error");
        pushEntry(branch, "topup", amt, vals.note, vals.date);
        const s = stamp();
        state.bank_ledger.push({
          id: uuid(), date: vals.date, amount: -amt, supplier: `Petty cash (${branch})`, type: "petty_cash_topup",
          by: s.by, by_name: s.by_name, at: s.at, note: `Top-up to ${branch} head barista`,
        });
        delete state.settings.alerted_combined;
        saveState(); toast("Top-up recorded"); render();
      }
    });
  }

  function addExpense(branch) {
    openPrompt({
      title: `Record expenditure — ${branch}`,
      fields: [
        { key: "amount", label: "Amount spent (EGP)", type: "number", value: 0 },
        { key: "date", label: "Date", type: "date", value: new Date().toISOString().slice(0,10) },
        { key: "note", label: "What was it for?", type: "text", value: "" },
      ],
      onSubmit: (vals) => {
        const amt = Number(vals.amount) || 0;
        if (amt <= 0) return toast("Enter a positive amount", "error");
        pushEntry(branch, "expense", -amt, vals.note, vals.date);
        saveState(); toast(`Remaining: ${money(pettyCashBalance(branch))}`); render();
      }
    });
  }

  return wrap;
};

// Shared: owner-only inline "add barista" — usable from Salaries, Penalties, anywhere.
// Now delegates to the createStaffUser Cloud Function (single source of truth: staff_public).
function addBaristaQuick(onDone) {
  openPrompt({
    title: "Add a new barista",
    fields: [
      { key: "name", label: "Name", type: "text", value: "" },
      { key: "role", label: "Role", type: "select", options: [
        { label: "Barista", value: "barista" },
        { label: "Head barista", value: "head_barista" },
      ], value: "barista" },
      { key: "pin",  label: "4-digit PIN", type: "text", value: "" },
      { key: "branches", label: "If head barista — branches (maadi,zawya)", type: "text", value: "maadi,zawya" },
      { key: "joined_date", label: "Start date", type: "date", value: new Date().toISOString().slice(0,10) },
    ],
    onSubmit: async (v) => {
      const name = (v.name || "").trim();
      if (!name) return toast("Enter a name", "error");
      if (!/^\d{4}$/.test(v.pin || "")) return toast("PIN must be 4 digits", "error");
      const role = v.role === "head_barista" ? "head_barista" : "barista";
      const branches = role === "barista"
        ? ["maadi","zawya"]
        : (v.branches || "").split(",").map(s => s.trim().toLowerCase()).filter(Boolean);
      try {
        await functions.httpsCallable("createStaffUser")({ name, role, branches, pin: v.pin });
        // Refresh the in-memory staff directory so the new member appears immediately
        await staffDir.load();
        const newUser = staffDir.all().find(x => x.name === name);
        if (newUser && v.joined_date) {
          state.barista_dates = state.barista_dates || {};
          state.barista_dates[newUser.uid] = state.barista_dates[newUser.uid] || [];
          state.barista_dates[newUser.uid].push({ type: "joined", date: v.joined_date, at: now() });
          saveState();
        }
        toast(`${name} added \u2713`);
        if (typeof onDone === "function") onDone();
        else render();
      } catch (e) {
        toast(e.message || "Failed to add staff", "error");
      }
    }
  });
}


// ==============================================================
// SALARIES — per-barista monthly salary config, loans, payouts, total due.
// Visible only to accountant, head_barista, and owner.
// ==============================================================
//
// Data model:
//   state.salary_config = { [userId]: { monthly_salary: Number, updated_at } }
//   state.salary_loans  = [ { id, user_id, barista, amount, date, note, by, by_name, at, month } ]
//   state.salaries      = [ { id, user_id, recipient, branch, amount, month, date, note, by, by_name, at } ]  // the payouts
//
routes.salaries = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Salaries", "Set each barista's salary, track loans, and see total due this month."));

  if (!["owner","accountant","head_barista"].includes(u.role)) {
    wrap.appendChild(el("div", { class: "card" }, "Access restricted."));
    wrap.appendChild(btnBack());
    return wrap;
  }

  state.salaries       = state.salaries || [];
  state.salary_config  = state.salary_config || {};
  state.salary_loans   = state.salary_loans  || [];
  state.penalties      = state.penalties     || [];

  // Month picker (defaults to current month) — scopes the "Total due" calc.
  const monthInput = el("input", {
    type: "month",
    value: new Date().toISOString().slice(0,7),
    style: { padding: "8px", borderRadius: "8px", border: "1px solid var(--border)" }
  });
  const headerRow = el("div", { class: "card", style: { display: "flex", gap: "12px", alignItems: "center", flexWrap: "wrap" } }, [
    el("div", { class: "muted small" }, "Month"),
    monthInput,
  ]);
  if (u.role === "owner") {
    headerRow.appendChild(el("button", {
      class: "btn secondary",
      style: { marginLeft: "auto" },
      onClick: () => addBaristaQuick()
    }, "➕ Add new barista"));
  }
  wrap.appendChild(headerRow);
  monthInput.addEventListener("change", () => drawBody());

  const body = el("div", {});
  wrap.appendChild(body);

  drawBody();

  wrap.appendChild(btnBack());

  function drawBody() {
    body.innerHTML = "";
    const month    = monthInput.value || new Date().toISOString().slice(0,7);
    const nowMonth = new Date().toISOString().slice(0,7);
    const isPast   = month < nowMonth;
    const monthFn  = x => (x.month || (x.date||"").slice(0,7)) === month;

    // Active baristas + archived baristas visible in past months (salary history must never disappear)
    const staff = state.users.filter(x => {
      if (!["barista","head_barista"].includes(x.role)) return false;
      if (x.active) return true;
      if (!isPast)  return false;
      return !!(state.salary_config[x.id])
        || state.penalties.some(r => r.user_id === x.id && monthFn(r))
        || state.overtime_logs.some(r => r.user_id === x.id && monthFn(r))
        || state.salary_loans.some(r => r.user_id === x.id && monthFn(r))
        || state.salaries.some(r => r.user_id === x.id && monthFn(r));
    });

    // ---- 1) Per-barista salary config card ----
    const cfgCard = el("div", { class: "card", style: { marginTop: "12px" } });
    cfgCard.appendChild(el("div", { class: "muted small", style: { textTransform:"uppercase", letterSpacing:"1px" } }, "Monthly salary — per barista"));
    if (staff.length === 0) {
      cfgCard.appendChild(el("div", { class: "muted small" }, "No active baristas."));
    } else {
      for (const p of staff) {
        const nameLabel = p.name + (p.active ? "" : " (archived)");
        const salaryBox = el("div", { class: "kv", style: p.active ? {} : { opacity: ".6", fontStyle: "italic" } }, [
          el("div", { class: "k" }, [
            el("div", {}, nameLabel),
            el("div", { class: "muted small" }, `${p.role === "head_barista" ? "Head barista" : "Barista"} · ${(p.branches||[]).join(", ")}`),
          ]),
          el("div", { class: "v" }, money(getSalaryForMonth(p.id, month))),
        ]);
        if (p.active && (u.role === "owner" || u.role === "accountant")) {
          salaryBox.appendChild(el("button", {
            class: "btn ghost",
            style: { marginLeft: "8px" },
            onClick: () => editSalaryConfig(p)
          }, "Edit"));
        }
        cfgCard.appendChild(salaryBox);
      }
    }
    body.appendChild(cfgCard);

    // ---- 2) Loans card ----
    const loansCard = el("div", { class: "card", style: { marginTop: "12px" } });
    loansCard.appendChild(el("div", { class: "muted small", style: { textTransform:"uppercase", letterSpacing:"1px" } }, "Loans (deducted end of month)"));
    loansCard.appendChild(el("button", { class: "btn secondary", style: { marginTop: "8px" }, onClick: addLoan }, "➕ Record loan"));
    const monthLoans = state.salary_loans.filter(l => (l.month || (l.date||"").slice(0,7)) === month);
    if (monthLoans.length === 0) {
      loansCard.appendChild(el("div", { class: "muted small", style: { marginTop: "8px" } }, "No loans recorded for this month."));
    } else {
      for (const r of monthLoans.slice().sort((a,b) => (b.at||"").localeCompare(a.at||""))) {
        loansCard.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, [
            el("div", {}, `${r.barista || "—"}`),
            el("div", { class: "muted small" }, `${fmtDate(r.at)} · by ${r.by_name || r.by || "—"}${r.note ? " · " + r.note : ""}`),
          ]),
          el("div", { class: "v" }, money(r.amount)),
        ]));
      }
    }
    body.appendChild(loansCard);

    // ---- 2.25) Sick leave deductions card ----
    state.sick_leave_deductions = state.sick_leave_deductions || [];
    const sickCard = el("div", { class: "card", style: { marginTop: "12px" } });
    sickCard.appendChild(el("div", { class: "muted small", style: { textTransform:"uppercase", letterSpacing:"1px" } }, "Sick leaves (¼ day deducted per leave)"));
    if (u.role === "owner" || u.role === "accountant" || u.role === "head_barista") {
      sickCard.appendChild(el("button", { class: "btn secondary", style: { marginTop: "8px" }, onClick: addSickLeave }, "➕ Record sick leave"));
    }
    const monthSick = state.sick_leave_deductions.filter(l => (l.month || (l.date||"").slice(0,7)) === month);
    if (monthSick.length === 0) {
      sickCard.appendChild(el("div", { class: "muted small", style: { marginTop: "8px" } }, "No sick leaves recorded for this month."));
    } else {
      for (const r of monthSick.slice().sort((a,b) => (b.at||"").localeCompare(a.at||""))) {
        sickCard.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, [
            el("div", {}, `${r.barista || "—"} · ${r.days} sick day${r.days !== 1 ? "s" : ""}`),
            el("div", { class: "muted small" }, `${fmtDate(r.at)} · by ${r.by_name || r.by || "—"}${r.note ? " · " + r.note : ""}`),
          ]),
          el("div", { class: "v" }, `−${money(r.amount)}`),
        ]));
      }
    }
    body.appendChild(sickCard);

    // ---- 2.5) Overtime card ----
    state.overtime_logs = state.overtime_logs || [];
    const otCard = el("div", { class: "card", style: { marginTop: "12px" } });
    otCard.appendChild(el("div", { class: "muted small", style: { textTransform:"uppercase", letterSpacing:"1px", marginBottom:"10px" } }, "Overtime — extra hours beyond 8 h shift"));
    // Hourly rates display
    for (const p of staff) {
      const sal = getSalaryForMonth(p.id, month);
      const hrRate = sal > 0 ? (sal / 30 / 8) : 0;
      const otHrs  = (state.overtime_logs).filter(x => x.user_id === p.id && (x.month || (x.date||"").slice(0,7)) === month).reduce((s,r)=>s+(Number(r.hours)||0),0);
      const otAmt  = (state.overtime_logs).filter(x => x.user_id === p.id && (x.month || (x.date||"").slice(0,7)) === month).reduce((s,r)=>s+(Number(r.amount)||0),0);
      const otRate15 = money(Math.round(hrRate * 1.5 * 100) / 100);
      const otRate2  = money(Math.round(hrRate * 2   * 100) / 100);
      otCard.appendChild(el("div", { class: "kv" }, [
        el("div", { class: "k" }, [
          el("div", {}, p.name),
          el("div", { class: "muted small" }, `Base: ${money(Math.round(hrRate*100)/100)}/hr · OT ×1.5: ${otRate15} · Holiday ×2: ${otRate2} · This month: ${otHrs}h = +${money(Math.round(otAmt*100)/100)}`),
        ]),
        el("div", { class: "v" }, ""),
      ]));
    }
    if (u.role === "owner" || u.role === "accountant" || u.role === "head_barista") {
      otCard.appendChild(el("button", { class: "btn secondary", style: { marginTop: "10px" }, onClick: addOvertime }, "➕ Log overtime hours"));
    }
    const monthOT = state.overtime_logs.filter(l => (l.month || (l.date||"").slice(0,7)) === month);
    if (monthOT.length === 0) {
      otCard.appendChild(el("div", { class: "muted small", style: { marginTop: "8px" } }, "No overtime logged this month."));
    } else {
      for (const r of monthOT.slice().sort((a,b) => (b.at||"").localeCompare(a.at||""))) {
        const statusPill = r.approved
          ? el("span", { class: "pill ok", style: { fontSize:"11px" } }, "✓ Approved")
          : el("span", { class: "pill warn", style: { fontSize:"11px", color:"var(--warn)" } }, "⏳ Pending");
        const rateLabel = r.kind === "leadership_bonus" ? "👑 Leadership role bonus"
          : r.kind === "events_bonus" ? "🎪 Events bonus"
          : r.kind === "double_shift" ? "×1.5 Double shift"
          : /eid al-fitr/i.test(r.note||"")  ? "×2 Eid Al-Fitr"
          : /eid al-adha/i.test(r.note||"")  ? "×2 Eid Al-Adha"
          : r.multiplier === 2   ? "×2 Holiday"
          : r.multiplier === 1.5 ? "×1.5 OT"
          : r.multiplier         ? `×${r.multiplier}`
          : "×1.5 OT";
        otCard.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, [
            el("div", {}, `${r.barista || "—"} · ${r.date || ""} · ${r.hours}h · ${rateLabel}`),
            el("div", { class: "muted small" }, `${fmtDate(r.at)} · by ${r.by_name || "—"}${r.note ? " · " + r.note : ""} · +${money(Math.round((r.amount||0)*100)/100)}`),
          ]),
          el("div", { class: "v", style: { display:"flex", flexDirection:"column", alignItems:"flex-end", gap:"4px" } }, [
            statusPill,
            ...((!r.approved && (u.role === "owner")) ? [el("button", { class: "btn ghost", style: { fontSize:"11px", padding:"4px 10px", minHeight:"unset" }, onClick: () => { r.approved = true; r.approved_by = state._auth?.uid || null; saveState(); drawBody(); } }, "Approve")] : []),
          ]),
        ]));
      }
    }
    body.appendChild(otCard);

    // ---- 3) Total due THIS MONTH (per person + grand total) ----
    const dueCard = el("div", { class: "card", style: { marginTop: "12px" } });
    dueCard.appendChild(el("div", { class: "muted small", style: { textTransform:"uppercase", letterSpacing:"1px" } }, `Total due · ${month}`));
    let grandDue = 0;
    for (const p of staff) {
      const salary  = getSalaryForMonth(p.id, month);
      const penSum  = state.penalties.filter(x => x.user_id === p.id && (x.month || (x.date||"").slice(0,7)) === month)
                                     .reduce((s,r)=>s+(Number(r.amount)||0),0);
      const loanSum = state.salary_loans.filter(x => x.user_id === p.id && (x.month || (x.date||"").slice(0,7)) === month)
                                        .reduce((s,r)=>s+(Number(r.amount)||0),0);
      const sickSum = (state.sick_leave_deductions || []).filter(x => x.user_id === p.id && (x.month || (x.date||"").slice(0,7)) === month)
                                        .reduce((s,r)=>s+(Number(r.amount)||0),0);
      const otSum   = state.overtime_logs.filter(x => x.user_id === p.id && (x.month || (x.date||"").slice(0,7)) === month)
                                         .reduce((s,r)=>s+(Number(r.amount)||0),0);
      const due = Math.max(0, salary + otSum - penSum - loanSum - sickSum);
      grandDue += due;
      dueCard.appendChild(el("div", { class: "kv", style: p.active ? {} : { opacity: ".6", fontStyle: "italic" } }, [
        el("div", { class: "k" }, [
          el("div", {}, p.name + (p.active ? "" : " (archived)")),
          el("div", { class: "muted small" }, `Salary ${money(salary)} + OT ${money(Math.round(otSum*100)/100)} − Penalties ${money(penSum)} − Loans ${money(loanSum)}${sickSum > 0 ? ` − Sick leaves ${money(sickSum)}` : ""}`),
        ]),
        el("div", { class: "v" }, money(due)),
      ]));
    }
    dueCard.appendChild(el("div", { class: "kv", style: { borderTop: "1px solid var(--border)", marginTop: "6px", paddingTop: "6px", fontWeight: "700" } }, [
      el("div", { class: "k" }, "Grand total due"),
      el("div", { class: "v" }, money(grandDue)),
    ]));
    body.appendChild(dueCard);

    // ---- 4) Record actual payouts ----
    body.appendChild(el("button", { class: "btn secondary", style: { marginTop: "12px" }, onClick: addSalary }, "➕ Log salary payout"));

    const paidThis = state.salaries.filter(r => (r.month || (r.date||"").slice(0,7)) === month)
      .slice().sort((a,b) => (b.at||"").localeCompare(a.at||""));
    const paidTotal = paidThis.reduce((s,r)=>s+(Number(r.amount)||0),0);
    body.appendChild(el("div", { class: "card", style: { marginTop: "12px" } }, [
      el("div", { class: "muted small", style: { textTransform:"uppercase", letterSpacing:"1px" } }, `Paid · ${month}`),
      el("div", { style: { fontSize: "26px", fontWeight: "700" } }, money(paidTotal)),
    ]));

    const list = el("div", { class: "card", style: { marginTop: "12px" } });
    if (paidThis.length === 0) {
      list.appendChild(el("div", { class: "muted small" }, "No salary payouts logged this month."));
    } else {
      for (const r of paidThis) {
        list.appendChild(el("div", { class: "kv" }, [
          el("div", { class: "k" }, [
            el("div", {}, `${r.recipient || "—"} · ${r.month || ""} · ${r.branch || ""}`),
            el("div", { class: "muted small" }, `${fmtDate(r.at)} · by ${r.by_name || r.by || "—"}${r.note ? " · " + r.note : ""}`),
          ]),
          el("div", { class: "v" }, money(r.amount)),
        ]));
      }
    }
    body.appendChild(list);
  }

  function editSalaryConfig(person) {
    const cur = state.salary_config[person.id] || { monthly_salary: 0 };
    openPrompt({
      title: `Monthly salary — ${person.name}`,
      fields: [
        { key: "amount", label: "Monthly salary (EGP)", type: "number", value: cur.monthly_salary || 0 },
      ],
      onSubmit: (vals) => {
        const amt = Number(vals.amount) || 0;
        if (amt < 0) return toast("Enter a non-negative amount", "error");
        const s = stamp();
        state.salary_config[person.id] = { monthly_salary: amt, updated_at: s.at, updated_by: s.by_name };

        state.salary_snapshots = state.salary_snapshots || {};

        state.salary_snapshots[person.id][month] = amt;
        saveState(); toast(`${person.name}: salary set to ${money(amt)}`); render();
      }
    });
  }

        state.salary_loans.push({
          id: uuid(), user_id: person.id, barista: person.name,

  function addSickLeave() {
    const staff = state.users.filter(x => (x.role === "barista" || x.role === "head_barista") && x.active);
    const options = staff.map(p => ({ label: p.name, value: p.id }));

      title: "Record sick leave",
      fields: [
        { key: "user_id", label: "Barista", type: "select", options, value: options[0] ? options[0].value : "" },
        { key: "days",    label: "Number of sick days", type: "number", value: 1 },
        { key: "date",    label: "Date", type: "date", value: new Date().toISOString().slice(0,10) },
        { key: "month",   label: "Deduct from month (YYYY-MM)", type: "text", value: monthInput.value },
        { key: "note",    label: "Note", type: "text", value: "" },
      ],

        if (!person) return toast("Pick a barista", "error");
        const sal = getSalaryForMonth(person.id, vals.month || (vals.date||"").slice(0,7) || month);
        const quarterDay = Math.round((sal / 30 / 4) * 100) / 100;
        const amount = Math.round(quarterDay * days * 100) / 100;
        const s = stamp();
        state.sick_leave_deductions = state.sick_leave_deductions || [];
        state.sick_leave_deductions.push({
          id: uuid(), user_id: person.id, barista: person.name,

  function addOvertime() {
    const staff = state.users.filter(x => (x.role === "barista" || x.role === "head_barista") && x.active);
    const options = staff.map(p => ({ label: p.name, value: p.id }));
    const otTypeOptions = [
      { label: "Regular OT (×1.5)",    value: "regular" },
      { label: "Eid Al-Fitr (×2)",     value: "eid_fitr" },
      { label: "Eid Al-Adha (×2)",     value: "eid_adha" },
    ];
    openPrompt({
      title: "Log overtime hours",
      fields: [
        { key: "user_id", label: "Barista",   type: "select", options,        value: options[0] ? options[0].value : "" },
        { key: "ot_type", label: "OT type",   type: "select", options: otTypeOptions, value: "regular" },
        { key: "date",    label: "Date",       type: "date",   value: new Date().toISOString().slice(0,10) },
        { key: "hours",   label: "Extra hours (beyond 8 h shift)", type: "number", value: 1 },
        { key: "note",    label: "Reason / note", type: "text", value: "" },
      ],
      onSubmit: (vals) => {
        const hrs = Number(vals.hours) || 0;
        if (hrs <= 0) return toast("Enter a positive number of hours", "error");
        const person = state.users.find(x => x.id === vals.user_id);
        if (!person) return toast("Pick a barista", "error");
        const sal = getSalaryForMonth(person.id, (vals.date||"").slice(0,7) || month);
        const hrRate = sal > 0 ? sal / 30 / 8 : 0;
        const multiplier = (vals.ot_type === "eid_fitr" || vals.ot_type === "eid_adha") ? 2 : 1.5;
        const amount = Math.round(hrRate * hrs * multiplier * 100) / 100;
        const s = stamp();
        const mon = monthInput.value || new Date().toISOString().slice(0,7);
        const eidNote = vals.ot_type === "eid_fitr" ? "Eid Al-Fitr double pay"
          : vals.ot_type === "eid_adha" ? "Eid Al-Adha double pay" : "";
        state.overtime_logs = state.overtime_logs || [];
        state.overtime_logs.push({
          id: uuid(), user_id: person.id, barista: person.name,
          date: vals.date, hours: hrs, rate: hrRate, multiplier, amount,
          month: mon || (vals.date||"").slice(0,7),
          note: eidNote || vals.note || "", by: s.by, by_name: s.by_name, at: s.at,
          approved: false,
        });
        saveState();
        // Send approval email — head barista (To:) with owner CC; fallback to owner with priority flag
        const _otHbEmail    = (state.settings.head_barista_email || "").trim();
        const _otOwnerEmail = (state.settings.owner_email || "coffeebeats@haidiyacoub.com").trim();
        const _otToAddr     = _otHbEmail || _otOwnerEmail;
        const _otCcPart     = _otHbEmail ? `&cc=${encodeURIComponent(_otOwnerEmail)}` : "";
        const _otPriority   = _otHbEmail ? "" : "[PRIORITY — No Head Barista] ";
        const otTypeLabel = vals.ot_type === "eid_fitr" ? "Eid Al-Fitr (×2)"
          : vals.ot_type === "eid_adha" ? "Eid Al-Adha (×2)" : "Regular OT (×1.5)";
        const subj = encodeURIComponent(`${_otPriority}[OT Approval Needed] ${person.name} · ${vals.date} · ${hrs}h · ${otTypeLabel} · EGP ${amount.toFixed(2)}`);
        const bod  = encodeURIComponent(
          `Overtime submitted for your approval:\n\n` +
          `Barista: ${person.name}\nDate: ${vals.date}\nHours: ${hrs}\n` +
          `OT type: ${otTypeLabel}\nHourly rate: EGP ${hrRate.toFixed(2)} × ${multiplier} = EGP ${(hrRate * multiplier).toFixed(2)}/hr\nTotal OT pay: EGP ${amount.toFixed(2)}\n` +
          `Month: ${mon}\nNote: ${vals.note || "—"}\nSubmitted by: ${s.by_name}\n\n` +
          (_otHbEmail ? "" : `⚠️ No head barista email is configured — this approval request has been sent directly to the owner.\n\n`) +
          `Log in to the Operations app > Salaries to approve.`
        );
        try { window.open(`mailto:${encodeURIComponent(_otToAddr)}?subject=${subj}${_otCcPart}&body=${bod}`, "_blank"); } catch(e) {}
        toast(`Overtime logged · EGP ${amount.toFixed(2)} · Approval email sent ✉️`);
        drawBody();
      }
    });
  }

  function addSalary() {
    // Include archived staff so a final paycheck can still be logged after deactivation
    const staff = state.users.filter(x =>
      ["barista","head_barista"].includes(x.role) &&
      (x.active || !!(state.salary_config[x.id]))
    );
    const options = staff.map(p => ({ label: p.name + (p.active ? "" : " (archived)"), value: p.id }));
    openPrompt({
      title: "Log salary payout",
      fields: [
        { key: "user_id", label: "Recipient", type: "select", options, value: options[0] ? options[0].value : "" },
        { key: "branch",  label: "Branch (maadi/zawya)", type: "text", value: u.branches[0] || "maadi" },
        { key: "amount",  label: "Amount paid (EGP)", type: "number", value: 0 },
        { key: "month",   label: "For month (YYYY-MM)", type: "text", value: monthInput.value },
        { key: "date",    label: "Transfer date", type: "date", value: new Date().toISOString().slice(0,10) },
        { key: "note",    label: "Note", type: "text", value: "Monthly salary" },
      ],
      onSubmit: (vals) => {
        const amt = Number(vals.amount) || 0;
        if (amt <= 0) return toast("Enter a positive amount", "error");
        const person = state.users.find(x => x.id === vals.user_id);
        const s = stamp();
        state.salaries.push({
          id: uuid(),
          user_id: person ? person.id : null,
          recipient: person ? person.name : (vals.recipient || ""),
          branch: String(vals.branch || "maadi").toLowerCase(),
          amount: amt,
          month: vals.month || "",
          date: vals.date,
          note: vals.note || "",
          by: s.by, by_name: s.by_name, at: s.at,
        });
        saveState(); toast("Payout logged"); render();
      }
    });
  }

  return wrap;
};

// ==============================================================
// PENALTIES — per-barista deductions with auto-calc from monthly salary.
// 1 day = monthly_salary / 30 ; half day = that / 2.
// Entry restricted to owner + head_barista per spec.
// ==============================================================
//
// Auto sign-in stamp penalty tiers (applied on clock-in upload):
//   - late 1–10 min                (grace — no penalty)
//   - late 10–60 min               (half day)
//   - late 60–120 min              (full day)
//   - late >120 min                (2 days)
//   - no stamp at all              (3 days, via missing-stamp checker)
//   - 2nd+ late in same month      penalty doubles automatically
//   - stamps a shift not assigned to them → +50 KPI punctuality bonus
//
// Manual reasons dropdown:
//   - not wearing the uniform      (half day penalty)
//   - not following the rules      (half day penalty)
//   - other — please specify       (custom amount, free-text reason)
//
// Four fixed durations — amount auto-calculated from monthly salary.
// "other" lets the head barista/owner type a free-text amount.
const PENALTY_KINDS = [
  { label: "Quarter day", value: "quarter_day", days: 0.25 },
  { label: "Half day",  value: "half_day",   days: 0.5 },
  { label: "Full day",  value: "full_day",   days: 1   },
  { label: "2 days",    value: "two_days",   days: 2   },
  { label: "3 days",    value: "three_days", days: 3   },
  { label: "Other (custom amount)", value: "custom", days: null },
];
// Optional context (doesn't affect amount — just labels the penalty)
const PENALTY_REASONS = [
  { label: "Late",                     value: "late" },
  { label: "No show",                  value: "no_show" },
  { label: "Not wearing the uniform",  value: "no_uniform" },
  { label: "Personal hygiene",         value: "hygiene" },
  { label: "Not following the rules",  value: "rules_break" },
  { label: "Other",                    value: "other" },
];

function penaltyAmount(kind, monthlySalary) {
  const s = Number(monthlySalary) || 0;
  const day = s / 30;
  const k = PENALTY_KINDS.find(x => x.value === kind);
  if (!k || k.days == null) return 0;
  return Math.round(day * k.days);
}

routes.penalties = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Penalties", "Auto-calculated from each barista's monthly salary."));

  // Per spec: only owner + head_barista can ENTER. Accountant can VIEW.
  if (!["owner","accountant","head_barista"].includes(u.role)) {
    wrap.appendChild(el("div", { class: "card" }, "Access restricted."));
    wrap.appendChild(btnBack());
    return wrap;
  }

  state.penalties           = state.penalties           || [];
  state.salary_config       = state.salary_config       || {};
  state.deleted_penalties   = state.deleted_penalties   || [];

  const canEnter = (u.role === "owner" || u.role === "head_barista");

  const btnRow = el("div", { style: { display: "flex", gap: "8px", flexWrap: "wrap" } });
  if (canEnter) {
    btnRow.appendChild(el("button", { class: "btn secondary", onClick: addPenalty }, "➕ Record penalty"));
    // Missing-stamp checker: pick a past date, auto-apply 3-day deductions for no-shows
    btnRow.appendChild(el("button", { class: "btn secondary", onClick: () => {
      const dateVal = prompt("Check missing stamps for date (YYYY-MM-DD):", localISODate(new Date(Date.now() - 86400000)));
      if (!dateVal || !/^\d{4}-\d{2}-\d{2}$/.test(dateVal)) return;
      if (dateVal >= localISODate(new Date())) return toast("Choose a past date", "error");
      const n = applyMissingStampPenalties(dateVal, u);
      if (n === 0) toast("No missing stamps found for " + dateVal + " — all good or no morning shifts scheduled", "ok");
      else { toast(`⚠ ${n} missing-stamp deduction${n > 1 ? "s" : ""} applied for ${dateVal}`, "warn"); render(); }
    }}, "🔍 Check missing stamps"));
  } else {
    wrap.appendChild(el("div", { class: "banner-arch" }, "View-only access. Penalties are entered by the owner or head barista."));
  }
  if (u.role === "owner") {
    btnRow.appendChild(el("button", { class: "btn secondary", onClick: () => addBaristaQuick() }, "➕ Add new barista"));
  }
  wrap.appendChild(btnRow);

  const visible = state.penalties.slice().sort((a,b) => (b.at||"").localeCompare(a.at||""));
  const total = visible.reduce((s,r) => s + (Number(r.amount)||0), 0);
  wrap.appendChild(el("div", { class: "card", style: { marginTop: "12px" } }, [
    el("div", { class: "muted small", style: { textTransform: "uppercase", letterSpacing: "1px" } }, "Total deductions (all time)"),
    el("div", { style: { fontSize: "26px", fontWeight: "700" } }, money(total)),
  ]));

  const list = el("div", { class: "card", style: { marginTop: "12px" } });
  if (visible.length === 0) {
    list.appendChild(el("div", { class: "muted small" }, "No penalties recorded."));
  } else {
    for (const r of visible) {
      const reasonLabel = (PENALTY_REASONS.find(x => x.value === r.reason_code) || {}).label || r.reason_code || r.reason || "—";
      const kindLabel = r.kind_label || (PENALTY_KINDS.find(x => x.value === r.kind) || {}).label || r.kind || "—";
      const row = el("div", { class: "kv", style: { alignItems: "center" } }, [
        el("div", { class: "k" }, [
          el("div", {}, `${r.barista || "—"} · ${kindLabel} · ${r.branch || ""}`),
          el("div", { class: "muted small" }, `${fmtDate(r.at)} · by ${r.by_name || r.by || "—"} · ${reasonLabel}${r.note ? " — " + r.note : ""}`),
        ]),
        el("div", { class: "v" }, money(r.amount)),
      ]);
      if (canEnter) {
        row.appendChild(el("button", {
          class: "btn ghost",
          style: { marginLeft: "8px", color: "var(--bad)", border: "1px solid var(--bad)" },
          title: "Delete this penalty",
          onClick: () => {
            if (!confirm(`Delete penalty ${money(r.amount)} for ${r.barista}? You can undo below.`)) return;
            state.penalties = state.penalties.filter(x => x.id !== r.id);
            state.deleted_penalties.unshift({ ...r, deleted_at: now(), deleted_by: currentUser()?.name || "?" });
            state.deleted_penalties = state.deleted_penalties.slice(0, 20); // keep last 20
            saveState();
            toast(`Penalty deleted — scroll down to undo`);
            render();
          }
        }, "🗑"));
      }
      list.appendChild(row);
    }
  }
  wrap.appendChild(list);

  // ---- Deleted / trash (undo) ----
  if (state.deleted_penalties && state.deleted_penalties.length > 0) {
    const trash = el("div", { class: "card", style: { marginTop: "12px", borderColor: "var(--warn)" } });
    trash.appendChild(el("div", { class: "muted small", style: { textTransform:"uppercase", letterSpacing:"1px", color:"var(--warn)" } }, "Recently deleted (tap to restore)"));
    for (const r of state.deleted_penalties.slice(0, 10)) {
      const reasonLabel = (PENALTY_REASONS.find(x => x.value === r.reason_code) || {}).label || r.reason_code || r.reason || "—";
      const kindLabel = r.kind_label || (PENALTY_KINDS.find(x => x.value === r.kind) || {}).label || r.kind || "—";
      trash.appendChild(el("div", { class: "kv", style: { alignItems:"center" } }, [
        el("div", { class: "k" }, [
          el("div", { style: { color: "var(--ink-dim)" } }, `${r.barista || "—"} · ${kindLabel} · ${money(r.amount)}`),
          el("div", { class: "muted small" }, `Deleted ${fmtDate(r.deleted_at)} · originally ${fmtDate(r.at)}`),
        ]),
        el("button", {
          class: "btn secondary",
          style: { width: "auto" },
          onClick: () => {
            const { deleted_at, deleted_by, ...original } = r;
            state.penalties.push(original);
            state.deleted_penalties = state.deleted_penalties.filter(x => x.id !== r.id);
            saveState();
            toast(`Penalty for ${r.barista} restored ✓`);
            render();
          }
        }, "↩ Restore"),
      ]));
    }
    if (canEnter) {
      trash.appendChild(el("button", {
        class: "btn ghost",
        style: { marginTop: "8px", color: "var(--bad)" },
        onClick: () => {
          if (!confirm("Permanently clear all deleted penalties?")) return;
          state.deleted_penalties = [];
          saveState(); toast("Trash cleared"); render();
        }
      }, "🗑 Clear trash"));
    }
    wrap.appendChild(trash);
  }

  wrap.appendChild(btnBack());

  function addPenalty() {
    const staff = state.users.filter(x => (x.role === "barista" || x.role === "head_barista") && x.active);
    const staffOptions = staff.map(p => ({ label: p.name, value: p.id }));
    const kindOptions = PENALTY_KINDS.map(k => ({ label: k.label, value: k.value }));
    const reasonOptions = PENALTY_REASONS.map(r => ({ label: r.label, value: r.value }));

    openPrompt({
      title: "Record penalty",
      fields: [
        { key: "branch",  label: "Branch (maadi/zawya)", type: "text", value: u.branches[0] || "maadi" },
        { key: "user_id", label: "Barista", type: "select", options: staffOptions, value: staffOptions[0] ? staffOptions[0].value : "" },
        { key: "kind",    label: "Duration (auto-calc from salary)", type: "select", options: kindOptions, value: "half_day" },
        { key: "reason_code", label: "Reason (for the record)", type: "select", options: reasonOptions, value: "late" },
        { key: "custom_reason", label: "Reason note (optional / required for Other)", type: "text", value: "" },
        { key: "custom_amount", label: "Custom amount (only used if duration = Other)", type: "number", value: 0 },
        { key: "date",    label: "Date", type: "date", value: new Date().toISOString().slice(0,10) },
      ],
      onSubmit: (vals) => {
        const person = state.users.find(x => x.id === vals.user_id);
        if (!person) return toast("Pick a barista", "error");
        const salary = getSalaryForMonth(person.id, (vals.date||"").slice(0,7) || month);
        const kindSpec = PENALTY_KINDS.find(k => k.value === vals.kind) || PENALTY_KINDS[0];
        const reasonSpec = PENALTY_REASONS.find(r => r.value === vals.reason_code) || PENALTY_REASONS[0];

        let amount;
        if (kindSpec.value === "custom") {
          amount = Number(vals.custom_amount) || 0;
          if (amount <= 0) return toast("Enter a positive custom amount", "error");
          if (!vals.custom_reason || !vals.custom_reason.trim()) return toast("Please specify the reason note", "error");
        } else {
          if (salary <= 0) return toast(`No monthly salary set for ${person.name} — set it in Salaries first`, "error");
          amount = penaltyAmount(kindSpec.value, salary);
        }

        const s = stamp();
        state.penalties.push({
          id: uuid(),
          user_id: person.id,
          branch: String(vals.branch || "maadi").toLowerCase(),
          barista: person.name,
          kind: kindSpec.value,
          kind_label: kindSpec.label,
          amount,
          date: vals.date,
          month: (vals.date || "").slice(0,7),
          reason_code: reasonSpec.value,
          reason: reasonSpec.label,
          note: (vals.custom_reason || "").trim(),
          salary_at_time: salary,
          by: s.by, by_name: s.by_name, at: s.at,
        });
        saveState();
        toast(`Penalty ${money(amount)} — ${person.name} (${kindSpec.label})`);
        render();
      }
    });
  }
  return wrap;
};

      title: "Weekly Maadi cash deposit",
      fields: [
        { key: "amount", label: "Amount deposited (EGP)", type: "number", value: 0 },
        { key: "week_of", label: "Week of (YYYY-MM-DD)", type: "date", value: new Date().toISOString().slice(0,10) },
        { key: "date", label: "Deposit date", type: "date", value: new Date().toISOString().slice(0,10) },
        { key: "bank", label: "Bank / branch", type: "text", value: "" },
        { key: "ref", label: "Reference / slip #", type: "text", value: "" },
        { key: "note", label: "Note", type: "text", value: "" },
        { key: "proof", label: "Proof of deposit (photo)", type: "file" },
      ],
      onSubmit: async (vals) => {
        const amt = Number(vals.amount) || 0;
        if (amt <= 0) return toast("Enter a positive amount", "error");
        const s = stamp();
        let photoId = null;
        if (vals.proof && vals.proof instanceof File) {
          photoId = uuid();
          try { await IDB.put(photoId, vals.proof); } catch (e) { console.warn("proof photo save failed", e); photoId = null; }
        }
        state.maadi_deposits.push({
          id: uuid(),
          amount: amt,
          week_of: vals.week_of || "",
          date: vals.date,
          bank: vals.bank || "",
          ref: vals.ref || "",
          note: vals.note || "",
          proof_photo_id: photoId,
          by: s.by, by_name: s.by_name, at: s.at,
        });
        // Mirror the deposit in bank_ledger for owner visibility
        state.bank_ledger.push({
          id: uuid(), date: vals.date, amount: amt, supplier: `Maadi cash deposit`, type: "cash_deposit",
          by: s.by, by_name: s.by_name, at: s.at, note: `Week of ${vals.week_of || ""} · ref ${vals.ref || ""}`,
        });
        saveState(); toast("Deposit recorded"); render();
      }
    });
  }
  return wrap;
};

// ==============================================================
// MONTHLY OVERHEADS
// ---
// Recurring bills have PRESET amounts stored once in state.overhead_presets
// ({branch}|{category}) → { amount, note }. Each month we auto-materialise a
// row per recurring category, with a paid-yes/no toggle and a paid-on date.
// Marketing + Miscellaneous stay manual per Haïdi's note.
// ==============================================================
const OVERHEAD_CATEGORIES = [
  { value: "electricity",       label: "Electricity bill",   recurring: true  },
  { value: "internet",          label: "Internet bill",      recurring: true  },
  { value: "cleaner_salary",    label: "Cleaner salary",     recurring: true  },
  { value: "accountant_salary", label: "Accountant salary",  recurring: true  },
  { value: "pos_fees",          label: "POS fees",           recurring: true  },
  { value: "gardener_salary",   label: "Gardener salary",    recurring: true  },
  { value: "marketing_fees",    label: "Marketing fees",     recurring: false },
  { value: "misc",              label: "Miscellaneous (specify)", recurring: false },
];

function presetKey(branch, category) { return `${branch}|${category}`; }
function monthlyKey(branch, category, month) { return `${branch}|${category}|${month}`; }

function getSalaryForMonth(uid, month) {
  const snaps = (state.salary_snapshots || {})[uid] || {};
  const months = Object.keys(snaps).filter(m => m <= month).sort();
  if (months.length > 0) return Number(snaps[months[months.length - 1]]) || 0;
  return Number((state.salary_config[uid] || {}).monthly_salary || 0);
}

function getPresetAmtForMonth(pk, month) {
  const hist = ((state.overhead_preset_history || {})[pk] || [])
    .filter(e => e.from_month <= month)
    .sort((a, b) => a.from_month.localeCompare(b.from_month));
  if (hist.length > 0) return Number(hist[hist.length - 1].amount) || 0;
  return Number((state.overhead_presets[pk] || {}).amount || 0);
}

routes.overheads = function (u) {
  const wrap = el("div", {});
  wrap.appendChild(header("Monthly overheads", "Edit fixed amounts for both branches, then track payments month by month."));

  if (!["owner","accountant"].includes(u.role)) {
    wrap.appendChild(el("div", { class: "card" }, "Access restricted."));
    wrap.appendChild(btnBack());
    return wrap;
  }

  state.overheads              = state.overheads              || [];
  state.overhead_presets       = state.overhead_presets       || {};
  state.overhead_monthly_amts  = state.overhead_monthly_amts  || {};

  // ─── SECTION 1: Fixed default amounts — both branches, inline edit ───────
  // Kept inside draw() so that typing a new amount re-renders all inputs from
  // state and the "Total overhead" card at the bottom stays in lockstep.
  const fixedWrap = el("div", {});
  wrap.appendChild(fixedWrap);

  function drawFixedCard() {
    fixedWrap.innerHTML = "";
    const fixedCard = el("div", { class: "card", style: { marginTop: "12px" } });
    fixedCard.appendChild(el("div", { style: { display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:"10px" } }, [
      el("div", { class: "muted small", style: { textTransform:"uppercase", letterSpacing:"1px", fontWeight:"700" } }, "Fixed monthly amounts"),
      el("div", { class: "muted small" }, "Edit → press Enter or tap away to save · pushed to Google Sheet instantly"),
    ]));
    const hdr = el("div", { style: {
      display:"grid", gridTemplateColumns:"1fr 1fr 1fr",
      gap:"8px", marginBottom:"10px", fontSize:"12px", fontWeight:"700",
      textTransform:"uppercase", letterSpacing:"0.8px", color:"var(--ink-dim)"
    }});
    hdr.appendChild(el("div", {}, "Category"));
    hdr.appendChild(el("div", { style:{textAlign:"center"} }, "🏠 Maadi (EGP)"));
    hdr.appendChild(el("div", { style:{textAlign:"center"} }, "🏢 Zawya (EGP)"));
    fixedCard.appendChild(hdr);

    for (const cat of OVERHEAD_CATEGORIES.filter(c => c.recurring)) {
      const row = el("div", { style: {
        display:"grid", gridTemplateColumns:"1fr 1fr 1fr",
        gap:"8px", alignItems:"center", paddingBottom:"8px",
        borderBottom:"1px solid var(--border)", marginBottom:"8px"
      }});
      row.appendChild(el("div", { style:{fontWeight:"500", fontSize:"14px"} }, cat.label));
      for (const br of ["maadi","zawya"]) {
        const pk = presetKey(br, cat.value);
        const preset = state.overhead_presets[pk] || {};
        const inp = el("input", {
          type:"number", min:"0", step:"1",
          value: preset.amount != null ? String(preset.amount) : "",
          placeholder:"0",
          style:{ textAlign:"right", padding:"8px 10px", fontSize:"15px", fontWeight:"600" }
        });
        const doSave = () => {
          const amt = Number(inp.value) || 0;
          const s = stamp();
          const before = Number((state.overhead_presets[pk] || {}).amount || 0);
          if (amt === before) return; // no-op — avoid spurious toasts + syncs on blur
          state.overhead_presets[pk] = {
            amount: amt,
            note: (state.overhead_presets[pk] || {}).note || "",
            updated_at: s.at, updated_by: s.by_name
          };
          // Snapshot so past months are not retroactively affected
          state.overhead_preset_history = state.overhead_preset_history || {};
          state.overhead_preset_history[pk] = (state.overhead_preset_history[pk] || []).filter(e => e.from_month !== month);
          state.overhead_preset_history[pk].push({ from_month: month, amount: amt });
          // Propagate to the CURRENT month's unpaid row (if any). This is what
          // makes editing the fixed amount visibly flow into Section 2. Paid
          // rows are locked — they keep the amount the user actually paid.
          const existing = state.overheads.find(o =>
            o.branch === br && o.category === cat.value &&
            ((o.month || (o.date||"").slice(0,7)) === month));
          if (existing && !existing.paid) existing.amount = amt;
          // Also clear this month's manual override (the new preset is what
          // the user wants; the override was for a different intent).
          delete state.overhead_monthly_amts[monthlyKey(br, cat.value, month)];
          saveState({ immediate: true });
          toast(`${cat.label} · ${br === "maadi" ? "Maadi" : "Zawya"}: saved ${money(amt)}`, "ok");
          draw();
        };
        inp.addEventListener("blur", doSave);
        inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); });
        row.appendChild(inp);
      }
      fixedCard.appendChild(row);
    }
    fixedWrap.appendChild(fixedCard);
  }
  drawFixedCard();

  // ─── SECTION 2: Monthly tracking — both branches in parallel ─────────────
  let month = new Date().toISOString().slice(0,7);
  const monthInput = el("input", {
    type:"month", value:month,
    style:{ padding:"8px", borderRadius:"8px", border:"1px solid var(--border)" }
  });
  monthInput.addEventListener("change", () => { month = monthInput.value; draw(); });

  wrap.appendChild(el("div", { class:"card", style:{ display:"flex", gap:"12px", alignItems:"center", flexWrap:"wrap", marginTop:"12px" } }, [
    el("span", { class:"muted small", style:{fontWeight:"600"} }, "Month"),
    monthInput,
    el("button", { class:"btn secondary", style:{marginLeft:"auto"}, onClick:()=>addOverhead("marketing_fees","maadi") }, "➕ Maadi marketing/misc"),
    el("button", { class:"btn secondary", onClick:()=>addOverhead("marketing_fees","zawya") }, "➕ Zawya marketing/misc"),
  ]));

  const body = el("div", {});
  wrap.appendChild(body);
  draw();
  wrap.appendChild(btnBack());

  function draw() {
    // Re-render Section 1 (fixed preset inputs) so the amounts always reflect
    // the current state — critical when a pull from Sheets replaces preset values.
    drawFixedCard();
    body.innerHTML = "";
    // Two columns: Maadi | Zawya
    const twoCols = el("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"12px", marginTop:"12px" } });
    for (const br of ["maadi","zawya"]) twoCols.appendChild(drawBranchPanel(br));
    body.appendChild(twoCols);
    body.appendChild(drawSalaryCard());
    body.appendChild(drawTotalsCard());
  }

  function drawBranchPanel(br) {
    const panel = el("div", { class:"card" });
    panel.appendChild(el("div", { class:"muted small", style:{ textTransform:"uppercase", letterSpacing:"1px", marginBottom:"10px", fontWeight:"700" } },
      (br === "maadi" ? "🏠 Maadi" : "🏢 Zawya") + ` · ${month}`));

    let panelPaid = 0, panelUnpaid = 0;

    for (const cat of OVERHEAD_CATEGORIES.filter(c => c.recurring)) {
      const pk = presetKey(br, cat.value);
      const mk = monthlyKey(br, cat.value, month);
      const monthlyOverride = state.overhead_monthly_amts[mk] != null ? state.overhead_monthly_amts[mk] : null;
      const existing = state.overheads.find(o =>
        o.branch === br && o.category === cat.value &&
        ((o.month || (o.date||"").slice(0,7)) === month));
      const amount = existing ? Number(existing.amount)
                   : monthlyOverride != null ? Number(monthlyOverride)
                   : getPresetAmtForMonth(pk, month);
      const isPaid = !!(existing && existing.paid);
      const paidOn = existing ? (existing.paid_on || "") : "";

      if (isPaid) panelPaid += amount; else panelUnpaid += amount;

      const rowDiv = el("div", { style:{ borderBottom:"1px solid var(--border)", paddingBottom:"8px", marginBottom:"8px" } });
      rowDiv.appendChild(el("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center" } }, [
        el("div", { style:{ fontWeight:"500", fontSize:"13px", flex:"1" } }, cat.label),
        el("div", { style:{ fontWeight:"700", fontSize:"14px" } }, money(amount)),
      ]));
      const cbLabel = el("label", { style:{ display:"flex", alignItems:"center", gap:"6px", cursor:"pointer", fontSize:"13px", marginTop:"5px", userSelect:"none" } });
      const cb = el("input", { type:"checkbox" });
      cb.checked = isPaid;
      cb.style.cssText = "width:16px;height:16px;cursor:pointer;accent-color:var(--ok)";
      cb.addEventListener("change", () => togglePaid(br, cat, preset, existing, monthlyOverride));
      cbLabel.appendChild(cb);
      cbLabel.appendChild(document.createTextNode(isPaid ? `Paid${paidOn ? " · " + paidOn : ""}` : "Mark as paid"));
      rowDiv.appendChild(el("div", { style:{ display:"flex", gap:"4px", marginTop:"5px", flexWrap:"wrap", alignItems:"center" } }, [
        cbLabel,
        el("button", {
          class:"btn ghost",
          style:{ fontSize:"12px", padding:"4px 8px", minHeight:"30px", color:"var(--warn)" },
          title:"Override amount for this month only",
          onClick:() => editMonthlyAmount(br, cat, monthlyOverride, mk)
        }, monthlyOverride != null ? "✎ Month" : "↕ Override"),
      ]));
      panel.appendChild(rowDiv);
    }

    // Variable entries (marketing, misc)
    const varRows = state.overheads.filter(o =>
      o.branch === br &&
      ((o.month || (o.date||"").slice(0,7)) === month) &&
      !OVERHEAD_CATEGORIES.find(c => c.value === o.category && c.recurring)
    ).sort((a,b) => (b.at||"").localeCompare(a.at||""));
    if (varRows.length > 0) {
      panel.appendChild(el("div", { class:"muted small", style:{ marginBottom:"4px", fontWeight:"600" } }, "Variable"));
      for (const r of varRows) {
        const catLabel = (OVERHEAD_CATEGORIES.find(c => c.value === r.category)||{}).label || r.category;
        panel.appendChild(el("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center", fontSize:"12px", marginBottom:"4px" } }, [
          el("div", { style:{ flex:"1" } }, `${catLabel}${r.label ? " — "+r.label : ""}`),
          el("div", { style:{ fontWeight:"700", marginRight:"6px" } }, money(r.amount)),
          el("button", { class:"btn ghost", style:{ fontSize:"11px", padding:"2px 6px", minHeight:"22px" }, onClick:() => {
            if (!confirm("Delete this entry?")) return;
            state.overheads = state.overheads.filter(x => x.id !== r.id);
            saveState(); toast("Deleted"); draw();
          }}, "🗑"),
        ]));
        panelPaid += Number(r.amount)||0;
      }
    }

    // Mini totals
    panel.appendChild(el("div", { style:{ borderTop:"1px solid var(--border)", paddingTop:"6px", marginTop:"4px" } }, [
      el("div", { style:{ display:"flex", justifyContent:"space-between", fontWeight:"700", fontSize:"13px" } }, [
        el("span", {}, "Paid this month"),
        el("span", { style:{ color:"var(--ok)" } }, money(panelPaid)),
      ]),
      ...(panelUnpaid > 0 ? [el("div", { style:{ display:"flex", justifyContent:"space-between", fontSize:"12px", marginTop:"3px" } }, [
        el("span", { style:{ color:"var(--warn)" } }, "Outstanding"),
        el("span", { style:{ color:"var(--warn)", fontWeight:"600" } }, money(panelUnpaid)),
      ])] : []),
    ]));
    return panel;
  }

  function drawSalaryCard() {
    const numBranches = 2;
    const allBaristas = state.users.filter(x => x.active && (x.role === "barista" || x.role === "head_barista"));
    const totalSalary = allBaristas.reduce((s, p) => s + getSalaryForMonth(p.id, month), 0);
    const salaryShare = totalSalary > 0 ? Math.round(totalSalary / numBranches) : 0;

    const card = el("div", { class:"card", style:{ marginTop:"12px" } });
    card.appendChild(el("div", { class:"muted small", style:{ textTransform:"uppercase", letterSpacing:"1px", marginBottom:"8px", fontWeight:"700" } },
      `Staff salaries — split equally · ${numBranches} branches`));
    card.appendChild(el("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"8px", alignItems:"center" } }, [
      el("div", {}, [
        el("div", { style:{ fontWeight:"500" } }, "Total all staff"),
        el("div", { class:"muted small" }, `÷ ${numBranches} = ${money(salaryShare)} per branch`),
      ]),
      el("div", { style:{ textAlign:"center", fontWeight:"700", fontSize:"22px" } }, money(totalSalary)),
      el("div", { style:{ textAlign:"right" } }, [
        el("div", { style:{ fontWeight:"700", fontSize:"16px" } }, `🏠 ${money(salaryShare)}`),
        el("div", { style:{ fontWeight:"700", fontSize:"16px" } }, `🏢 ${money(salaryShare)}`),
      ]),
    ]));
    if (allBaristas.length > 0) {
      const detail = el("div", { class:"muted small", style:{ marginTop:"6px", fontSize:"12px" } });
      detail.textContent = allBaristas.map(p => `${p.name} ${money(getSalaryForMonth(p.id, month))}`).join(" · ");
      card.appendChild(detail);
    }
    return card;
  }

  function drawTotalsCard() {
    const numBranches = 2;
    const allBaristas = state.users.filter(x => x.active && (x.role === "barista" || x.role === "head_barista"));
    const totalSalary = allBaristas.reduce((s, p) => s + getSalaryForMonth(p.id, month), 0);
    const salaryShare = totalSalary > 0 ? Math.round(totalSalary / numBranches) : 0;

    const card = el("div", { class:"card", style:{ marginTop:"12px" } });
    card.appendChild(el("div", { class:"muted small", style:{ textTransform:"uppercase", letterSpacing:"1px", marginBottom:"8px", fontWeight:"700" } },
      `Total overhead per branch · ${month}`));

    const hdrRow = el("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"8px", fontSize:"12px", color:"var(--ink-dim)", fontWeight:"700", marginBottom:"6px" } });
    hdrRow.appendChild(el("div", {}, "Line item"));
    hdrRow.appendChild(el("div", { style:{textAlign:"right"} }, "🏠 Maadi"));
    hdrRow.appendChild(el("div", { style:{textAlign:"right"} }, "🏢 Zawya"));
    card.appendChild(hdrRow);

    // Recurring bills breakdown
    for (const cat of OVERHEAD_CATEGORIES.filter(c => c.recurring)) {
      const vals = ["maadi","zawya"].map(br => {
        const pk = presetKey(br, cat.value);
        const mk = monthlyKey(br, cat.value, month);
        const monthlyOverride = state.overhead_monthly_amts[mk] != null ? state.overhead_monthly_amts[mk] : null;
        const existing = state.overheads.find(o =>
          o.branch === br && o.category === cat.value &&
          ((o.month || (o.date||"").slice(0,7)) === month));
        return existing ? Number(existing.amount)
             : monthlyOverride != null ? Number(monthlyOverride)
             : getPresetAmtForMonth(pk, month);
      });
      card.appendChild(el("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"8px", fontSize:"13px", paddingBottom:"4px" } }, [
        el("div", {}, cat.label),
        el("div", { style:{textAlign:"right"} }, money(vals[0])),
        el("div", { style:{textAlign:"right"} }, money(vals[1])),
      ]));
    }
    // Variable
    const varMaadi = state.overheads.filter(o => o.branch==="maadi" && ((o.month||(o.date||"").slice(0,7))===month) && !OVERHEAD_CATEGORIES.find(c=>c.value===o.category&&c.recurring)).reduce((s,o)=>s+(Number(o.amount)||0),0);
    const varZawya = state.overheads.filter(o => o.branch==="zawya" && ((o.month||(o.date||"").slice(0,7))===month) && !OVERHEAD_CATEGORIES.find(c=>c.value===o.category&&c.recurring)).reduce((s,o)=>s+(Number(o.amount)||0),0);
    if (varMaadi || varZawya) {
      card.appendChild(el("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"8px", fontSize:"13px", paddingBottom:"4px" } }, [
        el("div", { style:{color:"var(--ink-dim)"} }, "Variable"),
        el("div", { style:{textAlign:"right"} }, money(varMaadi)),
        el("div", { style:{textAlign:"right"} }, money(varZawya)),
      ]));
    }
    // Salary
    card.appendChild(el("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"8px", fontSize:"13px", paddingBottom:"4px", borderTop:"1px solid var(--border)", paddingTop:"6px", marginTop:"4px" } }, [
      el("div", {}, "Staff salary share"),
      el("div", { style:{textAlign:"right"} }, money(salaryShare)),
      el("div", { style:{textAlign:"right"} }, money(salaryShare)),
    ]));
    // Grand total
    const maadiBills = ["maadi"].reduce((s, br) =>
      s + OVERHEAD_CATEGORIES.filter(c=>c.recurring).reduce((ss, cat) => {
        const mk = monthlyKey(br, cat.value, month);
        const pk = presetKey(br, cat.value);
        const ex = state.overheads.find(o=>o.branch===br&&o.category===cat.value&&((o.month||(o.date||"").slice(0,7))===month));
        const ov = state.overhead_monthly_amts[mk];
        return ss + (ex ? Number(ex.amount) : ov != null ? Number(ov) : getPresetAmtForMonth(pk, month));
      }, 0), 0);
    const zawyaBills = ["zawya"].reduce((s, br) =>
      s + OVERHEAD_CATEGORIES.filter(c=>c.recurring).reduce((ss, cat) => {
        const mk = monthlyKey(br, cat.value, month);
        const pk = presetKey(br, cat.value);
        const ex = state.overheads.find(o=>o.branch===br&&o.category===cat.value&&((o.month||(o.date||"").slice(0,7))===month));
        const ov = state.overhead_monthly_amts[mk];
        return ss + (ex ? Number(ex.amount) : ov != null ? Number(ov) : getPresetAmtForMonth(pk, month));
      }, 0), 0);
    card.appendChild(el("div", { style:{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"8px", fontSize:"14px", fontWeight:"700", borderTop:"1px solid var(--border)", paddingTop:"6px", marginTop:"4px" } }, [
      el("div", {}, "Total overhead"),
      el("div", { style:{textAlign:"right", color:"var(--ok)"} }, money(maadiBills + varMaadi + salaryShare)),
      el("div", { style:{textAlign:"right", color:"var(--ok)"} }, money(zawyaBills + varZawya + salaryShare)),
    ]));
    return card;
  }

  function editMonthlyAmount(br, cat, current, mk) {
    openPrompt({
      title: `${cat.label} (${br === "maadi" ? "Maadi" : "Zawya"}) — override for ${month}`,
      fields: [
        { key: "amount", label: `Amount for ${month} only (EGP)`, type: "number", value: current != null ? current : getPresetAmtForMonth(presetKey(br, cat.value), month) },
        { key: "clear",  label: "Clear override (use default amount)", type: "select", options: [{ label: "No — keep this amount", value: "no" }, { label: "Yes — revert to default", value: "yes" }], value: "no" },
      ],
      onSubmit: (vals) => {
        if (vals.clear === "yes") {
          delete state.overhead_monthly_amts[mk];
          saveState(); toast(`${cat.label}: reverted to default`); draw();
          return;
        }
        const amt = Number(vals.amount);
        if (amt < 0) return toast("Amount must be ≥ 0", "error");
        state.overhead_monthly_amts[mk] = amt;
        saveState(); toast(`${cat.label} (${br}): ${month} set to ${money(amt)}`); draw();
      }
    });
  }

  function togglePaid(br, cat, preset, existing, monthlyOverride) {
    if (existing && existing.paid) {
      existing.paid = false; existing.paid_on = "";
      saveState(); toast(`${cat.label}: unmarked`); draw();
      return;
    }
    const defaultAmount = existing ? Number(existing.amount)
                        : monthlyOverride != null ? Number(monthlyOverride)
                        : (preset ? Number(preset.amount) : 0);
    if (defaultAmount <= 0) {
      toast(`Set a fixed amount for ${cat.label} (${br}) first — edit the number at the top`, "error");
      return;
    }
    openPrompt({
      title: `Mark paid — ${cat.label} (${br === "maadi" ? "Maadi" : "Zawya"})`,
      fields: [
        { key: "amount",  label: "Amount paid (EGP)", type: "number", value: defaultAmount },
        { key: "paid_on", label: "Paid on (date)", type: "date", value: new Date().toISOString().slice(0,10) },
        { key: "note",    label: "Note", type: "text", value: existing?.note || preset?.note || "" },
      ],
      onSubmit: (vals) => {
        const amt = Number(vals.amount) || 0;
        if (amt <= 0) return toast("Enter a positive amount", "error");
        const s = stamp();
        if (existing) {
          existing.amount = amt;
          existing.paid = true;
          existing.paid_on = vals.paid_on;
          existing.note = vals.note || existing.note || "";
          existing.by = s.by; existing.by_name = s.by_name; existing.at = s.at;
        } else {
          state.overheads.push({
            id: uuid(),
            branch: br, category: cat.value,
            label: "",
            amount: amt,
            month,
            date: vals.paid_on,
            paid: true,
            paid_on: vals.paid_on,
            note: vals.note || "",
            by: s.by, by_name: s.by_name, at: s.at,
          });
        }
        saveState(); toast(`${cat.label} marked paid`); draw();
      }
    });
  }

  function addOverhead(defaultCat, defaultBranch) {
    const catOptions = OVERHEAD_CATEGORIES.filter(c => !c.recurring)
      .map(c => ({ label: c.label, value: c.value }));
    const branchOptions = [{ label: "🏠 Maadi", value: "maadi" }, { label: "🏢 Zawya", value: "zawya" }];
    openPrompt({
      title: "Log variable overhead",
      fields: [
        { key: "branch",   label: "Branch", type: "select", options: branchOptions, value: defaultBranch || "maadi" },
        { key: "category", label: "Category", type: "select", options: catOptions, value: defaultCat || "marketing_fees" },
        { key: "label",    label: "Describe (required for Miscellaneous)", type: "text", value: "" },
        { key: "amount",   label: "Amount (EGP)", type: "number", value: 0 },
        { key: "date",     label: "Date", type: "date", value: new Date().toISOString().slice(0,10) },
        { key: "note",     label: "Note", type: "text", value: "" },
      ],
      onSubmit: (vals) => {
        const amt = Number(vals.amount) || 0;
        if (amt <= 0) return toast("Enter a positive amount", "error");
        if (vals.category === "misc" && !(vals.label || "").trim()) {
          return toast("Please describe the miscellaneous item", "error");
        }
        const s = stamp();
        state.overheads.push({
          id: uuid(),
          branch: vals.branch, category: vals.category,
          label: (vals.label || "").trim(),
          amount: amt,
          month,
          date: vals.date,
          paid: true,
          paid_on: vals.date,
          note: vals.note || "",
          by: s.by, by_name: s.by_name, at: s.at,
        });
        saveState(); toast("Entry saved"); draw();
      }
    });
  }

  return wrap;
};
